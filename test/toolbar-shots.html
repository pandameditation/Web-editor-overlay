<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Toolbar layouts, to look at</title>
  <!--
    A page to look at, not a fixture: it sets one toolbar layout from its query string, with both
    panels open and an element selected, and reports ready, so `browser-check.mjs --shot` can
    capture it.
      ?layout=float | dock
      &theme=dark | light
    `--shot` resizes the window to 1440x900 after the page reports. The engine follows the resize
    (docked, the page is laid out again between the panels), but the floating bar keeps the place
    it chose in the smaller window, so this page centres it again on resize: staging for the
    picture, not product behaviour. The RESULTS carry the rectangles measured before that resize,
    because a screenshot is not evidence of a layout (dev-flow section 3).
  -->
  <style>
    body {
      margin: 0;
      padding: 32px 40px;
      font: 15px/1.5 system-ui, sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }
    .lead {
      margin: 0 0 24px;
      color: #475569;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .card {
      padding: 20px;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.12);
    }
    .card h2 {
      margin: 0 0 6px;
      font-size: 17px;
    }
    .card p {
      margin: 0;
      color: #64748b;
    }
    @media (max-width: 767px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Spring collection</h1>
    <p class="lead">Light layers, bright colours, and a few pieces that work all year.</p>
    <div class="cards">
      <article class="card" id="target"><h2>Linen shirt</h2><p>Breathable and easy to wear.</p></article>
      <article class="card"><h2>Canvas tote</h2><p>Roomy, with an inside pocket.</p></article>
      <article class="card"><h2>Rain jacket</h2><p>Packs into its own hood.</p></article>
    </div>
  </main>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const layout = params.get('layout') === 'dock' ? 'dock' : 'float';
      const theme = params.get('theme') === 'light' ? 'light' : 'dark';
      const frames = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const deep = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const found = deep(selector, el.shadowRoot);
          if (found) return found;
        }
        return null;
      };
      const api = window.HtmlEditorOverlay.mount({ theme, presets: false, detectScriptContent: false });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();
      api.select(document.getElementById('target'));
      engine.setDockTab('tree');
      engine.setDockTab('styles');
      engine.setLayout(layout);
      await frames();
      const bar = () => deep('heo-toolbar');
      const centreBar = () => {
        if (engine.store.value.layout === 'dock' || !bar()) return;
        engine.setToolbarPosition(Math.round((innerWidth - bar().offsetWidth) / 2), 14);
      };
      centreBar();
      addEventListener('resize', () => requestAnimationFrame(centreBar));
      await frames();
      const box = (el) => {
        const r = el?.getBoundingClientRect();
        return r ? [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)] : null;
      };
      const docks = Array.from(document.querySelector('html-editor-overlay > heo-overlay')?.shadowRoot?.querySelectorAll('heo-dock') ?? []);
      const rects = {
        html: box(document.documentElement),
        toolbar: box(bar()),
        page: box(docks.find((d) => d.getAttribute('side') === 'page')),
        selection: box(docks.find((d) => d.getAttribute('side') === 'selection')),
        target: box(document.getElementById('target')),
      };
      document.getElementById('progress').textContent = 'done';
      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify({
        ready: true, layout, theme, rects, renderWidth: engine.viewport.renderWidth,
        at: { width: innerWidth, height: innerHeight },
      }) + ':END';
    })().catch((error) => {
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify({ ready: false, error: String(error?.message ?? error) }) + ':END';
    });
  </script>
</body>
</html>
