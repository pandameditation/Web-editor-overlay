<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>The Styles panel: Cards | Applied, the condition strip, and the search</title>
  <!--
    The shared sample from styles-cascade.html: #target sits in a grid parent and has :hover, ::before
    and a ≥768px rule. #capped is a relatively positioned child of a flex row whose fixed width
    caps it, so its In its parent card has a binding cap to show and its Position card its offsets.
  -->
  <style id="site">
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      padding: 12px 16px;
      margin: 0 0 12px;
      color: #1f2937;
      background-color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-transform: none;
      text-align: left;
      opacity: 1;
      display: block;
    }

    .featured {
      border: 1px solid #a5b4fc;
    }

    .card.featured {
      background-color: #eef2ff;
    }

    .promo .card {
      color: #3730a3 !important;
    }

    section p {
      letter-spacing: 0.01em;
    }

    @media (min-width: 768px) {
      .card {
        padding: 20px 28px;
      }
    }

    .card:hover {
      background-color: #f9fafb;
    }

    .featured::before {
      content: "★";
      color: #f59e0b;
    }

    .narrow {
      display: flex;
      width: 240px;
    }

    .pinned {
      position: relative;
      top: 4px;
      flex: 1 1 auto;
      width: 600px;
    }
  </style>
</head>

<body>
  <section class="promo">
    <div class="cards">
      <p id="target" class="card featured" style="color: #b91c1c; font-size: 16px">The selected card</p>
      <p class="card">Second</p>
      <p class="card">Third</p>
    </div>
  </section>
  <div class="narrow">
    <p id="capped" class="pinned">Capped by its parent</p>
  </div>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));
      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const deep = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const found = deep(selector, el.shadowRoot);
          if (found) return found;
        }
        return null;
      };
      const text = (el) => (el?.textContent ?? '').replace(/\s+/g, ' ').trim();
      try {
        const api = window.HtmlEditorOverlay.mount({ theme: 'dark', presets: false, detectScriptContent: false });
        const engine = api.engine;
        api.setEditing(true);
        await engine.whenReady();
        const target = document.getElementById('target');
        const capped = document.getElementById('capped');
        api.select(target);
        engine.setDockTab('styles');
        await frames();
        await wait(300);
        // Re-queried every time: the panel re-renders on every store change.
        const panel = () => deep('heo-styles-panel');
        const root = () => panel().shadowRoot;
        const settle = async (ms = 0) => {
          await panel().updateComplete;
          await frames();
          if (ms) await wait(ms);
        };
        const card = (id) => root().querySelector(`.cards-view heo-section[data-card="${id}"]`);
        const allCardIds = () => Array.from(root().querySelectorAll('.cards-view heo-section[data-card]')).map((one) => one.dataset.card);
        const toggle = async (id) => {
          const one = card(id);
          one?.shadowRoot?.querySelector(one.open ? '.head' : '.tile')?.click();
          await settle();
        };
        const openCard = async (id) => {
          if (card(id) && !card(id).open) await toggle(id);
        };
        const closeCard = async (id) => {
          if (card(id)?.open) await toggle(id);
        };
        const views = () => root().querySelector('.top heo-segmented.views');
        const setView = async (value) => {
          views()?.dispatchEvent(new CustomEvent('segment-change', { detail: { value }, bubbles: true, composed: true }));
          await settle();
        };
        const fieldIn = (cardId, property) =>
          card(cardId)?.querySelector(`.row[data-property="${property}"] heo-value-field`);
        const strip = () => root().querySelector('[data-strip="panel"]');
        const pickCond = async (key) => {
          strip()?.querySelector(`[data-cond="${CSS.escape(key)}"]`)?.click();
          await settle();
        };
        const tablet = engine.elementModel(target).slots().find((one) => one.media === '(min-width: 768px)')?.key;

        /* ------------------------------------------------------------------ *
         * Cards | Applied
         * ------------------------------------------------------------------ */
        progress.textContent = 'switch: cards';
        results.switch = {};
        // Cards is where editing starts: the switch reads Cards and the grid is drawn, not the list.
        results.switch.cardsIsTheDefaultView =
          views()?.value === 'cards' && Boolean(root().querySelector('.cards-view')) && !root().querySelector('.applied');
        {
          const cats = root().querySelector('.cats[data-cards="all"]');
          const tiles = Array.from(cats?.children ?? []).slice(0, 2).map((one) => one.getBoundingClientRect());
          // Two tiles side by side, each half the row: a column of sections was the panel this replaces.
          results.switch.cardsAreATwoColumnGrid =
            getComputedStyle(cats).gridTemplateColumns.split(' ').length === 2 &&
            tiles.length === 2 && Math.abs(tiles[0].top - tiles[1].top) < 1 && tiles[1].left > tiles[0].right;
        }
        {
          /*
           * One order, set or not. Sorting the set cards first under "On this element" moved every
           * card whenever a value came or went, and a card being edited jumped to the other grid.
           */
          results.switch.cardsKeepOneFixedOrder =
            allCardIds().join(',') === 'layout,spacing,size,typography,surface,border,effects,motion,interaction,child,other' &&
            root().querySelectorAll('.cards-view .glabel').length === 0 &&
            root().querySelectorAll('.cards-view .cats').length === 1;
          const tile = (id) => card(id)?.shadowRoot?.querySelector('.tile');
          // A card says by itself whether it holds anything: filled with a count and its values, or
          // an outline reading "Empty" — the same look on every empty card.
          results.switch.setAndEmptyCardsReadApart =
            !card('spacing').hasAttribute('empty') && Boolean(tile('spacing')?.querySelector('.count')) &&
            // Its values, margin then padding; the padding depends on the window's width (≥768px).
            /^0 0 12px · (12px 16px|20px 28px)$/.test(text(tile('spacing')?.querySelector('.sum .txt'))) &&
            ['motion', 'interaction', 'size'].every((id) =>
              card(id).hasAttribute('empty') && text(tile(id)?.querySelector('.sum .txt')) === 'Empty' && !tile(id)?.querySelector('.count')) &&
            getComputedStyle(card('motion')).borderTopStyle === 'dashed' && getComputedStyle(card('spacing')).borderTopStyle === 'solid';
          const hues = allCardIds().map((id) => card(id).style.getPropertyValue('--h'));
          // Each card in its own colour, with its own picture, set or empty (the picture is how a
          // tile is recognised; its state is said by the card).
          results.switch.everyCardHasItsHueAndPicture =
            hues.every(Boolean) && new Set(hues).size === hues.length &&
            allCardIds().every((id) => card(id).querySelector(':scope > [slot="art"].pic'));
          const search = root().querySelector('.top heo-search-field').getBoundingClientRect();
          const switcher = views();
          // The view switch on a line of its own under the search, each view with its picture.
          results.switch.theViewSwitchHasItsOwnLineWithIcons =
            Boolean(switcher?.closest('.viewrow')) && switcher.getBoundingClientRect().top >= search.bottom &&
            switcher.shadowRoot.querySelectorAll('button[aria-pressed] svg').length === 2;
        }
        progress.textContent = 'switch: open in place';
        {
          const before = allCardIds();
          await openCard('spacing');
          const grid = root().querySelector('.cats[data-cards="all"]').getBoundingClientRect();
          const box = card('spacing').getBoundingClientRect();
          // Opened where it was, across both columns: not moved to the top, not a popover.
          results.switch.aCardOpensInPlaceAcrossBothColumns =
            card('spacing').open && Math.abs(box.width - grid.width) < 1 &&
            allCardIds().join(',') === before.join(',');
          const clipped = (one) => one.getAnimations().some((animation) =>
            animation.effect?.getKeyframes?.().some((frame) => frame.clipPath && frame.clipPath !== 'none'));
          const slid = (one) => one.getAnimations().some((animation) =>
            animation.effect?.getKeyframes?.().some((frame) => frame.translate && !/^0px 0px$|^0px$/.test(frame.translate)));
          // It grows out of its tile and the cards after it slide down: in a two-column grid a
          // jump read as the card vanishing and another appearing a row lower.
          results.switch.openingGrowsTheCardAndSlidesTheOthers = clipped(card('spacing')) && slid(card('size'));
          // Focus moves into the card it opened: its head, the first stop inside it.
          results.switch.openingMovesFocusIntoTheCard =
            root().activeElement === card('spacing') && card('spacing').shadowRoot.activeElement?.classList.contains('head');
          const editor = card('spacing').querySelector('heo-box-editor');
          const rows = card('spacing').querySelector('.rows');
          // The card's rich editor first, then its fixed rows: the editor is the card's way in.
          results.switch.anOpenCardShowsItsEditorAboveItsRows =
            Boolean(editor && rows) && editor.getClientRects().length > 0 &&
            Boolean(editor.compareDocumentPosition(rows) & Node.DOCUMENT_POSITION_FOLLOWING);
          await closeCard('spacing');
          // Closed, focus is back on the tile it shrank into, not lost to the document.
          results.switch.closingReturnsFocusToTheTile =
            root().activeElement === card('spacing') && card('spacing').shadowRoot.activeElement?.classList.contains('tile');
        }
        {
          /*
           * A card opened from "Not set yet" stays there while its first value is set: moving it to
           * "On this element" mid-edit drew a new card, and the dialog or list open in the old one
           * went with it (shadow-editor's text-shadow editor did). It moves once it is closed.
           */
          await openCard('interaction');
          const held = card('interaction');
          fieldIn('interaction', 'cursor')?.dispatchEvent(
            new CustomEvent('value-change', { detail: { value: 'pointer' }, bubbles: true, composed: true }));
          await settle();
          const at = allCardIds().indexOf('interaction');
          const stayed = target.style.cursor === 'pointer' && card('interaction') === held &&
            card('interaction')?.open && !card('interaction').hasAttribute('empty') && allCardIds().indexOf('interaction') === at;
          await closeCard('interaction');
          results.switch.anOpenCardStaysWhereItIsWhileItsFirstValueIsSet = stayed && allCardIds().indexOf('interaction') === at;
          engine.undo();
          await settle();
        }
        {
          const adds = Array.from(root().querySelectorAll('.cards-view .add-prop'));
          // A property is added from the search or from Other: no card grows its own "+ Add".
          results.switch.onlyOtherHasAnAddPropertyButton =
            adds.length === 1 && adds[0].closest('heo-section[data-card]')?.dataset.card === 'other';
        }
        progress.textContent = 'cards: source';
        results.cards = {};
        {
          await openCard('typography');
          const src = (property) => card('typography')?.querySelector(`.row[data-property="${property}"] [data-source]`);
          const color = src('color');
          // The value's source under its name, in the accent, and how many elements that rule
          // styles: an edit here reaches the other cards too.
          results.cards.aRowNamesItsSourceAndItsReach =
            text(color?.querySelector('.from')) === '.promo .card' && text(color?.querySelector('.uses')) === '3×' &&
            getComputedStyle(color.querySelector('.from')).textOverflow === 'ellipsis';
          // The element's own style says so, with no reach pill: it reaches only this element.
          results.cards.anInlineValueSaysInline =
            text(src('font-size')?.querySelector('.from.inline')) === 'inline' && !src('font-size')?.querySelector('.uses');
          // A row with nothing set has no source line.
          results.cards.anUnsetRowHasNoSource = !src('word-spacing') || !card('typography')?.querySelector('.row[data-property="word-spacing"]');
          await closeCard('typography');
        }
        {
          // A flex box gets a Flex card right after Layout, holding the flex rows Layout used to.
          api.select(document.querySelector('.narrow'));
          await settle(150);
          const ids = allCardIds();
          await openCard('flex');
          results.cards.aFlexBoxHasAFlexCardAfterLayout =
            ids[0] === 'layout' && ids[1] === 'flex' && !ids.includes('grid') &&
            Boolean(card('flex')?.querySelector('.row[data-property="flex-direction"]')) &&
            !card('layout')?.querySelector('.row[data-property="flex-direction"]');
          await closeCard('flex');
          api.select(target);
          await settle(150);
          results.cards.aBlockHasNoFlexCard = !card('flex') && !card('grid');
        }
        progress.textContent = 'switch: applied';
        {
          const cardsOrder = allCardIds();
          await setView('applied');
          const rows = Array.from(root().querySelectorAll('.applied .row[data-property]')).map((one) => one.dataset.property);
          const applied = engine.elementModel(target).appliedProperties();
          // Everything the element is given, each once: Applied is the place to check it all at a glance.
          results.switch.appliedListsEverySetPropertyOnce =
            new Set(rows).size === rows.length && [...rows].sort().join(',') === [...applied].sort().join(',');
          const groups = Array.from(root().querySelectorAll('.applied [data-applied]')).map((one) => one.dataset.applied);
          results.switch.appliedGroupsFollowTheCards =
            groups.length > 3 && groups.join(',') === cardsOrder.filter((id) => groups.includes(id)).join(',');
          root().querySelector('[data-applied-group="border"]')?.click();
          await settle();
          // A heading is the way to edit the group with its editor: Cards, that card open and flashed.
          results.switch.anAppliedHeadingOpensThatCardInCards =
            views()?.value === 'cards' && Boolean(card('border')?.open) && card('border').classList.contains('flash') &&
            Boolean(card('border').querySelector('heo-border-editor'));
          await closeCard('border');
        }

        /* ------------------------------------------------------------------ *
         * The condition strip
         * ------------------------------------------------------------------ */
        progress.textContent = 'strip: element';
        results.strip = {};
        // The element itself first, named as what it is (not "Always", a source card's word).
        results.strip.theStripStartsWithElement =
          /^Element\b/.test(text(strip()?.querySelector('.base'))) && strip()?.querySelector('.base')?.getAttribute('aria-pressed') === 'true';
        {
          strip()?.querySelector('.add')?.click();
          await settle(60);
          const field = root().querySelector('.menu.condpop heo-value-field');
          const groups = [...new Set((field?.suggestions ?? []).map((one) => one.group))];
          const values = (field?.suggestions ?? []).map((one) => one.value);
          // The three kinds the strip holds, captioned in its order; a pseudo-element on it is not offered twice.
          results.strip.plusOffersStatesSizesAndPseudoElements =
            groups.slice(0, 3).join(',') === 'States,Sizes,Pseudo-elements' &&
            values.includes('::after') && !values.includes('::before') && values.includes(':focus');
          root().querySelector('.menu.condpop')?.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
          await settle();
          if (root().querySelector('.menu.condpop')) {
            strip()?.querySelector('.add')?.click();
            await settle();
          }
        }
        progress.textContent = 'strip: hover';
        {
          await pickCond('state::hover');
          await openCard('surface');
          const hoverBackground = fieldIn('surface', 'background-color')?.value;
          await openCard('typography');
          // A value typed under :hover goes to the element's own class's hover rule, not inline.
          await wait(2600);
          fieldIn('typography', 'letter-spacing')?.dispatchEvent(
            new CustomEvent('value-change', { detail: { value: '0.2em' }, bubbles: true, composed: true }));
          await settle();
          const hoverRule = engine.elementModel(target).entries.find((one) =>
            one.state === ':hover' && one.declarations.some((d) => d.property === 'letter-spacing'));
          results.strip.pickingHoverReadsEveryCardUnderHover =
            hoverBackground === '#f9fafb' && root().querySelector('.ctxline')?.dataset.ctx === 'state' &&
            hoverRule?.selector === '.featured:hover' && target.style.getPropertyValue('letter-spacing') === '';
          engine.undo();
          await settle();
          await closeCard('surface');
          await closeCard('typography');
          await pickCond('state::hover');
        }
        progress.textContent = 'strip: size';
        {
          await pickCond(tablet);
          await openCard('spacing');
          // At ≥768px the Spacing card reads the rule written there, whatever the window's width.
          results.strip.pickingAMediaSizeReadsItsRule =
            Boolean(tablet) && fieldIn('spacing', 'padding')?.value === '20px 28px' &&
            root().querySelector('.ctxline')?.dataset.ctx === 'size';
          await closeCard('spacing');
          await pickCond(tablet);
          engine.setPreviewWidth(320);
          await settle(100);
          const chip = strip()?.querySelector(`[data-cond="${CSS.escape(tablet)}"]`);
          // Still on the strip (it is where a ≥768px value goes), drawn as not in effect at 320.
          results.strip.aSizeNotInEffectIsDimmed = Boolean(chip?.classList.contains('notnow'));
          engine.setPreviewWidth(null);
          await settle(100);
        }
        progress.textContent = 'strip: ::before';
        {
          await pickCond('state:::before');
          const ids = allCardIds();
          await openCard('content');
          // A ::before shows nothing without content: its Content card leads, holding the star.
          results.strip.pickingBeforeShowsTheContentCardFirst =
            ids[0] === 'content' && fieldIn('content', 'content')?.value === '"★"' &&
            root().querySelector('.ctxline')?.dataset.ctx === 'pseudo';
          await closeCard('content');
          const noParentUnderPseudo = !card('child');
          await pickCond('state:::before');
          api.select(capped);
          await settle(150);
          // A binding cap opens In its parent by itself the first time: it answers "why is my width ignored".
          results.strip.theParentCardShowsACapAndIsHiddenUnderAPseudoElement =
            noParentUnderPseudo && Boolean(card('child')?.open) && Boolean(card('child').querySelector('.capped')) &&
            Boolean(card('child').querySelector('.onparent'));
          await openCard('layout');
          const note = card('layout')?.querySelector('[data-drag-note]');
          const top = card('layout')?.querySelector('.row[data-property="top"]');
          const position = card('layout')?.querySelector('.row[data-property="position"]');
          // Position lives in Layout. The page's drag handles write these offsets: the card says so
          // between the position row and the rows they write.
          results.strip.theLayoutCardCarriesPositionAndTheDragNote =
            Boolean(note && top && position) && Boolean(note.compareDocumentPosition(top) & Node.DOCUMENT_POSITION_FOLLOWING) &&
            Boolean(position.compareDocumentPosition(note) & Node.DOCUMENT_POSITION_FOLLOWING) && !card('position');
          api.select(target);
          await settle(150);
          // A static element has no offsets to drag: no note, no offset rows.
          results.strip.theLayoutCardCarriesPositionAndTheDragNote &&=
            !card('layout')?.querySelector('[data-drag-note]') && !card('layout')?.querySelector('.row[data-property="top"]');
          await closeCard('layout');
        }
        /* ------------------------------------------------------------------ *
         * The search: it filters what is shown and adds any property
         * ------------------------------------------------------------------ */
        progress.textContent = 'search: suggestions';
        results.search = {};
        if (strip()?.querySelector('.base')?.getAttribute('aria-pressed') !== 'true') {
          strip()?.querySelector('.base')?.click();
          await settle();
        }
        const search = () => root().querySelector('.top heo-search-field');
        const typeSearch = async (value) => {
          const input = search().shadowRoot.querySelector('input');
          input.focus();
          input.value = value;
          input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
          await settle();
          await search().updateComplete;
          await frames();
        };
        const suggested = (value) => (search()?.suggestions ?? []).find((one) => one.value === value);
        const optionFor = (value) => Array.from(search()?.shadowRoot?.querySelectorAll('.popup .option') ?? [])
          .find((one) => text(one.querySelector('.name')) === value);
        const searchAdder = () => root().querySelector('.property-adder[data-adder="search"]');
        const enterIn = async (field) => {
          field?.shadowRoot?.querySelector('input')?.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, composed: true, cancelable: true }));
          await settle(150);
        };
        const typeIn = async (field, value) => {
          const input = field?.shadowRoot?.querySelector('input');
          if (!input) return;
          input.value = value;
          input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
          await settle();
        };
        const flashed = (cardId, property) =>
          Boolean(card(cardId)?.querySelector(`.row[data-property="${property}"]`)?.closest('.prow')?.classList.contains('flash'));
        {
          await typeSearch('padd');
          const list = search()?.suggestions ?? [];
          // A list under the field as soon as something is typed: what is set, and what could be added.
          results.search.typingListsSuggestions =
            list.length > 0 && list.length <= 8 && Boolean(optionFor('padding')) &&
            list.every((one) => one.value.includes('padd'));
          // Set here already: offered as a way to it, not as a second declaration.
          results.search.aSetPropertyIsOfferedAsGoTo =
            suggested('padding')?.group === 'Set on this element' && suggested('padding')?.hint === 'set · go to it';
          await typeSearch('will');
          const willChange = suggested('will-change');
          await typeSearch('curs');
          // Not set: offered to add, naming the card it will show in (Other when no card lists it).
          results.search.anUnsetPropertyIsOfferedAsAdd =
            willChange?.group === 'Add' && willChange?.hint === 'add · Other' &&
            suggested('cursor')?.group === 'Add' && suggested('cursor')?.hint === 'add · Interaction';
        }
        progress.textContent = 'search: go to';
        {
          await closeCard('spacing');
          await typeSearch('padd');
          optionFor('padding')?.click();
          await settle(60);
          // Taking a set one goes to its row: Cards, its card opened, the row flashed and its name
          // focused, the search emptied.
          results.search.goToOpensItsCardAndFlashesTheRow =
            views()?.value === 'cards' && Boolean(card('spacing')?.open) && flashed('spacing', 'padding') &&
            search()?.shadowRoot?.querySelector('input')?.value === '' &&
            root().activeElement === card('spacing')?.querySelector('.row[data-property="padding"] .dots');
          await closeCard('spacing');
        }
        progress.textContent = 'search: add';
        {
          await closeCard('other');
          await typeSearch('letter-spacing');
          search()?.shadowRoot?.querySelector('.go')?.click();
          await settle(60);
          const adder = searchAdder();
          const top = root().querySelector('.top');
          const view = root().querySelector('.cards-view');
          // The search's Add opens today's adder right under the search, seeded with the text, not
          // one at the end of Other, a scroll away from where the question was asked.
          results.search.theActionOpensTheAdderUnderTheSearch =
            Boolean(adder && top && view) &&
            Boolean(top.compareDocumentPosition(adder) & Node.DOCUMENT_POSITION_FOLLOWING) &&
            Boolean(adder.compareDocumentPosition(view) & Node.DOCUMENT_POSITION_FOLLOWING) &&
            adder.getBoundingClientRect().top >= top.getBoundingClientRect().bottom - 1 &&
            adder.querySelector('heo-value-field.name-field')?.shadowRoot?.querySelector('input')?.value === 'letter-spacing' &&
            !card('other')?.querySelector('.property-adder');
          await enterIn(searchAdder()?.querySelector('heo-value-field.name-field'));
          const valueStep = searchAdder()?.dataset.step === 'value';
          await typeIn(searchAdder()?.querySelector('heo-value-field.new-value'), '0.3em');
          await enterIn(searchAdder()?.querySelector('heo-value-field.new-value'));
          await settle(60);
          // Written, and shown where it is edited from now on: its card (Text style), opened, the row flashed.
          results.search.aCardPropertyLandsInItsCard =
            valueStep && target.style.getPropertyValue('letter-spacing') === '0.3em' && !searchAdder() &&
            Boolean(card('typography')?.open) && flashed('typography', 'letter-spacing');
          engine.undo();
          await settle();
          await closeCard('typography');
        }
        {
          await typeSearch('will-change');
          optionFor('will-change')?.click();
          await settle(60);
          // Taken from the list, the name is settled: the adder opens on its value.
          const onItsValue = searchAdder()?.dataset.step === 'value';
          await typeIn(searchAdder()?.querySelector('heo-value-field.new-value'), 'transform');
          await enterIn(searchAdder()?.querySelector('heo-value-field.new-value'));
          await settle(60);
          // No card lists will-change: it lands in Other, opened, the row flashed.
          results.search.anUnownedPropertyLandsInOther =
            onItsValue && target.style.getPropertyValue('will-change') === 'transform' && !searchAdder() &&
            Boolean(card('other')?.open) && flashed('other', 'will-change') &&
            Boolean(root().querySelector('[data-declarations="other"] .row[data-property="will-change"]'));
          engine.undo();
          await settle();
          await closeCard('other');
        }
        progress.textContent = 'search: no match';
        {
          await typeSearch('zzzznope');
          const none = (search()?.suggestions ?? []).length === 0;
          const action = search()?.getAttribute('action');
          Array.from(root().querySelectorAll('.nomatch button')).find((one) => /add zzzznope/i.test(one.textContent))?.click();
          await settle(60);
          // Nothing matches and nothing is suggested, yet the text can still be added: from the
          // field's action and from the panel's no-match answer, which opens the same adder.
          results.search.nothingMatchingStillOffersToAddIt =
            none && action === 'Add zzzznope' &&
            searchAdder()?.querySelector('heo-value-field.name-field')?.shadowRoot?.querySelector('input')?.value === 'zzzznope';
          searchAdder()?.querySelector('.cancel')?.click();
          await settle();
        }
        const failed = Object.entries(results)
          .filter(([, group]) => group && typeof group === 'object')
          .filter(([, group]) => Object.values(group).some((value) => value === false))
          .map(([name]) => name);
        document.getElementById('out').textContent =
          'RESULTS:' + JSON.stringify({ ...results, errors, failed }, null, 2) + ':END';
      } catch (e) {
        document.getElementById('out').textContent =
          'RESULTS:' + JSON.stringify({ threw: String((e && e.stack) || e), errors, failed: ['threw'] }, null, 2) + ':END';
      }
    })();
  </script>
</body>
