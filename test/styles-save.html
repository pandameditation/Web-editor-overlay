<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Where an edit is saved</title>
  <!--
    The shared sample (design §8). `.promo .card { color … !important }` beats the selected card's
    plain inline colour, which is the case every importance assertion below is about.
  -->
  <style id="site">
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      padding: 12px 16px;
      margin: 0 0 12px;
      color: #1f2937;
      background-color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-transform: none;
      text-align: left;
      opacity: 1;
      display: block;
    }

    .featured {
      border: 1px solid #a5b4fc;
    }

    .card.featured {
      background-color: #eef2ff;
    }

    .promo .card {
      color: #3730a3 !important;
    }

    section p {
      letter-spacing: 0.01em;
    }

    @media (max-width: 767px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 10px 12px;
      }
    }

    @media (min-width: 768px) {
      .card {
        padding: 20px 28px;
      }
    }

    @media print {
      .card {
        color: #000000;
      }
    }

    .card:hover {
      background-color: #f9fafb;
    }

    @media (min-width: 768px) {
      .card:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    }

    .featured:focus-within {
      outline: 2px solid #6366f1;
    }

    .featured::before {
      content: "★";
      color: #f59e0b;
    }
    /* A page rule and its phone variant, for the registry-resync pins (design §5.4 item 8). */
    @media (max-width: 767px) {
      section p {
        color: rgb(0, 0, 255);
      }
    }
  </style>
</head>

<body>
  <section class="promo">
    <div class="cards">
      <p id="target" class="card featured" style="color: #b91c1c; font-size: 16px">The selected card</p>
      <p class="card">Second</p>
      <p class="card">Third</p>
      <p class="card">Fourth</p>
    </div>
  </section>
  <p id="imp" style="color: rgb(0, 128, 0) !important">Inline and important</p>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));
      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) =>
        requestAnimationFrame(() => requestAnimationFrame(resolve)));
      /** The first style rule in the `#site` sheet with this selector, optionally inside this media. */
      const ruleFor = (selector, media = null, sheetId = 'site') => {
        const walk = (list, inside) => {
          for (const rule of Array.from(list)) {
            if (rule instanceof CSSStyleRule) {
              if (rule.selectorText === selector && inside === media) return rule;
            } else if (rule instanceof CSSMediaRule) {
              const found = walk(rule.cssRules, rule.media.mediaText);
              if (found) return found;
            }
          }
          return null;
        };
        return walk(document.getElementById(sheetId).sheet.cssRules, null);
      };
      /** One declaration out of a style attribute, as written. */
      const inlineText = (el, property) => {
        const match = new RegExp(`(?:^|;)\\s*${property}\\s*:\\s*([^;]*)`, 'i')
          .exec(el.getAttribute('style') ?? '');
        return match ? match[1].trim() : null;
      };
      try {
        const api = window.HtmlEditorOverlay.mount({
          theme: 'dark',
          presets: false,
          detectScriptContent: false,
        });
        const engine = api.engine;
        api.setEditing(true);
        await engine.whenReady();
        await frames();
        const target = document.getElementById('target');
        const imp = document.getElementById('imp');

        /* ------------------------------------------------------------------ *
         * The default edit of an element's value, and rule writes that keep importance.
         * ------------------------------------------------------------------ */
        progress.textContent = 'edit';
        // No rule declares font-weight with importance, so the default edit is a plain inline value.
        engine.overrideStyle('font-weight', '700', target);
        const weight = inlineText(target, 'font-weight');
        // `.promo .card` has `color … !important`: a plain inline colour would be ignored by the page.
        engine.overrideStyle('color', '#ff0000', target);
        const colour = inlineText(target, 'color');
        const promo = ruleFor('.promo .card');
        // F11: retyping an important rule's value used to paint it with no priority.
        engine.setRuleDeclaration(promo, 'color', '#123456');
        const promoKept =
          promo.style.getPropertyPriority('color') === 'important' &&
          promo.style.getPropertyValue('color') === 'rgb(18, 52, 86)';
        const promoRecord = engine.history.records.at(-1);
        // F10: `setProperty(p, 'v !important')` is ignored by the CSSOM, so typed importance never painted.
        const sectionP = ruleFor('section p');
        engine.setRuleDeclaration(sectionP, 'letter-spacing', '2px !important');
        results.edit = {
          defaultWritesInline: weight === '700',
          inlineGetsImportantWhenARuleHasIt: /^#ff0000\s*!important$/i.test(colour ?? ''),
          inlineOverrideActuallyRenders: getComputedStyle(target).color === 'rgb(255, 0, 0)',
          ruleEditKeepsImportance: promoKept && promoRecord?.detail?.priority === 'important',
          typedImportantPaintsOnARule:
            sectionP.style.getPropertyPriority('letter-spacing') === 'important' &&
            sectionP.style.getPropertyValue('letter-spacing') === '2px',
        };

        /* ------------------------------------------------------------------ *
         * Reset puts back what the author wrote, importance included.
         * ------------------------------------------------------------------ */
        progress.textContent = 'reset';
        // The element's own importance is kept by the edit, so the reset is the only thing that
        // could lose it: the baseline used to be read from the CSSOM, which has no `!important`.
        engine.overrideStyle('color', 'blue', imp);
        const editedImportant = /!important/.test(inlineText(imp, 'color') ?? '');
        engine.resetStyle('color', imp);
        results.reset = {
          restoresImportance:
            editedImportant &&
            /^rgb\(0,\s*128,\s*0\)\s*!important$/.test(inlineText(imp, 'color') ?? '') &&
            engine.canResetStyle(imp, 'color') === false,
        };

        /* ------------------------------------------------------------------ *
         * Rules at a size are rules of their own, in the registries, history and output.
         * ------------------------------------------------------------------ */
        progress.textContent = 'persist';
        const phoneCard = ruleFor('.card', '(max-width: 767px)');
        const tabletCard = ruleFor('.card', '(min-width: 768px)');
        const baseCard = ruleFor('.card');
        const phoneSectionP = ruleFor('section p', '(max-width: 767px)');
        const MEDIA = '(max-width: 767px)';
        const managedText = () => document.getElementById('heo-design-rules')?.textContent ?? '';
        results.persist = {};

        // Keyed by selector, editing the media rule replaced `.card`'s merged record (and
        // `section p`'s) with the media rule's declarations alone.
        const cardBefore = { ...engine.classes.get('card').declarations };
        const sectionBefore = JSON.stringify(engine.rules.get('section p').declarations);
        engine.setDeclaration({ kind: 'live', rule: tabletCard }, 'padding', '22px 30px');
        engine.setDeclaration({ kind: 'live', rule: phoneSectionP }, 'color', 'rgb(0, 0, 128)');
        const cardAfter = engine.classes.get('card');
        results.persist.mediaRuleEditLeavesTheBaseRecordAlone =
          cardAfter.declarations.color === cardBefore.color &&
          cardAfter.declarations.color !== undefined &&
          JSON.stringify(engine.rules.get('section p').declarations) === sectionBefore &&
          cardAfter.origin === 'stylesheet' &&
          engine.rules.get('section p').origin === 'stylesheet';
        // The note has to give what a fresh scan gives: the merge of every `.card` rule, where the
        // last padding (the ≥768px block, just edited) wins.
        const noted = { ...engine.classes.get('card').declarations };
        engine.classes.scanDocument();
        const scanned = engine.classes.get('card').declarations;
        const names = new Set([...Object.keys(noted), ...Object.keys(scanned)]);
        results.persist.classRecordMatchesAFreshScanAfterAMediaEdit =
          [...names].every((name) => noted[name] === scanned[name]) && noted.padding === '22px 30px';

        // H2: `.card` at every size and `.card` at ≤767px used to share the history key
        // `rule:.card:padding`, so the second edit merged into the first and one undo took both.
        const sizeBefore = engine.history.size;
        engine.setDeclaration({ kind: 'live', rule: baseCard }, 'padding', '13px 17px');
        engine.setDeclaration({ kind: 'live', rule: phoneCard }, 'padding', '9px 11px');
        const twoRecords = engine.history.records.slice(-2);
        // No folder is connected here, so there is no write plan: the change set it is built from
        // (`engine.records`) is checked instead.
        const plan = await engine.previewWritePlan();
        const planned = plan ? plan.writes.flatMap((write) => write.records) : engine.records;
        const inPlan = (record) => planned.some((one) => one.id === record.id);
        const grew = engine.history.size - sizeBefore;
        engine.undo();
        const afterUndo =
          baseCard.style.getPropertyValue('padding') === '13px 17px' &&
          phoneCard.style.getPropertyValue('padding') === '10px 12px';
        engine.redo();
        results.persist.sameSelectorAtTwoSizesIsTwoUndoEntries =
          grew === 2 &&
          twoRecords.length === 2 &&
          Boolean(twoRecords[0].detail?.rulePath) &&
          twoRecords[0].detail.rulePath !== twoRecords[1].detail?.rulePath &&
          twoRecords.every(inPlan) &&
          afterUndo;

        // A managed `section p` at ≤767px and the page's `section p` both used `rule:section p:…`.
        engine.rules.upsert({
          selector: 'section p',
          media: MEDIA,
          declarations: { 'word-spacing': '1px' },
          origin: 'user',
        });
        const pageSectionP = ruleFor('section p');
        const mergeBefore = engine.history.size;
        engine.setDeclaration({ kind: 'live', rule: pageSectionP }, 'word-spacing', '2px');
        engine.setDeclaration(
          { kind: 'design-rule', key: `@media ${MEDIA} section p` },
          'word-spacing',
          '3px',
        );
        results.persist.designRuleAndPageRuleDoNotMerge =
          engine.history.size - mergeBefore === 2 &&
          engine.history.records.at(-1)?.detail?.media === MEDIA &&
          /@media \(max-width: 767px\)\s*\{\s*section p\s*\{[^}]*word-spacing:\s*3px/.test(managedText()) &&
          pageSectionP.style.getPropertyValue('word-spacing') === '2px';

        // Editing a page media rule patches it where it is (a rule path), never a managed copy.
        engine.setDeclaration({ kind: 'live', rule: phoneCard }, 'margin', '0 0 8px');
        const marginRecord = engine.history.records.at(-1);
        results.persist.noDuplicateSelectorInFile =
          Boolean(marginRecord?.detail?.rulePath) &&
          marginRecord.detail.scope === 'stylesheet rule' &&
          !/\.card\s*\{[^}]*margin:\s*0 0 8px/.test(managedText());

        // The managed block carries the media condition into the exported page.
        engine.rules.upsert({
          selector: '.card',
          media: MEDIA,
          declarations: { 'letter-spacing': '1px' },
          origin: 'user',
        });
        const exported = engine.exportHTML();
        results.persist.mediaVariantIsExported =
          /@media \(max-width: 767px\)\s*\{\s*\.card\s*\{[^}]*letter-spacing:\s*1px/.test(exported);

        // A seed that dropped the condition would land the phone variant on every size.
        const seed = await engine.designSystemSeed();
        engine.rules.remove(`@media ${MEDIA} .card`);
        const goneBeforeImport = !engine.rules.has(`@media ${MEDIA} .card`);
        await engine.importDesignSystemText(seed, true);
        const back = engine.rules.get(`@media ${MEDIA} .card`);
        results.persist.seedCarriesMedia =
          goneBeforeImport &&
          back?.media === MEDIA &&
          back?.declarations['letter-spacing'] === '1px' &&
          engine.rules.get('.card')?.declarations?.['letter-spacing'] !== '1px';

        const failed = Object.entries(results)
          .filter(([, group]) => group && typeof group === 'object')
          .filter(([, group]) => Object.values(group).some((value) => value === false))
          .map(([name]) => name);
        document.getElementById('out').textContent =
          'RESULTS:' + JSON.stringify({ ...results, errors, failed }, null, 2) + ':END';
      } catch (e) {
        document.getElementById('out').textContent =
          'RESULTS:' +
          JSON.stringify({ threw: String((e && e.stack) || e), errors, failed: ['threw'] }, null, 2) +
          ':END';
      }
    })();
  </script>
</body>

</html>
