<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Where an edit is saved</title>
  <!--
    The shared sample (design §8). `.promo .card { color … !important }` beats the selected card's
    plain inline colour, which is the case every importance assertion below is about.
  -->
  <style id="site">
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      padding: 12px 16px;
      margin: 0 0 12px;
      color: #1f2937;
      background-color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-transform: none;
      text-align: left;
      opacity: 1;
      display: block;
    }

    .featured {
      border: 1px solid #a5b4fc;
    }

    .card.featured {
      background-color: #eef2ff;
    }

    .promo .card {
      color: #3730a3 !important;
    }

    section p {
      letter-spacing: 0.01em;
    }

    @media (max-width: 767px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 10px 12px;
      }
    }

    @media (min-width: 768px) {
      .card {
        padding: 20px 28px;
      }
    }

    @media print {
      .card {
        color: #000000;
      }
    }

    .card:hover {
      background-color: #f9fafb;
    }

    @media (min-width: 768px) {
      .card:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    }

    .featured:focus-within {
      outline: 2px solid #6366f1;
    }

    .featured::before {
      content: "★";
      color: #f59e0b;
    }
    /* A page class that looks automatic but is not the editor's, for the namer's collision pin. */
    .card-phone {
      outline-color: red;
    }
    /* An important rule of class specificity, which only an important automatic class beats. */
    .card {
      outline-style: dotted !important;
    }
    /* A page rule and its phone variant, for the registry-resync pins (design §5.4 item 8). */
    @media (max-width: 767px) {
      section p {
        color: rgb(0, 0, 255);
      }
    }
  </style>
</head>

<body>
  <section class="promo">
    <div class="cards">
      <p id="target" class="card featured" style="color: #b91c1c; font-size: 16px">The selected card</p>
      <p id="second" class="card">Second</p>
      <p id="third" class="card">Third</p>
      <p class="card">Fourth</p>
    </div>
  </section>
  <p id="imp" style="color: rgb(0, 128, 0) !important">Inline and important</p>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));
      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) =>
        requestAnimationFrame(() => requestAnimationFrame(resolve)));
      /** The first style rule in the `#site` sheet with this selector, optionally inside this media. */
      const ruleFor = (selector, media = null, sheetId = 'site') => {
        const walk = (list, inside) => {
          for (const rule of Array.from(list)) {
            if (rule instanceof CSSStyleRule) {
              if (rule.selectorText === selector && inside === media) return rule;
            } else if (rule instanceof CSSMediaRule) {
              const found = walk(rule.cssRules, rule.media.mediaText);
              if (found) return found;
            }
          }
          return null;
        };
        return walk(document.getElementById(sheetId).sheet.cssRules, null);
      };
      /** One declaration out of a style attribute, as written. */
      const inlineText = (el, property) => {
        const match = new RegExp(`(?:^|;)\\s*${property}\\s*:\\s*([^;]*)`, 'i')
          .exec(el.getAttribute('style') ?? '');
        return match ? match[1].trim() : null;
      };
      try {
        const api = window.HtmlEditorOverlay.mount({
          theme: 'dark',
          presets: false,
          detectScriptContent: false,
        });
        const engine = api.engine;
        api.setEditing(true);
        await engine.whenReady();
        await frames();
        const target = document.getElementById('target');
        const imp = document.getElementById('imp');

        /* ------------------------------------------------------------------ *
         * The default edit of an element's value, and rule writes that keep importance.
         * ------------------------------------------------------------------ */
        progress.textContent = 'edit';
        // No rule declares font-weight with importance, so the default edit is a plain inline value.
        engine.overrideStyle('font-weight', '700', target);
        const weight = inlineText(target, 'font-weight');
        // `.promo .card` has `color … !important`: a plain inline colour would be ignored by the page.
        engine.overrideStyle('color', '#ff0000', target);
        const colour = inlineText(target, 'color');
        const promo = ruleFor('.promo .card');
        // F11: retyping an important rule's value used to paint it with no priority.
        engine.setRuleDeclaration(promo, 'color', '#123456');
        const promoKept =
          promo.style.getPropertyPriority('color') === 'important' &&
          promo.style.getPropertyValue('color') === 'rgb(18, 52, 86)';
        const promoRecord = engine.history.records.at(-1);
        // F10: `setProperty(p, 'v !important')` is ignored by the CSSOM, so typed importance never painted.
        const sectionP = ruleFor('section p');
        engine.setRuleDeclaration(sectionP, 'letter-spacing', '2px !important');
        results.edit = {
          defaultWritesInline: weight === '700',
          inlineGetsImportantWhenARuleHasIt: /^#ff0000\s*!important$/i.test(colour ?? ''),
          inlineOverrideActuallyRenders: getComputedStyle(target).color === 'rgb(255, 0, 0)',
          ruleEditKeepsImportance: promoKept && promoRecord?.detail?.priority === 'important',
          typedImportantPaintsOnARule:
            sectionP.style.getPropertyPriority('letter-spacing') === 'important' &&
            sectionP.style.getPropertyValue('letter-spacing') === '2px',
        };

        /* ------------------------------------------------------------------ *
         * Reset puts back what the author wrote, importance included.
         * ------------------------------------------------------------------ */
        progress.textContent = 'reset';
        // The element's own importance is kept by the edit, so the reset is the only thing that
        // could lose it: the baseline used to be read from the CSSOM, which has no `!important`.
        engine.overrideStyle('color', 'blue', imp);
        const editedImportant = /!important/.test(inlineText(imp, 'color') ?? '');
        engine.resetStyle('color', imp);
        results.reset = {
          restoresImportance:
            editedImportant &&
            /^rgb\(0,\s*128,\s*0\)\s*!important$/.test(inlineText(imp, 'color') ?? '') &&
            engine.canResetStyle(imp, 'color') === false,
        };

        /* ------------------------------------------------------------------ *
         * Rules at a size are rules of their own, in the registries, history and output.
         * ------------------------------------------------------------------ */
        progress.textContent = 'persist';
        const phoneCard = ruleFor('.card', '(max-width: 767px)');
        const tabletCard = ruleFor('.card', '(min-width: 768px)');
        const baseCard = ruleFor('.card');
        const phoneSectionP = ruleFor('section p', '(max-width: 767px)');
        const MEDIA = '(max-width: 767px)';
        const managedText = () => document.getElementById('heo-design-rules')?.textContent ?? '';
        results.persist = {};

        // Keyed by selector, editing the media rule replaced `.card`'s merged record (and
        // `section p`'s) with the media rule's declarations alone.
        const cardBefore = { ...engine.classes.get('card').declarations };
        const sectionBefore = JSON.stringify(engine.rules.get('section p').declarations);
        engine.setDeclaration({ kind: 'live', rule: tabletCard }, 'padding', '22px 30px');
        engine.setDeclaration({ kind: 'live', rule: phoneSectionP }, 'color', 'rgb(0, 0, 128)');
        const cardAfter = engine.classes.get('card');
        results.persist.mediaRuleEditLeavesTheBaseRecordAlone =
          cardAfter.declarations.color === cardBefore.color &&
          cardAfter.declarations.color !== undefined &&
          JSON.stringify(engine.rules.get('section p').declarations) === sectionBefore &&
          cardAfter.origin === 'stylesheet' &&
          engine.rules.get('section p').origin === 'stylesheet';
        // The note has to give what a fresh scan gives: the merge of every `.card` rule, where the
        // last padding (the ≥768px block, just edited) wins.
        const noted = { ...engine.classes.get('card').declarations };
        engine.classes.scanDocument();
        const scanned = engine.classes.get('card').declarations;
        const names = new Set([...Object.keys(noted), ...Object.keys(scanned)]);
        results.persist.classRecordMatchesAFreshScanAfterAMediaEdit =
          [...names].every((name) => noted[name] === scanned[name]) && noted.padding === '22px 30px';

        // H2: `.card` at every size and `.card` at ≤767px used to share the history key
        // `rule:.card:padding`, so the second edit merged into the first and one undo took both.
        const sizeBefore = engine.history.size;
        engine.setDeclaration({ kind: 'live', rule: baseCard }, 'padding', '13px 17px');
        engine.setDeclaration({ kind: 'live', rule: phoneCard }, 'padding', '9px 11px');
        const twoRecords = engine.history.records.slice(-2);
        // No folder is connected here, so there is no write plan: the change set it is built from
        // (`engine.records`) is checked instead.
        const plan = await engine.previewWritePlan();
        const planned = plan ? plan.writes.flatMap((write) => write.records) : engine.records;
        const inPlan = (record) => planned.some((one) => one.id === record.id);
        const grew = engine.history.size - sizeBefore;
        engine.undo();
        const afterUndo =
          baseCard.style.getPropertyValue('padding') === '13px 17px' &&
          phoneCard.style.getPropertyValue('padding') === '10px 12px';
        engine.redo();
        results.persist.sameSelectorAtTwoSizesIsTwoUndoEntries =
          grew === 2 &&
          twoRecords.length === 2 &&
          Boolean(twoRecords[0].detail?.rulePath) &&
          twoRecords[0].detail.rulePath !== twoRecords[1].detail?.rulePath &&
          twoRecords.every(inPlan) &&
          afterUndo;

        // A managed `section p` at ≤767px and the page's `section p` both used `rule:section p:…`.
        engine.rules.upsert({
          selector: 'section p',
          media: MEDIA,
          declarations: { 'word-spacing': '1px' },
          origin: 'user',
        });
        const pageSectionP = ruleFor('section p');
        const mergeBefore = engine.history.size;
        engine.setDeclaration({ kind: 'live', rule: pageSectionP }, 'word-spacing', '2px');
        engine.setDeclaration(
          { kind: 'design-rule', key: `@media ${MEDIA} section p` },
          'word-spacing',
          '3px',
        );
        results.persist.designRuleAndPageRuleDoNotMerge =
          engine.history.size - mergeBefore === 2 &&
          engine.history.records.at(-1)?.detail?.media === MEDIA &&
          /@media \(max-width: 767px\)\s*\{\s*section p\s*\{[^}]*word-spacing:\s*3px/.test(managedText()) &&
          pageSectionP.style.getPropertyValue('word-spacing') === '2px';

        // Editing a page media rule patches it where it is (a rule path), never a managed copy.
        engine.setDeclaration({ kind: 'live', rule: phoneCard }, 'margin', '0 0 8px');
        const marginRecord = engine.history.records.at(-1);
        results.persist.noDuplicateSelectorInFile =
          Boolean(marginRecord?.detail?.rulePath) &&
          marginRecord.detail.scope === 'stylesheet rule' &&
          !/\.card\s*\{[^}]*margin:\s*0 0 8px/.test(managedText());

        // The managed block carries the media condition into the exported page.
        engine.rules.upsert({
          selector: '.card',
          media: MEDIA,
          declarations: { 'letter-spacing': '1px' },
          origin: 'user',
        });
        const exported = engine.exportHTML();
        results.persist.mediaVariantIsExported =
          /@media \(max-width: 767px\)\s*\{\s*\.card\s*\{[^}]*letter-spacing:\s*1px/.test(exported);

        // A seed that dropped the condition would land the phone variant on every size.
        const seed = await engine.designSystemSeed();
        engine.rules.remove(`@media ${MEDIA} .card`);
        const goneBeforeImport = !engine.rules.has(`@media ${MEDIA} .card`);
        // Without overwrite: an overwriting import takes every page rule and class over as the
        // editor's, which would leave later groups measuring re-emitted copies.
        await engine.importDesignSystemText(seed, false);
        const back = engine.rules.get(`@media ${MEDIA} .card`);
        results.persist.seedCarriesMedia =
          goneBeforeImport &&
          back?.media === MEDIA &&
          back?.declarations['letter-spacing'] === '1px' &&
          engine.rules.get('.card')?.declarations?.['letter-spacing'] !== '1px';

        /* ------------------------------------------------------------------ *
         * Writing where a destination says: automatic classes, and shared rules never promoted.
         * ------------------------------------------------------------------ */
        progress.textContent = 'destinations';
        const third = document.getElementById('third');
        const secondCard = document.getElementById('second');
        const TABLET = '(min-width: 768px)';
        results.options = {};

        // "New class" at a size: an automatic class on this element, named after its own class.
        engine.setPreviewWidth(768);
        // Read at the width the writes below are made at.
        const secondPadding = getComputedStyle(secondCard).padding;
        engine.writeDeclarationTo({ kind: 'auto-class', element: third, media: TABLET, state: '' }, 'padding', '14px 18px');
        results.options.automaticClassIsAddedAndNamed =
          third.classList.contains('card-tablet') &&
          engine.isAutomaticClass('card-tablet', third) &&
          /@media \(min-width: 768px\)\s*\{\s*\.card-tablet\s*\{[^}]*padding:\s*14px 18px/.test(managedText()) &&
          getComputedStyle(third).padding === '14px 18px';
        // A second write at the same size goes into the same class.
        engine.writeDeclarationTo({ kind: 'auto-class', element: third, media: TABLET, state: '' }, 'margin', '0 0 20px');
        results.options.automaticClassReusedForTheSameSize =
          !Array.from(third.classList).some((one) => /^card-tablet-\d+$/.test(one)) &&
          /\.card-tablet\s*\{[^}]*padding:\s*14px 18px;[^}]*margin:\s*0 0 20px/.test(managedText());
        // Neither the automatic class nor an inline write reaches another card.
        engine.writeDeclarationTo({ kind: 'target', target: { kind: 'inline', element: third } }, 'word-spacing', '6px');
        results.options.otherElementsUnchangedBySoloOrInline =
          getComputedStyle(secondCard).padding === secondPadding &&
          !secondCard.classList.contains('card-tablet') &&
          !secondCard.hasAttribute('style');
        // A shared rule is never made important on the user's behalf: written plain, it may lose.
        engine.setPreviewWidth(320);
        engine.writeDeclarationTo({ kind: 'target', target: { kind: 'class', name: 'card' } }, 'color', 'rgb(1, 1, 1)');
        results.edit.neverPromotesASharedRule =
          engine.classes.get('card')?.declarations.color === 'rgb(1, 1, 1)' &&
          getComputedStyle(third).color !== 'rgb(1, 1, 1)';
        engine.undo();

        /* ---- the automatic class persists, and undoes as one ---- */
        const exportedPage = engine.exportHTML();
        results.persist.automaticClassIsExported =
          /class="card card-tablet"/.test(exportedPage) &&
          /\.card-tablet\s*\{[^}]*padding:\s*14px 18px/.test(exportedPage);
        engine.setPreviewWidth(1440);
        const DESKTOP = '(min-width: 1440px)';
        const classesBeforeDesktop = Array.from(third.classList);
        engine.writeDeclarationTo({ kind: 'auto-class', element: third, media: DESKTOP, state: '' }, 'letter-spacing', '2px');
        const desktopName = Array.from(third.classList).find((one) => !classesBeforeDesktop.includes(one));
        const desktopKey = `@media ${DESKTOP} .${desktopName}`;
        const savedBoth = Boolean(desktopName) && engine.rules.has(desktopKey);
        engine.undo();
        results.persist.undoRemovesClassAndRule =
          savedBoth && !third.classList.contains(desktopName) && !engine.rules.has(desktopKey);
        engine.redo();
        results.persist.redoRestoresBoth =
          third.classList.contains(desktopName) && engine.rules.has(desktopKey);
        engine.setPreviewWidth(null);

        /* ------------------------------------------------------------------ *
         * The panel: one edit path, where its value is written now, everywhere.
         * ------------------------------------------------------------------ */
        progress.textContent = 'panel';
        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
        const deep = (selector, root = document) => {
          const direct = root.querySelector?.(selector);
          if (direct) return direct;
          for (const el of root.querySelectorAll?.('*') ?? []) {
            if (!el.shadowRoot) continue;
            const found = deep(selector, el.shadowRoot);
            if (found) return found;
          }
          return null;
        };
        results.context = { innerWidth, actualIsBelow768: innerWidth < 768 };
        const second = document.getElementById('second');
        api.select(second);
        engine.setDockTab('styles');
        await frames();
        await wait(250);
        const panel = () => deep('heo-styles-panel');
        const root = () => panel().shadowRoot;
        const settle = async () => {
          await panel().updateComplete;
          await frames();
        };
        const rowIn = (list, property) =>
          root().querySelector(`[data-declarations="${list}"] .row[data-property="${property}"]`);
        const fieldIn = (list, property) => rowIn(list, property)?.querySelector('heo-value-field');
        // No question is asked after Enter anywhere any more: no save box is ever drawn.
        const anyBox = () => root().querySelector('.savebox');
        const send = async (el, type, value) => {
          el?.dispatchEvent(new CustomEvent(type, { detail: { value }, bubbles: true, composed: true }));
          await settle();
        };
        const key = async (el, name) => {
          el?.dispatchEvent(new KeyboardEvent('keydown', { key: name, bubbles: true, composed: true, cancelable: true }));
          await settle();
        };
        const hoverRule = ruleFor('.card:hover');

        /* ---- edit: each surface writes where its row says ---- */
        let size = engine.history.size;
        // States are picked on the conditions bar, then their rows edit the state's own rule.
        root().querySelector('[data-strip="effective"] [data-cond="state::hover"]')?.click();
        await settle();
        await send(fieldIn('state-:hover', 'background-color'), 'value-change', '#abcdef');
        results.edit.stateRowWritesTheStateRule =
          hoverRule.style.getPropertyValue('background-color') === 'rgb(171, 205, 239)' &&
          !second.hasAttribute('style') && engine.history.size === size + 1;
        results.ask = { neverForStateRows: !anyBox() };
        engine.undo();
        await settle();
        // A picked condition shows only its own rows: back to Always for the rest.
        root().querySelector('[data-strip="effective"] .base')?.click();
        await settle();
        results.edit.aPickedStateShowsOnlyItsRows = Boolean(rowIn('effective', 'background-color'));

        rowIn('effective', 'background-color')?.querySelector('.dots')?.click();
        await settle();
        const baseLine = Array.from(root().querySelectorAll('.pop .c-line'))
          .find((line) => line.querySelector('.src')?.textContent.trim().startsWith('.card'));
        await send(baseLine?.querySelector('heo-value-field'), 'value-change', '#fafafa');
        results.edit.popoverEditWritesDirectly =
          baseCard.style.getPropertyValue('background-color') === 'rgb(250, 250, 250)' &&
          !second.hasAttribute('style') && !anyBox();
        engine.undo();
        root().querySelector('.pop')?.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true }));
        await settle();

        /*
         * A card row writes the declaration it shows, straight into its rule: no "where should this
         * stay" box, even for a base rule a media rule overrides at some widths, and nothing inline.
         */
        // The card, opened from its chip in the header.
        root().querySelector('.ident .cchip[data-class="card"] .name')?.click();
        await settle();
        size = engine.history.size;
        const cardRow = Array.from(root().querySelectorAll('.cardpop .cls[data-card=".card"] .block[data-block="base"] .decl'))
          .find((row) => row.querySelector('.p')?.textContent.trim() === 'padding');
        await send(cardRow?.querySelector('heo-value-field'), 'value-change', '13px 17px');
        results.edit.cardEditWritesDirectly =
          baseCard.style.getPropertyValue('padding') === '13px 17px' &&
          !second.hasAttribute('style') && !/padding/.test(target.getAttribute('style') ?? '') &&
          !anyBox() && engine.history.size === size + 1;
        engine.undo();
        root().querySelector('.ident .cchip[data-class="card"] .name')?.click();
        await settle();
        // Every section's row edits where its value is written now, like Effective styles: the
        // colour comes from `.promo .card`, so that is what an edit changes, with no question asked.
        await send(fieldIn('typography', 'color'), 'value-change', 'rgb(9, 9, 9)');
        results.edit.categorySectionsUseTheSamePath =
          ruleFor('.promo .card')?.style.getPropertyValue('color') === 'rgb(9, 9, 9)' &&
          !inlineText(second, 'color') && !anyBox();
        engine.undo();
        await settle();
        // Their trash removes the declaration shown, asking first when other elements wear it.
        rowIn('typography', 'color')?.querySelector('.reset')?.click();
        await settle();
        const asked = Boolean(deep('heo-confirm-dialog'));
        engine.cancelConfirm();
        await settle();
        results.edit.sectionTrashAsksForASharedRule =
          asked && ruleFor('.promo .card')?.style.getPropertyValue('color') !== '';

        // A pick from the value list (⌄) is a commit like typing.
        const weightField = fieldIn('typography', 'font-weight');
        weightField.shadowRoot.querySelector('[aria-label="Show tokens and values"]')?.click();
        await weightField.updateComplete;
        await frames();
        const option = Array.from(weightField.shadowRoot.querySelectorAll('.popup [role="option"]'))
          .find((one) => /^\s*(?:bold|700)\b/.test(one.textContent));
        option?.click();
        await settle();
        results.edit.valueListPickUsesTheSamePath =
          Boolean(option) && /^(?:bold|700)$/.test(baseCard.style.getPropertyValue('font-weight')) && !inlineText(second, 'font-weight');
        engine.undo();
        await settle();
        // The switch in that list sends it elsewhere instead: inline, this element only.
        const surfaceField = () => fieldIn('surface', 'background-color');
        surfaceField()?.focusInput();
        surfaceField()?.openList();
        await settle();
        const surfaceSwitch = surfaceField()?.shadowRoot?.querySelector('.list-head heo-segmented');
        const startsOnTheRule = surfaceSwitch?.value === 'target:.card';
        Array.from(surfaceSwitch?.shadowRoot?.querySelectorAll('button') ?? []).find((one) => one.textContent.trim() === 'Inline')?.click();
        await settle();
        await send(surfaceField(), 'value-change', 'rgb(2, 2, 2)');
        results.edit.theSwitchSendsItInline =
          startsOnTheRule && inlineText(second, 'background-color') === 'rgb(2, 2, 2)' && !anyBox();
        engine.undo();
        await settle();

        /* ---- Spacing: its row and its box editor write where each value is written now ---- */
        const phonePadBefore = phoneCard.style.getPropertyValue('padding');
        const winnerRule = innerWidth < 768 ? phoneCard : tabletCard;
        const winnerPadBefore = winnerRule.style.getPropertyValue('padding');
        await send(fieldIn('spacing', 'padding'), 'value-change', '5px 6px');
        results.box = {
          aMediaRuleWinnerIsEditedInPlace:
            winnerRule.style.getPropertyValue('padding') === '5px 6px' && !inlineText(second, 'padding') && !anyBox(),
        };
        engine.undo();
        await settle();
        const boxEditor = () => root().querySelector('heo-box-editor');
        size = engine.history.size;
        boxEditor()?.dispatchEvent(new CustomEvent('box-change', {
          detail: { declarations: { 'padding-top': '3px', 'padding-bottom': '4px' } }, bubbles: true, composed: true,
        }));
        await settle();
        results.box.theBoxEditorWritesEachSideWhereItIsWritten =
          winnerRule.style.getPropertyValue('padding-top') === '3px' &&
          winnerRule.style.getPropertyValue('padding-bottom') === '4px' &&
          !inlineText(second, 'padding-top') && engine.history.size === size + 1 && !anyBox();
        engine.undo();
        await settle();
        results.box.oneUndoTakesTheBatchBack =
          winnerRule.style.getPropertyValue('padding') === winnerPadBefore && phoneCard.style.getPropertyValue('padding') === phonePadBefore;
        // A side's own editor carries the same switch in its value list.
        boxEditor()?.shadowRoot?.querySelector('input[aria-label="padding left"]')?.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, composed: true }));
        await settle();
        await wait(60);
        const sideField = boxEditor()?.shadowRoot?.querySelector('.editor heo-value-field');
        sideField?.openList();
        await settle();
        results.box.aSideEditorHasTheSwitch = Boolean(sideField?.shadowRoot?.querySelector('.list-head heo-segmented'));
        sideField?.closePopup();
        // `#imp` has no rule for its margin at any size, so the same commit goes inline.
        api.select(imp);
        await frames();
        await wait(150);
        boxEditor()?.dispatchEvent(new CustomEvent('box-change', {
          detail: { declarations: { 'margin-left': '4px' } }, bubbles: true, composed: true,
        }));
        await settle();
        results.box.nothingWritesItSoItGoesInline = inlineText(imp, 'margin-left') === '4px';
        engine.undo();
        await settle();
        api.select(second);
        await settle();

        const failed = Object.entries(results)
          .filter(([, group]) => group && typeof group === 'object')
          .filter(([, group]) => Object.values(group).some((value) => value === false))
          .map(([name]) => name);
        document.getElementById('out').textContent =
          'RESULTS:' + JSON.stringify({ ...results, errors, failed }, null, 2) + ':END';
      } catch (e) {
        document.getElementById('out').textContent =
          'RESULTS:' +
          JSON.stringify({ threw: String((e && e.stack) || e), errors, failed: ['threw'] }, null, 2) +
          ':END';
      }
    })();
  </script>
</body>

</html>
