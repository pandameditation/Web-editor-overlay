<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Choosing an owner for pasted CSS</title>
  <style id="fixture-sheet">
    #target {
      color: #123456;
      margin: 1px;
    }

    @media (min-width: 1px) {
      #conditional {
        padding: 2px;
      }
    }
  </style>
</head>

<body>
  <article id="target">The selected element</article>
  <span id="rule-target">The rule target</span>
  <div id="conditional">The conditional target</div>
  <input id="native-input" value="native text">

  <pre id="progress">start</pre>
  <pre id="out">pending</pre>

  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));

      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) =>
        requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const check = (name, fn) => {
        progress.textContent = name;
        try {
          results[name] = fn();
        } catch (error) {
          results[name] = {
            ok: false,
            error: 'THREW: ' + (error && error.message ? error.message : String(error)),
          };
        }
      };

      function deepQuery(selector, root = document) {
        const found = root.querySelector?.(selector);
        if (found) return found;
        for (const element of root.querySelectorAll?.('*') ?? []) {
          if (!element.shadowRoot) continue;
          const hit = deepQuery(selector, element.shadowRoot);
          if (hit) return hit;
        }
        return null;
      }

      const dialogRoot = () => deepQuery('heo-css-paste-dialog')?.shadowRoot ?? null;
      const sourceText = () => dialogRoot()?.querySelector('.source')?.textContent
        ?.replace(/\s+/g, ' ')
        .trim() ?? '';
      const deepActive = () => {
        let active = document.activeElement;
        while (active?.shadowRoot?.activeElement) active = active.shadowRoot.activeElement;
        return active;
      };
      const insideComposed = (root, node) => {
        let current = node;
        while (current) {
          if (current === root) return true;
          current = current.parentNode;
          if (current instanceof ShadowRoot) current = current.host;
        }
        return false;
      };
      const pasteText = (target, text) => {
        const clipboard = new DataTransfer();
        clipboard.setData('text/plain', text);
        return target.dispatchEvent(new ClipboardEvent('paste', {
          bubbles: true,
          cancelable: true,
          composed: true,
          clipboardData: clipboard,
        }));
      };

      async function openPaste(options, draft) {
        engine.beginCssPaste(options);
        await frames();
        engine.updateCssPaste({ draft, error: '' });
        await frames();
      }

      async function applyPaste() {
        const root = dialogRoot();
        const button = Array.from(root?.querySelectorAll('footer .btn') ?? [])
          .find((element) => /Apply CSS|Use this CSS/.test(element.textContent ?? ''));
        if (!button) throw new Error('the CSS paste dialog has no apply button');
        button.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
        await frames();
        await frames();
      }

      const api = window.HtmlEditorOverlay.mount({
        theme: 'dark',
        detectScriptContent: false,
        fileName: 'css-paste.html',
      });
      const engine = api.engine;
      const target = document.getElementById('target');
      const ruleTarget = document.getElementById('rule-target');
      api.setEditing(true);
      api.select(target);
      await engine.whenReady();
      await frames();

      /* ------------------------------------------------------------------ *
       * The dialog owns parsing. The first assertion is deliberately made
       * before applying anything, so a destination can never hide a parser
       * regression by making the final page happen to look right.
       * ------------------------------------------------------------------ */
      const fullClassRule = `.module-border-wrap {
  max-width: 250px;
  padding: 1rem;
  position: relative;
  background: linear-gradient(to right, red, purple);
  padding: 3px;
}`;
      await openPaste({ context: 'inline', element: target }, fullClassRule);
      check('aCompleteClassRuleIsRecognizedBeforeItIsApplied', () => {
        const source = sourceText();
        const pill = dialogRoot()?.querySelector('.pill')?.textContent?.trim() ?? '';
        const suggestion = dialogRoot()?.querySelector('.source button')?.textContent
          ?.replace(/\s+/g, ' ')
          .trim() ?? '';
        return {
          ok: /Found 1 rule with 4 declarations/.test(source) &&
            pill === '.module-border-wrap' &&
            /Use module-border-wrap as a destination/.test(suggestion),
          source,
          pill,
          suggestion,
        };
      });
      dialogRoot()?.querySelector('.source button')?.dispatchEvent(
        new MouseEvent('click', { bubbles: true, composed: true }),
      );
      await frames();
      check('theRuleSuggestionChoosesTheClassDestination', () => ({
        ok: engine.store.value.cssPaste?.destination === 'class' &&
          engine.store.value.cssPaste?.className === 'module-border-wrap',
        destination: engine.store.value.cssPaste?.destination ?? null,
        className: engine.store.value.cssPaste?.className ?? null,
      }));
      engine.updateCssPaste({ applyClass: true });
      await frames();
      await applyPaste();

      check('theClassRuleCreatesAndAppliesItsReusableOwner', () => {
        const entry = engine.classes.get('module-border-wrap');
        return {
          ok: Boolean(entry) &&
            entry.declarations['max-width'] === '250px' &&
            entry.declarations.padding === '3px' &&
            entry.declarations.position === 'relative' &&
            entry.declarations.background === 'linear-gradient(to right, red, purple)' &&
            target.classList.contains('module-border-wrap'),
          declarations: entry?.declarations ?? null,
          appliedToElement: target.classList.contains('module-border-wrap'),
        };
      });

      const declarationList = `padding: 2rem;
color: rebeccapurple;`;
      await openPaste({
        context: 'class',
        element: target,
        className: 'module-border-wrap',
      }, declarationList);
      check('aDeclarationListIsRecognizedWithoutInventingASelector', () => {
        const source = sourceText();
        return {
          ok: /Found 2 declarations/.test(source) &&
            !dialogRoot()?.querySelector('.pill'),
          source,
        };
      });
      await applyPaste();

      check('repeatedClassPastesKeepEveryPropertyRecord', () => {
        const records = engine.records.filter((record) =>
          record.detail?.source === 'css-paste' && record.detail?.class === 'module-border-wrap');
        return {
          ok: records.some((record) => record.detail?.property === 'max-width') &&
            records.some((record) => record.detail?.property === 'padding'),
          properties: records.map((record) => record.detail?.property),
        };
      });

      const afterClassUpsert = engine.classes.get('module-border-wrap');
      const expectedAfterClassUpsert = { ...afterClassUpsert.declarations };
      engine.undo();
      await frames();
      check('oneUndoRemovesTheWholeClassPaste', () => {
        const entry = engine.classes.get('module-border-wrap');
        return {
          ok: entry?.declarations.padding === '3px' &&
            entry?.declarations.color === undefined &&
            target.classList.contains('module-border-wrap'),
          declarationsAfterUndo: entry?.declarations ?? null,
          classStillApplied: target.classList.contains('module-border-wrap'),
        };
      });
      engine.redo();
      await frames();
      check('oneRedoRestoresEveryDeclarationFromThatPaste', () => {
        const entry = engine.classes.get('module-border-wrap');
        return {
          ok: entry?.declarations.padding === expectedAfterClassUpsert.padding &&
            entry?.declarations.color === expectedAfterClassUpsert.color &&
            target.classList.contains('module-border-wrap'),
          declarationsAfterRedo: entry?.declarations ?? null,
        };
      });

      const classless = document.getElementById('conditional');
      await openPaste({
        context: 'class',
        element: classless,
        className: 'temporary-paste',
      }, 'color: teal;');
      await applyPaste();
      engine.undo();
      await frames();
      check('undoRestoresAnAbsentClassAttributeExactly', () => ({
        ok: classless.getAttribute('class') === null &&
          engine.classes.get('temporary-paste') === undefined,
        classAttribute: classless.getAttribute('class'),
      }));

      /* ------------------------------------------------------------------ *
       * Inline is explicit, not a side effect of pasting a class-shaped rule.
       * ------------------------------------------------------------------ */
      engine.setStyle('opacity', '0.5', target);
      await openPaste({ context: 'inline', element: target },
        'outline: 2px solid black; line-height: 1.4; opacity: 0.8;');
      await applyPaste();
      check('theInlineDestinationWritesOnlyTheSelectedElement', () => {
        const styleText = target.getAttribute('style') ?? '';
        const lineHeight = target.style.getPropertyValue('line-height');
        return {
          ok: /outline:\s*2px solid black;/.test(styleText) &&
            lineHeight === '1.4' &&
            target.style.getPropertyValue('opacity') === '0.8',
          lineHeight,
          opacity: target.style.getPropertyValue('opacity'),
          inline: styleText,
        };
      });
      engine.undo();
      await frames();
      check('oneInlineUndoLeavesThePreviousStyleEditAlone', () => ({
        ok: target.style.getPropertyValue('opacity') === '0.5' &&
          !target.style.getPropertyValue('outline') &&
          !target.style.getPropertyValue('line-height'),
        style: target.getAttribute('style'),
      }));
      engine.redo();
      await frames();
      check('oneInlineRedoRestoresTheWholePaste', () => ({
        ok: target.style.getPropertyValue('opacity') === '0.8' &&
          Boolean(target.style.getPropertyValue('outline')) &&
          target.style.getPropertyValue('line-height') === '1.4',
        style: target.getAttribute('style'),
      }));

      const multipleRules = '.first-paste-rule { color: red; } .second-paste-rule { color: blue; }';
      await openPaste({ context: 'rule', element: target, selector: '#target' }, multipleRules);
      {
        // Apply is never disabled: pressing it says why, on the CSS field, and changes nothing.
        const apply = Array.from(dialogRoot()?.querySelectorAll('footer .btn') ?? [])
          .find((element) => /Apply CSS/.test(element.textContent ?? ''));
        const styleBefore = target.getAttribute('style');
        apply?.click();
        await frames();
        check('multiplePastedSelectorsMustStayInBlockCSS', () => {
          const warning = dialogRoot()?.querySelector('.note.warn')?.textContent
            ?.replace(/\s+/g, ' ')
            .trim() ?? '';
          const error = dialogRoot()?.querySelector('.field-error')?.textContent?.replace(/\s+/g, ' ').trim() ?? '';
          const draft = dialogRoot()?.querySelector('heo-code-editor');
          return {
            ok: /contains 2 selectors/.test(warning) &&
              /several CSS rules/.test(error) &&
              draft?.getAttribute('aria-invalid') === 'true' &&
              target.getAttribute('style') === styleBefore &&
              Boolean(engine.store.value.cssPaste),
            warning,
            error,
            neverDisabled: !apply?.hasAttribute('disabled'),
          };
        });
      }
      engine.cancelCssPaste();
      await frames();

      /* ------------------------------------------------------------------ *
       * A selector with no existing owner becomes an editor-owned rule, then
       * the same selector is upserted rather than duplicated.
       * ------------------------------------------------------------------ */
      const newSelector = '#rule-target';
      await openPaste({ context: 'rule', element: ruleTarget, selector: newSelector },
        'display: block; color: rgb(12, 34, 56);');
      await applyPaste();
      await openPaste({ context: 'rule', element: ruleTarget, selector: newSelector },
        'margin: 3px; color: rgb(78, 90, 12);');
      const selectorField = () => dialogRoot()?.querySelector('heo-selector-field');
      const selectorInput = () => selectorField()?.shadowRoot?.querySelector('input');
      const selectorQuery = selectorInput();
      selectorQuery.value = '#rule';
      selectorQuery.dispatchEvent(new Event('input', {
        bubbles: true,
        composed: true,
      }));
      await frames();
      check('theRuleDestinationUsesTheSharedSelectorAutocomplete', () => {
        const field = selectorField();
        const option = Array.from(field?.shadowRoot?.querySelectorAll('.option') ?? [])
          .find((element) => element.querySelector('.name')?.textContent?.trim() === newSelector);
        const metadata = option?.querySelector('.meta')?.textContent?.replace(/\s+/g, ' ').trim() ?? '';
        return {
          ok: field?.tagName === 'HEO-SELECTOR-FIELD' &&
            Boolean(field?.shadowRoot?.querySelector('.popup')) &&
            option?.querySelector('.name')?.textContent?.trim() === newSelector &&
            /2 rules · 1×/.test(metadata),
          fieldTag: field?.tagName ?? null,
          popupOpen: Boolean(field?.shadowRoot?.querySelector('.popup')),
          suggestion: option?.querySelector('.name')?.textContent?.trim() ?? null,
          metadata,
        };
      });
      const existingSelectorOption = Array.from(
        selectorField()?.shadowRoot?.querySelectorAll('.option') ?? [],
      ).find((element) => element.querySelector('.name')?.textContent?.trim() === newSelector);
      existingSelectorOption?.dispatchEvent(new MouseEvent('click', {
        bubbles: true,
        composed: true,
      }));
      await frames();
      check('choosingTheRuleSuggestionMakesTheExistingUpsertExplicit', () => {
        const open = engine.store.value.cssPaste;
        const destinationText = dialogRoot()?.querySelector('.target')?.textContent
          ?.replace(/\s+/g, ' ')
          .trim() ?? '';
        return {
          ok: open?.selector === newSelector && /Upserts existing/.test(destinationText),
          selector: open?.selector ?? null,
          destinationText,
        };
      });
      await applyPaste();
      check('aCSSRuleIsCreatedAndThenUpsertedInItsRegistry', () => {
        const entry = engine.rules.get(newSelector);
        return {
          ok: entry?.origin === 'user' &&
            entry.declarations.display === 'block' &&
            entry.declarations.margin === '3px' &&
            entry.declarations.color === 'rgb(78, 90, 12)' &&
            getComputedStyle(ruleTarget).display === 'block',
          rule: entry ?? null,
          computedDisplay: getComputedStyle(ruleTarget).display,
        };
      });

      /* The page rule's card must keep its body: the id chip's popover holds #target's rule,
       * checked for its rows so an empty-body regression cannot pass on the heading alone. */
      api.select(target);
      api.openPanel('styles');
      await frames();
      await new Promise((resolve) => setTimeout(resolve, 80));
      const stylesPanel = () => document.querySelector('html-editor-overlay > heo-overlay')
        ?.shadowRoot?.querySelector('heo-dock')
        ?.shadowRoot?.querySelector('heo-styles-panel');
      stylesPanel()?.shadowRoot?.querySelector('.ident .cchip.id .name')?.click();
      await frames();
      check('theStylesCSSRulesSectionRestoresItsRenderedRuleContent', () => {
        const pop = stylesPanel()?.shadowRoot?.querySelector('.cardpop');
        const selectors = Array.from(pop?.querySelectorAll('.cls .n') ?? [])
          .map((element) => element.textContent?.trim());
        const properties = Array.from(pop?.querySelectorAll('.cls .decl .p') ?? [])
          .map((element) => element.textContent?.trim());
        return {
          ok: Boolean(pop) &&
            selectors.includes('#target') &&
            properties.includes('color') &&
            properties.includes('margin'),
          selectors,
          properties,
        };
      });
      stylesPanel()?.shadowRoot?.querySelector('.ident .cchip.id .name')?.click();
      await frames();

      /* ------------------------------------------------------------------ *
       * Editing a rule already in a stylesheet keeps the CSSOM location in
       * the records, which is what writeback needs later.
       * ------------------------------------------------------------------ */
      const fixtureSheet = document.getElementById('fixture-sheet');
      const liveRule = Array.from(fixtureSheet.sheet.cssRules)
        .find((rule) => rule.selectorText === '#target');
      await openPaste({
        context: 'rule',
        element: target,
        selector: '#target',
        liveRule,
      }, 'color: rebeccapurple !important; letter-spacing: 0.04em;');
      await applyPaste();
      check('anExistingStylesheetRuleKeepsWritebackMetadata', () => {
        const records = engine.records.filter((record) =>
          record.detail?.scope === 'stylesheet rule' && record.detail?.selector === '#target');
        const colorRecord = records.find((record) => record.detail?.property === 'color');
        const exportedDoc = new DOMParser().parseFromString(api.exportHTML(), 'text/html');
        const exportedCss = exportedDoc.getElementById('fixture-sheet')?.textContent ?? '';
        return {
          ok: Boolean(liveRule) &&
            liveRule.style.getPropertyValue('color') === 'rebeccapurple' &&
            liveRule.style.getPropertyPriority('color') === 'important' &&
            records.length === 2 &&
            colorRecord?.detail?.priority === 'important' &&
            /color:\s*rebeccapurple\s*!important/.test(exportedCss) &&
            records.every((record) =>
              record.detail.file === 'fixture-sheet' &&
              Boolean(record.detail.writeTo) &&
              Boolean(record.detail.sheet) &&
              Boolean(record.detail.rulePath) &&
              record.detail.ruleContext !== undefined),
          records: records.map((record) => record.detail),
          liveColor: liveRule?.style.getPropertyValue('color') ?? null,
          livePriority: liveRule?.style.getPropertyPriority('color') ?? null,
          exportedColor: exportedCss.match(/color:[^;]+;?/)?.[0] ?? null,
        };
      });

      /* ------------------------------------------------------------------ *
       * Block CSS is destination-oriented. Inline styles and global classes
       * are staged in the pending template; authored rules stay readable until
       * a block is used, when the library prefixes the selectors it owns.
       * ------------------------------------------------------------------ */
      const outsideParagraph = document.createElement('p');
      outsideParagraph.id = 'outside-block-paragraph';
      outsideParagraph.textContent = 'Outside paragraph';
      const outsidePouet = document.createElement('div');
      outsidePouet.id = 'outside-block-pouet';
      outsidePouet.className = 'pouet';
      outsidePouet.textContent = 'Outside class';
      document.body.append(outsideParagraph, outsidePouet);

      const extractDialogRoot = () => deepQuery('heo-extract-dialog')?.shadowRoot ?? null;
      const blockMarkup = '<div class="pouet"><p class="block-copy">Inside block</p><span>Not a paragraph</span></div>';

      engine.beginBlockDraft('CSS paste inline');
      engine.updateExtraction({ html: blockMarkup, css: '' });
      await frames();
      check('theBlockHTMLTabOffersThePasteCSSEntry', () => {
        const root = extractDialogRoot();
        const activeTab = root?.querySelector('[role="tab"][aria-selected="true"]')?.textContent
          ?.replace(/\s+/g, ' ').trim() ?? '';
        const paste = root?.querySelector('.label-row .paste');
        return {
          ok: /HTML/.test(activeTab) && /Paste CSS/.test(paste?.textContent ?? ''),
          activeTab,
          pasteButton: paste?.textContent?.replace(/\s+/g, ' ').trim() ?? null,
        };
      });
      extractDialogRoot()?.querySelector('.label-row .paste')?.dispatchEvent(
        new MouseEvent('click', { bubbles: true, composed: true }),
      );
      await frames();
      check('theHTMLTabPasteCSSEntryOpensTheBlockPasteModal', () => ({
        ok: engine.store.value.cssPaste?.context === 'block',
        context: engine.store.value.cssPaste?.context ?? null,
      }));
      engine.cancelCssPaste();
      await frames();

      await openPaste({ context: 'block' }, 'p { color: red !important; }');
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      await applyPaste();
      check('blockInlinePasteWritesOnlyMatchingMarkup', () => {
        const pending = engine.store.value.extraction;
        const doc = new DOMParser().parseFromString(pending?.mode === 'block' ? pending.html : '', 'text/html');
        const root = doc.body.firstElementChild;
        const paragraph = root?.querySelector('.block-copy');
        const span = root?.querySelector('span');
        return {
          ok: pending?.mode === 'block' &&
            paragraph?.style.getPropertyValue('color') === 'red' &&
            paragraph?.style.getPropertyPriority('color') === 'important' &&
            !span?.style.getPropertyValue('color') &&
            !root?.style.getPropertyValue('color') &&
            pending.css === '' &&
            Object.keys(pending.globalClasses).length === 0,
          html: pending?.mode === 'block' ? pending.html : null,
          paragraphColor: paragraph?.getAttribute('style') ?? null,
          spanColor: span?.getAttribute('style') ?? null,
        };
      });

      await openPaste({ context: 'block' }, 'padding: 6px; border: 1px solid red;');
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      const blockInlineField = () =>
        dialogRoot()?.querySelector('.destination heo-which-elements')?.shadowRoot?.querySelector('heo-selector-field');
      {
        // Open the completion list the way a user does: focus then type the :scope draft back in,
        // so the autocomplete populates reliably (a bare focus() does not open it headlessly).
        const input = blockInlineField()?.shadowRoot?.querySelector('input');
        if (input) {
          input.focus();
          input.value = ':scope';
          input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        }
      }
      await frames();
      check('selectorlessBlockInlinePasteDefaultsToTheEncompassingRoot', () => {
        const field = blockInlineField();
        const rootOption = Array.from(field?.shadowRoot?.querySelectorAll('.option') ?? [])
          .find((element) => element.querySelector('.name')?.textContent?.trim() === "Block's top element");
        const footer = dialogRoot()?.querySelector('footer .fine')?.textContent
          ?.replace(/\s+/g, ' ').trim() ?? '';
        return {
          ok: engine.store.value.cssPaste?.selector === ':scope' &&
            field?.tagName === 'HEO-SELECTOR-FIELD' &&
            field?.value === ':scope' &&
            Boolean(rootOption) &&
            /block root/i.test(footer) &&
            !/CSS rule selector is needed/.test(footer),
          selector: engine.store.value.cssPaste?.selector ?? null,
          fieldValue: field?.value ?? null,
          rootOption: rootOption?.textContent?.replace(/\s+/g, ' ').trim() ?? null,
          footer,
        };
      });
      await applyPaste();
      check('selectorlessBlockInlinePasteWritesDeclarationsToTheRoot', () => {
        const pending = engine.store.value.extraction;
        const doc = new DOMParser().parseFromString(pending?.mode === 'block' ? pending.html : '', 'text/html');
        const root = doc.body.firstElementChild;
        const paragraph = root?.querySelector('.block-copy');
        return {
          ok: pending?.mode === 'block' &&
            root?.style.getPropertyValue('padding') === '6px' &&
            root?.style.getPropertyValue('border-top-width') === '1px' &&
            !paragraph?.style.getPropertyValue('padding'),
          rootStyle: root?.getAttribute('style') ?? null,
          paragraphStyle: paragraph?.getAttribute('style') ?? null,
        };
      });

      await openPaste({ context: 'block' }, '.missing-block-selector { color: blue; }');
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      {
        const apply = Array.from(dialogRoot()?.querySelectorAll('footer .btn') ?? [])
          .find((element) => /Use this CSS/.test(element.textContent ?? ''));
        apply?.click();
        await frames();
        check('aNonmatchingPastedSelectorCanBeReplacedFromBlockMarkup', () => {
          const field = blockInlineField();
          const input = field?.shadowRoot?.querySelector('input');
          const error = dialogRoot()?.querySelector('.field-error')?.textContent?.replace(/\s+/g, ' ').trim() ?? '';
          // The form directive now marks the WHICH ELEMENTS? pane invalid (it wraps the field).
          const pane = dialogRoot()?.querySelector('.destination heo-which-elements');
          return {
            ok: input?.value === '.missing-block-selector' &&
              Boolean(field?.shadowRoot?.querySelector('.count.miss')) &&
              /matches nothing/.test(error) &&
              pane?.getAttribute('aria-invalid') === 'true' &&
              Boolean(engine.store.value.cssPaste),
            selector: input?.value ?? null,
            countTone: field?.shadowRoot?.querySelector('.count')?.className ?? null,
            error,
            neverDisabled: !apply?.hasAttribute('disabled'),
          };
        });
      }
      const recoveryInput = blockInlineField()?.shadowRoot?.querySelector('input');
      if (recoveryInput) {
        recoveryInput.value = '.block-copy';
        recoveryInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      }
      await frames();
      await applyPaste();
      check('replacedBlockSelectorReceivesThePastedRuleDeclarations', () => {
        const pending = engine.store.value.extraction;
        const doc = new DOMParser().parseFromString(pending?.mode === 'block' ? pending.html : '', 'text/html');
        const root = doc.body.firstElementChild;
        const paragraph = root?.querySelector('.block-copy');
        return {
          ok: pending?.mode === 'block' &&
            paragraph?.style.getPropertyValue('color') === 'blue' &&
            !root?.style.getPropertyValue('color'),
          paragraphStyle: paragraph?.getAttribute('style') ?? null,
          rootStyle: root?.getAttribute('style') ?? null,
        };
      });

      const multiRootMarkup = `<div class="first-root"><p class="first-copy">First words</p><span>First sibling</span></div>
<section class="second-root"><p class="second-copy">Second words</p><span>Second sibling</span></section>`;
      engine.beginBlockDraft('CSS paste multi-root');
      engine.updateExtraction({ html: multiRootMarkup, css: '' });
      await frames();
      await openPaste(
        { context: 'block' },
        '.first-root p { color: red; } .second-root p { color: blue; }',
      );
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      await applyPaste();
      check('blockInlineMultiRulePasteUpdatesMatchingElementsAcrossDetachedRoots', () => {
        const pending = engine.store.value.extraction;
        const doc = new DOMParser().parseFromString(pending?.mode === 'block' ? pending.html : '', 'text/html');
        const first = doc.querySelector('.first-copy');
        const second = doc.querySelector('.second-copy');
        const siblings = Array.from(doc.querySelectorAll('.first-root span, .second-root span'));
        return {
          ok: pending?.mode === 'block' &&

      });

      // --- A right-pane click after a non-matching type wins ----------------
      await clickRow(rowByTag('section'));
      check('aRightClickAfterANonMatchingTypeWins', () => {
        // Clicking the lone root produces the readable :scope.
        return {
          ok: engine.store.value.cssPaste?.selector === ':scope',
          selector: engine.store.value.cssPaste?.selector ?? null,
        };
      });

      // --- Clicking a tree node rewrites the selector to an exact match -----
      // Reset the selection to clear :scope, then pick the <h2>.
      await typeSelector('');
      await clickRow(whichRows().find((row) => (row.querySelector('.tag')?.textContent ?? '').trim() === 'h2'));
      check('clickingATreeNodeRewritesTheSelectorToAnExactMatch', () => {
        const selector = engine.store.value.cssPaste?.selector ?? '';
        return {
          // The lone <h2> is uniquely a bare tag.
          ok: selector === 'h2',
          selector,
        };
      });

      check('clickingATreeNodeLandsTheGeneratedSelectorInTheInputValue', () => {
        // The external write reached the input because blurInput() ran before the emit.
        return {
          ok: whichInput()?.value === 'h2',
          inputValue: whichInput()?.value ?? null,
        };
      });

      // --- Clicking an element with a class offers the readable class form --
      // The inner <p> of article.nested needs a positional selector; but its only class-
      // bearing relative is the <section>. Use the <a class="btn primary"> instead: its
      // exact selector is the readable .primary (ladder step 3), so no "simpler" group is
      // expected there. For the simpler-equivalent surfacing we need a positional pick that
      // has a readable equivalent — the foreign <p> has none. So assert the mechanism on a
      // case the design pins: pick both <a class="btn">, which yields .btn directly; and
      // separately verify the "Same elements, simpler" group appears for the positional
      // foreign <p> only when an equivalent exists (it does not), i.e. the group is absent.
      // Instead, exercise the documented path: a class that is a simpler equivalent surfaces.
      await typeSelector('');
      await clickRow(whichRows().find((row) =>
        (row.querySelector('.label')?.textContent ?? '').includes('primary')));
      check('clickingAnElementWithAClassWritesTheReadableClassSelector', () => {
        // <a class="btn primary"> -> .primary (unique class), the readable form.
        return {
          ok: engine.store.value.cssPaste?.selector === '.primary',
          selector: engine.store.value.cssPaste?.selector ?? null,
        };
      });

      // Surfacing of a simpler equivalent in the dropdown: pick the foreign <p> (a positional
      // selector) and confirm no false "simpler" group is invented; then type a class that is
      // a genuine simpler equivalent and confirm the group shows. The direct guarantee the
      // design pins is that when equivalents exist they ride above the cap — exercised by
      // passing one through the field via a two-element pick that resolves to .btn.
      await typeSelector('');
      const aTagRows = () => whichRows().filter((row) => (row.querySelector('.tag')?.textContent ?? '').trim() === 'a');
      await clickRow(aTagRows()[0]);
      const afterFirstARow = engine.store.value.cssPaste?.selector;
      // Re-query after the re-render; the first click replaced the row nodes.
      await clickRow(aTagRows()[1]);
      check('clickingTwoNodesProducesAnExactSetSelector', () => {
        // Both <a class="btn …"> share .btn, which matches exactly the two of them.
        return {
          ok: engine.store.value.cssPaste?.selector === '.btn',
          selector: engine.store.value.cssPaste?.selector ?? null,
          afterFirstARow,
        };
      });

      // The foreign <p> resolves to a positional path; its readable equivalents are empty, so
      // the "Same elements, simpler" group is omitted (nothing simpler to surface).
      await typeSelector('');
      const foreignP = whichRows().filter((row) =>
        (row.querySelector('.tag')?.textContent ?? '').trim() === 'p')
        .find((row) => Number(row.getAttribute('aria-level')) > 2);
      await clickRow(foreignP);
      check('clickingANestedForeignNodeProducesAnExactPositionalSelector', () => {
        return {
          ok: engine.store.value.cssPaste?.selector === ':scope > article > p',
          selector: engine.store.value.cssPaste?.selector ?? null,
        };
      });

      // A readable equivalent IS surfaced in the dropdown when one exists for a fallback.
      // Construct one: a template where an element needs a positional selector but a class
      // names the same single element. <h2> here is already a bare-tag readable form, so use
      // a crafted template with two <h2> where one has a unique class.
      engine.cancelExtraction();
      await frames();
      const equivTemplate = '<div><h2 class="lead-title">A</h2><h2>B</h2></div>';
      engine.beginBlockDraft('WHICH ELEMENTS equiv');
      engine.updateExtraction({ html: equivTemplate, css: '' });
      await frames();
      await openPaste({ context: 'block' }, 'padding: 4px;');
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      // Pick the first <h2>: it has a unique class (.lead-title) so the best selector is the
      // readable .lead-title (ladder step 3). To force the positional fallback and a surfaced
      // equivalent, pick the SECOND <h2> (no class): best is :scope > h2:nth-of-type(2), and
      // there is no readable equivalent, so no "simpler" group. For the first <h2>, .lead-title
      // is chosen directly. We assert the field forwards equivalents by passing them manually:
      // when a positional selector is generated AND a class equivalent exists it must appear.
      // The first <h2> gives the readable class directly, confirming step-3 selection.
      await typeSelector('');
      {
        const paneRows = () => Array.from(
          dialogRoot()?.querySelector('heo-which-elements')?.shadowRoot?.querySelectorAll('[role="treeitem"]') ?? []);
        const firstH2 = paneRows().find((row) =>
          (row.querySelector('.label')?.textContent ?? '').includes('lead-title'));
        firstH2?.querySelector('input[type="checkbox"]')?.click();
        await frames();
        await frames();
      }
      check('clickingAnElementWithAClassOffersTheReadableClassForm', () => {
        // .lead-title is the readable class selector for the first <h2>.
        return {
          ok: engine.store.value.cssPaste?.selector === '.lead-title',
          selector: engine.store.value.cssPaste?.selector ?? null,
        };
      });
      // Equivalents are surfaced above the completion cap: feed a positional selector with a
      // known class equivalent straight into the field and confirm the "Same elements, simpler"
      // group renders the class option.
      {
        // Drive the field directly: a positional draft plus a known class equivalent. The
        // equivalent is set on the field after the parent has settled, and the list is
        // re-opened with a focus (no selector-input, so the parent will not re-render and
        // reset the equivalents). This pins the cross-file forwarding into completeSelector.
        const field = dialogRoot()?.querySelector('heo-which-elements')?.shadowRoot?.querySelector('heo-selector-field');
        const input = field?.shadowRoot?.querySelector('input');
        if (field && input) {
          input.value = 'h2';
          input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        }
        await frames();
        await frames();
        if (field && input) {
          field.equivalents = ['.lead-title'];
          await field.updateComplete;
          input.blur();
          input.focus();
        }
        await frames();
        await frames();
      }
      check('aSimplerEquivalentIsSurfacedInTheAutocompleteGroup', () => {
        const field = dialogRoot()?.querySelector('heo-which-elements')?.shadowRoot?.querySelector('heo-selector-field');
        const groups = Array.from(field?.shadowRoot?.querySelectorAll('.group') ?? [])
          .map((g) => g.textContent?.trim());
        const simplerGroupOptions = [];
        let inSimpler = false;
        for (const node of Array.from(field?.shadowRoot?.querySelector('.popup')?.children ?? [])) {
          if (node.classList.contains('group')) inSimpler = node.textContent?.trim() === 'Same elements, simpler';
          else if (inSimpler && node.querySelector?.('.name')) simplerGroupOptions.push(node.querySelector('.name').textContent?.trim());
        }
        return {
          ok: groups.includes('Same elements, simpler') && simplerGroupOptions.includes('.lead-title'),
          groups,
          simplerGroupOptions,
        };
      });
      engine.cancelExtraction();
      await frames();

      // --- Latest-action-wins: click, then edit, then click -----------------
      engine.beginBlockDraft('WHICH ELEMENTS latest');
      engine.updateExtraction({ html: sampleTemplate, css: '' });
      await frames();
      await openPaste({ context: 'block' }, 'padding: 4px;');
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      await typeSelector('');
      await clickRow(whichRows().find((row) => (row.querySelector('.tag')?.textContent ?? '').trim() === 'h2'));
      const afterFirstClick = engine.store.value.cssPaste?.selector;
      await typeSelector('section');
      const afterEdit = engine.store.value.cssPaste?.selector;
      await clickRow(whichRows().find((row) =>
        (row.querySelector('.label')?.textContent ?? '').includes('primary')));
      const afterSecondClick = engine.store.value.cssPaste?.selector;
      check('latestActionWinsClickThenEditThenClick', () => ({
        ok: afterFirstClick === 'h2' && afterEdit === 'section' && afterSecondClick === '.primary',
        afterFirstClick,
        afterEdit,
        afterSecondClick,
      }));
      engine.cancelExtraction();
      await frames();

      // --- Single-root vs multi-root synthetic "Block's top element" row ----
      engine.beginBlockDraft('WHICH ELEMENTS single root');
      engine.updateExtraction({ html: sampleTemplate, css: '' });
      await frames();
      await openPaste({ context: 'block' }, 'padding: 4px;');
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      check('singleRootTemplateHasNoSyntheticTopRow', () => {
        const synthetic = whichPane()?.shadowRoot?.querySelector('.node.synthetic');
        return { ok: synthetic === null, synthetic: synthetic ? 'present' : 'absent' };
      });
      await typeSelector('');
      await clickRow(rowByTag('section'));
      check('checkingTheSingleRootRowSetsScope', () => ({
        ok: engine.store.value.cssPaste?.selector === ':scope',
        selector: engine.store.value.cssPaste?.selector ?? null,
      }));
      engine.cancelExtraction();
      await frames();

      const multiRootTemplate = `<div class="first-root"><p class="first-copy">First</p></div>
<section class="second-root"><p class="second-copy">Second</p></section>`;
      engine.beginBlockDraft('WHICH ELEMENTS multi root');
      engine.updateExtraction({ html: multiRootTemplate, css: '' });
      await frames();
      await openPaste({ context: 'block' }, 'padding: 4px;');
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      check('multiRootTemplateShowsASyntheticTopElementRow', () => {
        const synthetic = whichPane()?.shadowRoot?.querySelector('.node.synthetic');
        const label = synthetic?.querySelector('.label')?.textContent?.trim() ?? '';
        const level = synthetic?.getAttribute('aria-level');
        return {
          ok: Boolean(synthetic) && /Block's top element/.test(label) && level === '1',
          label,
          level,
        };
      });
      // Checking the synthetic row sets bare :scope.
      {
        const synthetic = whichPane()?.shadowRoot?.querySelector('.node.synthetic');
        synthetic?.querySelector('input[type="checkbox"]')?.click();
        await frames();
        await frames();
      }
      check('checkingTheSyntheticTopRowSetsScope', () => ({
        ok: engine.store.value.cssPaste?.selector === ':scope',
        selector: engine.store.value.cssPaste?.selector ?? null,
      }));
      // Typing :scope by hand lights up (checks) that same synthetic row.
      await typeSelector(':scope');
      check('typingScopeChecksTheSyntheticTopRow', () => {
        const synthetic = whichPane()?.shadowRoot?.querySelector('.node.synthetic');
        return {
          ok: synthetic?.getAttribute('aria-checked') === 'true' &&
            synthetic?.classList.contains('match') === true,
          ariaChecked: synthetic?.getAttribute('aria-checked') ?? null,
        };
      });
      engine.cancelExtraction();
      await frames();

      // --- Checkbox gone: top-element default on every destination ----------
      // block-inline: bare declarations land on the root with nothing picked.
      engine.beginBlockDraft('WHICH ELEMENTS default inline');
      engine.updateExtraction({ html: blockMarkup, css: '' });
      await frames();
      await openPaste({ context: 'block' }, 'gap: 9px;');
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      await applyPaste();
      const defaultInlinePending = engine.store.value.extraction;
      check('checkboxGoneBlockInlineDefaultsToTheRoot', () => {
        const doc = new DOMParser().parseFromString(
          defaultInlinePending?.mode === 'block' ? defaultInlinePending.html : '', 'text/html');
        const root = doc.body.firstElementChild;
        const paragraph = root?.querySelector('.block-copy');
        return {
          ok: root?.style.getPropertyValue('gap') === '9px' && !paragraph?.style.getPropertyValue('gap'),
          rootStyle: root?.getAttribute('style') ?? null,
        };
      });
      engine.cancelExtraction();
      await frames();

      // block-class: the class is added to the root with nothing picked (internal value :scope).
      engine.beginBlockDraft('WHICH ELEMENTS default class');
      engine.updateExtraction({ html: blockMarkup, css: '' });
      await frames();
      await openPaste({ context: 'block' }, 'background-color: navy;');
      engine.updateCssPaste({ destination: 'block-class', className: 'which-default-class' });
      await frames();
      check('checkboxGoneBlockClassDefaultsToScopeInternally', () => ({
        ok: engine.store.value.cssPaste?.selector === ':scope',
        selector: engine.store.value.cssPaste?.selector ?? null,
      }));
      await applyPaste();
      const defaultClassPending = engine.store.value.extraction;
      check('checkboxGoneBlockClassAddsTheClassToTheRoot', () => {
        const doc = new DOMParser().parseFromString(
          defaultClassPending?.mode === 'block' ? defaultClassPending.html : '', 'text/html');
        const root = doc.body.firstElementChild;
        const paragraph = doc.querySelector('.block-copy');
        return {
          ok: root?.classList.contains('which-default-class') === true &&
            paragraph?.classList.contains('which-default-class') === false,
          rootClass: root?.getAttribute('class') ?? null,
        };
      });
      engine.cancelExtraction();
      await frames();

      // block-rule: bare declarations scope to the root with nothing picked.
      engine.beginBlockDraft('WHICH ELEMENTS default rule');
      engine.updateExtraction({ html: blockMarkup, css: '' });
      await frames();
      await openPaste({ context: 'block' }, 'z-index: 5;');
      engine.updateCssPaste({ destination: 'block-rule' });
      await frames();
      await applyPaste();
      const defaultRulePending = engine.store.value.extraction;
      check('checkboxGoneBlockRuleScopesBareDeclarationsToTheRoot', () => {
        const css = defaultRulePending?.mode === 'block' ? defaultRulePending.css : '';
        return {
          ok: css === ':scope {\n  z-index: 5;\n}',
          css,
        };
      });
      engine.cancelExtraction();
      await frames();

      // --- 2+ rules: pane hidden for inline/scoped, shown for class ---------
      engine.beginBlockDraft('WHICH ELEMENTS two rules');
      engine.updateExtraction({ html: sampleTemplate, css: '' });
      await frames();
      await openPaste({ context: 'block' }, 'h2 { color: red; } p { color: blue; }');
      engine.updateCssPaste({ destination: 'block-inline' });
      await frames();
      check('theWhichPaneIsHiddenForTwoOrMoreRulesOnInline', () => {
        const pane = dialogRoot()?.querySelector('heo-which-elements');
        const summary = dialogRoot()?.querySelector('.destination .target')?.textContent
          ?.replace(/\s+/g, ' ').trim() ?? '';
        return { ok: pane === null && summary.length > 0, pane: pane ? 'present' : 'absent', summary };
      });
      engine.updateCssPaste({ destination: 'block-rule' });
      await frames();
      check('theWhichPaneIsHiddenForTwoOrMoreRulesOnScoped', () => {
        const pane = dialogRoot()?.querySelector('heo-which-elements');
        return { ok: pane === null, pane: pane ? 'present' : 'absent' };
      });
      engine.updateCssPaste({ destination: 'block-class', className: 'two-rule-class' });
      await frames();
      check('theWhichPaneStaysShownForTwoOrMoreRulesOnClass', () => {
        const pane = dialogRoot()?.querySelector('heo-which-elements');
        return { ok: Boolean(pane), pane: pane ? 'present' : 'absent' };
      });
      engine.cancelCssPaste();
      await frames();
      engine.cancelExtraction();
      await frames();

      /* ------------------------------------------------------------------ *
       * Native page paste is promoted only when it is CSS, while the modal owns
       * focus, Escape, and the class-name suggestion list once it is open.
       * ------------------------------------------------------------------ */
      api.select(target);
      engine.setQuickMenu(true);
      await frames();
      const pageCss = 'outline: 3px solid hotpink; line-height: 1.4;';
      const pagePasteAllowed = pasteText(target, pageCss);
      await frames();
      check('aValidPagePasteOpensAndPrefillsThePasteCSSModal', () => {
        const open = engine.store.value.cssPaste;
        return {
          ok: pagePasteAllowed === false && open?.draft === pageCss && open.destination === 'inline',
          prevented: pagePasteAllowed === false,
          draft: open?.draft ?? null,
          destination: open?.destination ?? null,
        };
      });
      check('thePasteCSSModalStartsWithItsCodeEditorFocused', () => {
        const editor = dialogRoot()?.querySelector('heo-code-editor');
        const textarea = editor?.shadowRoot?.querySelector('textarea');
        const active = deepActive();
        return {
          ok: Boolean(textarea) && active === textarea,
          active: active?.tagName ?? null,
          editorInput: Boolean(textarea),
        };
      });

      const modal = dialogRoot()?.querySelector('[role="dialog"]');
      const tabOrigin = deepActive();
      tabOrigin?.dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Tab',
        bubbles: true,
        cancelable: true,
        composed: true,
      }));
      await frames();
      check('tabRemainsInsideThePasteCSSModal', () => {
        const active = deepActive();
        return {
          ok: Boolean(modal && active && insideComposed(modal, active)),
          active: active?.tagName ?? null,
        };
      });

      const backdrop = dialogRoot()?.querySelector('.backdrop');
      backdrop?.dispatchEvent(new PointerEvent('pointerdown', {
        bubbles: true,
        cancelable: true,
        composed: true,
      }));
      await frames();
      check('thePasteCSSBackdropDoesNotMoveFocusOrUnwindTheMenuBehindIt', () => {
        const active = deepActive();
        return {
          ok: Boolean(modal && active && insideComposed(modal, active)) &&
            engine.store.value.cssPaste !== null &&
            engine.store.value.quickMenuOpen === true,
          focusStillInside: Boolean(modal && active && insideComposed(modal, active)),
          modalState: engine.store.value.cssPaste ? 'open' : 'closed',
          menuBehindStillOpen: engine.store.value.quickMenuOpen,
        };
      });

      const escapeOrigin = deepActive();
      escapeOrigin?.dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Escape',
        bubbles: true,
        cancelable: true,
        composed: true,
      }));
      await frames();
      check('escapeClosesPasteCSSWithoutUnwindingTheMenuBehindIt', () => ({
        ok: engine.store.value.cssPaste === null &&
          engine.store.value.quickMenuOpen === true &&
          engine.store.value.selected === target,
        modalState: engine.store.value.cssPaste ? 'open' : 'closed',
        menuBehindStillOpen: engine.store.value.quickMenuOpen,
        selected: engine.store.value.selected?.id ?? null,
      }));
      engine.setQuickMenu(false);
      await frames();

      const nativeInput = document.getElementById('native-input');
      const nativePasteAllowed = pasteText(nativeInput, 'color: blue;');
      await frames();
      check('pastingIntoANativeInputIsNotPromotedToPasteCSS', () => ({
        ok: nativePasteAllowed === true && engine.store.value.cssPaste === null,
        allowed: nativePasteAllowed,
        modalState: engine.store.value.cssPaste ? 'open' : 'closed',
      }));

      api.setEditing(false);
      const disabledPasteAllowed = pasteText(target, 'color: blue;');
      await frames();
      check('pastingWithHEODisabledIsLeftToThePage', () => ({
        ok: disabledPasteAllowed === true && engine.store.value.cssPaste === null,
        allowed: disabledPasteAllowed,
        modalState: engine.store.value.cssPaste ? 'open' : 'closed',
      }));
      api.setEditing(true);
      api.select(target);
      await frames();

      await openPaste({ context: 'class', element: target, className: 'module' }, 'color: teal;');
      const classField = () => dialogRoot()?.querySelector('heo-value-field');
      const classInput = () => classField()?.shadowRoot?.querySelector('input');
      const setClassQuery = (value) => {
        const input = classInput();
        if (!input) return false;
        input.value = value;
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        return true;
      };
      setClassQuery('module-border');
      await frames();
      check('theClassNameFieldUsesTheSharedClassAutocomplete', () => {
        const field = classField();
        const option = field?.shadowRoot?.querySelector('.option .name');
        return {
          ok: field?.tagName === 'HEO-VALUE-FIELD' &&
            Boolean(field?.listIsOpen) &&
            option?.textContent?.trim() === 'module-border-wrap',
          fieldTag: field?.tagName ?? null,
          listOpen: Boolean(field?.listIsOpen),
          suggestion: option?.textContent?.trim() ?? null,
        };
      });

      const firstAutocompleteEscape = classInput();
      firstAutocompleteEscape?.dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Escape',
        bubbles: true,
        cancelable: true,
        composed: true,
      }));
      await frames();
      check('theFirstEscapeClosesClassSuggestionsBeforeTheModal', () => ({
        ok: engine.store.value.cssPaste !== null && !classField()?.listIsOpen,
        modalState: engine.store.value.cssPaste ? 'open' : 'closed',
        listState: classField()?.listIsOpen ? 'open' : 'closed',
      }));

      setClassQuery('module-border');
      await frames();
      classField()?.shadowRoot?.querySelector('.option')?.dispatchEvent(
        new MouseEvent('click', { bubbles: true, composed: true }),
      );
      await frames();
      check('choosingAClassSuggestionMakesTheExistingUpsertExplicit', () => {
        const open = engine.store.value.cssPaste;
        const destinationText = Array.from(dialogRoot()?.querySelectorAll('.target') ?? [])
          .map((element) => element.textContent?.replace(/\s+/g, ' ').trim() ?? '')
          .join(' ');
        return {
          ok: open?.className === 'module-border-wrap' &&
            /Upserts existing/.test(destinationText) &&
            /module-border-wrap/.test(destinationText),
          className: open?.className ?? null,
          destinationText,
        };
      });
      engine.cancelCssPaste();
      await frames();

      /*
       * The Other card's Paste CSS opens the dialog in the inline context for the selected element
       * (R16, decision 15): what is pasted there is about this element, as the card is.
       */
      api.select(target);
      engine.setDockTab('styles');
      await frames();
      await new Promise((resolve) => setTimeout(resolve, 200));
      const effective = deepQuery('heo-styles-panel')?.shadowRoot
        ?.querySelector('heo-section[data-card="other"]');
      effective?.shadowRoot?.querySelector('.tile')?.click();
      await frames();
      const effectivePaste = Array.from(effective?.querySelectorAll('.actions button') ?? [])
        .find((button) => /Paste CSS/.test(button.textContent ?? ''));
      effectivePaste?.click();
      await frames();
      results.effective = {
        pasteOpensInlineContext:
          Boolean(effectivePaste) &&
          engine.store.value.cssPaste?.context === 'inline' &&
          engine.store.value.cssPaste?.element === target,
      };
      engine.cancelCssPaste();
      await frames();
      // One general Paste CSS outside the header's cards (the Other card's), and one at the end of a
      // popped card, which opens on that card's rule.
      const panelRoot = deepQuery('heo-styles-panel')?.shadowRoot;
      const everyPaste = Array.from(panelRoot?.querySelectorAll('button') ?? [])
        .filter((button) => /Paste CSS/.test(button.textContent ?? ''));
      panelRoot?.querySelector('.ident .cchip.id .name')?.click();
      await frames();
      const cards = Array.from(panelRoot?.querySelectorAll('.cardpop > .cls') ?? []);
      const here = cards[0]?.querySelector('[data-act="paste-here"]');
      here?.click();
      await frames();
      const pasted = engine.store.value.cssPaste;
      results.sources = {
        oneGeneralPasteAndOnePerCard:
          everyPaste.filter((button) => !button.closest('.cls')).length === 1 &&
          cards.length > 0 &&
          cards.every((one) => one.querySelectorAll('[data-act="paste-here"]').length === 1),
        cardPasteOpensOnThatCard: Boolean(here) && pasted?.element === target,
      };
      engine.cancelCssPaste();
      await frames();

      results.browserErrors = { ok: errors.length === 0, errors };
      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value === false))
        .map(([name]) => name);
      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify({
        ok: failed.length === 0,
        failed,
        ...results,
      }, null, 1) + ':END';
    })().catch((error) => {
      document.getElementById('out').textContent =
        'RESULTS:{"ok":false,"__fatal":' + JSON.stringify(String((error && error.stack) || error)) + '}:END';
    });
  </script>
