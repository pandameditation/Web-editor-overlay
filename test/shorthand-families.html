<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Shorthand families across blocks</title>
  <!--
    A shorthand and its side are one family where one block declares both: they compete by order
    there, and the family control moves one last. Written in different blocks, the side is still
    listed under its shorthand, with a note saying which wins by the cascade.
  -->
  <style id="site">
    .intro {
      color: #222;
    }
  </style>
  <style id="rules">
    .box {
      padding: 8px;
      padding-left: 0;
    }

    .fam {
      padding: 8px;
      padding-left: 1px;
      padding-right: 2px;
    }
  </style>
</head>

<body>
  <p id="t" class="intro" style="margin: 4px; margin-left: 20px">The element</p>
  <p id="b" class="box">A rule's family</p>
  <p id="p" style="padding: 8px; padding-left: 0">An inline family</p>
  <p id="d">Sides first, then the shorthand</p>
  <p id="f" class="fam">A rule's family, promoted</p>
  <p id="g" style="padding: 10px; padding-left: 1px; padding-right: 2px">An inline family, promoted</p>
  <p id="e" style="padding: 10px; padding-left: 1px; padding-right: 2px; padding-bottom: 3px; padding-top: 4px">Every
    side, then one emptied</p>
  <p id="bg" style="background: #eeeeee; background-image: linear-gradient(red, blue)">A background family</p>
  <p id="ft" style="font: 14px serif; font-weight: 700">A font family</p>
  <p id="tr" style="transition: opacity 1s; transition-duration: 2s">A transition family</p>
  <div id="gp" style="display: flex; gap: 4px; row-gap: 8px">A gap family</div>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      const progress = document.getElementById('progress');
      const settle = (ms = 300) => new Promise((resolve) => setTimeout(resolve, ms));
      const deep = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const found = deep(selector, el.shadowRoot);
          if (found) return found;
        }
        return null;
      };
      try {
        const api = window.HtmlEditorOverlay.mount({ theme: 'dark', presets: false, detectScriptContent: false });
        const engine = api.engine;
        api.setEditing(true);
        await engine.whenReady();
        engine.setDockTab('styles');
        const el = document.getElementById('t');
        const site = document.getElementById('site');
        api.select(el);
        await settle(500);
        const sroot = () => deep('heo-styles-panel').shadowRoot;
        // The Spacing card's rows: margin and the sides declared for the element. Opened first.
        sroot().querySelector('heo-section[data-card="spacing"]')?.shadowRoot?.querySelector('.tile')?.click();
        await settle(200);
        const list = () => sroot().querySelector('heo-section[data-card="spacing"] [data-declarations="spacing"]');
        const familyRows = () => Array.from(list()?.querySelectorAll('.family .row') ?? []).map((row) => row.dataset.property).join(',');
        const elsewhereRows = () => Array.from(list()?.querySelectorAll('.fam-elsewhere .row') ?? []).map((row) => row.dataset.property).join(',');
        const noteText = (selector) => list()?.querySelector(selector)?.textContent.replace(/\s+/g, ' ').trim() ?? '';
        const key = (input, name) => input.dispatchEvent(new KeyboardEvent('keydown', { key: name, bubbles: true, composed: true, cancelable: true }));
        /** margin-left's cascade menu: pick a place (by its key's start), then type a value in the row, Enter. */
        const writeVia = async (place, value) => {
          const field = () => list()?.querySelector('.row[data-property="margin-left"] heo-value-field');
          list()?.querySelector('.row[data-property="margin-left"] .dots')?.click();
          await settle(200);
          const rung = Array.from(sroot().querySelectorAll('.pop .ladder > [data-place]')).find((one) => one.dataset.place.startsWith(place));
          (rung?.matches('[role="radio"]') ? rung : rung?.querySelector('[role="radio"]'))?.click();
          await settle(200);
          sroot().querySelector('.pop')?.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true }));
          await settle(200);
          const input = field()?.shadowRoot?.querySelector('input[type="text"]');
          input.focus();
          input.value = value;
          input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
          await settle(100);
          key(input, 'Enter');
          await settle(400);
          input.blur();
          await settle(300);
        };

        progress.textContent = 'sameBlock';
        // Both inline: one family, with the order control.
        results.sameBlock = {
          isOneFamily: familyRows() === 'margin,margin-left' && !elsewhereRows(),
          hasTheOrderControl: list()?.querySelectorAll('.family .side-win').length === 2,
        };

        progress.textContent = 'beatenElsewhere';
        /*
         * The reported case: a class's important margin-left beats the inline one. Inline still holds
         * margin and margin-left, in an order, so they are still one family; the side's note says what
         * wins over the block. It used to be split off, as though it were not inline at all.
         */
        site.textContent += '\n.intro { margin-left: 9px !important; }';
        await settle(500);
        results.beatenElsewhere = {
          staysOneFamily: familyRows() === 'margin,margin-left' && !elsewhereRows(),
          saysWhatWinsOverTheBlock: noteText('.family .side-note') === '.intro wins over this block by the cascade',
        };
        site.textContent = '.intro { color: #222; }';
        await settle(500);

        progress.textContent = 'moved';
        // Written to a new class: the inline side stays where it is (a write never moves a value).
        await writeVia('new-class|', '21px');
        const leftInline = /margin-left:\s*20px/.test(el.getAttribute('style') ?? '') && el.classList.length === 2;
        // Then taken off inline: two blocks, so no order control, but listed under margin with a note.
        engine.overrideStyle('margin-left', '', el);
        await settle(400);
        results.moved = {
          aNewClassWriteLeavesTheInlineSide: leftInline,
          writtenInTheClass: !/margin-left/.test(el.getAttribute('style') ?? '') && el.classList.length === 2,
          listedUnderItsShorthand: !familyRows() && elsewhereRows() === 'margin-left' &&
            Boolean(list()?.querySelector('.family-loose .fam-elsewhere')),
          noOrderControlAcrossBlocks: !list()?.querySelector('.side-win'),
          // Inline beats a class, so the moved value does not show: said, not left silent.
          saysWhichWins: noteText('.fam-elsewhere .side-note') === 'Overridden by margin in inline style',
        };

        progress.textContent = 'back';
        // Back inline, over the class: one block again, one family again.
        await writeVia('inline', '31px');
        results.back = {
          isOneFamilyAgain: familyRows() === 'margin,margin-left' && !elsewhereRows() &&
            /margin-left:\s*31px/.test(el.getAttribute('style') ?? ''),
        };

        progress.textContent = 'shorthandValue';
        /*
         * Picking a common value for the shorthand sets the shorthand, nothing else: the sides its
         * block declares after it stay, and keep winning. It used to move the shorthand last, which
         * rewrote every side, and a rule's CSSOM paint of the shorthand wiped them even on preview.
         */
        const pickCommonValue = async (fieldOf, value) => {
          fieldOf()?.focusInput();
          fieldOf()?.openList();
          await settle(200);
          const option = Array.from(fieldOf()?.shadowRoot?.querySelectorAll('.popup .option') ?? [])
            .find((one) => one.querySelector('.name')?.textContent.trim() === value);
          // Hovering a row previews nothing; the pick commits it.
          option?.click();
          await settle(400);
          return Boolean(option);
        };
        const paddingOf = (id) => () => list()?.querySelector('.row[data-property="padding"] heo-value-field');
        const box = document.getElementById('b');
        const boxRule = document.getElementById('rules').sheet.cssRules[0];
        api.select(box);
        await settle(400);
        const pickedInRule = await pickCommonValue(paddingOf('b'), '4px');
        results.shorthandValue = {
          inARuleTheSideStays: pickedInRule && getComputedStyle(box).paddingLeft === '0px' &&
            getComputedStyle(box).paddingTop === '4px' && familyRows() === 'padding,padding-left',
        };
        engine.undo();
        await settle(300);
        // Previewed and abandoned, the rule is what it was: its side was lost from the page before.
        engine.previewDeclaration({ kind: 'live', rule: boxRule }, 'padding', '2px');
        const previewKeepsTheSide = getComputedStyle(box).paddingLeft === '0px' && getComputedStyle(box).paddingTop === '2px';
        engine.cancelPreview();
        results.shorthandValue.aRulePreviewKeepsTheSide = previewKeepsTheSide &&
          getComputedStyle(box).paddingLeft === '0px' && getComputedStyle(box).paddingTop === '8px';
        const inline = document.getElementById('p');
        api.select(inline);
        await settle(400);
        const pickedInline = await pickCommonValue(paddingOf('p'), '4px');
        results.shorthandValue.inlineTheSideStays = pickedInline &&
          inline.getAttribute('style').replace(/\s+/g, ' ').trim() === 'padding: 4px; padding-left: 0;';
        // The family control is still how the shorthand is made to win.
        list()?.querySelector('.family .side-win:not(.on)')?.click();
        await settle(300);
        results.shorthandValue.theControlStillPromotesTheShorthand =
          /^padding-left: 0;\s*padding: 4px;$/.test(inline.getAttribute('style').trim()) &&
          getComputedStyle(inline).paddingLeft === '4px';

        progress.textContent = 'sidesFirst';
        /*
         * The reported case: sides dragged in the box (padding-bottom 40px, padding-left 30px), then a
         * common value picked for padding. The new shorthand used to be appended, so it came last and
         * overrode both sides. It goes in front of them now: they keep their values and keep winning.
         */
        {
          const d = document.getElementById('d');
          api.select(d);
          await settle(400);
          const box = sroot().querySelector('heo-box-editor');
          box.dispatchEvent(new CustomEvent('box-change', { detail: { declarations: { 'padding-bottom': '40px' } }, bubbles: true, composed: true }));
          await settle();
          box.dispatchEvent(new CustomEvent('box-change', { detail: { declarations: { 'padding-left': '30px' } }, bubbles: true, composed: true }));
          await settle();
          const spacingPadding = () => sroot().querySelector('[data-declarations="spacing"] .row[data-property="padding"] heo-value-field');
          const picked = await pickCommonValue(spacingPadding, '12px');
          const cs = getComputedStyle(d);
          const pressed = Array.from(sroot().querySelectorAll('[data-declarations="spacing"] .family .side-win')).map((one) => one.getAttribute('aria-pressed')).join(',');
          results.sidesFirst = {
            theSidesKeepTheirValues: picked && cs.paddingTop === '12px' && cs.paddingBottom === '40px' && cs.paddingLeft === '30px',
            theFamilyShowsTheSidesWinning: pressed === 'false,true',
          };
        }

        progress.textContent = 'backspace';
        /*
         * Backspace emptying a field must never go on to delete the element. A field taken away
         * under the caret left focus on the page, and the next Backspace, meant for the field,
         * reached the page shortcut that removes the selection. Real key presses: synthetic ones
         * are never handled as the page's own keys.
         */
        {
          let seq = 0;
          const waiters = new Map();
          window.__heoKeysDone = (id) => { waiters.get(id)?.(); waiters.delete(id); };
          const keys = (...names) => new Promise((resolve) => {
            const id = ++seq;
            waiters.set(id, resolve);
            window.__heoPressKeys(JSON.stringify({ id, keys: names }));
          });
          const target = document.getElementById('t');
          api.select(target);
          await settle(400);
          // The colour row, in the Text style card (opened first: cards start closed).
          const textCard = sroot().querySelector('heo-section[data-card="typography"]');
          if (textCard && !textCard.open) textCard.shadowRoot?.querySelector('.tile')?.click();
          await settle(200);
          const field = sroot().querySelector('[data-declarations="typography"] .row[data-property="color"] heo-value-field');
          field?.focusInput();
          await settle(100);
          await keys('Backspace', 'Backspace');
          // The field goes away under the caret, as a re-render can take it: focus falls to the page.
          document.activeElement?.blur?.();
          let node = document.activeElement;
          while (node?.shadowRoot?.activeElement) node = node.shadowRoot.activeElement;
          node?.blur?.();
          await settle(50);
          await keys('Backspace', 'Backspace');
          await settle(200);
          const kept = document.body.contains(target);
          // Past the pause, a Backspace on the page is the page's again: the shortcut still works.
          await settle(1700);
          await keys('Backspace');
          await settle(300);
          results.backspace = {
            erasingAFieldNeverDeletesTheElement: kept,
            thePageShortcutStillWorksAfterAPause: !document.body.contains(target),
          };
          engine.undo();
          await settle(300);
        }

        progress.textContent = 'emptiedSide';
        /*
         * The reported case: padding-left emptied with Backspace in a family of all four sides. The
         * preview had painted it away, so the row was re-read without it and re-added at the bottom,
         * which took the field out from under the caret: nothing committed, and the restore put
         * padding-left back after the others, where it overrode every later padding edit.
         */
        {
          let seq = 0;
          const waiters = new Map();
          window.__heoKeysDone = (id) => { waiters.get(id)?.(); waiters.delete(id); };
          const keys = (...names) => new Promise((resolve) => {
            const id = ++seq;
            waiters.set(id, resolve);
            window.__heoPressKeys(JSON.stringify({ id, keys: names }));
          });
          const e = document.getElementById('e');
          const written = e.getAttribute('style');
          api.select(e);
          await settle(400);
          const rowOrder = () => Array.from(list()?.querySelectorAll('.row') ?? []).map((row) => row.dataset.property).join(',');
          const fieldOf = (property) => list()?.querySelector(`.row[data-property="${property}"] heo-value-field`);
          const order = rowOrder();
          // Cancelled, an emptied side comes back exactly where it was written.
          engine.previewStyle('padding-left', '', e);
          engine.cancelPreview();
          const cancelPutsItBackInPlace = e.getAttribute('style') === written;
          fieldOf('padding-left')?.focusInput();
          await settle(100);
          await keys('Backspace', 'Backspace', 'Backspace', 'Backspace');
          await settle(300);
          const whileEmpty = { order: rowOrder(), field: fieldOf('padding-left') };
          // Leave the field for the shorthand's, as the user did: the removal commits.
          fieldOf('padding')?.focusInput();
          await settle(400);
          const removed = !/padding-left/.test(e.getAttribute('style'));
          fieldOf('padding')?.dispatchEvent(new CustomEvent('value-change', { detail: { value: '20px' }, bubbles: true, composed: true }));
          await settle(400);
          results.emptiedSide = {
            cancelPutsItBackInPlace,
            theRowStaysInPlaceWhileEmpty: whileEmpty.order === order && whileEmpty.field?.draft === '',
            leavingTheFieldRemovesTheSide: removed && !/padding-left/.test(rowOrder()),
            thePaddingThenReachesThatSide: getComputedStyle(e).paddingLeft === '20px' && getComputedStyle(e).paddingRight === '2px',
          };
        }

        progress.textContent = 'promotedShorthand';
        /*
         * The reported case: making the shorthand win showed every side at the shorthand's value, as
         * though the sides had been rewritten. They are still declared with their own values, only
         * beaten: the rows say so, the page shows the shorthand, and promoting the sides brings them back.
         */
        {
          const rowValues = () => Array.from(list()?.querySelectorAll('.family .row') ?? [])
            .map((row) => `${row.dataset.property}=${row.querySelector('heo-value-field')?.value ?? ''}`).join(',');
          const control = (which) => list()?.querySelectorAll('.family > .side-win')[which];
          results.promotedShorthand = {};
          for (const [id, name] of [['g', 'inline'], ['f', 'rule']]) {
            const one = document.getElementById(id);
            api.select(one);
            await settle(400);
            control(0)?.click();
            await settle(400);
            const promoted = rowValues();
            const cs = getComputedStyle(one);
            const shorthandWins = cs.paddingLeft === cs.paddingTop && cs.paddingRight === cs.paddingTop;
            control(1)?.click();
            await settle(400);
            results.promotedShorthand[`${name}SidesKeepTheirOwnValues`] =
              promoted === `padding=${name === 'inline' ? '10px' : '8px'},padding-left=1px,padding-right=2px` && shorthandWins;
            results.promotedShorthand[`${name}SidesComeBackWhenPromoted`] =
              getComputedStyle(one).paddingLeft === '1px' && getComputedStyle(one).paddingRight === '2px';
          }
        }

        progress.textContent = 'everyFamily';
        /*
         * Not only the box shorthands: any shorthand and a part its block declares are one family
         * with the order control. background, font, transition and gap were drawn as unrelated rows,
         * and nothing said or changed which of the two was in charge.
         */
        {
          results.everyFamily = {};
          for (const [id, card, list, shorthand, part, wins] of [
            ['bg', 'surface', 'surface', 'background', 'background-image', (one) => /gradient/.test(getComputedStyle(one).backgroundImage)],
            ['ft', 'typography', 'typography', 'font', 'font-weight', (one) => getComputedStyle(one).fontWeight === '700'],
            ['tr', 'motion', 'transition', 'transition', 'transition-duration', (one) => getComputedStyle(one).transitionDuration === '2s'],
            ['gp', 'flex', 'flex', 'gap', 'row-gap', (one) => getComputedStyle(one).rowGap === '8px'],
          ]) {
            const one = document.getElementById(id);
            api.select(one);
            await settle(400);
            const section = () => sroot().querySelector(`heo-section[data-card="${card}"]`);
            if (!section()?.open) section()?.shadowRoot?.querySelector('.tile')?.click();
            await settle(300);
            const rows = () => sroot().querySelector(`heo-section[data-card="${card}"] [data-declarations="${list}"]`);
            const family = () => Array.from(rows()?.querySelectorAll('.family') ?? [])
              .find((box) => box.querySelector(`.row[data-property="${shorthand}"]`));
            const members = Array.from(family()?.querySelectorAll('.row') ?? []).map((row) => row.dataset.property);
            const partWins = wins(one);
            family()?.querySelectorAll(':scope > .side-win')[0]?.click();
            await settle(400);
            const shorthandWins = !wins(one) && (one.getAttribute('style') ?? '').trim().replace(/;$/, '').split(';').pop().trim().startsWith(`${shorthand}:`);
            family()?.querySelectorAll(':scope > .side-win')[1]?.click();
            await settle(400);
            results.everyFamily[`${shorthand}IsAFamilyWithItsOrder`] =
              members.includes(shorthand) && members.includes(part) && family()?.querySelectorAll(':scope > .side-win').length === 2 &&
              partWins && shorthandWins && wins(one);
            if (!results.everyFamily[`${shorthand}IsAFamilyWithItsOrder`]) {
              results.everyFamily[`${shorthand}Diagnostic`] = JSON.stringify({ members, partWins, shorthandWins, style: one.getAttribute('style') });
            }
            section()?.shadowRoot?.querySelector('.head')?.click();
            await settle(200);
          }
        }
      } catch (e) {
        results.threw = String((e && e.stack) || e);
      }
      results.browserErrors = { ok: errors.length === 0, errors };
      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value === false))
        .map(([name]) => name);
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify({ ...results, failed: results.threw ? ['threw', ...failed] : failed }, null, 2) + ':END';
    })();
  </script>
</body>

</html>
