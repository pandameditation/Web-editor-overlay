<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sources, cards and the controls they share with Tokens</title>
  <!--
    The shared sample (design §8): the prototype's model, as real CSS. Plus the §15 L3 list, so a
    class card has an li to add ::marker to.
  -->
  <style id="site">
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card {
      padding: 12px 16px;
      margin: 0 0 12px;
      color: #1f2937;
      background-color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-transform: none;
      text-align: left;
      opacity: 1;
      display: block;
    }
    .featured { border: 1px solid #a5b4fc; }
    .card.featured { background-color: #eef2ff; }
    .promo .card { color: #3730a3 !important; }
    section p { letter-spacing: 0.01em; }
    @media (max-width: 767px) {
      .cards { grid-template-columns: 1fr; }
      .card { padding: 10px 12px; }
    }
    @media (min-width: 768px) {
      .card { padding: 20px 28px; }
    }
    @media print {
      .card { color: #000000; }
    }
    .card:hover { background-color: #f9fafb; }
    @media (min-width: 768px) {
      .card:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
    }
    .featured:focus-within { outline: 2px solid #6366f1; }
    .featured::before { content: "★"; color: #f59e0b; }
    .item { padding-left: 4px; color: #374151; }
  </style>
</head>
<body>
  <section class="promo">
    <div class="cards">
      <p id="target" class="card featured" style="color: #b91c1c; font-size: 16px">The selected card</p>
      <p class="card">Second</p>
      <p class="card">Third</p>
      <p class="card">Fourth</p>
    </div>
  </section>
  <ul class="list"><li id="item" class="item">An item</li></ul>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));
      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) =>
        requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const deep = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const found = deep(selector, el.shadowRoot);
          if (found) return found;
        }
        return null;
      };
      const settle = async (ms = 250) => {
        await frames();
        await wait(ms);
      };
      try {
        const api = window.HtmlEditorOverlay.mount({
          theme: 'dark',
          presets: false,
          detectScriptContent: false,
        });
        const engine = api.engine;
        api.setEditing(true);
        await engine.whenReady();
        await frames();
        const target = document.getElementById('target');
        const item = document.getElementById('item');
        const siteRule = (selector) =>
          Array.from(document.getElementById('site').sheet.cssRules)
            .find((rule) => rule instanceof CSSStyleRule && rule.selectorText === selector);
        const glyphOf = (button) => button?.querySelector('svg path')?.getAttribute('d') ?? null;
        const ARROW_UP = 'M8 13V3M4 7l4-4 4 4';
        const ARROW_DOWN = 'M8 3v10M4 9l4 4 4-4';

        /* Tokens, re-queried after every render: the panel re-renders on every change. */
        const tokensRoot = () => deep('heo-tokens-panel')?.shadowRoot ?? null;
        const classesSection = () =>
          Array.from(tokensRoot()?.querySelectorAll('heo-section') ?? [])
            .find((section) => section.heading === 'Reusable classes');
        const cardFor = (name) =>
          Array.from(classesSection()?.querySelectorAll('.cls') ?? [])
            .find((card) => card.querySelector(':scope > header .n')?.textContent.trim() === name);
        const openCard = async (name) => {
          if (classesSection() && !classesSection().open) {
            classesSection().shadowRoot.querySelector('.head')?.click();
            await settle(150);
          }
          const header = cardFor(name)?.querySelector(':scope > header');
          if (header && header.getAttribute('aria-expanded') !== 'true') header.click();
          await settle();
          return cardFor(name);
        };
        const rowFor = (card, property) =>
          Array.from(card?.querySelectorAll('.decl:not(.property-adder)') ?? [])
            .find((row) => row.querySelector('.p')?.textContent.trim() === property);
        const commitIn = (row, value) => row?.querySelector('heo-value-field')?.dispatchEvent(
          new CustomEvent('value-change', { detail: { value }, bubbles: true, composed: true }),
        );

        api.select(target);
        engine.setDockTab('tokens');
        await settle(400);

        /* ------------------------------------------------------------------ *
         * Tokens' class card, now built from the shared header, row and adder.
         * ------------------------------------------------------------------ */
        progress.textContent = 'tokens';
        results.tokens = {};
        {
          const historyBefore = engine.history.size;
          let card = await openCard('.card');
          commitIn(rowFor(card, 'font-weight'), '700');
          await settle();
          const edited = getComputedStyle(target).fontWeight === '700';
          // Apply from the card puts the class on an element that does not wear it yet.
          api.select(item);
          await settle(400);
          card = await openCard('.card');
          const apply = Array.from(card?.querySelectorAll('.apply button') ?? [])
            .find((button) => /Apply to selection/.test(button.textContent));
          apply?.click();
          await settle();
          const applied = item.classList.contains('card') && getComputedStyle(item).fontWeight === '700';
          card = cardFor('.card');
          /*
           * The class card keeps editing the class and applying it after the refactor that moved its
           * header, rows and adder into shared pieces (design §6.1): a value typed in a row reaches
           * the page, and Apply still wears the class. The adder is the shared one.
           */
          results.tokens.classCardStillEditsAndApplies =
            edited &&
            applied &&
            Boolean(card?.querySelector('.property-adder[data-heo-part="adder"] input[aria-label="New property"]')) &&
            engine.history.size === historyBefore + 2;
          while (engine.history.size > historyBefore) engine.undo();
          await settle();
          results.tokens.undoRestoredThePage =
            getComputedStyle(target).fontWeight === '600' && !item.classList.contains('card');

          /*
           * Every declaration row on a Tokens card has the !important toggle (Q8), named after the
           * property and the class, and pressing it changes importance in place: the page rule takes
           * the priority, the toggle reads pressed and the field shows the tag.
           */
          api.select(target);
          await settle(400);
          card = await openCard('.card');
          const rows = Array.from(card?.querySelectorAll('.decl:not(.property-adder)') ?? []);
          const everyRowHasOne = rows.length > 3 && rows.every((row) => {
            const toggles = row.querySelectorAll('button.promote[data-heo-part="promote"]');
            const property = row.querySelector('.p')?.textContent.trim();
            return toggles.length === 1 &&
              ['true', 'false'].includes(toggles[0].getAttribute('aria-pressed')) &&
              toggles[0].getAttribute('aria-label') === `!important on ${property} in .card` &&
              glyphOf(toggles[0]) === ARROW_UP;
          });
          const opacityBefore = rowFor(card, 'opacity')?.querySelector('.promote')?.getAttribute('aria-pressed');
          rowFor(card, 'opacity')?.querySelector('.promote')?.click();
          await settle();
          card = cardFor('.card');
          const opacityRow = rowFor(card, 'opacity');
          const field = opacityRow?.querySelector('heo-value-field');
          results.tokens.tokensRowsHaveThePromoteToggle =
            everyRowHasOne &&
            opacityBefore === 'false' &&
            opacityRow?.querySelector('.promote')?.getAttribute('aria-pressed') === 'true' &&
            siteRule('.card')?.style.getPropertyPriority('opacity') === 'important' &&
            field?.important === true &&
            field?.value === '1' &&
            Boolean(field?.shadowRoot?.querySelector('button.imp'));
          // And the tag removes it again, from the same row: the write target is that declaration.
          field?.shadowRoot?.querySelector('button.imp')?.click();
          await settle();
          card = cardFor('.card');
          results.tokens.tagRemovesWhatTheToggleAdded =
            siteRule('.card')?.style.getPropertyPriority('opacity') === '' &&
            rowFor(card, 'opacity')?.querySelector('.promote')?.getAttribute('aria-pressed') === 'false';
          while (engine.history.size > historyBefore) engine.undo();
          await settle();
        }

        /* ------------------------------------------------------------------ *
         * The shorthand side control is not the !important toggle (D6, M8).
         * ------------------------------------------------------------------ */
        progress.textContent = 'promote';
        results.promote = {};
        {
          engine.classes.upsert({
            name: 'pair',
            declarations: { padding: '4px', 'padding-left': '0px' },
            origin: 'user',
          });
          await settle();
          const card = await openCard('.pair');
          const family = () => cardFor('.pair')?.querySelector('.family');
          const sides = Array.from(family()?.querySelectorAll('.side-win') ?? []);
          const toggles = Array.from(card?.querySelectorAll('.promote') ?? []);
          const pressedBefore = sides.findIndex((side) => side.getAttribute('aria-pressed') === 'true');
          // Pressing the side that loses makes it win, and touches no declaration's importance.
          family()?.querySelector('.side-win:not(.on)')?.click();
          await settle();
          const after = Array.from(family()?.querySelectorAll('.side-win') ?? []);
          const pressedAfter = after.findIndex((side) => side.getAttribute('aria-pressed') === 'true');
          const declarations = engine.classes.get('pair')?.declarations ?? {};
          /*
           * Two controls, two glyphs, two jobs: the side control points down ("move last, so it
           * wins") and is never marked as the promote part; the up-arrow toggle sits on each
           * declaration row only; pressing a side flips the winner and adds no !important.
           */
          results.promote.sideControlIsNotThePromoteToggle =
            sides.length === 2 &&
            sides.every((side) =>
              glyphOf(side) === ARROW_DOWN &&
              !side.matches('.promote, [data-heo-part="promote"]') &&
              !side.closest('.decl')) &&
            toggles.length === 2 &&
            toggles.every((toggle) =>
              glyphOf(toggle) === ARROW_UP &&
              Boolean(toggle.closest('.decl')) &&
              toggle.getAttribute('aria-pressed') === 'false') &&
            pressedBefore !== -1 &&
            pressedAfter !== -1 &&
            pressedAfter !== pressedBefore &&
            Object.values(declarations).every((value) => !/!\s*important/i.test(value));
          engine.undo();
          engine.classes.remove('pair');
          await settle();
        }

        /* ------------------------------------------------------------------ *
         * The Styles panel's header: the element and its classes, nothing else (R3).
         * ------------------------------------------------------------------ */
        progress.textContent = 'header';
        {
          api.select(target);
          engine.setDockTab('styles');
          await settle(300);
          const sroot = () => deep('heo-styles-panel').shadowRoot;
          const ident = () => sroot().querySelector('.ident');
          const chips = () => Array.from(ident()?.querySelectorAll('.cchip[data-class]') ?? []);
          const own = Array.from(target.classList).filter((name) => !name.startsWith('heo-'));
          results.header = {
            // Tag chip, id chip, one chip per class in class-list order, and "+": nothing else on the line.
            listsClassesOnly:
              chips().map((chip) => chip.dataset.class).join(',') === own.join(',') &&
              ident()?.querySelector('.line').children.length === own.length + 3 &&
              ident()?.querySelector('.el-chip')?.textContent.trim() === 'p' &&
              ident()?.querySelector('.cchip.id .name')?.textContent.trim() === '#target',
            noStyleAttributeOrMediaChip: !/style=|@media|[≤≥]/.test(ident()?.textContent ?? ''),
          };
          const before = engine.history.size;
          chips().find((chip) => chip.dataset.class === 'featured')?.querySelector('.kill')?.click();
          await settle(120);
          results.header.crossRemovesThatClass =
            !target.classList.contains('featured') && target.classList.contains('card') &&
            engine.history.size === before + 1 &&
            chips().every((chip) => chip.dataset.class !== 'featured');
          engine.undo();
          await settle(120);
          const plus = () => ident()?.querySelector('.cchip.add');
          plus()?.click();
          await settle(150);
          const finderPop = () => ident()?.querySelector('.finderpop');
          const finder = () => finderPop()?.querySelector('heo-value-field');
          const list = () => finder()?.shadowRoot?.querySelector('.popup');
          const opened =
            plus()?.getAttribute('aria-expanded') === 'true' && Boolean(finder()) &&
            sroot().activeElement === finder() &&
            // The old line telling the user to press Enter went with the Create button.
            !/press Enter/i.test(finderPop()?.textContent ?? '');
          finder()?.shadowRoot.querySelector('input')?.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
          await settle(120);
          results.header.plusRevealsTheFinder =
            opened && !finder() && plus()?.getAttribute('aria-expanded') === 'false' &&
            target.classList.contains('featured');
          /*
           * The field and its list of classes are one popover under the "+": the list is drawn
           * inside it rather than hanging from it, and the popover goes when focus or a press goes
           * anywhere else. It used to be a field in the header, left behind when the list closed.
           */
          plus()?.click();
          await settle(200);
          const popBox = finderPop()?.getBoundingClientRect();
          const listBox = list()?.getBoundingClientRect();
          const plusBox = plus()?.getBoundingClientRect();
          results.header.finderIsOnePopoverWithItsList =
            finderPop()?.matches(':popover-open') === true &&
            Boolean(list()) && list().classList.contains('inline') && !list().hasAttribute('popover') &&
            list().querySelectorAll('.option').length > 0 &&
            // The list comes with the field, so there is no chevron to open it again.
            !finder()?.shadowRoot?.querySelector('.trailing .mini[aria-label="Show tokens and values"]') &&
            !finder()?.shadowRoot?.querySelector('.trailing.actionable') &&
            listBox.top >= popBox.top && listBox.bottom <= popBox.bottom + 1 &&
            // Under the header line, or above it when this short window has no room below.
            (popBox.top >= plusBox.bottom || popBox.bottom <= plusBox.top) &&
            popBox.top >= 0 && popBox.bottom <= innerHeight;
          // Across the header line, inside the panel: placed from the "+", it ran past the edge.
          const panelBox = deep('heo-styles-panel').getBoundingClientRect();
          results.header.finderStaysInsideThePanel = popBox.left >= panelBox.left && popBox.right <= panelBox.right;
          /*
           * A name nothing matches: the list says so and offers to make it, the way the Library
           * offers a block, and the "+" beside the field fills in, since it is the way on too.
           */
          {
            const textOf = (el) => el?.textContent.replace(/\s+/g, ' ').trim() ?? '';
            const input = finder()?.shadowRoot?.querySelector('input');
            input.value = 'brand-new';
            input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
            await settle(150);
            const create = () => list()?.querySelector('[data-act="create"]');
            const offered =
              /Nothing matches brand-new\./.test(textOf(list())) &&
              textOf(create()) === 'Create ".brand-new"' &&
              finder()?.shadowRoot?.querySelector('.action')?.classList.contains('ready') === true &&
              !/press Enter/i.test(textOf(list()));
            const before = engine.history.size;
            create()?.click();
            await settle(200);
            results.header.noMatchOffersToCreateTheClass =
              offered && target.classList.contains('brand-new') && engine.history.size === before + 1;
            engine.undo();
            await settle(150);
          }
          // A press elsewhere in the panel closes it; the header has no field left in it.
          sroot().querySelector('heo-section')?.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, composed: true }));
          await settle(150);
          results.header.aPressElsewhereClosesTheFinder = !finderPop() && !ident()?.querySelector('heo-value-field');
          // So does focus moving on: real Tabs out of the finder (a scripted focus() fires no focus
          // events in a window that is not focused, so it would prove nothing either way).
          plus()?.click();
          await settle(250);
          // The keys go to whatever has focus: wait for the field to have it, under a loaded suite.
          for (let i = 0; i < 40 && sroot().activeElement !== finder(); i += 1) await settle(25);
          const wasOpen = Boolean(finderPop()) && sroot().activeElement === finder();
          await new Promise((resolve) => {
            window.__heoKeysDone = () => resolve();
            // Back past the "+" it belongs to, onto the chip before it: out of the finder.
            window.__heoPressKeys(JSON.stringify({ id: 'finder-tab', keys: ['Shift+Tab', 'Shift+Tab'] }));
          });
          await settle(200);
          results.header.focusLeavingClosesTheFinder =
            wasOpen && !finderPop() && plus()?.getAttribute('aria-expanded') === 'false';
        }
        /* ------------------------------------------------------------------ *
         * Sources: where the element's styles are written (R17–R21, R23, R29).
         * ------------------------------------------------------------------ */
        progress.textContent = 'sources';
        {
          const sroot = () => deep('heo-styles-panel').shadowRoot;
          const sources = () => sroot().querySelector('heo-section[heading="Sources"]');
          const card = (key) => sources()?.querySelector(`.cls[data-card="${CSS.escape(key)}"]`);
          const body = (key) => card(key)?.querySelector(':scope > .body');
          const blocks = (key) => Array.from(body(key)?.querySelectorAll(':scope > .block') ?? []);
          const block = (key, name) => body(key)?.querySelector(`:scope > .block[data-block="${CSS.escape(name)}"]`);
          const rowsOf = (scope) =>
            Array.from(scope?.querySelectorAll('.decl:not(.property-adder)') ?? []);
          const rowIn = (scope, property) =>
            rowsOf(scope).find((row) => row.querySelector('.p')?.textContent.trim() === property);
          const key = (el, name) => el?.dispatchEvent(
            new KeyboardEvent('keydown', { key: name, bubbles: true, composed: true, cancelable: true }));
          const typeInto = async (input, text) => {
            input.value = text;
            input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
            await settle(80);
          };
          const model = () => engine.elementModel(target);
          const familyDeclarations = (family) => model().entries
            .filter((entry) => entry.family === family)
            .reduce((sum, entry) => sum + entry.declarations.length, 0);
          const textOf = (el) => el?.textContent.replace(/\s+/g, ' ').trim() ?? '';

          // Tokens' class card, to compare the look against.
          engine.setDockTab('tokens');
          await settle(300);
          const tokensCard = await openCard('.card');
          const tokensHeaderBg = getComputedStyle(tokensCard.querySelector(':scope > header')).backgroundColor;
          const tokensHasAdder = Boolean(tokensCard.querySelector('[data-heo-part="adder"]'));
          api.select(target);
          engine.setDockTab('styles');
          await settle(400);

          /*
           * The header's class name opens its card in a popover under the name, editable there:
           * jumping down to Sources and back up was a round trip for every class edit.
           */
          const chipName = () => sroot().querySelector('.ident .cchip[data-class="featured"] .name');
          chipName()?.click();
          await settle(300);
          const popped = () => sroot().querySelector('.cardpop[data-card-pop=".featured"]');
          const poppedCard = popped()?.querySelector('.cls[data-card=".featured"]');
          const chipBox = chipName()?.getBoundingClientRect();
          const popBox = popped()?.getBoundingClientRect();
          results.header.nameOpensItsCardInAPopover =
            Boolean(poppedCard) && popped()?.matches(':popover-open') === true &&
            poppedCard.querySelector(':scope > header')?.getAttribute('aria-expanded') === 'true' &&
            Boolean(poppedCard.querySelector('heo-value-field[data-property="border"]')) &&
            // Right against the chip, on whichever side has the room: this window is short, and the
            // popover is placed above when there is no room below it.
            (Math.abs(popBox.top - chipBox.bottom) <= 8 || Math.abs(popBox.bottom - chipBox.top) <= 8);
          // One copy of the card: the Sources place says where it went, and holds no rows.
          results.header.theSourcesCopyStepsAside =
            /Open in a popover above/.test(textOf(card('.featured'))) &&
            !card('.featured')?.querySelector('heo-value-field');
          // Edited in place: a value typed there lands in the class's rule.
          const historyBefore = engine.history.size;
          popped()?.querySelector('heo-value-field[data-property="border"]')?.dispatchEvent(
            new CustomEvent('value-change', { detail: { value: '2px solid #a5b4fc' }, bubbles: true, composed: true }));
          await settle(200);
          results.header.thePopoverEditsTheClass =
            engine.history.size === historyBefore + 1 && Boolean(popped()) &&
            siteRule('.featured')?.style.getPropertyValue('border') === '2px solid rgb(165, 180, 252)';
          engine.undo();
          await settle(200);
          // Escape closes it and gives focus back to the name; the Sources card is whole again.
          key(popped(), 'Escape');
          await settle(200);
          results.header.escapeClosesItBackToTheName =
            !popped() && sroot().activeElement === chipName() &&
            Boolean(card('.featured')?.querySelector('heo-value-field[data-property="border"]'));
          // The name is a toggle: pressed while its card is open, it closes it.
          chipName()?.click();
          await settle(250);
          const reopened = Boolean(popped()) && chipName()?.getAttribute('aria-expanded') === 'true';
          chipName()?.click();
          await settle(250);
          results.header.nameIsAToggle =
            reopened && !popped() && chipName()?.getAttribute('aria-expanded') === 'false';
          /*
           * Focus around the card, with the harness's real Tab: opening keeps focus on the name,
           * Tab goes into the card, and closing it from its own header comes back to the name
           * instead of dropping focus on the page.
           */
          {
            let keySeq = 0;
            const keyWaiters = new Map();
            window.__heoKeysDone = (id) => { keyWaiters.get(id)?.(); keyWaiters.delete(id); };
            const keys = (...names) => new Promise((resolve) => {
              const id = ++keySeq;
              keyWaiters.set(id, resolve);
              window.__heoPressKeys(JSON.stringify({ id, keys: names }));
            }).then(() => settle(150));
            const deepFocus = () => {
              let node = document.activeElement;
              while (node?.shadowRoot?.activeElement) node = node.shadowRoot.activeElement;
              return node;
            };
            chipName()?.focus();
            chipName()?.click();
            await settle(250);
            const stays = Boolean(popped()) && deepFocus() === chipName();
            await keys('Tab');
            const intoTheCard = deepFocus() === popped()?.querySelector('.cls > header');
            popped()?.querySelector('.cls > header')?.click();
            await settle(250);
            results.header.openingKeepsFocusOnTheName = stays;
            results.header.tabFromTheNameGoesIntoTheCard = intoTheCard;
            results.header.closingFromTheCardHeaderReturnsToTheName = !popped() && deepFocus() === chipName();
          }

          /*
           * The element's own styles: the tag chip opens its style attribute and its id's rules in
           * the same popover a class name uses; the id chip, quietly tinted, opens only its rules and
           * its cross takes the id off.
           */
          {
            const tag = () => sroot().querySelector('.ident .el-chip');
            const idName = () => sroot().querySelector('.ident .cchip.id .name');
            const ownPop = () => sroot().querySelector('.cardpop[data-card-pop="element"]');
            const idPop = () => sroot().querySelector('.cardpop[data-card-pop="id"]');
            const bg = (el) => (el ? getComputedStyle(el).backgroundColor : '');
            const classChip = sroot().querySelector('.ident .cchip[data-class="card"]');
            results.header.idChipStandsApart =
              bg(idName()?.parentElement) !== bg(tag()) && bg(idName()?.parentElement) !== bg(classChip) &&
              bg(idName()?.parentElement) !== 'rgba(0, 0, 0, 0)' &&
              // The same chip as a class otherwise: its face, size and weight.
              ['fontSize', 'fontWeight', 'fontFamily', 'height'].every((prop) =>
                getComputedStyle(idName())[prop] === getComputedStyle(classChip.querySelector('.name'))[prop]);
            tag()?.click();
            await settle(300);
            results.header.tagOpensTheInlineStyle =
              ownPop()?.matches(':popover-open') === true && tag()?.getAttribute('aria-expanded') === 'true' &&
              Boolean(ownPop()?.querySelector('.cls[data-card="inline"] heo-value-field')) &&
              /Open in a popover above/.test(textOf(card('inline'))) && !card('inline')?.querySelector('heo-value-field');
            key(ownPop(), 'Escape');
            await settle(200);
            results.header.tagIsAToggleAndEscapeReturnsToIt = !ownPop() && sroot().activeElement === tag();
            idName()?.click();
            await settle(300);
            // No rule for #target on this page: the popover says so and offers an adder for one.
            const noRule = Boolean(idPop()?.querySelector('.none [data-heo-part="adder"]')) &&
              /No rule is written for #target yet/.test(textOf(idPop()));
            engine.createDesignRule('#target', { outline: '1px dashed red' });
            await settle(300);
            results.header.idOpensItsRules =
              noRule && idName()?.getAttribute('aria-expanded') === 'true' &&

          const strip = (k) => card(k)?.querySelector('[data-heo-part="strip"]');
          const slotButton = (k, slot) => strip(k)?.querySelector(`[data-slot="${slot}"]`);
          // Counted per condition: a state under a size is its own, a pseudo-element counts with its size.
          const conditionOf = (entry) => {
            const slot = model().slotOf(entry);
            if (!entry.state || entry.state.includes('::')) return slot;
            return slot === 'base' ? `state:${entry.state}` : `state:${entry.state}@${slot}`;
          };
          const slotCount = (k, slot) => model().entries
            .filter((entry) => entry.family === k && conditionOf(entry) === slot)
            .reduce((sum, entry) => sum + entry.declarations.length, 0);
          results.strip = {
            sameComponentInEffectiveAndCards:
              Boolean(sroot().querySelector('[data-heo-part="strip"][data-strip="effective"]')) &&
              strip('.card')?.matches('.slots[role="group"]'),
            countsPerSlot:
              textOf(strip('.card')?.querySelector('.base .c')) === String(slotCount('.card', 'base')) &&
              textOf(slotButton('.card', 'phone')?.querySelector('.c')) === `+${slotCount('.card', 'phone')}` &&
              textOf(slotButton('.card', 'tablet')?.querySelector('.c')) === `+${slotCount('.card', 'tablet')}` &&
              slotCount('.card', 'tablet') === 1 &&
              textOf(slotButton('.card', 'state::hover@tablet')?.querySelector('.c')) === '+1',
            // A size that declares nothing has no button; ⋮ has it.
            emptySizesAreNotOnTheBar: !slotButton('.card', 'laptop') && !slotButton('.card', 'desktop'),
          };
          const notNow = innerWidth < 768 ? slotButton('.card', 'tablet') : slotButton('.card', 'phone');
          const nowButton = innerWidth < 768 ? slotButton('.card', 'phone') : slotButton('.card', 'tablet');
          results.strip.notNowIsDashedNotFaded =
            notNow?.classList.contains('notnow') && !nowButton?.classList.contains('notnow') &&
            getComputedStyle(notNow).borderTopStyle === 'dashed' &&
            getComputedStyle(notNow).opacity === '1' &&
            getComputedStyle(notNow).color === getComputedStyle(nowButton).color;
          // print declares something, so it is on the bar with its count; ⋮ lists only the rest.
          const more = () => strip('.card')?.querySelector('.more');
          more()?.click();
          await settle(200);
          const stripMenu = () => sroot().querySelector('.menu[data-menu="strip-.card"]');
          const menuKeys = Array.from(stripMenu()?.querySelectorAll('.mi[data-key]') ?? []).map((one) => one.dataset.key);
          const onBar = Array.from(strip('.card')?.querySelectorAll('[data-cond]') ?? []).map((one) => one.dataset.cond);
          results.strip.otherMediaIsOnTheBarAndMoreHasTheRest =
            textOf(slotButton('.card', 'other:print')) === 'print+1' &&
            menuKeys.includes('laptop') && menuKeys.includes('state::focus') &&
            !menuKeys.some((one) => onBar.includes(one));
          Array.from(stripMenu()?.querySelectorAll('.mi') ?? []).find((one) => /Add a media query/.test(one.textContent))?.click();
          await settle(200);
          const mediaField = () => stripMenu()?.querySelector('.mfield heo-value-field');
          const mediaInput = () => mediaField()?.shadowRoot?.querySelector('input');
          await settle(150);
          // Offered as it opens: the common queries that are not sizes, by what they answer, and
          // nothing the strip already has (print is under ⋮ already, the widths are its buttons).
          const mediaOptions = () => Array.from(mediaField()?.shadowRoot?.querySelectorAll('.option') ?? [])
            .map((one) => one.textContent.replace(/\s+/g, ' ').trim());
          const openedWith = mediaOptions();
          results.strip.addMediaQuerySuggestsValidQueries =
            sroot().activeElement === mediaField() &&
            openedWith.some((one) => one.includes('@media (prefers-reduced-motion: reduce)')) &&
            openedWith.some((one) => one.includes('@media (prefers-color-scheme: dark)')) &&
            !openedWith.some((one) => /@media print\b/.test(one)) &&
            !openedWith.some((one) => one.includes('(max-width: 767px)'));
          await typeInto(mediaInput(), 'reduced');
          results.strip.addMediaQuerySuggestionsNarrowAsTyped =
            mediaOptions().length >= 1 && mediaOptions().every((one) => /reduced/.test(one));
          before = engine.history.size;
          await typeInto(mediaInput(), 'screen and and');
          key(mediaInput(), 'Enter');
          await settle(200);
          const refused = /isn't a media query this browser understands/.test(textOf(stripMenu()?.querySelector('.mfield')));
          await typeInto(mediaInput(), '(prefers-color-scheme: dark)');
          key(mediaInput(), 'Enter');
          await settle(200);
          results.strip.addMediaQueryValidates =
            refused && !stripMenu() &&
            slotButton('.card', 'other:(prefers-color-scheme: dark)')?.getAttribute('aria-pressed') === 'true' &&
            /Only under @media \(prefers-color-scheme: dark\)/.test(textOf(body('.card')?.querySelector('.slot-hint'))) &&
            engine.history.size === before;
          // Not a size: no width in its wording, and the empty block says "media query".
          const mediaHint = textOf(body('.card')?.querySelector('.slot-hint'));
          results.strip.aPreferenceQueryIsNotWordedAsASize =
            /in effect now|not in effect now/.test(mediaHint) && !/\d+px/.test(mediaHint) &&
            /Nothing under this media query yet/.test(textOf(body('.card')));
          card('.card')?.querySelector('.slots .base')?.click();
          await settle(200);

          /* The !important toggle (R29). */
          const cardRowsAll = () => rowsOf(sources());
          results.promote = {
            ...results.promote,
            isAToggleWithAriaPressed:
              cardRowsAll().length > 10 &&
              cardRowsAll().every((row) =>
                ['true', 'false'].includes(row.querySelector('button.promote')?.getAttribute('aria-pressed'))),
            namesPropertyAndSource:
              rowIn(body('.promo .card'), 'color')?.querySelector('.promote')?.getAttribute('aria-label') === '!important on color in .promo .card' &&
              rowIn(body('.promo .card'), 'color')?.querySelector('.promote')?.getAttribute('aria-pressed') === 'true',
          };
          sroot().querySelector('.rows[data-declarations="effective"] .row[data-property="color"] .dots')?.click();
          await settle(250);
          const lines = Array.from(sroot().querySelectorAll('.pop .c-line'));
          results.promote.presentOnEveryCardRowAndPopoverLine =
            cardRowsAll().every((row) => row.querySelectorAll('.promote').length === 1) &&
            lines.length > 1 && lines.every((line) => line.querySelectorAll('.promote').length === 1);
          key(sroot().querySelector('.pop'), 'Escape');
          await settle(200);
          before = engine.history.size;
          rowIn(body('.card'), 'opacity')?.querySelector('.promote')?.click();
          await settle(200);
          results.promote.togglesImportanceInPlace =
            engine.history.size === before + 1 &&
            siteRule('.card')?.style.getPropertyPriority('opacity') === 'important' &&
            siteRule('.card')?.style.getPropertyValue('opacity') === '1' &&
            rowIn(body('.card'), 'opacity')?.querySelector('.promote')?.getAttribute('aria-pressed') === 'true';
          engine.undo();
          await settle(200);

          /* Keys. */
          cardHeader('.card')?.focus();
          key(cardHeader('.card'), 'Escape');
          await settle(150);
          results.keys.escapeNeverDeselects = engine.selected === target;
          key(cardHeader('.card'), 'Enter');
          await settle(150);
          const enterShut = cardHeader('.card')?.getAttribute('aria-expanded') === 'false';
          key(cardHeader('.card'), 'Enter');
          await settle(150);
          results.keys.cardHeaderEnterToggles =
            enterShut && cardHeader('.card')?.getAttribute('aria-expanded') === 'true';
          // Every control Sources adds shows the focus ring when focused from the keyboard.
          const ring = getComputedStyle(sroot().host).getPropertyValue('--heo-focus-ring').trim();
          const controls = [
            tab('all'),
            cardHeader('.card'),
            slotButton('.card', 'phone'),
            strip('.card')?.querySelector('.more'),
            rowIn(body('.card'), 'opacity')?.querySelector('.promote'),
            rowIn(body('.card'), 'opacity')?.querySelector('.kill'),
            addButton(block('.card', 'base')),
            block('.featured', '::before')?.querySelector('.blabel .kill'),
          ];
          const rings = controls.map((control) => {
            if (!control) return 'missing';
            control.focus();
            const style = getComputedStyle(control);
            return control.matches(':focus-visible') && style.outlineStyle === 'solid' && style.outlineWidth === '2px';
          });
          results.keys.focusRingOnEveryControl = Boolean(ring) && rings.every((one) => one === true);
          if (!results.keys.focusRingOnEveryControl) results.keys.rings = rings;
          sroot().activeElement?.blur();
          /* ---------------------------------------------------------------- *
           * "+ Add state or pseudo-element" (R24, §5.7, §15 M1): nothing is
           * written until the first property lands.
           * ---------------------------------------------------------------- */
          progress.textContent = 'addState';
          const managed = () => document.getElementById('heo-design-rules')?.textContent ?? '';
          const stateAdd = (k) => body(k)?.querySelector(':scope > .block-add .add-prop');
          const stateAdder = (k) => body(k)?.querySelector(':scope > .block-add .property-adder');
          const openAdderOf = (scope) => scope?.querySelector('.property-adder');
          const addState = async (k, state) => {
            stateAdd(k)?.click();
            await settle(150);
            await typeInto(stateAdder(k).querySelector('input'), state);
            key(stateAdder(k).querySelector('input'), 'Enter');
            await settle(250);
          };
          const addProperty = async (scope, property) => {
            const input = openAdderOf(scope())?.querySelector('input');
            await typeInto(input, property);
            key(openAdderOf(scope())?.querySelector('input'), 'Enter');
            await settle(300);
          };
          const beforeOf = (el, property) => getComputedStyle(el, '::before').getPropertyValue(property);
          results.addState = {};
          {
            // Named in the state list, or refused with R24's two messages.
            stateAdd('.card')?.click();
            await settle(150);
            key(stateAdder('.card').querySelector('input'), 'Enter');
            await settle(120);
            const emptyMessage = textOf(stateAdder('.card')?.querySelector('.field-error'));
            await typeInto(stateAdder('.card').querySelector('input'), ':hovr');
            key(stateAdder('.card').querySelector('input'), 'Enter');
            await settle(120);
            const unknown = textOf(stateAdder('.card')?.querySelector('.field-error'));
            const offered = Array.from(stateAdder('.card')?.querySelectorAll('datalist option') ?? [])
              .map((one) => `${one.value} ${one.textContent.trim()}`);
            key(stateAdder('.card')?.querySelector('input'), 'Escape');
            await settle(120);
            results.addState.rejectsUnknownNames =
              emptyMessage === 'Type a state like :hover or a pseudo-element like ::before.' &&
              unknown === ':hovr is not a state or pseudo-element the editor knows.' &&
              offered.length === 11 && offered.includes(':hover state') && offered.includes('::marker pseudo-element') &&
              !stateAdder('.card');
          }
          {
            // A state with no rule: a block with its adder open, and nothing on the page yet.
            const history = engine.history.size;
            const text = managed();
            await addState('.card', ':active');
            const pendingBlock = () => block('.card', ':active');
            const shown = pendingBlock()?.classList.contains('pending') &&
              /No declarations yet\./.test(textOf(pendingBlock()));
            // The export's stylesheets, not its scripts: this page's own script names the selector.
            const exportedCss = Array.from(new DOMParser().parseFromString(api.exportHTML(), 'text/html')
              .querySelectorAll('style')).map((one) => one.textContent).join('\n');
            const nothingYet = engine.history.size === history && managed() === text &&
              !/\.card:active/.test(exportedCss);
            results.addState.stateOpensItsAddProperty =
              Boolean(openAdderOf(pendingBlock())) &&
              sroot().activeElement === openAdderOf(pendingBlock())?.querySelector('input');
            await addProperty(pendingBlock, 'opacity');
            results.addState.pendingStateWritesNothingUntilAPropertyIsAdded =
              shown && nothingYet && engine.history.size === history + 1 &&
              /\.card:active\s*\{[^}]*opacity/.test(managed());
            results.addState.createsTheStateRule =
              Boolean(pendingBlock()) && !pendingBlock().classList.contains('pending') &&
              Boolean(rowIn(pendingBlock(), 'opacity'));
            engine.undo();
            await settle(200);
            // A state that already has declarations opens that block's adder instead.
            await addState('.card', ':hover');
            results.addState.stateOpensItsAddProperty =
              results.addState.stateOpensItsAddProperty &&
              engine.history.size === history &&
              !block('.card', ':hover')?.classList.contains('pending') &&
              sroot().activeElement === openAdderOf(block('.card', ':hover'))?.querySelector('input');
            key(sroot().activeElement, 'Escape');
            await settle(150);
            // Pending blocks belong to the selection they were added for.
            await addState('.card', ':focus');
            const there = Boolean(block('.card', ':focus'));
            api.select(item);
            await settle(250);
            api.select(target);
            await settle(300);
            results.addState.pendingStateIsDroppedOnSelectionChange =
              there && !block('.card', ':focus') && engine.history.size === history;
          }
          {
            // An emptied page rule is reused, rather than a second .card:hover written elsewhere.
            card('.card')?.querySelector('.slots [data-cond="state::hover"]')?.click();
            await settle(150);
            block('.card', ':hover')?.querySelector('.blabel .kill')?.click();
            await settle(250);
            const history = engine.history.size;
            const emptied = siteRule('.card:hover')?.style.length === 0 && !block('.card', ':hover');
            await addState('.card', ':hover');
            const waiting = block('.card', ':hover')?.classList.contains('pending') &&
              sroot().activeElement === openAdderOf(block('.card', ':hover'))?.querySelector('input');
            await addProperty(() => block('.card', ':hover'), 'opacity');
            results.addState.reusesAnExistingEmptyRule =
              emptied && waiting && engine.history.size === history + 1 &&
              /opacity/.test(siteRule('.card:hover')?.style.cssText ?? '') &&
              !/\.card:hover/.test(managed()) &&
              engine.records.some((record) => record.detail?.selector === '.card:hover' && Boolean(record.detail?.rulePath));
            engine.undo();
            engine.undo();
            await settle(250);
          }
          {
            // In the card's current size: a phone :focus is written inside the phone media query.
            card('.card')?.querySelector('.slots [data-slot="phone"]')?.click();
            await settle(150);
            await addState('.card', ':focus');
            await addProperty(() => block('.card', ':focus'), 'opacity');
            const made = engine.rules.list().find((rule) => rule.selector === '.card:focus');
            results.addState.respectsTheCardsSize =
              Boolean(made) && /max-width:\s*767px/.test(made.media ?? '') &&
              /@media \(max-width: 767px\)\s*\{\s*\.card:focus/.test(managed());
            engine.undo();
            card('.card')?.querySelector('.slots .base')?.click();
            await settle(200);
          }
          {
            /*
             * §15 M1: the selected .card.featured already shows a ::before (★, from .featured::before).
             * Adding ::before to .card and then a colour must not add `content`, which would replace
             * the star on this element; the block says why.
             */
            const history = engine.history.size;
            await addState('.card', '::before');
            const draft = openAdderOf(block('.card', '::before'))?.querySelector('input');
            const prefilled = draft?.value === 'content' && draft.selectionStart === 0 && draft.selectionEnd === 7;
            const nothingYet = engine.history.size === history;
            await addProperty(() => block('.card', '::before'), 'color');
            const colour = rowIn(block('.card', '::before'), 'color')?.querySelector('heo-value-field');
            const oneEntry = engine.history.size === history + 1;
            colour?.dispatchEvent(new CustomEvent('value-change', { detail: { value: 'red' }, bubbles: true, composed: true }));
            await settle(250);
            const rule = (/\.card::before\s*\{([^}]*)\}/.exec(managed()) ?? [])[1] ?? '';
            results.addState.beforeKeepsContentFromAnotherRule =
              prefilled && nothingYet && oneEntry &&
              /color:\s*red/.test(rule) && !/content/.test(rule) &&
              beforeOf(target, 'content') === '"★"' &&
              beforeOf(target, 'color') === 'rgb(255, 0, 0)' &&
              textOf(block('.card', '::before')?.querySelector('.block-hint')) ===
                'Not adding content: this element already has a ::before from .featured::before.';
            engine.undo();
            engine.undo();
            await settle(250);
            // Enter takes the offered `content`, which is what makes a new ::before render.
            const second = document.querySelectorAll('.card')[1];
            await addState('.card', '::before');
            key(openAdderOf(block('.card', '::before'))?.querySelector('input'), 'Enter');
            await settle(300);
            results.addState.pseudoStartsWithEmptyContent =
              engine.history.size === history + 1 &&
              /\.card::before\s*\{\s*content:\s*""/.test(managed()) &&
              beforeOf(second, 'content') === '""';
            engine.undo();
            await settle(250);
            // ::after on elements with no other ::after: content "" goes in with the first property.
            await addState('.card', '::after');
            await addProperty(() => block('.card', '::after'), 'color');
            const after = (/\.card::after\s*\{([^}]*)\}/.exec(managed()) ?? [])[1] ?? '';
            results.addState.beforeGetsContentWithItsFirstOtherProperty =
              engine.history.size === history + 1 && /content:\s*""/.test(after) && /color/.test(after);
            engine.undo();
            await settle(250);
          }
          {
            // ::marker: nothing written until a property, and never `content` (it hides the bullet).
            api.select(item);
            await settle(300);
            const history = engine.history.size;
            const text = managed();
            await addState('.item', '::marker');
            const untouched = getComputedStyle(item, '::marker').content === 'normal' &&
              managed() === text && engine.history.size === history && Boolean(block('.item', '::marker'));
            await addProperty(() => block('.item', '::marker'), 'color');
            const marker = (/\.item::marker\s*\{([^}]*)\}/.exec(managed()) ?? [])[1] ?? '';
            results.addState.markerWritesNothingUntilAPropertyIsAdded =
              untouched && engine.history.size === history + 1 && /color/.test(marker) && !/content/.test(marker) &&
              getComputedStyle(item, '::marker').content === 'normal';
            engine.undo();
            api.select(target);
            await settle(300);
          }

          /* ---------------------------------------------------------------- *
           * Detach styles from class (R22).
           * ---------------------------------------------------------------- */
          progress.textContent = 'detach';
          const detachLink = () => Array.from(body('.card')?.querySelectorAll('.actions .link') ?? [])
            .find((one) => one.dataset.act === 'detach');
          const panelText = (choice) => textOf(body('.card')?.querySelector(`.detach [data-choice="${choice}"]`));
          results.detach = {};
          {
            const before = textOf(detachLink());
            const closed = detachLink()?.getAttribute('aria-expanded') === 'false';
            detachLink()?.click();
            await settle(200);
            results.detach.linkIsRenamed =
              before === 'Detach styles from class' && closed &&
              textOf(detachLink()) === 'Never mind' && detachLink()?.getAttribute('aria-expanded') === 'true' &&
              !/Just this element/.test(textOf(sources()));
            results.detach.copyWarnsAboutRulesElsewhere =
              /Rules written for \.card elsewhere \(\.card\.featured, \.promo \.card\) stop applying here\./.test(panelText('copy')) &&
              /its states and sizes included/.test(panelText('copy'));
            results.detach.moveWarnsAboutLostVariants =
              /Its ≤767px, ≥768px, print, :hover rules can't be written inline, so this element loses them\./.test(panelText('move'));
            // Copy: a class with the base, plus one rule per size and state; swapped in place.
            const list = document.createElement('style');
            list.id = 'list-rule';
            list.textContent = '.card:active, .card:focus { text-decoration: underline; }';
            document.head.append(list);
            await settle(200);
            const history = engine.history.size;
            Array.from(body('.card')?.querySelectorAll('.detach [data-choice="copy"] button') ?? [])
              .find((one) => /Copy/.test(one.textContent))?.click();
            await settle(300);
            const fork = Array.from(target.classList).find((name) => name !== 'featured' && name !== 'card');
            const rulesOf = engine.rules.list().filter((rule) => rule.selector.startsWith(`.${fork}`));
            const has = (selector, media) => rulesOf.some((rule) =>
              rule.selector === selector && (media ? (rule.media ?? '').includes(media) : !rule.media));
            results.detach.copyCarriesStatesAndSizes =
              Boolean(fork) && !target.classList.contains('card') && engine.history.size === history + 1 &&
              engine.classes.get(fork)?.declarations.padding === '12px 16px' &&
              has(`.${fork}`, 'max-width') && has(`.${fork}`, 'min-width') && has(`.${fork}`, 'print') &&
              has(`.${fork}:hover`) && has(`.${fork}:hover`, 'min-width') &&
              Boolean(card(`.${fork}`));
            results.detach.copySplitsSelectorLists =
              has(`.${fork}:active`) && has(`.${fork}:focus`) &&
              !rulesOf.some((rule) => rule.selector.includes(','));
            engine.undo();
            list.remove();
            await settle(300);
            // Move: only the unconditional declarations become inline; the class comes off.
            if (detachLink()?.getAttribute('aria-expanded') !== 'true') {
              detachLink()?.click();
              await settle(200);
            }
            const styleBefore = target.getAttribute('style');
            Array.from(body('.card')?.querySelectorAll('.detach [data-choice="move"] button') ?? [])
              .find((one) => /Move/.test(one.textContent))?.click();
            await settle(300);
            results.detach.moveTakesOnlyTheBaseDeclarations =
              !target.classList.contains('card') &&
              target.style.getPropertyValue('padding') === '12px 16px' &&
              target.style.getPropertyValue('font-weight') === '600' &&
              target.style.getPropertyValue('color') === 'rgb(185, 28, 28)' &&
              !target.style.getPropertyValue('box-shadow');
            engine.undo();
            await settle(300);
            results.detach.moveTakesOnlyTheBaseDeclarations =
              results.detach.moveTakesOnlyTheBaseDeclarations &&
              target.classList.contains('card') && target.getAttribute('style') === styleBefore;
          }
        }
        const failed = Object.entries(results)
          .filter(([, group]) => group && typeof group === 'object')
          .filter(([, group]) => Object.values(group).some((value) => value === false))
          .map(([name]) => name);
        document.getElementById('out').textContent =
          'RESULTS:' + JSON.stringify({ ...results, errors, failed }, null, 2) + ':END';
      } catch (e) {
        document.getElementById('out').textContent =
          'RESULTS:' +
          JSON.stringify({ threw: String((e && e.stack) || e), errors, failed: ['threw'] }, null, 2) +
          ':END';
      }
    })();
  </script>
</body>
