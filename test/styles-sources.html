<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Styles cards and the controls they share with Tokens</title>
  <!--
    The shared sample (design §8): the prototype's model, as real CSS. Plus the §15 L3 list, so a
    class card has an li to add ::marker to.
  -->
  <style id="site">
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      padding: 12px 16px;
      margin: 0 0 12px;
      color: #1f2937;
      background-color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-transform: none;
      text-align: left;
      opacity: 1;
      display: block;
    }

    .featured {
      border: 1px solid #a5b4fc;
    }

    .card.featured {
      background-color: #eef2ff;
    }

    .promo .card {
      color: #3730a3 !important;
    }

    section p {
      letter-spacing: 0.01em;
    }

    @media (max-width: 767px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 10px 12px;
      }
    }

    @media (min-width: 768px) {
      .card {
        padding: 20px 28px;
      }
    }

    @media print {
      .card {
        color: #000000;
      }
    }

    .card:hover {
      background-color: #f9fafb;
    }

    @media (min-width: 768px) {
      .card:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    }

    .featured:focus-within {
      outline: 2px solid #6366f1;
    }

    .featured::before {
      content: "★";
      color: #f59e0b;
    }

    .item {
      padding-left: 4px;
      color: #374151;
    }
  </style>
</head>

<body>
  <section class="promo">
    <div class="cards">
      <p id="target" class="card featured" style="color: #b91c1c; font-size: 16px">The selected card</p>
      <p class="card">Second</p>
      <p class="card">Third</p>
      <p class="card">Fourth</p>
    </div>
  </section>
  <ul class="list">
    <li id="item" class="item">An item</li>
  </ul>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script src="sections.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));
      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) =>
        requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const deep = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const found = deep(selector, el.shadowRoot);
          if (found) return found;
        }
        return null;
      };
      const settle = async (ms = 250) => {
        await frames();
        await wait(ms);
      };
      try {
        // `?only=` runs part of the page (test/sections.js).
        const sections = HeoSections.create({
          names: ['tokens', 'promote', 'header', 'sources', 'emptySize', 'addState', 'effective', 'detach'],
          // The cards part writes into the header's group; emptySize into the cards part's.
          needs: { sources: ['header'], emptySize: ['sources'] },
        });
        const api = window.HtmlEditorOverlay.mount({
          theme: 'dark',
          presets: false,
          detectScriptContent: false,
        });
        const engine = api.engine;
        api.setEditing(true);
        await engine.whenReady();
        await frames();
        const target = document.getElementById('target');
        const item = document.getElementById('item');
        const siteRule = (selector) =>
          Array.from(document.getElementById('site').sheet.cssRules)
            .find((rule) => rule instanceof CSSStyleRule && rule.selectorText === selector);
        const glyphOf = (button) => button?.querySelector('svg path')?.getAttribute('d') ?? null;
        const ARROW_UP = 'M8 13V3M4 7l4-4 4 4';
        // The shorthand/sides control's own up glyph: up to a bar, never the !important arrow.
        const PROMOTE_TOP = 'M3.5 2.8h9M8 13.4V6M5 9l3-3 3 3';

        /* Tokens, re-queried after every render: the panel re-renders on every change. */
        const tokensRoot = () => deep('heo-tokens-panel')?.shadowRoot ?? null;
        const classesSection = () =>
          Array.from(tokensRoot()?.querySelectorAll('heo-section') ?? [])
            .find((section) => section.heading === 'Reusable classes');
        const cardFor = (name) =>
          Array.from(classesSection()?.querySelectorAll('.cls') ?? [])
            .find((card) => card.querySelector(':scope > header .n')?.textContent.trim() === name);
        const openCard = async (name) => {
          if (classesSection() && !classesSection().open) {
            classesSection().shadowRoot.querySelector('.head')?.click();
            await settle(150);
          }
          const header = cardFor(name)?.querySelector(':scope > header');
          if (header && header.getAttribute('aria-expanded') !== 'true') header.click();
          await settle();
          return cardFor(name);
        };
        const rowFor = (card, property) =>
          Array.from(card?.querySelectorAll('.decl:not(.property-adder)') ?? [])
            .find((row) => row.querySelector('.p')?.textContent.trim() === property);
        const commitIn = (row, value) => row?.querySelector('heo-value-field')?.dispatchEvent(
          new CustomEvent('value-change', { detail: { value }, bubbles: true, composed: true }),
        );

        api.select(target);
        engine.setDockTab('tokens');
        await settle(400);

        /* ------------------------------------------------------------------ *
         * Tokens' class card, now built from the shared header, row and adder.
         * ------------------------------------------------------------------ */
        if (sections.run('tokens')) {
          results.tokens = {};
          const historyBefore = engine.history.size;
          let card = await openCard('.card');
          commitIn(rowFor(card, 'font-weight'), '700');
          await settle();
          const edited = getComputedStyle(target).fontWeight === '700';
          // Apply from the card puts the class on an element that does not wear it yet.
          api.select(item);
          await settle(400);
          card = await openCard('.card');
          const apply = Array.from(card?.querySelectorAll('.apply button') ?? [])
            .find((button) => /Apply to selection/.test(button.textContent));
          apply?.click();
          await settle();
          const applied = item.classList.contains('card') && getComputedStyle(item).fontWeight === '700';
          card = cardFor('.card');
          /*
           * The class card keeps editing the class and applying it after the refactor that moved its
           * header, rows and adder into shared pieces (design §6.1): a value typed in a row reaches
           * the page, and Apply still wears the class. The adder is the shared one.
           */
          results.tokens.classCardStillEditsAndApplies =
            edited &&
            applied &&
            Boolean(card?.querySelector('.property-adder[data-heo-part="adder"] heo-value-field[field-label="New property"]')) &&
            engine.history.size === historyBefore + 2;
          while (engine.history.size > historyBefore) engine.undo();
          await settle();
          results.tokens.undoRestoredThePage =
            getComputedStyle(target).fontWeight === '600' && !item.classList.contains('card');

          /*
           * Every declaration row on a Tokens card has the !important toggle (Q8), named after the
           * property and the class, and pressing it changes importance in place: the page rule takes
           * the priority, the toggle reads pressed and the field shows the tag.
           */
          api.select(target);
          await settle(400);
          card = await openCard('.card');
          const rows = Array.from(card?.querySelectorAll('.decl:not(.property-adder)') ?? []);
          const everyRowHasOne = rows.length > 3 && rows.every((row) => {
            const toggles = row.querySelectorAll('button.promote[data-heo-part="promote"]');
            const property = row.querySelector('.p')?.textContent.trim();
            return toggles.length === 1 &&
              ['true', 'false'].includes(toggles[0].getAttribute('aria-pressed')) &&
              toggles[0].getAttribute('aria-label') === `!important on ${property} in .card` &&
              glyphOf(toggles[0]) === ARROW_UP;
          });
          const opacityBefore = rowFor(card, 'opacity')?.querySelector('.promote')?.getAttribute('aria-pressed');
          rowFor(card, 'opacity')?.querySelector('.promote')?.click();
          await settle();
          card = cardFor('.card');
          const opacityRow = rowFor(card, 'opacity');
          const field = opacityRow?.querySelector('heo-value-field');
          results.tokens.tokensRowsHaveThePromoteToggle =
            everyRowHasOne &&
            opacityBefore === 'false' &&
            opacityRow?.querySelector('.promote')?.getAttribute('aria-pressed') === 'true' &&
            siteRule('.card')?.style.getPropertyPriority('opacity') === 'important' &&
            field?.important === true &&
            field?.value === '1' &&
            Boolean(field?.shadowRoot?.querySelector('button.imp'));
          // And the tag removes it again, from the same row: the write target is that declaration.
          field?.shadowRoot?.querySelector('button.imp')?.click();
          await settle();
          card = cardFor('.card');
          results.tokens.tagRemovesWhatTheToggleAdded =
            siteRule('.card')?.style.getPropertyPriority('opacity') === '' &&
            rowFor(card, 'opacity')?.querySelector('.promote')?.getAttribute('aria-pressed') === 'false';
          while (engine.history.size > historyBefore) engine.undo();
          await settle();
        }

        /* ------------------------------------------------------------------ *
         * The shorthand side control is not the !important toggle (D6, M8).
         * ------------------------------------------------------------------ */
        if (sections.run('promote')) {
          results.promote = {};
          engine.classes.upsert({
            name: 'pair',
            declarations: { padding: '4px', 'padding-left': '0px' },
            origin: 'user',
          });
          await settle();
          const card = await openCard('.pair');
          const family = () => cardFor('.pair')?.querySelector('.family');
          const sides = Array.from(family()?.querySelectorAll('.side-win') ?? []);
          const toggles = Array.from(card?.querySelectorAll('.promote') ?? []);
          const pressedBefore = sides.findIndex((side) => side.getAttribute('aria-pressed') === 'true');
          // Pressing the side that loses makes it win, and touches no declaration's importance.
          family()?.querySelector('.side-win:not(.on)')?.click();
          await settle();
          const after = Array.from(family()?.querySelectorAll('.side-win') ?? []);
          const pressedAfter = after.findIndex((side) => side.getAttribute('aria-pressed') === 'true');
          const declarations = engine.classes.get('pair')?.declarations ?? {};
          /*
           * Two controls, two glyphs, two jobs: the side control is "up to the top" (promote: this
           * side wins) and is never marked as the promote part; the up-arrow toggle sits on each
           * declaration row only; pressing a side flips the winner and adds no !important.
           */
          results.promote.sideControlIsNotThePromoteToggle =
            sides.length === 2 &&
            sides.every((side) =>
              glyphOf(side) === PROMOTE_TOP &&
              !side.matches('.promote, [data-heo-part="promote"]') &&
              !side.closest('.decl')) &&
            toggles.length === 2 &&
            toggles.every((toggle) =>
              glyphOf(toggle) === ARROW_UP &&
              Boolean(toggle.closest('.decl')) &&
              toggle.getAttribute('aria-pressed') === 'false') &&
            pressedBefore !== -1 &&
            pressedAfter !== -1 &&
            pressedAfter !== pressedBefore &&
            Object.values(declarations).every((value) => !/!\s*important/i.test(value));
          engine.undo();
          engine.classes.remove('pair');
          await settle();
        }

        /* ------------------------------------------------------------------ *
         * The Styles panel's header: the element and its classes, nothing else (R3).
         * ------------------------------------------------------------------ */
        if (sections.run('header')) {
          api.select(target);
          engine.setDockTab('styles');
          await settle(300);
          const sroot = () => deep('heo-styles-panel').shadowRoot;
          const ident = () => sroot().querySelector('.ident');
          const chips = () => Array.from(ident()?.querySelectorAll('.cchip[data-class]') ?? []);
          // By how many elements each styles, fewest first; ties in class-list order.
          const reachOf = (key) => engine.elementModel(target).reach(key);
          const byReach = (keys) => keys.map((one, at) => [one, at]).sort((a, b) => reachOf(a[0]) - reachOf(b[0]) || a[1] - b[1]).map(([one]) => one);
          const own = byReach(Array.from(target.classList).filter((name) => !name.startsWith('heo-')).map((name) => `.${name}`)).map((key) => key.slice(1));
          results.header = {
            // Tag chip, id chip, one chip per class in class-list order, "N rules" and "+".
            listsClassesOnly:
              chips().map((chip) => chip.dataset.class).join(',') === own.join(',') &&
              ident()?.querySelector('.line').children.length === own.length + 4 &&
              ident()?.querySelector('.el-chip')?.textContent.trim() === 'p' &&
              ident()?.querySelector('.cchip.id .name')?.textContent.trim() === '#target',
            noStyleAttributeOrMediaChip: !/style=|@media|[≤≥]/.test(ident()?.textContent ?? ''),
          };
          /*
           * "N rules": the other rules reaching the element.
           * Pressed, it turns into their chips, which stay from selection to selection until the
           * panel closes; each opens its card like a class name, and has no cross.
           */
          {
            const textOf = (el) => el?.textContent.replace(/\s+/g, ' ').trim() ?? '';
            const rulesChip = () => ident()?.querySelector('.cchip.rules');
            const ruleChips = () => Array.from(ident()?.querySelectorAll('.cchip.rule') ?? []);
            const folded = textOf(rulesChip()) === '3 rules' && !ruleChips().length;
            rulesChip()?.click();
            await settle(150);
            const keys = ruleChips().map((one) => one.dataset.rule);
            const chipGone = !rulesChip();
            // A class chip's outline in the uses pill's orange, no cross.
            const styled = ruleChips().every((one) => !one.querySelector('.kill') &&
              getComputedStyle(one).borderTopColor !== getComputedStyle(chips()[0]).borderTopColor &&
              getComputedStyle(one).backgroundColor === getComputedStyle(chips()[0]).backgroundColor);
            const beforeAdd = ruleChips().at(-1)?.nextElementSibling?.classList.contains('add');
            ruleChips()[1]?.querySelector('.name')?.click();
            await settle(300);
            const popped = sroot().querySelector('.cardpop')?.dataset.cardPop === keys[1];
            ruleChips()[1]?.querySelector('.name')?.click();
            await settle(200);
            api.select(item);
            await settle(250);
            api.select(target);
            await settle(300);
            const kept = !rulesChip() && ruleChips().length === 3;
            results.header.chipsAreSortedByReach = own.map((name) => reachOf(`.${name}`)).every((n, at, all) => !at || all[at - 1] <= n) &&
              own.join(',') === 'featured,card';
            results.header.rulesChipShowsTheOtherRules =
              folded && chipGone && keys.join(',') === byReach(['.card.featured', '.promo .card', 'section p']).join(',') &&
              keys.map(reachOf).every((n, at, all) => !at || all[at - 1] <= n) && styled && beforeAdd &&
              popped && !sroot().querySelector('.cardpop') && kept;
          }
          const before = engine.history.size;
          chips().find((chip) => chip.dataset.class === 'featured')?.querySelector('.kill')?.click();
          await settle(120);
          results.header.crossRemovesThatClass =
            !target.classList.contains('featured') && target.classList.contains('card') &&
            engine.history.size === before + 1 &&
            chips().every((chip) => chip.dataset.class !== 'featured');
          engine.undo();
          await settle(120);
          const plus = () => ident()?.querySelector('.cchip.add');
          plus()?.click();
          await settle(150);
          const finderPop = () => ident()?.querySelector('.finderpop');
          const finder = () => finderPop()?.querySelector('heo-value-field');
          const list = () => finder()?.shadowRoot?.querySelector('.popup');
          const opened =
            plus()?.getAttribute('aria-expanded') === 'true' && Boolean(finder()) &&
            sroot().activeElement === finder() &&
            // The old line telling the user to press Enter went with the Create button.
            !/press Enter/i.test(finderPop()?.textContent ?? '');
          finder()?.shadowRoot.querySelector('input')?.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
          await settle(120);
          results.header.plusRevealsTheFinder =
            opened && !finder() && plus()?.getAttribute('aria-expanded') === 'false' &&
            target.classList.contains('featured');
          /*
           * The field and its list of classes are one popover under the "+": the list is drawn
           * inside it rather than hanging from it, and the popover goes when focus or a press goes
           * anywhere else. It used to be a field in the header, left behind when the list closed.
           */
          plus()?.click();
          await settle(200);
          const popBox = finderPop()?.getBoundingClientRect();
          const listBox = list()?.getBoundingClientRect();
          const plusBox = plus()?.getBoundingClientRect();
          results.header.finderIsOnePopoverWithItsList =
            finderPop()?.matches(':popover-open') === true &&
            Boolean(list()) && list().classList.contains('inline') && !list().hasAttribute('popover') &&
            list().querySelectorAll('.option').length > 0 &&
            // The list comes with the field, so there is no chevron to open it again.
            !finder()?.shadowRoot?.querySelector('.trailing .mini[aria-label="Show tokens and values"]') &&
            !finder()?.shadowRoot?.querySelector('.trailing.actionable') &&
            listBox.top >= popBox.top && listBox.bottom <= popBox.bottom + 1 &&
            // Under the header line, or above it when this short window has no room below.
            (popBox.top >= plusBox.bottom || popBox.bottom <= plusBox.top) &&
            popBox.top >= 0 && popBox.bottom <= innerHeight;
          // Across the header line, inside the panel: placed from the "+", it ran past the edge.
          const panelBox = deep('heo-styles-panel').getBoundingClientRect();
          results.header.finderStaysInsideThePanel = popBox.left >= panelBox.left && popBox.right <= panelBox.right;
          /*
           * A name nothing matches: the list says so and offers to make it, the way the Library
           * offers a block, and the "+" beside the field fills in, since it is the way on too.
           */
          {
            const textOf = (el) => el?.textContent.replace(/\s+/g, ' ').trim() ?? '';
            const input = finder()?.shadowRoot?.querySelector('input');
            input.value = 'brand-new';
            input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
            await settle(150);
            const create = () => list()?.querySelector('[data-act="create"]');
            const offered =
              /Nothing matches brand-new\./.test(textOf(list())) &&
              textOf(create()) === 'Create ".brand-new"' &&
              finder()?.shadowRoot?.querySelector('.action')?.classList.contains('ready') === true &&
              !/press Enter/i.test(textOf(list()));
            const before = engine.history.size;
            create()?.click();
            await settle(200);
            results.header.noMatchOffersToCreateTheClass =
              offered && target.classList.contains('brand-new') && engine.history.size === before + 1;
            engine.undo();
            await settle(150);
          }
          // A press elsewhere in the panel closes it; the header has no field left in it.
          sroot().querySelector('heo-section')?.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, composed: true }));
          await settle(150);
          results.header.aPressElsewhereClosesTheFinder = !finderPop() && !ident()?.querySelector('heo-value-field');
          // So does focus moving on: real Tabs out of the finder (a scripted focus() fires no focus
          // events in a window that is not focused, so it would prove nothing either way).
          plus()?.click();
          await settle(250);
          // The keys go to whatever has focus: wait for the field to have it, under a loaded suite.
          for (let i = 0; i < 40 && sroot().activeElement !== finder(); i += 1) await settle(25);
          const wasOpen = Boolean(finderPop()) && sroot().activeElement === finder();
          await new Promise((resolve) => {
            window.__heoKeysDone = () => resolve();
            // Back past the "+" it belongs to, onto the chip before it: out of the finder.
            window.__heoPressKeys(JSON.stringify({ id: 'finder-tab', keys: ['Shift+Tab', 'Shift+Tab'] }));
          });
          await settle(200);
          results.header.focusLeavingClosesTheFinder =
            wasOpen && !finderPop() && plus()?.getAttribute('aria-expanded') === 'false';
        }
        /* ------------------------------------------------------------------ *
         * The cards: where the element's styles are written (R17–R21, R23, R29).
         * ------------------------------------------------------------------ */
        // The helpers the cards part and the sections after it share, run for any of them.
        if (['sources', 'emptySize', 'addState', 'effective', 'detach'].some((name) => sections.wants(name))) {
          const sroot = () => deep('heo-styles-panel').shadowRoot;
          // Every card opens from its chip in the element header, one at a time, in a popover.
          const card = (key) => sroot().querySelector(`.cardpop .cls[data-card="${CSS.escape(key)}"]`);
          const chipOf = (key) => {
            if (key === 'inline') return sroot().querySelector('.ident .el-chip');
            if (/^\.[\w-]+$/.test(key)) return sroot().querySelector(`.ident .cchip[data-class="${CSS.escape(key.slice(1))}"] .name`);
            sroot().querySelector('.ident .cchip.rules')?.click();
            return sroot().querySelector(`.ident .cchip.rule[data-rule="${CSS.escape(key)}"] .name`);
          };
          const pop = async (key) => {
            if (card(key)) return card(key);
            chipOf(key)?.click();
            await settle(250);
            if (!card(key)) chipOf(key)?.click();
            await settle(150);
            return card(key);
          };
          const body = (key) => card(key)?.querySelector(':scope > .body');
          const blocks = (key) => Array.from(body(key)?.querySelectorAll(':scope > .block') ?? []);
          const block = (key, name) => body(key)?.querySelector(`:scope > .block[data-block="${CSS.escape(name)}"]`);
          const rowsOf = (scope) =>
            Array.from(scope?.querySelectorAll('.decl:not(.property-adder)') ?? []);
          const rowIn = (scope, property) =>
            rowsOf(scope).find((row) => row.querySelector('.p')?.textContent.trim() === property);
          const key = (el, name, extra = {}) => el?.dispatchEvent(
            new KeyboardEvent('keydown', { key: name, bubbles: true, composed: true, cancelable: true, ...extra }));
          const typeInto = async (input, text) => {
            input.value = text;
            input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
            await settle(80);
          };
          const model = () => engine.elementModel(target);
          const familyDeclarations = (family) => model().entries
            .filter((entry) => entry.family === family)
            .reduce((sum, entry) => sum + entry.declarations.length, 0);
          const textOf = (el) => el?.textContent.replace(/\s+/g, ' ').trim() ?? '';

          // Tokens' class card, to compare the look against.
          engine.setDockTab('tokens');
          await settle(300);
          const tokensCard = await openCard('.card');
          const tokensHeaderBg = getComputedStyle(tokensCard.querySelector(':scope > header')).backgroundColor;
          const tokensHasAdder = Boolean(tokensCard.querySelector('[data-heo-part="adder"]'));
          api.select(target);
          engine.setDockTab('styles');
          await settle(400);

          // Used by the cards part and by the sections after it.
          const addButton = (scope) => scope?.querySelector(':scope > .block-add .add-prop, :scope .block-add .add-prop');
          // An adder's field, at either step: the name, then the value (not the new-class rung's name).
          const fieldOf = (adder) => adder?.querySelector('heo-value-field:not(.ncname)');
          const inputOf = (adder) => fieldOf(adder)?.shadowRoot?.querySelector('input[type="text"]');
          const stepOf = (adder) => adder?.dataset.step ?? null;
          const strip = (k) => card(k)?.querySelector('[data-heo-part="strip"]');
          const slotButton = (k, slot) => strip(k)?.querySelector(`[data-slot="${slot}"]`);
          if (sections.run('sources')) {
            /*
             * The header's class name opens its card in a popover under the name, editable there:
             * the header is where every card opens from.
             */
            const chipName = () => sroot().querySelector('.ident .cchip[data-class="featured"] .name');
            chipName()?.click();
            await settle(300);
            const popped = () => sroot().querySelector('.cardpop[data-card-pop=".featured"]');
            const poppedCard = popped()?.querySelector('.cls[data-card=".featured"]');
            const chipBox = chipName()?.getBoundingClientRect();
            const popBox = popped()?.getBoundingClientRect();
            results.header.nameOpensItsCardInAPopover =
              Boolean(poppedCard) && popped()?.matches(':popover-open') === true &&
              poppedCard.querySelector(':scope > header')?.getAttribute('aria-expanded') === 'true' &&
              Boolean(poppedCard.querySelector('heo-value-field[data-property="border"]')) &&
              // Right against the chip, on whichever side has the room: this window is short, and the
              // popover is placed above when there is no room below it.
              (Math.abs(popBox.top - chipBox.bottom) <= 8 || Math.abs(popBox.bottom - chipBox.top) <= 8);
            // Edited in place: a value typed there lands in the class's rule.
            const historyBefore = engine.history.size;
            popped()?.querySelector('heo-value-field[data-property="border"]')?.dispatchEvent(

                /its states and sizes included/.test(panelText('copy'));
              results.detach.moveWarnsAboutLostVariants =
                /Its ≤767px, ≥768px, print, :hover rules can't be written inline, so this element loses them\./.test(panelText('move'));
              // Copy: a class with the base, plus one rule per size and state; swapped in place.
              const list = document.createElement('style');
              list.id = 'list-rule';
              list.textContent = '.card:active, .card:focus { text-decoration: underline; }';
              document.head.append(list);
              await settle(200);
              const history = engine.history.size;
              Array.from(body('.card')?.querySelectorAll('.detach [data-choice="copy"] button') ?? [])
                .find((one) => /Copy/.test(one.textContent))?.click();
              await settle(300);
              const fork = Array.from(target.classList).find((name) => name !== 'featured' && name !== 'card');
              const rulesOf = engine.rules.list().filter((rule) => rule.selector.startsWith(`.${fork}`));
              const has = (selector, media) => rulesOf.some((rule) =>
                rule.selector === selector && (media ? (rule.media ?? '').includes(media) : !rule.media));
              results.detach.copyCarriesStatesAndSizes =
                Boolean(fork) && !target.classList.contains('card') && engine.history.size === history + 1 &&
                engine.classes.get(fork)?.declarations.padding === '12px 16px' &&
                has(`.${fork}`, 'max-width') && has(`.${fork}`, 'min-width') && has(`.${fork}`, 'print') &&
                has(`.${fork}:hover`) && has(`.${fork}:hover`, 'min-width') &&
                Boolean(card(`.${fork}`)) && sroot().querySelector('.cardpop')?.dataset.cardPop === `.${fork}`;
              results.detach.copySplitsSelectorLists =
                has(`.${fork}:active`) && has(`.${fork}:focus`) &&
                !rulesOf.some((rule) => rule.selector.includes(','));
              engine.undo();
              list.remove();
              await settle(300);
              await pop('.card');
              // Move: only the unconditional declarations become inline; the class comes off.
              if (detachLink()?.getAttribute('aria-expanded') !== 'true') {
                detachLink()?.click();
                await settle(200);
              }
              const styleBefore = target.getAttribute('style');
              Array.from(body('.card')?.querySelectorAll('.detach [data-choice="move"] button') ?? [])
                .find((one) => /Move/.test(one.textContent))?.click();
              await settle(300);
              results.detach.moveTakesOnlyTheBaseDeclarations =
                !target.classList.contains('card') &&
                target.style.getPropertyValue('padding') === '12px 16px' &&
                target.style.getPropertyValue('font-weight') === '600' &&
                target.style.getPropertyValue('color') === 'rgb(185, 28, 28)' &&
                !target.style.getPropertyValue('box-shadow');
              engine.undo();
              await settle(300);
              results.detach.moveTakesOnlyTheBaseDeclarations =
                results.detach.moveTakesOnlyTheBaseDeclarations &&
                target.classList.contains('card') && target.getAttribute('style') === styleBefore;
            }
          }
        }
        sections.report(results);
        const failed = Object.entries(results)
          .filter(([, group]) => group && typeof group === 'object')
          .filter(([, group]) => Object.values(group).some((value) => value === false))
          .map(([name]) => name);
        document.getElementById('out').textContent =
          'RESULTS:' + JSON.stringify({ ...results, errors, failed }, null, 2) + ':END';
      } catch (e) {
        document.getElementById('out').textContent =
          'RESULTS:' +
          JSON.stringify({ threw: String((e && e.stack) || e), errors, failed: ['threw'] }, null, 2) +
          ':END';
      }
    })();
  </script>
</body>

</html>
