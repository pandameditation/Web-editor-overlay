<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sources, cards and the controls they share with Tokens</title>
  <!--
    The shared sample (design §8): the prototype's model, as real CSS. Plus the §15 L3 list, so a
    class card has an li to add ::marker to.
  -->
  <style id="site">
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card {
      padding: 12px 16px;
      margin: 0 0 12px;
      color: #1f2937;
      background-color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-transform: none;
      text-align: left;
      opacity: 1;
      display: block;
    }
    .featured { border: 1px solid #a5b4fc; }
    .card.featured { background-color: #eef2ff; }
    .promo .card { color: #3730a3 !important; }
    section p { letter-spacing: 0.01em; }
    @media (max-width: 767px) {
      .cards { grid-template-columns: 1fr; }
      .card { padding: 10px 12px; }
    }
    @media (min-width: 768px) {
      .card { padding: 20px 28px; }
    }
    @media print {
      .card { color: #000000; }
    }
    .card:hover { background-color: #f9fafb; }
    @media (min-width: 768px) {
      .card:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
    }
    .featured:focus-within { outline: 2px solid #6366f1; }
    .featured::before { content: "★"; color: #f59e0b; }
    .item { padding-left: 4px; color: #374151; }
  </style>
</head>
<body>
  <section class="promo">
    <div class="cards">
      <p id="target" class="card featured" style="color: #b91c1c; font-size: 16px">The selected card</p>
      <p class="card">Second</p>
      <p class="card">Third</p>
      <p class="card">Fourth</p>
    </div>
  </section>
  <ul class="list"><li id="item" class="item">An item</li></ul>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));
      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) =>
        requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const deep = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const found = deep(selector, el.shadowRoot);
          if (found) return found;
        }
        return null;
      };
      const settle = async (ms = 250) => {
        await frames();
        await wait(ms);
      };
      try {
        const api = window.HtmlEditorOverlay.mount({
          theme: 'dark',
          presets: false,
          detectScriptContent: false,
        });
        const engine = api.engine;
        api.setEditing(true);
        await engine.whenReady();
        await frames();
        const target = document.getElementById('target');
        const item = document.getElementById('item');
        const siteRule = (selector) =>
          Array.from(document.getElementById('site').sheet.cssRules)
            .find((rule) => rule instanceof CSSStyleRule && rule.selectorText === selector);
        const glyphOf = (button) => button?.querySelector('svg path')?.getAttribute('d') ?? null;
        const ARROW_UP = 'M8 13V3M4 7l4-4 4 4';
        const ARROW_DOWN = 'M8 3v10M4 9l4 4 4-4';

        /* Tokens, re-queried after every render: the panel re-renders on every change. */
        const tokensRoot = () => deep('heo-tokens-panel')?.shadowRoot ?? null;
        const classesSection = () =>
          Array.from(tokensRoot()?.querySelectorAll('heo-section') ?? [])
            .find((section) => section.heading === 'Reusable classes');
        const cardFor = (name) =>
          Array.from(classesSection()?.querySelectorAll('.cls') ?? [])
            .find((card) => card.querySelector(':scope > header .n')?.textContent.trim() === name);
        const openCard = async (name) => {
          if (classesSection() && !classesSection().open) {
            classesSection().shadowRoot.querySelector('.head')?.click();
            await settle(150);
          }
          const header = cardFor(name)?.querySelector(':scope > header');
          if (header && header.getAttribute('aria-expanded') !== 'true') header.click();
          await settle();
          return cardFor(name);
        };
        const rowFor = (card, property) =>
          Array.from(card?.querySelectorAll('.decl:not(.property-adder)') ?? [])
            .find((row) => row.querySelector('.p')?.textContent.trim() === property);
        const commitIn = (row, value) => row?.querySelector('heo-value-field')?.dispatchEvent(
          new CustomEvent('value-change', { detail: { value }, bubbles: true, composed: true }),
        );

        api.select(target);
        engine.setDockTab('tokens');
        await settle(400);

        /* ------------------------------------------------------------------ *
         * Tokens' class card, now built from the shared header, row and adder.
         * ------------------------------------------------------------------ */
        progress.textContent = 'tokens';
        results.tokens = {};
        {
          const historyBefore = engine.history.size;
          let card = await openCard('.card');
          commitIn(rowFor(card, 'font-weight'), '700');
          await settle();
          const edited = getComputedStyle(target).fontWeight === '700';
          // Apply from the card puts the class on an element that does not wear it yet.
          api.select(item);
          await settle(400);
          card = await openCard('.card');
          const apply = Array.from(card?.querySelectorAll('.apply button') ?? [])
            .find((button) => /Apply to selection/.test(button.textContent));
          apply?.click();
          await settle();
          const applied = item.classList.contains('card') && getComputedStyle(item).fontWeight === '700';
          card = cardFor('.card');
          /*
           * The class card keeps editing the class and applying it after the refactor that moved its
           * header, rows and adder into shared pieces (design §6.1): a value typed in a row reaches
           * the page, and Apply still wears the class. The adder is the shared one.
           */
          results.tokens.classCardStillEditsAndApplies =
            edited &&
            applied &&
            Boolean(card?.querySelector('.property-adder[data-heo-part="adder"] input[aria-label="New property"]')) &&
            engine.history.size === historyBefore + 2;
          while (engine.history.size > historyBefore) engine.undo();
          await settle();
          results.tokens.undoRestoredThePage =
            getComputedStyle(target).fontWeight === '600' && !item.classList.contains('card');

          /*
           * Every declaration row on a Tokens card has the !important toggle (Q8), named after the
           * property and the class, and pressing it changes importance in place: the page rule takes
           * the priority, the toggle reads pressed and the field shows the tag.
           */
          api.select(target);
          await settle(400);
          card = await openCard('.card');
          const rows = Array.from(card?.querySelectorAll('.decl:not(.property-adder)') ?? []);
          const everyRowHasOne = rows.length > 3 && rows.every((row) => {
            const toggles = row.querySelectorAll('button.promote[data-heo-part="promote"]');
            const property = row.querySelector('.p')?.textContent.trim();
            return toggles.length === 1 &&
              ['true', 'false'].includes(toggles[0].getAttribute('aria-pressed')) &&
              toggles[0].getAttribute('aria-label') === `!important on ${property} in .card` &&
              glyphOf(toggles[0]) === ARROW_UP;
          });
          const opacityBefore = rowFor(card, 'opacity')?.querySelector('.promote')?.getAttribute('aria-pressed');
          rowFor(card, 'opacity')?.querySelector('.promote')?.click();
          await settle();
          card = cardFor('.card');
          const opacityRow = rowFor(card, 'opacity');
          const field = opacityRow?.querySelector('heo-value-field');
          results.tokens.tokensRowsHaveThePromoteToggle =
            everyRowHasOne &&
            opacityBefore === 'false' &&
            opacityRow?.querySelector('.promote')?.getAttribute('aria-pressed') === 'true' &&
            siteRule('.card')?.style.getPropertyPriority('opacity') === 'important' &&
            field?.important === true &&
            field?.value === '1' &&
            Boolean(field?.shadowRoot?.querySelector('button.imp'));
          // And the tag removes it again, from the same row: the write target is that declaration.
          field?.shadowRoot?.querySelector('button.imp')?.click();
          await settle();
          card = cardFor('.card');
          results.tokens.tagRemovesWhatTheToggleAdded =
            siteRule('.card')?.style.getPropertyPriority('opacity') === '' &&
            rowFor(card, 'opacity')?.querySelector('.promote')?.getAttribute('aria-pressed') === 'false';
          while (engine.history.size > historyBefore) engine.undo();
          await settle();
        }

        /* ------------------------------------------------------------------ *
         * The shorthand side control is not the !important toggle (D6, M8).
         * ------------------------------------------------------------------ */
        progress.textContent = 'promote';
        results.promote = {};
        {
          engine.classes.upsert({
            name: 'pair',
            declarations: { padding: '4px', 'padding-left': '0px' },
            origin: 'user',
          });
          await settle();
          const card = await openCard('.pair');
          const family = () => cardFor('.pair')?.querySelector('.family');
          const sides = Array.from(family()?.querySelectorAll('.side-win') ?? []);
          const toggles = Array.from(card?.querySelectorAll('.promote') ?? []);
          const pressedBefore = sides.findIndex((side) => side.getAttribute('aria-pressed') === 'true');
          // Pressing the side that loses makes it win, and touches no declaration's importance.
          family()?.querySelector('.side-win:not(.on)')?.click();
          await settle();
          const after = Array.from(family()?.querySelectorAll('.side-win') ?? []);
          const pressedAfter = after.findIndex((side) => side.getAttribute('aria-pressed') === 'true');
          const declarations = engine.classes.get('pair')?.declarations ?? {};
          /*
           * Two controls, two glyphs, two jobs: the side control points down ("move last, so it
           * wins") and is never marked as the promote part; the up-arrow toggle sits on each
           * declaration row only; pressing a side flips the winner and adds no !important.
           */
          results.promote.sideControlIsNotThePromoteToggle =
            sides.length === 2 &&
            sides.every((side) =>
              glyphOf(side) === ARROW_DOWN &&
              !side.matches('.promote, [data-heo-part="promote"]') &&
              !side.closest('.decl')) &&
            toggles.length === 2 &&
            toggles.every((toggle) =>
              glyphOf(toggle) === ARROW_UP &&
              Boolean(toggle.closest('.decl')) &&
              toggle.getAttribute('aria-pressed') === 'false') &&
            pressedBefore !== -1 &&
            pressedAfter !== -1 &&
            pressedAfter !== pressedBefore &&
            Object.values(declarations).every((value) => !/!\s*important/i.test(value));
          engine.undo();
          engine.classes.remove('pair');
          await settle();
        }

        /* ------------------------------------------------------------------ *
         * The Styles panel's header: the element and its classes, nothing else (R3).
         * ------------------------------------------------------------------ */
        progress.textContent = 'header';
        {
          api.select(target);
          engine.setDockTab('styles');
          await settle(300);
          const sroot = () => deep('heo-styles-panel').shadowRoot;
          const ident = () => sroot().querySelector('.ident');
          const chips = () => Array.from(ident()?.querySelectorAll('.cchip[data-class]') ?? []);
          const own = Array.from(target.classList).filter((name) => !name.startsWith('heo-'));
          results.header = {
            // Tag chip, one chip per class in class-list order, and "+": nothing else on the line.
            listsClassesOnly:
              chips().map((chip) => chip.dataset.class).join(',') === own.join(',') &&
              ident()?.querySelector('.line').children.length === own.length + 2 &&
              ident()?.querySelector('.el-chip')?.textContent.trim() === 'p#target',
            noStyleAttributeOrMediaChip: !/style=|@media|[≤≥]/.test(ident()?.textContent ?? ''),
          };
          const before = engine.history.size;
          chips().find((chip) => chip.dataset.class === 'featured')?.querySelector('.kill')?.click();
          await settle(120);
          results.header.crossRemovesThatClass =
            !target.classList.contains('featured') && target.classList.contains('card') &&
            engine.history.size === before + 1 &&
            chips().every((chip) => chip.dataset.class !== 'featured');
          engine.undo();
          await settle(120);
          const plus = () => ident()?.querySelector('.cchip.add');
          plus()?.click();
          await settle(150);
          const finder = () => ident()?.querySelector('.finder heo-value-field');
          const opened =
            plus()?.getAttribute('aria-expanded') === 'true' && Boolean(finder()) &&
            sroot().activeElement === finder() &&
            /Search the project's classes or type a new name, then press Enter\./.test(ident()?.textContent ?? '');
          finder()?.shadowRoot.querySelector('input')?.dispatchEvent(
            new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
          await settle(120);
          results.header.plusRevealsTheFinder =
            opened && !finder() && plus()?.getAttribute('aria-expanded') === 'false' &&
            target.classList.contains('featured');
        }
        /* ------------------------------------------------------------------ *
         * Sources: where the element's styles are written (R17–R21, R23, R29).
         * ------------------------------------------------------------------ */
        progress.textContent = 'sources';
        {
          const sroot = () => deep('heo-styles-panel').shadowRoot;
          const sources = () => sroot().querySelector('heo-section[heading="Sources"]');
          const card = (key) => sources()?.querySelector(`.cls[data-card="${CSS.escape(key)}"]`);
          const body = (key) => card(key)?.querySelector(':scope > .body');
          const blocks = (key) => Array.from(body(key)?.querySelectorAll(':scope > .block') ?? []);
          const block = (key, name) => body(key)?.querySelector(`:scope > .block[data-block="${CSS.escape(name)}"]`);
          const rowsOf = (scope) =>
            Array.from(scope?.querySelectorAll('.decl:not(.property-adder)') ?? []);
          const rowIn = (scope, property) =>
            rowsOf(scope).find((row) => row.querySelector('.p')?.textContent.trim() === property);
          const key = (el, name) => el?.dispatchEvent(
            new KeyboardEvent('keydown', { key: name, bubbles: true, composed: true, cancelable: true }));
          const typeInto = async (input, text) => {
            input.value = text;
            input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
            await settle(80);
          };
          const model = () => engine.elementModel(target);
          const familyDeclarations = (family) => model().entries
            .filter((entry) => entry.family === family)
            .reduce((sum, entry) => sum + entry.declarations.length, 0);
          const textOf = (el) => el?.textContent.replace(/\s+/g, ' ').trim() ?? '';

          // Tokens' class card, to compare the look against.
          engine.setDockTab('tokens');
          await settle(300);
          const tokensCard = await openCard('.card');
          const tokensHeaderBg = getComputedStyle(tokensCard.querySelector(':scope > header')).backgroundColor;
          const tokensHasAdder = Boolean(tokensCard.querySelector('[data-heo-part="adder"]'));
          api.select(target);
          engine.setDockTab('styles');
          await settle(400);

          /* The header's class name opens its card where it is written. */
          const featuredBefore = sources()?.open;
          sroot().querySelector('.ident .cchip[data-class="featured"] .name')?.click();
          await settle(300);
          results.header.nameOpensItsCard =
            featuredBefore !== undefined &&
            sources()?.open === true &&
            card('.featured')?.querySelector(':scope > header')?.getAttribute('aria-expanded') === 'true' &&
            sroot().activeElement === card('.featured')?.querySelector(':scope > header');

          /* The section and its groups. */
          const headings = Array.from(sroot().querySelectorAll('heo-section')).map((one) => one.heading);
          const dividers = Array.from(sources()?.querySelectorAll('.src-h') ?? []).map((one) => textOf(one));
          const cardKeys = (group) =>
            Array.from(sources()?.querySelectorAll(`.cls[data-group="${group}"]`) ?? []).map((one) => one.dataset.card);
          results.sources = {
            // Second, after Effective styles, and before every category section (R17).
            directlyAfterEffectiveStyles:
              headings[0] === 'Effective styles' && headings[1] === 'Sources',
            // Inline, then classes, then the rest: .card (0,1,0) sits above .card.featured (0,2,0).
            groupsByMeaningNotSpecificity:
              dividers.join('|') === 'Inline style 1|Classes 2|Other rules 3' &&
              cardKeys('classes').join(',') === '.card,.featured' &&
              !/\b(inline|rule|class)\b/.test(textOf(sources()?.querySelector('.cls[data-card=".card"] > header'))),
            classesInClassListOrder:
              cardKeys('classes').join(',') === Array.from(target.classList).map((name) => `.${name}`).join(','),
            otherRulesInFileOrder: cardKeys('rules').join(',') === '.card.featured,.promo .card,section p',
          };

          /* Tabs: All · Inline · Classes · Rules, with counts. */
          const tabs = () => Array.from(sources()?.querySelectorAll('.src-tabs [role="tab"]') ?? []);
          const tab = (name) => sources()?.querySelector(`.src-tabs [data-tab="${name}"]`);
          const labels = tabs().map((one) => textOf(one)).join('|');
          tab('rules')?.click();
          await settle(150);
          const onlyRules = !card('inline') && cardKeys('classes').length === 0 && cardKeys('rules').length === 3 &&
            tab('rules')?.getAttribute('aria-selected') === 'true';
          tab('inline')?.click();
          await settle(150);
          const onlyInline = Boolean(card('inline')) && !cardKeys('classes').length && !cardKeys('rules').length;
          tab('all')?.click();
          await settle(150);
          results.sources.tabsFilterAndCount =
            labels === 'All|Inline 1|Classes 2|Rules 3' && onlyRules && onlyInline &&
            cardKeys('classes').length === 2 && cardKeys('rules').length === 3;
          // Roving: one tab in the tab order, the arrows and Home/End move and select.
          tab('all').focus();
          key(tab('all'), 'ArrowRight');
          await settle(150);
          const right = tab('inline')?.getAttribute('aria-selected') === 'true' && sroot().activeElement === tab('inline');
          key(tab('inline'), 'End');
          await settle(150);
          const end = tab('rules')?.getAttribute('aria-selected') === 'true';
          key(tab('rules'), 'ArrowRight');
          await settle(150);
          const wraps = tab('all')?.getAttribute('aria-selected') === 'true';
          key(tab('all'), 'ArrowLeft');
          await settle(150);
          key(tab('rules'), 'Home');
          await settle(150);
          results.sources.tabsUseArrowKeys =
            right && end && wraps &&
            tab('all')?.getAttribute('aria-selected') === 'true' && sroot().activeElement === tab('all') &&
            tabs().filter((one) => one.tabIndex === 0).length === 1;
          // One Paste CSS, at the bottom of Sources, and none on a card (R17, R20).
          const lastChild = sources()?.lastElementChild;
          results.sources.onePasteButtonAtTheBottom =
            lastChild?.matches('.actions') && textOf(lastChild) === 'Paste CSS…';
          results.sources.noPerCardPaste =
            !Array.from(sources()?.querySelectorAll('.cls button') ?? []).some((one) => /paste/i.test(one.textContent));

          /* Cards: the Tokens class card. */
          const cardHeader = (k) => card(k)?.querySelector(':scope > header');
          const meta = (k) => textOf(cardHeader(k)?.querySelector('.meta'));
          results.cards = {
            useTheTokensClassCard:
              ['.card', '.featured', 'section p', 'inline'].every((k) =>
                Boolean(cardHeader(k)?.querySelector('.n')) && Boolean(cardHeader(k)?.querySelector('.meta')) &&
                getComputedStyle(cardHeader(k)).backgroundColor === tokensHeaderBg),
            // N rules across what is in effect · N× elements the selector matches; none for inline.
            metaCountsRulesAndElements:
              meta('.card') === `${familyDeclarations('.card')} rules · 4×` &&
              meta('.featured') === `${familyDeclarations('.featured')} rules · 1×` &&
              meta('.promo .card') === '1 rule · 4×' &&
              meta('inline') === '2 rules',
          };
          const file = () => cardHeader('section p')?.querySelector('.file');
          const restDisplay = file() ? getComputedStyle(file()).display : 'missing';
          cardHeader('section p').focus();
          await settle(60);
          results.cards.fileOnlyOnHover =
            restDisplay === 'none' && getComputedStyle(file()).display !== 'none' && textOf(file()).length > 0;
          // A disclosure: role button, in the tab order, Enter and Space toggle it.
          const header = () => cardHeader('section p');
          const operable = header()?.getAttribute('role') === 'button' && header()?.tabIndex === 0 &&
            header()?.getAttribute('aria-expanded') === 'true';
          key(header(), 'Enter');
          await settle(120);
          const shut = header()?.getAttribute('aria-expanded') === 'false' && !body('section p');
          key(header(), ' ');
          await settle(120);
          results.cards.headerIsKeyboardOperable =
            operable && shut && header()?.getAttribute('aria-expanded') === 'true' && Boolean(body('section p'));
          const allKeys = Array.from(sources()?.querySelectorAll('.cls[data-card]') ?? []).map((one) => one.dataset.card);
          results.cards.oneCardPerSelectorFamily =
            new Set(allKeys).size === allKeys.length &&
            !allKeys.some((k) => /:/.test(k)) &&
            Boolean(block('.card', ':hover'));
          // A class no readable rule defines gets a card that offers to define it.
          target.classList.add('ghost');
          await settle(300);
          const ghost = card('.ghost');
          const define = Array.from(ghost?.querySelectorAll('button') ?? []).find((one) => /Define \.ghost/.test(one.textContent));
          const offered = ghost?.dataset.group === 'classes' && ghost?.hasAttribute('data-unknown') && Boolean(define);
          define?.click();
          await settle(300);
          results.cards.unknownClassOffersDefine =
            offered && Boolean(engine.classes.get('ghost')) &&
            !card('.ghost')?.hasAttribute('data-unknown') &&
            /No declarations yet\./.test(textOf(card('.ghost')));
          target.classList.remove('ghost');
          engine.classes.remove('ghost');
          await settle(200);

          /* Card bodies. */
          const cardBody = body('.card');
          results.cardBody = {
            // Straight into the declarations: strip, then the base block's rows, no selector label.
            noRepeatedSelectorLabel:
              cardBody?.firstElementChild?.matches('.slots') &&
              cardBody?.children[1]?.matches('.block[data-block="base"]') &&
              cardBody?.children[1]?.firstElementChild?.matches('.decls') &&
              !cardBody?.children[1]?.querySelector('.blabel'),
            statesFollowTheBase:
              blocks('.card').map((one) => one.dataset.block).join(',') === 'base,:hover' &&
              blocks('.featured').map((one) => one.dataset.block).join(',') === 'base,:focus-within,::before' &&
              textOf(block('.featured', '::before')?.querySelector('.kindtxt')) === 'pseudo-element',
          };
          // Picking a size says where it applies and how far it reaches.
          card('.card')?.querySelector('.slots [data-slot="tablet"]')?.click();
          await settle(150);
          const hint = textOf(body('.card')?.querySelector('.slot-hint'));
          results.cardBody.slotHintSaysReach =
            new RegExp(`^Only at ≥768px — ${innerWidth >= 768 ? 'in effect' : 'not'} at ${innerWidth}px\\. Adds to or overrides “All sizes” there, for all 4 elements\\.$`).test(hint) &&
            blocks('.card').map((one) => one.dataset.block).join(',') === 'base,:hover' &&
            Boolean(rowIn(block('.card', ':hover'), 'box-shadow'));
          card('.card')?.querySelector('.slots .base')?.click();
          await settle(150);
          // The trash on a page rule's state block empties it; the rule stays in the file.
          let before = engine.history.size;
          block('.card', ':hover')?.querySelector('.blabel .kill')?.click();
          await settle(200);
          results.cardBody.trashEmptiesAFileRule =
            engine.history.size === before + 1 &&
            Boolean(siteRule('.card:hover')) && siteRule('.card:hover').style.length === 0 &&
            !block('.card', ':hover');
          engine.undo();
          await settle(200);
          // The trash on a rule the editor made removes it.
          engine.addDeclaration({ kind: 'new-rule', selector: '.card:active', media: null }, 'opacity', '0.9');
          await settle(200);
          const active = block('.card', ':active');
          before = engine.history.size;
          active?.querySelector('.blabel .kill')?.click();
          await settle(200);
          results.cardBody.trashRemovesThatRule =
            Boolean(active) && engine.history.size === before + 1 &&
            !engine.rules.list().some((rule) => rule.selector === '.card:active') &&
            !block('.card', ':active');
          engine.undo();
          engine.undo();
          await settle(200);

          /* Card rows write their own declaration. */
          results.cardRows = {
            noDots: !sources()?.querySelector('.cls .dots, .cls .moon'),
          };
          before = engine.history.size;
          const promoColor = () => rowIn(body('.promo .card'), 'color')?.querySelector('heo-value-field');
          promoColor()?.dispatchEvent(new CustomEvent('value-change', { detail: { value: '#123456' }, bubbles: true, composed: true }));
          await settle(200);
          results.cardRows.writeThatDeclarationDirectly =
            engine.history.size === before + 1 &&
            siteRule('.promo .card')?.style.getPropertyValue('color') === 'rgb(18, 52, 86)' &&
            siteRule('.promo .card')?.style.getPropertyPriority('color') === 'important' &&
            target.style.color === 'rgb(185, 28, 28)';
          engine.undo();
          await settle(200);
          const second = document.querySelectorAll('.card')[1];
          const weight = () => rowIn(body('.card'), 'font-weight')?.querySelector('heo-value-field');
          weight()?.dispatchEvent(new CustomEvent('value-input', { detail: { value: '800' }, bubbles: true, composed: true }));
          await settle(150);
          const previewed = getComputedStyle(second).fontWeight === '800';
          before = engine.history.size;
          engine.cancelPreview();
          await settle(150);
          results.cardRows.previewWhileTyping =
            previewed && getComputedStyle(second).fontWeight === '600' && engine.history.size === before &&
            weight()?.value === '600';
          before = engine.history.size;
          rowIn(body('.card'), 'text-transform')?.querySelector('.kill')?.click();
          await settle(200);
          results.cardRows.trashRemovesTheDeclaration =
            engine.history.size === before + 1 &&
            siteRule('.card')?.style.getPropertyValue('text-transform') === '' &&
            !rowIn(body('.card'), 'text-transform');
          engine.undo();
          await settle(200);

          /* The inline card (R21). */
          const inline = () => card('inline');
          const extract = () => Array.from(inline()?.querySelectorAll('.actions button') ?? []).find((one) => /Extract/.test(one.textContent));
          results.inlineCard = {
            listsInlineDeclarations:
              rowsOf(inline()).map((row) => row.querySelector('.p').textContent.trim()).join(',') === 'color,font-size' &&
              textOf(cardHeader('inline')?.querySelector('.n')) === 'Inline style',
          };
          extract()?.click();
          await settle(200);
          results.inlineCard.extractOpensTheDialog =
            textOf(extract()) === 'Extract 2 into a class' &&
            engine.store.value.extraction?.mode === 'class' && engine.store.value.extraction?.element === target;
          engine.cancelExtraction();
          api.select(item);
          await settle(300);
          results.inlineCard.extractDisabledWhenEmpty =
            extract()?.disabled === true && !rowsOf(inline()).length &&
            Boolean(inline()?.querySelector('[data-heo-part="adder"]'));
          api.select(target);
          await settle(300);

          /* One adder everywhere (R23). */
          const addButton = (scope) => scope?.querySelector(':scope > .block-add .add-prop, :scope .block-add .add-prop');
          results.adder = {
            oneComponentEverywhere:
              Boolean(sroot().querySelector('.block-add [data-heo-part="adder"][data-adder="effective"]')) &&
              Boolean(sroot().querySelector('.egroup [data-heo-part="adder"]')) &&
              Boolean(block('.card', 'base')?.querySelector('[data-heo-part="adder"]')) &&
              Boolean(inline()?.querySelector('[data-heo-part="adder"]')) &&
              tokensHasAdder,
          };
          addButton(block('.card', 'base'))?.click();
          await settle(200);
          const cardAdder = () => block('.card', 'base')?.querySelector('.property-adder');
          results.adder.singleDestinationIsText =
            textOf(cardAdder()?.querySelector('.dest .chip.fixed')) === '.card' &&
            textOf(cardAdder()?.querySelector('.dest .reach')) === '· 4 elements' &&
            !cardAdder()?.querySelector('.dest button.chip');
          // Validated with today's messages, and nothing is written while it is refused.
          before = engine.history.size;
          await typeInto(cardAdder().querySelector('input'), 'padding');
          key(cardAdder().querySelector('input'), 'Enter');
          await settle(150);
          const duplicate = textOf(cardAdder()?.querySelector('.field-error'));
          await typeInto(cardAdder().querySelector('input'), '');
          key(cardAdder().querySelector('input'), 'Enter');
          await settle(150);
          const emptyMessage = textOf(cardAdder()?.querySelector('.field-error'));
          results.adder.validatesWithTodaysMessages =
            /padding/.test(duplicate) && /\.card/.test(duplicate) &&
            emptyMessage === 'Type the property to add.' && engine.history.size === before;
          // Seeded with what the element resolves to (section p's 0.01em, here), focused and selected.
          const resolved = getComputedStyle(target).letterSpacing;
          await typeInto(cardAdder().querySelector('input'), 'letter-spacing');
          key(cardAdder().querySelector('input'), 'Enter');
          await settle(300);
          const added = rowIn(block('.card', 'base'), 'letter-spacing')?.querySelector('heo-value-field');
          results.adder.seedsTheResolvedValue =
            engine.history.size === before + 1 &&
            resolved !== 'normal' &&
            siteRule('.card')?.style.getPropertyValue('letter-spacing') === resolved && added?.value === resolved;
          results.adder.focusesTheNewValue = Boolean(added) && sroot().activeElement === added;
          engine.undo();
          await settle(200);
          // Escape closes an adder and leaves nothing behind.
          addButton(block('.card', 'base'))?.click();
          await settle(200);
          await typeInto(cardAdder().querySelector('input'), 'margin');
          before = engine.history.size;
          key(cardAdder().querySelector('input'), 'Escape');
          await settle(200);
          results.adder.escapeCancels =
            !cardAdder() && Boolean(addButton(block('.card', 'base'))) && engine.history.size === before &&
            engine.selected === target;
          // Several destinations: a chip that opens "Write it in", every rule with its reach.
          sroot().querySelector('.block-add [data-adder="effective"]')?.click();
          await settle(200);
          const effAdder = () => sroot().querySelector('.property-adder[data-adder="effective"]');
          const chip = () => effAdder()?.querySelector('.dest button.chip');
          const closedChip = chip()?.getAttribute('aria-haspopup') === 'menu' && chip()?.getAttribute('aria-expanded') === 'false';
          chip()?.click();
          await settle(200);
          const menu = () => sroot().querySelector('.menu[data-menu="dest-effective"]');
          const items = () => Array.from(menu()?.querySelectorAll('.mi') ?? []);
          results.adder.severalDestinationsMakeAMenu =
            closedChip && chip()?.getAttribute('aria-expanded') === 'true' &&
            menu()?.getAttribute('role') === 'menu' &&
            textOf(menu()?.querySelector('.cap')) === 'Write it in' &&
            items().length > 1 && items().every((one) => one.getAttribute('role') === 'menuitemradio') &&
            items()[0].getAttribute('aria-checked') === 'true';
          results.adder.menuListsEveryRuleWithReach =
            items().map((one) => `${textOf(one.querySelector('.lbl'))}|${textOf(one.querySelector('small'))}`).join(';') ===
            'inline style|this element only, every size;.card|4 elements, every size;.featured|1 element, every size;a new class|this element only';
          // Escape inside the menu closes the menu only; the next one closes the adder (keys).
          key(items()[0], 'Escape');
          await settle(200);
          const menuShutFirst = !menu() && Boolean(effAdder());
          key(effAdder()?.querySelector('input'), 'Escape');
          await settle(200);
          results.keys = {
            escapeClosesInnermostFirst: menuShutFirst && !effAdder(),
          };
          // "a new class" makes an automatic class for this element.
          sroot().querySelector('.block-add [data-adder="effective"]')?.click();
          await settle(200);
          chip()?.click();
          await settle(200);
          items().find((one) => textOf(one.querySelector('.lbl')) === 'a new class')?.click();
          await settle(200);
          await typeInto(effAdder().querySelector('input'), 'letter-spacing');
          const classesBefore = Array.from(target.classList);
          before = engine.history.size;
          key(effAdder().querySelector('input'), 'Enter');
          await settle(300);
          const fresh = Array.from(target.classList).filter((name) => !classesBefore.includes(name));
          results.adder.newClassDestinationMakesAnAutomaticClass =
            fresh.length === 1 && engine.isAutomaticClass(fresh[0], target) && engine.history.size === before + 1;
          engine.undo();
          await settle(200);
          // A size with no rule for the family yet: the adder creates the media rule.
          card('.featured')?.querySelector('.slots [data-slot="phone"]')?.click();
          await settle(200);
          addButton(block('.featured', 'base'))?.click();
          await settle(200);
          const featuredAdder = () => block('.featured', 'base')?.querySelector('.property-adder');
          const featuredChip = textOf(featuredAdder()?.querySelector('.dest .chip.fixed'));
          await typeInto(featuredAdder().querySelector('input'), 'outline-offset');
          before = engine.history.size;
          key(featuredAdder().querySelector('input'), 'Enter');
          await settle(300);
          const made = engine.rules.list().find((rule) => rule.selector === '.featured' && rule.media);
          results.adder.createsTheMediaRuleWhenMissing =
            featuredChip === '.featured ≤767px' && engine.history.size === before + 1 &&
            Boolean(made) && /max-width:\s*767px/.test(made.media) && 'outline-offset' in made.declarations &&
            Boolean(rowIn(block('.featured', 'base'), 'outline-offset'));
          engine.undo();
          card('.featured')?.querySelector('.slots .base')?.click();
          await settle(200);

          /* The size strip (R12). */
          const strip = (k) => card(k)?.querySelector('[data-heo-part="strip"]');
          const slotButton = (k, slot) => strip(k)?.querySelector(`[data-slot="${slot}"]`);
          const slotCount = (k, slot) => model().entries
            .filter((entry) => entry.family === k && model().slotOf(entry) === slot)
            .reduce((sum, entry) => sum + entry.declarations.length, 0);
          results.strip = {
            sameComponentInEffectiveAndCards:
              Boolean(sroot().querySelector('[data-heo-part="strip"][data-strip="effective"]')) &&
              strip('.card')?.matches('.slots[role="group"]'),
            countsPerSlot:
              textOf(strip('.card')?.querySelector('.base .c')) === String(slotCount('.card', 'base')) &&
              textOf(slotButton('.card', 'phone')?.querySelector('.c')) === `+${slotCount('.card', 'phone')}` &&
              textOf(slotButton('.card', 'tablet')?.querySelector('.c')) === `+${slotCount('.card', 'tablet')}` &&
              slotCount('.card', 'tablet') === 2,
            emptySlotShowsPlainPlus:
              slotButton('.card', 'laptop')?.classList.contains('empty') &&
              textOf(slotButton('.card', 'laptop')?.querySelector('.c')) === '+',
          };
          const notNow = innerWidth < 768 ? slotButton('.card', 'tablet') : slotButton('.card', 'phone');
          const nowButton = innerWidth < 768 ? slotButton('.card', 'phone') : slotButton('.card', 'tablet');
          results.strip.notNowIsDashedNotFaded =
            notNow?.classList.contains('notnow') && !nowButton?.classList.contains('notnow') &&
            getComputedStyle(notNow).borderTopStyle === 'dashed' &&
            getComputedStyle(notNow).opacity === '1' &&
            getComputedStyle(notNow).color === getComputedStyle(nowButton).color;
          // print is not a width: it waits under ⋮, counted.
          const more = () => strip('.card')?.querySelector('.more');
          const badge = textOf(more()?.querySelector('.badge'));
          more()?.click();
          await settle(200);
          const stripMenu = () => sroot().querySelector('.menu[data-menu="strip-.card"]');
          const printItem = Array.from(stripMenu()?.querySelectorAll('.mi') ?? []).find((one) => /@media print/.test(one.textContent));
          results.strip.otherMediaUnderMore =
            badge === '1' && !strip('.card')?.querySelector('[data-slot="print"]') &&
            /1 decl\./.test(textOf(printItem));
          Array.from(stripMenu()?.querySelectorAll('.mi') ?? []).find((one) => /Add a media query/.test(one.textContent))?.click();
          await settle(200);
          const mediaInput = () => stripMenu()?.querySelector('.mfield input');
          before = engine.history.size;
          await typeInto(mediaInput(), 'screen and and');
          key(mediaInput(), 'Enter');
          await settle(200);
          const refused = /isn't a media query this browser understands/.test(textOf(stripMenu()?.querySelector('.mfield')));
          await typeInto(mediaInput(), '(prefers-color-scheme: dark)');
          key(mediaInput(), 'Enter');
          await settle(200);
          results.strip.addMediaQueryValidates =
            refused && !stripMenu() && more()?.getAttribute('aria-pressed') === 'true' &&
            /Only at @media \(prefers-color-scheme: dark\)/.test(textOf(body('.card')?.querySelector('.slot-hint'))) &&
            engine.history.size === before;
          card('.card')?.querySelector('.slots .base')?.click();
          await settle(200);

          /* The !important toggle (R29). */
          const cardRowsAll = () => rowsOf(sources());
          results.promote = {
            ...results.promote,
            isAToggleWithAriaPressed:
              cardRowsAll().length > 10 &&
              cardRowsAll().every((row) =>
                ['true', 'false'].includes(row.querySelector('button.promote')?.getAttribute('aria-pressed'))),
            namesPropertyAndSource:
              rowIn(body('.promo .card'), 'color')?.querySelector('.promote')?.getAttribute('aria-label') === '!important on color in .promo .card' &&
              rowIn(body('.promo .card'), 'color')?.querySelector('.promote')?.getAttribute('aria-pressed') === 'true',
          };
          sroot().querySelector('.rows[data-declarations="effective"] .row[data-property="color"] .dots')?.click();
          await settle(250);
          const lines = Array.from(sroot().querySelectorAll('.pop .c-line'));
          results.promote.presentOnEveryCardRowAndPopoverLine =
            cardRowsAll().every((row) => row.querySelectorAll('.promote').length === 1) &&
            lines.length > 1 && lines.every((line) => line.querySelectorAll('.promote').length === 1);
          key(sroot().querySelector('.pop'), 'Escape');
          await settle(200);
          before = engine.history.size;
          rowIn(body('.card'), 'opacity')?.querySelector('.promote')?.click();
          await settle(200);
          results.promote.togglesImportanceInPlace =
            engine.history.size === before + 1 &&
            siteRule('.card')?.style.getPropertyPriority('opacity') === 'important' &&
            siteRule('.card')?.style.getPropertyValue('opacity') === '1' &&
            rowIn(body('.card'), 'opacity')?.querySelector('.promote')?.getAttribute('aria-pressed') === 'true';
          engine.undo();
          await settle(200);

          /* Keys. */
          cardHeader('.card')?.focus();
          key(cardHeader('.card'), 'Escape');
          await settle(150);
          results.keys.escapeNeverDeselects = engine.selected === target;
          key(cardHeader('.card'), 'Enter');
          await settle(150);
          const enterShut = cardHeader('.card')?.getAttribute('aria-expanded') === 'false';
          key(cardHeader('.card'), 'Enter');
          await settle(150);
          results.keys.cardHeaderEnterToggles =
            enterShut && cardHeader('.card')?.getAttribute('aria-expanded') === 'true';
          // Every control Sources adds shows the focus ring when focused from the keyboard.
          const ring = getComputedStyle(sroot().host).getPropertyValue('--heo-focus-ring').trim();
          const controls = [
            tab('all'),
            cardHeader('.card'),
            slotButton('.card', 'phone'),
            strip('.card')?.querySelector('.more'),
            rowIn(body('.card'), 'opacity')?.querySelector('.promote'),
            rowIn(body('.card'), 'opacity')?.querySelector('.kill'),
            addButton(block('.card', 'base')),
            block('.featured', '::before')?.querySelector('.blabel .kill'),
          ];
          const rings = controls.map((control) => {
            if (!control) return 'missing';
            control.focus();
            const style = getComputedStyle(control);
            return control.matches(':focus-visible') && style.outlineStyle === 'solid' && style.outlineWidth === '2px';
          });
          results.keys.focusRingOnEveryControl = Boolean(ring) && rings.every((one) => one === true);
          if (!results.keys.focusRingOnEveryControl) results.keys.rings = rings;
          sroot().activeElement?.blur();
        }
        const failed = Object.entries(results)
          .filter(([, group]) => group && typeof group === 'object')
          .filter(([, group]) => Object.values(group).some((value) => value === false))
          .map(([name]) => name);
        document.getElementById('out').textContent =
          'RESULTS:' + JSON.stringify({ ...results, errors, failed }, null, 2) + ':END';
      } catch (e) {
        document.getElementById('out').textContent =
          'RESULTS:' +
          JSON.stringify({ threw: String((e && e.stack) || e), errors, failed: ['threw'] }, null, 2) +
          ':END';
      }
    })();
  </script>
</body>
</html>
