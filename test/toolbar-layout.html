<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Toolbar and side panels layout</title>
  <style>
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; }
    pre { margin-top: 16px; }
    /* Answered at the room between the docked panels (236px here), not at the window. */
    @media (max-width: 500px) { #second { letter-spacing: 2px; } }
  </style>
</head>
<body>
  <!--
    The toolbar rework: two side panels (the page panel on the left, the selection panel on the
    right), each resizable from its inner edge and movable by its header row; the layout pin;
    the toolbar order, handle and anchoring; the viewport dropdown; and the preview label.
    Groups are added here as each part lands.
  -->
  <main id="page">
    <h1 id="title">Layout probe</h1>
    <p id="first">First paragraph.</p>
    <p id="second">Second paragraph.</p>
  </main>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const errors = [];
      window.addEventListener('error', (e) => errors.push('error: ' + e.message));
      window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + e.reason));
      const results = {};
      const diagnostics = { innerWidth, innerHeight };
      const progress = document.getElementById('progress');
      const twoFrames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      // The pin and D animate their switch (layout-morph.ts): geometry is read once it is over.
      const frames = async () => {
        await twoFrames();
        while (api.engine.layoutAnimation) await api.engine.layoutAnimation;
      };
      const settle = (ms) => new Promise((r) => setTimeout(r, ms));
      const safe = (fn) => { try { return fn(); } catch (err) { errors.push(String(err && err.stack || err)); return false; } };
      const api = window.HtmlEditorOverlay.mount({ theme: 'dark' });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();
      const state = () => engine.store.value;
      // The bar as it first placed itself, before any group moves it or changes what it shows.
      const firstBar = (() => {
        const host = document.querySelector('html-editor-overlay > heo-overlay')?.shadowRoot?.querySelector('heo-toolbar') ?? null;
        const box = host?.getBoundingClientRect();
        return box ? { left: box.left, top: box.top, width: box.width, stored: engine.store.value.toolbar } : null;
      })();

      // Walks every open shadow root, so a test never depends on how deep a control is nested.
      const deepAll = (selector, root = document) => {
        const found = [];
        const walk = (node) => {
          found.push(...node.querySelectorAll(selector));
          for (const el of node.querySelectorAll('*')) if (el.shadowRoot) walk(el.shadowRoot);
        };
        walk(root);
        return found;
      };
      // Re-queried every time: the panels re-render on every store change.
      const dock = (side) => deepAll(`heo-dock[side="${side}"]`)[0] ?? null;
      const inDock = (side, selector) => dock(side)?.shadowRoot.querySelector(selector) ?? null;
      const tabs = (side) => Array.from(dock(side)?.shadowRoot.querySelectorAll('.tab') ?? []);
      const rect = (el) => el?.getBoundingClientRect() ?? null;
      // Every text node and every labelling attribute a user can see or hear, through shadow roots.
      const visibleWords = (root) => {
        const words = [];
        const walk = (node) => {
          for (const el of node.querySelectorAll('*')) {
            for (const name of ['title', 'aria-label', 'placeholder', 'action']) {
              if (el.hasAttribute(name)) words.push(el.getAttribute(name));
            }
            if (el.shadowRoot) walk(el.shadowRoot);
          }
          const texts = document.createTreeWalker(node, NodeFilter.SHOW_TEXT);
          for (let t = texts.nextNode(); t; t = texts.nextNode()) {
            if (!['STYLE', 'SCRIPT'].includes(t.parentNode?.nodeName)) words.push(t.data);
          }
        };
        if (root?.shadowRoot) walk(root.shadowRoot);
        return words.join(' ');
      };
      // Real input: synthetic pointer events do not grant pointer capture, so a drag would not move.
      let inputSeq = 0;
      const inputWaiters = new Map();
      window.__heoKeysDone = (id) => { inputWaiters.get(id)?.(); inputWaiters.delete(id); };
      const trusted = (request) => new Promise((resolve) => {
        const id = ++inputSeq;
        inputWaiters.set(id, resolve);
        window.__heoPressKeys(JSON.stringify({ id, ...request }));
      }).then(frames);
      const drag = (from, to) => trusted({
        mouse: [
          { type: 'hover', x: from.x, y: from.y },
          { type: 'down', x: from.x, y: from.y },
          { type: 'move', x: (from.x + to.x) / 2, y: (from.y + to.y) / 2 },
          { type: 'move', x: to.x, y: to.y },
          { type: 'up', x: to.x, y: to.y },
        ],
      });
      const grabPoint = (side) => {
        const box = rect(inDock(side, '.grab'));
        return { x: Math.round(box.left + box.width / 2), y: Math.round(box.top + box.height / 2) };
      };
      const headerPoint = (side) => {
        const box = rect(inDock(side, 'header .title'));
        return { x: Math.round(box.left + 20), y: Math.round(box.top + box.height / 2) };
      };
      const reset = async () => {
        engine.setLayout('float');
        engine.resetPanelPosition('page');
        engine.resetPanelPosition('selection');
        engine.setPanelWidth('page', 328);
        engine.setPanelWidth('selection', 340);
        api.select(document.getElementById('first'));
        engine.setDockTab('tree');
        engine.setDockTab('styles');
        await frames();
      };

      /* ---------------------------------------------------------------- *
       * Panels. The page's tabs on the left, the selection's on the right, from one table.
       * ---------------------------------------------------------------- */
      progress.textContent = 'panels';
      // The page panel's default width, read before reset() sets one.
      const defaultPageWidth = state().pageWidth;
      await reset();
      // At its default width every page tab fits one line: at 264px SEO wrapped under Layers.
      const pageTabsOnOneLine = defaultPageWidth === 328 && Math.round(rect(dock('page')).width) === 328 &&
        new Set(tabs('page').map((tab) => Math.round(rect(tab).top))).size === 1;
      const KEYS = { Layers: 'E', Blocks: 'B', Tokens: 'T', SEO: 'O', Styles: 'S', Props: 'P', Media: 'M', Code: 'C' };
      const labels = (side) => tabs(side).map((t) => t.getAttribute('aria-label'));
      const pageBox = rect(dock('page'));
      const selectionBox = rect(dock('selection'));
      // Each tab names its tip, the tip carries the tab's key: the tooltip is the only place the
      // panel letters are written down next to the thing they open.
      const tipsCarryKeys = ['page', 'selection'].every((side) => tabs(side).every((tab) => {
        const id = tab.getAttribute('aria-describedby');
        const tipEl = id ? dock(side).shadowRoot.getElementById(id) : null;
        return tipEl?.getAttribute('role') === 'tooltip' && tipEl.contains(tab) === false && tab.contains(tipEl) &&
          tipEl.querySelector('kbd')?.textContent.trim() === KEYS[tab.getAttribute('aria-label')];
      }));
      // Keyboard focus shows a tip, which a title attribute never did.
      const layersTab = tabs('page')[0];
      layersTab.focus();
      await trusted({ keys: ['Tab'] });
      await settle(200);
      const focusedTab = (() => {
        let a = document.activeElement;
        while (a?.shadowRoot?.activeElement) a = a.shadowRoot.activeElement;
        return a;
      })();
      const focusedTip = focusedTab?.querySelector('.tip');
      const tipOnFocus = focusedTab?.getAttribute('aria-label') === 'Blocks' && Boolean(focusedTip) &&
        getComputedStyle(focusedTip).visibility === 'visible';
      // And not before: a tip on every tab at once is noise.
      const otherTip = tabs('page')[2]?.querySelector('.tip');
      const othersHidden = Boolean(otherTip) && getComputedStyle(otherTip).visibility === 'hidden';
      // The tip sits inside the panel: the panel clips its content, and a clipped tip is no tip.
      const tipBox = rect(focusedTip);
      const tipInside = Boolean(tipBox) && tipBox.left >= pageBox.left - 1 && tipBox.right <= pageBox.right + 1;
      focusedTab?.blur();

      const blocksTab = inDock('page', '.tab[data-tab="library"]');
      engine.setDockTab('library');
      await frames();
      await settle(150);
      const blocksWords = visibleWords(deepAll('heo-library-panel')[0]) + ' ' + visibleWords(dock('page'));
      engine.setDockTab('tree');
      await frames();

      results.panels = {
        layersBlocksTokensSeoAreOnTheLeft: safe(() =>
          labels('page').join() === 'Layers,Blocks,Tokens,SEO' && Math.round(pageBox.left) === 14),
        stylesPropsMediaCodeAreOnTheRight: safe(() =>
          labels('selection').join() === 'Styles,Props,Media,Code' && Math.round(innerWidth - selectionBox.right) === 14),
        bothPanelsAreOpenTogether: state().pageOpen && state().dockOpen && Boolean(dock('page')) && Boolean(dock('selection')),
        eachTabTipShowsItsKey: tipsCarryKeys,
        pageTabsFitOneLineAtTheDefaultWidth: pageTabsOnOneLine,
        aTabTipShowsOnKeyboardFocus: tipOnFocus,
        otherTipsStayHidden: othersHidden,
        theTipStaysInsideThePanel: tipInside,
        blocksTabIsNamedBlocks: safe(() =>
          blocksTab.getAttribute('aria-label') === 'Blocks' && blocksTab.querySelector('.label').textContent.trim() === 'Blocks'),
        noUserVisibleLibraryInTheBlocksPanel: blocksWords.length > 40 && !/librar/i.test(blocksWords),
        thePageHeaderNamesThePage: safe(() =>
          inDock('page', '.title .name').textContent.trim() === 'Page' &&
          inDock('page', '.title .target').textContent.trim() === document.title),
        theSelectionHeaderNamesTheTabAndTheElement: safe(() =>
          inDock('selection', '.title .name').textContent.trim() === 'Styles' &&
          /first/i.test(inDock('selection', '.title .target').textContent)),
        closingOneLeavesTheOther: await (async () => {
          inDock('page', 'header button[aria-label="Close panel"]').click();
          await frames();
          const ok = !state().pageOpen && !dock('page') && state().dockOpen && Boolean(dock('selection'));
          engine.setDockTab('tree');
          await frames();
          return ok;
        })(),
      };


      /* ---------------------------------------------------------------- *
       * The toolbar: shared helpers. Re-queried every time, as the bar re-renders on every change.
       * ---------------------------------------------------------------- */
      const bar = () => deepAll('heo-toolbar')[0] ?? null;
      const tb = () => bar()?.shadowRoot ?? null;
      const inBar = (selector) => tb()?.querySelector(selector) ?? null;
      const barButtons = () => Array.from(tb()?.querySelectorAll('.bar button') ?? []);
      const layer = (id) => inBar(`.menu[data-menu="${id}"]`);
      const isOpen = (id) => layer(id)?.matches(':popover-open') === true;
      const centre = (el) => {
        const box = rect(el);
        return { x: Math.round(box.left + box.width / 2), y: Math.round(box.top + box.height / 2) };
      };
      const click = (point) => trusted({
        mouse: [
          { type: 'hover', x: point.x, y: point.y },
          { type: 'down', x: point.x, y: point.y },
          { type: 'up', x: point.x, y: point.y },
        ],
      });
      const deepFocus = () => {
        let a = document.activeElement;
        while (a?.shadowRoot?.activeElement) a = a.shadowRoot.activeElement;
        return a;
      };
      const tipOf = (el) => {
        const id = el?.getAttribute('aria-describedby');
        return id ? tb().getElementById(id) : null;
      };
      // The tip's parts as a reader meets them: the text, each key, the line under it.
      const tipText = (el) => Array.from(tipOf(el)?.querySelectorAll('b, kbd, .s') ?? [])
        .map((part) => part.textContent.trim()).join(' ');
      const closeLayers = async () => {
        for (const id of ['heo', 'viewport', 'sizes']) {
          if (layer(id)) {
            layer(id).dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
          }
        }
        await frames();
      };

      /* ---------------------------------------------------------------- *
       * Anchoring. First, before anything moves the bar: where it places itself.
       * ---------------------------------------------------------------- */
      progress.textContent = 'anchoring';
      await reset();
      await frames();
      diagnostics.firstBar = firstBar;
      const firstBox = rect(bar());
      // Centred on the window at its editing width, at 14px, and not written to the store: only a
      // drag writes the place. The old default (24, 24) sat on top of the page panel.
      const firstPlacement = Boolean(firstBar) && firstBar.stored === null && state().toolbar === null &&
        Math.abs(firstBar.left - Math.max(8, (innerWidth - firstBar.width) / 2)) <= 1 &&
        Math.round(firstBar.top) === 14 && Math.round(firstBox.left) === Math.round(firstBar.left);
      // Edit off and on again: the handle stays, the bar grows to the right.
      api.setEditing(false);
      await frames();
      const offBox = rect(bar());
      const offHandle = rect(inBar('.handle'));
      api.setEditing(true);
      await frames();
      const onBox = rect(bar());
      const onHandle = rect(inBar('.handle'));
      const growsRight = Math.round(offHandle.left) === Math.round(onHandle.left) &&
        Math.round(offBox.left) === Math.round(onBox.left) && onBox.right > offBox.right + 200;
      // Panels opening, closing and switching tab do not move the bar.
      const boxNow = () => JSON.stringify([Math.round(rect(bar()).left), Math.round(rect(bar()).top)]);
      const beforePanels = boxNow();
      engine.setPanelOpen('page', false);
      await frames();
      const afterPageClosed = boxNow();
      engine.setPanelOpen('selection', false);
      await frames();
      const afterBothClosed = boxNow();
      engine.setDockTab('library');
      engine.setDockTab('props');
      await frames();
      const panelsStill = [afterPageClosed, afterBothClosed, boxNow()].every((one) => one === beforePanels);
      // A place the window is now too narrow for (put there in a wider one): shown inside the
      // window, the place itself kept for when there is room again.
      const farX = innerWidth - 200;
      engine.setToolbarPosition(farX, 14);
      await frames();
      const narrowOn = rect(bar());
      const clampedOn = Math.round(narrowOn.right) <= innerWidth - 8 && Math.round(narrowOn.left) < farX;
      window.dispatchEvent(new Event('resize'));
      await frames();
      const resizeKeptX = state().toolbar?.x === farX;
      api.setEditing(false);
      await frames();
      const narrowOff = rect(bar());
      const roomAgain = Math.round(narrowOff.left) === farX;
      api.setEditing(true);
      await frames();
      results.anchoring = {
        theBarCentresItselfFirstAndTheStoreStaysEmpty: firstPlacement,
        editOnGrowsToTheRightAndTheHandleStays: growsRight,
        openingPanelsDoesNotMoveTheBar: panelsStill,
        aNarrowWindowKeepsTheBarOnScreenWithoutForgettingX: clampedOn && resizeKeptX && roomAgain &&
          state().toolbar?.x === farX && Math.round(rect(bar()).left) === Math.round(narrowOn.left),
      };
      engine.setToolbarPosition(Math.round(firstBox.left), 14);
      await reset();

      /* ---------------------------------------------------------------- *
       * The order of the bar, the panel switches and the pin.
       * ---------------------------------------------------------------- */
      progress.textContent = 'order';
      const ORDER = [
        '.handle .grip', 'button[aria-label="HEO menu"]', 'button.toggle', '.selection',
        '[data-menu-anchor="viewport"]', '[data-menu-anchor="sizes"]',
        'button[aria-label="Undo"]', 'button[aria-label="Redo"]', 'button.btn.primary',
        'button[aria-label="Page panel"]', 'button[aria-label="Selection panel"]',
        'button[aria-label="Pin the toolbar and panels to the edges"]',
      ];
      const ordered = ORDER.map((selector) => inBar(selector));
      const inOrder = ordered.every(Boolean) && ordered.every((el, i) =>
        i === 0 || (ordered[i - 1].compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING &&
          rect(el).left >= rect(ordered[i - 1]).right - 1));
      diagnostics.missingInTheBar = ORDER.filter((selector, i) => !ordered[i]);
      const TAB_NAMES = ['Layers', 'Blocks', 'Tokens', 'SEO', 'Styles', 'Props', 'Media', 'Code', 'Settings'];
      const noTabs = !inBar('.tabs') && !barButtons().some((b) => TAB_NAMES.includes(b.getAttribute('aria-label'))) &&
        !barButtons().some((b) => b.hasAttribute('title'));
      api.setEditing(false);
      await frames();
      const offButtons = barButtons().map((b) => b.getAttribute('aria-label'));
      const offOnly = offButtons.join() === 'HEO menu,Edit' && Boolean(inBar('.handle .grip'));
      api.setEditing(true);
      await frames();
      const lastThree = barButtons().slice(-3).map((b) => b.getAttribute('aria-label'));
      // Both open after reset: pressed. Each switch shows or hides its side alone.
      const pageToggle = () => inBar('button[aria-label="Page panel"]');
      const selToggle = () => inBar('button[aria-label="Selection panel"]');
      const pressedAtStart = pageToggle().getAttribute('aria-pressed') === 'true' && selToggle().getAttribute('aria-pressed') === 'true';
      const pageTipWhenOpen = tipText(pageToggle());
      pageToggle().click();
      await frames();
      const pageHidden = !state().pageOpen && state().dockOpen && pageToggle().getAttribute('aria-pressed') === 'false' &&
        selToggle().getAttribute('aria-pressed') === 'true' && !dock('page');
      const pageTipWhenClosed = tipText(pageToggle());
      selToggle().click();
      await frames();
      const selHidden = !state().dockOpen && selToggle().getAttribute('aria-pressed') === 'false' && !dock('selection');
      pageToggle().click();
      selToggle().click();
      await frames();
      const bothBack = state().pageOpen && state().dockOpen && state().pageTab === 'tree' && state().dockTab === 'styles';
      const pin = () => inBar('button[aria-label="Pin the toolbar and panels to the edges"]');
      const pinFloatTip = tipText(pin());
      const pinUnpressed = pin().getAttribute('aria-pressed') === 'false';
      pin().click();
      await frames();
      const pinDocked = state().layout === 'dock' && pin().getAttribute('aria-pressed') === 'true';
      const pinDockTip = tipText(pin());
      pin().click();
      await frames();
      results.order = {
        toolbarControlsInTheAgreedOrder: inOrder,
        noTabButtonsAndNoSettingsInTheBar: noTabs,
        editOffShowsOnlyTheHandleAndEdit: offOnly,
        bothTogglesSitJustBeforeThePin: lastThree.join() === 'Page panel,Selection panel,Pin the toolbar and panels to the edges' &&
          pageToggle().closest('.panels') === selToggle().closest('.panels') &&
          selToggle().closest('.panels')?.nextElementSibling === pin(),
        togglesCarryAriaPressed: pressedAtStart && pageHidden && selHidden && bothBack,
        // The tabs and their keys are on the switch's tip: the bar has no tab buttons any more.
        panelSwitchTipsNameTheTabsAndKeys:
          /^Hide the page panel Layers E · Blocks B · Tokens T · SEO O$/.test(pageTipWhenOpen) &&
          /^Show the page panel/.test(pageTipWhenClosed) &&
          /Styles S · Props P · Media M · Code C$/.test(tipText(selToggle())),
        pinTogglesTheLayout: pinUnpressed && pinDocked && state().layout === 'float' && pin().getAttribute('aria-pressed') === 'false',
        pinTipNamesBothStatesAndD: /^Floating over the page D /.test(pinFloatTip) && /^Docked to the edges D /.test(pinDockTip),
      };
      diagnostics.tips = { pageTipWhenOpen, pageTipWhenClosed, pinFloatTip, pinDockTip };

      /* ---------------------------------------------------------------- *
       * The handle: the grip and H are one control. Click opens the menu, drag moves the bar.
       * ---------------------------------------------------------------- */
      progress.textContent = 'handle';
      await reset();
      engine.setPanelOpen('page', false);
      engine.setPanelOpen('selection', false);
      await frames();
      const hButton = () => inBar('button[aria-label="HEO menu"]');
      const grip = () => inBar('.handle .grip');
      await click(centre(grip()));
      const gripOpens = isOpen('heo') && hButton().getAttribute('aria-expanded') === 'true';
      await click(centre(grip()));
      const gripCloses = !layer('heo') && hButton().getAttribute('aria-expanded') === 'false';
      // A mouse click on H counts once: the press is the handle's, the button's own click is skipped.
      await click(centre(hButton()));
      const hOpens = isOpen('heo');
      const items = () => Array.from(layer('heo')?.querySelectorAll('.mi') ?? []);
      const itemNames = items().map((item) => item.querySelector('.lbl')?.textContent.trim());
      const menuShape = itemNames.join('|') === 'Settings…|Keyboard shortcuts|Leave edit mode' &&
        items().every((item) => item.getAttribute('role') === 'menuitem') &&
        layer('heo')?.getAttribute('role') === 'menu' && Boolean(layer('heo')?.querySelector('hr')) &&
        /⌘E|CtrlE/.test(items()[2]?.querySelector('small')?.textContent ?? '');
      // A press anywhere else closes it.
      await click({ x: Math.round(innerWidth / 2), y: innerHeight - 30 });
      const outsideCloses = !layer('heo');
      // A drag from the grip moves the bar and opens nothing; from H too, and it closes an open menu.
      const startStore = state().toolbar;
      const barAt = rect(bar());
      let at = centre(grip());
      await drag(at, { x: at.x + 60, y: at.y + 30 });
      const barMoved = state().toolbar;
      const dragMoves = barMoved?.x === Math.round(barAt.left) + 60 && barMoved?.y === Math.round(barAt.top) + 30 &&
        !layer('heo') && !bar().hasAttribute('data-dragging');
      // A wobble under the slop is still a click.
      at = centre(grip());
      await trusted({ mouse: [
        { type: 'hover', x: at.x, y: at.y }, { type: 'down', x: at.x, y: at.y },
        { type: 'move', x: at.x + 3, y: at.y }, { type: 'up', x: at.x + 3, y: at.y },
      ] });
      const wobbleOpens = isOpen('heo') && state().toolbar?.x === barMoved?.x;
      at = centre(hButton());
      await drag(at, { x: at.x - 40, y: at.y - 20 });
      const dragClosed = !layer('heo') && state().toolbar?.x === barMoved.x - 40 && state().toolbar?.y === barMoved.y - 20;
      // The keyboard: Enter on H opens it with the first item focused; Escape gives focus back.
      hButton().focus();
      await trusted({ keys: ['Enter'] });
      await frames();
      // And not also the page's Enter, which starts editing the selected element's text.
      const enterOpens = isOpen('heo') && deepFocus()?.querySelector('.lbl')?.textContent.trim() === 'Settings…' && !state().textEditing;
      await trusted({ keys: ['Escape'] });
      await frames();
      const escapeBack = !layer('heo') && deepFocus() === hButton();
      // Settings… opens Settings on General.
      hButton().click();
      await frames();
      items()[0]?.click();
      await frames();
      const settingsOpens = state().aiSettingsOpen && state().settingsCategory === 'general' && !layer('heo');
      engine.setAiSettings(false);
      await frames();
      // Keyboard shortcuts opens the dialog: every panel key, the editing keys and D.
      hButton().click();
      await frames();
      items()[1]?.click();
      await frames();
      await frames();
      const dialog = () => deepAll('heo-shortcuts-dialog')[0]?.shadowRoot ?? null;
      const keysListed = Array.from(dialog()?.querySelectorAll('kbd') ?? []).map((k) => k.textContent.trim());
      const shortcutsShown = state().shortcutsOpen && Boolean(dialog()?.querySelector('[role="dialog"][aria-modal="true"]')) &&
        ['E', 'B', 'T', 'O', 'S', 'P', 'M', 'C', 'D', 'Z'].every((k) => keysListed.includes(k));
      // A letter in the dialog opens nothing and D does not pin.
      dialog()?.querySelector('.close')?.dispatchEvent(new KeyboardEvent('keydown', { key: 'd', bubbles: true, composed: true, cancelable: true }));
      await frames();
      const dIgnored = state().layout === 'float';
      dialog()?.querySelector('.close')?.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
      await frames();
      const escapeClosesDialog = !state().shortcutsOpen && !dialog();
      // Docked: no grip, no drag; H only opens the menu.
      engine.setLayout('dock');
      await frames();
      const dockedNoGrip = !grip();
      const dockedStore = JSON.stringify(state().toolbar);
      at = centre(hButton());
      await drag(at, { x: at.x + 80, y: at.y + 40 });
      const dockedNoDrag = JSON.stringify(state().toolbar) === dockedStore;
      await closeLayers();
      await click(centre(hButton()));
      const dockedOpens = isOpen('heo');
      await closeLayers();
      engine.setLayout('float');
      await frames();
      // Leave edit mode, from the menu.
      hButton().click();
      await frames();
      items()[2]?.click();
      await frames();
      const leaves = !state().editing;
      api.setEditing(true);
      await frames();
      results.handle = {
        clickOnGripOpensTheMenu: gripOpens && gripCloses,
        clickOnHOpensTheMenu: hOpens,
        menuHasSettingsShortcutsLeave: menuShape,
        aPressElsewhereClosesTheMenu: outsideCloses,
        dragPastFourPxMovesAndDoesNotOpen: dragMoves,
        aWobbleUnderFourPxIsStillAClick: wobbleOpens,
        dragClosesAnOpenMenu: dragClosed,
        enterOnHOpensTheMenu: enterOpens,
        escapeClosesItAndReturnsToH: escapeBack,

        selectionGrabIsOnItsLeftEdge: selGrabOnLeft,
        pageResizesFromItsRightEdge: pageGrew,
        selectionResizesFromItsLeftEdge: selGrew,
        widthIsClamped: pageMin === 220 && pageMax === 560 && selMin === 300 && selMax === 560,
        headerDragMovesAFloatingPanel: headerMoved,
        aMovedPanelOffersBackToItsEdge: offersBack && wentBack && selWentBack,
        pinnedPanelsAreFlushUnderTheBar: flush,
        pinnedPanelsHaveNoGripAndNoBackButton: noMoveChrome,
        pinnedHeaderDragDoesNotMoveThePanel: headerStill,
        pinnedPanelsStillResize: pinnedResized,
        floatingAgainReturnsToTheParkedBox: parkedKept,
      };

      /* ---------------------------------------------------------------- *
       * Edit off and on keeps the panels as they were. Edit off used to close the dock.
       * ---------------------------------------------------------------- */
      progress.textContent = 'kept';
      await reset();
      engine.setDockTab('tokens');
      engine.setDockTab('props');
      engine.setPanelWidth('page', 300);
      engine.setPanelWidth('selection', 400);
      engine.setPanelFloat('page', 150, 70, 420);
      engine.setLayout('dock');
      await frames();
      const keep = (s) => JSON.stringify([s.pageOpen, s.pageTab, s.pageWidth, s.pageFloat, s.dockOpen, s.dockTab, s.dockWidth, s.dockFloat, s.layout]);
      const before = keep(state());
      const barBefore = JSON.stringify(state().toolbar);
      const boxesBefore = ['page', 'selection'].map((side) => JSON.stringify(rect(dock(side)).toJSON()));
      const roomBefore = engine.viewport.renderWidth;
      api.setEditing(false);
      await frames();
      const hiddenWhileOff = !dock('page') && !dock('selection');
      const keptWhileOff = keep(state()) === before;
      // Off, the page has the window back and the bar floats: the panels it was pinned with are hidden.
      const offGivesTheWindow = engine.viewport.renderWidth === null &&
        Math.round(document.documentElement.getBoundingClientRect().width) === innerWidth && bar().dataset.layout === 'float';
      api.setEditing(true);
      await frames();
      await settle(300);
      const boxesAfter = ['page', 'selection'].map((side) => JSON.stringify(rect(dock(side))?.toJSON() ?? null));
      const layoutBack = state().layout === 'dock' && bar().dataset.layout === 'dock' &&
        roomBefore !== null && engine.viewport.renderWidth === roomBefore;
      const panelsBack = keep(state()) === before &&
        boxesAfter.join() === boxesBefore.join() &&
        tabs('page').find((t) => t.getAttribute('aria-selected') === 'true')?.getAttribute('aria-label') === 'Tokens' &&
        tabs('selection').find((t) => t.getAttribute('aria-selected') === 'true')?.getAttribute('aria-label') === 'Props';
      // The floating place is checked floating: pinned, the bar spans the window.
      engine.setLayout('float');
      await frames();
      results.kept = {
        layoutKeptAcrossEditOffOn: offGivesTheWindow && layoutBack,
        panelsAreHiddenWhileEditIsOff: hiddenWhileOff,
        theStoreKeepsThemWhileEditIsOff: keptWhileOff,
        editOffAndOnKeepsPanelsTabsSizesAndPositions: panelsBack,
        // The place is kept; where it shows follows the bar's width now (the selection chip's
        // text may differ), clamped into the window from that same place.
        barPositionKeptAcrossEditOffOn: JSON.stringify(state().toolbar) === barBefore && (() => {
          const box = rect(bar());
          const { x, y } = state().toolbar;
          return Math.round(box.left) === Math.round(Math.min(Math.max(x, 8), innerWidth - box.width - 8)) &&
            Math.round(box.top) === Math.round(Math.min(Math.max(y, 8), innerHeight - box.height - 8));
        })(),
      };
      await reset();

      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value !== true))
        .map(([name]) => name);
      progress.textContent = 'done';
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify({ ok: failed.length === 0 && errors.length === 0, failed, errors, results, diagnostics }, null, 2) + ':END';
    })().catch((err) => {
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify({ ok: false, failed: ['THREW'], errors: [String(err && err.stack || err)] }) + ':END';
    });
  </script>
</body>
</html>
