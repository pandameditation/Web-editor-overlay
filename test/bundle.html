<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Writing the page out with nowhere to write it</title>
  <!--
    A page with one of everything the export has to decide about: a linked stylesheet (which
    itself refers to an image), an inline <style>, an external script, an inline script, and
    an <img>. Opened over `file://` with no folder connected, which is the case this exists
    for — the Save button used to hand over a Markdown prompt here.

    Run twice, and the difference is the whole point:

        npm run check:bundle          -- local file access allowed, so siblings are readable
        npm run check:bundle:strict   -- the real thing: every file its own opaque origin

    The strict run is what Firefox does. Nothing can be inlined there, and the checks below
    expect exactly that rather than pretending otherwise.
  -->
  <link rel="stylesheet" href="./bundle.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
    }

    .badge {
      background-image: url("nested/dot.svg");
      width: 24px;
      height: 24px;
    }
  </style>
</head>

<body>
  <h1 id="title">Written out, not described</h1>
  <div class="card">
    <h2 id="heading">A card</h2>
    <p id="copy">Some copy to edit.</p>
  </div>
  <img id="pic" src="./nested/dot.svg" alt="A dot">
  <span class="badge"></span>

  <script src="./bundle.js"></script>
  <script>
    document.documentElement.dataset.inlineScriptRan = 'yes';
  </script>

  <pre id="progress">start</pre>
  <pre id="out">pending</pre>

  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (e) => errors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + e.reason));

      const progress = document.getElementById('progress');
      const step = (name) => { progress.textContent = name; };
      const check = (name, fn) => {
        step(name);
        try { results[name] = fn(); }
        catch (err) { results[name] = 'THREW: ' + (err && err.message ? err.message : String(err)); }
      };
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

      function deepQuery(selector, root = document) {
        const found = root.querySelector?.(selector);
        if (found) return found;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const hit = deepQuery(selector, el.shadowRoot);
          if (hit) return hit;
        }
        return null;
      }

      /*
       * Which of the two worlds this run is in, established by asking rather than assuming.
       *
       * Everything below is judged against it: with siblings readable the export can be
       * self-contained, and without them it cannot, and both are correct behaviour.
       */
      let readable = false;
      try {
        const probe = await fetch('./bundle.css');
        readable = probe.ok;
      } catch { readable = false; }
      results.siblingsAreReadableInThisRun = readable;

      /* The downloads, intercepted, so nothing is written to disk and the bytes can be read. */
      const downloads = [];
      const realCreate = URL.createObjectURL;
      URL.createObjectURL = (blob) => {
        downloads.push(blob);
        return realCreate.call(URL, blob);
      };
      const clicked = [];
      const realClick = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function () {
        if (this.download) clicked.push(this.download);
        // Not forwarded: a real click would open a save dialog and stall the run.
      };

      /*
       * The save picker, stood in for.
       *
       * Headless Chrome has `showSaveFilePicker` but cannot show a dialog, and a real one
       * would need a real click and then stall the run waiting for a human. So it is
       * replaced by something that records what it was asked and answers on command — which
       * is also the only way to check the thing worth checking: that the name offered
       * already has the right extension for the shape, because the picker is asked *before*
       * the export is built.
       */
      const asked = [];
      const savedTo = [];
      let pickerAnswer = 'accept';
      const realPicker = window.showSaveFilePicker;
      window.showSaveFilePicker = async (options = {}) => {
        asked.push({
          suggestedName: options.suggestedName ?? null,
          accepts: Object.keys(options.types?.[0]?.accept ?? {}),
          id: options.id ?? null,
          startIn: options.startIn ?? null,
        });
        if (pickerAnswer === 'cancel') throw new DOMException('Aborted', 'AbortError');
        const name = pickerAnswer === 'rename' ? 'chosen-by-hand.html' : options.suggestedName;
        const record = { name, blob: null, closed: false };
        savedTo.push(record);
        return {
          name,
          createWritable: async () => ({
            write: async (blob) => {
              record.blob = blob;
            },
            close: async () => {
              record.closed = true;
            },
            abort: async () => undefined,
          }),
        };
      };

      /**
       * What the last write produced, whichever way it went out.
       *
       * Both destinations are real paths through the same code — a handle where the browser
       * has a picker, a download where it does not — so the checks below ask "what was
       * written" rather than assuming which one happened, and `via` is what says.
       */
      const written = async () => {
        const handle = savedTo[savedTo.length - 1];
        const blob = downloads[downloads.length - 1];
        const usedHandle = handle && handle.blob && !clicked.length;
        const chosen = usedHandle ? handle.blob : blob;
        return {
          via: usedHandle ? 'picker' : clicked.length ? 'download' : null,
          name: usedHandle ? handle.name : (clicked[clicked.length - 1] ?? null),
          blob: chosen ?? null,
          text: chosen ? await chosen.text() : '',
          committed: usedHandle ? handle.closed : null,
        };
      };
      /** Forget the writes so far, so the next check reads its own. */
      const forget = () => {
        downloads.length = 0;
        clicked.length = 0;
        savedTo.length = 0;
        asked.length = 0;
      };

      const api = window.HtmlEditorOverlay.mount({ theme: 'dark', fileName: 'page.html' });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      check('theExternalsLoaded', () => ({
        script: document.documentElement.dataset.bundleScriptRan ?? null,
        inline: document.documentElement.dataset.inlineScriptRan ?? null,
        cardPadding: getComputedStyle(document.querySelector('.card')).padding,
      }));
      check('andNoFolderIsConnected', () => engine.store.value.project ?? null);

      /* ------------------------------------------------------------------ *
       * 1. Make an edit, so there is something to write.
       * ------------------------------------------------------------------ */
      step('edit');
      const heading = document.getElementById('heading');
      engine.beginTextEdit(heading);
      await frames();
      heading.firstChild.data = 'An edited card';
      engine.endTextEdit(true);
      api.select(document.getElementById('copy'));
      engine.setStyle('color', 'rebeccapurple');
      await frames();
      check('thereIsSomethingToSave', () => engine.records.map((r) => r.kind));

      /* ------------------------------------------------------------------ *
       * 2. The page is surveyed: what it is made of, before anything is read.
       * ------------------------------------------------------------------ */
      /*
       * The survey reads nothing — it resolves URLs and counts them — so `readable` here is
       * a hope, not a finding, and it says the same in both runs. What the dialog shows is
       * the built plan's verdict instead, which is why the checkboxes further down report
       * "none readable from here" on the strict run while this still says otherwise.
       */
      step('survey');
      check('theSurveyFindsThePagesParts', () => {
        const survey = engine.bundleSurvey();
        return Object.fromEntries(
          survey.categories.map((entry) => [
            entry.kind,
            { count: entry.count, readable: entry.readable, embedded: entry.embedded },
          ]),
        );
      });
      /*
       * What is counted is only what a choice can act on.
       *
       * This page has two linked scripts and several inline ones, and the inline ones are not
       * in `count` because no checkbox can do anything about them — they are already in the
       * document and travel with it. Reported separately so the row can say so, which it did
       * not, and someone reading "none readable from here" beside an export plainly full of
       * inline scripts concluded the count was lying.
       */
      check('andCountsWhatTravelsAnywaySeparately', () => {
        const survey = engine.bundleSurvey();
        const scripts = survey.categories.find((c) => c.kind === 'script');
        const styles = survey.categories.find((c) => c.kind === 'style');
        return {
          linkedScripts: scripts?.count ?? null,
          inlineScripts: scripts?.embedded ?? null,
          linkedStyles: styles?.count ?? null,
          inlineStyles: styles?.embedded ?? null,
          // The page has an inline <style> and inline <script>s, whatever the origin rules say.
          asExpected: (scripts?.embedded ?? 0) > 0 && (styles?.embedded ?? 0) > 0,
        };
      });

      /* ------------------------------------------------------------------ *
       * 3. Everything inline: one self-contained file.
       * ------------------------------------------------------------------ */
      step('single');
      engine.setBundleOptions({ styles: true, scripts: true, images: true, fonts: true, packaging: 'single' });
      check('withEverythingInlineTheShapeIsOneFile', () => engine.bundleShape());

      const single = await engine.previewBundle();
      check('andThePlanIsOneHtmlFile', () => ({
        shape: single?.shape ?? null,
        fileName: single?.fileName ?? null,
        files: (single?.files ?? []).map((f) => `${f.path}|${f.kind}`),
        omitted: (single?.omitted ?? []).map((o) => `${o.kind}:${o.label}`),
      }));

      check('andItSaysWhyWhenNothingCouldBeFoldedIn', () => {
        const first = single?.omitted[0];
        return {
          any: (single?.omitted ?? []).length,
          reason: first?.reason ?? null,
          // Over a real `file://` origin this is the expected outcome, not a failure.
          matchesTheRun: readable ? (single?.omitted ?? []).length === 0 : (single?.omitted ?? []).length > 0,
        };
      });

      /* ------------------------------------------------------------------ *
       * 3a. Backing out of the picker backs out of the save.
       * ------------------------------------------------------------------ */
      step('cancel');
      forget();
      pickerAnswer = 'cancel';
      const refused = await engine.writeBundle();
      await frames();
      const afterCancel = await written();
      check('decliningTheFolderWritesNothing', () => ({
        plan: refused,
        wrote: afterCancel.via,
        // The whole point: the file does not quietly land in the downloads folder instead.
        nothingLanded: refused === null && afterCancel.via === null,
        // And the edits are still pending, so nothing was marked saved either.
        stillPending: engine.store.value.changeCount > 0,
      }));
      pickerAnswer = 'accept';

      /* ------------------------------------------------------------------ *
       * 3b. Written where the user said, under the name they were offered.
       * ------------------------------------------------------------------ */
      step('writeSingle');
      forget();
      await engine.writeBundle();
      await frames();
      const wroteSingle = await written();
      check('itAsksWhereBeforeItBuilds', () => ({
        asked: asked.length,
        // Asked with the extension already right, which it can only be because the shape was
        // settled beforehand — the picker cannot be asked after the build, the gesture is gone.
        offered: asked[0]?.suggestedName ?? null,
        acceptsHtml: asked[0]?.accepts.includes('text/html') ?? false,
        startsInDownloads: asked[0]?.startIn ?? null,
      }));
      check('theDownloadIsTheHtmlItself', () => ({
        via: wroteSingle.via,
        name: wroteSingle.name,
        isHtml: /\.html$/.test(wroteSingle.name ?? ''),
        type: wroteSingle.blob?.type ?? null,
        // Closed, not left open: an unclosed writable is a file that never appears.
        committed: wroteSingle.committed,
      }));
      check('andCarriesTheEdits', () => {
        const doc = new DOMParser().parseFromString(wroteSingle.text, 'text/html');
        return {
          heading: doc.getElementById('heading')?.textContent ?? null,
          copyStyle: doc.getElementById('copy')?.getAttribute('style') ?? null,
          noEditorTrace: doc.querySelectorAll('html-editor-overlay, [data-heo-src]').length,
        };
      });
      check('andWhetherItIsSelfContained', () => {
        const doc = new DOMParser().parseFromString(wroteSingle.text, 'text/html');
        const links = doc.querySelectorAll('link[rel~="stylesheet"]').length;
        const externalScripts = doc.querySelectorAll('script[src]').length;
        const dataImages = Array.from(doc.querySelectorAll('img')).filter((img) =>
          (img.getAttribute('src') ?? '').startsWith('data:'),
        ).length;
        return {
          stylesheetLinksLeft: links,
          externalScriptsLeft: externalScripts,
          imagesAsDataUrls: dataImages,
          // With siblings readable nothing should be left pointing outward; without them,
          // everything is — and the file is still the page plus the edits either way.
          //
          // Two scripts, not one: `bundle.js` and the overlay's own tag, which is hand-added
          // and so belongs to the page as far as the export is concerned.
          asExpected: readable
            ? links === 0 && externalScripts === 0 && dataImages === 1
            : links === 1 && externalScripts === 2 && dataImages === 0,
        };
      });
      check('andAnInlinedStylesheetKeepsItsAssetPointingRight', () => {
        if (!readable) return 'not applicable in this run';
        // `bundle.css` says `url(nested/dot.svg)`, written relative to itself. Inlined into a
        // `<style>` it has to have become something that still resolves — a data URI here,
        // since images are inline too.
        const doc = new DOMParser().parseFromString(wroteSingle.text, 'text/html');
        const css = Array.from(doc.querySelectorAll('style')).map((s) => s.textContent ?? '').join('\n');
        return {
          hasCardRule: /\.card\s*\{/.test(css),
          dotIsInlined: /url\("data:image\/svg\+xml/.test(css),
          noBareRelativeDot: !/url\(["']?nested\/dot\.svg/.test(css),
        };
      });

      /* ------------------------------------------------------------------ *
       * 3b-ii. Fonts answer to the fonts checkbox, not the images one.
       *
       * The reported bug: ticking Styles embedded every font as base64. Folding a stylesheet
       * in brings its `url()` references into the document, and those were all classified as
       * images — so the *pictures* checkbox decided what happened to the fonts, and the fonts
       * one did not exist. The font here is reachable only through `bundle.css`, which is
       * what made it invisible to the survey as well.
       * ------------------------------------------------------------------ */
      step('fonts');
      /** The inlined CSS of a built plan, which is where both assets end up referenced. */
      const planCss = (plan) => {
        const doc = new DOMParser().parseFromString(
          new TextDecoder().decode(plan.files.find((f) => f.kind === 'document').bytes),
          'text/html',
        );
        return Array.from(doc.querySelectorAll('style')).map((s) => s.textContent ?? '').join('\n');
      };

      if (readable) {
        engine.setBundleOptions({ styles: true, images: true, fonts: false, packaging: 'single' });
        const split = await engine.previewBundle();
        const text = planCss(split);
        results.fontsAndImagesAreSeparateChoices = {
          placed: split?.placed ?? null,
          // The picture went in as base64 and the font did not, from one build.
          imageIsBase64: /url\("data:image\/svg\+xml/.test(text),
          fontIsNotBase64: !/url\("data:font/.test(text),
          // Unticked means left alone: the reference still points where it always did, and
          // nothing was copied anywhere. This is what a CDN font wants.
          fontIsStillALink: /url\("?[^")]*probe\.woff2/.test(text),
          nothingWasCopied: !(split?.files ?? []).some((f) => f.kind === 'font'),
          // And it is not reported as left behind, because it was never coming.
          notCountedAsAFailure: !(split?.omitted ?? []).some((o) => o.kind === 'font'),
          asExpected:
            /url\("data:image\/svg\+xml/.test(text) &&
            !/url\("data:font/.test(text) &&
            /url\("?[^")]*probe\.woff2/.test(text) &&
            !(split?.files ?? []).some((f) => f.kind === 'font') &&
            !(split?.omitted ?? []).some((o) => o.kind === 'font'),
        };

        // And the other way round, from the same page: fonts in, pictures out.
        engine.setBundleOptions({ images: false, fonts: true, packaging: 'single' });
        const swapped = await engine.previewBundle();
        const swappedText = planCss(swapped);
        results.andTheChoicesCanBeSwapped = {
          // The declared type is the assertion, not a detail: a data URI is all the browser
          // has to go on, and a font announced as a byte stream is a font that will not load.
          fontDataType: (swappedText.match(/url\("(data:[^;,)"]*)/) ?? [])[1] ?? null,
          fontIsBase64: /url\("data:font\/woff2/.test(swappedText),
          imageIsStillALink: /url\("?[^")]*dot\.svg/.test(swappedText),
          asExpected:
            /url\("data:font\/woff2/.test(swappedText) &&
            /url\("?[^")]*dot\.svg/.test(swappedText),
        };

        /*
         * The count comes from the build, not the survey.
         *
         * A font behind a linked stylesheet does not exist until that sheet is read, so the
         * survey says zero and the row would have said "no fonts in this page" above an
         * export that had just embedded one.
         */
        results.aFontBehindAStylesheetIsCountedOnceItIsKnown = {
          surveySaw: engine.bundleSurvey().categories.find((c) => c.kind === 'font')?.count ?? null,
          theBuildPlaced: swapped?.placed.font ?? null,
          asExpected: (swapped?.placed.font ?? 0) === 1,
        };

        /*
         * And the packaging is the other question: the same two ticked, carried differently.
         *
         * This is what unticking used to do, and conflating the two meant there was no way to
         * ask for "bring the images but not the webfonts, in one file".
         */
        engine.setBundleOptions({ images: true, fonts: true, packaging: 'archive' });
        const beside = await engine.previewBundle();
        const besideText = planCss(beside);
        results.packagingIsASeparateQuestionFromWhatToSave = {
          shape: beside?.shape ?? null,
          files: (beside?.files ?? []).map((f) => `${f.path}|${f.kind}`),
          // Saved, but carried beside rather than encoded in.
          nothingIsBase64: !/url\("data:/.test(besideText),
          asExpected:
            beside?.shape === 'archive' &&
            !/url\("data:/.test(besideText) &&
            (beside?.files ?? []).some((f) => f.kind === 'font') &&
            (beside?.files ?? []).some((f) => f.kind === 'image'),
        };
        engine.setBundleOptions({ images: true, fonts: true, packaging: 'single' });
      } else {
        results.fontsAndImagesAreSeparateChoices = 'not applicable in this run';
        results.andTheChoicesCanBeSwapped = 'not applicable in this run';
        results.aFontBehindAStylesheetIsCountedOnceItIsKnown = 'not applicable in this run';
        results.packagingIsASeparateQuestionFromWhatToSave = 'not applicable in this run';
      }

      /* ------------------------------------------------------------------ *
       * 3c. Called whatever the user calls it.
       * ------------------------------------------------------------------ */
      step('rename');
      // Settled first: changing a placement starts a rebuild, and renaming what is not there
      // yet only stores the name. Real typing lands the same way — the rebuild picks it up.
      await engine.previewBundle();
      const beforeRename = engine.store.value.bundlePlan;
      engine.setExportName('My Landing Page');
      const renamed = engine.store.value.bundlePlan;
      check('renamingDoesNotRebuild', () => ({
        // Same bytes, different name. Rebuilding would mean re-reading every asset on every
        // keystroke, which is what a text field must not do.
        sameDocumentBytes: beforeRename?.files[0].bytes === renamed?.files[0].bytes,
        planIsStillThere: Boolean(renamed),
      }));
      check('theNameReachesEverywhereItShows', () => ({
        download: renamed?.fileName ?? null,
        // Inside an archive this is a path someone sees when they unzip it.
        documentPath: renamed?.files.find((f) => f.kind === 'document')?.path ?? null,
        offeredNext: engine.exportFileName,
      }));
      check('andAPathOrAnIllegalCharacterIsNotAName', () => {
        engine.setExportName('../../etc/pa*ssw?d');
        const name = engine.store.value.bundlePlan?.fileName ?? null;
        return {
          name,
          // The directory part is dropped and the illegal characters go: where the file
          // lands is the picker's business, not the name field's.
          climbsNowhere: !(name ?? '').includes('/') && !(name ?? '').includes('*'),
        };
      });
      check('andClearingItGoesBackToThePagesOwnName', () => {
        engine.setExportName('');
        return {
          stored: engine.store.value.exportName,
          falls: engine.exportFileName,
          placeholder: engine.exportDefaultName,
        };
      });
      engine.setExportName('My Landing Page');

      step('writeRenamed');
      forget();
      await engine.writeBundle();
      await frames();
      const wroteRenamed = await written();
      check('theWrittenFileCarriesTheTypedName', () => ({
        offered: asked[0]?.suggestedName ?? null,
        wrote: wroteRenamed.name,
        asExpected: asked[0]?.suggestedName === 'My Landing Page.html',
      }));
      // Back to the page's own name, so the rest reads as it did before.
      engine.setExportName(null);

      /* ------------------------------------------------------------------ *
       * 3d. Without a picker, or with the asking turned off, it downloads.
       * ------------------------------------------------------------------ */
      step('downloadInstead');
      forget();
      engine.setExportPrompt(false);
      check('turningOffTheAskingSticks', () => ({
        stored: engine.store.value.exportPrompt,
        asExpected: engine.store.value.exportPrompt === false,
      }));
      await engine.writeBundle();
      await frames();
      const wroteDirect = await written();
      check('withoutAskingItGoesToTheDownloadsFolder', () => ({
        via: wroteDirect.via,
        name: wroteDirect.name,
        // Nothing was asked, and the file still arrived. This is the Firefox and Safari
        // path as well as the opted-out one.
        askedNobody: asked.length === 0,
        asExpected: wroteDirect.via === 'download' && /\.html$/.test(wroteDirect.name ?? ''),
      }));
      engine.setExportPrompt(true);
      check('andItCanBeTurnedBackOn', () => engine.store.value.exportPrompt);

      /* ------------------------------------------------------------------ *
       * 4. Packaged as a folder: an archive, at the paths the page already uses.
       * ------------------------------------------------------------------ */
      step('archive');
      forget();
      engine.setBundleOptions({ packaging: 'archive' });
      check('askingForAnArchiveOffersOne', () => ({
        // Nothing has been read yet, so the offer is the optimistic one: the choice is taken
        // at its word until a build finds out whether there is anything to put in it.
        offered: engine.bundleShape(),
        asExpected: engine.bundleShape() === 'archive',
      }));

      const archive = await engine.previewBundle();
      check('andThePlanListsTheFilesBesideIt', () => ({
        shape: archive?.shape ?? null,
        fileName: archive?.fileName ?? null,
        files: (archive?.files ?? []).map((f) => `${f.path}|${f.kind}`),
        // The asset keeps the path the page already refers to it by — when its bytes could
        // be read at all. Unreadable, it is left named in the HTML and nowhere in the plan.
        keepsItsOwnPath:
          (archive?.files ?? []).some((f) => f.path === 'nested/dot.svg') === readable,
        // With nothing readable there is no asset to put beside the HTML, so it stays one
        // file — the honest answer rather than an archive holding only a page. The choice is
        // remembered either way; it is the outcome that collapses.
        shapeMatchesTheRun: (archive?.shape ?? null) === (readable ? 'archive' : 'single'),
        theChoiceIsStillRemembered: engine.store.value.bundleOptions.packaging === 'archive',
        // And the offer follows the plan once there is one, so the button cannot promise a
        // `.zip` over a download that turns out to be an `.html`.
        theOfferFollowsIt: engine.bundleShape() === (archive?.shape ?? null),
      }));

      step('writeArchive');
      forget();
      await engine.writeBundle();
      await frames();
      const wroteArchive = await written();
      check('theDownloadIsAZipWhenThereAreFilesBesideIt', () => ({
        via: wroteArchive.via,
        name: wroteArchive.name,
        type: wroteArchive.blob?.type ?? null,
        // The picker was offered the archive extension, not the page one — which is the
        // reason the shape has to be settled before the asking.
        offered: asked[0]?.suggestedName ?? null,
        acceptsZip: asked[0]?.accepts.includes('application/zip') ?? false,
        asExpected: readable
          ? /\.zip$/.test(wroteArchive.name ?? '') && wroteArchive.blob?.type === 'application/zip'
          : /\.html$/.test(wroteArchive.name ?? ''),
      }));
      step('andTheZipIsAZip');
      if (readable && wroteArchive.blob) {
        const bytes = new Uint8Array(await wroteArchive.blob.arrayBuffer());
        const signature = String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]);
        const tail = bytes.subarray(bytes.length - 22);
        results.andTheZipIsAZip = {
          // `PK\x03\x04` opens a local file header; `PK\x05\x06` opens the end record.
          localHeader: signature === 'PK\u0003\u0004',
          endRecord: String.fromCharCode(tail[0], tail[1], tail[2], tail[3]) === 'PK\u0005\u0006',
          entries: new DataView(bytes.buffer).getUint16(bytes.length - 22 + 10, true),
          bytes: bytes.length,
        };
      } else {
        results.andTheZipIsAZip = 'not applicable in this run';
      }

      /*
       * An OS save dialog lets you type whatever you like, including the wrong extension.
       *
       * Writing zip bytes into a file called `.html` would hand over something that does not
       * open, so the chosen handle is dropped and the file goes out under the name that
       * matches its contents instead. Only reachable when the shape is an archive, so it is
       * skipped in the run where nothing is readable.
       */
      step('mismatch');
      if (readable) {
        forget();
        pickerAnswer = 'rename';
        engine.setStyle('opacity', '0.99');
        await frames();
        await engine.writeBundle();
        await frames();
        const salvaged = await written();
        results.aNameThatDisagreesWithTheContentsIsRefused = {
          theyTyped: savedTo[savedTo.length - 1]?.name ?? null,
          itWroteInstead: salvaged.name,
          via: salvaged.via,
          // Not through the handle, and named for what it actually is.
          asExpected: salvaged.via === 'download' && /\.zip$/.test(salvaged.name ?? ''),
        };
        pickerAnswer = 'accept';
      } else {
        results.aNameThatDisagreesWithTheContentsIsRefused = 'not applicable in this run';
      }

      /* ------------------------------------------------------------------ *
       * 5. It counts as a save, and the dialog says so.
       * ------------------------------------------------------------------ */
      step('savedState');
      check('writingThePageOutCountsAsASave', () => ({
        pending: engine.store.value.changeCount,
        canStillUndo: engine.store.value.canUndo,
      }));

      /*
       * A fresh edit first, because the write above cleared the pending count.
       *
       * The primary button is disabled with nothing to write, which is correct and was
       * briefly mistaken for the navigation being broken.
       */
      step('dialog');
      api.select(document.getElementById('title'));
      engine.setStyle('letter-spacing', '-0.01em');
      await frames();
      engine.previewSave();
      await frames();
      await frames();
      /*
       * Which offer leads, and it is not this one.
       *
       * Connecting a folder edits the files the page is built from, in place, so where the
       * browser can offer that it is the primary and saving a copy is the button beside it.
       * Only where no folder can be handed over — Firefox and Safari on a local file, chiefly
       * — is saving a copy the main event, because then it is the whole of what can be done.
       */
      const canConnect = api.engine.store.value.project === null && (await engine.hostOptions()).picker;
      check('theFolderRouteLeadsWhereItCan', () => {
        const dialog = deepQuery('heo-save-dialog');
        const labels = Array.from(dialog?.shadowRoot?.querySelectorAll('footer .btn') ?? []).map(
          (el) => el.textContent.replace(/\s+/g, ' ').trim(),
        );
        const primaryLabel =
          dialog?.shadowRoot?.querySelector('footer .btn.primary')?.textContent
            ?.replace(/\s+/g, ' ').trim() ?? null;
        return {
          labels,
          primary: primaryLabel,
          thisBrowserCanTakeAFolder: canConnect,
          // Saving a copy is always reachable, and it says what it is either way.
          savingACopyIsOffered: labels.some((label) => /^Save as HTML/.test(label)),
          noLongerSaysSaveChanges: !labels.some((label) => label === 'Save changes'),
          asExpected: canConnect
            ? /^Connect folder to edit files/.test(primaryLabel ?? '')
            : /^Save as HTML/.test(primaryLabel ?? ''),
        };
      });

      // The Save-as-HTML entry leads to the step rather than writing straight away.
      const primary = () => {
        const dialog = deepQuery('heo-save-dialog');
        return Array.from(dialog?.shadowRoot?.querySelectorAll('footer .btn.primary') ?? [])[0] ?? null;
      };
      const htmlEntry = () => {
        const dialog = deepQuery('heo-save-dialog');
        return Array.from(dialog?.shadowRoot?.querySelectorAll('footer .btn') ?? []).find((el) =>
          /^Save as HTML/.test(el.textContent.replace(/\s+/g, ' ').trim()),
        ) ?? null;
      };
      htmlEntry()?.click();
      await frames();
      await frames();
      check('andPressingItOpensTheExportStep', () => {
        const dialog = deepQuery('heo-save-dialog');
        const shell = dialog?.shadowRoot?.querySelector('.dialog');
        const choices = Array.from(dialog?.shadowRoot?.querySelectorAll('.choice') ?? []).map((el) => ({
          name: el.querySelector('.name')?.textContent?.trim() ?? null,
          detail: el.querySelector('.detail')?.textContent?.replace(/\s+/g, ' ').trim() ?? null,
          checked: el.querySelector('input')?.checked ?? null,
          disabled: el.querySelector('input')?.disabled ?? null,
        }));
        return {
          // Generic now, because the shape is a choice inside the step rather than its title.
          step: shell?.getAttribute('aria-label') ?? null,
          heading: dialog?.shadowRoot?.querySelector('header h2')?.textContent?.trim() ?? null,
          sections: Array.from(dialog?.shadowRoot?.querySelectorAll('.pick h3') ?? []).map((el) =>
            el.textContent.trim(),
          ),
          choices,
        };
      });
      /*
       * Unticking a box must not lock it.
       *
       * The reported bug, and it was deterministic: the row counted the page from what the
       * build had *carried*, so unticking a kind meant nothing was carried, which read as
       * "none in this page", which disabled the row — and it could never be ticked again.
       * Clicked through the real checkbox rather than the API, because the checkbox is where
       * it went wrong.
       */
      step('toggling');
      const rowFor = (name) =>
        Array.from(deepQuery('heo-save-dialog')?.shadowRoot?.querySelectorAll('.choice') ?? []).find(
          (el) => el.querySelector('.name')?.textContent?.trim() === name,
        );
      const boxFor = (name) => rowFor(name)?.querySelector('input');
      const clickBox = async (name) => {
        const box = boxFor(name);
        box.checked = !box.checked;
        box.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
        // Long enough for the rebuild the change kicks off to land.
        for (let i = 0; i < 8; i += 1) await frames();
      };

      /*
       * Nothing may disappear between the click and the settled result.
       *
       * The flashing was structural: clicking cleared the plan, so the file list was replaced
       * by a placeholder, then by a progress line, then rebuilt — four layouts for one click.
       * So this samples every frame from the click until the rebuild lands and asserts the list
       * was never empty and its row count never dropped to nothing.
       */
      step('flicker');
      if (!boxFor('Images')?.disabled) {
        const listRows = () =>
          deepQuery('heo-save-dialog')?.shadowRoot?.querySelectorAll('.plan .write').length ?? 0;
        const emptyShown = () =>
          Boolean(deepQuery('heo-save-dialog')?.shadowRoot?.querySelector('.empty'));

        const before = listRows();
        const box = boxFor('Images');
        box.checked = false;
        box.dispatchEvent(new Event('change', { bubbles: true, composed: true }));

        const samples = [];
        for (let i = 0; i < 40; i += 1) {
          await frames();
          samples.push({ rows: listRows(), empty: emptyShown() });
          if (i > 6 && !engine.store.value.bundling && samples[samples.length - 1].rows > 0) {
            const plan = engine.store.value.bundlePlan;
            if (plan && plan.options.images === false) break;
          }
        }
        results.tickingDoesNotFlashTheContent = {
          rowsBefore: before,
          lowestRowCountSeen: Math.min(...samples.map((s) => s.rows)),
          everShowedThePlaceholder: samples.some((s) => s.empty),
          frames: samples.length,
          // The list held its ground the whole way through.
          asExpected:
            before > 0 &&
            Math.min(...samples.map((s) => s.rows)) > 0 &&
            !samples.some((s) => s.empty),
        };
        // Put it back, and let the rebuild settle before the checks below read the rows.
        const restore = boxFor('Images');
        restore.checked = true;
        restore.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
        for (let i = 0; i < 12; i += 1) await frames();
      } else {
        results.tickingDoesNotFlashTheContent = 'not applicable in this run';
      }

      const toggles = [];
      for (const name of ['Styles', 'Images']) {
        const start = boxFor(name);
        if (!start || start.disabled) {
          toggles.push({ row: name, skipped: 'disabled to begin with' });
          continue;
        }
        await clickBox(name);
        const off = boxFor(name);
        const offState = { checked: off?.checked ?? null, disabled: off?.disabled ?? null };
        await clickBox(name);
        const back = boxFor(name);
        toggles.push({
          row: name,
          afterUnticking: offState,
          afterReticking: { checked: back?.checked ?? null, disabled: back?.disabled ?? null },
          // Unticking leaves it unticked and still clickable; ticking it puts it back.
          asExpected:
            offState.checked === false &&
            offState.disabled === false &&
            back?.checked === true &&
            back?.disabled === false,
        });
      }
      results.untickingAnOptionDoesNotLockIt = toggles;

      /*
       * Fonts depend on Styles, and the row says so instead of pretending there are none.
       *
       * A face is named by an at-font-face rule, so embedding one means rewriting the CSS that
       * points at it — impossible in a stylesheet that is not being saved. This page keeps its
       * only font in `bundle.css`, so unticking Styles hides it, and the row used to report
       * "none in this page", which is not what "we did not look" means.
       */
      step('fontsUnderStyles');
      results.fontsAreNestedUnderStyles = (() => {
        const dialog = deepQuery('heo-save-dialog');
        const rows = Array.from(dialog?.shadowRoot?.querySelectorAll('.choice') ?? []);
        const names = rows.map((el) => el.querySelector('.name')?.textContent?.trim() ?? null);
        const fonts = rows.find((el) => el.querySelector('.name')?.textContent?.trim() === 'Fonts');
        return {
          order: names,
          fontsIsIndented: fonts?.classList.contains('sub') ?? null,
          // Directly beneath the row it depends on.
          asExpected:
            names[0] === 'Styles' &&
            names[1] === 'Fonts' &&
            (fonts?.classList.contains('sub') ?? false),
        };
      })();

      if (readable) {
        engine.setBundleOptions({ styles: false, fonts: true, packaging: 'single' });
        for (let i = 0; i < 12; i += 1) await frames();
        results.unsavedStylesHideTheirFontsAndSaysSo = (() => {
          const dialog = deepQuery('heo-save-dialog');
          const fonts = Array.from(dialog?.shadowRoot?.querySelectorAll('.choice') ?? []).find(
            (el) => el.querySelector('.name')?.textContent?.trim() === 'Fonts',
          );
          const detail = fonts?.querySelector('.detail')?.textContent?.replace(/\s+/g, ' ').trim() ?? null;
          const why = fonts?.querySelector('.why')?.textContent?.replace(/\s+/g, ' ').trim() ?? null;
          return {
            detail,
            why,
            // Says nobody looked, and says what to do about it.
            asExpected:
              /not being saved/.test(detail ?? '') &&
              /Tick Styles/.test(why ?? '') &&
              !/none in this page/.test(detail ?? ''),
          };
        })();
        engine.setBundleOptions({ styles: true, fonts: true });
        for (let i = 0; i < 12; i += 1) await frames();
      } else {
        results.unsavedStylesHideTheirFontsAndSaysSo = 'not applicable in this run';
      }

      check('theStepReadsAsThreeDecisions', () => {
        const dialog = deepQuery('heo-save-dialog');
        const sections = Array.from(dialog?.shadowRoot?.querySelectorAll('.pick h3') ?? []).map(
          (el) => el.textContent.trim(),
        );
        return {
          sections,
          // What travels, how it is carried, where it lands — in the order each depends on the
          // one before. The middle one is absent when it has nothing to decide. Matched loosely
          // because the wording is the sort of thing that gets improved.
          asExpected:
            /^Choose what/.test(sections[0] ?? '') &&
            /^Choose where/.test(sections[sections.length - 1] ?? ''),
        };
      });
      /*
       * The packaging question is asked only when it has two different answers.
       *
       * With something saved and readable, both are offered as radios. With nothing to put
       * beside the page the section is absent altogether — not disabled, absent — because
       * both answers would produce the same lone HTML file, and that is also what keeps the
       * one combination that cannot work out of reach.
       */
      check('theSecondSectionAppearsOnlyWhenItHasSomethingToDecide', () => {
        const dialog = deepQuery('heo-save-dialog');
        const packages = Array.from(dialog?.shadowRoot?.querySelectorAll('.package') ?? []).map(
          (el) => ({
            name: el.querySelector('.name')?.textContent?.trim() ?? null,
            detail: el.querySelector('.detail')?.textContent?.replace(/\s+/g, ' ').trim() ?? null,
            checked: el.querySelector('input')?.checked ?? null,
            type: el.querySelector('input')?.type ?? null,
          }),
        );
        const headings = Array.from(dialog?.shadowRoot?.querySelectorAll('.pick h3') ?? []).map(
          (el) => el.textContent.trim(),
        );
        const offered = headings.includes('Choose how to package it');
        return {
          packages,
          canArchive: engine.canArchiveBundle(),
          // Present exactly when an archive is possible, and never half-present.
          asExpected:
            offered === engine.canArchiveBundle() &&
            packages.length === (offered ? 2 : 0) &&
            packages.every((p) => p.type === 'radio') &&
            packages.filter((p) => p.checked).length === (offered ? 1 : 0),
        };
      });
      /*
       * A disabled box still shows the choice.
       *
       * These two facts were conflated: the box was cleared whenever it was disabled, so a
       * page whose linked files could not be read reported "styles: not folded in" while the
       * export it produced had every inline block in place. Ticked means "fold this in", which
       * is the setting; disabled means "not from here", which is the situation.
       */
      check('aDisabledChoiceStillShowsWhatWasChosen', () => {
        const dialog = deepQuery('heo-save-dialog');
        const rows = Array.from(dialog?.shadowRoot?.querySelectorAll('.choice') ?? []).map((el) => ({
          name: el.querySelector('.name')?.textContent?.trim() ?? null,
          checked: el.querySelector('input')?.checked ?? null,
          disabled: el.querySelector('input')?.disabled ?? null,
        }));
        const options = engine.store.value.bundleOptions;
        const expected = { Styles: 'styles', Scripts: 'scripts', Images: 'images', Fonts: 'fonts' };
        return {
          rows,
          // Every box matches its option, whether or not it can be clicked.
          asExpected: rows.every((row) => row.checked === options[expected[row.name]]),
        };
      });
      check('andTheStepSaysWhatItWillBeCalledAndWhereItGoes', () => {
        const dialog = deepQuery('heo-save-dialog');
        const naming = dialog?.shadowRoot?.querySelector('.naming');
        const field = naming?.querySelector('input[type=text]');
        return {
          // Empty with the page's own name behind it, which is what pressing Write produces.
          value: field?.value ?? null,
          placeholder: field?.placeholder ?? null,
          // Shown, and not a text field: it follows the shape, and a zip named .html is a
          // file that does not open.
          extension: naming?.querySelector('.ext')?.textContent?.trim() ?? null,
          // This browser has a picker, so the destination is a choice rather than a
          // statement. Somewhere without one gets the sentence instead.
          destinationIsAChoice: Boolean(naming?.querySelector('input[type=checkbox]')),
          destination: naming?.querySelector('.to')?.textContent?.replace(/\s+/g, ' ').trim() ?? null,
        };
      });
      check('andTypingInItReachesTheFooter', () => {
        const dialog = deepQuery('heo-save-dialog');
        const field = dialog?.shadowRoot?.querySelector('.naming input[type=text]');
        field.value = 'renamed-from-the-field';
        field.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        return engine.exportFileName;
      });
      await frames();
      check('andTheFooterFollowsTheField', () => {
        const dialog = deepQuery('heo-save-dialog');
        const primary = dialog?.shadowRoot?.querySelector('footer .btn.primary');
        return primary?.textContent.replace(/\s+/g, ' ').trim() ?? null;
      });

      /* ------------------------------------------------------------------ *
       * 6. A browser that cannot take a folder at all.
       *
       * Firefox and Safari opening a page from disk. There is no folder to hand over, so
       * saving a copy is not the fallback — it is the whole of what can be done, and it leads.
       * Reached by taking the directory picker away, because headless Chrome always has one.
       * ------------------------------------------------------------------ */
      step('noPicker');
      const realDirectoryPicker = window.showDirectoryPicker;
      delete window.showDirectoryPicker;
      engine.closeSavePreview();
      await frames();
      api.select(document.getElementById('copy'));
      engine.setStyle('padding', '3px');
      await frames();
      engine.previewSave();
      // The dialog asks what the browser can offer on the way in, and answers a promise.
      for (let i = 0; i < 10; i += 1) await frames();
      check('withoutAFolderPickerSavingACopyLeads', () => {
        const dialog = deepQuery('heo-save-dialog');
        const labels = Array.from(dialog?.shadowRoot?.querySelectorAll('footer .btn') ?? []).map(
          (el) => el.textContent.replace(/\s+/g, ' ').trim(),
        );
        const primaryLabel =
          dialog?.shadowRoot?.querySelector('footer .btn.primary')?.textContent
            ?.replace(/\s+/g, ' ').trim() ?? null;
        return {
          labels,
          primary: primaryLabel,
          // Promoted, and not also duplicated in the slot beside it.
          asExpected:
            /^Save as HTML/.test(primaryLabel ?? '') &&
            labels.filter((label) => /^Save as HTML/.test(label)).length === 1 &&
            !labels.some((label) => /Connect folder/.test(label)),
        };
      });
      window.showDirectoryPicker = realDirectoryPicker;

      results.__errors = errors;
      URL.createObjectURL = realCreate;
      HTMLAnchorElement.prototype.click = realClick;
      window.showSaveFilePicker = realPicker;
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify(results, null, 1) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify({ __fatal: String((e && e.stack) || e) }, null, 1) + ':END';
    });
  </script>
</body>

</html>
