<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset="utf-8">
  <TITLE>Patching the file instead of replacing it</TITLE>
  <style>
    body { margin: 0; padding: 24px; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- Deliberately written the way a person writes HTML: single quotes, an unquoted
       attribute, uppercase tags, a self-closed void element, entities. Serializing the DOM
       normalises every one of them, so if any of this survives a save, the file was
       patched rather than rewritten. -->
  <h1 id="title">Original heading</h1>
  <p id="copy" class=lead data-note='kept'>Original copy with &apos;entities&apos; in it.</p>
  <br />
  <img id="pic" src="a.png" alt="Self closed" />
  <section id="all-stories"></section>
  <ul id="list">
    <!-- An author's comment between children, which a container rebuild must not delete. -->
    <li class="static">Authored item</li>
    <li class="second">Second item</li>
  </ul>
  <!-- Loose text alongside an element, which cannot be rebuilt without losing the words. -->
  <p id="mixed">Hello <b id="bold">world</b> again</p>
  <div class="sec">
    <span class="n">01</span>
    <div class="plain">Nothing identifies this one</div>
  </div>
  <article>
    <p>One</p>
    <p>Two</p>
    <div class="box">Three</div>
    <p>Four</p>
    <p class="note">Five</p>
    <div class="box">Six</div>
    <p>Seven</p>
    <div class="box">Eight</div>
  </article>

  <script src="./stories.js"></script>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const errors = [];
      window.addEventListener('error', (e) => errors.push('error: ' + e.message));
      window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + e.reason));

      const results = {};
      const progress = document.getElementById('progress');
      const check = (name, fn) => {
        progress.textContent = name;
        try { results[name] = fn(); }
        catch (err) { results[name] = 'THREW: ' + (err && err.message ? err.message : String(err)); }
      };
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const byId = (id) => document.getElementById(id);

      // As the Vite plugin does: markers exist in the served DOM and never in the file.
      byId('title').setAttribute('data-heo-src', 'html-patch.html:18:3');
      byId('copy').setAttribute('data-heo-src', 'html-patch.html:19:3');

      const api = window.HtmlEditorOverlay.mount({ theme: 'dark' });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      const page = decodeURIComponent(location.pathname).split('/').pop();
      const directory = decodeURIComponent(location.pathname).replace(/[^/]*$/, '');
      const disk = new Map();
      const project = {
        kind: 'directory',
        label: 'memory',
        resolve(url) {
          const path = decodeURIComponent(new URL(url, location.href).pathname);
          return path.startsWith(directory) ? path.slice(directory.length) : null;
        },
        read: async (path) => {
          if (disk.has(path)) return disk.get(path);
          try {
            const text = await (await fetch('./' + path)).text();
            disk.set(path, text);
            return text;
          } catch { return null; }
        },
        write: async (path, text) => { disk.set(path, text); },
        ensureWritable: async () => true,
        release: async () => { },
      };
      await engine.attachProject(project, { quiet: true });
      await frames();
      const source = await project.read(page);

      /* ------------------------------------------------------------------ *
       * Three patchable edits: text, style and an attribute.
       * ------------------------------------------------------------------ */
      progress.textContent = 'edits';
      const heading = byId('title');
      engine.beginTextEdit(heading);
      await frames();
      heading.firstChild.data = 'Patched heading';
      engine.endTextEdit(true);
      await frames();

      api.select(byId('copy'));
      engine.setStyle('padding', '12px');
      engine.setStyle('color', 'rebeccapurple');
      await frames();
      engine.setAttribute('alt', 'Patched alt', byId('pic'));
      await frames();

      // The reported case: an inline style on an element nothing names.
      const plain = document.querySelector('.sec .plain');
      api.select(plain);
      engine.setStyle('font-size', '48px');
      await frames();

      /*
       * Inserted markup with a subtree, which is the case that leaked.
       *
       * A new child cannot come from the file, so it is serialized from the live DOM — where
       * the build has stamped `data-heo-src` on it and on every element inside it.
       */
      engine.insertMarkup(
        '<div class="sec" id="inserted-sec"><span class="n">01</span><em>deep</em></div>',
        { reference: byId('title'), position: 'after' },
      );
      await frames();

      const plan = await engine.previewWritePlan();
      const doc = (plan?.writes ?? []).find((w) => w.kind === 'document');
      results.thePlanWritesTheDocument = Boolean(doc);
      check('andSaysItPatchedRatherThanRewrote', () => doc?.reason ?? null);

      const after = doc?.after ?? '';

      /* ------------------------------------------------------------------ *
       * The edits landed.
       * ------------------------------------------------------------------ */
      check('theTextEditLanded', () => /<h1 id="title">Patched heading<\/h1>/.test(after));
      check('theStyleEditLanded', () => {
        const match = /<p id="copy"[^>]*style="([^"]*)"/.exec(after);
        return match ? match[1] : null;
      });
      check('theAttributeEditLanded', () => /<img id="pic"[^>]*alt="Patched alt"/.test(after));
      /*
       * And the one that used to rewrite the file: a style on a nameless `<div>`, placed by its
       * position inside a container that can be found.
       */
      check('aStyleOnANamelessDivIsPatchedInPlace', () => {
        const doc5 = new DOMParser().parseFromString(after, 'text/html');
        return doc5.querySelector('.sec .plain')?.getAttribute('style') ?? null;
      });
      // Its sibling, which nothing touched, keeps its own bytes.
      check('andItsUntouchedSiblingIsUnchanged', () =>
        /<span class="n">01<\/span>/.test(after));
      // Two style edits to one element collapse into one attribute, not two.
      check('bothStyleEditsAreInOneAttribute', () =>
        (after.match(/<p id="copy"[^>]*style=/g) || []).length);

      /* ------------------------------------------------------------------ *
       * And no editor bookkeeping travels with it.
       * ------------------------------------------------------------------ */
      check('theInsertedMarkupIsInTheFile', () => /<div class="sec" id="inserted-sec">/.test(after));
      check('butCarriesNoEditorAttributes', () => {
        const doc2 = new DOMParser().parseFromString(after, 'text/html');
        const marked = Array.from(doc2.querySelectorAll('*')).filter((el) =>
          Array.from(el.attributes).some(
            (a) => a.name.startsWith('data-heo-') || a.name === 'contenteditable',
          ),
        );
        return {
          elementsWithEditorAttributes: marked.length,
          // Including the subtree, which is where they were most visible.
          insideTheInsertedSubtree: Array.from(
            doc2.getElementById('inserted-sec')?.querySelectorAll('*') ?? [],
          ).filter((el) => el.hasAttribute('data-heo-src')).length,
        };
      });
      /*
       * And no build marker reaches the file at all — not on the new element, and not on the
       * ones that merely sat there. Those come out of the file, which never had a marker,
       * because the plugin stamps the HTML it serves rather than the HTML on disk.
       */
      // Parsed, not counted in the text: this fixture's own script names the attribute.
      check('noBuildMarkerReachesTheFile', () => ({
        inTheLivePage: document.querySelectorAll('[data-heo-src]').length,
        inTheWrite: new DOMParser()
          .parseFromString(after, 'text/html')
          .querySelectorAll('[data-heo-src]').length,
      }));

      /* ------------------------------------------------------------------ *
       * And nothing else did. Every one of these would be normalised away by
       * serializing the DOM, so their survival is the whole point.
       * ------------------------------------------------------------------ */
      const kept = (name, re) => { results[name] = { inSource: re.test(source), inWrite: re.test(after) }; };
      kept('theAuthorsSingleQuotedHtmlLang', /<html lang='en'>/);
      kept('theAuthorsUnquotedClass', /class=lead/);
      kept('theAuthorsSingleQuotedDataAttribute', /data-note='kept'/);
      kept('theAuthorsUppercaseTitleTag', /<TITLE>/);
      kept('theAuthorsSelfClosedBr', /<br \/>/);
      kept('theAuthorsEntities', /&apos;entities&apos;/);
      kept('theAuthorsComment', /Deliberately written the way a person writes HTML/);

      /*
       * The two bugs this was really for.
       *
       * The rendered list must not be written into the markup, and the container the file
       * declares must come back exactly as the file declares it — empty.
       */
      // Parsed, not pattern-matched: this fixture's own script mentions the class, so a
      // regex over the text would count the test alongside the file.
      const written = () => new DOMParser().parseFromString(after, 'text/html');
      check('theGeneratedListIsNotWrittenIn', () => ({
        inTheLivePage: document.querySelectorAll('#all-stories .story').length,
        inTheWrite: written().querySelectorAll('#all-stories .story').length,
        containerUntouched: /<section id="all-stories"><\/section>/.test(after),
      }));

      /* ------------------------------------------------------------------ *
       * The diff is the size of the change, not the size of the file.
       * ------------------------------------------------------------------ */
      check('theDiffIsSmall', () => {
        const a = source.split('\n');
        const b = after.split('\n');
        let changed = 0;
        for (let i = 0; i < Math.max(a.length, b.length); i += 1) if (a[i] !== b[i]) changed += 1;
        return { changedLines: changed, totalLines: a.length, sameLineCount: a.length === b.length };
      });

      /* ------------------------------------------------------------------ *
       * A structural change cannot be placed, so the file is serialized as
       * before — nothing that used to reach the file stops reaching it.
       * ------------------------------------------------------------------ */
      progress.textContent = 'fallback';
      engine.duplicate(byId('copy'));
      await frames();
      const fallbackPlan = await engine.previewWritePlan();
      const fallbackDoc = (fallbackPlan?.writes ?? []).find((w) => w.kind === 'document');
      check('aStructuralChangeIsPatchedNow', () => ({
        reason: fallbackDoc?.reason ?? null,
        patched: /patched in place/.test(fallbackDoc?.reason ?? ''),
      }));
      // Nothing to warn about: no serialization happened, so neither caveat applies.
      check('soThereIsNothingToWarnAbout', () => (fallbackDoc?.warnings ?? []).length);
      // But the duplicate really is in the bytes, so the edit is not lost.
      check('andTheStructuralEditStillReachesTheFile', () => {
        const doc2 = new DOMParser().parseFromString(fallbackDoc?.after ?? '', 'text/html');
        return doc2.querySelectorAll('p.lead').length;
      });

      /*
       * And the serialized path is clean too, which is the point of pruning at the source
       * rather than only in the patcher: a structural edit has to be allowed to fall back to
       * serialization, and serialization must not write the page's rendered markup into the
       * file whichever way it was reached.
       */
      progress.textContent = 'fallbackIsClean';
      engine.move('down', byId('title'));
      engine.insertMarkup('<p id="added">Added by the user</p>', {
        reference: byId('copy'),
        position: 'after',
      });
      await frames();
      const movedPlan = await engine.previewWritePlan();
      const movedDoc = (movedPlan?.writes ?? []).find((w) => w.kind === 'document');
      check('movingAndAddingIsNowPatchedToo', () =>
        /patched in place/.test(movedDoc?.reason ?? ''));
      // A reorder contributes the bytes the children already had, so the markup that merely
      // moved is byte-identical — including the formatting quirks in it.
      check('theMovedMarkupIsPreservedVerbatim', () => {
        const after2 = movedDoc?.after ?? '';
        return {
          unquotedClassStillThere: /class=lead/.test(after2),
          singleQuotedDataStillThere: /data-note='kept'/.test(after2),
          selfClosedBrStillThere: /<br \/>/.test(after2),
          uppercaseTitleStillThere: /<TITLE>/.test(after2),
        };
      });
      check('butTheGeneratedListIsStillLeftOut', () => {
        const doc3 = new DOMParser().parseFromString(movedDoc?.after ?? '', 'text/html');
        return {
          inTheLivePage: document.querySelectorAll('#all-stories .story').length,
          inTheWrite: doc3.querySelectorAll('#all-stories .story').length,
          containerStillDeclaredEmpty:
            (doc3.getElementById('all-stories')?.innerHTML ?? 'x').trim() === '',
        };
      });
      check('andTheUsersOwnAdditionsAndMovesAreThere', () => {
        const doc3 = new DOMParser().parseFromString(movedDoc?.after ?? '', 'text/html');
        const order = Array.from(doc3.body.querySelectorAll('h1, p[id]')).map((el) => el.id);
        return { added: Boolean(doc3.getElementById('added')), order };
      });
      /*
       * The size test the user actually cares about: a save must not grow the file by the
       * amount the page renders. Compared against the source, which had the container empty.
       */
      check('theRebuiltOrderMatchesTheLivePage', () => {
        const doc3 = new DOMParser().parseFromString(movedDoc?.after ?? '', 'text/html');
        const ids = (root) =>
          Array.from(root.querySelectorAll('body > *'))
            .filter((el) => el.id && el.id !== 'out' && el.id !== 'progress')
            .map((el) => el.id);
        return { inTheFile: ids(doc3), inTheLivePage: ids(document) };
      });
      check('theAuthorsCommentBetweenChildrenSurvives', () =>
        /An author's comment between children/.test(movedDoc?.after ?? ''));

      /* ------------------------------------------------------------------ *
       * A container the rebuild cannot handle safely still falls back, and
       * says so — the escape hatch has to keep existing.
       * ------------------------------------------------------------------ */
      progress.textContent = 'looseText';
      engine.insertMarkup('<i id="added-inline">and</i>', {
        reference: byId('bold'),
        position: 'after',
      });
      await frames();
      const loosePlan = await engine.previewWritePlan();
      const looseDoc = (loosePlan?.writes ?? []).find((w) => w.kind === 'document');
      /*
       * An element mixing prose with tags used to be the one shape that forced a rewrite.
       * It is rebuilt inline now, with no whole-file fallback and nothing to warn about.
       */
      check('aContainerWithLooseTextIsPatchedInlineToo', () => ({
        patched: /patched in place/.test(looseDoc?.reason ?? ''),
        withNothingToWarnAbout: (looseDoc?.warnings ?? []).length,
      }));
      // And the words either side of the new tag are all still there, in order.
      check('andTheLooseWordsAreNotLost', () => {
        const doc4 = new DOMParser().parseFromString(looseDoc?.after ?? '', 'text/html');
        return (doc4.getElementById('mixed')?.textContent ?? '').replace(/\s+/g, ' ').trim();
      });

      /*
       * The reported failure: a container of unnamed children, edited after its shape had
       * already moved on. An insert shifts every later sibling, so the file's seventh child is
       * a `<div>` where the page has a `<p>` — and counting children was enough to give up and
       * rewrite the whole file. Counting only the siblings of the same tag survives it.
       */
      const article = document.querySelector('article');
      api.select(article.children[6]);
      engine.insertMarkup('<p>Inserted ahead of the rest</p>', {
        reference: article.children[1],
        position: 'after',
      });
      await frames();
      api.select(article.querySelector('p.note'));
      engine.setStyle('color', 'teal');
      api.select(article.querySelectorAll('div.box')[2]);
      engine.setStyle('outline', '2px solid red');
      await frames();
      const shiftedPlan = await engine.previewWritePlan();
      const shiftedDoc = (shiftedPlan?.writes ?? []).find((w) => w.kind === 'document');
      check('aShiftedContainerIsStillPatchedInPlace', () => ({
        patched: /patched in place/.test(shiftedDoc?.reason ?? ''),
        withNoRewriteWarning: (shiftedDoc?.warnings ?? []).filter((w) =>
          /whole file is rewritten/.test(w),
        ),
      }));
      // And both edits landed on the elements they were made on, not on their neighbours.
      check('andBothEditsLandedOnTheRightChildren', () => {
        const d = new DOMParser().parseFromString(shiftedDoc?.after ?? '', 'text/html');
        const art = d.querySelector('article');
        return {
          theNote: art?.querySelector('p.note')?.getAttribute('style') ?? null,
          theThirdBox: art?.querySelectorAll('div.box')[2]?.getAttribute('style') ?? null,
          nothingElseStyled: Array.from(art?.children ?? []).filter((el) =>
            el.hasAttribute('style'),
          ).length,
          order: Array.from(art?.children ?? []).map((el) => el.localName).join(','),
        };
      });
      check('theFileDoesNotBalloon', () => {
        const grew = (movedDoc?.after ?? '').length - source.length;
        return { grewBy: grew, underOneKilobyte: Math.abs(grew) < 1024 };
      });

      results.__errors = errors;
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify(results, null, 1) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:{"__errors":["' + String(e && e.message) + '"]}:END';
    });
  </script>
</body>
</html>
