<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Editor overlay — visual state</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0f172a;
      --ink-muted: #4a5568;
      --surface: #ffffff;
      --surface-subtle: #f4f6fb;
      --accent: #4f46e5;
      --accent-soft: #eef0ff;
      --accent-ink: #ffffff;
      --border-color: #dfe4ee;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 40px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --shadow-md: 0 10px 30px -12px rgb(15 23 42 / 18%);
      --text-sm: 14px;
      --text-lg: 20px;
      --text-xl: 32px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--surface-subtle);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      line-height: 1.6;
    }

    .shell {
      width: min(760px, calc(100% - var(--space-xl)));
      margin: var(--space-xl) auto;
    }

    .hero-title {
      margin: 0 0 var(--space-sm);
      font-size: var(--text-xl);
      letter-spacing: -0.02em;
    }

    .lede {
      margin: 0 0 var(--space-lg);
      color: var(--ink-muted);
      font-size: var(--text-lg);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-lg);
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      padding: var(--space-lg);
      background: var(--surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
    }

    .card h2 {
      margin: 0;
      font-size: var(--text-lg);
    }

    .card p {
      margin: 0;
      color: var(--ink-muted);
      font-size: var(--text-sm);
    }

    .button {
      align-self: flex-start;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--accent-ink);
      text-decoration: none;
      font-size: var(--text-sm);
      font-weight: 600;
    }
  </style>
</head>

<body>
  <!-- Renders the overlay in a representative state so the chrome can be reviewed. -->
  <main class="shell">
    <h1 class="hero-title" id="title">Visual state</h1>
    <p class="lede">Edit mode on, an element selected, the Styles panel open.</p>
    <div class="grid">
      <article class="card" id="card-one">
        <h2>Token-aware</h2>
        <p>Spacing and colour come from the page's own custom properties.</p>
        <a class="button" href="#a">Primary action</a>
      </article>
      <article class="card" id="card-two">
        <h2>Second card</h2>
        <p>Selected below, so the outline, badge, drag thumb and insert affordances all show.</p>
        <a class="button" href="#b">Secondary</a>
      </article>
    </div>
  </main>
  <pre id="out" style="position:fixed;left:-9999px">pending</pre>

  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      // `?state=` picks which piece of chrome to show, so one fixture can be
      // captured in several states without duplicating the page.
      const state = new URLSearchParams(location.search).get('state') || 'styles';
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const api = window.HtmlEditorOverlay.mount({ theme: 'dark', accent: '#6366f1' });
      const engine = api.engine;

      api.setEditing(true);
      await wait(120);
      api.select(document.getElementById('card-two'));
      await wait(120);

      if (state === 'extract') {
        engine.setStyle('padding', 'var(--space-xl)');
        engine.setStyle('border-color', 'var(--accent)');
        await wait(60);
        engine.beginClassExtraction(document.getElementById('card-two'));
      } else if (state === 'extract-merge') {
        // Extraction aimed at a class the page already defines, so the merge
        // review has an override to report and both cards are affected by it.
        engine.setStyle('padding', 'var(--space-xl)');
        engine.setStyle('gap', '18px');
        engine.setStyle('outline', '2px solid var(--accent)');
        await wait(60);
        engine.beginClassExtraction(document.getElementById('card-two'));
        await wait(60);
        engine.updateExtraction({ name: 'card' });
      } else if (state === 'seed') {
        // The Share & import section, open, with a real seed in it. Closed by
        // default in the panel, so it has to be clicked for the shot.
        engine.classes.upsert({ name: 'promo', declarations: { padding: '18px', gap: '10px' }, origin: 'user' });
        api.openPanel('tokens');
        await wait(260);
        const panel = document.querySelector('html-editor-overlay > heo-overlay')
          .shadowRoot.querySelector('heo-dock').shadowRoot
          .querySelector('heo-tokens-panel');
        const section = Array.from(panel.shadowRoot.querySelectorAll('heo-section'))
          .find((s) => s.heading === 'Share & import');
        section?.shadowRoot.querySelector('button')?.click();
        await wait(300);
        section?.scrollIntoView({ block: 'center' });
      } else if (state === 'extract-list') {
        // The class-name combobox open, so the list's placement over the modal can
        // be reviewed — it is a popover in the top layer, not an in-flow panel.
        engine.setStyle('padding', 'var(--space-xl)');
        await wait(60);
        engine.beginClassExtraction(document.getElementById('card-two'));
        await wait(120);
        const dialog = document.querySelector('html-editor-overlay > heo-overlay')
          .shadowRoot.querySelector('heo-extract-dialog');
        dialog.shadowRoot.querySelector('.combo .chev').click();
      } else if (state === 'detach') {
        // The inverse: a class two elements share, with its editor open and the
        // "just this element" options expanded.
        api.openPanel('styles');
        await wait(220);
        const dockNode = document.querySelector('html-editor-overlay > heo-overlay')
          .shadowRoot.querySelector('heo-dock');
        const panel = dockNode.shadowRoot.querySelector('heo-styles-panel');
        const chip = Array.from(panel.shadowRoot.querySelectorAll('.chip .name'))
          .find((b) => b.textContent.trim() === 'card');
        chip?.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
        await wait(160);
        const link = Array.from(panel.shadowRoot.querySelectorAll('.link'))
          .find((b) => b.textContent.includes('Just this element'));
        link?.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
        await wait(160);
        panel.shadowRoot.querySelector('.detach')?.scrollIntoView({ block: 'center' });
      } else if (state === 'extract-block') {
        engine.beginBlockExtraction(document.getElementById('card-two'));
      } else if (state === 'modified') {
        document.getElementById('card-two').setAttribute('style', 'padding: 32px; color: #0f172a; border-radius: 20px');
        api.select(null);
        api.select(document.getElementById('card-two'));
        engine.setStyle('gap', '12px');
        api.openPanel('styles');
      } else if (state === 'floating') {
        api.openPanel('styles');
        await wait(150);
        engine.setDockFloat(80, 120, 620);
      } else if (state === 'parent') {
        // A child that wants to be wider than its container allows, so both the
        // constraint notice and the parent controls have something to say.
        const shell = document.createElement('div');
        shell.id = 'shell';
        shell.style.cssText =
          'max-width:220px;display:flex;flex-direction:column;gap:var(--space-sm);padding:var(--space-md);background:#fff;border-radius:var(--radius-md)';
        shell.innerHTML =
          '<div id="wide" style="width:900px;height:28px;background:var(--accent-soft);border-radius:6px"></div>';
        document.querySelector('.shell').appendChild(shell);
        await wait(80);
        api.openPanel('styles');
        api.select(document.getElementById('wide'));
        await wait(220);
        const dockNode = document.querySelector('html-editor-overlay > heo-overlay')
          .shadowRoot.querySelector('heo-dock');
        const stylesPanel = dockNode.shadowRoot.querySelector('heo-styles-panel');
        const section = Array.from(stylesPanel.shadowRoot.querySelectorAll('heo-section'))
          .find((s) => s.heading === 'In its parent');
        section?.scrollIntoView({ block: 'start' });
      } else if (state === 'menu') {
        engine.setQuickMenu(true);
      } else if (state === 'insert') {
        engine.setInsertAnchor({ reference: document.getElementById('card-two'), position: 'after' });
      } else if (state === 'save') {
        engine.setStyle('padding', 'var(--space-xl)');
        engine.setStyle('border-radius', 'var(--radius-lg)');
        engine.tokens.upsert({ name: 'accent-hover', value: '#4338ca', group: 'color' });
        engine.extractClassFromSelection('card-featured');
        await wait(80);
        engine.previewSave();
      } else if (state === 'insert-html') {
        // The insert menu with the HTML primitives section showing.
        engine.setInsertAnchor({ reference: document.getElementById('card-two'), position: 'after' });
        await wait(220);
      } else if (state === 'insert-html-old') {
        // The deprecated corner of the catalogue, labelled for what it is.
        engine.setInsertAnchor({ reference: document.getElementById('card-two'), position: 'after' });
        await wait(220);
        const oldMenu = document.querySelector('html-editor-overlay > heo-overlay')
          .shadowRoot.querySelector('heo-insert-menu');
        const oldInput = oldMenu.shadowRoot.querySelector('.top input');
        oldInput.value = 'old web';
        oldInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await wait(220);
      } else if (state === 'insert-html-all') {
        // Same menu, switched to the HTML primitives.
        engine.setInsertAnchor({ reference: document.getElementById('card-two'), position: 'after' });
        await wait(220);
        const menu = document.querySelector('html-editor-overlay > heo-overlay')
          .shadowRoot.querySelector('heo-insert-menu');
        const scope = menu.shadowRoot.querySelector('.scope heo-segmented');
        Array.from(scope.shadowRoot.querySelectorAll('button'))
          .find((b) => b.textContent.trim() === 'HTML')
          ?.click();
        await wait(240);
      } else if (state === 'save-transfer') {
        // The save dialog's follow-up step: the same Share & import surface the
        // Tokens panel offers, reached from the Design system button.
        engine.setStyle('padding', 'var(--space-xl)');
        engine.tokens.upsert({ name: 'accent-hover', value: '#4338ca', group: 'color' });
        engine.extractClassFromSelection('card-featured');
        await wait(80);
        engine.previewSave();
        await wait(220);
        const saveDialog = document.querySelector('html-editor-overlay > heo-overlay')
          .shadowRoot.querySelector('heo-save-dialog');
        Array.from(saveDialog.shadowRoot.querySelectorAll('footer .btn'))
          .find((b) => b.textContent.includes('Design system'))
          ?.click();
        await wait(260);
      } else if (state === 'text') {
        engine.beginTextEdit(document.getElementById('card-two').querySelector('h2'));
      } else if (state === 'drag') {
        const el = document.getElementById('card-two');
        engine.startDrag(el, 700, 460);
        engine.updateDrag(700, 460);
      } else {
        api.openPanel(state);
      }

      await wait(400);
      document.getElementById('out').textContent = 'RESULTS:ready:END';
    })();
  </script>
</body>

</html>
