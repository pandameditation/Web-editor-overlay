<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Shadow editor</title>
  <!--
    The shadow editor opens from the control at the head of the box-shadow and text-shadow fields,
    where a colour has its swatch. It edits a stack of shadows, live, with swatches (the value as it
    was, then the design system's shadow tokens or HEO's own). The filter field's editor is
    test/filter-editor.html.
  -->
  <style id="site">
    :root {
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 10%), 0 2px 4px -2px rgb(0 0 0 / 10%);
    }
  </style>
</head>

<body>
  <div id="card" style="width:200px;padding:20px;clip-path:inset(-40px round 16px);box-shadow:0 1px 2px rgb(0 0 0 / 6%), 0 8px 24px -6px rgb(15 23 42 / 18%)">Card</div>
  <p id="title">A title</p>
  <div id="plain" style="width:80px;height:20px;box-shadow:0 2px 6px rgb(0 0 0 / 20%)">Plain</div>
  <img id="icon" alt="" src="nested/dot.svg" style="width:24px;box-shadow:0 2px 6px rgb(0 0 0 / 20%)">
  <img id="photo" alt="" style="width:24px;box-shadow:0 2px 6px rgb(0 0 0 / 20%)" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=">
  <div id="named" style="width:80px;height:20px;box-shadow:0 2px 6px black, 0 0 0 1px var(--shadow-md)">Named</div>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + event.reason));
      const progress = document.getElementById('progress');
      const settle = (ms = 300) => new Promise((resolve) => setTimeout(resolve, ms));
      const check = async (name, fn) => {
        progress.textContent = name;
        try { results[name] = await fn(); } catch (err) { results[name] = 'THREW: ' + String(err && err.stack); }
      };
      const deep = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const found = deep(selector, el.shadowRoot);
          if (found) return found;
        }
        return null;
      };
      const flat = (node) => (node?.textContent ?? '').replace(/\s+/g, ' ').trim();
      const api = window.HtmlEditorOverlay.mount({ theme: 'dark', presets: false, detectScriptContent: false });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      engine.setDockTab('styles');
      const sroot = () => deep('heo-styles-panel').shadowRoot;
      const field = (property) => sroot()?.querySelector(`heo-value-field[data-property="${property}"]`);
      const opener = (property) => field(property)?.shadowRoot?.querySelector('.shadow-btn');
      const editor = (property) => field(property)?.shadowRoot?.querySelector('heo-shadow-editor');
      const ed = (property) => editor(property)?.shadowRoot;
      const button = (root, re) => Array.from(root?.querySelectorAll('button') ?? []).find((b) => re.test(flat(b)) || re.test(b.getAttribute('aria-label') ?? ''));
      const inline = (el, property) => el.style.getPropertyValue(property).replace(/\s+/g, ' ').trim();
      // What the browser makes of a value, so an expected value compares with a written one in one form.
      const as = (property, value) => {
        const probe = document.createElement('i');
        probe.style.setProperty(property, value);
        return probe.style.getPropertyValue(property).replace(/\s+/g, ' ').trim();
      };
      const is = (el, property, value) => inline(el, property) === as(property, value);
      const select = async (id) => {
        const el = document.getElementById(id);
        api.select(el);
        await settle(500);
        const section = sroot().querySelector('[data-declarations="effects"]')?.closest('heo-section');
        if (section && !section.open) section.shadowRoot?.querySelector('button')?.click();
        await settle(300);
        return el;
      };
      // The opener toggles, so a field whose editor is still up from an earlier step is left as it is.
      const open = async (property) => {
        if (!editor(property)) opener(property).click();
        await settle(350);
      };
      const head = (property) => field(property)?.shadowRoot?.querySelector('.popup.dialog .dialog-head');
      const lengthField = (root, label) => Array.from(root.querySelectorAll('heo-value-field')).find((one) => one.getAttribute('field-label') === label);
      const send = async (target, type, value) => {
        target.dispatchEvent(new CustomEvent(type, { detail: { value }, bubbles: true, composed: true }));
        await settle(250);
      };

      // Real key presses: a synthetic Escape is never handled as the page's own shortcut.
      let keySeq = 0;
      const keyWaiters = new Map();
      window.__heoKeysDone = (id) => { keyWaiters.get(id)?.(); keyWaiters.delete(id); };
      const keys = (...names) => new Promise((resolve) => {
        const id = ++keySeq;
        keyWaiters.set(id, resolve);
        window.__heoPressKeys(JSON.stringify({ id, keys: names }));
      }).then(() => settle(300));
      const focusedIn = (el) => el?.shadowRoot?.activeElement ?? null;

      const card = await select('card');

      await check('opener', () => {
        const box = field('box-shadow');
        const lead = opener('box-shadow');
        const input = box?.shadowRoot?.querySelector('input[type="text"]');
        return {
          theBoxShadowFieldHasTheOpener: Boolean(lead),
          onTheLeftLikeTheColorSwatch: Boolean(lead && input) && lead.getBoundingClientRect().right <= input.getBoundingClientRect().left + 1,
          textShadowHasOneToo: Boolean(opener('text-shadow')),
          filterHasOneToo: Boolean(opener('filter')),
          // The control at the head draws the shadow it opens.
          drawsTheShadow: /px/.test(lead?.querySelector('i')?.getAttribute('style') ?? ''),
        };
      });

      await check('open', async () => {
        await open('box-shadow');
        const root = ed('box-shadow');
        const layers = root?.querySelectorAll('.layer') ?? [];
        const swatches = Array.from(root?.querySelectorAll('.swatch') ?? []);
        return {
          opensInTheFieldsPopup: Boolean(editor('box-shadow')),
          readsTheStackFromTheRule: layers.length === 2,
          theLastShadowIsPicked: layers[1]?.getAttribute('aria-current') === 'true',
          firstSwatchIsTheValueAsItWas: swatches[0]?.dataset.swatch === 'original' && swatches[0]?.getAttribute('aria-pressed') === 'true',
          theDesignSystemsTokenIsASwatch: swatches.some((one) => one.dataset.swatch === '--shadow-md'),
          // The value as it was, a rule, the design system's tokens, a rule, then HEO's eight.
          swatchesInThreeGroups: (() => {
            const kids = Array.from(root.querySelector('.swatches').children).map((one) => one.classList.contains('sep') ? '|' : one.dataset.swatch);
            return kids.join(',') === 'original,|,--shadow-md,|,Soft,Lifted,Hard,Glow,Neon,Inner,Deep,Ring';
          })(),
          // Last, after the controls, as in the colour picker.
          swatchesComeLast: Boolean(root.querySelector('.offset')) &&
            (root.querySelector('.offset').compareDocumentPosition(root.querySelector('.swatches')) & Node.DOCUMENT_POSITION_FOLLOWING) !== 0,
          // The box-shadow ↔ drop-shadow() switch is gone: one property, one editor.
          noConversionSwitch: !root?.querySelector('.convert') && !/drop-shadow\(\) instead/i.test(flat(root)),
          noHintUnderTheSwatches: !/HEO's own/i.test(flat(root)),
          closesWithAnXNotDone: Boolean(head('box-shadow')?.querySelector('button[aria-label="Close"]')) && !button(root, /^done$/i),
          removesWithTheTrash: root.querySelectorAll('.layer .kill').length === 2,
          saysColorNotColour: /\bColor\b/.test(flat(root)) && !/colour/i.test(flat(root)),
        };
      });

      await check('live', async () => {
        const root = ed('box-shadow');
        const recordsBefore = engine.history.records.length;
        const blur = root.querySelectorAll('input[type="range"]')[0];
        blur.value = '40';
        blur.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await settle(150);
        const previewed = getComputedStyle(card).boxShadow.includes('40px');
        // A preview is not an edit: nothing on the undo stack yet.
        const notWrittenYet = engine.history.records.length === recordsBefore;
        blur.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
        await settle(400);
        const written = inline(card, 'box-shadow');
        void written;
        return {
          previewsWhileDragging: previewed,
          writesNothingWhileDragging: notWrittenYet,
          writesWhenItSettles: is(card, 'box-shadow', '0 1px 2px rgb(0 0 0 / 6%), 0 8px 40px -6px rgb(15 23 42 / 18%)'),
          staysOpen: Boolean(editor('box-shadow')),
        };
      });

      await check('fields', async () => {
        const root = ed('box-shadow');
        await send(lengthField(root, 'Offset X'), 'value-change', '5px');
        await send(lengthField(root, 'Spread'), 'value-change', '2px');
        const opacity = ed('box-shadow').querySelector('#heo-shadow-alpha');
        opacity.value = '50';
        opacity.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
        await settle(400);
        const written = inline(card, 'box-shadow');
        const inset = ed('box-shadow').querySelector('heo-segmented[label="Outer or inset"]');
        inset.dispatchEvent(new CustomEvent('segment-change', { detail: { value: 'inset' }, bubbles: true, composed: true }));
        await settle(400);
        return {
          xSpreadAndOpacityWrite: written === as('box-shadow', '0 1px 2px rgb(0 0 0 / 6%), 5px 8px 40px 2px rgb(15 23 42 / 50%)'),
          insetWrites: is(card, 'box-shadow', '0 1px 2px rgb(0 0 0 / 6%), inset 5px 8px 40px 2px rgb(15 23 42 / 50%)'),
        };
      });

      await check('pad', async () => {
        const pad = ed('box-shadow').querySelector('.pad');
        pad.focus();
        pad.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', shiftKey: true, bubbles: true, composed: true }));
        await settle(400);
        return { arrowKeysNudgeTheOffset: is(card, 'box-shadow', '0 1px 2px rgb(0 0 0 / 6%), inset 15px 8px 40px 2px rgb(15 23 42 / 50%)') };
      });

      await check('order', async () => {
        const before = inline(card, 'box-shadow');
        const rows = () => Array.from(ed('box-shadow').querySelectorAll('.layer'));
        // Alt and an arrow move the focused row, the keyboard's reorder, as in the background editor.
        rows()[0].focus();
        rows()[0].dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', altKey: true, bubbles: true, composed: true }));
        await settle(400);
        const swapped = inline(card, 'box-shadow');
        // And by dragging a row onto another, back again.
        const data = new DataTransfer();
        rows()[1].dispatchEvent(new DragEvent('dragstart', { dataTransfer: data, bubbles: true, composed: true }));
        rows()[0].dispatchEvent(new DragEvent('dragover', { dataTransfer: data, bubbles: true, composed: true, cancelable: true }));
        rows()[0].dispatchEvent(new DragEvent('drop', { dataTransfer: data, bubbles: true, composed: true, cancelable: true }));
        await settle(400);
        const parts = (text) => text.split(/,(?![^(]*\))/).map((one) => one.trim());
        return {
          rowsCanBeDragged: rows().every((row) => row.draggable && row.querySelector('.grip')),
          altArrowMovesAShadowDown: parts(swapped)[0] === parts(before)[1] && parts(swapped)[1] === parts(before)[0],
          draggingMovesItBack: inline(card, 'box-shadow') === before,
        };
      });

      await check('move', async () => {
        const popup = () => field('box-shadow').shadowRoot.querySelector('.popup');
        const start = popup().getBoundingClientRect();
        const grab = head('box-shadow');
        const box = grab.getBoundingClientRect();
        const pointer = (type, x, y) => grab.dispatchEvent(new PointerEvent(type, { pointerId: 9, button: 0, clientX: x, clientY: y, bubbles: true, composed: true }));
        
        pointer('pointerdown', box.left + 40, box.top + 8);
        pointer('pointermove', box.left + 10, box.top + 38);
        pointer('pointerup', box.left + 10, box.top + 38);
        await settle(250);
        const moved = popup().getBoundingClientRect();
        return {
          theHeadMovesTheEditor: Math.round(moved.left - start.left) === -30 && Math.round(moved.top - start.top) === 30,
          andItStaysOpen: Boolean(editor('box-shadow')),
        };
      });

      await check('swatches', async () => {
        const token = () => Array.from(ed('box-shadow').querySelectorAll('.swatch')).find((one) => one.dataset.swatch === '--shadow-md');
        token().click();
        await settle(400);
        const asVar = inline(card, 'box-shadow') === 'var(--shadow-md)';
        const loaded = ed('box-shadow').querySelectorAll('.layer').length === 2 && token().getAttribute('aria-pressed') === 'true';
        // The second shadow, so the edit below is on a known one.
        ed('box-shadow').querySelectorAll('.layer')[1]?.click();
        await settle(100);
        await send(lengthField(ed('box-shadow'), 'Offset X'), 'value-change', '3px');
        const edited = inline(card, 'box-shadow');
        const original = () => ed('box-shadow').querySelector('.swatch[data-swatch="original"]');
        original().click();
        await settle(400);
        return {
          aTokenPickedIsWrittenAsItsVar: asVar,
          andLoadsIntoTheEditor: loaded,
          // The picked shadow is still the second one; its X changes, the rest is the token's values.
          editingAfterwardsWritesTheValues: edited === as('box-shadow', '0 4px 6px -1px rgb(0 0 0 / 10%), 3px 2px 4px -2px rgb(0 0 0 / 10%)'),
          theSwatchItselfIsUnchanged: token().getAttribute('aria-pressed') === 'false',
          theFirstSwatchPutsBackTheValueAsItWas: is(card, 'box-shadow', '0 1px 2px rgb(0 0 0 / 6%), 0 8px 24px -6px rgb(15 23 42 / 18%)'),
        };
      });

      /*
       * A named shadow colour froze the page: reading it appended a probe to the body on every render,
       * the editor sees body changes as page edits and re-renders, and the next render probed again.
       */
      await check('dialog', async () => {
        await select('plain');
        // Still up from the swatches above: the opener toggles, so close it first.
        if (editor('box-shadow')) head('box-shadow').querySelector('button[aria-label="Close"]').click();
        await settle(250);
        // Looked at in the frame it opens: the animation is over in 170ms.
        opener('box-shadow').click();
        await new Promise((resolve) => requestAnimationFrame(resolve));
        const popup = () => field('box-shadow').shadowRoot.querySelector('.popup.dialog');
        const opening = popup()?.getAnimations().some((one) => one.animationName === 'dialog-in');
        await settle(350);
        head('box-shadow').querySelector('button[aria-label="Close"]').click();
        await settle(250);
        const closed = !editor('box-shadow');
        // The colour picker has the same head: moved by it, closed by its cross.
        const colour = Array.from(sroot().querySelectorAll('heo-value-field')).find((one) => one.kind === 'color');
        colour?.pickColor();
        await settle(500);
        const pick = () => colour.shadowRoot.querySelector('.popup.dialog');
        const pickHead = colour.shadowRoot.querySelector('.dialog-head');
        const pointer = (type, x, y) => pickHead.dispatchEvent(new PointerEvent(type, { pointerId: 7, button: 0, clientX: x, clientY: y, bubbles: true, composed: true }));
        // A press that does not move settles it where it is drawn; this small test viewport can cap
        // its first placement, after which it grows about its middle, which is not the drag.
        pointer('pointerdown', 0, 0);
        pointer('pointerup', 0, 0);
        await settle(300);
        const start = pick()?.getBoundingClientRect();
        const box = pickHead?.getBoundingClientRect();
        if (box) {
          pointer('pointerdown', box.left + 30, box.top + 6);
          pointer('pointermove', box.left + 10, box.top + 26);
          pointer('pointerup', box.left + 10, box.top + 26);
        }
        await settle(250);
        const moved = pick()?.getBoundingClientRect();
        const titled = /color/i.test(flat(pickHead?.querySelector('.title')));
        pickHead?.querySelector('button[aria-label="Close"]')?.click();
        await settle(250);
        return {
          theShadowEditorOpensWithItsAnimation: Boolean(opening),
          andItsCrossClosesIt: closed,
          theColorPickerHasTheSameHead: Boolean(pickHead) && titled,
          // Its middle follows the pointer: it may also grow a little about it once uncapped.
          itMovesByItsHead: Boolean(start && moved) && Math.round(moved.left - start.left) === -20 &&
            Math.abs((moved.top + moved.height / 2) - (start.top + start.height / 2) - 20) <= 2,
          andItsCrossClosesIt2: !colour.shadowRoot.querySelector('.popup.dialog'),
        };
      });

      /*
       * Escape closes the dialog, and only the dialog: it used to reach the page's shortcut and
       * deselect the element. Focus goes back to the button that opened it, never to the text.
       */
      await check('escape', async () => {
        await select('plain');
        await open('box-shadow');
        await keys('Escape');
        const afterOpen = { closed: !editor('box-shadow'), selected: Boolean(engine.store.value.selected), onButton: focusedIn(field('box-shadow'))?.classList.contains('shadow-btn') };
        // After a swatch picked with the mouse.
        await open('box-shadow');
        const swatch = ed('box-shadow').querySelectorAll('.swatch')[3];
        swatch.click();
        swatch.focus();
        await settle(300);
        await keys('Escape');
        const afterSwatch = { closed: !editor('box-shadow'), selected: Boolean(engine.store.value.selected) };
        // From inside one of its own fields, with no list open.
        await open('box-shadow');
        const blur = lengthField(ed('box-shadow'), 'Blur');
        blur.focusInput();
        await settle(200);
        // Innermost first: a list the field opened closes before the dialog does.
        if (blur.listIsOpen) await keys('Escape');
        const stillOpenAfterList = Boolean(editor('box-shadow'));
        await keys('Escape');
        const afterField = { closed: !editor('box-shadow'), selected: Boolean(engine.store.value.selected) };
        // The cross, too, hands focus to the button.
        await open('box-shadow');
        head('box-shadow').querySelector('button[aria-label="Close"]').click();
        await settle(300);
        const crossFocus = focusedIn(field('box-shadow'));
        // And the colour picker, the same way.
        const colour = Array.from(sroot().querySelectorAll('heo-value-field')).find((one) => one.kind === 'color');
        colour.shadowRoot.querySelector('.color-btn').click();
        await settle(500);
        await keys('Escape');
        const pickerClosed = !colour.shadowRoot.querySelector('heo-color-picker');
        return {
          escapeClosesIt: afterOpen.closed,
          andKeepsTheElementSelected: afterOpen.selected,
          focusReturnsToItsButton: Boolean(afterOpen.onButton),
          escapeWorksAfterClickingASwatch: afterSwatch.closed && afterSwatch.selected,
          escapeWorksFromItsOwnField: stillOpenAfterList && afterField.closed && afterField.selected,
          theCrossHandsFocusToTheButtonNotTheText: Boolean(crossFocus?.classList.contains('shadow-btn')),
          theColorPickerClosesTheSameWay: pickerClosed && Boolean(engine.store.value.selected) &&
            Boolean(focusedIn(colour)?.classList.contains('color-btn')),
        };
      });

      /*
       * Focus goes into a popover when it opens, as the overlay's other popovers do: to its first
       * control, not the grip or the cross. And it never drops on nothing when a control goes away.
       */
      await check('focus', async () => {
        const deepIn = (root) => { let a = root?.activeElement; while (a?.shadowRoot?.activeElement) a = a.shadowRoot.activeElement; return a; };
        await select('plain');
        if (editor('box-shadow')) head('box-shadow').querySelector('button[aria-label="Close"]').click();
        await settle(250);
        opener('box-shadow').click();
        await settle(500);
        const onOpen = deepIn(field('box-shadow').shadowRoot);
        const insideEditor = Boolean(onOpen) && editor('box-shadow').shadowRoot.contains(onOpen.getRootNode() === editor('box-shadow').shadowRoot ? onOpen : onOpen.getRootNode().host);
        const firstControl = onOpen?.matches?.('.layer, .add-first, button[aria-label="Add a shadow"]');
        // Add, then the trash: focus follows into the stack instead of dropping.
        button(ed('box-shadow'), /add a shadow/i).click();
        await settle(400);
        const afterAdd = ed('box-shadow').activeElement;
        const rows = ed('box-shadow').querySelectorAll('.layer').length;
        ed('box-shadow').querySelector(`.layer[data-layer="${rows - 1}"] .kill`).click();
        await settle(400);
        const afterTrash = ed('box-shadow').activeElement;
        const stillOpen = Boolean(editor('box-shadow'));
        head('box-shadow').querySelector('button[aria-label="Close"]').click();
        await settle(250);
        // The colour picker the same way.
        const colour = Array.from(sroot().querySelectorAll('heo-value-field')).find((one) => one.kind === 'color');
        colour.shadowRoot.querySelector('.color-btn').click();
        await settle(500);
        const inPicker = deepIn(colour.shadowRoot);
        const pickerFocused = Boolean(inPicker) && Boolean(colour.shadowRoot.querySelector('heo-color-picker')?.shadowRoot?.contains(inPicker));
        await keys('Escape');
        return {
          openingFocusesTheEditorsFirstControl: insideEditor && Boolean(firstControl),
          notTheGripOrTheCross: !onOpen?.closest?.('.dialog-head'),
          addingAShadowFocusesItsRow: afterAdd?.matches('.layer') && afterAdd.dataset.layer === String(rows - 1),
          removingOneKeepsFocusInTheStack: stillOpen && Boolean(afterTrash?.matches('.layer, .add-first')),
          theColorPickerFocusesInsideToo: pickerFocused,
        };
      });

      await check('namedColorDoesNotLoop', async () => {
        const named = await select('named');
        let bodyChanges = 0;
        const watch = new MutationObserver((list) => { bodyChanges += list.length; });
        watch.observe(document.body, { childList: true });
        await open('box-shadow');
        let late = 0;
        for (let i = 0; i < 10; i += 1) {
          const t = performance.now();
          await settle(50);
          late += Math.max(0, performance.now() - t - 50);
        }
        watch.disconnect();
        // The last shadow is picked, and its var() colour has no opacity to read; the first is black.
        const tokenAlphaOff = ed('box-shadow')?.querySelector('#heo-shadow-alpha')?.disabled === true;
        ed('box-shadow')?.querySelectorAll('.layer')[0]?.click();
        await settle(200);
        const alpha = ed('box-shadow')?.querySelector('#heo-shadow-alpha');
        void named;
        return {
          theEditorOpens: Boolean(editor('box-shadow')),
          nothingIsAddedToThePage: bodyChanges === 0,
          thePageStaysResponsive: late < 250,
          aNamedColorsOpacityIsRead: Boolean(alpha && !alpha.disabled && alpha.value === '100'),
          aTokenColorsOpacityIsOffNotGuessed: tokenAlphaOff,
        };
      });

      const title = await select('title');
      await check('text', async () => {
        await open('text-shadow');
        const root = ed('text-shadow');
        const blocked = Array.from(root.querySelectorAll('.swatch')).filter((one) => one.disabled).length;
        // Held, not looked up again: once set, text-shadow also gets a row in Effective styles above.
        const opened = field('text-shadow');
        const popup = () => opened.shadowRoot.querySelector('.popup.dialog');
        const before = popup().getBoundingClientRect();
        button(root, /^add shadow$/i).click();
        await settle(400);
        const after = popup().getBoundingClientRect();
        const middle = (rect) => rect.top + rect.height / 2;
        // Grown about its middle, unless that would have pushed it off the screen.
        const inPlace = Math.abs(middle(after) - middle(before)) < 2 || Math.round(after.top) === 8 || Math.round(after.bottom) === innerHeight - 8;
        const sameColumn = Math.abs(after.left - before.left) < 1;
        return {
          addingTheFirstShadowGrowsItInPlace: after.height > before.height + 40 && inPlace && sameColumn,
          opensInTextMode: /text shadow/i.test(flat(opened.shadowRoot.querySelector('.dialog-head .title'))),
          spreadIsOff: Boolean(root.querySelector('.line.off')),
          // Only HEO's Inner is an inset shadow, which a text shadow cannot be; the token stays on.
          onlyTheInsetSwatchIsOff: blocked === 1,
          writesAValidTextShadow: is(title, 'text-shadow', '0px 4px 12px rgb(0 0 0 / 20%)') && getComputedStyle(title).textShadow !== 'none',
        };
      });

      await check('tokensPanel', async () => {
        engine.setDockTab('tokens');
        await settle(600);
        const troot = deep('heo-tokens-panel').shadowRoot;
        const group = Array.from(troot.querySelectorAll('heo-section')).find((one) => /shadow/i.test(one.getAttribute('heading') ?? ''));
        if (group && !group.open) group.shadowRoot?.querySelector('button')?.click();
        await settle(300);
        const token = Array.from(troot.querySelectorAll('heo-value-field')).find((one) => one.getAttribute('label') === 'shadow-md');
        token?.shadowRoot?.querySelector('.shadow-btn')?.click();
        await settle(400);
        const editorRoot = token?.shadowRoot?.querySelector('heo-shadow-editor')?.shadowRoot;
        const names = Array.from(editorRoot?.querySelectorAll('.swatch') ?? []).map((one) => one.dataset.swatch);
        await send(Array.from(editorRoot?.querySelectorAll('heo-value-field') ?? []).find((one) => one.getAttribute('field-label') === 'Offset X'), 'value-change', '2px');
        const value = engine.tokens.get('shadow-md')?.value ?? '';
        token?.shadowRoot?.querySelector('.dialog-head button[aria-label="Close"]')?.click();
        await settle(300);
        engine.setDockTab('styles');
        await settle(400);
        return {
          aShadowTokenHasTheEditor: Boolean(editorRoot),
          readsItsTwoShadows: editorRoot?.querySelectorAll('.layer').length === 2,
          // A token offered as its own swatch would write var() of itself.
          isNotItsOwnSwatch: !names.includes('--shadow-md'),
          editingWritesTheToken: value === '0 4px 6px -1px rgb(0 0 0 / 10%), 2px 2px 4px -2px rgb(0 0 0 / 10%)',
          xClosesIt: !token?.shadowRoot?.querySelector('heo-shadow-editor'),
        };
      });

      await check('heoSwatches', async () => {
        // No shadow tokens: HEO's own eight.
        for (const token of engine.tokens.list().filter((one) => one.group === 'shadow')) engine.tokens.remove(token.name);
        await select('card');
        await open('box-shadow');
        const names = Array.from(ed('box-shadow')?.querySelectorAll('.swatch') ?? []).map((one) => one.dataset.swatch);
        await select('title');
        await open('text-shadow');
        const off = Array.from(ed('text-shadow')?.querySelectorAll('.swatch') ?? []).filter((one) => one.disabled).map((one) => one.dataset.swatch);
        return {
          theFirstIsStillTheValueAsItWas: names[0] === 'original',
          thenHeosEight: names.length === 9 && names.includes('Soft') && names.includes('Ring'),
          // Inner is an inset shadow, which a text shadow cannot be.
          anInsetSwatchIsOffForText: off.length === 1 && off[0] === 'Inner',
        };
      });

      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value === false))
        .map(([name]) => name);
      const threw = Object.entries(results).filter(([, v]) => typeof v === 'string').map(([k]) => k);
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify({ ok: !failed.length && !threw.length && !errors.length, failed: [...failed, ...threw], errors, results }, null, 2) + ':END';
    })();
  </script>
</body>
