<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Text effects</title>
  <!--
    The text toolbar's "Text effects" menu: a swatch wraps the selected words in a <span> (a <mark>
    for a highlight) carrying the effect as inline styles, or puts an empty one at the caret for
    what is typed next, as Bold does. The same swatch again takes it off. "Save as text style"
    turns the wrapper's styles into a text style class. Nothing is added but the wrapper: no SVG
    in the page's HTML.
  -->
  <style>
    body {
      margin: 0;
      padding: 160px 24px 24px;
      font: 18px/1.6 Georgia, serif;
    }

    h1 {
      font: 800 40px/1.15 system-ui, sans-serif;
      margin: 0 0 12px;
    }

    .text-lede {
      font-style: italic;
      --heo-text-style: "Lede";
    }
  </style>
</head>

<body>
  <h1 id="h">Slow pottery for fast mornings</h1>
  <p id="p">Wheel-thrown stoneware, glazed by hand in small batches.</p>
  <div id="two">
    <p id="a">First paragraph.</p>
    <p id="b">Second paragraph.</p>
  </div>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + event.reason));
      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const settle = async (ms = 0) => { await frames(); if (ms) await new Promise((resolve) => setTimeout(resolve, ms)); };
      const check = async (name, fn) => {
        progress.textContent = name;
        try { results[name] = await fn(); } catch (err) { results[name] = 'THREW: ' + String(err && err.stack); }
      };
      const press = (payload) => new Promise((resolve) => {
        const id = Math.random().toString(36).slice(2);
        window.__heoKeysDone = (done) => { if (done === id) resolve(); };
        window.__heoPressKeys(JSON.stringify({ id, ...payload }));
      });
      const clickAt = async (el) => {
        // In a short window the menu is capped and scrolls: the tile is brought into its view first.
        el.scrollIntoView({ block: 'nearest' });
        await settle(30);
        const b = el.getBoundingClientRect();
        const x = b.left + b.width / 2;
        const y = b.top + b.height / 2;
        await press({ mouse: [{ type: 'hover', x, y }, { type: 'down', x, y }, { type: 'up', x, y }] });
        await settle(60);
      };

      const api = window.HtmlEditorOverlay.mount({ theme: 'dark', presets: false, detectScriptContent: false });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await settle();
      const bar = () => document.querySelector('heo-overlay')?.shadowRoot?.querySelector('heo-text-toolbar');
      const root = () => bar()?.shadowRoot;
      const menu = () => root()?.querySelector('.fxmenu');
      const tile = (id) => menu()?.querySelector(`.option[data-effect="${id}"]`);
      const select = async (el, start, end) => {
        const text = el.firstChild;
        const range = document.createRange();
        range.setStart(text, start);
        range.setEnd(text, end ?? start);
        getSelection().removeAllRanges();
        getSelection().addRange(range);
        await settle();
      };
      const edit = async (el) => {
        engine.beginTextEdit(el);
        await settle(60);
      };
      const until = async (test, ms = 3000) => {
        for (let t = 0; t < ms; t += 30) {
          if (test()) return true;
          await settle(30);
        }
        return false;
      };
      // Open, and shown: the menu is drawn hidden, measured, then placed. A real press sent before
      // then lands on the page under it, which ends the edit (the suite runs fixtures in parallel).
      const openMenu = async () => {
        if (!menu()) root().querySelector('.fxbtn').click();
        await until(() => menu() && getComputedStyle(menu()).visibility === 'visible');
        await settle(60);
      };
      const h = document.getElementById('h');
      const p = document.getElementById('p');

      await check('button', async () => {
        await edit(h);
        const labels = Array.from(root().querySelectorAll('.bar button')).map((one) => one.getAttribute('aria-label'));
        return {
          rightAfterStrikethrough: labels.indexOf('Text effects') === labels.indexOf('Strikethrough') + 1,
          saysItOpensADialog: root().querySelector('.fxbtn').getAttribute('aria-haspopup') === 'dialog',
        };
      });

      await check('wrap', async () => {
        await select(h, 17, 30);
        await openMenu();
        const groups = Array.from(menu().querySelectorAll('.group')).map((one) => one.textContent.trim());
        const before = h.innerHTML;
        // A real press on the tile: the text's selection survives it.
        await clickAt(tile('arc'));
        const span = h.querySelector('[data-text-effect="arc"]');
        const pressed = tile('arc')?.getAttribute('aria-selected') === 'true';
        const box = h.getBoundingClientRect();
        const m = menu().getBoundingClientRect();
        return {
          // Sections named as the editor's other lists name theirs; no text style yet, so none of those.
          sectionsLikeEveryList: groups.join(',') === 'Text styles,Text,Underline,Highlight' && menu().querySelectorAll('.option').length === 13 &&
            getComputedStyle(menu().querySelector('.group')).textTransform === 'uppercase',
          noRemoveButton: !menu().querySelector('[data-remove]'),
          theMenuLeavesTheTextInView: m.top >= box.bottom || m.bottom <= box.top,
          theWordsAreWrapped: span?.tagName === 'SPAN' && span.textContent === 'fast mornings',
          withTheEffectInline: /background-image: url\("data:image\/svg\+xml,/.test(span?.getAttribute('style') ?? ''),
          andNoSvgInTheHtml: !h.querySelector('svg'),
          theTileSaysItIsOn: pressed,
          theStrokeIsDrawn: getComputedStyle(span).backgroundImage.startsWith('url('),
          nothingElseChanged: before.replace('fast mornings', '') === h.innerHTML.replace(/<span[^>]*>fast mornings<\/span>/, ''),
        };
      });

      await check('toggle', async () => {
        const recolor = menu().querySelector('.dot[data-color="mint"]');
        recolor.click();
        await settle(30);
        const mint = /%2322c55e/.test(h.querySelector('[data-text-effect="arc"]')?.getAttribute('style') ?? '');
        tile('brush').click();
        await settle(30);
        const asMark = h.querySelector('mark[data-text-effect="brush"]');
        const replaced = Boolean(asMark) && !h.querySelector('[data-text-effect="arc"]') && h.querySelectorAll('[data-text-effect]').length === 1;
        tile('brush').click();
        await settle(30);
        return {
          aColourRecoloursIt: mint,
          aHighlightIsAMark: Boolean(asMark),
          anotherEffectReplacesIt: replaced,
          theSameOneAgainTakesItOff: !h.querySelector('[data-text-effect]') && h.textContent === 'Slow pottery for fast mornings',
          theWordsStaySelected: getSelection().toString() === 'fast mornings',
        };
      });

      await check('commit', async () => {
        tile('gradient').click();
        await settle(30);
        const entries = engine.history.size;
        engine.endTextEdit(true);
        await settle(60);
        const committed = engine.history.size === entries + 1;
        const kept = h.querySelector('[data-text-effect="gradient"]');
        engine.undo();
        await settle(60);
        const undone = !h.querySelector('[data-text-effect]');
        engine.redo();
        await settle(60);
        return {
          oneUndoStepWithTheEdit: committed && Boolean(kept),
          undoTakesItOff: undone,
          redoPutsItBack: Boolean(h.querySelector('[data-text-effect="gradient"]')),
          theMenuClosesWithTheEdit: !menu(),
        };
      });

      await check('caret', async () => {
        await edit(p);
        await select(p, 5);
        await openMenu();
        tile('squiggle').click();
        await settle(30);
        const empty = p.querySelector('[data-text-effect="squiggle"]');
        const caretInside = empty && empty.contains(getSelection().anchorNode);
        document.execCommand('insertText', false, 'hand-');
        await settle(30);
        engine.endTextEdit(true);
        await settle(60);
        const typed = p.querySelector('[data-text-effect="squiggle"]');
        return {
          anEmptyWrapperAtTheCaret: Boolean(empty) && Boolean(caretInside),
          whatIsTypedGoesIn: typed?.textContent === 'hand-',
          noCaretHolderIsSaved: !p.innerHTML.includes('\u200b'),
        };
      });

      await check('unused', async () => {
        await edit(p);
        await select(p, 0);
        await openMenu();
        tile('glow').click();
        await settle(30);
        const placed = Boolean(p.querySelector('[data-text-effect="glow"]'));
        const entries = engine.history.size;
        engine.endTextEdit(true);
        await settle(60);
        return {
          aWrapperWasPlaced: placed,
          leftEmptyItIsDropped: !p.querySelector('[data-text-effect="glow"]'),
          andNothingIsRecorded: engine.history.size === entries,
        };
      });

      await check('save', async () => {
        await edit(h);
        await select(h, 0, 4);
        await openMenu();
        tile('marker').click();
        await settle(30);
        menu().querySelector('[data-save]').click();
        await settle(60);
        const input = menu().querySelector('.save input');
        const proposed = input?.value;
        input.value = 'Hero marker';
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await settle(30);
        menu().querySelector('.save button[type="submit"]').click();
        await settle(60);
        const mark = h.querySelector('mark[data-text-effect="marker"]');
        const style = engine.textEffectStyles().find((one) => one.name === 'Hero marker');
        const yours = menu().querySelector(`.option[data-style="${style?.entry.name}"]`);
        const firstSection = menu().querySelector('.group')?.textContent.trim();
        // The same style on other words.
        // The words after the mark: "pottery", in the text node that follows it now.
        const rest = Array.from(h.childNodes).find((one) => one.nodeType === 3 && one.data.includes('pottery'));
        const range = document.createRange();
        range.setStart(rest, rest.data.indexOf('pottery'));
        range.setEnd(rest, rest.data.indexOf('pottery') + 7);
        getSelection().removeAllRanges();
        getSelection().addRange(range);
        await settle(30);
        yours.click();
        await settle(30);
        const reused = h.querySelectorAll(`.${style?.entry.name}`).length === 2;
        engine.endTextEdit(true);
        await settle(60);
        return {
          aNameIsProposed: proposed === 'Marker Mint',
          theWrapperWearsTheClass: Boolean(mark) && mark.classList.contains(style?.entry.name) && !mark.getAttribute('style'),
          theStyleKeepsTheEffect: /linear-gradient/.test(style?.entry.declarations.background ?? '') && style?.entry.declarations['--heo-text-style'] === '"Hero marker"',
          itIsATextStyle: engine.textStyles().some((one) => one.entry.name === style?.entry.name),
          andDrawsTheSame: getComputedStyle(mark).backgroundImage.includes('linear-gradient'),
          itIsOfferedInTheMenu: Boolean(yours) && firstSection === 'Text styles',
          andReusable: reused,
        };
      });

      await check('paragraphs', async () => {
        const two = document.getElementById('two');
        await edit(two);
        const range = document.createRange();
        range.setStart(document.getElementById('a').firstChild, 6);
        range.setEnd(document.getElementById('b').firstChild, 6);
        getSelection().removeAllRanges();
        getSelection().addRange(range);
        await settle();
        await openMenu();
        tile('gradient').click();
        await settle(30);
        const refused = !two.querySelector('[data-text-effect]') && two.querySelectorAll('p').length === 2;
        engine.endTextEdit(true);
        await settle(30);
        return { acrossParagraphsNothingIsWrapped: refused };
      });

      await check('keys', async () => {
        await edit(p);
        await select(p, 0, 5);
        await openMenu();
        const opened = Boolean(menu());
        // Escape from the text: the menu closes, the edit goes on.
        p.focus();
        await press({ keys: ['Escape'] });
        await settle(60);
        const closedOnly = !menu() && engine.store.value.textEditing === p;
        // From the keyboard: the button opens it with the focus in the search.
        const button = root().querySelector('.fxbtn');
        button.focus();
        await press({ keys: ['Enter'] });
        await until(() => root().activeElement?.matches?.('[data-fx-find]'));
        const inSearch = root().activeElement?.matches?.('[data-fx-find]');
        // Three tab stops: the search, then the colours (one stop, the arrows choose), then the list.
        await press({ keys: ['Tab'] });
        await settle(40);
        const onColour = root().activeElement?.classList.contains('dot') && root().activeElement.getAttribute('aria-checked') === 'true';
        const colourBefore = root().activeElement?.dataset.color;
        await press({ keys: ['ArrowRight'] });
        await settle(40);
        const colourAfter = root().activeElement?.dataset.color;
        const arrowsChooseTheColour = colourAfter && colourAfter !== colourBefore && root().activeElement.getAttribute('aria-checked') === 'true';
        await press({ keys: ['Tab'] });
        await settle(40);
        const firstRow = root().activeElement;
        const onList = firstRow?.classList.contains('option');
        await press({ keys: ['ArrowDown'] });
        await settle(40);
        const second = root().activeElement;
        const downMoves = second?.classList.contains('option') && second !== firstRow;
        const rowsInTab = Array.from(root().querySelectorAll('.fxlist .option')).filter((one) => one.tabIndex === 0).length;
        // Enter on a row puts it on the words.
        // The page's text styles come first, so the second row is a style (its class) or an effect.
        const effectId = second?.dataset.effect;
        const styleId = second?.dataset.style;
        await press({ keys: ['Enter'] });
        await settle(60);
        const applied = effectId ? Boolean(p.querySelector(`[data-text-effect="${effectId}"]`))
          : Boolean(styleId) && Boolean(p.querySelector(`span.${CSS.escape(styleId)}`));
        // Typing in the search filters, sectioned; Down from it goes into the list.
        root().querySelector('[data-fx-find]').focus();
        const find = root().querySelector('[data-fx-find]');
        find.value = 'squig';
        find.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await settle(60);
        const filtered = Array.from(menu().querySelectorAll('.option')).map((one) => one.dataset.effect ?? one.dataset.style).join(',') === 'squiggle' &&
          Array.from(menu().querySelectorAll('.group')).map((one) => one.textContent.trim()).join(',') === 'Underline';
        await press({ keys: ['Escape'] });
        await settle(60);
        const back = root().activeElement === root().querySelector('.fxbtn') && engine.store.value.textEditing === p;
        engine.endTextEdit(true);
        return {
          opens: opened,
          escapeClosesTheMenuNotTheEdit: closedOnly,
          theKeyboardLandsInTheSearch: inSearch,
          tabReachesTheColours: onColour,
          arrowsChooseTheColour,
          tabThenReachesTheList: onList,
          downMovesARow: downMoves,
          theListIsOneTabStop: rowsInTab === 1,
          enterPutsItOn: applied,
          theSearchFilters: filtered,
          escapeReturnsToTheButton: back,
        };
      });

      /*
       * The page's own text styles, in the same menu: Heading 1 from the page's CSS goes on words
       * as its class, and "Edit … in Tokens" opens it there, in the editor that shows all it holds.
       */
      await check('styles', async () => {
        await edit(p);
        await select(p, 0, 5);
        await openMenu();
        const lede = menu().querySelector('.option[data-style="text-lede"]');
        lede?.click();
        await settle(40);
        const span = p.querySelector('span.text-lede');
        const footer = menu().querySelector('[data-edit-style]');
        const saysEdit = /Edit Lede in Tokens/.test(footer?.textContent ?? '') && !menu().querySelector('[data-save]');
        footer?.click();
        await settle(400);
        const tokens = document.querySelector('heo-overlay')?.shadowRoot && (function deep(sel, r = document) {
          const d = r.querySelector?.(sel); if (d) return d;
          for (const e of r.querySelectorAll?.('*') ?? []) { if (!e.shadowRoot) continue; const f = deep(sel, e.shadowRoot); if (f) return f; }
          return null;
        })('heo-tokens-panel');
        const editorEl = tokens?.shadowRoot?.querySelector('[data-text-style-editor="text-lede"]');
        return {
          aPageStyleIsOffered: Boolean(lede) && lede.closest('.fxlist').querySelector('.group').textContent.trim() === 'Text styles',
          itGoesOnAsItsClass: Boolean(span) && !span.getAttribute('style') && span.textContent === 'Wheel',
          theFooterOffersToEditIt: saysEdit,
          editOpensItInTokens: (engine.store.value.dockTab === 'tokens' || engine.store.value.pageTab === 'tokens') && Boolean(editorEl),
        };
      });

      /*
       * Tokens › Text styles: the editor shows what the style holds first and folds the rest, adds
       * any property, and edits the style under a state and at a size, each written to its own rule.
       */
      await check('tokensEditor', async () => {
        const deep = (sel, r = document) => {
          const d = r.querySelector?.(sel); if (d) return d;
          for (const e of r.querySelectorAll?.('*') ?? []) { if (!e.shadowRoot) continue; const f = deep(sel, e.shadowRoot); if (f) return f; }
          return null;
        };
        engine.editTextStyle('text-lede');
        await settle(200);
        const panel = deep('heo-tokens-panel');
        const pr = () => panel.shadowRoot;
        const ed = () => pr().querySelector('[data-text-style-editor="text-lede"]');
        const rows = () => Array.from(ed()?.querySelectorAll('.trow[data-property]') ?? []).map((one) => one.dataset.property);
        const change = async (el, value, type = 'value-change') => {
          el.dispatchEvent(new CustomEvent(type, { detail: { value }, bubbles: true, composed: true }));
          await settle(60);
        };
        // Only what Lede sets shows at first (its italic); the rest of Typography is one button away.
        const firstRows = rows();
        const foldedFirst = firstRows.join(',') === 'font-style' && Boolean(ed().querySelector('[data-ts-more]'));
        ed().querySelector('[data-ts-more]').click();
        await settle(60);
        const unfolded = rows().length > 6 && rows().includes('color') && !ed().querySelector('[data-ts-more]');
        await change(ed().querySelector('.trow[data-property="color"] heo-value-field'), 'rgb(0, 0, 128)');
        const baseWritten = engine.classes.get('text-lede')?.declarations.color === 'rgb(0, 0, 128)';
        // Add a property: one Typography has no row for lands in Effect, and writes to the class.
        await change(ed().querySelector('[data-ts-add]'), 'padding');
        const effectRow = Boolean(ed().querySelector('.trow[data-property="padding"]'));
        const effectHead = Array.from(ed().querySelectorAll('.tsg')).map((one) => one.firstElementChild.textContent.trim()).join(',') === 'Typography,Effect';
        await change(ed().querySelector('.trow[data-property="padding"] heo-value-field'), '2px');
        const paddingWritten = engine.classes.get('text-lede')?.declarations.padding === '2px';
        const baseCount = ed().querySelector('[data-ts-cond="base"] .c')?.textContent.trim();
        // Under :hover: an empty row shows what Base gives, and a value goes to .text-lede:hover.
        ed().querySelector('[data-ts-add-cond]').click();
        await settle(60);
        const pickers = ed().querySelectorAll('[data-ts-picker] heo-segmented');
        await change(pickers[0], ':hover', 'segment-change');
        const onHover = ed().dataset.condition === ':hover|';
        const colorField = ed().querySelector('.trow[data-property="color"] heo-value-field');
        const showsBase = colorField?.placeholder === 'rgb(0, 0, 128)' && !colorField.value;
        await change(colorField, 'rgb(200, 0, 0)');
        const hoverRule = engine.textStyleBlock('text-lede', ':hover', null).declarations.color === 'rgb(200, 0, 0)';
        const baseKept = engine.classes.get('text-lede')?.declarations.color === 'rgb(0, 0, 128)';
        const hoverChip = ed().querySelector('[data-ts-cond=":hover|"] .c')?.textContent.trim() === '1';
        const hovered = Array.from(document.styleSheets).some((sheet) => {
          try { return Array.from(sheet.cssRules).some((rule) => rule.selectorText === '.text-lede:hover'); } catch { return false; }
        });
        // At a size, with no state: the media rule for the class.
        const picker2 = () => ed().querySelectorAll('[data-ts-picker] heo-segmented');
        await change(picker2()[0], '', 'segment-change');
        const sizeOption = picker2()[1]?.options?.[1]?.value;
        await change(picker2()[1], sizeOption, 'segment-change');
        const atSize = ed().dataset.condition === `|${sizeOption}`;
        await change(ed().querySelector('.trow[data-property="color"] heo-value-field'), 'rgb(0, 120, 0)');
        const sizeRule = engine.textStyleBlock('text-lede', '', sizeOption).declarations.color === 'rgb(0, 120, 0)';
        const sizeChip = Boolean(ed().querySelector(`.slots .size[data-ts-cond="|${CSS.escape(sizeOption ?? '')}"]`)) ||
          Array.from(ed().querySelectorAll('.slots .size')).some((one) => one.dataset.tsCond === `|${sizeOption}`);
        return {
          onlyWhatItSetsShowsFirst: foldedFirst,
          theRestUnfolds: unfolded,
          baseWritesTheClass: baseWritten,
          anAddedPropertyGoesInEffect: effectRow && effectHead,
          andIsWrittenToTheClass: paddingWritten,
          baseCountsItsDeclarations: baseCount === '3',
          thePickerGoesToHover: onHover,
          anEmptyRowShowsBase: showsBase,
          hoverWritesItsOwnRule: hoverRule && hovered,
          baseIsLeftAlone: baseKept,
          theStripCountsHover: hoverChip,
          aSizeIsPicked: Boolean(sizeOption) && atSize,
          aSizeWritesTheMediaRule: sizeRule,
          theStripShowsTheSize: sizeChip,
        };
      });

      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value === false))
        .map(([name]) => name);
      const threw = Object.entries(results).filter(([, v]) => typeof v === 'string').map(([k]) => k);
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify({ ok: !failed.length && !threw.length && !errors.length, failed: [...failed, ...threw], errors, results }, null, 2) + ':END';
    })();
  </script>
</body>

</html>
