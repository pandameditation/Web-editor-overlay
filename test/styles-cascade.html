<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>One cascade model per element</title>
  <!--
    The shared sample (design §8): the prototype's model, as real CSS.

    `.promo .card { color … !important }` against the element's plain inline colour is the case
    from the brief: the page renders the rule's indigo while the panel said red (F1).
  -->
  <style id="site">
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      padding: 12px 16px;
      margin: 0 0 12px;
      color: #1f2937;
      background-color: #ffffff;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-transform: none;
      text-align: left;
      opacity: 1;
      display: block;
    }

    .featured {
      border: 1px solid #a5b4fc;
    }

    .card.featured {
      background-color: #eef2ff;
    }

    .promo .card {
      color: #3730a3 !important;
    }

    section p {
      letter-spacing: 0.01em;
    }

    @media (max-width: 767px) {
      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 10px 12px;
      }
    }

    @media (min-width: 768px) {
      .card {
        padding: 20px 28px;
      }
    }

    @media print {
      .card {
        color: #000000;
      }
    }

    .card:hover {
      background-color: #f9fafb;
    }

    @media (min-width: 768px) {
      .card:hover {
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
    }

    .featured:focus-within {
      outline: 2px solid #6366f1;
    }

    .featured::before {
      content: "★";
      color: #f59e0b;
    }
  </style>
  <!--
    Specificity cases, each written so the old numbers and the old ordering get it wrong.

    The losing rule always comes later in the file, so document order cannot be what makes the
    right one win.
  -->
  <style id="specificity">
    #spec {
      width: 1px;
    }

    .a.b.c.d.e.f.g.h.i.j.k {
      width: 11px;
    }

    .z p {
      margin-left: 3px;
    }

    :where(.w) p {
      margin-left: 7px;
    }

    :is(#isx, .isy) {
      text-indent: 4px;
    }

    .isy.isy {
      text-indent: 9px;
    }

    @media all {
      .mq {
        word-spacing: 5px;
      }
    }

    .mq {
      word-spacing: 2px;
    }
  </style>
  <!-- An inherited property nothing on the card declares, for the undeclared popover. -->
  <style id="inherit">
    .promo {
      font-family: Georgia, serif;
    }
  </style>
  <!-- Five rules declaring one property, for the three-crescent cap. -->
  <style id="crowd">
    .card {
      line-height: 1.1;
    }

    .featured {
      line-height: 1.2;
    }

    .card.featured {
      line-height: 1.3;
    }

    section p {
      line-height: 1.4;
    }

    .promo .card {
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <section class="promo">
    <div class="cards">
      <p id="target" class="card featured" style="color: #b91c1c; font-size: 16px">The selected card</p>
      <p class="card">Second</p>
      <p class="card">Third</p>
      <p class="card">Fourth</p>
    </div>
  </section>
  <div id="spec" class="a b c d e f g h i j k">Eleven classes and one id</div>
  <div class="w z">
    <p id="wherep">Inside :where</p>
  </div>
  <span id="isx" class="isy">Inside :is</span>
  <span id="mq" class="mq">After a media rule</span>
  <div id="probe"></div>

  <pre id="progress">start</pre>
  <pre id="out">pending</pre>

  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));
      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) =>
        requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const deep = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const found = deep(selector, el.shadowRoot);
          if (found) return found;
        }
        return null;
      };

      try {
        /* A scripted transport, only so the context a model would be sent can be read. */
        const asked = [];
        const api = window.HtmlEditorOverlay.mount({
          theme: 'dark',
          presets: false,
          detectScriptContent: false,
          aiTransport: (request) => {
            asked.push(request.context);
            return (async function* () {
              yield { op: 'summary', text: 'Looked, changed nothing.' };
            })();
          },
        });
        const engine = api.engine;
        api.setEditing(true);
        await engine.whenReady();
        await frames();

        const target = document.getElementById('target');
        const winner = (list) => list.applying[0];
        const sourceOf = (contribution) =>
          contribution?.source.kind === 'inline' ? 'inline' : contribution?.source.entry.selector;

        /* ------------------------------------------------------------------ *
         * The window this ran in.
         * ------------------------------------------------------------------ */
        progress.textContent = 'context';
        const below768 = matchMedia('(max-width: 767px)').matches;
        results.context = {
          innerWidth,
          /*
           * The suite's headless window is 756px, so Actual sits in the phone range and the padding
           * winner below is a media rule. Recorded so a run in a wider window says why the
           * expectations changed; they are derived from `matchMedia`, not from this.
           */
          actualIsBelow768: innerWidth < 768,
          agreesWithTheWindow: below768 === innerWidth < 768,
        };

        /* ------------------------------------------------------------------ *
         * The model, through engine.elementModel.
         * ------------------------------------------------------------------ */
        progress.textContent = 'model';
        const model = engine.elementModel(target);
        const padding = model.cascade('padding');
        const color = model.cascade('color');
        const expectedPadding = below768 ? '10px 12px' : '20px 28px';
        const expectedPaddingMedia = below768 ? '(max-width: 767px)' : '(min-width: 768px)';
        const otherPaddingMedia = below768 ? '(min-width: 768px)' : '(max-width: 767px)';

        const specModel = engine.elementModel(document.getElementById('spec'));
        const whereModel = engine.elementModel(document.getElementById('wherep'));
        const isModel = engine.elementModel(document.getElementById('isx'));
        const mqModel = engine.elementModel(document.getElementById('mq'));

        /*
         * Every property the page renders, read back through the model and compared to the browser.
         *
         * The winner's value is painted on a bare probe element and its computed value compared with
         * the target's, so `#eef2ff` and `rgb(238, 242, 255)` compare equal without this page
         * restating the browser's serialisation rules.
         */
        const probe = document.getElementById('probe');
        const computedOf = (property, value) => {
          probe.removeAttribute('style');
          probe.style.setProperty(property, value);
          return getComputedStyle(probe).getPropertyValue(property);
        };
        const checked = [
          'color', 'background-color', 'font-size', 'font-weight', 'padding', 'margin',
          'border-radius', 'border', 'text-transform', 'text-align', 'opacity', 'display',
        ];
        const disagreements = checked.filter((property) => {
          const top = winner(model.cascade(property));
          if (!top) return true;
          return computedOf(property, top.value) !==
            getComputedStyle(target).getPropertyValue(property);
        });

        results.model = {
          /*
           * The winner comes first, and at a width under 768 it is the phone media rule.
           *
           * The old walk never entered a media rule that did not match the window, so there was
           * nothing to order at any other width; the old `+1` made a media rule win every tie.
           */
          winnerFirstWithMediaWinner:
            winner(padding)?.value === expectedPadding &&
            winner(padding)?.source.entry?.media === expectedPaddingMedia &&
            padding.applying[1]?.source.entry?.media === null &&
            padding.applying[1]?.value === '12px 16px',
          // F1: an important rule beats a plain inline value, so the inline red is second.
          importantRuleBeatsInline:
            sourceOf(winner(color)) === '.promo .card' &&
            winner(color)?.important === true &&
            winner(color)?.value === '#3730a3' &&
            sourceOf(color.applying[1]) === 'inline' &&
            getComputedStyle(target).color === 'rgb(55, 48, 163)',
          /*
           * The rules that do not apply now are still in the model, as idle: the other size, print,
           * and the hover colour. A preview at another width has to be able to show them.
           */
          idleListsTheOtherSizes:
            padding.idle.some((one) => one.source.entry?.media === otherPaddingMedia) &&
            padding.idle.every((one) => one.source.entry?.media !== expectedPaddingMedia) &&
            color.idle.some((one) => one.source.entry?.media === 'print') &&
            model.cascade('background-color').idle.some((one) => one.source.entry?.state === ':hover'),
          // Eleven classes still lose to one id: a sum of 110 against 100 used to say otherwise.
          specificityCountsTuplesNotSums:
            sourceOf(winner(specModel.cascade('width'))) === '#spec' &&
            getComputedStyle(document.getElementById('spec')).width === '1px',
          // `:where(.w) p` is [0,0,1], so `.z p` wins although it comes first.
          whereCountsZero:
            sourceOf(winner(whereModel.cascade('margin-left'))) === '.z p' &&
            getComputedStyle(document.getElementById('wherep')).marginLeft === '3px',
          // `:is(#isx, .isy)` counts as its id, so it beats the later `.isy.isy`.
          isTakesItsMostSpecificArgument:
            sourceOf(winner(isModel.cascade('text-indent'))) === ':is(#isx, .isy)' &&
            getComputedStyle(document.getElementById('isx')).textIndent === '4px',
          // A later plain rule of equal specificity beats an earlier media rule: no bonus.
          mediaRulesGetNoSpecificityBonus:
            winner(mqModel.cascade('word-spacing'))?.source.entry?.media === null &&
            winner(mqModel.cascade('word-spacing'))?.value === '2px' &&
            getComputedStyle(document.getElementById('mq')).wordSpacing === '2px',
          winnerMatchesComputed: checked.length >= 10 && disagreements.length === 0,
        };
        results.model.disagreements = disagreements.join(',');

        /* ------------------------------------------------------------------ *
         * The same answer, through the surfaces that already exist.
         * ------------------------------------------------------------------ */
        progress.textContent = 'surfaces';
        api.select(target);
        engine.setDockTab('styles');
        await frames();
        await wait(300);
        /*
         * Re-queried, never held: the panel re-renders on every store change. Today's panel reads
         * `declaredMap`, which let the inline loop overwrite the important rule's value (F1).
         */
        const colorField = () =>
          deep('heo-styles-panel')?.shadowRoot?.querySelector('.row[data-property="color"] heo-value-field');
        // The legacy readers parse the CSSOM, which spells the colour rgb(); compared as painted.
        const indigo = 'rgb(55, 48, 163)';
        results.model.panelNoLongerShowsALosingInlineValue =
          computedOf('color', colorField()?.value ?? '') === indigo;

        engine.ai.upsert({
          id: 'styles-cascade-probe',
          label: 'Styles cascade probe',
          transport: 'local',
          provider: 'openai-compatible',
          baseURL: 'http://127.0.0.1:9/v1',
          model: 'm',
        });
        engine.ai.activate('styles-cascade-probe');
        await engine.promptAi('Look at this card.', target);
        await wait(100);
        // Parsed rather than pattern-matched: the markup the bundle carries also says #b91c1c.
        const bundle = asked.length ? JSON.parse(asked.at(-1)) : null;
        const declaredColor = bundle?.declared?.find((one) => one.property === 'color');
        results.model.declaredMapKeepsTheImportantRule =
          computedOf('color', declaredColor?.value ?? '') === indigo &&
          declaredColor?.from === '.promo .card' &&
          declaredColor?.own === false;

        /* ------------------------------------------------------------------ *
         * The panel: Effective styles, the dot, the popover, states, the field.
         * ------------------------------------------------------------------ */
        progress.textContent = 'panel';
        const panel = () => deep('heo-styles-panel');
        const root = () => panel().shadowRoot;
        const settle = async () => {
          await panel().updateComplete;
          await frames();
        };
        const rowIn = (list, property) =>
          root().querySelector(`[data-declarations="${list}"] .row[data-property="${property}"]`);
        const fieldIn = (list, property) => rowIn(list, property)?.querySelector('heo-value-field');
        const moons = (row) => row?.querySelectorAll('.dots .moon').length ?? -1;
        const whereOf = (row) => row?.closest('.prow')?.querySelector('.under .where');
        const pop = () => root().querySelector('.pop');
        const openDot = async (list, property) => {
          rowIn(list, property)?.querySelector('.dots')?.click();
          await settle();
        };
        const closePop = async () => {
          pop()?.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
          await settle();
        };
        const fresh = engine.elementModel(target);
        const effectiveRows = Array.from(root().querySelectorAll('[data-declarations="effective"] .row'));

        const sideLabel = below768 ? '.card ≤767px' : '.card ≥768px';
        const otherLabel = below768 ? '≥768px' : '≤767px';
        const padRow = rowIn('effective', 'padding');
        results.effective = {
          isFirstSection: root().querySelector('heo-section')?.heading === 'Effective styles',
          // One row per property the element renders with, as declared (no synthesised sides).
          oneRowPerAppliedProperty:
            effectiveRows.map((row) => row.dataset.property).join(',') === fresh.appliedProperties().join(','),
          rowShowsSourceHintUnlessInline:
            padRow?.querySelector('.from')?.textContent.trim() === sideLabel &&
            !rowIn('effective', 'font-size')?.querySelector('.from'),
          // Clearing removes the inline override, so it is offered only where there is one.
          clearOnlyWhenInlineExists:
            fieldIn('effective', 'font-size')?.hasAttribute('clearable') === true &&
            fieldIn('effective', 'padding')?.hasAttribute('clearable') === false,
        };
        fieldIn('effective', 'padding')?.focusInput();
        await frames();
        const padHintShown = getComputedStyle(whereOf(padRow)).display !== 'none';
        fieldIn('effective', 'padding')?.shadowRoot.querySelector('input').blur();
        await settle();
        results.effective.focusHintSaysWhereItGoes =
          padHintShown &&
          /Depends on the viewport: after Enter, choose where it stays/.test(whereOf(rowIn('effective', 'padding'))?.textContent) &&
          /Overrides in the inline style · this element only · \.card\.featured stays as is/.test(
            whereOf(rowIn('effective', 'background-color'))?.textContent.replace(/\s+/g, ' ')) &&
          /Edits the inline style · this element only, at every size/.test(
            whereOf(rowIn('effective', 'font-size'))?.textContent.replace(/\s+/g, ' '));

        /* ---- the dot ---- */
        const dotsLabel = (row) => row?.querySelector('.dots')?.getAttribute('aria-label') ?? '';
        const allRows = Array.from(root().querySelectorAll('.row[data-heo-part="row"]'));
        results.dots = {
          // R10 at this width: padding beats one other size-free rule, colour two, the radius none.
          crescentPerOverriddenDeclaration:
            moons(rowIn('effective', 'padding')) === 1 &&
            moons(rowIn('effective', 'color')) === 2 &&
            moons(rowIn('effective', 'border-radius')) === 0 &&
            effectiveRows.every((row) =>
              moons(row) === Math.min(3, Math.max(0, fresh.cascade(row.dataset.property).applying.length - 1))),
          // Five rules declare line-height here: three crescents, and the name says four.
          atMostThreeCrescents:
            moons(rowIn('effective', 'line-height')) === 3 &&
            /4 overridden/.test(dotsLabel(rowIn('effective', 'line-height'))) &&
            allRows.every((row) => moons(row) <= 3),
          everyDotIsAButtonWithACascadeLabel:
            allRows.length > 20 &&
            allRows.every((row) => {
              const dot = row.querySelector('button.dots');
              return dot && dot.getAttribute('aria-haspopup') === 'dialog' && /Show cascade$/.test(dot.getAttribute('aria-label'));
            }),
        };
        const zRow = () => rowIn('layout', 'z-index');
        const ringAtRest = getComputedStyle(zRow().querySelector('.dot')).boxShadow;
        const hoverRule = Array.from(root().adoptedStyleSheets ?? [])
          .flatMap((sheet) => Array.from(sheet.cssRules))
          .some((rule) => /\.prow:hover \.dot\.none/.test(rule.selectorText ?? ''));
        await openDot('layout', 'z-index');
        const ringOpen = getComputedStyle(zRow().querySelector('.dot')).boxShadow;
        results.dots.undeclaredShowsRingOnHover =
          zRow().querySelector('.dot').classList.contains('none') &&
          ringAtRest === 'none' && /inset/.test(ringOpen) && hoverRule &&
          /z-index is not declared for this element\. Show cascade/.test(dotsLabel(zRow()));
        // The undeclared popover, while it is open.
        const defaultText = pop()?.querySelector('.none')?.textContent.replace(/\s+/g, ' ') ?? '';
        await closePop();
        const pnLeft = (row) => Math.round(row.querySelector('.pn').getBoundingClientRect().left);
        results.dots.namesAlignWithOrWithoutDot =
          pnLeft(zRow()) === pnLeft(rowIn('effective', 'padding')) &&
          pnLeft(rowIn('typography', 'font-family')) === pnLeft(rowIn('typography', 'color'));

        /* ---- the cascade popover ---- */
        await openDot('effective', 'color');
        const lines = () => Array.from(pop()?.querySelectorAll('.c-line') ?? []);
        const colourLines = lines();
        results.popover = {
          winnerFirstLosersStruck:
            pop()?.matches(':popover-open') === true &&
            pop()?.getAttribute('role') === 'dialog' &&
            colourLines[0]?.classList.contains('win') &&
            /\.promo \.card/.test(colourLines[0]?.querySelector('.src')?.textContent) &&
            colourLines.slice(1, 3).every((line) => line.classList.contains('lost')) &&
            colourLines.slice(1, 3).every((line) =>
              getComputedStyle(line.querySelector('.src span')).textDecorationLine.includes('line-through')),
          // Inline style is not somewhere to go: it is this element.
          inlineHasNoLink: colourLines.some((line) =>
            line.querySelector('.src')?.localName === 'span' &&
            line.querySelector('.src').textContent.trim() === 'inline style'),
        };
        const promoRule = Array.from(document.getElementById('site').sheet.cssRules)
          .find((rule) => rule.selectorText === '.promo .card');
        colourLines[0]?.querySelector('heo-value-field')?.dispatchEvent(
          new CustomEvent('value-change', { detail: { value: '#111111' }, bubbles: true, composed: true }));
        await settle();
        results.popover.valueEditWritesThatDeclaration =
          promoRule.style.getPropertyValue('color') === 'rgb(17, 17, 17)' &&
          promoRule.style.getPropertyPriority('color') === 'important' &&
          !/#111111/.test(target.getAttribute('style'));
        engine.undo();
        await settle();
        // Escape closes it and puts focus back on the dot that opened it.
        if (!pop()) await openDot('effective', 'color');
        await closePop();
        results.popover.escapeClosesAndRefocusesTheDot =
          !pop() && root().activeElement === rowIn('effective', 'color')?.querySelector('.dots');

        await openDot('effective', 'padding');
        results.popover.listsOtherSizesAtActual =
          pop()?.querySelector('.sub')?.textContent.trim() === 'At other sizes or states' &&
          lines().some((line) => line.classList.contains('idle') && line.querySelector('.src').textContent.includes(otherLabel));
        /*
         * The popover follows its row when the dock scrolls. A scroll does not leave the dock's
         * shadow root, so a panel listening only at the window never heard it, and the popover
         * stayed where it was opened while its row moved away. Measured as the 4px placement gap
         * to the row, above or below it (placement flips to whichever side has room).
         */
        {
          const scroller = deep('heo-dock')?.shadowRoot?.querySelector('.body');
          const padRowNow = () => rowIn('effective', 'padding');
          const hugs = () => {
            const p = pop()?.getBoundingClientRect();
            const r = padRowNow()?.getBoundingClientRect();
            return Boolean(p && r) && (Math.abs(p.top - r.bottom - 4) <= 1 || Math.abs(r.top - p.bottom - 4) <= 1);
          };
          const start = scroller?.scrollTop ?? 0;
          const rowTop = () => padRowNow()?.getBoundingClientRect().top ?? NaN;
          const hugsBefore = hugs();
          const rowBefore = rowTop();
          if (scroller) scroller.scrollTop = start + 40;
          await frames();
          await frames();
          results.popover.followsItsRowWhenTheDockScrolls =
            hugsBefore && rowBefore - rowTop() > 10 && hugs();
          if (scroller) scroller.scrollTop = start;
          await frames();
          await frames();
        }
        /*
         * A line's link opens the card it is written in, at that rule's size, with the declaration
         * focused: following ".card ≥768px →" lands on the tablet slot of the .card card, not on its
         * All sizes view, where that padding is not listed.
         */
        const linkSlot = below768 ? 'tablet' : 'phone';
        lines().find((line) => line.classList.contains('idle') && line.querySelector('.src').textContent.includes(otherLabel))
          ?.querySelector('button.src')?.click();
        await settle(400);
        const linkedCard = root().querySelector('heo-section[heading="Sources"] .cls[data-card=".card"]');
        const focused = root().activeElement;
        results.popover.linkOpensTheCardAtTheRulesSize =
          !pop() &&
          linkedCard?.querySelector(':scope > header')?.getAttribute('aria-expanded') === 'true' &&
          linkedCard?.querySelector('.slots [aria-pressed="true"]')?.dataset.slot === linkSlot &&
          focused?.localName === 'heo-value-field' && focused.dataset.property === 'padding' &&
          focused.closest('[data-declarations]')?.dataset.declarations === `card|.card|${linkSlot}|` &&
          focused.value === (below768 ? '20px 28px' : '10px 12px');
        focused?.shadowRoot?.querySelector('input')?.blur();
        await settle();
        await closePop();
        await openDot('typography', 'font-family');
        const inherited = pop()?.querySelector('.none')?.textContent.replace(/\s+/g, ' ') ?? '';
        await closePop();
        results.popover.explainsInheritedValue =
          /Nothing declares it for this element/.test(inherited) &&
          /inherited from section\.promo \(\.promo\)/.test(inherited) &&
          /Typing a value adds it inline/.test(inherited);
        results.popover.explainsBrowserDefault = /the browser's default/.test(defaultText);
        // While a width whose slot is not All sizes is previewed, typing in the row opens "Save …
        // to…" rather than writing inline, so the popover must not promise an inline write.
        engine.setPreviewWidth(320);
        await settle();
        // The precondition: 320px picks a real size slot (the sample's max-width 767px), not All sizes.
        const previewedSlot = engine.elementModel(target).slots()
          .some((one) => /max-width: 767px/.test(one.media ?? ''));
        await openDot('typography', 'font-family');
        const previewedText = pop()?.querySelector('.none')?.textContent.replace(/\s+/g, ' ') ?? '';
        await closePop();
        engine.setPreviewWidth(null);
        await settle();
        results.popover.noInlinePromiseWhilePreviewing =
          previewedSlot &&
          /Nothing declares it for this element at 320px/.test(previewedText) &&
          !/adds it inline/.test(previewedText);

        /* ---- state and pseudo-element groups ---- */
        const groupNames = Array.from(root().querySelectorAll('[data-egroup]')).map((g) => g.dataset.egroup);
        const hoverList = fresh.cascade('background-color', { width: null, state: ':hover' }).applying;
        const beforeList = fresh.cascade('color', { width: null, state: '::before' }).applying;
        results.states = {
          oneGroupPerStateAndPseudo:
            groupNames.join(',') === fresh.groups().map((g) => g.state).join(',') &&
            groupNames.join(',') === ':hover,:focus-within,::before',
          // A state is over the element's own declarations: they are in its cascade.
          stateCompetesWithElement:
            hoverList[0]?.source.entry?.state === ':hover' &&
            hoverList.some((one) => one.source.entry?.selector === '.card.featured') &&
            moons(rowIn('state-:hover', 'background-color')) >= 1,
          // A pseudo-element is its own box: the element's inline colour is not in its cascade.
          pseudoCompetesOnlyWithItsRules:
            beforeList.every((one) => one.source.entry?.state === '::before') &&
            moons(rowIn('state-::before', 'color')) === 0,
        };

        /* ---- the !important tag ---- */
        const colourField = () => fieldIn('effective', 'color');
        results.field = {
          showsImportantTag: colourField()?.hasAttribute('important') === true,
          // The row does not write .promo .card, so the tag says so instead of offering to remove it.
          tagIsTextForARulesImportance:
            colourField()?.shadowRoot.querySelector('.imp')?.localName === 'span' &&
            /\.promo \.card/.test(colourField()?.getAttribute('important-title') ?? ''),
        };
        fieldIn('effective', 'font-size')?.dispatchEvent(
          new CustomEvent('value-change', { detail: { value: '17px !important' }, bubbles: true, composed: true }));
        await settle();
        results.field.typedImportantIsWritten =
          target.style.getPropertyValue('font-size') === '17px' &&
          target.style.getPropertyPriority('font-size') === 'important';
        engine.undo();
        engine.setStyle('color', 'red !important', target);
        await settle();
        await wait(2600); // past the merge window, so one entry is one entry
        const sizeBefore = engine.history.size;
        const tag = colourField()?.shadowRoot.querySelector('button.imp');
        tag?.click();
        await settle();
        results.field.tagRemovesImportant =
          Boolean(tag) &&
          target.style.getPropertyValue('color') === 'red' &&
          target.style.getPropertyPriority('color') === '' &&
          engine.history.size === sizeBefore + 1;
        engine.undo();
        engine.undo();
        await settle();

        results.rows = {
          // One component: the Effective row and the Typography row are the same markup.
          sameComponentInEffectiveAndCategories:
            rowIn('effective', 'color')?.dataset.heoPart === 'row' &&
            rowIn('typography', 'color')?.dataset.heoPart === 'row' &&
            Boolean(rowIn('typography', 'color')?.querySelector('button.dots')),
        };

        /* ---- the picked size, as a group ---- */
        const effStrip = () => root().querySelector('[data-strip="effective"]');
        const pickSize = async (key) => {
          effStrip()?.querySelector(`[data-slot="${key}"]`)?.click();
          await settle();
        };
        const sizeGroup = (key) => root().querySelector(`[data-egroup="size:${key}"]`);
        const otherSlot = below768 ? 'tablet' : 'phone';
        const nowSlot = below768 ? 'phone' : 'tablet';
        await pickSize(otherSlot);
        const otherProps = Array.from(sizeGroup(otherSlot)?.querySelectorAll('.row') ?? []).map((row) => row.dataset.property);
        const otherPadding = sizeGroup(otherSlot)?.querySelector('.row[data-property="padding"] heo-value-field')?.value;
        const otherNote = sizeGroup(otherSlot)?.querySelector('.note')?.textContent.trim();
        sizeGroup(otherSlot)?.querySelector('.row[data-property="padding"] .dots')?.click();
        await settle();
        const sizeCaption = pop()?.querySelector('.cap')?.textContent.replace(/\s+/g, ' ') ?? '';
        await closePop();
        const sizeAdderButton = sizeGroup(otherSlot)?.querySelector(`[data-heo-part="adder"][data-adder="size-${otherSlot}"]`);
        sizeAdderButton?.click();
        await settle();
        const sizeAdder = sizeGroup(otherSlot)?.querySelector('.property-adder');
        const chip = sizeAdder?.querySelector('.dest button.chip');
        const chipText = chip?.textContent.replace(/\s+/g, ' ').trim();
        sizeAdder?.querySelector('.cancel')?.click();
        await settle();
        await pickSize(nowSlot);
        const nowNote = sizeGroup(nowSlot)?.querySelector('.note')?.textContent.trim();
        await pickSize(nowSlot); // the pressed size again: back to All sizes
        results.sizeGroup = {
          // The value at that size, read at that size's width, even though the page is not there.
          listsWhatWinsAtThatSize:
            otherProps.includes('padding') &&
            otherPadding === (below768 ? '20px 28px' : '10px 12px') &&
            sizeCaption.includes(`at ${below768 ? 768 : 320}px`),
          saysInEffectOrNot: otherNote === `not at ${innerWidth}px` && nowNote === `in effect at ${innerWidth}px`,
          hasItsOwnAddProperty:
            Boolean(sizeAdderButton) && chip?.getAttribute('aria-haspopup') === 'menu' &&
            chipText === `.card ${below768 ? '≥768px' : '≤767px'}`,
        };

        const failed = Object.entries(results)
          .filter(([, group]) => group && typeof group === 'object')
          .filter(([, group]) => Object.values(group).some((value) => value === false))
          .map(([name]) => name);
        document.getElementById('out').textContent =
          'RESULTS:' + JSON.stringify({ ...results, errors, failed }, null, 2) + ':END';
      } catch (e) {
        document.getElementById('out').textContent =
          'RESULTS:' +
          JSON.stringify({ threw: String((e && e.stack) || e), errors, failed: ['threw'] }, null, 2) +
          ':END';
      }
    })();
  </script>
</body>

</html>
