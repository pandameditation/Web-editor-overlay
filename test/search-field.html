<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>The shared search field, and what each panel does with it</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
    }

    :root {
      --brand: #ff3355;
      --gap: 12px;
      --ink: #223344;
    }

    h1 {
      font-size: 22px;
    }

    section h2 {
      color: #445566;
    }

    .card {
      padding: 8px;
    }

    section p {
      letter-spacing: 0.013em;
    }
  </style>
</head>

<body>
  <main>
    <h1 id="title">A page</h1>
    <section>
      <h2>Section</h2>
      <p class="card" id="para">Words about tokens.</p>
      <a id="link" href="/somewhere">A link</a>
    </section>
  </main>

  <div id="report">
    <pre id="progress">start</pre>
    <pre id="out">pending</pre>
  </div>

  <script type="module">
    (async () => {
      const errors = [];
      addEventListener('error', (e) => errors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

      const progress = document.getElementById('progress');
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const results = {};

      const { mount } = await import('../dist/html-editor-overlay.js');
      const api = mount({ theme: 'dark', detectScriptContent: false });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      /** Walk shadow roots, since every panel lives inside the overlay's tree. */
      const deep = (tag, root = document) => {
        const direct = root.querySelector?.(tag);
        if (direct) return direct;
        for (const host of root.querySelectorAll ? root.querySelectorAll('*') : []) {
          if (host.shadowRoot) {
            const found = deep(tag, host.shadowRoot);
            if (found) return found;
          }
        }
        return null;
      };

      /** Type into a field's real input, the way a user would. */
      const typeInto = async (field, text, host) => {
        const input = field.shadowRoot.querySelector('input');
        input.value = text;
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await field.updateComplete;
        // The host owns the suggestions and the filtered list, and it re-renders on its own
        // schedule — so waiting only for the field reads the state from before the keystroke.
        if (host) await host.updateComplete;
        await field.updateComplete;
        await frames();
      };
      const press = async (field, key, init = {}) => {
        field.shadowRoot.querySelector('input').dispatchEvent(
          new KeyboardEvent('keydown', { key, bubbles: true, composed: true, cancelable: true, ...init }),
        );
        await field.updateComplete;
        await frames();
      };

      engine.classes.upsert({ name: 'lede', declarations: { 'font-size': '18px' } });
      engine.classes.upsert({ name: 'muted', declarations: { color: '#889' } });
      api.select(document.querySelector('main'));
      await frames();

      /* ------------------------------------------------------------------ *
       * 1. Library: one field that filters the cards and offers to create.
       * ------------------------------------------------------------------ */
      progress.textContent = 'library';
      engine.setDockTab('library');
      await frames();
      const libPanel = deep('heo-library-panel');
      const libField = libPanel.shadowRoot.querySelector('heo-search-field');
      const cardCount = () => libPanel.shadowRoot.querySelectorAll('.card').length;

      const before = cardCount();
      await typeInto(libField, 'zzz-no-such-block', libPanel);
      results.library = {
        isTheSharedField: Boolean(libField),
        // The accessible name is a contract: it is what a screen reader announces.
        keepsItsAccessibleName: Boolean(
          libField.shadowRoot.querySelector('input[aria-label="Search blocks"]'),
        ),
        hadCards: before > 0,
        filteredToNothing: cardCount() === 0,
        // The action is in the field, and it names what it would make.
        offersCreateInTheField: (libField.getAttribute('action') ?? '').includes('zzz-no-such-block'),
        // And still at the end of the list, which is where someone who scrolled ends up.
        offersCreateBelowTheList: Array.from(
          libPanel.shadowRoot.querySelectorAll('.empty button, .makerow button'),
        ).some((b) => /create/i.test(b.textContent)),
      };
      // Escape clears rather than bubbling up and deselecting the element.
      await press(libField, 'Escape');
      results.library.escapeClears = cardCount() === before;
      results.library.escapeKeptTheSelection = engine.selected === document.querySelector('main');
      results.library.ok =
        results.library.isTheSharedField &&
        results.library.keepsItsAccessibleName &&
        results.library.hadCards &&
        results.library.filteredToNothing &&
        results.library.offersCreateInTheField &&
        results.library.offersCreateBelowTheList &&
        results.library.escapeClears &&
        results.library.escapeKeptTheSelection;

      /* ------------------------------------------------------------------ *
       * 2. Tokens: one field, scoped by the facet strip.
       * ------------------------------------------------------------------ */
      progress.textContent = 'tokens';
      engine.setDockTab('tokens');
      await frames();
      const tokPanel = deep('heo-tokens-panel');
      const tokField = tokPanel.shadowRoot.querySelector('.find heo-search-field');
      const headings = () =>
        Array.from(tokPanel.shadowRoot.querySelectorAll('heo-section')).map((s) => s.heading);

      results.tokens = {
        hasTheField: Boolean(tokField),
        hasTheFacetStrip: Boolean(tokPanel.shadowRoot.querySelector('.find heo-segmented')),
        // Every registry on screen by default, which is also what the CSS-rules fixture pins.
        showsEverythingByDefault:
          headings().includes('Reusable classes') && headings().includes('CSS rules'),
      };

      // A token searched for by name.
      await typeInto(tokField, 'brand', tokPanel);
      results.tokens.narrowedToTheToken = headings().includes('Colour');
      results.tokens.droppedTheOthers = !headings().includes('Reusable classes');

      // A class searched for by name, proving the search crosses registries.
      await typeInto(tokField, 'muted', tokPanel);
      results.tokens.findsAClassToo = headings().includes('Reusable classes');

      // And by declaration, which is how you find a colour you cannot name.
      await typeInto(tokField, '#ff3355', tokPanel);
      results.tokens.findsByValue = headings().includes('Colour');

      await typeInto(tokField, 'zzzz', tokPanel);
      results.tokens.saysWhenNothingMatches = Boolean(
        tokPanel.shadowRoot.querySelector('.empty'),
      );

      await typeInto(tokField, '', tokPanel);
      results.tokens.ok =
        results.tokens.hasTheField &&
        results.tokens.hasTheFacetStrip &&
        results.tokens.showsEverythingByDefault &&
        results.tokens.narrowedToTheToken &&
        results.tokens.droppedTheOthers &&
        results.tokens.findsAClassToo &&
        results.tokens.findsByValue &&
        results.tokens.saysWhenNothingMatches;

      /* ------------------------------------------------------------------ *
       * 3. Styles: filter on the first line, add through a popup.
       * ------------------------------------------------------------------ */
      progress.textContent = 'styles';
      // Selected deliberately: the library block left `main` selected, and a panel that writes to
      // whatever is selected needs the assertions to be about the same element.
      engine.select(document.getElementById('para'));
      engine.setDockTab('styles');
      await frames();
      const stylePanel = deep('heo-styles-panel');
      const filterField = stylePanel.shadowRoot.querySelector('.top heo-search-field');
      const headingsOf = () =>
        Array.from(stylePanel.shadowRoot.querySelectorAll('heo-section')).map((s) => s.heading);

      results.styles = {
        filterIsOnTheFirstLine: Boolean(filterField),
        // Freed up by moving Extract class into Classes, where the rest of that subject lives.
        extractIsNoLongerOnTheFirstLine: !Array.from(
          stylePanel.shadowRoot.querySelectorAll('.top button'),
        ).some((b) => /extract/i.test(b.textContent)),
        extractIsInTheClassesSection: (() => {
          const classes = Array.from(stylePanel.shadowRoot.querySelectorAll('heo-section')).find(
            (s) => s.heading === 'Classes',
          );
          return Boolean(
            classes && Array.from(classes.querySelectorAll('button')).some((b) => /extract/i.test(b.textContent)),
          );
        })(),
        sectionsBefore: headingsOf().length,
      };

      // Named for what it now covers: properties, values, classes and rules, not just names.
      results.styles.saysWhatItSearches =
        filterField.getAttribute('label') === 'Search in element';

      await typeInto(filterField, 'shadow', stylePanel);
      results.styles.narrowsTheSections = headingsOf().length < results.styles.sectionsBefore;
      results.styles.keepsTheMatchingOne = headingsOf().includes('Effects');

      /* ---------------------------------------------------------------- *
       * What the search reaches. The bug being pinned first: margin and
       * padding are drawn by the hand-written Spacing section rather than
       * from SECTIONS, and the filter only ever looked at SECTIONS — so the
       * two most-used properties in CSS could not be found by name.
       * ---------------------------------------------------------------- */
      await typeInto(filterField, 'margin', stylePanel);
      results.styles.findsMargin = headingsOf().includes('Spacing');
      await typeInto(filterField, 'padding', stylePanel);
      results.styles.findsPadding = headingsOf().includes('Spacing');

      // A value, not a name. `.card` declares padding: 8px and nothing is called "8px".
      await typeInto(filterField, '8px', stylePanel);
      results.styles.findsByValue = headingsOf().includes('Classes');

      // A class by name.
      await typeInto(filterField, 'card', stylePanel);
      results.styles.findsAClass = headingsOf().includes('Classes');

      // A stylesheet rule by a value only it declares: `section p` is not one of the
      // element's classes, so it lives under CSS rules.
      await typeInto(filterField, '0.013em', stylePanel);
      results.styles.findsACssRule = headingsOf().includes('CSS rules');

      /* ---------------------------------------------------------------- *
       * Out of rows: the completions arrive in the panel, not in the popup.
       * ---------------------------------------------------------------- */
      const nomatch = () => stylePanel.shadowRoot.querySelector('.nomatch');
      const offered = () =>
        Array.from(stylePanel.shadowRoot.querySelectorAll('.nomatch .offer .option')).map((b) =>
          b.querySelector('.name').textContent.trim(),
        );

      // A real property this element has no row for: the verdict says so rather than
      // leaving the user to find out inside the dialog.
      await typeInto(filterField, 'flex-grow', stylePanel);
      results.styles.emptyPanelExplainsItself = Boolean(nomatch());
      results.styles.confirmsARealProperty = Boolean(
        stylePanel.shadowRoot.querySelector('.nomatch .verdict.yes'),
      );

      // A typo. Not a property, but close enough to one to be worth offering.
      await typeInto(filterField, 'isolatio', stylePanel);
      results.styles.flagsATypo = Boolean(
        stylePanel.shadowRoot.querySelector('.nomatch .verdict.no'),
      );
      results.styles.offersTheNearMiss = offered().includes('isolation');

      // And taking one seeds the add popup with it, so the completion is the whole gesture.
      const isolationRow = Array.from(
        stylePanel.shadowRoot.querySelectorAll('.nomatch .offer .option'),
      ).find((b) => b.querySelector('.name').textContent.trim() === 'isolation');
      isolationRow?.click();
      await stylePanel.updateComplete;
      await frames();
      results.styles.takingOneSeedsTheAdder =
        (stylePanel.draftRows ?? []).length === 1 &&
        stylePanel.draftRows[0].property === 'isolation';
      stylePanel.shadowRoot
        .querySelector('.addpop .pophead button')
        ?.click();
      await stylePanel.updateComplete;

      // Nothing resembles it either: said plainly, with no list of red herrings.
      await typeInto(filterField, 'zzzznope', stylePanel);
      results.styles.saysWhenNothingIsClose =
        Boolean(stylePanel.shadowRoot.querySelector('.nomatch .verdict.no')) &&
        offered().length === 0;

      // Back to the query the add-popup block below is written against.
      await typeInto(filterField, 'shadow', stylePanel);

      /* The add popup: seeded from the query, several rows, one change. */
      filterField.shadowRoot.querySelector('.go').click();
      await stylePanel.updateComplete;
      await frames();
      const popup = () => stylePanel.shadowRoot.querySelector('.addpop');
      const popButton = (pattern) =>
        Array.from(stylePanel.shadowRoot.querySelectorAll('.popfoot button')).find((b) =>
          pattern.test(b.textContent),
        );
      results.styles.popupOpened = Boolean(popup());
      results.styles.seededFromTheQuery =
        popup()?.querySelector('heo-search-field')?.shadowRoot?.querySelector('input')?.value === 'shadow';

      // A second row, so the batch is genuinely a batch.
      popButton(/another/i)?.click();
      await stylePanel.updateComplete;
      await frames();
      results.styles.takesMoreThanOneRow =
        stylePanel.shadowRoot.querySelectorAll('.poprow').length === 2;

      /*
       * Filled through the real inputs rather than by assigning the panel's state.
       *
       * Writing `draftRows` directly looks simpler and is wrong: handing a value field a new
       * `.value` makes it announce that value back, which overwrites the row that was just set.
       * Typing is what the control is built for and what a user does.
       */
      const fillRow = async (index, property, value) => {
        const row = stylePanel.shadowRoot.querySelectorAll('.poprow')[index];
        const nameInput = row.querySelector('heo-search-field').shadowRoot.querySelector('input');
        nameInput.value = property;
        nameInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await stylePanel.updateComplete;
        const valueInput = stylePanel.shadowRoot
          .querySelectorAll('.poprow')[index]
          .querySelector('heo-value-field')
          .shadowRoot.querySelector('input');
        valueInput.value = value;
        valueInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await stylePanel.updateComplete;
        await frames();
      };
      await fillRow(0, 'box-shadow', '0 1px 2px #0003');
      await fillRow(1, 'opacity', '0.9');
      // Both rows held on to what was typed, which is what makes the batch below meaningful.
      results.styles.rowsTookWhatWasTyped =
        (stylePanel.draftRows ?? []).map((r) => `${r.property}=${r.value}`).join('|') ===
        'box-shadow=0 1px 2px #0003|opacity=0.9';
      const changesBefore = engine.records.length;
      // "Add 2 declarations" with two rows ready, "Add declaration" with one: the count is part of
      // the label so the button says what it is about to do.
      popButton(/add (\d+ )?declarations?/i)?.click();
      await frames();
      await wait(120);

      const target = document.getElementById('para');
      results.styles.bothLanded =
        target.style.boxShadow !== '' && target.style.opacity === '0.9';
      // One entry, because the user made one decision. Two trips through the old form meant two.
      results.styles.oneUndoEntry = engine.records.length === changesBefore + 1;
      results.styles.popupClosed = !popup();
      engine.undo();
      await frames();
      results.styles.undoTakesBothBack =
        target.style.opacity === '' && target.style.boxShadow === '';

      /* ---------------------------------------------------------------- *
       * A property that belongs to no section, added from the verdict.
       *
       * This is the reported bug, and it was not the write path: that
       * worked. The popup opened with nothing focused, so the value being
       * typed went to the document, the commit button stayed disabled with
       * no reason given, and pressing it did nothing.
       * ---------------------------------------------------------------- */
      await typeInto(filterField, 'font-stretch', stylePanel);
      results.styles.knowsUncataloguedProperties = Boolean(
        stylePanel.shadowRoot.querySelector('.nomatch .verdict.yes'),
      );
      Array.from(stylePanel.shadowRoot.querySelectorAll('.nomatch button'))
        .find((b) => /add font-stretch/i.test(b.textContent))
        ?.click();
      await stylePanel.updateComplete;
      await wait(150);

      // Where the next keystroke goes. Seeded with the name, so the value is what is missing.
      const focused = stylePanel.shadowRoot.activeElement;
      results.styles.focusesTheMissingHalf =
        focused?.tagName.toLowerCase() === 'heo-value-field';

      const commitBtn = () =>
        Array.from(stylePanel.shadowRoot.querySelectorAll('.popfoot button')).find((b) =>
          /add (\d+ )?declarations?/i.test(b.textContent),
        );
      const stretchInput = stylePanel.shadowRoot
        .querySelector('.poprow heo-value-field')
        .shadowRoot.querySelector('input');
      const setStretch = async (text) => {
        stretchInput.value = text;
        stretchInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await stylePanel.updateComplete;
        await frames();
      };

      /*
       * Live on arrival, because the row is seeded with a starting value.
       *
       * The same thing the class editor has always done when a property is added there: a
       * declaration with no value neither renders nor says what kind of value it wants. It also
       * means pressing the button in the verdict writes the declaration, which is what pressing it
       * looks like it should do.
       */
      results.styles.arrivesReadyToCommit =
        Boolean(commitBtn()) && commitBtn().disabled === false;
      results.styles.seededAValue = Boolean((stylePanel.draftRows ?? [])[0]?.value);

      // And when a row IS genuinely incomplete, the button says what it wants rather than
      // ignoring the click -- which is what the reported bug felt like.
      await setStretch('');
      results.styles.saysWhyItCannotCommit =
        commitBtn().disabled === true &&
        /property and a value/i.test(commitBtn().getAttribute('title') ?? '') &&
        Boolean(stylePanel.shadowRoot.querySelector('.popfoot .why'));

      await setStretch('50%');
      commitBtn()?.click();
      await stylePanel.updateComplete;
      await wait(150);

      results.styles.uncataloguedLanded = target.style.getPropertyValue('font-stretch') === '50%';
      /*
       * And it is on screen afterwards. The filter is dropped on commit, because a query left
       * over the result narrows the panel to whatever still matches it -- for a property in no
       * section, one row, and for a property picked from the completions rather than typed,
       * nothing at all. That is what made a working add look like a no-op.
       */
      results.styles.filterClearedSoTheResultShows =
        filterField.shadowRoot.querySelector('input').value === '';
      results.styles.showsUnderSetOnThisElement = (() => {
        const first = Array.from(stylePanel.shadowRoot.querySelectorAll('heo-section')).find(
          (s) => s.heading === 'Set on this element',
        );
        return Boolean(
          first &&
          Array.from(first.querySelectorAll('.row .pn')).some(
            (n) => n.textContent.trim() === 'font-stretch',
          ),
        );
      })();
      engine.undo();
      await frames();

      /* ---------------------------------------------------------------- *
       * The name the author wrote is the name that gets written.
       *
       * The CSSOM canonicalises a family of legacy aliases on the way in --
       * word-wrap to overflow-wrap, grid-gap to gap, -webkit-transform to
       * transform, and font-stretch to font-width in recent builds. Someone
       * writing the prefixed or legacy name is answering a support question
       * deliberately, and rewriting it overrules them.
       * ---------------------------------------------------------------- */
      engine.setStyle('word-wrap', 'break-word', target);
      await frames();
      results.styles.keepsTheAuthoredName = (target.getAttribute('style') ?? '').includes(
        'word-wrap: break-word',
      );
      // Not a one-off repair: the attribute is re-serialised from the CSSOM on every later
      // inline write, so an unrelated edit is what used to undo the spelling.
      engine.setStyle('color', 'rgb(1, 2, 3)', target);
      await frames();
      results.styles.survivesALaterEdit = (target.getAttribute('style') ?? '').includes(
        'word-wrap: break-word',
      );
      // And it still applies, because the browser understands the alias perfectly well.
      results.styles.theAliasStillApplies =
        getComputedStyle(target).overflowWrap === 'break-word';

      await frames();
      await wait(120);
      const setSection = () =>
        Array.from(stylePanel.shadowRoot.querySelectorAll('heo-section')).find(
          (s) => s.heading === 'Set on this element',
        );
      const authoredRows = Array.from(setSection().querySelectorAll('.row .pn')).map((n) =>
        n.textContent.trim(),
      );
      results.styles.panelShowsTheAuthoredName = authoredRows.includes('word-wrap');
      /*
       * And shows it once. Reading the inline rule from the CSSOM while reading the inline
       * declarations from the attribute listed one declaration twice, under both names, as
       * though the element declared each of them.
       */
      results.styles.andNotAlsoTheCanonicalOne = !authoredRows.includes('overflow-wrap');

      /*
       * Two spellings of one property, side by side.
       *
       * The oldest trick in CSS: write the prefixed name, then the standard one, and let each
       * browser take the one it knows. The CSSOM cannot express it -- both are one entry to it --
       * which is why inline declarations are edited as attribute text instead.
       */
      engine.setStyle('-webkit-transform', 'scale(2)', target);
      await frames();
      engine.setStyle('transform', 'scale(3)', target);
      await frames();
      const bothSpellings = target.getAttribute('style') ?? '';
      results.styles.keepsBothSpellings =
        bothSpellings.includes('-webkit-transform: scale(2)') &&
        bothSpellings.includes('transform: scale(3)');
      // CSS order is precedence, so the one written last is the one that renders.
      results.styles.laterSpellingWins = getComputedStyle(target).transform.startsWith('matrix(3');
      // And each is its own row, editable without disturbing the other.
      engine.setStyle('-webkit-transform', 'scale(4)', target);
      await frames();
      results.styles.editingOneLeavesTheOther =
        (target.getAttribute('style') ?? '').includes('-webkit-transform: scale(4)') &&
        (target.getAttribute('style') ?? '').includes('transform: scale(3)');
      engine.setStyle('-webkit-transform', '', target);
      engine.setStyle('transform', '', target);
      await frames();

      /*
       * Through a live preview too, which paints without going through a command -- so it goes
       * through the same list, or dragging an aliased value grows a second row under the
       * canonical name for as long as the drag lasts.
       */
      engine.previewStyle('word-wrap', 'anywhere', target);
      await frames();
      results.styles.survivesAPreview =
        (target.getAttribute('style') ?? '').includes('word-wrap: anywhere') &&
        !(target.getAttribute('style') ?? '').includes('overflow-wrap');
      engine.cancelPreview();
      await frames();
      results.styles.previewRollbackKeepsIt = (target.getAttribute('style') ?? '').includes(
        'word-wrap: break-word',
      );

      engine.setStyle('word-wrap', '', target);
      engine.setStyle('color', '', target);
      await frames();


      /* ---------------------------------------------------------------- *
       * One validation, for all three surfaces that add a declaration.
       *
       * The Styles panel, a CSS rule and a reusable class each had their own
       * opinion. Styles checked the value and refused anything this browser
       * rejected, but never noticed the property was already set. The class
       * editor, which CSS rules share, deduplicated but checked nothing at
       * all -- so `flx: 1` was impossible here and trivial there.
       *
       * The rule now: refuse what cannot be a declaration, and merely warn
       * about what only this browser dislikes. Those are different questions.
       * ---------------------------------------------------------------- */
      const said = [];
      const realNotify = engine.notify.bind(engine);
      engine.notify = (message, kind) => {
        said.push(`${kind}: ${message}`);
        return realNotify(message, kind);
      };
      /* Driven through the popup, which is the panel's only way in. */
      const addDeclaration = async (property, value) => {
        said.length = 0;
        if (popup()) {
          stylePanel.shadowRoot.querySelector('.addpop .pophead button').click();
          await stylePanel.updateComplete;
          await frames();
        }
        filterField.shadowRoot.querySelector('.go').click();
        await stylePanel.updateComplete;
        await frames();
        await wait(120);
        const nameInput = stylePanel.shadowRoot
          .querySelector('.poprow heo-search-field')
          .shadowRoot.querySelector('input');
        nameInput.value = property;
        nameInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await stylePanel.updateComplete;
        await frames();
        const valueInput = stylePanel.shadowRoot
          .querySelector('.poprow heo-value-field')
          .shadowRoot.querySelector('input');
        valueInput.value = value;
        valueInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await stylePanel.updateComplete;
        await frames();
        commitBtn()?.click();
        await stylePanel.updateComplete;
        await wait(150);
        return {
          said: [...said],
          stillOpen: Boolean(popup()),
          style: target.getAttribute('style') ?? '',
        };
      };

      // A property THIS browser does not know is written anyway, and said out loud. Refusing it
      // made the editor unable to express a declaration for any browser but its own -- and
      // `font-width` is the spec's own name for the widely supported `font-stretch`.
      const unknown = await addDeclaration('font-width', '125%');
      results.styles.unsupportedIsStillWritten = unknown.style.includes('font-width: 125%');
      results.styles.unsupportedIsFlagged = unknown.said.some((n) => /does not know/i.test(n));

      // Deprecated but supported: allowed, with advice naming what replaced it.
      const legacy = await addDeclaration('word-wrap', 'break-word');
      results.styles.deprecatedIsAllowed = legacy.style.includes('word-wrap: break-word');
      results.styles.deprecatedIsAdvised = legacy.said.some((n) => /deprecated/i.test(n));

      // The dedupe the panel never had, which a class always did.
      const twice = await addDeclaration('word-wrap', 'anywhere');
      results.styles.duplicateIsRefused = twice.said.some((n) => /already sets/i.test(n));
      results.styles.refusalKeepsThePopupOpen = twice.stillOpen;

      // The validity check a class never had, which the panel always did.
      const junk = await addDeclaration('not a property', '1');
      results.styles.junkIsRefused = junk.said.some((n) => /is not a property name/i.test(n));
      results.styles.junkIsNotWritten = !junk.style.includes('not a property');

      // And the trailing colon typed out of habit is normalised, not treated as gibberish:
      // CSS.supports('letter-spacing:', 'initial') is false, so it used to look invented.
      const colon = await addDeclaration('letter-spacing:', '2px');
      results.styles.trailingColonIsNormalised = colon.style.includes('letter-spacing: 2px');

      engine.notify = realNotify;
      if (popup()) {
        stylePanel.shadowRoot.querySelector('.addpop .pophead button').click();
        await stylePanel.updateComplete;
      }
      for (const name of ['font-width', 'word-wrap', 'letter-spacing']) {
        engine.setStyle(name, '', target);
      }
      await frames();

      results.styles.ok =
        results.styles.filterIsOnTheFirstLine &&
        results.styles.extractIsNoLongerOnTheFirstLine &&
        results.styles.extractIsInTheClassesSection &&
        results.styles.narrowsTheSections &&
        results.styles.keepsTheMatchingOne &&
        results.styles.saysWhatItSearches &&
        results.styles.findsMargin &&
        results.styles.findsPadding &&
        results.styles.findsByValue &&
        results.styles.findsAClass &&
        results.styles.findsACssRule &&
        results.styles.emptyPanelExplainsItself &&
        results.styles.confirmsARealProperty &&
        results.styles.flagsATypo &&
        results.styles.offersTheNearMiss &&
        results.styles.takingOneSeedsTheAdder &&
        results.styles.saysWhenNothingIsClose &&
        results.styles.popupOpened &&
        results.styles.seededFromTheQuery &&
        results.styles.takesMoreThanOneRow &&
        results.styles.rowsTookWhatWasTyped &&
        results.styles.bothLanded &&
        results.styles.oneUndoEntry &&
        results.styles.popupClosed &&
        results.styles.undoTakesBothBack &&
        results.styles.knowsUncataloguedProperties &&
        results.styles.unsupportedIsStillWritten &&
        results.styles.unsupportedIsFlagged &&
        results.styles.deprecatedIsAllowed &&
        results.styles.deprecatedIsAdvised &&
        results.styles.duplicateIsRefused &&
        results.styles.refusalKeepsThePopupOpen &&
        results.styles.junkIsRefused &&
        results.styles.junkIsNotWritten &&
        results.styles.trailingColonIsNormalised &&
        results.styles.arrivesReadyToCommit &&
        results.styles.seededAValue &&
        results.styles.focusesTheMissingHalf &&
        results.styles.saysWhyItCannotCommit &&
        results.styles.uncataloguedLanded &&
        results.styles.filterClearedSoTheResultShows &&
        results.styles.showsUnderSetOnThisElement &&
        results.styles.keepsTheAuthoredName &&
        results.styles.survivesALaterEdit &&
        results.styles.theAliasStillApplies &&
        results.styles.panelShowsTheAuthoredName &&
        results.styles.andNotAlsoTheCanonicalOne &&
        results.styles.survivesAPreview &&
        results.styles.previewRollbackKeepsIt &&
        results.styles.keepsBothSpellings &&
        results.styles.laterSpellingWins &&
        results.styles.editingOneLeavesTheOther;

      /* ------------------------------------------------------------------ *
       * 4. Props: the same field, over attributes, able to add any of them.
       * ------------------------------------------------------------------ */
      progress.textContent = 'props';
      engine.select(document.getElementById('link'));
      engine.setDockTab('props');
      await frames();
      await wait(120);
      const propsPanel = deep('heo-props-panel');
      const propsField = propsPanel.shadowRoot.querySelector('.id heo-search-field');
      const propHeadings = () =>
        Array.from(propsPanel.shadowRoot.querySelectorAll('heo-section')).map((s) => s.heading);
      const propRows = () =>
        Array.from(propsPanel.shadowRoot.querySelectorAll('.row .name .t')).map((n) =>
          n.textContent.trim(),
        );

      results.props = {
        // Same primitive, same place, same accessible name as the one in Styles.
        isTheSharedField: propsField?.tagName.toLowerCase() === 'heo-search-field',
        saysWhatItSearches: propsField?.getAttribute('label') === 'Search in element',
        sectionsBefore: propHeadings().length,
      };

      // A tag-specific attribute, by name.
      await typeInto(propsField, 'target', propsPanel);
      results.props.narrows = propHeadings().length < results.props.sectionsBefore;
      results.props.findsByName = propRows().some((n) => /target/i.test(n));

      // By the friendly label the panel shows instead of the attribute name.
      await typeInto(propsField, 'Link URL', propsPanel);
      results.props.findsByLabel = propRows().length > 0;

      // By what is written in it: the href is /somewhere and nothing is named that.
      await typeInto(propsField, 'somewhere', propsPanel);
      results.props.findsByValue = propRows().some((n) => /link url/i.test(n));

      /* Out of rows: the completions, the same as in Styles. */
      const propsNoMatch = () => propsPanel.shadowRoot.querySelector('.nomatch');
      const propsOffered = () =>
        Array.from(propsPanel.shadowRoot.querySelectorAll('.nomatch .offer .option')).map((b) =>
          b.querySelector('.name').textContent.trim(),
        );

      // A real attribute this element has no row for.
      await typeInto(propsField, 'aria-current', propsPanel);
      results.props.emptyPanelExplainsItself = Boolean(propsNoMatch());
      results.props.confirmsARealAttribute = Boolean(
        propsPanel.shadowRoot.querySelector('.nomatch .verdict.yes'),
      );

      // A name the catalogue does not list. HTML has no CSS.supports, so this must NOT be
      // called invalid — it is legal, and data-* is the name reserved for it.
      await typeInto(propsField, 'wobble', propsPanel);
      results.props.allowsNonStandardNames = Boolean(
        propsPanel.shadowRoot.querySelector('.nomatch .verdict.no'),
      );
      results.props.stillOffersToAddIt = Array.from(
        propsPanel.shadowRoot.querySelectorAll('.nomatch button'),
      ).some((b) => /add wobble/i.test(b.textContent));

      // An event handler is refused outright, before any dialog opens: the overlay writes into a
      // live page and serialises it, so an onclick added here would run AND be saved.
      await typeInto(propsField, 'onclick', propsPanel);
      results.props.refusesEventHandlers = Boolean(
        propsPanel.shadowRoot.querySelector('.nomatch .verdict.stop'),
      );
      results.props.offersNoWayToAddOne = !Array.from(
        propsPanel.shadowRoot.querySelectorAll('.nomatch button'),
      ).some((b) => /add onclick/i.test(b.textContent));

      /*
       * Near misses, and taking one seeds the popup.
       *
       * `aria-press` and not `aria-lab`: the panel already draws an aria-label row for every
       * element, so that query has a match and the no-match block correctly never appears.
       */
      await typeInto(propsField, 'aria-press', propsPanel);
      results.props.offersTheNearMiss = propsOffered().includes('aria-pressed');
      Array.from(propsPanel.shadowRoot.querySelectorAll('.nomatch .offer .option'))
        .find((b) => b.querySelector('.name').textContent.trim() === 'aria-pressed')
        ?.click();
      await propsPanel.updateComplete;
      await frames();
      results.props.takingOneSeedsTheAdder =
        (propsPanel.draftRows ?? []).length === 1 &&
        propsPanel.draftRows[0].name === 'aria-pressed';

      /* The popup: several arbitrary attributes, one undo entry. */
      const fillAttrRow = async (index, name, value) => {
        const row = propsPanel.shadowRoot.querySelectorAll('.poprow')[index];
        const nameInput = row.querySelector('heo-search-field').shadowRoot.querySelector('input');
        nameInput.value = name;
        nameInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await propsPanel.updateComplete;
        const valueInput = propsPanel.shadowRoot
          .querySelectorAll('.poprow')[index]
          .querySelector('heo-value-field')
          .shadowRoot.querySelector('input');
        valueInput.value = value;
        valueInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await propsPanel.updateComplete;
        await frames();
      };
      const propsPopButton = (pattern) =>
        Array.from(propsPanel.shadowRoot.querySelectorAll('.popfoot button')).find((b) =>
          pattern.test(b.textContent),
        );

      propsPopButton(/another/i)?.click();
      await propsPanel.updateComplete;
      await frames();
      propsPopButton(/another/i)?.click();
      await propsPanel.updateComplete;
      await frames();
      results.props.takesMoreThanOneRow =
        propsPanel.shadowRoot.querySelectorAll('.poprow').length === 3;

      // One standard, one arbitrary, one boolean with no value at all.
      await fillAttrRow(0, 'aria-label', 'Go somewhere');
      await fillAttrRow(1, 'data-analytics-id', 'hero-cta');
      await fillAttrRow(2, 'hidden', '');

      const attrChangesBefore = engine.records.length;
      const undoDepthBefore = engine.history.size;
      propsPopButton(/add (\d+ )?attributes?/i)?.click();
      await frames();
      await wait(150);

      const link = document.getElementById('link');
      results.props.standardLanded = link.getAttribute('aria-label') === 'Go somewhere';
      // The point of the whole feature: a name no table in the codebase knows about.
      results.props.arbitraryLanded = link.getAttribute('data-analytics-id') === 'hero-cta';
      /*
       * A boolean attribute is written as the empty string, and that used to be impossible:
       * setAttribute treated '' as removal, so every checkbox in this panel removed what it
       * meant to add. null is how removal is asked for.
       */
      results.props.booleanLanded = link.hasAttribute('hidden');
      // One decision, one step on the undo stack -- three trips through a one-shot form would
      // have been three.
      results.props.oneUndoEntry = engine.history.size === undoDepthBefore + 1;
      /*
       * ...but three entries in the change set, and that is not a contradiction.
       *
       * The save path builds its file patch per attribute, from `detail.attribute`. One record
       * describing the batch would have written the first attribute to disk and silently dropped
       * the other two, so the command reports one record each through `extraRecords`.
       */
      results.props.everyAttributeIsRecorded =
        engine.records.length === attrChangesBefore + 3;
      results.props.popupClosed = !propsPanel.shadowRoot.querySelector('.addpop');

      engine.undo();
      await frames();
      results.props.undoTakesAllBack =
        !link.hasAttribute('aria-label') &&
        !link.hasAttribute('data-analytics-id') &&
        !link.hasAttribute('hidden');

      // A javascript: URL is refused on the way in, the same as it is in pasted markup.
      const hrefBefore = link.getAttribute('href');
      engine.select(link);
      await typeInto(propsField, '', propsPanel);
      await frames();
      propsPanel.shadowRoot
        .querySelector('.id heo-search-field')
        .shadowRoot.querySelector('.go')
        .click();
      await propsPanel.updateComplete;
      await frames();
      await fillAttrRow(0, 'href', 'javascript:alert(1)');
      propsPopButton(/add (\d+ )?attributes?/i)?.click();
      await frames();
      await wait(80);
      results.props.refusesJavascriptUrls = link.getAttribute('href') === hrefBefore;

      results.props.ok =
        results.props.isTheSharedField &&
        results.props.saysWhatItSearches &&
        results.props.narrows &&
        results.props.findsByName &&
        results.props.findsByLabel &&
        results.props.findsByValue &&
        results.props.emptyPanelExplainsItself &&
        results.props.confirmsARealAttribute &&
        results.props.allowsNonStandardNames &&
        results.props.stillOffersToAddIt &&
        results.props.refusesEventHandlers &&
        results.props.offersNoWayToAddOne &&
        results.props.offersTheNearMiss &&
        results.props.takingOneSeedsTheAdder &&
        results.props.takesMoreThanOneRow &&
        results.props.standardLanded &&
        results.props.arbitraryLanded &&
        results.props.booleanLanded &&
        results.props.oneUndoEntry &&
        results.props.everyAttributeIsRecorded &&
        results.props.popupClosed &&
        results.props.undoTakesAllBack &&
        results.props.refusesJavascriptUrls;

      /* ------------------------------------------------------------------ *
       * 5. Code: a finder with no create action, in the panel and expanded.
       * ------------------------------------------------------------------ */
      progress.textContent = 'code';
      // The code view projects the selection, so the needle below is only in the buffer if the
      // selection is the one this block was written against.
      engine.select(document.querySelector('main'));
      engine.openCode('html');
      await frames();
      await wait(150);
      const codePanel = deep('heo-code-panel');
      // The bar belongs to the editor now, not to the panel: that is what gives CSS and JS the
      // same finder instead of leaving it to whichever panel happened to be built first.
      const editor = codePanel.shadowRoot.querySelector('heo-code-editor');
      const codeField = editor.shadowRoot.querySelector('.findbar heo-search-field');

      results.code = {
        hasTheField: Boolean(codeField),
        // No plus here: there is nothing in a buffer to create.
        offersNoCreateAction: !codeField.shadowRoot.querySelector('.go'),
        hasPrevNext: editor.shadowRoot.querySelectorAll('.findbar button').length === 2,
      };

      await typeInto(codeField, 'section', editor);
      await wait(120);
      /*
       * The bug this is here for: revealing used to focus the textarea, so every character typed
       * moved focus out of the query box and the next one went into the document instead.
       */
      results.code.keepsFocusWhileTyping =
        editor.shadowRoot.activeElement !== editor.shadowRoot.querySelector('textarea');
      // And the matches are drawn where they can actually be seen, not left to a transparent
      // textarea's selection.
      results.code.marksEveryMatch = editor.shadowRoot.querySelectorAll('pre mark.hit').length;
      results.code.picksOutTheCurrentOne =
        editor.shadowRoot.querySelectorAll('pre mark.hit.on').length === 1;
      await wait(120);
      const area = editor.shadowRoot.querySelector('textarea');
      results.code.matchesFound = editor.matchOffsets('section').length;
      results.code.selectedAMatch =
        area.value.slice(area.selectionStart, area.selectionEnd).toLowerCase() === 'section';
      const firstAt = area.selectionStart;

      // Enter steps forward, the way every find box does.
      await press(codeField, 'Enter');
      await wait(60);
      results.code.enterAdvances = area.selectionStart !== firstAt;
      results.code.stillOnAMatch =
        area.value.slice(area.selectionStart, area.selectionEnd).toLowerCase() === 'section';

      results.code.countMatchesWhatIsShown =
        editor.matchOffsets('section').length === results.code.matchesFound;

      results.code.ok =
        results.code.keepsFocusWhileTyping &&
        results.code.marksEveryMatch > 1 &&
        results.code.picksOutTheCurrentOne &&
        results.code.hasTheField &&
        results.code.offersNoCreateAction &&
        results.code.hasPrevNext &&
        results.code.matchesFound > 1 &&
        results.code.selectedAMatch &&
        results.code.enterAdvances &&
        results.code.stillOnAMatch;

      /* Every editor that fills its panel has it, which is what the Code panel alone did not give. */
      progress.textContent = 'css and js';
      for (const [tab, tag] of [['css', 'heo-css-panel'], ['js', 'heo-js-panel']]) {
        engine.setDockTab('code');
        engine.setCodeTab(tab);
        await frames();
        await wait(200);
        const panel = deep(tag);
        const ed = panel?.shadowRoot?.querySelector('heo-code-editor');
        results[`${tab}Finder`] = {
          panelFound: Boolean(panel),
          hasTheFinder: Boolean(ed?.shadowRoot?.querySelector('.findbar heo-search-field')),
        };
        results[`${tab}Finder`].ok =
          results[`${tab}Finder`].panelFound && results[`${tab}Finder`].hasTheFinder;
      }

      /* The expanded view renders the same panel, so it gets the finder for free. */
      engine.openCodeWorkspace('html');
      await frames();
      await wait(200);
      const workspace = deep('heo-code-workspace');
      const expandedPanel = workspace?.shadowRoot?.querySelector('heo-code-panel');
      results.expanded = {
        workspaceOpen: Boolean(workspace),
        reusesThePanel: Boolean(expandedPanel),
        soItHasTheFinder: Boolean(
          expandedPanel?.shadowRoot
            ?.querySelector('heo-code-editor')
            ?.shadowRoot?.querySelector('.findbar heo-search-field'),
        ),
      };
      results.expanded.ok =
        results.expanded.workspaceOpen &&
        results.expanded.reusesThePanel &&
        results.expanded.soItHasTheFinder;
      engine.closeCodeWorkspace();

      const failed = Object.entries(results)
        .filter(([, value]) => value && typeof value === 'object' && value.ok === false)
        .map(([key]) => key);

      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify(
        { ok: failed.length === 0, failed, ...results, errors }, null, 1,
      ) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:{"ok":false,"__fatal":' + JSON.stringify(String((e && e.stack) || e)) + '}:END';
    });
  </script>
</body>

</html>
