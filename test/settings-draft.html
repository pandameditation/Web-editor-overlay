<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Settings: a draft until Save settings</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font: 16px/1.5 system-ui, sans-serif;
    }

    pre {
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <p>Page</p>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const errors = [];
      window.addEventListener('error', (e) => errors.push('error: ' + e.message));
      window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + e.reason));
      const results = {};
      const check = async (name, fn) => {
        document.getElementById('progress').textContent = name;
        try { results[name] = await fn(); }
        catch (err) { results[name] = 'THREW: ' + String(err && err.stack); }
      };
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const flat = (node) => (node?.textContent ?? '').replace(/\s+/g, ' ').trim();

      // A transport that records what a Test sent, so a borrowed key can be seen without a network.
      const seen = [];
      let engine = null;
      const aiTransport = async function* (request) {
        seen.push({ id: request.set.id, hadKey: engine.ai.ready(request.set) });
        yield { op: 'summary', text: 'ready' };
      };
      const api = window.HtmlEditorOverlay.mount({ theme: 'dark', aiTransport });
      engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      for (const one of engine.ai.list()) engine.ai.remove(one.id);
      engine.ai.upsert({ id: 'one', label: 'One', transport: 'local', provider: 'openai-compatible', baseURL: 'http://127.0.0.1:9/v1', model: 'm1' });
      await frames();

      const overlay = () => document.querySelector('html-editor-overlay > heo-overlay')?.shadowRoot;
      const root = () => overlay()?.querySelector('heo-ai-settings')?.shadowRoot;
      const confirm = () => overlay()?.querySelector('heo-confirm-dialog')?.shadowRoot;
      const button = (r, re) => Array.from(r?.querySelectorAll('button') ?? []).find((b) => re.test(flat(b)));
      const fieldLabelled = (label) =>
        Array.from(root()?.querySelectorAll('.field') ?? []).find((one) =>
          (one.querySelector('span')?.textContent ?? '').trim().startsWith(label));
      const change = async (control, value) => {
        control.value = value;
        control.dispatchEvent(new Event('change', { bubbles: true }));
        await frames();
      };
      const open = async () => { engine.setAiSettings(true); await frames(); await frames(); };
      const cat = (id) => root()?.querySelector(`.cats [role="tab"][data-category="${id}"]`);
      const goTo = async (id) => { cat(id).click(); await frames(); };

      await check('theFooterSavesAndCancels', async () => {
        await open();
        const footer = Array.from(root().querySelectorAll('footer button')).map((b) => ({
          text: flat(b), primary: b.classList.contains('primary'),
        }));
        return {
          footer,
          noAddInTheFooter: !footer.some((b) => /add/i.test(b.text)),
        };
      });

      /*
       * One provider gets the same two-column layout as several.
       *
       * It used to hide the list and move Add into the form's action line, a second layout that
       * had to be kept in step with the first for no gain.
       */
      await check('oneProviderUsesTheListLayout', async () => {
        const list = root().querySelector('.split .list');
        return {
          theListIsShown: Boolean(list) && getComputedStyle(list).display !== 'none',
          withTheOneTab: root().querySelectorAll('.list .tab').length === 1,
          addIsTheLastRowOfTheList: list?.lastElementChild?.classList.contains('add-list') === true,
          andNotAlsoInTheForm: !root().querySelector('.body-rows .add'),
        };
      });

      /*
       * The dialog body is the only thing that scrolls.
       *
       * The providers card used to take the remaining height and scroll inside itself, which put
       * a second scrollbar under "AI providers". theBodyOverflows proves the content is long
       * enough here that a nested scroller would have appeared.
       */
      await check('oneScrollbarForTheWholeDialog', async () => {
        const body = root().querySelector('.sections');
        const nested = ['.providers-card', '.split', '.list', '.pane'].map((s) => root().querySelector(s));
        const scrolls = (el) => el.scrollHeight > el.clientHeight + 1 &&
          /auto|scroll/.test(getComputedStyle(el).overflowY);
        return {
          theBodyOverflows: body.scrollHeight > body.clientHeight + 1,
          andTheBodyScrolls: /auto|scroll/.test(getComputedStyle(body).overflowY),
          nothingInsideItScrolls: nested.every((el) => el && !scrolls(el)),
          theProvidersCardIsAsTallAsItsContent: nested[0].scrollHeight <= nested[0].clientHeight + 2,
          theFooterStaysInView: root().querySelector('footer').getBoundingClientRect().bottom <= innerHeight,
        };
      });

      /*
       * Settings is four pages behind side tabs, opened on the page the opener is about.
       *
       * The AI menu's buttons call setAiSettings(true) and mean providers; the toolbar gear means
       * Settings as a whole and lands on General.
       */
      await check('categoriesAreSideTabs', async () => {
        engine.setAiSettings(false);
        await frames();
        await open();
        const tabs = Array.from(root().querySelectorAll('.cats [role="tab"]'));
        const list = root().querySelector('.cats [role="tablist"]');
        const openedOnAi = cat('ai')?.getAttribute('aria-selected') === 'true';
        const aiPageShowsProviders = Boolean(root().querySelector('[role="tabpanel"] .providers-card'));
        const rects = tabs.map((t) => t.getBoundingClientRect());
        const pageLeft = root().querySelector('[role="tabpanel"]').getBoundingClientRect().left;
        await goTo('viewports');
        const viewportsPage = Boolean(root().querySelector('[role="tabpanel"] heo-viewport-sizes')) &&
          !root().querySelector('.providers-card');
        // Arrow keys move along the tabs and wrap, as a tablist should.
        cat('viewports').focus();
        cat('viewports').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
        await frames();
        const arrowDown = engine.store.value.settingsCategory;
        cat('ai').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
        await frames();
        await frames();
        const wrapsToFirst = engine.store.value.settingsCategory === 'general' &&
          root().activeElement === cat('general');
        engine.setAiSettings(false);
        await frames();
        // The toolbar gear.
        const gear = document.querySelector('html-editor-overlay > heo-overlay')?.shadowRoot
          ?.querySelector('heo-toolbar')?.shadowRoot?.querySelector('button[aria-label="Settings"]');
        gear?.click();
        await frames();
        await frames();
        const gearOpensGeneral = engine.store.value.settingsCategory === 'general' &&
          Boolean(root()?.querySelector('[role="tabpanel"] .setting input'));
        engine.setAiSettings(false);
        await frames();
        await open();
        return {
          fourTabsInOrder: tabs.map((t) => t.dataset.category).join() === 'general,design,viewports,ai',
          labelled: tabs.map((t) => flat(t)).join('|') === 'General|Design system|Viewports|AI providers',
          verticalTablist: list?.getAttribute('aria-orientation') === 'vertical' &&
            rects.every((r, i) => i === 0 || r.top > rects[i - 1].top + 4),
          onTheLeftOfThePage: rects[0].right <= pageLeft + 1,
          openedOnAi,
          aiPageShowsProviders,
          viewportsPage,
          arrowDownMovesOn: arrowDown === 'ai',
          wrapsToFirst,
          gearFound: Boolean(gear),
          gearOpensGeneral,
        };
      });

      /*
       * A seed can be loaded from Settings, on the Design system page.
       *
       * The shared seed surface, applied at once as one undoable change rather than held for Save.
       */
      await check('aSeedLoadsFromTheDesignSystemPage', async () => {
        await goTo('design');
        const field = root().querySelector('[role="tabpanel"] textarea.paste');
        const loadButton = button(root(), /^Load$/);
        const before = engine.records.length;
        field.value = JSON.stringify({ name: 'From settings', tokens: [{ name: 'settings-seed', value: '#abcdef' }] });
        field.dispatchEvent(new Event('input', { bubbles: true }));
        await frames();
        loadButton.click();
        await new Promise((r) => setTimeout(r, 100));
        await frames();
        const result = {
          theFieldIsThere: Boolean(field) && Boolean(loadButton),
          theTokenArrived: engine.tokens.get('settings-seed')?.value === '#abcdef',
          asOneChange: engine.records.length === before + 1,
          withoutWaitingForSave: engine.store.value.aiSettingsOpen === true,
          theFieldIsCleared: root().querySelector('[role="tabpanel"] textarea.paste')?.value === '',
          // The providers page used an empty-state class whose padding and centring would have
          // reached the seed surface's dimmed rows; they must be laid out like the others.
          emptyRowsKeepTheirPadding: (() => {
            const rows = Array.from(root().querySelectorAll('.part'));
            return rows.length > 1 && rows.every((el) => getComputedStyle(el).padding === '3px 5px');
          })(),
        };
        engine.undo();
        await frames();
        result.undoTakesItBack = !engine.tokens.get('settings-seed');
        return result;
      });

      /*
       * A one-block seed opens the import screen, which sits at a lower z-index than Settings:
       * Settings steps out of the way while it is up and comes back with its draft.
       */
      await check('aBlockSeedOpensTheImportScreenInFront', async () => {
        await goTo('general');
        root().querySelector('.setting input').click();
        await frames();
        await goTo('design');
        const field = root().querySelector('[role="tabpanel"] textarea.paste');
        field.value = JSON.stringify({
          name: 'One block', version: 1, tokens: [], classes: [], blocks: [
            { id: 'from-settings', name: 'From settings', kind: 'component', category: 'Captured', origin: 'captured', html: '<p>hi</p>', css: '' },
          ]
        });
        field.dispatchEvent(new Event('input', { bubbles: true }));
        await frames();
        button(root(), /^Load$/).click();
        await new Promise((r) => setTimeout(r, 400));
        await frames();
        const host = overlay()?.querySelector('heo-ai-settings');
        const importOpen = Boolean(engine.store.value.capturePaste);
        const settingsHidden = getComputedStyle(host).display === 'none';
        engine.cancelCapturePaste();
        await frames();
        await frames();
        const back = getComputedStyle(host).display !== 'none' && engine.store.value.aiSettingsOpen === true;
        const draftKept = /Unsaved changes/.test(flat(root()?.querySelector('footer')));
        // Put the checkbox back so the next group starts from a clean draft.
        await goTo('general');
        root().querySelector('.setting input').click();
        await frames();
        await goTo('ai');
        return { importOpen, settingsHidden, back, draftKept };
      });

      await check('editsStayInTheDraftUntilSaved', async () => {
        await change(fieldLabelled('Model').querySelector('input'), 'm1-edited');
        // The checkbox lives on General; switching pages keeps the model edit in the draft.
        await goTo('general');
        root().querySelector('.setting input').click();
        await frames();
        await goTo('ai');
        const meanwhile = {
          model: engine.ai.get('one').model,
          split: engine.settings.value.splitDoubleBreaks,
          unsaved: flat(root().querySelector('footer .unsaved')),
        };
        button(root(), /^Cancel$/).click();
        await frames();
        const asked = flat(confirm()?.querySelector('h2, .title, header'));
        button(confirm(), /Keep editing/).click();
        await frames();
        const stillOpen = Boolean(root()?.querySelector('.dialog'));
        const keptEdit = fieldLabelled('Model').querySelector('input').value;
        return { meanwhile, asked, stillOpen, keptEdit };
      });

      await check('discardingLeavesTheEditorAsItWas', async () => {
        const esc = new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true });
        root().querySelector('.dialog').dispatchEvent(esc);
        await frames();
        button(confirm(), /Discard changes/).click();
        await frames();
        const closed = !engine.store.value.aiSettingsOpen;
        await open();
        return {
          closed,
          model: engine.ai.get('one').model,
          split: engine.settings.value.splitDoubleBreaks,
          formShowsTheSaved: fieldLabelled('Model').querySelector('input').value,
        };
      });

      await check('addRemoveAndPromoteAreSavedTogether', async () => {
        button(root(), /Add a provider/).click();
        await frames();
        const tabs = () => Array.from(root().querySelectorAll('.tab')).map((t) => flat(t.querySelector('.name')));
        const addBelowTabs = root().querySelector('.list')?.lastElementChild?.classList.contains('add-list');
        await change(fieldLabelled('Name').querySelector('input'), 'Two');
        await change(fieldLabelled('Model').querySelector('input'), 'm2');
        button(root(), /Promote/).click();
        await frames();
        const draftOrder = tabs();
        const engineMeanwhile = engine.ai.list().map((one) => one.label);
        button(root(), /Save settings/).click();
        await frames();
        await frames();
        return {
          addBelowTabs,
          draftOrder,
          engineMeanwhile,
          saved: engine.ai.list().map((one) => one.label),
          toast: engine.store.value.toast?.message ?? null,
        };
      });

      await check('anIncompleteProviderElsewhereIsOpenedOnSave', async () => {
        await open();
        // "Two" is first now; open "One" and break it, then go back to "Two" and save.
        const tab = (name) => Array.from(root().querySelectorAll('.tab')).find((t) => flat(t.querySelector('.name')) === name);
        tab('One').click();
        await frames();
        await change(fieldLabelled('Model').querySelector('input'), '');
        tab('Two').click();
        await frames();
        // Saved from another page: the dialog has to bring the AI page back to show the problem.
        await goTo('general');
        button(root(), /Save settings/).click();
        await frames();
        await frames();
        const model = fieldLabelled('Model').querySelector('input');
        return {
          backOnTheAiPage: engine.store.value.settingsCategory === 'ai',
          stillOpen: engine.store.value.aiSettingsOpen,
          showing: flat(root().querySelector('.head .name')),
          error: flat(root().querySelector('.field-error')),
          focused: root().activeElement === model,
          notSaved: engine.ai.get('one').model === 'm1',
        };
      });

      await check('removingIsADraftToo', async () => {
        button(root(), /Delete/).click();
        await frames();
        const noConfirm = !confirm()?.querySelector('button');
        const tabsLeft = root().querySelectorAll('.tab').length;
        const engineStillHasIt = Boolean(engine.ai.get('one'));
        button(root(), /^Cancel$/).click();
        await frames();
        button(confirm(), /Discard changes/)?.click();
        await frames();
        return { noConfirm, tabsLeft, engineStillHasIt, afterCancel: engine.ai.list().map((one) => one.label) };
      });

      await check('aKeyIsTestedFromTheDraftAndStoredOnlyOnSave', async () => {
        engine.ai.upsert({ id: 'keyed', label: 'Keyed', transport: 'in-page', provider: 'openai', baseURL: 'https://api.openai.com/v1', model: 'gpt' });
        await open();
        Array.from(root().querySelectorAll('.tab')).find((t) => flat(t).includes('Keyed')).click();
        await frames();
        const key = root().querySelector('input[type="password"]');
        key.value = 'sk-draft-only';
        key.dispatchEvent(new Event('input', { bubbles: true }));
        await frames();
        seen.length = 0;
        button(root(), /^Test$/).click();
        await new Promise((r) => setTimeout(r, 100));
        await frames();
        const tested = {
          verdict: flat(root().querySelector('.verdict.ok')),
          withTheTypedKey: seen[0]?.hadKey === true,
          underAnotherId: seen[0]?.id !== 'keyed',
          borrowedKeyGone: seen[0] ? !engine.ai.ready({ ...engine.ai.get('keyed'), id: seen[0].id }) : false,
          realOneStillEmpty: !engine.ai.ready(engine.ai.get('keyed')),
        };
        button(root(), /Save settings/).click();
        await new Promise((r) => setTimeout(r, 50));
        await frames();
        return { tested, storedOnSave: engine.ai.keyStatus('keyed').hint === 'only' };
      });

      await check('forgettingAKeyWaitsForSave', async () => {
        await open();
        Array.from(root().querySelectorAll('.tab')).find((t) => flat(t).includes('Keyed')).click();
        await frames();
        button(root(), /Forget key/).click();
        await frames();
        const staged = flat(root().querySelector('.acts .key-note'));
        const stillHeld = engine.ai.ready(engine.ai.get('keyed'));
        button(root(), /Save settings/).click();
        await frames();
        return { staged, stillHeld, forgotten: !engine.ai.ready(engine.ai.get('keyed')) };
      });

      await check('noProvidersOffersAddInTheSection', async () => {
        for (const one of engine.ai.list()) engine.ai.remove(one.id);
        await open();
        const add = root().querySelector('.empty-acts .add-empty');
        const result = { inTheSection: Boolean(add?.closest('.providers-card')), text: flat(add) };
        engine.setAiSettings(false);
        await frames();
        return result;
      });

      results.__errors = errors;
      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify(results, null, 1) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent = 'RESULTS:{"__errors":["' + String(e && e.message) + '"]}:END';
    });
  </script>
</body>

</html>
