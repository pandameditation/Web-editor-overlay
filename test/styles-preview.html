<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Previewing a viewport width in place</title>
  <!--
    The shared sample (design §8). The suite's window is 756px wide, so Actual is in the phone
    range; every preview assertion is made at 320 and at 1024 so it cannot pass by matching the
    window.
  -->
  <style id="site">
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .card { padding: 12px 16px; margin: 0 0 12px; color: #1f2937; background-color: #ffffff; }
    .featured { border: 1px solid #a5b4fc; }
    .card.featured { background-color: #eef2ff; }
    .promo .card { color: #3730a3 !important; }
    section p { letter-spacing: 0.01em; }
    @media (max-width: 767px) {
      .cards { grid-template-columns: 1fr; }
      .card { padding: 10px 12px; }
      section p { word-spacing: 1px; }
    }
    @media (min-width: 768px) {
      .card { padding: 20px 28px; }
      section p { word-spacing: 4px; }
    }
    @media print {
      .card { color: #000000; }
    }
    .card:hover { background-color: #f9fafb; }
    @media (min-width: 768px) {
      .card:hover { box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
    }
    .featured::before { content: "★"; color: #f59e0b; }
  </style>
  <!-- Bootstrap spells the phone bound 767.98px: it is still the phone slot. -->
  <style id="fraction">
    @media (max-width: 767.98px) {
      .featured { text-indent: 2px; }
    }
  </style>
  <!--
    Width units. A preview narrows the root, but vw would still resolve against the 756 window, so
    a fluid heading looked desktop-sized in a phone preview. Each rule pins one way a restatement
    could go wrong: a later plain rule must keep winning, an important rule must keep beating an
    inline value, and custom properties, var() shorthands and nesting must follow.
  -->
  <style id="fluid">
    .fluid-title { font-size: clamp(12px, 5vw, 60px); }
    .fluid-box { width: 50vw; padding: 0 2vw; }
    .fluid-box.fixed { width: 100px; }
    .fluid-gap { --gutter: 10vw; margin-left: var(--gutter); }
    .fluid-pending { padding: var(--missing, 3vw) 1px; }
    .fluid-strong { height: 7px !important; }
    .fluid-nest { & .fluid-inner { width: 25vw; } }
    /* For the wide preview: half the screen tall in a fitted 1440, and a box to drag by hand. */
    .fluid-tall { height: 50vh; width: 10px; }
    .fluid-moved { position: absolute; left: 40px; top: 2000px; width: 60px; height: 30px; }
  </style>
  <!-- A sheet gated by its own media attribute: the attribute must never change. -->
  <style id="gated" media="(max-width: 767px)">
    #target { outline-offset: 3px; }
  </style>
</head>
<body>
  <section class="promo">
    <div class="cards">
      <p id="target" class="card featured" style="color: #b91c1c; font-size: 16px">The selected card</p>
      <p id="second" class="card">Second</p>
      <p class="card">Third</p>
      <p class="card">Fourth</p>
    </div>
  </section>
  <div id="fluid-zone">
    <h2 id="fluid-title" class="fluid-title">Fluid</h2>
    <div id="fluid-box" class="fluid-box">box</div>
    <div id="fluid-fixed" class="fluid-box fixed">fixed</div>
    <div id="fluid-gap" class="fluid-gap">gap</div>
    <div id="fluid-pending" class="fluid-pending">pending</div>
    <div id="fluid-inline" style="width: 20vw">inline</div>
    <div id="fluid-strong" class="fluid-strong" style="height: 5vw">strong</div>
    <div class="fluid-nest"><div id="fluid-inner" class="fluid-inner">inner</div></div>
    <div id="fluid-tall" class="fluid-tall"></div>
    <div id="fluid-moved" class="fluid-moved">moved</div>
  </div>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const results = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));
      const progress = document.getElementById('progress');
      const frames = () => new Promise((resolve) =>
        requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
      const deep = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (!el.shadowRoot) continue;
          const found = deep(selector, el.shadowRoot);
          if (found) return found;
        }
        return null;
      };
      const ruleFor = (selector, media = null) => {
        const walk = (list, inside) => {
          for (const rule of Array.from(list)) {
            if (rule instanceof CSSStyleRule) {
              if (rule.selectorText === selector && inside === media) return rule;
            } else if (rule instanceof CSSMediaRule) {
              const found = walk(rule.cssRules, rule.conditionText);
              if (found) return found;
            }
          }
          return null;
        };
        return walk(document.getElementById('site').sheet.cssRules, null);
      };
      /** The `@media` rule whose authored condition this is, read before any preview. */
      const mediaRuleOf = (text) => Array.from(document.getElementById('site').sheet.cssRules)
        .find((rule) => rule instanceof CSSMediaRule && rule.media.mediaText === text);
      try {
        /*
         * A linked sheet whose file cannot be fetched again: a blob URL revoked once it loaded. The
         * CSS panel then has only the CSSOM's reassembly of it, which is the reader that would
         * show `@media not all` while previewing.
         */
        const blobUrl = URL.createObjectURL(new Blob(
          ['@media (max-width: 767px) { .linked { margin: 1px; } }'],
          { type: 'text/css' },
        ));
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = blobUrl;
        const loaded = new Promise((resolve) => { link.onload = resolve; link.onerror = resolve; });
        document.head.prepend(link);
        await loaded;
        URL.revokeObjectURL(blobUrl);

        const asked = [];
        const api = window.HtmlEditorOverlay.mount({
          theme: 'dark',
          presets: false,
          detectScriptContent: false,
          aiTransport: (request) => {
            asked.push(request.context);
            return (async function* () {
              yield { op: 'summary', text: 'Looked, changed nothing.' };
            })();
          },
        });
        const engine = api.engine;
        api.setEditing(true);
        await engine.whenReady();
        await frames();
        const target = document.getElementById('target');
        const second = document.getElementById('second');
        const padding = () => getComputedStyle(target).padding;
        const rect = (el) => el.getBoundingClientRect();

        results.context = {
          innerWidth,
          // Recorded so a run in a wider window says why Actual's expectations moved.
          actualIsBelow768: matchMedia('(max-width: 767px)').matches === innerWidth < 768,
        };

        /* ------------------------------------------------------------------ *
         * The preview itself.
         * ------------------------------------------------------------------ */
        progress.textContent = 'preview';
        const actualPadding = padding();
        const actualTarget = rect(target);
        const actualSecond = rect(second);
        const phoneRule = mediaRuleOf('(max-width: 767px)');
        const phoneCssText = phoneRule.cssText.slice(0, phoneRule.cssText.indexOf('{'));
        const gated = document.getElementById('gated');
        const exportBefore = engine.exportHTML();
        const promptBefore = engine.buildSavePrompt();
        const historyBefore = engine.history.size;
        const recordsBefore = engine.records.length;
        const print = mediaRuleOf('print');
        // Held from before the preview: `conditionText` reads `all` / `not all` while it is on.
        const phoneCard = ruleFor('.card', '(max-width: 767px)');

        engine.setPreviewWidth(320);
        const at320 = {
          padding: padding(),
          evaluator: engine.viewport.evaluatorWidth,
          stacked: rect(second).top > rect(target).top,
          printUntouched: print.media.mediaText === 'print',
        };
        engine.setPreviewWidth(1024);
        await frames();
        const at1024 = {
          padding: padding(),
          evaluator: engine.viewport.evaluatorWidth,
          sideBySide: rect(second).top === rect(target).top && rect(second).left > rect(target).left,
          printUntouched: print.media.mediaText === 'print',
          host: deep('html-editor-overlay')?.getBoundingClientRect().width ?? -1,
          // The window's visible width: less its scrollbar, which the sample's far-down box brings.
          visible: document.documentElement.clientWidth,
          exported: engine.exportHTML(),
          prompt: engine.buildSavePrompt(),
        };

        // The legacy readers, through the context an AI request is sent.
        engine.ai.upsert({
          id: 'styles-preview-probe',
          label: 'Styles preview probe',
          transport: 'local',
          provider: 'openai-compatible',
          baseURL: 'http://127.0.0.1:9/v1',
          model: 'm',
        });
        engine.ai.activate('styles-preview-probe');
        await engine.promptAi('Look at this card.', target);
        await wait(100);
        const bundle = asked.length ? JSON.parse(asked.at(-1)) : null;
        // `declared` is `declaredMap` over `appliedRules`: which media rules it took is the question.
        const declaredOf = (property) =>
          bundle?.declared?.find((one) => one.property === property);

        // A rule location captured while previewing names the authored condition, never `not all`.
        engine.setDeclaration({ kind: 'live', rule: phoneCard }, 'margin', '0 0 9px');
        const located = engine.history.records.at(-1)?.detail?.ruleContext ?? '';
        engine.undo();

        // The CSS panel's draft of a linked sheet is the CSSOM's reassembly of it.
        engine.openCode('css');
        await frames();
        await wait(250);
        const draft = deep('heo-css-panel')?.draft ?? '';

        // A managed sheet write re-parses, and its new rules must come back previewed at once.
        engine.rules.upsert({
          selector: '.card',
          media: '(min-width: 768px)',
          declarations: { 'letter-spacing': '3px' },
          origin: 'user',
        });
        engine.setDesignRuleDeclaration('@media (min-width: 768px) .card', 'letter-spacing', '5px');
        const reapplied = getComputedStyle(target).letterSpacing;
        engine.undo();
        engine.rules.remove('@media (min-width: 768px) .card');

        // The frame moves with the dock: centred in what the docked panel leaves.
        engine.setPreviewWidth(320);
        engine.setDock(true, 'styles');
        await frames();
        const leftDocked = rect(document.documentElement).left;
        const frameDocked = engine.viewport.frameLeft;
        engine.setDock(false);
        await frames();
        const leftUndocked = rect(document.documentElement).left;
        const frameUndocked = engine.viewport.frameLeft;
        await frames();
        const frameEl = deep('heo-viewport-frame');
        const shades = Array.from(frameEl?.shadowRoot?.querySelectorAll('.shade') ?? [])
          .map((one) => one.getBoundingClientRect());

        results.preview = {
          // Discriminating in a 756 window: one of the two widths is never the window's answer.
          mediaQueriesEvaluateAtThePreviewWidth:
            at320.padding === '10px 12px' && at1024.padding === '20px 28px',
          evaluatorReportsThePreviewWidth: at320.evaluator === 320 && at1024.evaluator === 1024,
          legacyReadersFollowThePreview:
            declaredOf('padding')?.value === '20px 28px' &&
            declaredOf('word-spacing')?.value === '4px' &&
            declaredOf('word-spacing')?.from === 'section p',
          frameFollowsTheDock:
            leftDocked !== leftUndocked &&
            leftDocked === frameDocked &&
            leftUndocked === frameUndocked,
          layoutReflows: at320.stacked && at1024.sideBySide,
          ruleLocationsSurvive:
            located.includes('@media (max-width: 767px)') && !located.includes('not all'),
          cssTextReadsAuthoredWhilePreviewing:
            draft.includes('max-width: 767px') && !draft.includes('not all'),
          reappliesAfterAManagedSheetWrite: reapplied === '5px',
          onlyWidthQueriesAreRewritten: at320.printUntouched && at1024.printUntouched,
          // Compared with the visible width: the sample is taller than the window, so it scrolls.
          overlayHostIsNotNarrowed: at1024.host === at1024.visible,
          frameShadesOutsideTheFrame:
            shades.length === 2 &&
            Math.round(shades[0].left) === 0 &&
            Math.round(shades[0].width) === frameUndocked &&
            Math.round(shades[1].left) === frameUndocked + 320,
        };

        // The label's button is the way back.
        const back = Array.from(frameEl?.shadowRoot?.querySelectorAll('button') ?? [])
          .find((one) => /Back to actual/.test(one.textContent));
        back?.click();
        await frames();
        const afterBack = engine.store.value.previewWidth === null && !deep('heo-viewport-frame');

        await frames();
        results.preview.actualRestoresThePage =
          padding() === actualPadding &&
          JSON.stringify(rect(target)) === JSON.stringify(actualTarget) &&
          JSON.stringify(rect(second)) === JSON.stringify(actualSecond) &&
          phoneRule.cssText.slice(0, phoneRule.cssText.indexOf('{')) === phoneCssText &&
          gated.getAttribute('media') === '(max-width: 767px)' &&
          gated.sheet.media.mediaText === '(max-width: 767px)' &&
          !document.getElementById('heo-viewport-frame');
        results.preview.leavesNoTraceInExport =
          at1024.exported === exportBefore &&
          at1024.prompt === promptBefore &&
          engine.exportHTML() === exportBefore;
        results.preview.leavesNoHistoryEntry =
          engine.history.size === historyBefore && engine.records.length === recordsBefore;
        results.preview.backToActualFromTheFrameLabel = Boolean(back) && afterBack;

        // Leaving edit mode shows the page as it is.
        engine.setPreviewWidth(320);
        api.setEditing(false);
        await frames();
        results.preview.endsWhenEditingStops =
          engine.store.value.previewWidth === null &&
          !document.getElementById('heo-viewport-frame') &&
          padding() === actualPadding;
        api.setEditing(true);
        await frames();

        /* ------------------------------------------------------------------ *
         * Width units follow the previewed width.
         * ------------------------------------------------------------------ */
        progress.textContent = 'units';
        const fluid = (id) => getComputedStyle(document.getElementById(id));
        const fluidRule = (selector) => Array.from(document.getElementById('fluid').sheet.cssRules)
          .find((rule) => rule instanceof CSSStyleRule && rule.selectorText === selector);
        const fluidExportBefore = engine.exportHTML();
        const unitsHistoryBefore = engine.history.size;
        const actualTitle = fluid('fluid-title').fontSize;
        const actualBox = fluid('fluid-box').width;
        // At 100%: 1024 is wider than this 756 window, and these are exact-pixel checks of the
        // restatement. Scaling to fit has its own group below.
        engine.setPreviewFit(false);
        engine.setPreviewWidth(320);
        await frames();
        const u320 = {
          title: fluid('fluid-title').fontSize,
          box: fluid('fluid-box').width,
          boxPadding: fluid('fluid-box').paddingLeft,
          fixed: fluid('fluid-fixed').width,
          gap: fluid('fluid-gap').marginLeft,
          pending: fluid('fluid-pending').paddingTop,
          inline: fluid('fluid-inline').width,
          strong: fluid('fluid-strong').height,
          inner: fluid('fluid-inner').width,
          // Read now: a removed `<style>`'s sheet loses its owner.
          internal: ['data-heo-internal', 'data-heo-generated']
            .every((name) => engine.viewport.unitsSheet?.ownerNode?.hasAttribute(name) === true),
          last: document.styleSheets[document.styleSheets.length - 1] === engine.viewport.unitsSheet,
        };
        // A live rule edit fires no mutation; the restatement has to read the rule again.
        engine.setDeclaration({ kind: 'live', rule: fluidRule('.fluid-box') }, 'width', '25vw');
        const liveEdit = fluid('fluid-box').width;
        engine.undo();
        const liveUndo = fluid('fluid-box').width;
        // An inline value typed while previewing reaches the observer.
        document.getElementById('fluid-inline').style.width = '30vw';
        await frames();
        const inlineEdit = fluid('fluid-inline').width;
        // Put back as written, so the export below compares like with like.
        document.getElementById('fluid-inline').setAttribute('style', 'width: 20vw');
        engine.setPreviewWidth(1024);
        await frames();
        const u1024 = {
          title: fluid('fluid-title').fontSize,
          box: fluid('fluid-box').width,
          root: Math.round(document.documentElement.getBoundingClientRect().width),
          gap: fluid('fluid-gap').marginLeft,
        };
        const exportedWithUnits = engine.exportHTML();
        engine.setPreviewWidth(null);
        engine.setPreviewFit(true);
        await frames();
        results.units = {
          // The window is 756 wide: at 320, 5vw is 16px, where the window would say 37.8px.
          aFluidClampFollowsThePreview: u320.title === '16px' && u1024.title === '51.2px' && actualTitle !== '16px',
          vwLengthsFollowThePreview: u320.box === '160px' && u320.boxPadding === '6.4px' && u1024.box === '512px',
          aLaterPlainRuleStillWins: u320.fixed === '100px',
          customPropertiesFollow: u320.gap === '32px',
          aVarShorthandFollows: u320.pending === '9.6px',
          nestedRulesFollow: u320.inner === '80px',
          inlineValuesFollow: u320.inline === '64px',
          anImportantRuleStillBeatsInline: u320.strong === '7px',
          // Straight from 320 to 1024, no Actual between: the restatement once kept a copy of the
          // 320 frame, which beat the new one and left the page phone-sized.
          aDirectSwitchTakesTheNewWidth: u1024.root === 1024 && u1024.gap === '102.4px',
          aLiveRuleEditIsRestatedAtOnce: liveEdit === '80px' && liveUndo === '160px',
          anInlineEditIsRestated: inlineEdit === '96px',
          // The restatement is the editor's: every registry and the cascade inspector skip these
          // two markers, so no twin can show up as a rule to edit or a value to save.
          theSheetIsInternalAndLast: u320.internal && u320.last,
          actualRestoresTheUnits:
            fluid('fluid-title').fontSize === actualTitle &&
            fluid('fluid-box').width === actualBox &&
            !document.getElementById('heo-viewport-units') &&
            engine.viewport.unitsSheet === null,
          leavesNoTrace:
            exportedWithUnits === fluidExportBefore &&
            // The element's markup, assembled so this script's own text cannot match it.
            !exportedWithUnits.includes(['<style id="heo', 'viewport', 'units"'].join('-')) &&
            engine.history.size === unitsHistoryBefore,
        };

        /* ------------------------------------------------------------------ *
         * Wider than the window: scaled to fit, or at 100% and scrolling.
         * ------------------------------------------------------------------ */
        progress.textContent = 'wide';
        engine.setDock(true, 'styles');
        await frames();
        const room = innerWidth - engine.store.value.dockWidth - 28;
        const frameEl2 = () => deep('heo-viewport-frame');
        const label = () => frameEl2()?.shadowRoot?.querySelector('.label');
        engine.setPreviewWidth(1440);
        await frames();
        const scale = engine.viewport.scale;
        const rootRect = document.documentElement.getBoundingClientRect();
        engine.select(target);
        await frames();
        const badgeSize = deep('heo-selection-layer')?.shadowRoot?.querySelector('.badge .dim')?.textContent.trim();
        // A hand drag of 50 screen px moves the box 50 / scale CSS px: the page is drawn smaller.
        const moved = document.getElementById('fluid-moved');
        moved.scrollIntoView({ block: 'center' });
        await frames();
        const mb = moved.getBoundingClientRect();
        const began = engine.startTransform(moved, 'move', null, mb.left + 10, mb.top + 10);
        engine.updateTransform(mb.left + 60, mb.top + 10, { shift: false, alt: false });
        engine.endTransform();
        const movedLeft = moved.style.left;
        engine.undo();
        scrollTo(0, 0);
        await frames();
        const wide = {
          scale,
          rootFits: rootRect.left >= -1 && rootRect.right <= room + 1 && rootRect.right >= room - 3,
          mediaAt1440: padding() === '20px 28px',
          editorUnscaled: Math.round(deep('heo-dock')?.getBoundingClientRect().width ?? -1) === engine.store.value.dockWidth,
          badge: badgeSize,
          badgeWant: `${target.offsetWidth}×${target.offsetHeight}`,
          // 50vh of a window `innerHeight / scale` tall, drawn at `scale`: half the screen.
          tall: Math.abs(document.getElementById('fluid-tall').getBoundingClientRect().height - innerHeight / 2) <= 2,
          moved: began && movedLeft === `${Math.round(40 + 50 / scale)}px`,
          labelSays: /at \d+% to fit/.test(label()?.textContent ?? '') && Boolean(label()?.querySelector('[data-fit="100"]')),
        };
        // 100%: nothing scaled, and the right edge can be scrolled out from under the dock. The
        // page here guards against sideways scroll, as many do, and the preview must undo that.
        const guard = document.createElement('style');
        guard.textContent = 'html, body { overflow-x: hidden; }';
        document.head.appendChild(guard);
        label()?.querySelector('[data-fit="100"]')?.click();
        await frames();
        // Where the hand can reach it: inside the room beside the dock, not centred on the frame.
        const fitButton = label()?.querySelector('[data-fit="fit"]')?.getBoundingClientRect();
        const fitInRoom = Boolean(fitButton) && fitButton.left >= 0 && fitButton.right <= room &&
          fitButton.bottom <= innerHeight;
        const overflowX = getComputedStyle(document.documentElement).overflowX;
        scrollTo(1e6, 0);
        await frames();
        const atFull = {
          scale: engine.viewport.scale,
          right: document.documentElement.getBoundingClientRect().left + 1440,
          labelSays: /at 100%, scroll/.test(label()?.textContent ?? '') && Boolean(label()?.querySelector('[data-fit="fit"]')),
          zoom: getComputedStyle(document.documentElement).zoom,
        };
        scrollTo(0, 0);
        label()?.querySelector('[data-fit="fit"]')?.click();
        await frames();
        const refit = engine.viewport.scale === scale;
        // Fitted again, nothing is left to scroll: the page's own overflow is back.
        const overflowRefit = getComputedStyle(document.documentElement).overflowX;
        guard.remove();
        engine.setPreviewWidth(null);
        engine.setDock(false);
        await frames();
        results.wide = {
          aWiderWidthIsScaledIntoTheRoomBesideTheDock: scale < 1 && wide.rootFits,
          mediaQueriesStillAnswerAtTheWidth: wide.mediaAt1440,
          theEditorKeepsItsOwnSize: wide.editorUnscaled,
          theBadgeSaysCssPixels: wide.badge === wide.badgeWant,
          heightUnitsFollowTheScaledWindow: wide.tall,
          aHandDragWritesCssPixels: wide.moved,
          theLabelSaysTheScaleAndOffers100: wide.labelSays,
          at100TheRightEdgeScrollsClearOfTheDock:
            atFull.scale === 1 && atFull.zoom === '1' && atFull.right <= room + 1 && atFull.labelSays,
          at100FitToWindowStaysWithinReach: fitInRoom,
          at100ThePageScrollsSidewaysEvenIfItForbidsIt: overflowX === 'auto' && overflowRefit === 'hidden',
          fitComesBack: refit,
          actualUndoesTheScale:
            engine.viewport.scale === 1 &&
            getComputedStyle(document.documentElement).zoom === '1' &&
            getComputedStyle(deep('html-editor-overlay')).zoom === '1',
        };

        /* ------------------------------------------------------------------ *
         * The user's own viewport sizes.
         * ------------------------------------------------------------------ */
        progress.textContent = 'menu';
        const sizeBefore = engine.history.size;
        const refusedPreset = engine.addViewportSize(320) === false;
        const refusedRange = engine.addViewportSize(50) === false;
        const refusedNothing = engine.history.size === sizeBefore;
        const added = engine.addViewportSize(992);
        const grew = engine.history.size - sizeBefore;
        const exported = engine.settings.export();
        // The seed is plain base64url JSON behind a short prefix (`encodeSeedSync`).
        const seed = engine.blockLibrarySeed();
        const body = seed.slice(seed.indexOf('.') + 1).replace(/-/g, '+').replace(/_/g, '/');
        const decoded = seed ? JSON.parse(new TextDecoder().decode(
          Uint8Array.from(atob(body + '='.repeat((4 - (body.length % 4)) % 4)), (c) => c.charCodeAt(0)),
        )) : null;
        engine.undo();
        const undone = engine.settings.value.viewportSizes.length === 0;
        engine.redo();
        results.menu = {
          customSizeTravelsInSettings:
            JSON.stringify(exported.viewportSizes) === '[992]' &&
            JSON.stringify(decoded?.settings?.viewportSizes) === '[992]',
          addViewportSizeIsOneUndoEntry:
            added && grew === 1 && refusedPreset && refusedRange && refusedNothing && undone &&
            JSON.stringify(engine.settings.value.viewportSizes) === '[992]',
        };

        /* ------------------------------------------------------------------ *
         * The panel's preview bar, its menu, and the strips that follow it.
         * ------------------------------------------------------------------ */
        progress.textContent = 'bar';
        engine.setPreviewWidth(null);
        api.select(target);
        engine.setDockTab('styles');
        await frames();
        await wait(250);
        const panel = () => deep('heo-styles-panel');
        const root = () => panel().shadowRoot;
        const settle = async () => {
          await panel().updateComplete;
          await frames();
        };
        const bar = () => root().querySelector('.sizes heo-segmented');
        const segs = () => Array.from(bar()?.shadowRoot.querySelectorAll('button') ?? []);
        const seg = (label) => segs().find((b) => b.textContent.trim() === label);
        const pressedSegs = () =>
          segs().filter((b) => b.getAttribute('aria-pressed') === 'true').map((b) => b.textContent.trim());
        const line = () => root().querySelector('.sizes .bp')?.textContent.replace(/\s+/g, ' ').trim() ?? '';
        /*
         * The bar is the panel's first row, above the element's header, and it works with nothing
         * selected: the width is the page's, not the element's.
         */
        engine.select(null);
        await settle();
        const barFirst = () => {
          const bar = root().querySelector('.sizes');
          const next = root().querySelector('.empty, .ident');
          return Boolean(bar && next && (bar.compareDocumentPosition(next) & Node.DOCUMENT_POSITION_FOLLOWING));
        };
        results.layout = { barIsFirstWithNothingSelected: barFirst() };
        seg('320')?.click();
        await settle();
        results.layout.previewWorksWithNothingSelected =
          engine.store.value.previewWidth === 320 && line() === 'Previewing 320px.';
        seg('Actual')?.click();
        await settle();
        engine.select(target);
        await settle();
        results.layout.identFollowsTheBar = barFirst() &&
          root().querySelector('.ident') !== null &&
          root().querySelector('.sizes').compareDocumentPosition(root().querySelector('.ident')) === Node.DOCUMENT_POSITION_FOLLOWING;
        results.bar = {
          actualIsPressedByDefault: pressedSegs().join(',') === 'Actual',
          // The line is the width and nothing else.
          lineSaysAsItIs: line() === `As it is: ${innerWidth}px`,
        };
        seg('320')?.click();
        await settle();
        results.bar.lineSaysPreviewing =
          engine.store.value.previewWidth === 320 && pressedSegs().join(',') === '320' &&
          line() === 'Previewing 320px.';
        // No question after Enter any more, anywhere: a value goes where its list's switch says.
        const padField = () =>
          root().querySelector('[data-declarations="spacing"] .row[data-property="padding"] heo-value-field');
        padField()?.focusInput();
        padField()?.dispatchEvent(new CustomEvent('value-change', { detail: { value: '7px 8px' }, bubbles: true, composed: true }));
        await settle();
        results.bar.noSaveBoxAfterEnter = !root().querySelector('.savebox');
        engine.undo();
        await settle();
        seg('Actual')?.click();
        await settle();
        /* ---- the ⋮ panel: viewport sizes, for editing ---- */
        progress.textContent = 'barMenu';
        const more = () => root().querySelector('.sizes .more');
        const menu = () => root().querySelector('.menu[data-menu="preview"]');
        const sizesEl = () => menu()?.querySelector('heo-viewport-sizes');
        const sroot = () => sizesEl()?.shadowRoot;
        const rows = () => Array.from(sroot()?.querySelectorAll('.vp') ?? []);
        const widthOf = (row) => Number.parseInt(row.querySelector('heo-value-field')?.value ?? row.querySelector('.fixed')?.textContent ?? '', 10);
        const rowAt = (width) => rows().find((row) => widthOf(row) === width);
        const rowWidths = () => rows().map(widthOf);
        const barLabels = () => segs().map((b) => b.textContent.trim());
        const openMenu = async () => {
          if (!menu()) more()?.click();
          await settle();
          await frames();
          await sizesEl()?.updateComplete;
        };
        const press = (button) => { button?.click(); };
        const setWidth = async (row, value, event = 'value-change') => {
          row?.querySelector('heo-value-field')?.dispatchEvent(
            new CustomEvent(event, { detail: { value }, bubbles: true, composed: true }));
          await sizesEl()?.updateComplete;
          await settle();
        };
        const toggle = async (row) => {
          const box = row?.querySelector('input[type="checkbox"]');
          if (!box) return;
          box.checked = !box.checked;
          box.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
          await sizesEl()?.updateComplete;
          await settle();
        };
        // The page writes ≤767px (twice), ≥768px and print: the first is a size the panel lists,
        // left out of the bar until it is ticked; ≥768px is the tablet preset already; print is
        // not a size at all.
        results.menu.pageWidthQueryIsNotInTheBarByDefault =
          barLabels().join(',') === 'Actual,320,768,992,1024,1440';
        await openMenu();
        results.menu.opensTheViewportSizesPanel =
          menu()?.matches(':popover-open') === true && menu()?.getAttribute('role') === 'dialog' &&
          more()?.getAttribute('aria-expanded') === 'true' &&
          !/Media queries on this page|print/.test(menu()?.textContent ?? '');
        results.menu.listsEverySizeByWidth =
          rowWidths().join(',') === '320,767,768,992,1024,1440' &&
          rowAt(767)?.dataset.origin === 'page' && /≤767px/.test(rowAt(767)?.textContent ?? '') &&
          rowAt(992)?.dataset.origin === 'custom' && Boolean(rowAt(992)?.querySelector('.kill')) &&
          !rowAt(320)?.querySelector('.kill') &&
          rows().every((row) => row.querySelector('input[type="checkbox"]')?.checked === (row.dataset.origin !== 'page'));
        // Measured once the panel has drawn its rows: placed before that, it was capped at the
        // height of an empty box and scrolled (132px for 334px of rows).
        results.menu.panelIsAsTallAsItsRows =
          menu().scrollHeight <= menu().clientHeight + 1 || menu().clientHeight >= innerHeight * 0.45;
        // Each width but a page size's is a px field with the spacing gauge, the handle that drags
        // it, and nothing else: no unit to cycle, no list of units, functions or values to open.
        const fieldParts = (row) => {
          const f = row.querySelector('heo-value-field')?.shadowRoot;
          return { gauge: Boolean(f?.querySelector('.gauge')), unit: Boolean(f?.querySelector('.unit')), chevron: Boolean(f?.querySelector('.trailing .mini')) };
        };
        results.menu.widthsArePxFieldsWithTheDragHandle = rows().filter((row) => row.dataset.origin !== 'page').every((row) => {
          const parts = fieldParts(row);
          return parts.gauge && !parts.unit && !parts.chevron;
        });
        // A page size keeps its media query's width: shown, not editable.
        results.menu.pageSizeWidthIsNotEditable =
          !rowAt(767)?.querySelector('heo-value-field') && rowAt(767)?.querySelector('.fixed')?.textContent.trim() === '767px';
        results.menu.statesItsLimits = /keep vw at the real window/.test(sroot()?.querySelector('details')?.textContent ?? '');
        // Picking a size is the bar's job; the panel's rows do not preview anything. A row's name
        // is its checkbox's label: pressing it ticks the size.
        const historyAtStart = engine.history.size;
        press(rowAt(768)?.querySelector('.name'));
        await sizesEl()?.updateComplete;
        await settle();
        results.menu.rowsDoNotPreview = engine.store.value.previewWidth === null && Boolean(menu());
        results.menu.theNameTicksItsBox =
          rowAt(768)?.querySelector('input[type="checkbox"]')?.checked === false &&
          !barLabels().includes('768') && engine.history.size === historyAtStart + 1;
        press(rowAt(768)?.querySelector('.name'));
        await sizesEl()?.updateComplete;
        await settle();
        // No Apply and no Cancel: every change is kept as it is made, and the bar follows.
        results.menu.noApplyOrCancel = !sroot()?.querySelector('footer') &&
          !Array.from(sroot()?.querySelectorAll('button') ?? []).some((b) => /^(Apply|Cancel)$/.test(b.textContent.trim()));
        results.menu.tickingIsLive = barLabels().includes('768') && engine.history.size === historyAtStart + 2;

        /* Two sizes at one width, or a width out of range: said on the row, nothing kept. */
        const editsBefore = JSON.stringify(engine.settings.value.viewportEdits);
        const historyAtRefusal = engine.history.size;
        await setWidth(rowAt(768), '1024px');
        results.menu.refusesTwoSizesAtOneWidth =
          /1024px is already in the list/.test(sroot()?.textContent ?? '') &&
          JSON.stringify(engine.settings.value.viewportEdits) === editsBefore && engine.history.size === historyAtRefusal;
        await setWidth(rows().find((row) => row.dataset.key === 'preset:768'), '50px');
        results.menu.refusesAWidthOutOfRange =
          /Type a width between 200 and 4000 pixels\./.test(sroot()?.textContent ?? '') &&
          JSON.stringify(engine.settings.value.viewportEdits) === editsBefore;

        /*
         * A dragged width is kept as it moves, the bar following, and stays one undo step; the row
         * holds its place until the width is settled, then the list is sorted by width.
         */
        const historyAtDrag = engine.history.size;
        const row320 = rowAt(320);
        await setWidth(row320, '900px', 'value-input');
        const midBar = barLabels().join(',');
        await setWidth(row320, '1500px', 'value-input');
        const heldOrder = rowWidths().join(',');
        await setWidth(row320, '1500px');
        await toggle(rowAt(767));
        const keptEdits = JSON.stringify(engine.settings.value.viewportEdits);
        results.menu.dragIsLiveAndOneUndoStep =
          midBar === 'Actual,768,900,992,1024,1440' && heldOrder === '1500,767,768,992,1024,1440' &&
          engine.history.size === historyAtDrag + 2 &&
          keptEdits === '[{"base":320,"width":1500},{"base":767,"shown":true}]' &&
          barLabels().join(',') === 'Actual,767,768,992,1024,1440,1500';
        results.menu.settledWidthIsSortedInPlace =
          rowWidths().join(',') === '767,768,992,1024,1440,1500' &&
          rowAt(767)?.querySelector('input[type="checkbox"]')?.checked === true;
        const seed2 = engine.blockLibrarySeed();
        const body2 = seed2.slice(seed2.indexOf('.') + 1).replace(/-/g, '+').replace(/_/g, '/');
        const decoded2 = seed2 ? JSON.parse(new TextDecoder().decode(
          Uint8Array.from(atob(body2 + '='.repeat((4 - (body2.length % 4)) % 4)), (c) => c.charCodeAt(0)),
        )) : null;
        results.menu.editsTravelInTheSeed =
          JSON.stringify(decoded2?.settings?.viewportEdits) === keptEdits;
        // Left out of a design system when the box for them is unticked; carried by default.
        const withSizes = engine.designSystem({ tokens: true, classes: true, rules: true, blocks: true, ai: false, aiKeys: false });
        const withoutSizes = engine.designSystem({ tokens: true, classes: true, rules: true, blocks: true, ai: false, aiKeys: false, viewports: false });
        results.menu.designSystemCanLeaveTheSizesOut =
          JSON.stringify(withSizes.settings?.viewportEdits) === keptEdits &&
          !withoutSizes.settings?.viewportEdits && !withoutSizes.settings?.viewportSizes;
        // Undo, with the panel open: the panel follows as well as the bar.
        engine.undo();
        engine.undo();
        await settle();
        await sizesEl()?.updateComplete;
        results.menu.undoPutsTheSizesBack =
          JSON.stringify(engine.settings.value.viewportEdits) === '[]' &&
          barLabels().join(',') === 'Actual,320,768,992,1024,1440' &&
          rowWidths().join(',') === '320,767,768,992,1024,1440';

        /* Escape closes the panel and gives focus back to ⋮. */
        await openMenu();
        rows()[0]?.querySelector('input[type="checkbox"]')?.focus();
        rows()[0]?.querySelector('input[type="checkbox"]')?.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }));
        await settle();
        await frames();
        results.menu.escapeClosesAndRefocuses = !menu() && root().activeElement === more();

        /* "Add a viewport size…", as today: a width of one's own, and its breakpoint. */
        const addField = () => sroot()?.querySelector('.add input');
        const typeSize = async (text) => {
          await openMenu();
          if (!addField()) {
            press(sroot()?.querySelector('.add .link'));
            await sizesEl()?.updateComplete;
          }
          const input = addField();
          input.value = text;
          input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
          await sizesEl()?.updateComplete;
          addField()?.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, composed: true, cancelable: true }));
          await sizesEl()?.updateComplete;
        };
        const sizesBefore = JSON.stringify(engine.settings.value.viewportSizes);
        await typeSize('50');
        results.menu.rejectsOutOfRangeWidth =
          /Type a width between 200 and 4000 pixels\./.test(sroot()?.querySelector('.add')?.textContent ?? '') &&
          JSON.stringify(engine.settings.value.viewportSizes) === sizesBefore;
        await typeSize('1280');
        await settle();
        const listedAndKept = rowWidths().includes(1280) && engine.settings.value.viewportSizes.includes(1280);
        // Kept at once; then picked from the bar, it is a size the strip writes at.
        seg('1280')?.click();
        await settle();
        results.menu.addViewportSizeAddsPresetAndSlot =
          listedAndKept &&
          engine.settings.value.viewportSizes.includes(1280) &&
          engine.store.value.previewWidth === 1280 &&
          Boolean(root().querySelector('[data-strip="panel"] [data-slot="from-1280"]'));

        /* The same panel in Settings, live there too: the dialog's Save is for its own fields. */
        progress.textContent = 'settings';
        {
          engine.setAiSettings(true, 'viewports');
          await frames(4);
          const dialog = () => deep('heo-ai-settings')?.shadowRoot;
          const inSettings = () => dialog()?.querySelector('heo-viewport-sizes');
          await inSettings()?.updateComplete;
          const sRows = () => Array.from(inSettings()?.shadowRoot?.querySelectorAll('.vp') ?? []);
          const listed = sRows().map((row) => Number.parseInt(row.querySelector('heo-value-field')?.value ?? row.querySelector('.fixed')?.textContent ?? '', 10)).join(',');
          const historyAtTick = engine.history.size;
          const box = sRows().find((row) => row.dataset.key === 'preset:1024')?.querySelector('input[type="checkbox"]');
          box.checked = false;
          box.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
          await deep('heo-ai-settings')?.updateComplete;
          await settle();
          const unsaved = /Unsaved changes/.test(dialog()?.querySelector('footer')?.textContent ?? '');
          results.menu.settingsHasTheSamePanel =
            listed === '320,767,768,992,1024,1280,1440' && !unsaved &&
            JSON.stringify(engine.settings.value.viewportEdits) === '[{"base":1024,"hidden":true}]' &&
            engine.history.size === historyAtTick + 1 && !barLabels().includes('1024');
          engine.setAiSettings(false);
          await frames(2);
          engine.undo();
          await settle();
        }
        /* The save dialog's design system step: the sizes are one of the things that travel. */
        {
          engine.previewSave();
          await frames(4);
          const save = () => deep('heo-save-dialog')?.shadowRoot;
          await deep('heo-save-dialog')?.updateComplete;
          Array.from(save()?.querySelectorAll('footer .btn') ?? []).find((b) => /Design system/.test(b.textContent))?.click();
          await frames(4);
          await deep('heo-save-dialog')?.updateComplete;
          const part = () => save()?.querySelector('[data-part="viewports"]');
          const box = () => part()?.querySelector('input');
          const offered = Boolean(part()) && box()?.checked === true && box()?.disabled === false &&
            /\b6 viewport sizes\b/.test(part()?.textContent.replace(/\s+/g, ' ') ?? '');
          results.menu.designSystemStepOffersTheSizes = offered;
          // Not between the providers and their API keys: the keys row is the providers' sub-item.
          const parts = Array.from(save()?.querySelectorAll('.parts > .part') ?? []);
          const at = (match) => parts.findIndex(match);
          const sizesAt = at((one) => one.dataset.part === 'viewports');
          const aiAt = at((one) => /AI provider/.test(one.textContent));
          const keysAt = at((one) => one.classList.contains('dependent'));
          results.menu.sizesComeBeforeTheProviders =
            sizesAt !== -1 && aiAt === sizesAt + 1 && (keysAt === -1 || keysAt === aiAt + 1);
          engine.closeSavePreview();
          await frames(2);
        }

        /* ---- the strips follow the preview ---- */
        progress.textContent = 'follow';
        engine.setPreviewWidth(null);
        await settle();
        const strip = () => root().querySelector('[data-strip="panel"]');
        const pressedSlot = () =>
          strip()?.querySelector('.base[aria-pressed="true"]')
            ? 'base'
            : strip()?.querySelector('[data-slot][aria-pressed="true"]')?.dataset.slot ?? null;
        results.follow = { actualPicksAllSizes: pressedSlot() === 'base' };
        strip()?.querySelector('[data-slot="tablet"]')?.click();
        await settle();
        // Picked, the cards read that size, which the line under the strip says.
        const picked = pressedSlot() === 'tablet' && Boolean(root().querySelector('.ctxline[data-ctx="size"]'));
        api.select(second);
        await settle();
        api.select(target);
        await settle();
        const held = pressedSlot() === 'tablet';
        engine.setPreviewWidth(320);
        await settle();
        results.follow.handPickHoldsUntilPreviewChanges = picked && held && pressedSlot() === 'phone';
        engine.setPreviewWidth(null);
        await settle();

        strip()?.querySelector('[data-slot="phone"]')?.click();
        await settle();
        const onPhone = pressedSlot() === 'phone';
        strip()?.querySelector('[data-slot="phone"]')?.click();
        await settle();
        const fresh = engine.elementModel(target);
        const fraction = fresh.entries.find((entry) => entry.media === '(max-width: 767.98px)');
        const phoneCount = fresh.entries
          .filter((entry) => entry.state === '' && fresh.slotOf(entry) === 'phone')
          .reduce((sum, entry) => sum + entry.declarations.length, 0);
        results.strip = {
          stripTogglesBackToElement: onPhone && pressedSlot() === 'base',
          // Bootstrap's 767.98px is the phone breakpoint, not "another media query".
          toleratesFractionalBreakpoints:
            Boolean(fraction) && fresh.slotOf(fraction) === 'phone' &&
            strip()?.querySelector('[data-slot="phone"]')?.getAttribute('aria-label') ===
              `Phone, up to 767px, ${phoneCount} declarations`,
        };

        /* ---- what a card and the groups show depends on the preview (R7) ---- */
        progress.textContent = 'filter';
        engine.setPreviewWidth(null);
        await settle();
        // A class's card, opened from its chip in the header, in the popover over the panel.
        const card = (key) => root().querySelector(`.cardpop .cls[data-card="${CSS.escape(key)}"]`);
        const show = async (key) => {
          if (card(key)) return;
          root().querySelector(`.ident .cchip[data-class="${CSS.escape(key.slice(1))}"] .name`)?.click();
          await settle();
        };
        await show('.card');
        const slotsOf = (scope) => Array.from(scope?.querySelectorAll('.slots [data-slot]') ?? []).map((one) => one.dataset.slot);
        const metaOf = (key) => card(key)?.querySelector(':scope > header .meta')?.textContent.trim() ?? '';
        const pressedIn = (scope) =>
          scope?.querySelector('.slots .base[aria-pressed="true"]')
            ? 'base'
            : scope?.querySelector('.slots [data-slot][aria-pressed="true"]')?.dataset.slot ?? null;
        const pickIn = async (scope, slot) => {
          scope?.querySelector(`.slots [data-slot="${slot}"]`)?.click();
          await settle();
        };
        const cardCount = (width) => {
          const model = engine.elementModel(target);
          return model.entries
            .filter((entry) => entry.family === '.card' && (width === null || entry.medias.every((one) => matchMediaAt(one, width))))
            .reduce((sum, entry) => sum + entry.declarations.length, 0);
        };
        // Width queries only, which is all this sample has besides print.
        const matchMediaAt = (media, width) => {
          if (/print/.test(media)) return false;
          const max = /max-width:\s*([\d.]+)px/.exec(media);
          const min = /min-width:\s*([\d.]+)px/.exec(media);
          return (!max || width <= Number(max[1])) && (!min || width >= Number(min[1]));
        };
        // At Actual, every condition the card declares under is on its bar, and nothing empty is;
        // the ≥768px :hover rule is a condition of its own.
        const atActual = slotsOf(card('.card'));
        await pickIn(card('.card'), 'state::hover@tablet');
        const tabletHover = Boolean(card('.card')?.querySelector('.block[data-block=":hover"] .decl .p[title="box-shadow"]'));
        card('.card')?.querySelector('.slots .base')?.click();
        await settle();
        results.filter = {
          actualShowsEveryCondition:
            atActual.join(',') === 'phone,tablet,other:print,state::hover,state::hover@tablet' &&
            metaOf('.card') === `${cardCount(null)} rules • 4×` &&
            tabletHover,
        };
        engine.setPreviewWidth(320);
        await settle(300);
        const phoneMeta = metaOf('.card');
        const phonePressed = [pressedIn(root().querySelector('.cond')), pressedIn(card('.card'))];
        results.filter.previewHidesNonMatchingRules =
          phoneMeta === `${cardCount(320)} rules • 4×` && cardCount(320) < cardCount(null) &&
          !card('.card')?.querySelector('.block[data-block=":hover"] .decl .p[title="box-shadow"]');
        // At 320 only what applies there: the phone size, and :hover outside any media query. The
        // panel's strip keeps the others, dimmed: a size not in effect is still where a value goes;
        // and it holds the pseudo-element as a condition too.
        const inEffect = (scope) => Array.from(scope?.querySelectorAll('.slots [data-slot]:not(.notnow)') ?? []).map((one) => one.dataset.slot);
        results.filter.barsShowOnlyMatchingConditions =
          slotsOf(card('.card')).join(',') === 'phone,state::hover' &&
          inEffect(root().querySelector('.cond')).join(',') === 'phone,state::hover,state:::before' &&
          Boolean(root().querySelector('.cond .slots [data-slot="tablet"].notnow'));
        const hoverAt320 = slotsOf(card('.card'));
        // One card is open at a time: the other class's, for the same question.
        await show('.featured');
        phonePressed.push(pressedIn(card('.featured')));
        await show('.card');
        engine.setPreviewWidth(1024);
        await settle(300);
        const hoverAt1024 = slotsOf(card('.card'));
        const widePressed = [pressedIn(root().querySelector('.cond')), pressedIn(card('.card'))];
        results.filter.previewHidesStateRulesOutsideTheWidth =
          hoverAt1024.includes('state::hover@tablet') && !hoverAt320.includes('state::hover@tablet') &&
          hoverAt320.includes('state::hover');
        // The preview's slot is what every strip shows, the panel's and each card's.
        results.follow.previewPicksItsSlotEverywhere =
          phonePressed.join(',') === 'phone,phone,phone' && widePressed.join(',') === 'laptop,laptop';
        engine.setPreviewWidth(null);
        await settle();
        const failed = Object.entries(results)
          .filter(([, group]) => group && typeof group === 'object')
          .filter(([, group]) => Object.values(group).some((value) => value === false))
          .map(([name]) => name);
        document.getElementById('out').textContent =
          'RESULTS:' + JSON.stringify({ ...results, errors, failed }, null, 2) + ':END';
      } catch (e) {
        document.getElementById('out').textContent =
          'RESULTS:' +
          JSON.stringify({ threw: String((e && e.stack) || e), errors, failed: ['threw'] }, null, 2) +
          ':END';
      }
    })();
  </script>
</body>
</html>
