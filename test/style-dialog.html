<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Creating a class or rule opens it in its own dialog</title>
  <!--
    The page's own CSS, written so that filtering the rule list by "p" matches most of it.

    That is the point of the fixture rather than an accident of it: `padding`,
    `letter-spacing` and `font-weight` all contain a `p`, so a draft of `p` in the rule
    composer narrows the list to almost everything and leaves the `p` rule itself several
    cards down. The old behaviour expanded that card and said "opening it", which is the
    bug this fixture pins the fix for.
  -->
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
    }

    :root {
      --page-ink: #223344;
    }

    h1 {
      letter-spacing: -0.01em;
    }

    section h2 {
      font-weight: 650;
    }

    p {
      line-height: 1.6;
    }

    a:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <main>
    <h1 id="title">A page</h1>
    <section>
      <h2>Section</h2>
      <p id="para" class="article-head">Words.</p>
      <p>More words.</p>
      <a id="link" href="/somewhere">A link</a>
    </section>
  </main>

  <pre id="progress">start</pre>
  <pre id="out">pending</pre>

  <script type="module">
    (async () => {
      const errors = [];
      addEventListener('error', (e) => errors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

      const progress = document.getElementById('progress');
      const step = (name) => { progress.textContent = name; };
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const results = {};

      const { mount } = await import('../dist/html-editor-overlay.js');
      const api = mount({ theme: 'dark', detectScriptContent: false });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      /** Walk shadow roots, since every panel and dialog lives inside the overlay's tree. */
      const deep = (tag, root = document) => {
        const direct = root.querySelector?.(tag);
        if (direct) return direct;
        for (const host of root.querySelectorAll ? root.querySelectorAll('*') : []) {
          if (host.shadowRoot) {
            const found = deep(tag, host.shadowRoot);
            if (found) return found;
          }
        }
        return null;
      };

      /** Whatever really has focus, which is never the shadow host. */
      const activeDeep = () => {
        let el = document.activeElement;
        while (el?.shadowRoot?.activeElement) el = el.shadowRoot.activeElement;
        return el;
      };

      /** Type into a control's real input, the way a user would. */
      const typeInto = async (field, text, host) => {
        const input = field.shadowRoot.querySelector('input');
        input.value = text;
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await field.updateComplete;
        // The host owns the filtered list and re-renders on its own schedule, so waiting only
        // for the field reads the state from before the keystroke.
        if (host) await host.updateComplete;
        await field.updateComplete;
        await frames();
      };
      /** Type into a plain input rendered by a panel or dialog. */
      const typeIntoPlain = async (input, text, host) => {
        input.value = text;
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        if (host) await host.updateComplete;
        await frames();
      };
      const pressOn = async (input, key, host) => {
        input.dispatchEvent(
          new KeyboardEvent('keydown', { key, bubbles: true, composed: true, cancelable: true }),
        );
        if (host) await host.updateComplete;
        await frames();
      };

      const tokPanel = () => deep('heo-tokens-panel');
      const sectionNamed = (heading) =>
        Array.from(tokPanel().shadowRoot.querySelectorAll('heo-section'))
          .find((s) => s.heading === heading);
      const dialog = () => deep('heo-style-dialog');
      const dialogTitle = () =>
        dialog()?.shadowRoot.querySelector('#heo-style-dialog-title')?.textContent.trim() ?? '';
      const dialogLede = () =>
        dialog()?.shadowRoot.querySelector('header p')?.textContent.trim() ?? '';
      const closeDialog = async () => {
        engine.closeStyleEditor();
        await frames();
        await wait(60);
      };

      engine.setDockTab('tokens');
      await frames();
      await wait(150);

      /* ------------------------------------------------------------------ *
       * 1. The reported bug: a filter on the panel hid the class that was
       *    just created, so "Created .new" pointed at nothing on screen.
       * ------------------------------------------------------------------ */
      step('filteredClass');
      engine.classes.upsert({ name: 'article-head', declarations: { 'font-size': '18px' }, origin: 'user' });
      await frames();

      const findField = tokPanel().shadowRoot.querySelector('.find heo-search-field');
      await typeInto(findField, 'art', tokPanel());

      const classes = sectionNamed('Reusable classes');
      const composer = Array.from(classes.querySelectorAll('heo-value-field'))
        .find((f) => f.getAttribute('placeholder') === 'find or create a class');

      results.filteredClass = {
        theFilterIsOn: engine.store.value !== undefined && findField.value === 'art',
        theSectionIsStillThere: Boolean(classes),
        theComposerIsStillThere: Boolean(composer),
      };

      await typeInto(composer, 'new', tokPanel());
      await pressOn(composer.shadowRoot.querySelector('input'), 'Enter', tokPanel());
      await wait(220);
      await frames();

      const cardsIn = (section) =>
        Array.from(section?.querySelectorAll('.cls, .rule') ?? []).map((c) => c.textContent);

      Object.assign(results.filteredClass, {
        theClassWasCreated: Boolean(engine.classes.get('new')),
        /*
         * The assertion that proves this fixture exercises the broken case.
         *
         * Both filters are live — "art" on the panel and "new" in the composer, which is
         * left in the box on purpose — so the intersection is empty and the card the old
         * code expanded is not rendered at all. Without this, every assertion below could
         * pass while the row was sitting visible in the list.
         */
        theRowIsNowhereInTheList: !cardsIn(sectionNamed('Reusable classes'))
          .some((text) => text.includes('new')),
        butTheDialogIsOpen: Boolean(dialog()),
        andItNamesTheClass: dialogTitle() === '.new',
        andItSaysItWasJustCreated: /created/i.test(dialogLede()),
      });

      // Not inside the dock, which is the other half of why this had to be a dialog: the dock
      // clips its descendants and carries a backdrop filter, so it is the containing block for
      // anything fixed inside it.
      results.filteredClass.andItIsNotInsideTheDock =
        dialog()?.getRootNode()?.host?.tagName.toLowerCase() === 'heo-overlay';

      results.filteredClass.andItIsWhollyOnScreen = (() => {
        const box = dialog()?.shadowRoot.querySelector('.dialog')?.getBoundingClientRect();
        if (!box) return false;
        return box.width > 240 && box.height > 100 &&
          box.left >= -1 && box.top >= -1 &&
          box.right <= innerWidth + 1 && box.bottom <= innerHeight + 1;
      })();

      // Opened at the step the composer was always a preamble to, rather than at a close button.
      results.filteredClass.andTheCaretIsInTheAddPropertyField = (() => {
        const focused = activeDeep();
        const wanted = dialog()?.shadowRoot.querySelector('.property-adder .input');
        return Boolean(wanted) && focused === wanted;
      })();

      results.filteredClass.ok = Object.entries(results.filteredClass)
        .every(([, value]) => value === true);

      /* ------------------------------------------------------------------ *
       * 2. Editing works in there, and Done keeps what was typed.
       * ------------------------------------------------------------------ */
      step('editing');
      /*
       * Opened directly if the composer did not open it.
       *
       * Without this, a regression in the wiring above crashes this group on a null dialog and
       * the report is a stack trace instead of a named failing group. The group above already
       * says whether the composer opened it; this one is about what the dialog does.
       */
      if (!dialog()) {
        engine.openStyleEditor('class', 'new', true);
        await frames();
        await wait(80);
      }
      const adderInput = dialog().shadowRoot.querySelector('.property-adder .input');
      await typeIntoPlain(adderInput, 'color', dialog());
      await pressOn(adderInput, 'Enter', dialog());
      await wait(120);
      await frames();

      results.editing = {
        theDeclarationWasAdded: 'color' in (engine.classes.get('new')?.declarations ?? {}),
        andItsFieldTookFocus: (() => {
          const focused = activeDeep();
          const row = dialog()?.shadowRoot.querySelector('heo-value-field[data-property="color"]');
          return Boolean(row) && Boolean(focused) && row.shadowRoot.contains(focused);
        })(),
      };

      // Typed, not blurred: this is a value the user is still in the middle of when they reach
      // for the primary button.
      const colorField = dialog().shadowRoot.querySelector('heo-value-field[data-property="color"]');
      const colorInput = colorField.shadowRoot.querySelector('input[type=text]');
      colorInput.focus();
      colorInput.value = '#ff0055';
      colorInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await colorField.updateComplete;
      await frames();

      results.editing.theFieldStillHadFocusWhenDoneWasPressed =
        colorField.shadowRoot.contains(activeDeep());

      dialog().shadowRoot.querySelector('.done').click();
      await frames();
      await wait(80);

      results.editing.doneClosedTheDialog = !dialog();
      /*
       * A preview writes into the registry too, so reading the value back proves nothing on
       * its own. `cancelPreview` is what tells a committed value from a previewed one: an
       * uncommitted preview still has its pre-edit snapshot behind it and rolls back.
       *
       * This is the assertion behind `HeoValueField.commitNow`. A field commits 120ms after
       * focus leaves it and cancels that timer when it is detached, so Done used to take the
       * dialog away with the typed value still in the draft.
       */
      engine.cancelPreview();
      await frames();
      results.editing.andTheValueTypedIntoItWasKept =
        engine.classes.get('new')?.declarations.color === '#ff0055';
      // And reached CSS, not just the registry object. `getComputedStyle` cannot answer this:
      // nothing on the page wears .new, and a computed colour is never the empty string, so
      // asking the element would have been an assertion that passes whatever happens.
      results.editing.andItReachedTheStylesheet =
        engine.classes.toCSS().includes('#ff0055');

      results.editing.ok = Object.entries(results.editing).every(([, value]) => value === true);

      engine.classes.remove('new');
      await typeInto(findField, '', tokPanel());

      /* ------------------------------------------------------------------ *
       * 3. Submitting a name that already exists opens that one, in the
       *    dialog, rather than making a second or expanding a buried card.
       * ------------------------------------------------------------------ */
      step('existingRule');
      const rules = sectionNamed('CSS rules');
      const ruleField = rules.querySelector('heo-selector-field');
      const before = engine.rules.size;

      await typeInto(ruleField, 'p', tokPanel());
      await pressOn(ruleField.shadowRoot.querySelector('input'), 'Enter', tokPanel());
      await wait(220);
      await frames();

      results.existingRule = {
        thePageAlreadyHadTheRule: engine.rules.get('p')?.origin === 'stylesheet',
        soNoSecondRuleWasMade: engine.rules.size === before,
        theDialogOpenedOnIt: dialogTitle() === 'p',
        andSaysItAlreadyHadOne: /already had a rule/i.test(dialogLede()),
        // The other half of the report: even unfiltered the card is not where the eye is. A
        // draft of "p" matches padding, letter-spacing and line-height as well as the
        // selector, so the rule submitted lands several cards down its own list.
        andTheCardIsNotFirstInTheList: (() => {
          const cards = cardsIn(sectionNamed('CSS rules'));
          const at = cards.findIndex((text) => text.trim().startsWith('p'));
          return { cards: cards.length, indexOfP: at, buried: at > 0 };
        })(),
        // A rule reaches the page by matching, so the dialog says how much it is reaching.
        andSaysWhatItMatches:
          dialog()?.shadowRoot.querySelector('.tally')?.textContent.trim() === '2×',
      };
      results.existingRule.ok =
        results.existingRule.thePageAlreadyHadTheRule &&
        results.existingRule.soNoSecondRuleWasMade &&
        results.existingRule.theDialogOpenedOnIt &&
        results.existingRule.andSaysItAlreadyHadOne &&
        results.existingRule.andTheCardIsNotFirstInTheList.buried &&
        results.existingRule.andSaysWhatItMatches;

      /* ------------------------------------------------------------------ *
       * 4. A dialog opened from inside this one lands on top of it.
       *
       *    The declaration list offers "Paste CSS", so that dialog is reachable
       *    from in here and would be invisible behind this one if the z-order
       *    were the other way round.
       * ------------------------------------------------------------------ */
      step('layering');
      const pasteButton = Array.from(dialog().shadowRoot.querySelectorAll('button'))
        .find((b) => /paste css/i.test(b.textContent));
      const styleZ = Number(getComputedStyle(dialog()).zIndex);
      pasteButton?.click();
      await frames();
      await wait(80);
      const pasteDialog = deep('heo-css-paste-dialog');

      results.layering = {
        theStyleDialogIsStillOpen: Boolean(dialog()),
        thePasteDialogOpened: Boolean(pasteDialog),
        andItSitsAboveThisOne: Boolean(pasteDialog) &&
          Number(getComputedStyle(pasteDialog).zIndex) > styleZ,
      };
      results.layering.ok = Object.entries(results.layering).every(([, v]) => v === true);
      engine.cancelCssPaste?.();
      await frames();

      /* ------------------------------------------------------------------ *
       * 5. Escape is a way out, and it does not reach past the dialog.
       * ------------------------------------------------------------------ */
      step('escape');
      if (!dialog()) engine.openStyleEditor('rule', 'p', false);
      await frames();
      await wait(80);
      api.select(document.getElementById('para'));
      await frames();
      const selectedBefore = engine.selected;

      dialog().shadowRoot.querySelector('.dialog').dispatchEvent(
        new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }),
      );
      await frames();
      await wait(80);

      results.escape = {
        itClosedTheDialog: !dialog(),
        // The engine reads Escape as "deselect" from its own capture handler, so the dialog has
        // to stop it: closing a dialog is not a request to change what is selected.
        andLeftTheSelectionAlone: engine.selected === selectedBefore,
      };
      results.escape.ok = Object.entries(results.escape).every(([, v]) => v === true);

      /* ------------------------------------------------------------------ *
       * 6. Nothing is left behind: no dialog, no modal scroll lock.
       * ------------------------------------------------------------------ */
      step('cleanup');
      await closeDialog();
      results.cleanup = {
        noDialogRemains: !dialog(),
        thePageScrollsAgain: !document.documentElement.hasAttribute('data-heo-modal'),
        ok: true,
      };
      results.cleanup.ok =
        results.cleanup.noDialogRemains && results.cleanup.thePageScrollsAgain;

      /*
       * The roll-up is computed from the groups rather than listed, so a group added later
       * cannot be silently left out of the verdict.
       */
      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => group.ok !== true)
        .map(([name]) => name);
      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify(
        { ok: failed.length === 0, failed, ...results, errors }, null, 1,
      ) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:{"ok":false,"__fatal":' + JSON.stringify(String((e && e.stack) || e)) + '}:END';
    });
  </script>
</body>

</html>
