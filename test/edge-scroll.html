<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scrolling to the rest of the page during a drag</title>
  <style>
    body { margin: 0; overflow-x: hidden; font-family: system-ui, sans-serif; }
    #stack { padding: 8px; }
    #stack > div { height: 40px; background: #eef; margin-bottom: 6px; }
    /*
     * Long enough that a pointer held at the edge through all three gears still has road ahead
     * of it. Ten seconds of holding covers something like eighty thousand pixels, so this leaves
     * room to spare rather than measuring a hold that quietly ran out of page.
     */
    #filler { height: 160000px; background: linear-gradient(#fff, #dfe); }
    #panel { height: 200px; overflow: auto; border: 2px solid #99a; margin: 8px; }
    #panel > div { height: 1400px; background: linear-gradient(#ffe, #fdd); }
    pre { margin: 0; }
  </style>
</head>
<body>
  <section id="stack">
    <div id="i1">One</div>
    <div id="i2">Two</div>
    <div id="i3">Three</div>
  </section>
  <div id="filler">A long way down</div>
  <div id="panel"><div>Inside a scrolling panel</div></div>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const errors = [];
      window.addEventListener('error', (e) => errors.push('error: ' + e.message));
      window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + e.reason));
      const results = {};
      const check = async (name, fn) => {
        document.getElementById('progress').textContent = name;
        try { results[name] = await fn(); }
        catch (err) { results[name] = 'THREW: ' + String(err && err.message); }
      };
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const byId = (id) => document.getElementById(id);

      const api = window.HtmlEditorOverlay.mount({ theme: 'dark' });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      const item = byId('i2');
      /*
       * Parked horizontally centred and far below the dragged element's own siblings, so the
       * drop plan plans nothing and the only thing moving is the scroll position. A reorder
       * mid-measurement would change the page height under the numbers being compared.
       */
      const middleX = () => Math.round(innerWidth / 2);
      const bottom = (inset) => ({ x: middleX(), y: innerHeight - inset });

      /**
       * Hold the pointer at one spot for a while and report how far the page travelled.
       *
       * The spot is re-derived and re-reported as the hold runs, because it is expressed
       * relative to the viewport and the viewport is not guaranteed to stay the same size. A
       * y of `innerHeight - 2` captured once became a y *past* the bottom of a viewport that
       * later shrank, which the drag reads as the pointer having left the window — the cancel
       * gesture — so the dwell kept being thrown away and the speed never built. A real pointer
       * reports where it is against the window as it stands, and so does this.
       */
      const holdAt = async (spot, ms) => {
        const from = scrollY;
        const report = () => { const p = spot(); engine.updateDrag(p.x, p.y); };
        report();
        const ticking = setInterval(report, 80);
        await wait(ms);
        clearInterval(ticking);
        return scrollY - from;
      };
      const beginDrag = async (spot) => {
        scrollTo({ top: 0, behavior: 'instant' });
        await frames();
        engine.startDrag(item, spot.x, spot.y);
        engine.updateDrag(spot.x, spot.y);
        await frames();
      };

      /* ------------------------------------------------------------------ *
       * Holding at the bottom edge brings the rest of the page up.
       * ------------------------------------------------------------------ */
      await beginDrag(bottom(6));
      await check('holdingAtTheBottomEdgeScrollsDown', async () => {
        const moved = await holdAt(() => bottom(6), 500);
        return { moved: Math.round(moved), scrolled: moved > 200 };
      });

      /* ------------------------------------------------------------------ *
       * Slow to begin with, faster the longer it is held.
       * ------------------------------------------------------------------ */
      await check('itStartsSlowAndBuildsUp', async () => {
        engine.cancelDrag();
        await beginDrag(bottom(6));
        const first = await holdAt(() => bottom(6), 260);
        const later = await holdAt(() => bottom(6), 260);
        return {
          first: Math.round(first),
          later: Math.round(later),
          acceleratesWhileHeld: later > first * 1.3,
        };
      });

      /* ------------------------------------------------------------------ *
       * Deeper into the band is faster, which is what makes it aimable.
       * ------------------------------------------------------------------ */
      await check('deeperIntoTheBandIsFaster', async () => {
        const band = Math.max(44, Math.min(140, innerHeight * 0.14));
        engine.cancelDrag();
        // Just inside the band, from a cold start.
        await beginDrag(bottom(Math.round(band) - 4));
        const shallow = await holdAt(() => bottom(Math.round(band) - 4), 420);
        engine.cancelDrag();
        // Right at the edge, from an equally cold start, for the same time.
        await beginDrag(bottom(2));
        const deep = await holdAt(() => bottom(2), 420);
        return {
          shallow: Math.round(shallow),
          deep: Math.round(deep),
          deeperIsFaster: deep > shallow * 2,
          shallowIsGentle: shallow < innerHeight,
        };
      });

      /* ------------------------------------------------------------------ *
       * Held against the edge for seconds, it keeps building well past full speed.
       * ------------------------------------------------------------------ */
      /**
       * Watch one unbroken hold and report how far the page moved in two windows of it.
       *
       * Observed rather than re-reported: reporting the pointer again mid-hold restarts the
       * dwell, and the dwell is the thing being measured. One press, then hands off.
       */
      const travelDuring = async (spot, windows) => {
        engine.cancelDrag();
        await beginDrag(spot);
        const began = performance.now();
        const marks = [];
        await new Promise((done) => {
          const sample = () => {
            marks.push({ at: performance.now() - began, y: scrollY });
            if (marks[marks.length - 1].at > windows[windows.length - 1][1] + 40) done();
            else requestAnimationFrame(sample);
          };
          requestAnimationFrame(sample);
        });
        const at = (ms) => {
          let best = marks[0];
          for (const mark of marks) if (Math.abs(mark.at - ms) < Math.abs(best.at - ms)) best = mark;
          return best.y;
        };
        return windows.map(([from, to]) => Math.round(at(to) - at(from)));
      };

      await check('eachThreeSecondsHeldRoughlyDoublesTheSpeed', async () => {
        /*
         * One window per gear, each sampled after that gear has finished arriving: just past the
         * warm-up, then past three, six and nine seconds.
         */
        const [base, first, second, third] = await travelDuring(bottom(2), [
          [1000, 1600], [3000, 3600], [6000, 6600], [9000, 9600],
        ]);
        engine.cancelDrag();
        const step = (a, b) => Number((b / Math.max(a, 1)).toFixed(2));
        return {
          afterWarmup: base,
          afterThree: first,
          afterSix: second,
          afterNine: third,
          gearRatios: [step(base, first), step(first, second), step(second, third)],
          eachGearIsFaster: first > base * 2 && second > first * 1.6 && third > second * 1.6,
        };
      });

      /*
       * And the ramp has no step in it. Sampled densely across the two gear changes, the speed
       * from one window to the next never jumps — a boundary with a kink would show up here as a
       * sudden change between neighbouring samples.
       */
      await check('andTheGearChangesHaveNoLurchInThem', async () => {
        const windows = [];
        for (let at = 2200; at <= 7000; at += 400) windows.push([at, at + 400]);
        const travel = await travelDuring(bottom(2), windows);
        engine.cancelDrag();
        let worst = 1;
        for (let i = 1; i < travel.length; i += 1) {
          const ratio = travel[i] / Math.max(travel[i - 1], 1);
          if (ratio > worst) worst = ratio;
        }
        return {
          samples: travel,
          worstStepBetweenNeighbours: Number(worst.toFixed(2)),
          // Speed rises throughout, so some growth is expected; a lurch would be far larger.
          noLurch: worst < 1.6,
        };
      });

      // The reward is for holding at the *edge*: resting in the shallows does not earn it.
      await check('butAShallowHoldDoesNotEarnIt', async () => {
        const band = Math.round(Math.max(44, Math.min(140, innerHeight * 0.14)));
        const [settled, sustained] = await travelDuring(bottom(band - 6), [[1000, 1600], [3000, 3600]]);
        engine.cancelDrag();
        return {
          inTheSecondAfterWarmup: settled,
          inTheSecondAfterThree: sustained,
          staysGentle: sustained < Math.max(settled, 1) * 2,
        };
      });

      /* ------------------------------------------------------------------ *
       * Holding at the top edge brings it back.
       * ------------------------------------------------------------------ */
      await check('holdingAtTheTopEdgeScrollsUp', async () => {
        engine.cancelDrag();
        scrollTo({ top: 2500, behavior: 'instant' });
        await frames();
        engine.startDrag(item, middleX(), 6);
        engine.updateDrag(middleX(), 6);
        const moved = await holdAt(() => ({ x: middleX(), y: 6 }), 420);
        return { moved: Math.round(moved), scrolledUp: moved < 0 };
      });

      /* ------------------------------------------------------------------ *
       * What must not scroll.
       * ------------------------------------------------------------------ */
      await check('theMiddleOfTheScreenScrollsNothing', async () => {
        engine.cancelDrag();
        await beginDrag({ x: middleX(), y: Math.round(innerHeight / 2) });
        const moved = await holdAt(() => ({ x: middleX(), y: Math.round(innerHeight / 2) }), 420);
        return Math.round(moved);
      });

      // Leaving the window is the cancel gesture, so it must not also scroll.
      await check('andLeavingTheWindowScrollsNothing', async () => {
        engine.cancelDrag();
        await beginDrag(bottom(6));
        await wait(200);
        const from = scrollY;
        engine.updateDrag(middleX(), innerHeight + 40);
        await wait(400);
        return { moved: Math.round(scrollY - from), willCancel: engine.store.value.drag?.willCancel ?? null };
      });

      // And the edge itself is not read as having left the window any more.
      await check('butTheEdgeItselfIsNotACancel', async () => {
        engine.cancelDrag();
        await beginDrag(bottom(1));
        await wait(120);
        return engine.store.value.drag?.willCancel ?? null;
      });

      /* ------------------------------------------------------------------ *
       * It stops when the gesture does, and at the end of the page.
       * ------------------------------------------------------------------ */
      await check('releasingStopsIt', async () => {
        engine.cancelDrag();
        await beginDrag(bottom(6));
        await wait(300);
        engine.endDrag();
        await frames();
        const from = scrollY;
        await wait(400);
        return { movedAfterRelease: Math.round(scrollY - from) };
      });

      await check('andTheEndOfThePageIsNotAProblem', async () => {
        engine.cancelDrag();
        engine.startDrag(item, middleX(), innerHeight - 4);
        engine.updateDrag(middleX(), innerHeight - 4);
        await frames();
        /*
         * Measured after the drag has begun, not before. Starting one restyles the element it
         * picks up, which changes the page's height and clamps the scroll position — a shift
         * that has nothing to do with this and reads as a few pixels of phantom travel.
         */
        scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' });
        await frames();
        const atEnd = scrollY;
        await wait(400);
        const moved = Math.round(scrollY - atEnd);
        const survived = Boolean(engine.store.value.drag);
        engine.cancelDrag();
        return { moved, wentNoFurther: moved <= 0, stillDragging: survived };
      });

      /* ------------------------------------------------------------------ *
       * A scrolling panel under the pointer takes precedence over the page.
       * ------------------------------------------------------------------ */
      await check('aPanelUnderThePointerScrollsInsteadOfThePage', async () => {
        engine.cancelDrag();
        const panel = byId('panel');
        panel.scrollTop = 0;
        // Put the panel's lower edge inside the bottom band, with the page able to scroll too.
        panel.scrollIntoView({ block: 'end', behavior: 'instant' });
        await frames();
        const box = panel.getBoundingClientRect();
        const spot = { x: Math.round(box.left + box.width / 2), y: Math.round(box.bottom - 6) };
        if (spot.y < innerHeight - Math.max(44, innerHeight * 0.14)) return 'panel not in the band';
        engine.startDrag(item, spot.x, spot.y);
        engine.updateDrag(spot.x, spot.y);
        // Again after the drag's own restyle has settled, so the baseline is a real one.
        await frames();
        const pageFrom = scrollY;
        await wait(500);
        /*
         * Compared against each other rather than asking the page to be perfectly still. The
         * drop preview's reflow animates for a moment and nudges the page's height, so a few
         * pixels of drift are not this feature at work; the panel outrunning the page by an
         * order of magnitude is.
         */
        const result = {
          panelTravel: Math.round(panel.scrollTop),
          pageDrift: Math.round(scrollY - pageFrom),
          panelScrolled: panel.scrollTop > 40,
          andTookPrecedenceOverThePage: panel.scrollTop > Math.abs(scrollY - pageFrom) * 3,
        };
        engine.cancelDrag();
        return result;
      });

      results.__errors = errors;
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify(results, null, 1) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:{"__errors":["' + String(e && e.message) + '"]}:END';
    });
  </script>
</body>
</html>
