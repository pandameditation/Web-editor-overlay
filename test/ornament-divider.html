<html lang="en">

<head>
  <meta charset="utf-8">
  <title>The ornamental divider block</title>
  <style>
    body {
      margin: 0;
      padding: 80px 20px 20px;
      font-family: system-ui, sans-serif;
      color: #101828;
      background: #fff;
    }

    .stage {
      width: 520px;
      padding: 16px 20px;
    }

    /*
     * A surface with no single background colour.
     *
     * The technique this block deliberately avoids paints an opaque rectangle behind the
     * ornament to hide the line crossing it, filled with the page's background colour. There is
     * no such colour here, so anything relying on one would show a pale smear across the rule.
     * Keeping the fixture's stage busy is what makes the "nothing paints a background"
     * assertions below mean something.
     */
    #busy {
      background:
        radial-gradient(120% 90% at 30% 0%, #fde68a, transparent),
        repeating-linear-gradient(115deg, #c7d2fe 0 18px, #a5b4fc 18px 36px);
    }
  </style>
</head>

<body>
  <main>
    <p id="anchor">A page with something to divide.</p>
  </main>
  <!-- One divider per bay, so "the divider in here" is never ambiguous. -->
  <div class="stage" id="busy"></div>
  <div class="stage" id="bay-props"></div>
  <div class="stage" id="bay-colour"></div>
  <div class="stage" id="bay-bare"></div>
  <div class="stage" id="bay-edit"></div>
  <div class="stage" id="bay-undo"></div>

  <div id="report">
    <pre id="progress">start</pre>
    <pre id="out">pending</pre>
  </div>

  <script type="module">
    (async () => {
      const errors = [];
      addEventListener('error', (e) => errors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

      const progress = document.getElementById('progress');
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const results = {};

      const { mount } = await import('../dist/html-editor-overlay.js');
      const api = mount({ theme: 'dark', detectScriptContent: false });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      const cs = (el) => getComputedStyle(el);
      const partsOf = (el) => [...el.querySelectorAll(':scope > span')];
      /** Distance between the two line segments: the glyph's own width, or zero without one. */
      const breakWidth = (el) => {
        const p = partsOf(el);
        return Math.round((p[2].getBoundingClientRect().left - p[0].getBoundingClientRect().right) * 10) / 10;
      };

      const block = engine.library.get('ornament-divider');

      /* ------------------------------------------------------------------ *
       * 1. In the catalogue, alongside the plain rule rather than instead of it.
       * ------------------------------------------------------------------ */
      results.catalogue = {
        inTheLibrary: Boolean(block),
        isAPreset: block?.origin === 'preset',
        // Props are what make the insert menu offer a form instead of inserting blind.
        offersEveryKnob: ['ornament', 'size', 'thickness', 'lineStyle', 'colour']
          .every((name) => Boolean(block?.props?.[name])),
        // A colour prop restricted to colour tokens, so the picker offers the palette.
        colourPicksFromTheColourTokens:
          block?.props?.colour?.type === 'token' && block?.props?.colour?.tokenGroup === 'color',
        // A length like `1px` fails the token validator, so these have to be text props or
        // they would arrive empty. Getting this wrong renders a borderless divider.
        lengthsAreTextProps:
          block?.props?.thickness?.type === 'text' && block?.props?.size?.type === 'text',
        lineStyleIsAChoice: block?.props?.lineStyle?.type === 'select',
        // A preset is rebuilt from code, so it never travels in a seed.
        excludedFromTheSeed: !engine.library.export().some((b) => b.id === 'ornament-divider'),
        // This is a sibling of the plain divider, not a replacement for it.
        plainDividerUntouched: Boolean(engine.library.get('divider')),
      };
      results.catalogue.ok = Object.values(results.catalogue).every(Boolean);

      /** Insert into a bay and hand back the placed node. */
      const place = async (into, props) => {
        const el = await engine.insertBlock(block, props, {
          reference: document.getElementById(into),
          position: 'lastChild',
        });
        await frames();
        return el;
      };

      /* ------------------------------------------------------------------ *
       * 2. What arrives on the page, on a surface with no background colour.
       * ------------------------------------------------------------------ */
      progress.textContent = 'inserting';
      const placed = await place('busy', {});
      const parts = placed ? partsOf(placed) : [];

      results.markup = {
        placed: Boolean(placed),
        // Not an <hr>: a rule with something inside it cannot be a void element.
        keepsSeparatorSemantics: placed?.getAttribute('role') === 'separator',
        threeParts: parts.length === 3,
        // Decoration on top of a real separator, so it stays out of the accessibility tree.
        ornamentIsHiddenFromScreenReaders: parts[1]?.getAttribute('aria-hidden') === 'true',
        ornamentIsRealText: parts[1]?.textContent === '❧',
        /*
         * The gotcha, asserted directly.
         *
         * Every part has to be transparent. The moment any of them paints a background, this
         * block has gone back to hiding the line behind an opaque patch and has acquired a
         * colour it must keep in step with the page -- which is the bug this design exists to
         * avoid, and which only shows up on surfaces like this fixture's stage.
         */
        nothingPaintsABackground: parts.every(
          (p) => cs(p).backgroundImage === 'none' &&
            /rgba\(0, 0, 0, 0\)|transparent/.test(cs(p).backgroundColor),
        ),
        /*
         * The fades are the mechanism, so a stripped mask is a silent regression: the rule
         * would butt straight up against the glyph and an empty ornament would leave a hole.
         */
        bothSegmentsFade:
          cs(parts[0]).maskImage !== 'none' && cs(parts[2]).maskImage !== 'none',
        // Written twice, because Safari wanted the prefix until 15.4.
        carriesTheWebkitPrefix: (parts[0]?.getAttribute('style') ?? '').includes('-webkit-mask'),
        // Registered as an instance, which is what gives it a Component form to edit later.
        isABlockInstance: Boolean(engine.blockInstance(placed)),
      };
      results.markup.ok = Object.values(results.markup).every(Boolean);

      /* ------------------------------------------------------------------ *
       * 3. Every knob reaches the property it drives.
       * ------------------------------------------------------------------ */
      progress.textContent = 'props';
      const configured = await place('bay-props', {
        ornament: '✦',
        size: '34px',
        thickness: '3px',
        lineStyle: 'dashed',
      });
      const cparts = partsOf(configured);
      results.props = {
        ornamentLanded: cparts[1].textContent === '✦',
        sizeLanded: cs(cparts[1]).fontSize === '34px',
        thicknessLanded: cs(cparts[0]).borderTopWidth === '3px',
        lineStyleLanded: cs(cparts[0]).borderTopStyle === 'dashed',
        /*
         * One field scales the glyph and the room around it together.
         *
         * The container's font-size *is* the ornament size, which is what lets the masked
         * breathing room be expressed in `em` and follow the glyph without a second field to
         * keep in step. If this ever stops matching, a big fleuron gets a small opening.
         */
        sizeDrivesTheContainer: cs(configured).fontSize === '34px',
        // Both segments are styled alike; a rule that thickens on one side only is broken.
        segmentsMatch:
          cs(cparts[0]).borderTopWidth === cs(cparts[2]).borderTopWidth &&
          cs(cparts[0]).borderTopStyle === cs(cparts[2]).borderTopStyle,
      };
      results.props.ok = Object.values(results.props).every(Boolean);

      /* ------------------------------------------------------------------ *
       * 3b. One colour field, reaching the rule and the ornament alike.
       *
       * Declared once on the container and inherited through `currentColor`, so the two cannot
       * drift apart the way two substituted copies of one value could.
       * ------------------------------------------------------------------ */
      progress.textContent = 'colour';
      const tinted = await place('bay-colour', { ornament: '◆', colour: 'rgb(180, 40, 90)' });
      const tparts = partsOf(tinted);
      const wanted = 'rgb(180, 40, 90)';
      results.colour = {
        ornamentTakesIt: cs(tparts[1]).color === wanted,
        leftSegmentTakesIt: cs(tparts[0]).borderTopColor === wanted,
        rightSegmentTakesIt: cs(tparts[2]).borderTopColor === wanted,
        // The point of the field: one value, one mark, no way to set half of it.
        ruleAndOrnamentAgree: cs(tparts[0]).borderTopColor === cs(tparts[1]).color,
        // Declared in one place, which is also where the Styles panel edits it afterwards.
        declaredOnceOnTheContainer:
          (tinted.getAttribute('style') ?? '').includes('color:rgb(180, 40, 90)') &&
          !(tparts[0].getAttribute('style') ?? '').includes('rgb(180, 40, 90)'),
        // A token reaches it too, which is what the restricted picker hands over.
        acceptsAToken: false,
      };
      const tokened = await place('bay-colour', { ornament: '◆', colour: 'var(--brand, #0a7)' });
      results.colour.acceptsAToken =
        cs(partsOf(tokened)[0]).borderTopColor === cs(partsOf(tokened)[1]).color &&
        cs(partsOf(tokened)[1]).color !== 'rgb(0, 0, 0)';
      results.colour.ok = Object.values(results.colour).every(Boolean);

      /* ------------------------------------------------------------------ *
       * 4. No ornament means a plain rule, not a rule with a hole in it.
       *
       * The reason the breathing room is a mask rather than a gap: a gap is reserved whether
       * or not there is a glyph to sit in it, so clearing the field would leave a visible
       * break. A mask costs no layout, so the two segments meet.
       * ------------------------------------------------------------------ */
      progress.textContent = 'empty ornament';
      const bare = await place('bay-bare', { ornament: '' });
      results.emptyOrnament = {
        ornamentIsEmpty: partsOf(bare)[1].textContent === '',
        segmentsMeet: breakWidth(bare) === 0,
        // The same measurement with a glyph, so this is a contrast and not a constant.
        aGlyphStillSeparatesThem: breakWidth(placed) > 0,
        // Still a separator, and still fading, with nothing in the middle.
        stillASeparator: bare.getAttribute('role') === 'separator',
        stillFades: cs(partsOf(bare)[0]).maskImage !== 'none',
      };
      results.emptyOrnament.ok = Object.values(results.emptyOrnament).every(Boolean);

      /* ------------------------------------------------------------------ *
       * 5. Changing a prop afterwards, through the Component form.
       * ------------------------------------------------------------------ */
      progress.textContent = 'editing after insert';
      const toEdit = await place('bay-edit', { ornament: '❧' });
      await engine.setBlockProp(toEdit, 'ornament', '◆');
      await frames();
      await wait(120);
      // Re-queried: a template block's prop change re-renders it and swaps the node, so the
      // reference from before the edit is stale.
      const swapped = document.getElementById('bay-edit').firstElementChild;
      results.editingAfterInsert = {
        glyphChanged: partsOf(swapped)[1]?.textContent === '◆',
        stillAnInstance: Boolean(engine.blockInstance(swapped)),
        remembersTheNewValue: engine.blockInstance(swapped)?.values?.ornament === '◆',
        /*
         * And still findable by block id, which is the half that is easy to lose.
         *
         * The swap rebuilds the node from the template, and the template carries no marker of
         * its own -- that is applied when an instance is linked. Re-rendering without
         * re-applying it left an element the props panel went on editing quite happily while
         * every DOM-side answer had lost it: `blockInstances` returned nothing, the library's
         * usage count stopped counting it, and a later template change skipped it. Nothing
         * looked wrong, which is why it needs an assertion rather than an eye.
         */
        stillFindableById: engine.blockInstances('ornament-divider').includes(swapped),
        // The re-render has to bring the fades back with it.
        keepsItsFades: cs(partsOf(swapped)[0]).maskImage !== 'none',
      };
      results.editingAfterInsert.ok = Object.values(results.editingAfterInsert).every(Boolean);

      /* ------------------------------------------------------------------ *
       * 6. Export, on both design-system targets.
       *
       * The whole look is inline for one reason: a block's `css` goes into a generated
       * stylesheet that the export deletes when the design system is being written to a file
       * instead of into the document. Styling this block from a rule would look right until
       * somebody saved with that target chosen, so both are asserted here.
       * ------------------------------------------------------------------ */
      progress.textContent = 'export';
      const survives = (html) => {
        const parsed = new DOMParser().parseFromString(html, 'text/html');
        const el = parsed.querySelector('[role="separator"]');
        const span = el?.querySelector(':scope > span');
        return Boolean(el) && (span?.getAttribute('style') ?? '').includes('mask');
      };
      results.export = {
        survivesDocumentTarget: survives(engine.exportHTML({ designSystemInDocument: true })),
        survivesStylesheetTarget: survives(engine.exportHTML({ designSystemInDocument: false })),
        // Nothing to lose in the first place: the block registers no CSS at all.
        registersNoStylesheet: !engine.library.css.includes('ornament-divider'),
      };
      results.export.ok = Object.values(results.export).every(Boolean);

      /* ------------------------------------------------------------------ *
       * 7. One insert, one undo.
       * ------------------------------------------------------------------ */
      progress.textContent = 'undo';
      const bay = document.getElementById('bay-undo');
      await place('bay-undo', {});
      const oneAfterInserting = bay.querySelectorAll('[data-heo-block="ornament-divider"]').length === 1;
      engine.undo();
      await frames();
      results.undo = {
        oneAfterInserting,
        noneAfterUndoing: bay.querySelectorAll('[data-heo-block="ornament-divider"]').length === 0,
        bayIsEmptyAgain: bay.children.length === 0,
      };
      results.undo.ok = Object.values(results.undo).every(Boolean);

      const failed = Object.entries(results)
        .filter(([, value]) => value && typeof value === 'object' && value.ok === false)
        .map(([key]) => key);

      progress.textContent = 'done';
      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify(
        { ok: failed.length === 0, failed, ...results, errors }, null, 1,
      ) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:{"ok":false,"__fatal":' + JSON.stringify(String((e && e.stack) || e)) + '}:END';
    });
  </script>
</body>

</html>
