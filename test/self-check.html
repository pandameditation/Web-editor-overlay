      await frame();
      check('onlyOneListStaysOpen', () => openLists());
      dockEl().shadowRoot.querySelector('.tabs').dispatchEvent(
        new PointerEvent('pointerdown', { bubbles: true, composed: true, cancelable: true }),
      );
      await frame();
      check('pressElsewhereClosesTheList', () => openLists());

      /* ------------------------------------------------------------------ *
       * Undo reaches a value field that still has the caret.
       * ------------------------------------------------------------------ */
      engine.history.clear();
      const k1 = document.getElementById('k1');
      api.select(k1);
      await frame();
      // Last match: a set property also appears in the Set section, and that row goes
      // away with the declaration itself. The grouped section's row is the one that
      // stays put whatever the value does.
      const keyRow = (property) =>
        Array.from(dockPanel('styles').shadowRoot.querySelectorAll('.row'))
          .filter((r) => r.dataset.property === property).pop();
      engine.setStyle('font-size', '30px', k1);
      await frame();
      // Successive edits to one property merge into a single undo step by design.
      await wait(2600);
      const fsField = keyRow('font-size').querySelector('heo-value-field');
      const fsInput = fsField.shadowRoot.querySelector('input[type=text]');
      fsInput.focus();
      fsInput.value = '';
      fsInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      press(fsInput, 'Enter');
      await wait(90);
      check('clearingRemovesTheDeclaration', () => JSON.stringify(k1.style.fontSize));
      press(fsInput, 'z', { metaKey: true });
      await wait(140);
      await frame();
      check('undoFromInsideAFieldRestoresThePage', () => k1.style.fontSize);
      check('undoRefreshesTheFocusedField', () => {
        const field = keyRow('font-size').querySelector('heo-value-field');
        return `${field.value} / ${field.shadowRoot.querySelector('input[type=text]').value}`;
      });

      /*
       * The other half of undo-in-a-field: while an edit is still uncommitted, undo
       * belongs to the box, not to the page.
       *
       * A live preview is painted onto the style attribute, so the panel's own read of
       * the cascade used to hand the half-typed text back to the row as its committed
       * value. Two things followed. The field could not tell it held an uncommitted
       * edit, so Mod+Z reached past it and undid whatever the user had done before —
       * from the user's seat, typing in the panel changed something else on the page.
       * And the commit that followed compared equal and did nothing at all.
       */
      await wait(2600);
      engine.setStyle('letter-spacing', '3px', k1);
      await frame();
      const liveDepth = engine.history.size;
      const liveField = keyRow('font-size').querySelector('heo-value-field');
      const liveInput = liveField.shadowRoot.querySelector('input[type=text]');
      liveInput.focus();
      liveInput.value = '99px';
      liveInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      check('aFieldKeepsItsCommittedValueWhilePreviewing', () => liveField.value);
      check('anUncommittedFieldSaysSo', () => liveField.hasAttribute('data-heo-dirty'));
      check('thePreviewStillReachesThePage', () => getComputedStyle(k1).fontSize);
      press(liveInput, 'z', { metaKey: true });
      await wait(140);
      check('undoLeavesPageHistoryAloneWhilePreviewing', () => engine.history.size === liveDepth);
      check('undoWhilePreviewingTouchesNothingElse', () => k1.style.letterSpacing);
      // And the commit still lands, which it did not while the preview echoed back.
      press(liveInput, 'Enter');
      await wait(120);
      check('committingAPreviewedValueLands', () => k1.style.fontSize);
      check('committingClearsTheUncommittedMark', () => {
        const field = keyRow('font-size').querySelector('heo-value-field');
        return !field.hasAttribute('data-heo-dirty');
      });

      /*
       * Undo and redo have to be mirrors, at any depth.
       *
       * They both used to discard an in-flight preview *and* move through history, so
       * one press changed two things while the press back could only restore one —
       * "undo twice, redo twice" did not land where it started. An unfinished edit is
       * now a step of its own.
       */
      engine.history.clear();
      k1.removeAttribute('style');
      await frame();
      const styleOf = () => k1.getAttribute('style') || '';
      const commitRow = async (property, text) => {
        const input = keyRow(property).querySelector('heo-value-field')
          .shadowRoot.querySelector('input[type=text]');
        input.focus();
        input.value = text;
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await frame();
        press(input, 'Enter');
        await wait(140);
        await frame();
      };
      const deepSteps = [['font-size', '14px'], ['letter-spacing', '2px'], ['opacity', '0.5']];
      for (const [p, v] of deepSteps) { await commitRow(p, v); await wait(2600); }
      const allThree = styleOf();
      check('threeEditsAreThreeSteps', () => engine.history.size === 3);
      const unwound = [];
      for (let i = 0; i < 3; i += 1) { engine.undo(); await frame(); unwound.push(styleOf()); }
      check('undoUnwindsOneStepAtATime', () => unwound.join(' | '));
      const replayed = [];
      for (let i = 0; i < 3; i += 1) { engine.redo(); await frame(); replayed.push(styleOf()); }
      check('redoReplaysOneStepAtATime', () => replayed.join(' | '));
      check('undoThenRedoLandsWhereItStarted', () => styleOf() === allThree);
      // Again, to prove a round trip does not consume the stack.
      for (let i = 0; i < 3; i += 1) { engine.undo(); await frame(); }
      for (let i = 0; i < 3; i += 1) { engine.redo(); await frame(); }
      check('theRoundTripIsRepeatable', () => styleOf() === allThree);

      /* An edit still being typed is the step undo takes back, on its own. */
      engine.history.clear();
      k1.removeAttribute('style');
      await frame();
      await commitRow('font-size', '12px');
      await wait(2600);
      const pending = keyRow('letter-spacing').querySelector('heo-value-field');
      const pendingInput = pending.shadowRoot.querySelector('input[type=text]');
      pendingInput.focus();
      pendingInput.value = '77px';
      pendingInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      check('theUnfinishedEditIsOnThePage', () => styleOf());
      engine.undo();
      await frame();
      check('undoTakesBackOnlyTheUnfinishedEdit', () => styleOf());
      check('undoKeepsTheHistoryStepForLater', () => engine.history.size === 1);
      check('theFieldLetsGoOfTheDiscardedDraft', () =>
        `${JSON.stringify(pendingInput.value)} dirty=${pending.hasAttribute('data-heo-dirty')}`);
      engine.undo();
      await frame();
      check('theNextUndoReachesTheCommittedStep', () => styleOf());
      engine.redo();
      await frame();
      check('redoMirrorsThatUndoExactly', () => styleOf());

      /*
       * Emptying a field is not, by itself, a request to remove the declaration.
       *
       * Backspacing the last character out of a row under "Set on this element" used
       * to delete the row on the spot: the preview is painted onto the style attribute,
       * so an empty field read back as "this element sets nothing", the row lost its
       * inline origin and was dropped from the section mid-keystroke — taking the caret
       * with it, and taking the value being replaced with it too. Removal now waits for
       * the empty value to actually be committed, which is to say for focus to leave.
       */
      engine.history.clear();
      const styleBeforeEmptying = k1.getAttribute('style');
      engine.setStyle('opacity', '0.4', k1);
      await frame();
      await wait(140);
      const setSection = () =>
        Array.from(dockPanel('styles').shadowRoot.querySelectorAll('heo-section'))
          .find((s) => s.heading === 'Set on this element');
      const setRows = () =>
        Array.from(setSection()?.querySelectorAll('.rows .row') ?? []).map((r) => r.dataset.property);
      const setRowField = (property) =>
        Array.from(setSection()?.querySelectorAll('.rows .row') ?? [])
          .find((r) => r.dataset.property === property)
          ?.querySelector('heo-value-field');
      check('theSetSectionListsTheDeclaration', () => setRows().join(','));
      const emptied = setRowField('opacity');
      const emptiedInput = emptied.shadowRoot.querySelector('input[type=text]');
      emptiedInput.focus();
      emptiedInput.value = '';
      emptiedInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await wait(140);
      await frame();
      check('emptyingAFieldKeepsItsRow', () => setRows().includes('opacity'));
      check('emptyingAFieldKeepsTheCaretInIt', () => deepActive() === emptiedInput);
      check('emptyingAFieldStillShowsWhatIsCommitted', () => emptied.value);
      check('emptyingAFieldCommitsNothingYet', () =>
        `${engine.inlineStyle('opacity', k1)} history=${engine.history.size}`);
      // Retyping without looking away is the case this protects: nothing was lost.
      emptiedInput.value = '0.9';
      emptiedInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      press(emptiedInput, 'Enter');
      await wait(140);
      await frame();
      check('retypingAfterEmptyingKeepsTheRowAndCommits', () =>
        `${k1.style.opacity} rows=${setRows().join(',')}`);
      // Emptying it and then looking away is what removes it.
      await wait(2600);
      const leaving = setRowField('opacity').shadowRoot.querySelector('input[type=text]');
      leaving.focus();
      leaving.value = '';
      leaving.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      leaving.blur();
      await wait(280);
      await frame();
      check('lookingAwayFromAnEmptiedFieldRemovesTheRow', () =>
        `${setRows().includes('opacity')} style=${JSON.stringify(k1.style.opacity)}`);
      engine.history.clear();
      k1.setAttribute('style', styleBeforeEmptying ?? '');
      await frame();

      /* Duplicating is a page action, so it stays out of reach from inside a field. */
      const cardCount = () => keyStack.children.length;
      const beforeDup = cardCount();
      keyRow('font-size').querySelector('heo-value-field')
        .shadowRoot.querySelector('input[type=text]').focus();
      press(deepActive(), 'd', { metaKey: true });
      await wait(120);
      check('modDFromAFieldDoesNotDuplicate', () => cardCount() === beforeDup);
      api.select(k1);
      await frame();
      press(document.body, 'd', { metaKey: true });
      await wait(140);
      check('modDFromThePageStillDuplicates', () => cardCount() === beforeDup + 1);

      /* Class-provided declarations stay out of the Set section. */
      engine.setStyle('z-index', '4', k1);
      await frame();
      check('setSectionExcludesClassDeclarations', () => {
        const section = Array.from(dockPanel('styles').shadowRoot.querySelectorAll('heo-section'))
          .find((s) => s.heading === 'Set on this element');
        const rows = Array.from(section?.querySelectorAll('.rows .row') ?? [])
          .map((r) => r.dataset.property);
        const fromCard = Object.keys(engine.classes.get('card').declarations);
        return `rows=${rows.join(',')} card=${fromCard.join(',')} overlap=${rows.filter((r) => fromCard.includes(r)).join(',') || 'none'}`;
      });
      keyStack.remove();
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * Styles splits three ways: inline, classes, everything else.
       *
       * `*`, `p`, `.fig .ph` and `.pull blockquote` all reach an element, and they
       * used to sit among its own values — where changing one wrote an inline
       * override on that element alone rather than editing the rule responsible.
       * Each source now has one home, and rules are editable where they live.
       * ------------------------------------------------------------------ */
      const ruleSheet = document.createElement('style');
      ruleSheet.textContent = `
        * { box-sizing: border-box }
        p { line-height: 1.6 }
        .fig .ph { opacity: 0.8; letter-spacing: 1px }
        .ph:hover { color: rgb(238, 17, 17) }
        .ph::before { content: '> ' }
        @media (min-width: 100px) { .fig .ph { text-transform: uppercase } }
      `;
      document.head.append(ruleSheet);
      const fig = document.createElement('div');
      fig.className = 'fig';
      fig.innerHTML =
        '<p class="ph plain" id="rtarget" style="font-size:15px">Target.</p>' +
        '<p class="ph" id="rsibling">Sibling.</p>';
      document.body.append(fig);
      const rtarget = document.getElementById('rtarget');
      const rsibling = document.getElementById('rsibling');
      api.select(rtarget);
      await frame();
      await wait(120);

      const stylesSection = (heading) =>
        Array.from(dockPanel('styles').shadowRoot.querySelectorAll('heo-section'))
          .find((s) => s.heading === heading);

      check('setOnThisElementIsInlineOnly', () =>
        Array.from(stylesSection('Set on this element').querySelectorAll('.rows .row'))
          .map((r) => r.dataset.property).sort().join(','));

      const cssRules = stylesSection('CSS rules');
      check('theCssRulesSectionExists', () => Boolean(cssRules));
      // Open because it has rules in it — an empty section opening was the complaint.
      // The per-selector groups inside still start closed; that is where "do not expand
      // complex selectors by default" applies, and it is checked just below.
      check('theCssRulesSectionOpensWhenItHasContent', () => cssRules.open === true);
      cssRules.shadowRoot.querySelector('.head').click();
      await frame();
      const groupHeaders = () => Array.from(cssRules.querySelectorAll('.cls > header'));
      check('everySelectorReachingTheElementIsOffered', () =>
        groupHeaders().map((h) => h.querySelector('.n').textContent.trim()).join(' | '));
      check('itsOwnClassesAreNotRepeatedHere', () =>
        !groupHeaders().some((h) => ['.ph', '.plain'].includes(h.querySelector('.n').textContent.trim())));
      check('theGroupsStartClosedToo', () =>
        groupHeaders().every((h) => h.getAttribute('aria-expanded') === 'false'));

      /*
       * And an empty section stays shut. Selecting a plain element used to produce a
       * column of headings with nothing under them, pushing the ones that did have
       * content off screen.
       */
      const bareEl = document.createElement('span');
      bareEl.textContent = 'bare';
      document.body.append(bareEl);
      api.select(bareEl);
      await frame();
      await wait(120);
      check('emptySectionsStayClosed', () => {
        const shut = ['Set on this element', 'Classes', 'CSS rules'].map((heading) => {
          const section = stylesSection(heading);
          return `${heading}=${section ? section.open : 'missing'}`;
        });
        return shut.join(' ');
      });
      // Opening one by hand still sticks, which is how you reach the affordance inside.
      stylesSection('Classes').shadowRoot.querySelector('.head').click();
      await frame();
      check('openingAnEmptySectionSticks', () => stylesSection('Classes').open === true);
      bareEl.remove();
      api.select(rtarget);
      await frame();
      await wait(120);

      // Two rules share `.fig .ph`; the meta line is what tells them apart.
      const openRuleGroup = async (selector, condition) => {
        const header = groupHeaders().find((h) => {
          if (h.querySelector('.n').textContent.trim() !== selector) return false;
          const meta = h.querySelector('.meta').textContent;
          return condition ? meta.includes(condition) : !meta.includes('@media');
        });
        if (!header) throw new Error(`no group for ${selector}`);
        header.click();
        await frame();
        return header.parentElement;
      };
      const figGroup = await openRuleGroup('.fig .ph');
      check('aRuleGroupOffersItsOwnDeclarations', () =>
        Array.from(figGroup.querySelectorAll('heo-value-field'))
          .map((f) => f.getAttribute('data-property')).join(','));

      /* Editing there edits the rule, so every element it matches follows. */
      const lsBefore = getComputedStyle(rsibling).letterSpacing;
      const lsField = figGroup.querySelector('heo-value-field[data-property="letter-spacing"]');
      const lsInput = lsField.shadowRoot.querySelector('input[type=text]');
      lsInput.focus();
      lsInput.value = '6px';
      // Enter goes to the same input, in the same tick: letting a render intervene
      // detaches the element this reference points at and the commit lands nowhere.
      lsInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      press(lsInput, 'Enter');
      await wait(160);
      check('editingARuleMovesEveryElementItMatches', () =>
        `${lsBefore} -> ${getComputedStyle(rsibling).letterSpacing}`);
      check('editingARuleWritesNoInlineOverride', () => rtarget.getAttribute('style'));
      api.undo();
      await wait(140);
      check('undoingARuleEditPutsTheRuleBack', () => getComputedStyle(rsibling).letterSpacing);

      /*
       * And the edit survives a render landing between the keystroke and Enter.
       *
       * That gap is not hypothetical — changing a rule reflows the page, the resize
       * observer bumps geometry, and the panel re-reads the rule. It used to re-read
       * the *preview*, because a preview is painted straight into the live
       * CSSStyleRule: the row was handed its own half-typed text as its committed
       * value, so Enter compared equal and committed nothing, and the focus-out that
       * followed reverted the preview. From the user's seat, confirming a value that
       * came from a stylesheet rolled it straight back to what the stylesheet said.
       *
       * The test above sidesteps all of this by pressing Enter in the same tick. This
       * one does what a person does: type, pause, confirm, look away.
       */
      const opBefore = getComputedStyle(rsibling).opacity;
      const opField = () => figGroup.querySelector('heo-value-field[data-property="opacity"]');
      const firstOpField = opField();
      const opInput = firstOpField.shadowRoot.querySelector('input[type=text]');
      opInput.focus();
      opInput.value = '0.5';
      opInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await wait(200);
      await frame();
      check('theRulePreviewReachesEveryElementItMatches', () =>
        `${opBefore} -> ${getComputedStyle(rsibling).opacity}`);
      // The row has to survive the re-render, or the caret goes with it.
      check('theRuleRowSurvivesThePreviewRender', () => opField() === firstOpField);
      check('aPreviewedRuleFieldStillShowsWhatIsCommitted', () => firstOpField.value);
      check('aPreviewedRuleFieldSaysItIsUncommitted', () =>
        firstOpField.hasAttribute('data-heo-dirty'));
      press(opInput, 'Enter');
      await wait(180);
      check('confirmingARuleEditAfterARenderCommits', () => getComputedStyle(rsibling).opacity);
      opInput.blur();
      await wait(340);
      await frame();
      check('andLookingAwayDoesNotRollItBack', () => getComputedStyle(rsibling).opacity);
      check('theRuleEditIsInTheChangeSet', () =>
        engine.records.filter((r) => r.detail?.scope === 'stylesheet rule').length);
      api.undo();
      await wait(140);
      check('undoStillReachesThatRuleEdit', () => getComputedStyle(rsibling).opacity);

      /* Backspacing the value is not a request to delete the declaration, either. */
      const opInputNow = () => opField().shadowRoot.querySelector('input[type=text]');
      const typeIntoField = (input, text) => {
        input.focus();
        input.value = text;
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      };
      const opFieldBeforeEmptying = opField();
      typeIntoField(opInputNow(), '');
      await wait(200);
      await frame();
      check('emptyingARuleFieldKeepsItsRow', () => Boolean(opField()));
      check('emptyingARuleFieldKeepsTheCommittedValue', () => opField().value);
      /*
       * And it is still the *same* row element, which is what keeps the caret in it.
       *
       * Emptying a value takes the declaration out of the rule and the panel puts it
       * back, at the end — so the order of the list changes mid-edit. Rendered
       * positionally, that re-labelled every row from there on rather than moving it:
       * the field being typed into became a different property's field, and the next
       * keystroke edited that one. Keying the rows on the property name is what stops
       * it. (Focus itself cannot be asserted here: this section is closed at this
       * point in the suite, so its rows are in the DOM but not rendered.)
       */
      check('emptyingARuleFieldKeepsTheSameRowElement', () =>
        opField() === opFieldBeforeEmptying);
      const retype = opInputNow();
      typeIntoField(retype, '0.65');
      press(retype, 'Enter');
      await wait(200);
      await frame();
      check('retypingAfterEmptyingARuleFieldCommits', () =>
        `${getComputedStyle(rsibling).opacity} records=${engine.records.length} field=${opField()?.value}`);
      api.undo();
      await wait(140);
      engine.history.clear();

      /* State and pseudo-element rules are reachable, and say what they are. */
      check('stateAndPseudoElementRulesAreOffered', () => {
        const names = groupHeaders().map((h) => h.querySelector('.n').textContent.trim());
        return `${names.includes('.ph:hover')} ${names.includes('.ph::before')}`;
      });
      const hoverGroup = await openRuleGroup('.ph:hover');
      check('aStateGroupSaysTheStateIsNotActive', () => /state is active/.test(hoverGroup.textContent));

      /*
       * And a state rule never reports as the element's current value. This is why
       * they are collected apart from the cascade: in it, the panel would claim this
       * paragraph is already the hover colour.
       */
      check('noStateValueEscapesIntoTheOtherSections', () => {
        const hoverColour = 'rgb(238,17,17)';
        return !Array.from(dockPanel('styles').shadowRoot.querySelectorAll('heo-value-field'))
          .filter((f) => !cssRules.contains(f))
          .some((f) => (f.value || '').replace(/\s/g, '').toLowerCase() === hoverColour);
      });

      cssRules.shadowRoot.querySelector('.head').click();
      fig.remove();
      ruleSheet.remove();
      engine.history.clear();
      api.select(null);
      await frame();

      /* ------------------------------------------------------------------ *
       * The class editor looks and behaves the same in both panels.
       * ------------------------------------------------------------------ */
      api.select(document.getElementById('para'));
      await frame();
      const stylesChip = Array.from(dockPanel('styles').shadowRoot.querySelectorAll('.chip .name'))
        .find((x) => x.textContent.trim() === 'card');
      stylesChip.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      const columnsIn = (panel) => {
        const row = dockPanel(panel).shadowRoot.querySelector('.cls .decl');
        return row ? getComputedStyle(row).gridTemplateColumns : 'no row';
      };
      const stylesColumns = columnsIn('styles');
      check('stylesClassRowLayout', () => stylesColumns);
      check('stylesAddPropertyIsVisible', () =>
        Boolean(dockPanel('styles').shadowRoot
          .querySelector('.cls .decl .pair input')?.getClientRects().length));
      check('stylesConfirmIsVisible', () =>
        Boolean(dockPanel('styles').shadowRoot
          .querySelector('.cls .confirm')?.getClientRects().length));
      check('stylesRemoveSitsOnTheSameRow', () => {
        const row = dockPanel('styles').shadowRoot.querySelector('.cls .decl');
        const drop = row?.querySelector('.drop');
        const field = row?.querySelector('heo-value-field');
        if (!drop || !field) return 'missing';
        return Math.abs(drop.getBoundingClientRect().top - field.getBoundingClientRect().top) < 12;
      });
      api.openPanel('tokens');
      await frame();
      const tokensHeader = Array.from(dockPanel('tokens').shadowRoot.querySelectorAll('.cls > header'))
        .find((h) => h.querySelector('.n')?.textContent === '.card');
      tokensHeader.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      check('bothPanelsShareTheClassRowLayout', () => columnsIn('tokens') === stylesColumns);

      /*
       * A class declaration commits the same way, and for the same reason.
       *
       * A class preview is written into the registry the editor reads back from, and
       * the write notifies every panel — so the re-render is guaranteed here rather
       * than merely likely. Same failure as a stylesheet rule: the field was told its
       * own draft was committed, Enter did nothing, and looking away reverted it.
       */
      const cardEl = document.getElementById('para');
      const cardPadField = () => dockPanel('tokens').shadowRoot
        .querySelector('heo-value-field[data-property="padding"]');
      const cardPadBefore = getComputedStyle(cardEl).padding;
      const cardPadInput = cardPadField().shadowRoot.querySelector('input[type=text]');
      cardPadInput.focus();
      cardPadInput.value = '27px';
      cardPadInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await wait(200);
      await frame();
      // The preview writes into the registry, so that is where it is observed. Asserting
      // on computed style instead would be measuring the cascade, and `#para` carries
      // inline padding from earlier tests that would mask the class either way.
      check('theClassPreviewIsLiveInTheRegistry', () =>
        `${cardPadBefore} -> ${engine.classes.get('card').declarations.padding}`);
      check('aPreviewedClassFieldStillShowsWhatIsCommitted', () => cardPadField().value);
      check('aPreviewedClassFieldSaysItIsUncommitted', () =>
        cardPadField().hasAttribute('data-heo-dirty'));
      press(cardPadInput, 'Enter');
      await wait(180);
      cardPadInput.blur();
      await wait(340);
      await frame();
      check('confirmingAClassEditSurvivesLookingAway', () =>
        `${engine.classes.get('card').declarations.padding} records=${engine.records.length}`);
      api.undo();
      await wait(160);
      await frame();
      check('undoPutsTheClassDeclarationBack', () =>
        engine.classes.get('card').declarations.padding);
      engine.history.clear();

      /* A newly added property arrives focused with its value preselected. */
      const tokensAdder = dockPanel('tokens').shadowRoot.querySelector('.cls .decl .pair input');
      tokensAdder.focus();
      tokensAdder.value = 'word-spacing';
      tokensAdder.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      press(tokensAdder, 'Enter');
      await wait(150);
      check('newValueIsPreselected', () => {
        const field = dockPanel('tokens').shadowRoot
          .querySelector('heo-value-field[data-property="word-spacing"]');
        const input = field?.shadowRoot.querySelector('input[type=text]');
        if (!input) return 'no field';
        return `${input.selectionStart}-${input.selectionEnd} of ${JSON.stringify(input.value)}`;
      });
      engine.removeClassDeclaration('card', 'word-spacing');
      await frame();
      engine.history.clear();
      api.openPanel('styles');
      await frame();

      /* ------------------------------------------------------------------ *
       * The code editor owns its buffer, its caret and its undo.
       * ------------------------------------------------------------------ */
      const codeTarget = document.createElement('p');
      codeTarget.id = 'code-target';
      codeTarget.textContent = 'Original copy.';
      document.getElementById('wrap').appendChild(codeTarget);
      api.select(codeTarget);
      engine.beginTextEdit(codeTarget);
      await frame();
      check('inlineTextEditStarted', () => Boolean(engine.store.value.textEditing));

      api.openPanel('code');
      await frame();
      const codeArea = () =>
        langPanel().shadowRoot.querySelector('heo-code-editor')
          ?.shadowRoot.querySelector('textarea');
      const codeEditorEl = () => langPanel().shadowRoot.querySelector('heo-code-editor');
      codeArea().dispatchEvent(
        new PointerEvent('pointerdown', { bubbles: true, composed: true, cancelable: true }),
      );
      codeArea().focus();
      await frame();
      // Clicking into the panel has to end the page's inline edit: leaving it running
      // meant the page kept its contenteditable while the caret sat in the textarea,
      // so Escape and Mod+Z went to the page instead of the editor under the cursor.
      check('clickingIntoTheEditorEndsThePageEdit', () => ({
        engineState: engine.store.value.textEditing === null,
        pageAttribute: !codeTarget.hasAttribute('contenteditable'),
        caretInEditor: deepActive() === codeArea(),
      }));

      /* Mod+Z in a code buffer is the buffer's own undo, not the page's. */
      engine.history.clear();
      engine.setStyle('outline', '2px solid red', codeTarget);
      await frame();
      const depthBeforeModZ = engine.history.size;
      codeArea().focus();
      press(codeArea(), 'z', { metaKey: true });
      await wait(120);
      check('modZInACodeBufferLeavesThePageAlone', () => ({
        history: engine.history.size === depthBeforeModZ,
        stillStyled: codeTarget.style.outline !== '',
      }));
      engine.resetStyle('outline', codeTarget);
      engine.history.clear();
      await frame();

      /* Revert reloads the buffer and keeps the caret in the panel. */
      const codeFoot = () =>
        Array.from(langPanel().shadowRoot.querySelectorAll('.foot .btn'));
      const revertBtn = () => codeFoot().find((b) => !b.classList.contains('primary'));
      const applyBtn = () => codeFoot().find((b) => b.classList.contains('primary'));
      const pristine = codeEditorEl().code;
      codeArea().focus();
      codeArea().value = '<p id="code-target">Typed, not applied.</p>';
      codeArea().dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      check('revertReadsAsRevertWhileDirty', () => revertBtn().textContent.trim());
      revertBtn().dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await wait(100);
      check('revertActuallyReloadsTheBuffer', () => ({
        buffer: codeEditorEl().code === pristine,
        textarea: codeArea().value === pristine,
        caretInEditor: deepActive() === codeArea(),
      }));

      /* Apply keeps the caret in the panel, and Revert then undoes the apply. */
      codeArea().focus();
      codeArea().value = '<p id="code-target">Applied copy.</p>';
      codeArea().dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      applyBtn().dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await wait(160);
      check('applyChangedThePage', () => document.getElementById('code-target')?.textContent);
      check('applyKeptTheCaretInTheEditor', () => deepActive() === codeArea());
      check('revertBecomesUndoApply', () => ({
        label: revertBtn()?.textContent.trim(),
        enabled: Boolean(revertBtn() && !revertBtn().disabled),
      }));
      revertBtn().dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await wait(180);
      check('undoApplyRestoresTheMarkup', () =>
        document.getElementById('code-target')?.textContent);
      // The undo swaps a different node back in, so the selection has to follow it
      // rather than be left on the detached replacement.
      check('undoApplyKeepsThePanelPopulated', () => Boolean(revertBtn()));
      check('undoApplyLapsesTheOffer', () => Boolean(revertBtn()?.disabled));
      codeTarget.remove();
      document.getElementById('code-target')?.remove();
      engine.history.clear();
      api.openPanel('styles');
      await frame();

      /* ------------------------------------------------------------------ *
       * Tab accepts an arrow-key selection, and nothing else.
       *
       * The highlight has three sources — the arrow keys, the pre-highlight that
       * typing applies, and whatever the pointer is resting over — and only the first
       * is something the user chose. Tabbing used to accept the others too, so a
       * mouse left anywhere over the list silently rewrote the value on the way out.
       * ------------------------------------------------------------------ */
      const tabProbe = document.createElement('p');
      tabProbe.id = 'tab-probe';
      tabProbe.textContent = 'x';
      document.getElementById('wrap').appendChild(tabProbe);
      api.openPanel('styles');

      const tabScenario = async (arrows, hoverIndex) => {
        api.select(null);
        await frame();
        api.select(tabProbe);
        await frame();
        tabProbe.removeAttribute('style');
        await frame();
        const field = Array.from(dockPanel('styles').shadowRoot.querySelectorAll('heo-value-field'))
          .filter((f) => f.property === 'color' && f.getClientRects().length > 0).pop();
        const input = field.shadowRoot.querySelector('input[type=text]');
        input.focus();
        input.value = 'var';
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await frame();
        const rows = () => Array.from(field.shadowRoot.querySelectorAll('.popup .option'));
        for (let i = 0; i < arrows; i += 1) {
          press(input, 'ArrowDown');
          await frame();
        }
        const arrowPick = rows().findIndex((r) => r.getAttribute('aria-selected') === 'true');
        if (hoverIndex !== null && rows()[hoverIndex]) {
          rows()[hoverIndex].dispatchEvent(
            new PointerEvent('pointerenter', { bubbles: true, composed: true }),
          );
          await frame();
        }
        const shownPick = rows().findIndex((r) => r.getAttribute('aria-selected') === 'true');
        press(input, 'Tab');
        await wait(90);
        return { arrowPick, shownPick, committed: tabProbe.style.color };
      };

      const hoverOnly = await tabScenario(0, 2);
      check('hoverMovesTheHighlightButTabTakesNothing', () =>
        `highlight=${hoverOnly.shownPick} committed=${JSON.stringify(hoverOnly.committed)}`);
      const arrowsOnly = await tabScenario(2, null);
      check('tabTakesTheArrowSelection', () =>
        `highlight=${arrowsOnly.shownPick} committed=${JSON.stringify(arrowsOnly.committed)}`);
      const arrowsThenHover = await tabScenario(1, 3);
      check('aStrayHoverCannotStealTheArrowSelection', () =>
        `arrow=${arrowsThenHover.arrowPick} shown=${arrowsThenHover.shownPick} ` +
        `committed=${JSON.stringify(arrowsThenHover.committed)}`);
      const nothingChosen = await tabScenario(0, null);
      check('tabWithNothingChosenLeavesTheTextAlone', () =>
        JSON.stringify(nothingChosen.committed));
      tabProbe.remove();
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * A list stays open only for the input that drives it and its own rows.
       *
       * The chevron, the clear button and the unit chip are siblings of the input,
       * not part of the editing context, so landing on one ends the list. Anything
       * looser leaves a list standing over a control it has nothing to do with.
       * ------------------------------------------------------------------ */
      api.openPanel('styles');
      api.select(document.getElementById('para'));
      await frame();
      const listField = Array.from(dockPanel('styles').shadowRoot.querySelectorAll('heo-value-field'))
        .find((f) => f.property === 'color' && f.getClientRects().length > 0);
      const listInput = listField.shadowRoot.querySelector('input[type=text]');
      const listShown = () => Boolean(listField.shadowRoot.querySelector('.popup'));
      const reopenList = async () => {
        listInput.focus();
        await frame();
        if (!listShown()) {
          const strip = listField.shadowRoot.querySelector('.trailing');
          strip.dispatchEvent(
            new PointerEvent('pointerdown', { bubbles: true, composed: true, cancelable: true }),
          );
          strip.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
          await frame();
        }
      };

      await reopenList();
      check('listOpensWithTheCaretInTheInput', () => listShown());
      await wait(220);
      check('listStaysWhileTheCaretRemains', () => listShown());

      const chevron = Array.from(listField.shadowRoot.querySelectorAll('.trailing .mini'))
        .find((b) => b.getAttribute('aria-label') === 'Show tokens and values');
      chevron.focus();
      await wait(220);
      check('listClosesWhenFocusMovesToTheChevron', () => !listShown());
      // Narrower than :focus-within on purpose — focus is still inside the field.
      check('chevronFocusIsStillInsideTheField', () => listField.matches(':focus-within'));

      /* Clicking it still opens the list, because that hands the caret back. */
      const openStrip = listField.shadowRoot.querySelector('.trailing');
      openStrip.dispatchEvent(
        new PointerEvent('pointerdown', { bubbles: true, composed: true, cancelable: true }),
      );
      openStrip.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await wait(220);
      check('clickingTheChevronStillOpensIt', () => listShown());
      check('clickingTheChevronReturnsTheCaret', () =>
        listField.shadowRoot.activeElement === listInput);

      /* Focus inside the list keeps it; stepping back out of it does not. */
      const listRow = listField.shadowRoot.querySelector('.popup .option');
      listRow.focus();
      await wait(220);
      check('listStaysWhenFocusIsOnARow', () => listShown());

      const inOverlay = (node) => {
        let c = node;
        while (c) {
          if (c.tagName && c.tagName.toLowerCase() === 'html-editor-overlay') return true;
          c = c.parentNode instanceof ShadowRoot ? c.parentNode.host : c.parentNode;
        }
        return false;
      };
      const pressTab = (shift) =>
        document.dispatchEvent(new KeyboardEvent('keydown', {

      outsideButton.textContent = 'On the page';

      check('focusStartsOutOnThePage', () => deepActive()?.id);
      check('thePageScrollsBeforeAnyModal', () =>
        getComputedStyle(document.documentElement).overflow);

      check('focusMovedIntoTheDialog', () => {

      });

      const visited = new Set();
      for (let i = 0; i < 24 && escapedTo === null; i += 1) {

        await frame();
        const active = deepActive();

      }
      check('tabNeverLeavesTheDialog', () => escapedTo ?? true);
      check('andEveryStopBelongsToIt', () => [...visited].join(','));
      let escapedBack = null;
      for (let i = 0; i < 24 && escapedBack === null; i += 1) {
