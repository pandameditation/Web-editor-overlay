      });
      check('computedRowIsNotPreselected', () => exprRows()[0]?.selected === 'false');
      exprInput.dispatchEvent(new KeyboardEvent('keydown', {
        key: 'ArrowDown', bubbles: true, composed: true, cancelable: true,
      }));
      await frame();
      check('arrowKeysStepOverTheComputedRow', () =>
        exprRows().findIndex((r) => r.selected === 'true'));
      exprField.shadowRoot.querySelector('.popup .option.info')
        .dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await wait(80);
      check('choosingComputedKeepsTheFormula', () => exprProbe.style.color || '(no inline)');

      /* Enter on an expression commits the expression. */
      const exprField2 = exprRow().querySelector('heo-value-field');
      const exprInput2 = exprField2.shadowRoot.querySelector('input[type=text]');
      exprInput2.focus();
      exprInput2.value = 'var(--ink)';
      exprInput2.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      exprInput2.dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Enter', bubbles: true, composed: true, cancelable: true,
      }));
      await wait(100);
      check('enterCommitsTheFormulaNotTheNumber', () => exprProbe.style.color);

      /* Set-on-this-element lists what a rule declares, not only inline styles. */
      check('setSectionListsRuleProperties', () => {
        const section = Array.from(dockPanel('styles').shadowRoot.querySelectorAll('heo-section'))
          .find((s) => s.heading === 'Set on this element');
        return Array.from(section?.querySelectorAll('.rows .row') ?? [])
          .map((r) => r.dataset.property).join(',');
      });
      exprProbe.remove();
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * A class property survives having its value cleared.
       *
       * Emptying a field is how you retype it; taking the property name away with
       * the value made backspace a destructive act.
       * ------------------------------------------------------------------ */
      api.openPanel('tokens');
      api.select(document.getElementById('para'));
      await frame();
      const tokensPanel = dockPanel('tokens');
      const clsHeader = Array.from(tokensPanel.shadowRoot.querySelectorAll('.cls > header'))
        .find((h) => h.querySelector('.n')?.textContent === '.card');
      check('classHeaderIsOneLine', () => Math.round(clsHeader.getBoundingClientRect().height));
      clsHeader.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      const adder = tokensPanel.shadowRoot.querySelector('.cls .decl .pair input');
      check('addPropertyHasAConfirmButton', () =>
        Boolean(tokensPanel.shadowRoot.querySelector('.cls .confirm')));
      adder.focus();
      adder.value = 'letter-spacing';
      adder.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      adder.dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Enter', bubbles: true, composed: true, cancelable: true,
      }));
      await wait(140);
      const newField = () =>
        tokensPanel.shadowRoot.querySelector('heo-value-field[data-property="letter-spacing"]');
      check('addedPropertyGetsAStartingValue', () =>
        engine.classes.get('card').declarations['letter-spacing']);
      check('focusLandsInTheNewValueField', () => Boolean(newField()?.matches(':focus-within')));

      newField().dispatchEvent(new CustomEvent('value-change', {
        detail: { value: '' }, bubbles: true, composed: true,
      }));
      await frame();
      check('clearingKeepsTheProperty', () => {
        const declarations = engine.classes.get('card').declarations;
        return `present=${'letter-spacing' in declarations} value=${JSON.stringify(declarations['letter-spacing'])}`;
      });
      check('clearedRowStaysOnScreen', () => Boolean(newField()));
      check('rowHasAnExplicitRemove', () =>
        Boolean(tokensPanel.shadowRoot.querySelector('.decl .drop')));
      engine.removeClassDeclaration('card', 'letter-spacing');
      await frame();
      check('explicitRemoveDropsTheProperty', () =>
        !('letter-spacing' in engine.classes.get('card').declarations));

      /* Under Styles the class editor offers neither Apply nor Delete. */
      api.openPanel('styles');
      await frame();
      const chipButton = Array.from(dockPanel('styles').shadowRoot.querySelectorAll('.chip .name'))
        .find((b) => b.textContent.trim() === 'card');
      chipButton.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      check('stylesClassEditorHidesActions', () =>
        !dockPanel('styles').shadowRoot.querySelector('.cls .apply'));
      check('stylesClassEditorStillEdits', () =>
        Boolean(dockPanel('styles').shadowRoot.querySelector('.cls .decls heo-value-field')));
      chipButton.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * A block inserts with the props on screen, not the ones last committed.
       *
       * A text field commits on a short blur debounce, and Insert is one click away:
       * the click used to run first, so a List inserted with its default bullet no
       * matter what had been typed.
       * ------------------------------------------------------------------ */
      const bulletHost = document.getElementById('title');
      api.select(bulletHost);
      engine.setInsertAnchor({ reference: bulletHost, position: 'after' });
      await frame();
      const insertMenu = overlayRoot().shadowRoot.querySelector('heo-insert-menu');
      const menuSearch = insertMenu.shadowRoot.querySelector('.top input');
      menuSearch.value = 'List';
      menuSearch.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      insertMenu.shadowRoot.querySelector('.row')
        .dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      check('blockConfigureFormShown', () =>
        Boolean(insertMenu.shadowRoot.querySelector('.configure')));
      const bulletInput = insertMenu.shadowRoot
        .querySelector('heo-value-field').shadowRoot.querySelector('input[type=text]');
      bulletInput.focus();
      bulletInput.value = '✅';
      bulletInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      insertMenu.shadowRoot.querySelector('.cfoot .btn.primary')
        .dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await wait(200);
      const typedList = document.querySelector('#wrap ul');
      check('blockInsertedWithTheTypedProp', () =>
        typedList ? getComputedStyle(typedList).listStyleType : 'no list');
      if (typedList) engine.remove(typedList);
      await frame();
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * Inline SVG belongs in the tree.
       *
       * `<svg>` is an SVGSVGElement, not an HTMLElement, so an instanceof filter
       * on the traversal dropped every icon — while clicking one on the page
       * selected it quite happily. The two views have to agree.
       * ------------------------------------------------------------------ */
      const glyph = document.getElementById('glyph');
      api.select(glyph);
      check('svgIsSelectable', () => engine.selected === glyph);
      api.select(document.getElementById('glyph-path'));
      check('svgShapeIsSelectable', () => engine.selected.id);
      api.openPanel('tree');
      await frame();
      // Selecting expands the path to the selection, so the svg and its shapes are
      // both on screen — which is precisely what used to be impossible.
      check('svgRowInTree', () => treeRows().includes('svg#glyph'));
      check('svgInteriorInTree', () => treeRows().includes('path#glyph-path'));
      check('svgDefinitionNodesHidden', () => !treeRows().includes('defs#glyph-defs'));
      check('svgParentStillListed', () => treeRows().includes('section#holder'));

      /* ------------------------------------------------------------------ *
       * The List preset carries its marker as one declaration.
       * ------------------------------------------------------------------ */
      const listBlock = engine.library.get('bullet-list');
      const listNode = await engine.insertBlock(
        listBlock,
        { bullet: '🌟', item1: 'a', item2: 'b', item3: 'c' },
        { reference: document.getElementById('title'), position: 'after' },
      );
      await frame();
      check('listMarkerIsCss', () => getComputedStyle(listNode).listStyleType);
      check('listHasNoMarkerSpans', () => listNode.querySelectorAll('span').length);
      check('listRowsAreListItems', () =>
        Array.from(listNode.querySelectorAll('li')).map((li) => getComputedStyle(li).display).join(','));
      check('listItemsText', () =>
        Array.from(listNode.querySelectorAll('li')).map((li) => li.textContent.trim()).join(','));

      /* ------------------------------------------------------------------ *
       * A block's insert-time props stay editable, under COMPONENT.
       * ------------------------------------------------------------------ */
      api.openPanel('props');
      api.select(listNode);
      await frame();
      check('blockInstanceRecorded', () => {
        const instance = engine.blockInstance(listNode);
        return instance && `${instance.block.id}:${instance.values.bullet}`;
      });
      const propsPanel = dockPanel('props');
      check('componentSectionShown', () =>
        Array.from(propsPanel.shadowRoot.querySelectorAll('heo-section')).map((s) => s.heading).join(','));
      check('componentFormListsBlockProps', () =>
        Array.from(propsPanel.shadowRoot.querySelectorAll('.pf-field .pf-label')).length > 0);
      check('propDescriptionIsSelectable', () => {
        const desc = propsPanel.shadowRoot.querySelector('.pf-desc');
        return desc ? getComputedStyle(desc).userSelect : 'no .pf-desc';
      });
      await engine.setBlockProp(listNode, 'bullet', '✅');
      await frame();
      const reList = document.querySelector('#wrap ul');
      check('blockPropReRendersTheInstance', () => getComputedStyle(reList).listStyleType);
      check('blockPropSurvivesAsInstance', () =>
        (engine.blockInstance(reList) || {}).values?.bullet);
      engine.remove(reList);
      await frame();

      /* ------------------------------------------------------------------ *
       * Value suggestions only offer tokens the property can actually take.
       * ------------------------------------------------------------------ */
      api.openPanel('styles');
      api.select(document.getElementById('para'));
      await frame();
      const tokensFor = (property) => {
        const list = suggestionsFor(property);
        if (!list) return 'no field for ' + property;
        return list.filter((s) => s.token).map((s) => s.label).join(',');
      };
      check('colourPropertyOffersColourTokensOnly', () => tokensFor('background-color'));
      check('sizePropertyOffersSizeTokensOnly', () => tokensFor('font-size'));
      check('spacingPropertyOffersSpaceAndSize', () => tokensFor('padding'));
      check('keywordPropertyOffersNoTokens', () => tokensFor('overflow') === '');

      /* ------------------------------------------------------------------ *
       * A class chip in Styles opens the same editor the design system uses.
       * ------------------------------------------------------------------ */
      api.openPanel('styles');
      api.select(document.getElementById('para'));
      await frame();
      const sp = dockPanel('styles');
      const chipName = () =>
        Array.from(sp.shadowRoot.querySelectorAll('.chip .name')).find((b) =>
          b.textContent.trim() === 'card');
      check('classChipIsAButton', () => Boolean(chipName()));
      chipName().dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      check('classEditorOpensInStyles', () => Boolean(sp.shadowRoot.querySelector('.cls .decls')));
      check('classEditorListsDeclarations', () =>
        Array.from(sp.shadowRoot.querySelectorAll('.cls .decl .p')).map((p) => p.textContent).join(','));
      const cardBefore = engine.classes.get('card').declarations['padding'];
      const clsField = sp.shadowRoot.querySelector('.cls .decl heo-value-field');
      clsField.dispatchEvent(new CustomEvent('value-change', {
        detail: { value: '3px' }, bubbles: true, composed: true,
      }));
      await frame();
      check('classEditFromStylesApplies', () => {
        const entry = engine.classes.get('card');
        return Object.values(entry.declarations).includes('3px');
      });
      api.undo();
      check('classEditUndone', () => engine.classes.get('card').declarations['padding'] === cardBefore);

      /* ------------------------------------------------------------------ *
       * A capped ancestor is named under "In its parent", with the parent's own
       * layout properties alongside it.
       * ------------------------------------------------------------------ */
      const shell = document.createElement('div');
      shell.id = 'shell';
      shell.style.cssText = 'max-width:200px;display:flex;flex-direction:column';
      const inner = document.createElement('div');
      inner.id = 'inner';
      inner.style.cssText = 'width:900px;background:#eee;height:20px';
      shell.appendChild(inner);
      document.getElementById('wrap').appendChild(shell);
      await frame();
      api.select(inner);
      await frame();
      check('parentSectionNamesTheCap', () => {
        const text = dockPanel('styles').shadowRoot.querySelector('.capped')?.textContent ?? '';
        return text.replace(/\s+/g, ' ').trim().slice(0, 90);
      });
      check('parentControlsRendered', () => {
        const rows = dockPanel('styles').shadowRoot.querySelectorAll('.onparent .row .name');
        return Array.from(rows).map((n) => n.textContent.trim()).join(',');
      });
      shell.remove();
      await frame();
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * The CSS panel lists the page's stylesheets and edits one.
       * ------------------------------------------------------------------ */
      api.openPanel('css');
      await frame();
      const cssPanel = dockPanel('css');
      check('cssPanelListsSheets', () =>
        Array.from(cssPanel.shadowRoot.querySelectorAll('.sheet .name')).map((n) => n.textContent).join(','));
      check('cssPanelShowsRuleCounts', () =>
        Array.from(cssPanel.shadowRoot.querySelectorAll('.sheet .count')).length > 0);
      check('cssPanelLoadedSource', () =>
        cssPanel.shadowRoot.querySelector('heo-code-editor')?.code.includes('.card'));
      const styleTag = document.querySelector('head style');
      const cssBefore = styleTag.textContent;
      cssPanel.shadowRoot.querySelector('heo-code-editor').dispatchEvent(
        new CustomEvent('code-input', {
          detail: { value: `${cssBefore}\n.injected-by-panel { outline: 3px solid red }` },
          bubbles: true,
          composed: true,
        }),
      );
      await frame();
      cssPanel.shadowRoot.querySelector('.btn.primary')
        .dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      check('cssPanelAppliedTheEdit', () => {
        const probe = document.createElement('div');
        probe.className = 'injected-by-panel';
        document.body.appendChild(probe);
        const applied = getComputedStyle(probe).outlineColor;
        probe.remove();
        return applied;
      });
      check('cssPanelRecordedTheFile', () => {
        const record = engine.records.find((r) => r.summary.startsWith('Edit the CSS'));
        return record && record.detail.scope;
      });
      api.undo();
      await frame();
      check('cssPanelEditUndone', () => !styleTag.textContent.includes('injected-by-panel'));
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * Reordering may only move siblings; changing parent needs a held gesture.
       *
       * This is the anti-flicker rule with teeth: an unscoped drag re-parented on
       * any pointer move, and since a re-parent reflows ancestors too, the next
       * sample saw a different page and proposed something else.
       * ------------------------------------------------------------------ */
      const nest = document.createElement('div');
      nest.id = 'nest';
      nest.style.cssText =
        'position:fixed;left:16px;top:200px;width:200px;display:flex;flex-direction:column;gap:6px';
      nest.innerHTML =
        '<div id="n1" style="height:40px;background:#eee">n1</div>' +
        '<div id="n2" style="height:40px;background:#ddd">n2</div>' +
        '<div id="box" style="height:90px;background:#cfc;display:flex;flex-direction:column"></div>';
      const away = document.createElement('div');
      away.id = 'away';
      away.style.cssText =
        'position:fixed;left:320px;top:200px;width:200px;display:flex;flex-direction:column;gap:6px';
      away.innerHTML = '<div id="a1" style="height:40px;background:#eef">a1</div>';
      document.body.append(nest, away);
      await frame();

      const centreOf = (id) => {
        const b = document.getElementById(id).getBoundingClientRect();
        return { x: b.left + b.width / 2, y: b.top + b.height / 2 };
      };
      const n1 = document.getElementById('n1');
      api.select(n1);
      engine.startDrag(n1, centreOf('n1').x, centreOf('n1').y);
      check('dragScopedToItsParent', () => engine.store.value.drag.home.id);

      // Crossing into the far column must not re-parent on its own.
      for (let i = 0; i < 4; i += 1) {
        engine.updateDrag(centreOf('a1').x, centreOf('a1').y);
        await wait(25);
      }
      check('crossingDoesNotReparent', () => ({
        home: engine.store.value.drag.home.id,
        parent: n1.parentElement.id,
        waiting: engine.store.value.drag.waiting,
      }));
      // Holding out there does.
      await wait(520);
      check('holdingOutsideReparents', () => ({
        home: engine.store.value.drag.home.id,
        parent: n1.parentElement.id,
      }));
      engine.cancelDrag();
      check('cancelRestoredTheParent', () => n1.parentElement.id);

      // Let the restore animation land before measuring: a FLIP is a transform, and
      // getBoundingClientRect reports transformed boxes, so a coordinate taken
      // mid-glide points at where an element is passing through rather than where it
      // lives.
      await wait(240);

      // Resting inside a container nests into it, but only after the hold.
      const boxCentre = centreOf('box');
      engine.startDrag(n1, centreOf('n1').x, centreOf('n1').y);
      engine.updateDrag(boxCentre.x, boxCentre.y);
      check('restingBrieflyDoesNotNest', () => ({
        parent: n1.parentElement.id,
        waiting: engine.store.value.drag.waiting,
      }));
      await wait(520);
      check('holdingInsideNests', () => ({
        home: engine.store.value.drag.home.id,
        parent: n1.parentElement.id,
      }));
      engine.endDrag();
      check('nestedMoveRecorded', () => engine.records.some((r) => r.kind === 'move'));
      api.undo();
      check('nestedMoveUndone', () => n1.parentElement.id);
      nest.remove();
      away.remove();
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * Replace swaps an element out, and undo survives the replacement being
       * moved afterwards — repositioning what you just inserted is the expected
       * next action, and it invalidates the anchor undo would like to use.
       * ------------------------------------------------------------------ */
      engine.history.clear();
      const victim = document.createElement('p');
      victim.id = 'victim';
      victim.textContent = 'Replace me';
      document.getElementById('wrap').appendChild(victim);
      const elsewhere = document.createElement('div');
      elsewhere.id = 'elsewhere';
      document.body.appendChild(elsewhere);

      const swapped = engine.insertMarkup('<section id="fresh">new</section>', {
        reference: victim,
        position: 'replace',
      });
      check('replaceSwappedIn', () => !!swapped && swapped.id === 'fresh');
      check('replaceRemovedTheOriginal', () => document.getElementById('victim') === null);
      check('replaceRecordKind', () =>
        (engine.records.find((r) => r.kind === 'replace') || {}).summary);

      api.undo();
      check('replaceUndone', () => ({
        originalBack: !!document.getElementById('victim'),
        replacementGone: !swapped.isConnected,
      }));
      api.redo();
      check('replaceRedone', () => !document.getElementById('victim') && swapped.isConnected);

      // Now move the replacement out of its parent and undo anyway.
      elsewhere.appendChild(swapped);
      api.undo();
      check('replaceUndoneAfterTheReplacementMoved', () => ({
        originalBack: !!document.getElementById('victim'),
        replacementGone: !swapped.isConnected,
        parentOfOriginal: document.getElementById('victim')?.parentElement?.id,
      }));
      document.getElementById('victim')?.remove();
      elsewhere.remove();
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * The value field's list has to reach the top layer.
       *
       * It lives inside the dock, whose backdrop-filter makes it the containing
       * block for fixed descendants and whose overflow clips them, so a plainly
       * positioned popup lands hundreds of pixels away and invisible.
       * ------------------------------------------------------------------ */
      api.openPanel('styles');
      api.select(document.getElementById('para'));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const stylesPanelEl = dockPanel('styles');
      const valueFieldFor = (property) =>
        Array.from(stylesPanelEl.shadowRoot.querySelectorAll('heo-value-field'))
          .find((f) => f.property === property);
      const typeInto = async (field, text) => {
        const input = field.shadowRoot.querySelector('input[type=text]');
        input.focus();
        input.value = text;
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        return input;
      };
      const optionsOf = (field) =>
        Array.from(field.shadowRoot.querySelector('.popup')?.querySelectorAll('.option') ?? [])
          .map((b) => b.querySelector('.name').textContent.trim());

      const overflow = valueFieldFor('overflow');
      await typeInto(overflow, 'hid');
      check('valuePopupReachesTopLayer', () =>
        overflow.shadowRoot.querySelector('.popup')?.matches(':popover-open') === true);
      check('valuePopupNotClippedByTheDock', () => {
        const popup = overflow.shadowRoot.querySelector('.popup').getBoundingClientRect();
        const anchor = overflow.getBoundingClientRect();
        return Math.abs(popup.left - anchor.left) < 24 && popup.top > anchor.top;
      });
      check('keywordAutocomplete', () => optionsOf(overflow).join(','));
      await typeInto(overflow, '');
      check('keywordsLeadForKeywordProperties', () => optionsOf(overflow).slice(0, 3).join(','));

      const colour = valueFieldFor('color');
      await typeInto(colour, 'ac');
      check('tokenSearchableByName', () => optionsOf(colour).join(','));
      // The whole trailing strip opens the list, and it survives the blur debounce.
      colour.shadowRoot.querySelector('input[type=text]').blur();
      await new Promise((r) => setTimeout(r, 200));
      const strip = colour.shadowRoot.querySelector('.trailing');
      strip.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, composed: true, cancelable: true }));
      strip.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await new Promise((r) => setTimeout(r, 250));
      check('trailingStripStaysOpen', () => !!colour.shadowRoot.querySelector('.popup'));

      /* ------------------------------------------------------------------ *
       * The class field is a submit control: Enter and the add button both act,
       * and neither may substitute a similarly named class for what was typed.
       * ------------------------------------------------------------------ */
      const target = document.getElementById('para');
      const classField = () =>
        Array.from(stylesPanelEl.shadowRoot.querySelectorAll('heo-value-field')).find((f) => f.action);
      const classesBefore = Array.from(target.classList);
      const typed = await typeInto(classField(), 'car');
      check('classFieldSuggests', () => optionsOf(classField()).join(','));
      check('classFieldPreselectsNothing', () =>
        classField().shadowRoot.querySelector('.option[aria-selected="true"]') === null);
      typed.dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Enter', bubbles: true, composed: true, cancelable: true,
      }));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      // Exactly what was typed, and nothing the suggestion list merely offered.
      check('enterAddsOnlyWhatWasTyped', () =>
        Array.from(target.classList).filter((n) => !classesBefore.includes(n)).join(','));
      check('classFieldClearsAfterAdding', () =>
        classField().shadowRoot.querySelector('input[type=text]').value === '');

      await typeInto(classField(), 'from-button');
      classField().shadowRoot.querySelector('.action')
        .dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      check('addButtonAdds', () => target.classList.contains('from-button'));

      /* ------------------------------------------------------------------ *
       * Every code input can expand into a modal, in the top layer so the dock
       * cannot clip it, over one shared buffer rather than two.
       * ------------------------------------------------------------------ */
      api.openPanel('code');
      api.select(document.getElementById('para'));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const codeEditor = dockPanel('code').shadowRoot.querySelector('heo-code-editor');
      const bufferBefore = codeEditor.code;
      codeEditor.shadowRoot.querySelector('.grow')
        .dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const modal = codeEditor.shadowRoot.querySelector('dialog.modal');
      check('codeModalOpens', () => !!modal && modal.open);
      check('codeModalEscapesTheDock', () => {
        const dock = dockEl().shadowRoot.querySelector('.dock').getBoundingClientRect();
        return modal.getBoundingClientRect().width > dock.width;
      });
      check('codeModalKeepsOneBuffer', () => ({
        textareas: codeEditor.shadowRoot.querySelectorAll('textarea').length,
        preserved: codeEditor.code === bufferBefore,
      }));
      codeEditor.shadowRoot.querySelector('dialog textarea').dispatchEvent(
        new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true, cancelable: true }),
      );
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      check('escapeCollapsesWithoutDiscarding', () => ({
        closed: !codeEditor.shadowRoot.querySelector('dialog.modal'),
        kept: codeEditor.code === bufferBefore,
      }));

      /* Reset reverts everything still on the undo stack.
       *
       * Measured against a known starting point rather than the state at the top
       * of this file: the assertions above clear history deliberately, and a
       * cleared command can no longer be reverted by design. */
      engine.history.clear();
      const wrap = para.parentElement;
      const childrenAtStart = wrap.children.length;
      engine.insertMarkup('<span class="reset-probe">a</span>', { reference: para, position: 'after' });
      engine.insertMarkup('<span class="reset-probe">b</span>', { reference: para, position: 'after' });
      engine.setStyle('outline', '2px solid red', para);
      await new Promise((r) => setTimeout(r, 60));
      check('changesBeforeReset', () => engine.records.length);
      check('childrenBeforeReset', () => wrap.children.length - childrenAtStart);

      api.reset();
      check('resetChanges', () => engine.records.length);
      check('resetChildren', () => ({
        before: childrenAtStart,
        after: wrap.children.length,
        restored: wrap.children.length === childrenAtStart,
      }));
      check('resetRemovedInline', () => document.getElementById('para').style.outline);

      /* ------------------------------------------------------------------ *
       * Unmounting mid-gesture has to hand the page back intact.
       *
       * The dragged element carries an inline `pointer-events: none` that only the
       * drag teardown removes, so an engine that forgot to cancel would leave a
       * permanently unclickable element behind with no visible sign of why.
       * ------------------------------------------------------------------ */
      const abandoned = document.getElementById('title');
      engine.startDrag(abandoned, 60, 60);
      check('abandonedDragStarted', () => abandoned.hasAttribute('data-heo-dragging'));

      api.unmount();
      check('unmountReleasedTheDrag', () => ({
        attribute: !abandoned.hasAttribute('data-heo-dragging'),
        pointerEvents: abandoned.style.pointerEvents === '',
        state: engine.store.value.drag === null,
      }));
      // The queued dwell tick must not fire against a torn-down engine.
      await new Promise((r) => setTimeout(r, 300));
      check('unmountedHost', () => !document.querySelector('html-editor-overlay'));
      check('unmountedPageStyles', () => !document.getElementById('heo-page-styles'));
      check('editAttrCleared', () => !document.documentElement.hasAttribute('data-heo-edit'));

      results.__errors = errors;
      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify(results, null, 1) + ':END';
    })();
  </script>
</body>

</html>
