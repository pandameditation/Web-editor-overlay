      const cssPanel = langPanel('css');
      check('cssPanelListsSheets', () =>
        Array.from(cssPanel.shadowRoot.querySelectorAll('.sheet .name')).map((n) => n.textContent).join(','));
      check('cssPanelShowsRuleCounts', () =>
        Array.from(cssPanel.shadowRoot.querySelectorAll('.sheet .count')).length > 0);
      check('cssPanelLoadedSource', () =>
        cssPanel.shadowRoot.querySelector('heo-code-editor')?.code.includes('.card'));
      const styleTag = document.querySelector('head style');
      const cssBefore = styleTag.textContent;
      cssPanel.shadowRoot.querySelector('heo-code-editor').dispatchEvent(
        new CustomEvent('code-input', {
          detail: { value: `${cssBefore}\n.injected-by-panel { outline: 3px solid red }` },
          bubbles: true,
          composed: true,
        }),
      );
      await frame();
      cssPanel.shadowRoot.querySelector('.btn.primary')
        .dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      check('cssPanelAppliedTheEdit', () => {
        const probe = document.createElement('div');
        probe.className = 'injected-by-panel';
        document.body.appendChild(probe);
        const applied = getComputedStyle(probe).outlineColor;
        probe.remove();
        return applied;
      });
      /*
       * The sheet edit reaches the change set at all.
       *
       * It used not to, and the failure was invisible: this check returned `undefined`,
       * which `JSON.stringify` drops, so the report simply had no line for it. The cause
       * was the recorder clipping a sheet's before and after text to 300 characters —
       * an edit appended to a stylesheet longer than that produced two identical clips,
       * and the net-change reduction concluded nothing had changed and discarded the
       * record. Values are recorded in full now, so the difference is visible again.
       */
      check('cssPanelRecordedTheFile', () => {
        const record = engine.records.find((r) => r.summary.startsWith('Edit the CSS'));
        return record ? record.detail.scope : 'MISSING: the sheet edit was dropped';
      });
      api.undo();
      await frame();
      check('cssPanelEditUndone', () => !styleTag.textContent.includes('injected-by-panel'));
      engine.history.clear();
      // Leave the Code tab where later checks expect to find it: on HTML.
      engine.setCodeTab('html');
      await frame();

      /* ------------------------------------------------------------------ *
       * Reordering may only move siblings; changing parent needs a held gesture.
       *
       * This is the anti-flicker rule with teeth: an unscoped drag re-parented on
       * any pointer move, and since a re-parent reflows ancestors too, the next
       * sample saw a different page and proposed something else.
       * ------------------------------------------------------------------ */
      const nest = document.createElement('div');
      nest.id = 'nest';
      nest.style.cssText =
        'position:fixed;left:16px;top:200px;width:200px;display:flex;flex-direction:column;gap:6px';
      nest.innerHTML =
        '<div id="n1" style="height:40px;background:#eee">n1</div>' +
        '<div id="n2" style="height:40px;background:#ddd">n2</div>' +
        '<div id="box" style="height:90px;background:#cfc;display:flex;flex-direction:column"></div>';
      const away = document.createElement('div');
      away.id = 'away';
      away.style.cssText =
        'position:fixed;left:320px;top:200px;width:200px;display:flex;flex-direction:column;gap:6px';
      away.innerHTML = '<div id="a1" style="height:40px;background:#eef">a1</div>';
      document.body.append(nest, away);
      await frame();

      const centreOf = (id) => {
        const b = document.getElementById(id).getBoundingClientRect();
        return { x: b.left + b.width / 2, y: b.top + b.height / 2 };
      };
      const n1 = document.getElementById('n1');
      api.select(n1);
      engine.startDrag(n1, centreOf('n1').x, centreOf('n1').y);
      check('dragScopedToItsParent', () => engine.store.value.drag.home.id);

      // Crossing into the far column must not re-parent on its own.
      for (let i = 0; i < 4; i += 1) {
        engine.updateDrag(centreOf('a1').x, centreOf('a1').y);
        await wait(25);
      }
      check('crossingDoesNotReparent', () => ({
        home: engine.store.value.drag.home.id,
        parent: n1.parentElement.id,
        waiting: engine.store.value.drag.waiting,
      }));
      // Holding out there does.
      await wait(520);
      check('holdingOutsideReparents', () => ({
        home: engine.store.value.drag.home.id,
        parent: n1.parentElement.id,
      }));
      engine.cancelDrag();
      check('cancelRestoredTheParent', () => n1.parentElement.id);

      // Let the restore animation land before measuring: a FLIP is a transform, and
      // getBoundingClientRect reports transformed boxes, so a coordinate taken
      // mid-glide points at where an element is passing through rather than where it
      // lives.
      await wait(240);

      // Resting inside a container nests into it, but only after the hold.
      const boxCentre = centreOf('box');
      engine.startDrag(n1, centreOf('n1').x, centreOf('n1').y);
      engine.updateDrag(boxCentre.x, boxCentre.y);
      check('restingBrieflyDoesNotNest', () => ({
        parent: n1.parentElement.id,
        waiting: engine.store.value.drag.waiting,
      }));
      await wait(520);
      check('holdingInsideNests', () => ({
        home: engine.store.value.drag.home.id,
        parent: n1.parentElement.id,
      }));
      engine.endDrag();
      check('nestedMoveRecorded', () => engine.records.some((r) => r.kind === 'move'));
      api.undo();
      check('nestedMoveUndone', () => n1.parentElement.id);
      nest.remove();
      away.remove();
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * Replace swaps an element out, and undo survives the replacement being
       * moved afterwards — repositioning what you just inserted is the expected
       * next action, and it invalidates the anchor undo would like to use.
       * ------------------------------------------------------------------ */
      engine.history.clear();
      const victim = document.createElement('p');
      victim.id = 'victim';
      victim.textContent = 'Replace me';
      document.getElementById('wrap').appendChild(victim);
      const elsewhere = document.createElement('div');
      elsewhere.id = 'elsewhere';
      document.body.appendChild(elsewhere);

      const swapped = engine.insertMarkup('<section id="fresh">new</section>', {
        reference: victim,
        position: 'replace',
      });
      check('replaceSwappedIn', () => !!swapped && swapped.id === 'fresh');
      check('replaceRemovedTheOriginal', () => document.getElementById('victim') === null);
      check('replaceRecordKind', () =>
        (engine.records.find((r) => r.kind === 'replace') || {}).summary);

      api.undo();
      check('replaceUndone', () => ({
        originalBack: !!document.getElementById('victim'),
        replacementGone: !swapped.isConnected,
      }));
      api.redo();
      check('replaceRedone', () => !document.getElementById('victim') && swapped.isConnected);

      // Now move the replacement out of its parent and undo anyway.
      elsewhere.appendChild(swapped);
      api.undo();
      check('replaceUndoneAfterTheReplacementMoved', () => ({
        originalBack: !!document.getElementById('victim'),
        replacementGone: !swapped.isConnected,
        parentOfOriginal: document.getElementById('victim')?.parentElement?.id,
      }));
      document.getElementById('victim')?.remove();
      elsewhere.remove();
      engine.history.clear();

      /* ------------------------------------------------------------------ *
       * The value field's list has to reach the top layer.
       *
       * It lives inside the dock, whose backdrop-filter makes it the containing
       * block for fixed descendants and whose overflow clips them, so a plainly
       * positioned popup lands hundreds of pixels away and invisible.
       * ------------------------------------------------------------------ */
      api.openPanel('styles');
      api.select(document.getElementById('para'));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const stylesPanelEl = dockPanel('styles');
      const valueFieldFor = (property) =>
        Array.from(stylesPanelEl.shadowRoot.querySelectorAll('heo-value-field'))
          .find((f) => f.property === property);
      const typeInto = async (field, text) => {
        const input = field.shadowRoot.querySelector('input[type=text]');
        input.focus();
        input.value = text;
        input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        return input;
      };
      const optionsOf = (field) =>
        Array.from(field.shadowRoot.querySelector('.popup')?.querySelectorAll('.option') ?? [])
          .map((b) => b.querySelector('.name').textContent.trim());

      const overflow = valueFieldFor('overflow');
      await typeInto(overflow, 'hid');
      check('valuePopupReachesTopLayer', () =>
        overflow.shadowRoot.querySelector('.popup')?.matches(':popover-open') === true);
      check('valuePopupNotClippedByTheDock', () => {
        const popup = overflow.shadowRoot.querySelector('.popup').getBoundingClientRect();
        const anchor = overflow.getBoundingClientRect();
        return Math.abs(popup.left - anchor.left) < 24 && popup.top > anchor.top;
      });
      check('keywordAutocomplete', () => optionsOf(overflow).join(','));
      await typeInto(overflow, '');
      check('keywordsLeadForKeywordProperties', () => optionsOf(overflow).slice(0, 3).join(','));

      const colour = valueFieldFor('color');
      await typeInto(colour, 'ac');
      check('tokenSearchableByName', () => optionsOf(colour).join(','));
      // The whole trailing strip opens the list, and it survives the blur debounce.
      colour.shadowRoot.querySelector('input[type=text]').blur();
      await new Promise((r) => setTimeout(r, 200));
      const strip = colour.shadowRoot.querySelector('.trailing');
      strip.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, composed: true, cancelable: true }));
      strip.dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await new Promise((r) => setTimeout(r, 250));
      check('trailingStripStaysOpen', () => !!colour.shadowRoot.querySelector('.popup'));

      /* ------------------------------------------------------------------ *
       * The class field is a submit control: Enter and the add button both act,
       * and neither may substitute a similarly named class for what was typed.
       * ------------------------------------------------------------------ */
      const target = document.getElementById('para');
      const classField = () =>
        Array.from(stylesPanelEl.shadowRoot.querySelectorAll('heo-value-field')).find((f) => f.action);
      const classesBefore = Array.from(target.classList);
      const typed = await typeInto(classField(), 'car');
      check('classFieldSuggests', () => optionsOf(classField()).join(','));
      check('classFieldPreselectsNothing', () =>
        classField().shadowRoot.querySelector('.option[aria-selected="true"]') === null);
      typed.dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Enter', bubbles: true, composed: true, cancelable: true,
      }));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      // Exactly what was typed, and nothing the suggestion list merely offered.
      check('enterAddsOnlyWhatWasTyped', () =>
        Array.from(target.classList).filter((n) => !classesBefore.includes(n)).join(','));
      check('classFieldClearsAfterAdding', () =>
        classField().shadowRoot.querySelector('input[type=text]').value === '');

      await typeInto(classField(), 'from-button');
      classField().shadowRoot.querySelector('.action')
        .dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      check('addButtonAdds', () => target.classList.contains('from-button'));

      /* ------------------------------------------------------------------ *
       * The three page languages share one fullscreen code view.
       *
       * Each used to expand into its own modal, owned by the panel it came from — so
       * reaching another language meant collapse, switch dock tab, find the expand
       * button, expand, and the three could not be compared at all. Worse, the modal
       * died with its panel, which is precisely what switching language does.
       * ------------------------------------------------------------------ */
      api.select(document.getElementById('para'));
      api.openPanel('code');
      await frame();
      await wait(140);
      const workspace = () => overlayRoot().shadowRoot.querySelector('heo-code-workspace');
      check('noSharedViewUntilAsked', () => workspace() === null);

      const htmlEditor = langPanel().shadowRoot.querySelector('heo-code-editor');
      const bufferBefore = htmlEditor.code;
      htmlEditor.shadowRoot.querySelector('.grow')
        .dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await wait(280);
      await frame();
      check('expandingOpensTheSharedView', () => Boolean(workspace()));
      const wsRoot = () => workspace().shadowRoot;
      check('itSitsInTheTopLayer', () => Boolean(wsRoot().querySelector('dialog')?.open));
      /*
       * Opaque, and not by accident.
       *
       * The surface was authored against a custom property the theme never defined, and
       * an undefined property with no fallback invalidates the whole declaration — so
       * `background` computed to transparent and the page showed through the code. The
       * backdrop is meant to be translucent; the panel carrying text is not.
       */
      check('theSharedViewHasAnOpaqueSurface', () => {
        const colour = getComputedStyle(wsRoot().querySelector('dialog')).backgroundColor;
        // The theme is authored in oklch, where alpha appears as `/ n%` rather than a
        // fourth channel, so a slash is what "translucent" looks like here.
        return colour !== 'transparent' && !colour.includes('/');
      });
      check('andNothingOfThePageIsReachableThroughIt', () => {
        const box = wsRoot().querySelector('dialog').getBoundingClientRect();
        const hit = document.elementFromPoint(box.x + box.width / 2, box.y + 40);
        return hit !== null && document.querySelector('html-editor-overlay').contains(hit);
      });

      check('itEscapesTheDock', () => {
        const dock = dockEl().shadowRoot.querySelector('.dock').getBoundingClientRect();
        return wsRoot().querySelector('dialog').getBoundingClientRect().width > dock.width;
      });
      const wsTabs = () => Array.from(wsRoot().querySelectorAll('header .tabs button'));
      check('itOffersAllThreeLanguages', () =>
        wsTabs().map((b) => b.textContent.trim()).join(','));
      check('itOpensOnTheLanguageItWasCalledFrom', () =>
        wsTabs().find((b) => b.getAttribute('aria-selected') === 'true').textContent.trim());
      check('theHostedCopyDoesNotOfferToExpandAgain', () =>
        wsRoot().querySelector('heo-code-panel').shadowRoot
          .querySelector('heo-code-editor').shadowRoot.querySelector('.grow') === null);

      /* Switching language keeps the view open. This is the whole point of it. */
      wsTabs().find((b) => b.textContent.trim() === 'CSS').click();
      await wait(240);
      await frame();
      check('switchingLanguageKeepsTheViewOpen', () =>
        Boolean(wsRoot().querySelector('dialog')?.open));
      check('andShowsThatLanguage', () => Boolean(wsRoot().querySelector('heo-css-panel')));
      check('andTheDockFollowsSoCollapsingLandsThere', () => api.getState().dockTab);
      wsTabs().find((b) => b.textContent.trim() === 'JS').click();
      await wait(240);
      await frame();
      check('andJsToo', () => Boolean(wsRoot().querySelector('heo-js-panel')));

      // Mod+digit is the fast path between them.
      wsRoot().querySelector('dialog').dispatchEvent(new KeyboardEvent('keydown', {
        key: '1', metaKey: true, bubbles: true, composed: true, cancelable: true,
      }));
      await wait(240);
      await frame();
      check('modDigitSwitchesLanguage', () => Boolean(wsRoot().querySelector('heo-code-panel')));

      /* Escape leaves the big view; it never discards a buffer. */
      wsRoot().querySelector('dialog').dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Escape', bubbles: true, composed: true, cancelable: true,
      }));
      await wait(260);
      await frame();
      check('escapeCollapsesWithoutDiscarding', () => ({
        closed: workspace() === null,
        kept: langPanel().shadowRoot.querySelector('heo-code-editor').code === bufferBefore,
      }));

      /* ------------------------------------------------------------------ *
       * With nothing selected, the HTML tab is the whole document.
       *
       * It used to say "select an element" and stop; then it grew a two-tab
       * head-or-body split of its own. Both are gone: the HTML tab now always shows
       * the full file, doctype to </html>, whether or not anything is selected — one
       * fewer decision, and nothing this editor can reach is hidden behind a click
       * that was never obvious to make. SEO moved out to its own dock tab, since it
       * is a different job with different fields, not a way of looking at markup.
       * ------------------------------------------------------------------ */
      api.select(null);
      api.openPanel('code');
      await frame();
      await wait(180);
      const docPanel = () => langPanel();
      check('nothingSelectedShowsTheWholeDocument', () => {
        const area = docPanel().shadowRoot.querySelector('heo-code-editor')
          .shadowRoot.querySelector('textarea');
        return /<!DOCTYPE html>/i.test(area.value) && /<head>/i.test(area.value) &&
          /id="para"/.test(area.value);
      });
      check('noEditScopeSegmentedForTheWholeDocument', () =>
        docPanel().shadowRoot.querySelector('heo-segmented') === null);

      /* ------------------------------------------------------------------ *
       * Folding, and the two things it is easy to get wrong.
       *
       * The textarea holds text, not a tree, so collapsing means rewriting what the
       * textarea shows while the full buffer stays whole. That makes the marker lines
       * load-bearing: the hidden text is stored beside them, so a marker destroyed
       * without the editor knowing would take a block of the document with it.
       * ------------------------------------------------------------------ */
      const foldEditor = () => docPanel().shadowRoot.querySelector('heo-code-editor');
      const foldArea = () => foldEditor().shadowRoot.querySelector('textarea');
      const markerCount = () => (foldArea().value.match(/⋯ \d+ lines? ⋯/g) || []).length;
      const foldButtons = () =>
        Array.from(foldEditor().shadowRoot.querySelectorAll('.gutter .ln button.fold'));

      check('styleAndScriptStartCollapsedInTheDocumentView', () => markerCount() > 0);
      check('theCollapsedBodiesAreOutOfSight', () =>
        !/heo-check-fold-sentinel/.test(foldArea().value));
      // Folding is a change to the view, so the full buffer still has everything and
      // pressing a chevron must not mark the panel dirty.
      check('theFullBufferIsUnaffectedByFolding', () =>
        /heo-check-fold-sentinel/.test(foldEditor().code));
      check('foldingDoesNotMakeTheBufferDirty', () =>
        Array.from(docPanel().shadowRoot.querySelectorAll('.foot .btn'))
          .find((b) => /apply/i.test(b.textContent)).disabled === true);

      /*
       * Alignment, which a earlier pass got wrong in a way no assertion caught: the
       * gutter kept `white-space: pre` from when it was one block of numbers, so the
       * template's own newlines rendered as blank lines and pushed every number and
       * fold control two lines away from the code it labels.
       */
      check('theGutterLinesUpWithTheCode', () => {
        const rows = Array.from(foldEditor().shadowRoot.querySelectorAll('.gutter .ln'));
        const code = foldEditor().shadowRoot.querySelector('pre').firstElementChild;
        const walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT);
        const range = document.createRange();
        range.selectNodeContents(walker.nextNode());
        // The row box is a full line-height and the glyph box is shorter, so the row
        // starts a couple of pixels above the text it labels. A whole line out is the
        // failure this is guarding against.
        const delta = rows[0].getBoundingClientRect().top - range.getBoundingClientRect().top;
        return Math.abs(delta) < 6;
      });

      /* Collapsing a container hides its children and keeps the container itself. */
      const rowButton = (line) =>
        Array.from(foldEditor().shadowRoot.querySelectorAll('.gutter .ln'))[line]
          ?.querySelector('button.fold');

      /*
       * Comments and raw text are scanned in the same pass as tags, because they cannot
       * be layered. Two failures came from trying:
       *
       * - A comment mentioning a tag ("a plain <script> tag") was read as a real
       *   element, so the scanner went hunting for its close, found the page's last one,
       *   and swallowed every fold in between — one control, on a comment.
       * - Masking comments before scanning tags inverted it: a script containing the
       *   string '<!--' opened a comment that never closed, and nothing after it was
       *   scanned at all.
       *
       * This page's own harness script contains both shapes, which is what makes the
       * check below meaningful rather than decorative.
       */
      check('tagsMentionedInsideACommentAreNotFolded', () => {
        const text = foldArea().value.split('\n');
        const commentLine = text.findIndex((l) => l.trim() === '<!--');
        // No comment in this fixture is fine; what must not happen is a fold control
        // appearing on a line of comment prose.
        if (commentLine < 0) return true;
        const prose = commentLine + 1;
        return rowButton(prose) === null;
      });
      check('foldsStillExistAfterTheHarnessScript', () => {
        // The harness script holds the literal '<!--'. If that were mistaken for a
        // comment opener, every range after it would vanish.
        const text = foldArea().value.split('\n');
        const closingHtml = text.findIndex((l) => l.trim() === '</html>');
        const anyAfter = Array.from(
          foldEditor().shadowRoot.querySelectorAll('.gutter .ln'),
        ).some((row, i) => i > 2 && i < closingHtml && row.querySelector('button.fold'));
        return anyAfter;
      });
      // A container that really spans lines. A single-line element such as the
      // paragraph has nothing between its tags, so offering a fold on it would be
      // offering to hide nothing.
      const containerLine = foldArea().value.split('\n').findIndex((l) => l.includes('id="wrap"'));
      check('aContainerTagOffersAFold', () =>
        containerLine >= 0 && Boolean(rowButton(containerLine)));
      check('aSingleLineElementOffersNoFold', () => {
        const line = foldArea().value.split('\n').findIndex((l) => l.includes('id="title"'));
        return line >= 0 && rowButton(line) === null;
      });

      /*
       * Typing into a collapsed range expands it rather than editing the marker.
       *
       * This is what keeps the hidden text safe, so it is checked directly: put the
       * caret on a marker line, send the input, and the range must open with no stray
       * character landing anywhere.
       */
      const markerIndex = foldArea().value.split('\n').findIndex((l) => /⋯ \d+ lines? ⋯/.test(l));
      const beforeMarkerLines = foldArea().value.split('\n');
      let markerOffset = 0;
      for (let i = 0; i < markerIndex; i += 1) markerOffset += beforeMarkerLines[i].length + 1;
      const caretAt = markerOffset + beforeMarkerLines[markerIndex].length;
      const markersBeforeTyping = markerCount();
      foldArea().focus();
      foldArea().setSelectionRange(caretAt, caretAt);
      foldArea().dispatchEvent(new InputEvent('beforeinput', {
        inputType: 'insertText', data: 'X', bubbles: true, cancelable: true, composed: true,
      }));
      await frame();
      await wait(120);
      check('typingOnACollapsedRangeExpandsIt', () => markerCount() === markersBeforeTyping - 1);
      check('andLeavesNoStrayCharacter', () => !/⋯ \d+ lines? ⋯X/.test(foldArea().value));
      check('andTheBufferSurvivesIt', () =>
        /heo-check-fold-sentinel/.test(foldEditor().code));

      /*
       * Clicking the pill opens it.
       *
       * It is drawn in the highlight layer, which is under the textarea and inert to the
       * pointer, so it cannot be a real button — the click lands on the textarea and is
       * resolved from where the caret ended up. A click that put the caret on a marker
       * line was a click on the pill, since a caret has no other business there.
       */
      const collapseSomething = () => {
        const line = foldArea().value.split('\n').findIndex((l) => l.includes('id="wrap"'));
        rowButton(line)?.click();
      };
      collapseSomething();
      await frame();
      await wait(120);
      const pillsBeforeClick = markerCount();
      const pillLine = foldArea().value.split('\n').findIndex((l) => /⋯ \d+ lines? ⋯/.test(l));
      const pillLines = foldArea().value.split('\n');
      let pillOffset = 0;
      for (let i = 0; i < pillLine; i += 1) pillOffset += pillLines[i].length + 1;
      const midPill = pillOffset + Math.floor(pillLines[pillLine].length / 2);
      foldArea().focus();
      foldArea().setSelectionRange(midPill, midPill);
      foldArea().dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      await wait(120);
      check('clickingAPillExpandsIt', () => markerCount() === pillsBeforeClick - 1);

      /* But a selection dragged across one must not expand it on release. */
      collapseSomething();
      await frame();
      await wait(120);
      const pillsBeforeDrag = markerCount();
      const dragLines = foldArea().value.split('\n');
      const dragLine = dragLines.findIndex((l) => /⋯ \d+ lines? ⋯/.test(l));
      let dragOffset = 0;
      for (let i = 0; i < dragLine; i += 1) dragOffset += dragLines[i].length + 1;
      foldArea().focus();
      foldArea().setSelectionRange(dragOffset, dragOffset + dragLines[dragLine].length);
      foldArea().dispatchEvent(new MouseEvent('click', { bubbles: true, composed: true }));
      await frame();
      await wait(120);
      check('aSelectionAcrossAPillLeavesItCollapsed', () => markerCount() === pillsBeforeDrag);

      /*
       * The highlight layer tracks the textarea by transform rather than by scrolling.
       *
       * Assigning scrollTop/scrollLeft clamped each layer to its own scrollable extent,
       * and the two do not share one — the textarea's horizontal scrollbar raises its
       * maximum scrollTop above the highlight layer's. The selection is painted by the
       * textarea and the glyphs by the layer underneath, so any disagreement slid the
       * highlight off its own text, worst at the edges.
       */
      foldEditor().value = Array.from(
        { length: 60 },
        (_unused, i) => `<div class="wide">${'y'.repeat(200)}</div> <!-- ${i} -->`,
      ).join('\n');
      await frame();
      await wait(160);
      const scrollArea = foldArea();
      scrollArea.scrollTop = scrollArea.scrollHeight;
      scrollArea.scrollLeft = scrollArea.scrollWidth;
      scrollArea.dispatchEvent(new Event('scroll', { bubbles: true }));
      await frame();
      check('theHighlightTracksBothAxesExactly', () => {
        const code = foldEditor().shadowRoot.querySelector('pre').firstElementChild;
        const match = /translate\(\s*(-?[\d.]+)px,\s*(-?[\d.]+)px\)/.exec(code.style.transform);
        if (!match) return false;
        return (
          Math.abs(-parseFloat(match[1]) - scrollArea.scrollLeft) < 0.5 &&
          Math.abs(-parseFloat(match[2]) - scrollArea.scrollTop) < 0.5
        );
      });
      check('theHighlightLayerIsNotItselfScrolled', () => {
        const pre = foldEditor().shadowRoot.querySelector('pre');
        return pre.scrollTop === 0 && pre.scrollLeft === 0;
      });
      api.openPanel('code');
      await frame();
      await wait(160);

      /*
       * Applying a whole-document edit must never delete a script that was already
       * running, even when the edit has nothing to do with scripts.
       *
       * `#applyDocument` strips every `<script>` out of both the live head/body
       * snapshot *and* the incoming buffer, then reattaches the live ones — cloned,
       * in their original parent — after the write. Get that wrong in either
       * direction and a change to, say, the page title silently deletes every script
       * on the page. Undo has to restore the exact same guarantee.
       */
      window.__docApplyProbe = 0;
      const probeScript = document.createElement('script');
      probeScript.id = 'doc-apply-script-probe';
      probeScript.textContent = 'window.__docApplyProbe = 1;';
      document.head.appendChild(probeScript);
      await frame();
      check('theProbeScriptRanOnceWhenAppended', () => window.__docApplyProbe === 1);
      const wholeDocEditor = () =>
        docPanel().shadowRoot.querySelector('heo-code-editor').shadowRoot.querySelector('textarea');
      const beforeDocEdit = wholeDocEditor().value;
      const docEditInput = wholeDocEditor();
      docEditInput.focus();
      docEditInput.value = beforeDocEdit.replace(
        /<title>[^<]*<\/title>/,
        '<title>Retitled by the whole-document editor</title>',
      );
      docEditInput.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      const docApplyDepth = engine.history.size;
      Array.from(docPanel().shadowRoot.querySelectorAll('.foot .btn'))
        .find((b) => /apply/i.test(b.textContent)).click();
      await wait(260);
      await frame();
      check('applyingAnUnrelatedDocEditRetitles', () => document.title);
      check('anUnrelatedDocEditDoesNotDeleteAnExistingScript', () => ({
        stillInDocument: document.getElementById('doc-apply-script-probe') !== null,
        stillRan: window.__docApplyProbe === 1,
      }));
      check('theWholeDocumentEditIsOneHistoryStep', () => engine.history.size === docApplyDepth + 1);
      const preUndoTitle = document.title;
      engine.undo();
      await wait(200);
      await frame();
      check('undoingAWholeDocumentEditRestoresTheTitle', () =>
        document.title !== preUndoTitle && document.getElementById('para') !== null);
      check('theProbeScriptSurvivesUndoToo', () =>
        document.getElementById('doc-apply-script-probe') !== null);
      probeScript.remove();
      delete window.__docApplyProbe;
      engine.history.clear();

      api.openPanel('seo');
      await frame();
      await wait(160);
      const seoPanel = () => dockPanel('seo');
      check('seoIsItsOwnDockPanel', () => Boolean(seoPanel()));
      const seoForm = () => seoPanel().shadowRoot.querySelector('heo-seo-form');
      check('theSeoPanelHostsTheForm', () => Boolean(seoForm()));
      check('theSeoPanelHasNoExpandAffordance', () =>
        seoPanel().shadowRoot.querySelector('.grow') === null);

      // Seed the head so the previews and the fallback chains have something to show.
      document.title = 'Pricing that scales with you';
      const seededMeta = [];
      const seedMeta = (attribute, name, content) => {
        const tag = document.createElement('meta');
        tag.setAttribute(attribute, name);
        tag.setAttribute('content', content);
        document.head.append(tag);
        seededMeta.push(tag);
      };
      seedMeta('name', 'description', 'Simple per-seat pricing, no minimums.');
      seedMeta('property', 'og:title', 'Pricing — Example');
      // The form reads the head on render; nothing observes meta tags for us.
      seoForm().requestUpdate();
      await frame();
      await wait(140);

      const cardText = (index) =>
        Array.from(seoForm().shadowRoot.querySelectorAll('.card'))[index]
          .textContent.replace(/\s+/g, ' ').trim();
      check('itPreviewsTheSearchResult', () => /Pricing that scales with you/.test(cardText(0)));
      check('theUnfurlFallsBackForWhatItLacks', () =>
        /no minimums/.test(cardText(1)) && /Pricing — Example/.test(cardText(2)));
      check('aMissingImageIsSaidOutLoud', () => /no image/.test(cardText(1)));
      check('lengthBudgetsAreShown', () =>
        Array.from(seoForm().shadowRoot.querySelectorAll('.count')).length > 0);

      /* Editing a field writes the tag, records it, and undoes cleanly. */
      const descBox = seoForm().shadowRoot.querySelector('textarea.input');
      descBox.focus();
      descBox.value = 'Per-seat pricing with no minimum commitment.';
      descBox.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await frame();
      const headDepth = engine.history.size;
      descBox.dispatchEvent(new Event('blur', { bubbles: true, composed: true }));
      await wait(200);
      await frame();
      check('editingAHeadFieldWritesTheTag', () =>
        document.querySelector('meta[name="description"]').getAttribute('content'));
      check('andRecordsItOnce', () => engine.history.size === headDepth + 1);
      check('theRecordNamesTheTagItWrote', () => engine.records.at(-1).summary);
      api.undo();
      await wait(180);
      check('undoingAHeadEditRestoresIt', () =>
        document.querySelector('meta[name="description"]').getAttribute('content'));

      /* A field with no tag gets one, and undo takes the tag away again. */
      const ogImageField = Array.from(
        seoForm().shadowRoot.querySelectorAll('input.input.mono'),
      ).find((input) => input.getAttribute('aria-label') === 'Image');
      ogImageField.focus();
      ogImageField.value = 'https://example.com/card.png';
      ogImageField.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      press(ogImageField, 'Enter');
      await wait(200);
      await frame();
      check('aFieldWithNoTagGetsOne', () =>
        Boolean(document.querySelector('meta[property="og:image"]')));
      api.undo();
      await wait(180);
      check('andUndoTakesThatTagAwayAgain', () =>
        document.querySelector('meta[property="og:image"]') === null);

      /* The whole-document buffer leaves the overlay out of it, applied without self-harm. */
      api.openPanel('code');
      await frame();
      await wait(160);
      const bodyArea = () =>
        docPanel().shadowRoot.querySelector('heo-code-editor')?.shadowRoot.querySelector('textarea');
      check('andLeavesTheOverlayOutOfIt', () => {
        // Parsed rather than string-matched: this page's own results element is inside
        // the document being serialized, and it quotes the tag name.
        const parsed = document.createElement('template');
        parsed.innerHTML = bodyArea()?.value ?? '';
        return parsed.content.querySelector('html-editor-overlay') === null;
      });

      /*
       * And the buffer takes the room left, rather than standing at a fixed height with
       * empty panel beneath it and its own scrollbar inside the panel's.
       */
      check('theBufferTakesTheRoomLeft', () => {
        const panelBody = docPanel().shadowRoot.querySelector('.body');
        const editor = docPanel().shadowRoot.querySelector('heo-code-editor');
        const fixed = Array.from(panelBody.children)
          .filter((child) => child.tagName.toLowerCase() !== 'heo-code-editor')
          .reduce((sum, child) => sum + child.getBoundingClientRect().height + 8, 0);
        const status = editor.shadowRoot.querySelector('.status')?.getBoundingClientRect().height ?? 0;
        const forBuffer = panelBody.getBoundingClientRect().height - 20 - fixed - status - 4;
        const shell = editor.shadowRoot.querySelector('.shell').getBoundingClientRect().height;
        return shell / forBuffer > 0.9;
      });
      check('andTheActionRowIsStillThere', () =>
        docPanel().shadowRoot.querySelector('.foot').getBoundingClientRect().height > 20);

      for (const tag of seededMeta) tag.remove();
      engine.history.clear();
      api.openPanel('styles');
      await frame();

      /* ------------------------------------------------------------------ *
       * The JS panel: the page's scripts, by source.
       *
       * Shaped like the CSS panel because they answer the same question about
       * different material. What differs is that a script has already run, so
       * applying an edit records it and updates the source without re-executing —
       * running again is a separate, explicit act.
       * ------------------------------------------------------------------ */
      const pageScript = document.createElement('script');
      pageScript.textContent = 'window.__probeRan = 1;';
      document.body.append(pageScript);
      api.openPanel('code');
      await frame();
      codeTabs().shadowRoot.querySelectorAll('.strip button')[2].click();
      await frame();
      await wait(200);
      const jsPanel = () => langPanel('js');
      const scriptRows = () => Array.from(jsPanel().shadowRoot.querySelectorAll('.file'));
      check('theJsPanelListsThePagesScripts', () => scriptRows().length > 0);
      check('andExcludesTheOverlaysOwnBundle', () =>
        !scriptRows().some((r) => /html-editor-overlay/.test(r.textContent)));
      const ourRow = scriptRows().find((r) => {
        r.click();
        return true;
      });
      // Select the one we just added: it is the last inline script on the page.
      const inlineRows = scriptRows().filter((r) => /inline script/.test(r.textContent));
      inlineRows[inlineRows.length - 1].click();
      await wait(220);
      await frame();
      const jsArea = () =>
        jsPanel().shadowRoot.querySelector('heo-code-editor')?.shadowRoot.querySelector('textarea');
      check('selectingAScriptLoadsItsSource', () => (jsArea()?.value ?? '').includes('__probeRan'));

      /* A syntax error is caught by the browser's own parser, before Apply. */
      jsArea().focus();
      jsArea().value = 'const = ;';
      jsArea().dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await wait(200);
      await frame();
      check('badSyntaxBlocksApply', () =>
        Array.from(jsPanel().shadowRoot.querySelectorAll('.foot .btn'))
          .find((b) => /apply/i.test(b.textContent)).disabled);

      /* A good edit applies: recorded, DOM text updated, nothing executed. */
      jsArea().focus();
      jsArea().value = 'window.__probeRan = 42;';
      jsArea().dispatchEvent(new Event('input', { bubbles: true, composed: true }));
      await wait(200);
      await frame();
      const jsDepth = engine.history.size;
      Array.from(jsPanel().shadowRoot.querySelectorAll('.foot .btn'))
        .find((b) => /apply/i.test(b.textContent)).click();
      await wait(240);
      await frame();
      check('applyingAScriptRecordsAChange', () => engine.history.size === jsDepth + 1);
      check('andRewritesTheSourceInTheDocument', () => /42/.test(pageScript.textContent));
      check('butDoesNotReExecuteIt', () => window.__probeRan === 1);
      check('theRecordNamesTheScript', () => engine.records.at(-1).summary);

      /* Running is the separate, deliberate act. */
      Array.from(jsPanel().shadowRoot.querySelectorAll('.foot .btn'))
        .find((b) => /^run$/i.test(b.textContent.trim())).click();
      await wait(220);
      check('runningItExecutesTheNewSource', () => window.__probeRan === 42);
      check('runningLeavesNoScriptBehind', () =>
        document.querySelectorAll('script[data-heo-ignore]').length === 0);
      pageScript.remove();
      engine.history.clear();
      api.openPanel('styles');
      await frame();

      /* Reset reverts everything still on the undo stack.
       *
       * Measured against a known starting point rather than the state at the top
       * of this file: the assertions above clear history deliberately, and a
       * cleared command can no longer be reverted by design. */
      engine.history.clear();
      const wrap = para.parentElement;
      const childrenAtStart = wrap.children.length;
      engine.insertMarkup('<span class="reset-probe">a</span>', { reference: para, position: 'after' });
      engine.insertMarkup('<span class="reset-probe">b</span>', { reference: para, position: 'after' });
      engine.setStyle('outline', '2px solid red', para);
      await new Promise((r) => setTimeout(r, 60));
      check('changesBeforeReset', () => engine.records.length);
      check('childrenBeforeReset', () => wrap.children.length - childrenAtStart);

      api.reset();
      check('resetChanges', () => engine.records.length);
      check('resetChildren', () => ({
        before: childrenAtStart,
        after: wrap.children.length,
        restored: wrap.children.length === childrenAtStart,
      }));
      check('resetRemovedInline', () => document.getElementById('para').style.outline);

      /* ------------------------------------------------------------------ *
       * Unmounting mid-gesture has to hand the page back intact.
       *
       * The dragged element carries an inline `pointer-events: none` that only the
       * drag teardown removes, so an engine that forgot to cancel would leave a
       * permanently unclickable element behind with no visible sign of why.
       * ------------------------------------------------------------------ */
      const abandoned = document.getElementById('title');
      engine.startDrag(abandoned, 60, 60);
      check('abandonedDragStarted', () => abandoned.hasAttribute('data-heo-dragging'));

      api.unmount();
      check('unmountReleasedTheDrag', () => ({
        attribute: !abandoned.hasAttribute('data-heo-dragging'),
        pointerEvents: abandoned.style.pointerEvents === '',
        state: engine.store.value.drag === null,
      }));
      // The queued dwell tick must not fire against a torn-down engine.
      await new Promise((r) => setTimeout(r, 300));
      check('unmountedHost', () => !document.querySelector('html-editor-overlay'));
      check('unmountedPageStyles', () => !document.getElementById('heo-page-styles'));
      check('editAttrCleared', () => !document.documentElement.hasAttribute('data-heo-edit'));

      results.__errors = errors;
      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify(results, null, 1) + ':END';
    })();
  </script>
</body>

</html>
