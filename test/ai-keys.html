<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>An API key never travels: not in the seed, the markup, or a change record</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
    }

    #report {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <main id="main">
    <article id="subject" class="card">
      <h2>A heading.</h2>
    </article>
  </main>

  <div id="report">
    <pre id="progress">start</pre>
    <pre id="out">pending</pre>
  </div>

  <script type="module">
    (async () => {
      const errors = [];
      addEventListener('error', (e) => errors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

      const progress = document.getElementById('progress');
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const results = {};

      const { mount } = await import('../dist/html-editor-overlay.js');
      const api = mount({ theme: 'dark', presets: false, detectScriptContent: false });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      const subject = document.getElementById('subject');

      /**
       * Built at runtime, and that is the whole reason this fixture is trustworthy.
       *
       * The first version used a literal, and two assertions failed for the wrong reason: the
       * key appeared in `document.documentElement.outerHTML` and in `exportHTML()` because *this
       * script* contains it, not because anything leaked. A value that exists nowhere in the
       * page source means any occurrence found below is a real leak, which is what the
       * assertions claim to be measuring.
       */
      const SECRET = `sk-heo-${crypto.randomUUID().replace(/-/g, '')}`;

      /**
       * The two sets this fixture works with.
       *
       * A function rather than a one-off, because importing a design system *replaces* the
       * provider list by design — the order of that list is its priority, so merging two
       * imports would produce an order nobody chose. The group that imports a hostile document
       * therefore wipes these, and the groups after it have to put them back.
       */
      const installSets = async () => {
        engine.ai.import([
          {
            id: 'primary', label: 'My OpenAI', transport: 'in-page',
            provider: 'openai', baseURL: 'https://api.openai.com/v1', model: 'gpt-4o-mini',
            systemPrompt: 'Prefer short copy.',
          },
          {
            id: 'local', label: 'Ollama', transport: 'local',
            provider: 'openai-compatible', baseURL: 'http://127.0.0.1:11434/v1', model: 'llama3',
          },
        ]);
        await frames();
      };
      await installSets();

      /* ------------------------------------------------------------------ *
       * 1. A key is held for the session and reported without being shown.
       * ------------------------------------------------------------------ */
      progress.textContent = 'holdsAKeyForTheSession';
      {
        const stored = await engine.ai.setKey('primary', SECRET);
        await frames();
        const status = engine.ai.keyStatus('primary');
        results.holdsAKeyForTheSession = {
          persistence: stored.persistence,
          keptForTheTab: stored.persistence === 'session',
          present: status.present,
          notLocked: status.locked === false,
          // The hint is the last four characters and nothing else: enough to tell two keys
          // apart, useless to anyone who reads it.
          hint: status.hint,
          hintIsShort: (status.hint ?? '').length === 4,
          hintIsNotTheKey: !SECRET.startsWith(status.hint ?? SECRET),
          // A set with no key is honestly reported as unusable rather than failing later.
          otherSetNeedsNothing: engine.ai.ready(engine.ai.get('local')) === true,
        };
        const group = results.holdsAKeyForTheSession;
        group.ok =
          group.keptForTheTab === true &&
          group.present === true &&
          group.notLocked === true &&
          group.hintIsShort === true &&
          group.hintIsNotTheKey === true &&
          group.otherSetNeedsNothing === true;
      }

      /* ------------------------------------------------------------------ *
       * 2. The seed carries the providers and not the key.
       *
       * The assertion this whole fixture exists for. A seed is pasted into messages and
       * committed to files, so a key in one is a key with no way back.
       * ------------------------------------------------------------------ */
      progress.textContent = 'theSeedCarriesNoKey';
      {
        const seed = await api.exportSeed();
        const json = JSON.stringify(engine.designSystem());
        const decoded = await engine.decodeSeedText(seed);

        results.theSeedCarriesNoKey = {
          seedLength: seed.length,
          // Both artefacts a user can hand over.
          seedHasNoSecret: !seed.includes(SECRET),
          jsonHasNoSecret: !json.includes(SECRET),
          // Nor any field that could hold one, however it was spelled.
          jsonHasNoKeyField: !/"(apiKey|api_key|key|secret|token)"\s*:/i.test(json),
          // And it does carry the settings, or it would be safe by being empty.
          carriesBothSets: (decoded?.ai ?? []).length === 2,
          carriedTheModel: (decoded?.ai ?? []).some((one) => one.model === 'gpt-4o-mini'),
          // Settings travel; permission does not. Scope is a per-request choice, not a set field.
          carriedNoScope: (decoded?.ai ?? []).every((one) => one.scope === undefined),
          carriedTheSystemPrompt: (decoded?.ai ?? []).some(
            (one) => one.systemPrompt === 'Prefer short copy.',
          ),
          setsHaveNoSecretField: (decoded?.ai ?? []).every(
            (one) => !Object.keys(one).some((name) => /key|secret|token/i.test(name)),
          ),
        };
        const group = results.theSeedCarriesNoKey;
        group.ok =
          group.seedHasNoSecret === true &&
          group.jsonHasNoSecret === true &&
          group.jsonHasNoKeyField === true &&
          group.carriesBothSets === true &&
          group.carriedTheModel === true &&
          group.carriedNoScope === true &&
          group.carriedTheSystemPrompt === true &&
          group.setsHaveNoSecretField === true;
      }

      /* ------------------------------------------------------------------ *
       * 3. The counts line says how many sets travel.
       * ------------------------------------------------------------------ */
      progress.textContent = 'theTallyCountsTheSets';
      {
        const stats = await engine.seedStatsNow();
        results.theTallyCountsTheSets = {
          aiSets: stats?.aiSets ?? null,
          countedBoth: stats?.aiSets === 2,
          // The rest of the tally still works, so the addition did not displace anything.
          hasTokens: typeof stats?.tokens === 'number',
          hasBlocks: typeof stats?.blocks === 'number',
        };
        const group = results.theTallyCountsTheSets;
        group.ok =
          group.countedBoth === true && group.hasTokens === true && group.hasBlocks === true;
      }

      /* ------------------------------------------------------------------ *
       * 4. A document offering a key has it stripped on the way in.
       *
       * Untrusted input, so the gate has to be on the import and not only on the export.
       * ------------------------------------------------------------------ */
      progress.textContent = 'strippedOnTheWayIn';
      {
        const hostile = {
          name: 'Hostile system',
          version: 1,
          tokens: [], classes: [], blocks: [],
          ai: [{
            id: 'sneaky', label: 'Sneaky', transport: 'in-page', provider: 'openai',
            baseURL: 'https://evil.example/v1', model: 'gpt-4o-mini',
            // A permission, which a document has no business carrying at all now: scope is chosen
            // per request in the popover and is not a portable field.
            scope: { classes: 'always', rules: 'always', parent: 'always' },
            // Every one of these must be gone by the time it reaches the registry.
            apiKey: SECRET, api_key: SECRET, secret: SECRET, headers: { authorization: SECRET },
          }],
        };
        engine.importDesignSystem(hostile, { overwrite: true });
        await frames();
        const arrived = engine.ai.get('sneaky');
        const reExported = JSON.stringify(engine.designSystem());

        results.strippedOnTheWayIn = {
          setArrived: Boolean(arrived),
          fields: arrived ? Object.keys(arrived).sort().join(',') : null,
          // Exactly the portable fields, nothing more.
          onlyPortableFields: arrived
            ? Object.keys(arrived).every((name) =>
              ['id', 'label', 'transport', 'provider', 'baseURL', 'model', 'systemPrompt']
                .includes(name))
            : false,
          /*
           * And no scope came with it.
           *
           * A document used to be able to decide what the AI could change on your page, because
           * permission was a provider field and providers travel in a seed. It is a per-request
           * choice now, so a document offering one is offering something that no longer exists.
           */
          scopeDidNotTravel: arrived ? !('scope' in arrived) : false,
          noScopeInTheExport: !/"scope"/.test(reExported),
          noSecretSurvived: !reExported.includes(SECRET),
          /*
           * Importing replaces the provider list rather than merging into it.
           *
           * Asserted rather than assumed, because it is a designed behaviour that is easy to
           * mistake for a bug: the list's order *is* its priority, so a merge would decide the
           * default provider by import order. This is also why the groups after this one
           * reinstall the sets they need.
           */
          replacedRatherThanMerged: engine.ai.list().length === 1,
          // The credential survives the set being replaced: the vault is keyed by set id, and
          // forgetting a key is a separate act from reconfiguring providers.
          originalKeyStillHeld: engine.ai.keyStatus('primary').present,
        };
        const group = results.strippedOnTheWayIn;
        group.ok =
          group.setArrived === true &&
          group.onlyPortableFields === true &&
          group.noSecretSurvived === true &&
          group.scopeDidNotTravel === true &&
          group.noScopeInTheExport === true &&
          group.replacedRatherThanMerged === true &&
          group.originalKeyStillHeld === true;
      }

      /* ------------------------------------------------------------------ *
       * 3b. Settings and a remembered key live in the same place, so a second tab has both.
       *
       * The asymmetry this fixes: a key saved with "remember on this machine" goes to
       * localStorage and crosses tabs, while the provider list went to sessionStorage and did not.
       * Opening the same URL in a second tab produced the worst of both — the credential was
       * there, the provider that owns it was not, and the user retyped a model name to reunite
       * them.
       * ------------------------------------------------------------------ */
      progress.textContent = 'settingsAndKeyShareOneHome';
      {
        const SETS = 'heo.ai.sets';
        const SCOPE = 'heo.ai.scope';
        localStorage.removeItem(SETS);
        localStorage.removeItem(SCOPE);
        sessionStorage.removeItem(SETS);
        sessionStorage.removeItem(SCOPE);
        engine.ai.import([]);

        engine.ai.upsert({
          id: 'cross-tab', label: 'Cross tab', transport: 'in-page',
          provider: 'openai', baseURL: 'https://api.openai.com/v1', model: 'gpt-4.1-mini',
          systemPrompt: 'Prefer short copy.',
        });
        engine.ai.activate('cross-tab');
        engine.setAiContextScope('classes', true);
        const keySaved = await engine.ai.setKey('cross-tab', SECRET, 'origin');
        await frames();

        /*
         * What a second tab would find: the same origin storage, none of this tab's memory.
         *
         * sessionStorage is deliberately left out of the read — that is the whole point. A second
         * tab gets its own, so anything that landed only there is invisible to it.
         */
        const acrossTabs = {
          sets: localStorage.getItem(SETS),
          scope: localStorage.getItem(SCOPE),
          key: Object.keys(localStorage).some((name) => name.startsWith('heo.ai.origin.')),
        };
        const rebuilt = JSON.parse(acrossTabs.sets ?? 'null');

        results.settingsAndKeyShareOneHome = {
          keySavedTo: keySaved.persistence,
          // Both halves reachable from a new tab, which was the complaint.
          settingsCrossTabs: Boolean(acrossTabs.sets),
          scopeCrossesTabs: Boolean(acrossTabs.scope),
          keyCrossesTabs: acrossTabs.key === true,
          // Nothing left behind in the per-tab store to disagree with them later.
          nothingStrandedInSession:
            sessionStorage.getItem(SETS) === null && sessionStorage.getItem(SCOPE) === null,
          // The settings carry what was typed.
          carriedTheProvider: (rebuilt?.sets ?? []).some(
            (one) => one.id === 'cross-tab' && one.model === 'gpt-4.1-mini' &&
              one.transport === 'in-page' && one.systemPrompt === 'Prefer short copy.',
          ),
          carriedTheDefault: rebuilt?.activeId === 'cross-tab',
          carriedTheScope: JSON.parse(acrossTabs.scope ?? 'null')?.classes === true,
          /*
           * And still no credential among them.
           *
           * The reason widening the home is safe at all: a set is rebuilt from PORTABLE_FIELDS, and
           * no key is one. The key has its own entry, under its own prefix, on the tier the user
           * opted into.
           */
          noSecretInTheSettings: !(acrossTabs.sets ?? '').includes(SECRET),
        };
        const group = results.settingsAndKeyShareOneHome;
        // Off loopback the origin tier is refused by design, so only assert what can apply.
        group.ok = keySaved.persistence === 'origin'
          ? Object.entries(group).every(([key, value]) => key === 'ok' || key === 'keySavedTo' || value === true)
          : group.settingsCrossTabs === true && group.noSecretInTheSettings === true;

        engine.ai.clearKey('cross-tab');
        // Back to minimal in memory as well as in storage: the scope is sticky by design, and the
        // group after this one asserts what a fresh choice writes.
        engine.setAiContextScope('classes', false);
        localStorage.removeItem(SETS);
        localStorage.removeItem(SCOPE);
        engine.ai.import([]);
        await installSets();
      }

      /* ------------------------------------------------------------------ *
       * 4a. Edits to a discovered provider survive a reload.
       *
       * The reported case, in order: a provider the dev server discovered is switched to an
       * in-page key, given a model name, made the default — and after a reload it was back to
       * "Dev server" with the environment's model. The rule that stopped a removed key coming back
       * to life was also throwing away every edit made to one.
       * ------------------------------------------------------------------ */
      progress.textContent = 'editsToADiscoveredProviderSurvive';
      {
        const KEY = 'heo.ai.sets';
        localStorage.removeItem(KEY);
        engine.ai.import([]);

        // What the dev server hands over: proxied, its own model, no base URL.
        const discovered = {
          id: 'heo-env-openai', label: 'OpenAI', transport: 'proxy',
          provider: 'openai', model: 'gpt-4o-mini',
        };
        engine.ai.offer([discovered]);

        // What the user then does to it.
        engine.ai.upsert({
          ...engine.ai.get('heo-env-openai'),
          transport: 'in-page',
          baseURL: 'https://api.openai.com/v1',
          model: 'gpt-4.1-mini',
        });
        engine.ai.activate('heo-env-openai');
        await frames();

        const written = JSON.parse(localStorage.getItem(KEY) ?? 'null');

        /*
         * A reload, simulated as one: empty memory, storage untouched.
         *
         * `import([])` alone is not a reload — it is a design-system import replacing the list, and
         * it rewrites storage on the way through, which wipes the very entry under test. So the
         * written blob is put back before `restore` reads it, which is the state a new tab starts
         * in. Then `restore` runs before `offer`, as it does at mount: the discovered set does not
         * exist at that moment, which is exactly why the override has to be held rather than
         * applied, and doing it in this order is the point rather than an incidental detail.
         */
        const reload = (offering) => {
          engine.ai.import([]);
          localStorage.setItem(KEY, JSON.stringify(written));
          engine.ai.restore();
          const held = engine.ai.get('heo-env-openai');
          engine.ai.offer(offering);
          return { held, after: engine.ai.get('heo-env-openai') };
        };

        const reloaded = reload([discovered]);
        const beforeOffer = reloaded.held;
        const after = reloaded.after;

        // And a provider whose key has gone from .env must not come back.
        const whenNoLongerOffered = reload([]).after;

        // A field the user never touched still tracks the environment.
        const renamed = reload([{ ...discovered, label: 'OpenAI (renamed upstream)' }]).after;

        results.editsToADiscoveredProviderSurvive = {
          // The whole set is not stored — that is what would resurrect it.
          storedNoDiscoveredSet: (written?.sets ?? []).every((one) => one.id !== 'heo-env-openai'),
          // Only the changed fields are.
          storedOverride: written?.overrides?.['heo-env-openai'] ?? null,
          overrideCarriesTheEdits:
            written?.overrides?.['heo-env-openai']?.transport === 'in-page' &&
            written?.overrides?.['heo-env-openai']?.model === 'gpt-4.1-mini',
          overrideOmitsUntouchedFields:
            written?.overrides?.['heo-env-openai']?.provider === undefined,
          // Held, not applied, until the environment offers the set again.
          absentBeforeTheOffer: beforeOffer === undefined,
          // The three reported symptoms.
          transportSurvived: after?.transport === 'in-page',
          modelSurvived: after?.model === 'gpt-4.1-mini',
          baseURLSurvived: after?.baseURL === 'https://api.openai.com/v1',
          // And which one was the default.
          activeSurvived: engine.ai.active?.id === 'heo-env-openai',
          // The property the old rule existed to protect, still true.
          notResurrected: whenNoLongerOffered === undefined,
          // A field nobody edited follows .env rather than the stored copy.
          untouchedFieldTracksTheEnvironment: renamed?.label === 'OpenAI (renamed upstream)',
          editedFieldStillWins: renamed?.model === 'gpt-4.1-mini',
        };
        const group = results.editsToADiscoveredProviderSurvive;
        group.ok = Object.entries(group).every(
          ([key, value]) => key === 'ok' || key === 'storedOverride' || value === true,
        );

        localStorage.removeItem(KEY);
        engine.ai.import([]);
        await installSets();
      }

      /* ------------------------------------------------------------------ *
       * 4b. The request scope survives a reload, and storage cannot widen it.
       *
       * It is a preference about requests rather than a provider setting, so it is kept beside the
       * provider list in sessionStorage — outliving a dev-server reload, dying with the tab. Read
       * back defensively because anything else on this origin can write there, and a scope arriving
       * with a truthy string in it would silently widen what the AI may change.
       * ------------------------------------------------------------------ */
      progress.textContent = 'theRequestScopeSurvivesAReload';
      {
        const KEY = 'heo.ai.scope';
        localStorage.removeItem(KEY);
        const beforeAnyChoice = engine.ai.restoreScope();

        engine.setAiContextScope('rules', true);
        await frames();
        const stored = JSON.parse(localStorage.getItem(KEY) ?? 'null');
        const restored = engine.ai.restoreScope();

        // Anything on this origin can write here, so a truthy string must not read as granted.
        localStorage.setItem(KEY, JSON.stringify({ classes: 'yes', rules: 1, parent: {} }));
        const hostile = engine.ai.restoreScope();
        localStorage.setItem(KEY, 'not json at all');
        const garbage = engine.ai.restoreScope();

        results.theRequestScopeSurvivesAReload = {
          // Null before a choice is made, so "never chosen" is distinguishable from "minimal".
          nullBeforeAnyChoice: beforeAnyChoice === null,
          stored,
          wroteWhatWasChosen: stored?.rules === true && stored?.classes === false,
          restored,
          readsBackWhatWasWritten: restored?.rules === true && restored?.parent === false,
          hostile,
          // Rebuilt field by field, so only a real `true` grants anything.
          truthyStringsDoNotGrant:
            hostile?.classes === false && hostile?.rules === false && hostile?.parent === false,
          garbageIsIgnored: garbage === null,
        };
        const group = results.theRequestScopeSurvivesAReload;
        group.ok =
          group.nullBeforeAnyChoice === true &&
          group.wroteWhatWasChosen === true &&
          group.readsBackWhatWasWritten === true &&
          group.truthyStringsDoNotGrant === true &&
          group.garbageIsIgnored === true;

        localStorage.removeItem(KEY);
      }

      /* ------------------------------------------------------------------ *
       * 5. Nothing about a key reaches the markup or the change set.
       * ------------------------------------------------------------------ */
      progress.textContent = 'notInTheMarkupOrTheRecords';
      {
        // Put back what the hostile import replaced, so `keyIsActuallyHeld` measures a key
        // belonging to a provider that exists.
        await installSets();
        api.select(subject);
        await frames();
        // A real change, so the record path is genuinely exercised.
        engine.setStyle('color', 'rgb(40, 40, 40)', subject);
        await frames();

        const markup = document.documentElement.outerHTML;
        const exported = engine.exportHTML();
        const records = JSON.stringify(engine.records);
        const prompt = engine.buildSavePrompt();

        results.notInTheMarkupOrTheRecords = {
          // The live page, including the overlay's own DOM and its inlined options.
          liveMarkupClean: !markup.includes(SECRET),
          // The HTML a save writes out.
          exportClean: !exported.includes(SECRET),
          // The change set handed to onSave.
          recordsClean: !records.includes(SECRET),
          // The prompt copied to the clipboard for an agent.
          promptClean: typeof prompt !== 'string' || !prompt.includes(SECRET),
          // The discriminating half: the key really is in memory, so these are not passing
          // because it was never set.
          keyIsActuallyHeld: engine.ai.keyStatus('primary').present === true,
          recordsExist: engine.records.length > 0,
        };
        const group = results.notInTheMarkupOrTheRecords;
        group.ok = Object.entries(group).every(([key, value]) => key === 'ok' || value === true);
      }

      /* ------------------------------------------------------------------ *
       * 6. Saving a key beyond the tab is refused off loopback, with a reason.
       * ------------------------------------------------------------------ */
      progress.textContent = 'persistenceIsGatedByOrigin';
      {
        const loopback = engine.ai.loopbackOrigin();
        const attempt = await engine.ai.setKey('primary', SECRET, 'origin');
        await frames();
        results.persistenceIsGatedByOrigin = {
          protocol: location.protocol,
          treatedAsLocal: loopback,
          persistence: attempt.persistence,
          refusal: attempt.refused ?? null,
          /*
           * Both outcomes are correct, and which one applies is decided by where this fixture
           * is served from. Under the suite that is `file:`, which counts as local. Asserting
           * one shape would make this fixture pass or fail on the harness rather than on the
           * product, so the assertion is the *rule*: remembered when local, refused with a
           * sentence when not.
           */
          followedTheRule: loopback
            ? attempt.persistence === 'origin' && !attempt.refused
            : attempt.persistence === 'none' && typeof attempt.refused === 'string',
          // Whichever way it went, the key is still usable this session.
          stillUsable: engine.ai.ready(engine.ai.get('primary')) === true,
        };
        const group = results.persistenceIsGatedByOrigin;
        group.ok = group.followedTheRule === true && group.stillUsable === true;
      }

      /* ------------------------------------------------------------------ *
       * 7. Forgetting a key forgets it everywhere.
       * ------------------------------------------------------------------ */
      progress.textContent = 'clearingForgetsIt';
      {
        engine.ai.clearKey('primary');
        await frames();
        const status = engine.ai.keyStatus('primary');
        let storageClean = true;
        for (const store of [sessionStorage, localStorage]) {
          for (let i = 0; i < store.length; i += 1) {
            if ((store.getItem(store.key(i)) ?? '').includes(SECRET)) storageClean = false;
          }
        }
        results.clearingForgetsIt = {
          gone: status.present === false,
          noPersistence: status.persistence === 'none',
          storageClean,
          // The set itself survives: forgetting a credential is not deleting a provider.
          setSurvived: Boolean(engine.ai.get('primary')),
          notReady: engine.ai.ready(engine.ai.get('primary')) === false,
        };
        const group = results.clearingForgetsIt;
        group.ok = Object.entries(group).every(([key, value]) => key === 'ok' || value === true);
      }

      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value === false))
        .map(([name]) => name);

      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify(
        { ok: failed.length === 0, failed, ...results, errors }, null, 1,
      ) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:{"ok":false,"__fatal":' + JSON.stringify(String((e && e.stack) || e)) + '}:END';
    });
  </script>
</body>

</html>
