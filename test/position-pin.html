<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Converting to absolute keeps the element where it is</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      font-family: system-ui, sans-serif;
    }

    /* Well away from the page origin, so a wrong reference shows up as a jump. */
    #frame {
      position: relative;
      margin: 50px 0 0 200px;
      width: 560px;
      height: 300px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
    }

    #frame>div {
      background: #bfdbfe;
    }

    #spacer {
      width: 100%;
      height: 40px;
      background: #e2e8f0;
    }

    #flowchild {
      width: 160px;
      height: 50px;
    }

    /*
     * The leap this fixture exists for.
     *
     * An out-of-flow child of a flex container takes its static position from the container's
     * content box corner, not from where the flow had put it. So a middle child converted to
     * absolute with no offsets jumps to the top-left of the row.
     */
    #flexrow {
      display: flex;
      gap: 18px;
      margin-top: 14px;
    }

    #flexrow>div {
      width: 120px;
      height: 60px;
      background: #bbf7d0;
    }

    /* Relative and displaced: the displacement has to fold into the coordinate. */
    #relmoved {
      position: relative;
      left: 40px;
      top: 20px;
      width: 140px;
      height: 50px;
      background: #fde68a;
    }

    /* Anchored from the right by a rule, so the pin must write `right`, not `left`. */
    #farright {
      position: relative;
      right: 24px;
      top: 10px;
      width: 130px;
      height: 50px;
      background: #ddd6fe;
    }

    #tofixed {
      width: 150px;
      height: 50px;
      background: #fecaca;
    }

    /*
     * --- the handles follow the Offsets section, not the display ---
     *
     * Both halves set the same four properties, so the rule is `position`. The display values are
     * varied across these cases only to prove they are not what decides it.
     */
    #kinds {
      position: relative;
      margin-top: 20px;
      height: 260px;
    }

    #kinds>* {
      margin-top: 6px;
      background: #e0f2fe;
      width: 220px;
      height: 40px;
    }

    #p-static-block {
      display: block;
    }

    #p-static-flex {
      display: flex;
    }

    #p-static-grid {
      display: grid;
    }

    /* The report that started this: a list item in normal flow, showing handles it should not. */
    #p-static-li {
      display: list-item;
    }

    #p-rel-block {
      position: relative;
    }

    #p-rel-li {
      display: list-item;
      position: relative;
    }

    /* Positioned *and* flex: the Offsets section shows, so the handles do too. */
    #p-abs-flex {
      display: flex;
      position: absolute;
      left: 260px;
      top: 0;
    }

    #p-fixed {
      position: fixed;
      left: 620px;
      top: 120px;
    }

    #p-sticky {
      position: sticky;
      top: 0;
    }

    #report {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="frame">
    <div id="spacer"></div>
    <div id="flowchild">in flow</div>
    <div id="flexrow">
      <div id="flexfirst">first</div>
      <div id="flexchild">middle</div>
      <div id="flexlast">last</div>
    </div>
    <div id="relmoved">relative, displaced</div>
    <div id="farright">anchored right</div>
    <div id="tofixed">to fixed</div>
    <div id="already" style="position:absolute;left:33px;top:210px;width:120px;height:40px;background:#a5f3fc">
      already absolute
    </div>
  </div>

  <div id="kinds">
    <div id="p-static-block">static block</div>
    <div id="p-static-flex"><span>static flex</span></div>
    <div id="p-static-grid"><span>static grid</span></div>
    <div id="p-static-li">static list-item</div>
    <div id="p-rel-block">relative block</div>
    <div id="p-rel-li">relative list-item</div>
    <div id="p-abs-flex"><span>absolute flex</span></div>
    <div id="p-fixed">fixed</div>
    <div id="p-sticky">sticky</div>
  </div>

  <div id="report">
    <pre id="progress">start</pre>
    <pre id="out">pending</pre>
  </div>

  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    (async () => {
      const errors = [];
      addEventListener('error', (e) => errors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

      const progress = document.getElementById('progress');
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const byId = (id) => document.getElementById(id);
      const api = window.HtmlEditorOverlay.mount({ theme: 'dark', detectScriptContent: false });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      const overlayRoot = () => document.querySelector('html-editor-overlay > heo-overlay');
      const layer = () => overlayRoot().shadowRoot.querySelector('heo-selection-layer');

      const near = (a, b) => Math.abs(a - b) < 1.5;

      /* ------------------------------------------------------------------ *
       * Converting to absolute or fixed must not move the element.
       * ------------------------------------------------------------------ */
      const convert = async (id, scheme) => {
        const el = byId(id);
        api.select(el);
        await frames();
        const before = el.getBoundingClientRect();
        engine.setStyle('position', scheme, el);
        await frames();
        const after = el.getBoundingClientRect();

        // Undo has to put the whole conversion back, not just the position.
        engine.undo();
        await frames();
        const undone = el.getBoundingClientRect();

        engine.redo();
        await frames();

        return {
          stayedPut: near(after.left, before.left) && near(after.top, before.top),
          drift: [Math.round(after.left - before.left), Math.round(after.top - before.top)],
          wrote: el.getAttribute('style') ?? '',
          undoRestores: near(undone.left, before.left) && near(undone.top, before.top),
        };
      };

      const pinned = {};
      for (const [id, scheme] of [
        ['flowchild', 'absolute'],
        ['flexchild', 'absolute'],
        ['relmoved', 'absolute'],
        ['farright', 'absolute'],
        ['tofixed', 'fixed'],
      ]) {
        progress.textContent = 'convert ' + id;
        pinned[id] = await convert(id, scheme);
      }

      // The right-anchored element must be pinned through `right`, not `left`.
      pinned.farright.keptItsAnchor =
        /(^|;)\s*right:/.test(pinned.farright.wrote) && !/(^|;)\s*left:/.test(pinned.farright.wrote);

      /*
       * Re-picking the position an element already has must leave its offsets alone. Otherwise
       * every visit to the control would quietly re-round the numbers the user typed.
       */
      progress.textContent = 'already absolute';
      const already = byId('already');
      api.select(already);
      await frames();
      engine.setStyle('position', 'absolute', already);
      await frames();
      const untouched = {
        left: already.style.left,
        top: already.style.top,
        ok: already.style.left === '33px' && already.style.top === '210px',
      };

      /* ------------------------------------------------------------------ *
       * The handles appear exactly where the Offsets section appears.
       * ------------------------------------------------------------------ */

      /** Walk shadow roots to find a tag, wherever the dock has nested it. */
      const deepFind = (tag, root = document) => {
        const direct = root.querySelector?.(tag);
        if (direct) return direct;
        const hosts = root.querySelectorAll ? root.querySelectorAll('*') : [];
        for (const host of hosts) {
          if (host.shadowRoot) {
            const found = deepFind(tag, host.shadowRoot);
            if (found) return found;
          }
        }
        return null;
      };

      /** Whether the Styles panel is currently offering the top/right/bottom/left rows. */
      const offsetsSectionShown = () => {
        const panel = deepFind('heo-styles-panel');
        if (!panel?.shadowRoot) return null;
        return Array.from(panel.shadowRoot.querySelectorAll('heo-section')).some(
          (section) => section.heading === 'Offsets',
        );
      };

      engine.setDockTab('styles');
      await frames();

      const affordance = async (id) => {
        const el = byId(id);
        api.select(el);
        await frames();
        await frames();
        const aff = engine.transformAffordances(el);
        const root = layer()?.shadowRoot;
        const box = el.getBoundingClientRect();
        const started = engine.startTransform(el, 'resize', 'se', box.right, box.bottom);
        if (started) engine.cancelTransform();
        return {
          display: getComputedStyle(el).display,
          position: getComputedStyle(el).position,
          resize: aff ? aff.resize : null,
          handles: root ? root.querySelectorAll('.frame .h').length : -1,
          // Rotation is a question about orientation, not placement, so it stays either way.
          rotate: root ? root.querySelectorAll('.frame .rot').length : -1,
          gestureRefused: started === false,
          offsets: offsetsSectionShown(),
        };
      };

      const cases = {};
      for (const id of [
        'p-static-block', 'p-static-flex', 'p-static-grid', 'p-static-li',
        'p-rel-block', 'p-rel-li', 'p-abs-flex', 'p-fixed', 'p-sticky',
      ]) {
        progress.textContent = 'affordance ' + id;
        cases[id] = await affordance(id);
      }

      for (const seen of Object.values(cases)) {
        const want = seen.position !== 'static';
        seen.ok =
          // The contract as the user stated it: the handles and the section agree, always.
          seen.offsets === want &&
          seen.resize === want &&
          seen.handles === (want ? 8 : 0) &&
          seen.gestureRefused === !want &&
          seen.rotate === 1;
      }

      const failed = [
        ...Object.entries(pinned)
          .filter(([, v]) => !(v.stayedPut && v.undoRestores))
          .map(([k]) => 'pin:' + k),
        ...(pinned.farright.keptItsAnchor ? [] : ['pin:farright-anchor']),
        ...(untouched.ok ? [] : ['pin:already']),
        ...Object.entries(cases).filter(([, v]) => !v.ok).map(([k]) => 'handles:' + k),
      ];

      byId('out').textContent = 'RESULTS:' + JSON.stringify(
        { ok: failed.length === 0, failed, pinned, untouched, cases, errors }, null, 1,
      ) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:{"ok":false,"__fatal":' + JSON.stringify(String((e && e.stack) || e)) + '}:END';
    });
  </script>
</body>

</html>
