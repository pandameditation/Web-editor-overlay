<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>The AI affordance: anchored button, anchored prompt, full-screen settings</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
    }

    /* Well down the page and well in from the left, so a popover that lands at the viewport
       origin is unmistakably wrong rather than coincidentally right. */
    #subject {
      margin: 220px 0 0 260px;
      width: 340px;
      padding: 18px;
      background: #eef2ff;
    }

    #narrow {
      margin: 40px 0 0 260px;
      width: 90px;
      padding: 6px;
      background: #fee;
    }

    #report {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <main id="main">
    <article id="subject" class="card">
      <h2 id="title">A heading.</h2>
      <p>Some words.</p>
    </article>
    <article id="narrow" class="card">Narrow.</article>
  </main>

  <div id="report">
    <pre id="progress">start</pre>
    <pre id="out">pending</pre>
  </div>

  <script type="module">
    (async () => {
      const errors = [];
      addEventListener('error', (e) => errors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

      const progress = document.getElementById('progress');
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const results = {};

      const { mount } = await import('../dist/html-editor-overlay.js');

      /**
       * A scripted provider, so the UI is driven end to end with no network.
       *
       * `MountOptions.aiTransport` is the documented seam for exactly this. It replaces where the
       * request goes and nothing about what the reply may do — the broker still decides that —
       * so a fixture cannot accidentally widen a permission.
       */
      const asked = [];
      /**
       * A latch the transport waits on before it answers, when one is set.
       *
       * The busy state only exists between Send and the last operation, and a scripted transport
       * resolves that window in a few milliseconds — too fast to sample reliably. Holding the
       * reply open makes "while it is working" an observable state rather than a race.
       */
      let gate = null;
      const openGate = () => { const g = gate; gate = null; g?.release(); };
      const holdTheReply = () => {
        let release;
        const waited = new Promise((r) => { release = r; });
        gate = { waited, release };
        return waited;
      };
      const api = mount({
        theme: 'dark', presets: false, detectScriptContent: false,
        aiTransport: (request) => {
          asked.push({ prompt: request.prompt, context: request.context });
          const held = gate?.waited ?? null;
          return (async function* () {
            if (held) await held;
            await wait(20);
            yield { op: 'setStyles', declarations: { color: 'rgb(20, 80, 160)' } };
            await wait(20);
            yield { op: 'upsertClass', name: 'card', declarations: { 'border-radius': '12px' } };
            await wait(20);
            yield { op: 'summary', text: 'Recoloured it and rounded the card.' };
          })();
        },
      });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      /** Walk shadow roots: every part of the chrome lives inside the overlay's own tree. */
      const deepFind = (selector, root = document) => {
        const direct = root.querySelector?.(selector);
        if (direct) return direct;
        for (const host of root.querySelectorAll ? root.querySelectorAll('*') : []) {
          if (host.shadowRoot) {
            const found = deepFind(selector, host.shadowRoot);
            if (found) return found;
          }
        }
        return null;
      };
      const box = (el) => {
        const r = el?.getBoundingClientRect();
        return r ? { x: Math.round(r.left), y: Math.round(r.top), w: Math.round(r.width), h: Math.round(r.height) } : null;
      };

      const subject = document.getElementById('subject');
      const narrow = document.getElementById('narrow');

      /*
       * The pristine default, read before any group has had a chance to widen it.
       *
       * The context scope is sticky within a session on purpose — someone who turned the parent on
       * to fix one alignment wants it on for the next — so only the very first read is evidence
       * about the default. Later groups set what they need explicitly.
       */
      const defaultContextScope = { ...engine.store.value.aiContextScope };

      /**
       * Select, then wait for the layout to stop moving before measuring anything.
       *
       * The overlay injects stylesheets and the page is still reflowing for a few frames after
       * mount, so the element's box changes under a fixture that reads it immediately. That is
       * not a placement bug — the selection layer re-measures on every geometry change and
       * catches up — but it is enough to make an assertion about "above the top edge" read a
       * button placed against the previous position. The same settle loop `transform-move` uses.
       */
      const settle = async (el) => {
        api.select(el);
        let last = null;
        for (let i = 0; i < 60; i += 1) {
          await frames();
          const r = el.getBoundingClientRect();
          const b = deepFind('.ai')?.getBoundingClientRect();
          const now = `${Math.round(r.top)},${Math.round(r.left)},${Math.round(b?.top ?? -1)}`;
          if (now === last) return;
          last = now;
        }
      };

      /* ------------------------------------------------------------------ *
       * 1. The button sits above the element's top-right corner.
       * ------------------------------------------------------------------ */
      progress.textContent = 'buttonSitsOnTheElement';
      {
        await settle(subject);
        const button = deepFind('.ai');
        const bb = box(button);
        const eb = box(subject);
        results.buttonSitsOnTheElement = {
          found: Boolean(button),
          label: button?.getAttribute('aria-label') ?? null,
          buttonBox: bb, elementBox: eb,
          // Above the top edge, not floating somewhere else on the page.
          aboveTheTopEdge: bb && eb ? bb.y < eb.y && bb.y > eb.y - 40 : false,
          // At the right-hand end of the element, which is the corner nothing else uses:
          // the label badge takes the left.
          atTheRightEnd: bb && eb ? bb.x > eb.x + eb.w / 2 : false,
          insideTheElementsWidth: bb && eb ? bb.x + bb.w <= eb.x + eb.w + 4 : false,
          // And nowhere near the viewport origin, which is what a failed placement looks like.
          notAtTheOrigin: bb ? bb.x > 40 && bb.y > 40 : false,
        };
        const group = results.buttonSitsOnTheElement;
        group.ok =
          group.found === true &&
          group.aboveTheTopEdge === true &&
          group.atTheRightEnd === true &&
          group.insideTheElementsWidth === true &&
          group.notAtTheOrigin === true;
      }

      /* ------------------------------------------------------------------ *
       * 2. A narrow element moves the button inside its edge instead of past it.
       * ------------------------------------------------------------------ */
      progress.textContent = 'narrowElementKeepsItInside';
      {
        await settle(narrow);
        const bb = box(deepFind('.ai'));
        const eb = box(narrow);
        results.narrowElementKeepsItInside = {
          buttonBox: bb, elementBox: eb,
          // The whole point: on a 90px element the badge and this would otherwise overlap.
          withinTheElement: bb && eb ? bb.x >= eb.x && bb.x + bb.w <= eb.x + eb.w + 2 : false,
          stillAbove: bb && eb ? bb.y < eb.y : false,
        };
        const group = results.narrowElementKeepsItInside;
        group.ok = group.withinTheElement === true && group.stillAbove === true;
      }

      /* ------------------------------------------------------------------ *
       * 3. Clicking it opens the prompt, anchored to the element.
       * ------------------------------------------------------------------ */
      progress.textContent = 'clickOpensTheAnchoredPrompt';
      {
        await settle(subject);
        deepFind('.ai').click();
        await frames();
        const pop = deepFind('heo-ai-menu')?.shadowRoot?.querySelector('.pop');
        const pb = box(pop);
        const eb = box(subject);
        results.clickOpensTheAnchoredPrompt = {
          opened: engine.store.value.aiMenuOpen,
          popBox: pb, elementBox: eb,
          // Anchored: horizontally overlapping the element, vertically adjacent to it.
          nearTheElement: pb && eb
            ? pb.x + pb.w > eb.x - 40 && pb.x < eb.x + eb.w + 40 &&
            Math.abs(pb.y - (eb.y + eb.h)) < 320
            : false,
          /*
           * On screen, entirely.
           *
           * The bug this group was written against: placed from a guessed height, an element low
           * on the page flipped the popover above and put it off the top of the viewport.
           */
          fullyOnScreen: pb
            ? pb.x >= 0 && pb.y >= 0 && pb.x + pb.w <= innerWidth && pb.y + pb.h <= innerHeight
            : false,
          notAtTheOrigin: pb ? pb.x > 40 || pb.y > 40 : false,
        };
        const group = results.clickOpensTheAnchoredPrompt;
        group.ok =
          group.opened === true &&
          group.nearTheElement === true &&
          group.fullyOnScreen === true &&
          group.notAtTheOrigin === true;
      }

      /* ------------------------------------------------------------------ *
       * 4. With nothing configured, the way in is offered rather than an empty box.
       * ------------------------------------------------------------------ */
      progress.textContent = 'offersSetupBeforeAnyProvider';
      {
        const menu = deepFind('heo-ai-menu')?.shadowRoot;
        const setup = Array.from(menu?.querySelectorAll('button') ?? []).find(
          (one) => /set up a model/i.test(one.textContent ?? ''),
        );
        results.offersSetupBeforeAnyProvider = {
          noProviders: engine.ai.configured === false,
          offersSetup: Boolean(setup),
          // And says outright that nothing has been sent, which is the question "AI" raises.
          reassures: /nothing is sent anywhere/i.test(menu?.textContent ?? ''),
        };
        const group = results.offersSetupBeforeAnyProvider;
        group.ok = Object.entries(group).every(([k, v]) => k === 'ok' || v === true);
        setup?.click();
        await frames();
      }

      /* ------------------------------------------------------------------ *
       * 5. The settings are a full-screen modal at the root, not a clipped popover.
       *
       * The reported bug: the dialog was rendered inside the AI popover, which is a fixed box
       * with `overflow: hidden` — so it was positioned against the popover and clipped to 320px.
       * ------------------------------------------------------------------ */
      progress.textContent = 'settingsAreAFullScreenModal';
      {
        const settings = deepFind('heo-ai-settings');
        const dialog = settings?.shadowRoot?.querySelector('.dialog');
        const scrim = box(settings);
        const db = box(dialog);
        const menu = deepFind('heo-ai-menu');
        results.settingsAreAFullScreenModal = {
          opened: engine.store.value.aiSettingsOpen,
          found: Boolean(dialog),
          scrimBox: scrim, dialogBox: db,
          // The scrim covers the viewport, which is only possible at the root: nested inside
          // the popover its containing block was the popover.
          scrimCoversTheViewport: scrim
            ? scrim.w >= innerWidth - 2 && scrim.h >= innerHeight - 2
            : false,
          /*
           * Sized against the viewport, not against a number.
           *
           * The first version asserted `h > 400`, which passed standalone and failed in the
           * suite — where the viewport is 435px tall and a dialog correctly filling it is 383px.
           * The claim being made is "it takes the room available", so that is what is measured.
           */
          roomToWork: db ? db.w >= Math.min(860, innerWidth - 48) - 4 : false,
          tall: db ? db.h >= Math.min(innerHeight * 0.88, 760) - 4 : false,
          // And far more room than the 320px popover it used to be trapped inside.
          widerThanThePopover: db ? db.w > 320 * 1.8 : false,
          // Centred rather than pinned to a corner, which is what the clipped version looked like.
          horizontallyCentred: db
            ? Math.abs(db.x + db.w / 2 - innerWidth / 2) < 24
            : false,
          // A sibling of the menu in the light DOM, not a descendant of it.
          notInsideTheMenu: Boolean(settings) && Boolean(menu) && !menu.contains(settings),
        };
        const group = results.settingsAreAFullScreenModal;
        group.ok =
          group.opened === true &&
          group.found === true &&
          group.scrimCoversTheViewport === true &&
          group.roomToWork === true &&
          group.tall === true &&
          group.widerThanThePopover === true &&
          group.horizontallyCentred === true &&
          group.notInsideTheMenu === true;
      }

      /* ------------------------------------------------------------------ *
       * 6. Adding a provider gives a form, with the credential handled honestly.
       * ------------------------------------------------------------------ */
      progress.textContent = 'addAProviderAndConfigureIt';
      {
        const shadow = () => deepFind('heo-ai-settings')?.shadowRoot;
        const buttonSaying = (re) =>
          Array.from(shadow()?.querySelectorAll('button') ?? []).find((one) =>
            re.test(one.textContent ?? ''),
          );
        buttonSaying(/add a provider/i)?.click();
        await frames();

        const set = engine.ai.list()[0];
        // Configured through the agent rather than by typing into every field: what this group
        // is about is what the panel *shows* for a given configuration, not the plumbing of
        // its inputs, which `change` events would only re-test at one remove.
        engine.ai.upsert({
          ...set, transport: 'in-page', provider: 'openai-compatible', model: 'test-model',
        });
        await frames();

        const key = shadow()?.querySelector('input[type="password"]');
        // The settings modal has no scope controls at all now — that moved to the popover chips.
        const scopeSelects = Array.from(shadow()?.querySelectorAll('.scope select') ?? []);
        const shield = shadow()?.querySelector('.shield');

        results.addAProviderAndConfigureIt = {
          created: engine.ai.list().length === 1,
          // A real password field in a form, so the browser's own manager can hold it — which
          // is the recommended path precisely because the editor then persists nothing.
          keyFieldIsAPassword: Boolean(key),
          usesThePasswordManager: key?.getAttribute('autocomplete') === 'current-password',
          /*
           * No scope controls here, which is the assertion rather than an omission.
           *
           * This screen used to carry four rows deciding what the AI could change, per provider —
           * so the answer travelled in the design-system seed and needed an "ask me" state to be
           * bearable. Both are gone. Scope is chosen per request on the chips beside the prompt,
           * and `contextChipsChooseWhatIsSent` is where it is asserted.
           */
          noScopeRows: scopeSelects.length === 0,
          saysNothingAboutPermission: !/Scope of AI changes/.test(shadow()?.textContent ?? ''),
          // And the badge tells the truth about an in-page key rather than showing a lock.
          shieldText: (shield?.textContent ?? '').trim(),
          saysItNeedsAKey: /needs a key/i.test(shield?.textContent ?? ''),
          warnsThePageCanReadIt: /this page can read your key/i.test(shadow()?.textContent ?? ''),
        };
        const group = results.addAProviderAndConfigureIt;
        group.ok =
          group.created === true &&
          group.keyFieldIsAPassword === true &&
          group.usesThePasswordManager === true &&
          group.noScopeRows === true &&
          group.saysNothingAboutPermission === true &&
          group.saysItNeedsAKey === true &&
          group.warnsThePageCanReadIt === true;
      }

      /* ------------------------------------------------------------------ *
       * 7. A configured provider makes the prompt usable, and a run reports itself.
       * ------------------------------------------------------------------ */
      progress.textContent = 'promptRunsAndReportsBack';
      {
        const set = engine.ai.list()[0];
        await engine.ai.setKey(set.id, 'sk-scripted-test');
        engine.ai.upsert({ ...set });
        engine.setAiSettings(false);
        await frames();

        const menu = () => deepFind('heo-ai-menu')?.shadowRoot;
        /*
         * Classes switched on, because this group's scripted reply edits one.
         *
         * A request starts describing the element and nothing around it, and what is not described
         * cannot be changed — so at the default scope the upsertClass below is refused, correctly.
         * That refusal is pinned in `test/ai-run.html`; what this group is about is a run that
         * applies, reports itself and folds into one undo, so it asks for the scope it needs.
         */
        engine.setAiContextScope('classes', true);
        await frames();

        const field = menu()?.querySelector('textarea');
        // The input exists only once a provider does — before that the popover offers setup
        // instead, which is what `offersSetupBeforeAnyProvider` covers.
        const promptAppeared = Boolean(field);
        const placeholder = field?.getAttribute('placeholder') ?? null;
        field.value = 'make it blue and round the card';
        field.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await frames();

        const send = Array.from(menu()?.querySelectorAll('button') ?? []).find((one) =>
          /send/i.test(one.textContent ?? ''),
        );
        const sendWasEnabled = Boolean(send) && !send.disabled;
        send?.click();

        // Let the scripted stream finish.
        for (let i = 0; i < 60 && (engine.store.value.aiBusy || !engine.store.value.aiOutcome); i += 1) {
          await wait(30);
        }
        await frames();

        /*
         * Whitespace-collapsed before matching.
         *
         * A Lit template wraps its lines, so `textContent` carries the newlines and indentation
         * the source has even though the rendered text reads as one sentence. Matching the raw
         * string failed on "Undo 2\n            changes", which is a fixture bug and not a
         * product one — the button says the right thing on screen.
         */
        const flat = (node) => (node?.textContent ?? '').replace(/\s+/g, ' ').trim();
        const text = flat(menu());
        results.promptRunsAndReportsBack = {
          promptAppeared,
          placeholderReads: placeholder === 'Describe a change in text or style',
          sendWasEnabled,
          // The prompt and the element context both reached the transport.
          transportWasCalled: asked.length === 1,
          carriedThePrompt: /make it blue/.test(asked[0]?.prompt ?? ''),
          carriedTheElement: /"tag": ?"article"/.test(asked[0]?.context ?? ''),
          // The page changed.
          styleLanded: /color/.test(subject.getAttribute('style') ?? ''),
          classLanded: engine.classes.get('card')?.declarations['border-radius'] === '12px',
          // The transcript shows the model's summary and the side effect as separate things.
          showsTheSummary: /Recoloured it and rounded the card/.test(text),
          flagsTheSharedClass: /\.card changed/.test(text),
          // And offers the single undo, because the whole run is one step.
          offersOneUndo: Array.from(menu()?.querySelectorAll('button') ?? []).some((one) =>
            /undo 2 changes/i.test(flat(one)),
          ),
        };
        const group = results.promptRunsAndReportsBack;
        group.ok = Object.entries(group).every(([k, v]) => k === 'ok' || v === true);
      }

      /* ------------------------------------------------------------------ *
       * 8. The prompt closes on Escape and on a click away, and forgets its transcript.
       * ------------------------------------------------------------------ */
      progress.textContent = 'closesAndForgets';
      {
        const hadOutcome = Boolean(engine.store.value.aiOutcome);
        document.dispatchEvent(
          new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, composed: true }),
        );
        await frames();
        const closedByEscape = engine.store.value.aiMenuOpen === false;

        await settle(subject);
        deepFind('.ai').click();
        await frames();
        const reopened = engine.store.value.aiMenuOpen;
        // A click on the page puts it away: there is no scrim, and the page behind is live.
        document.getElementById('main').dispatchEvent(
          new PointerEvent('pointerdown', { bubbles: true, composed: true }),
        );
        await frames();

        results.closesAndForgets = {
          hadOutcome,
          closedByEscape,
          reopened,
          closedByClickingAway: engine.store.value.aiMenuOpen === false,
          // The account of a run belongs beside the element it changed, so putting the prompt
          // away forgets it rather than showing it again next time.
          forgotTheTranscript: engine.store.value.aiOutcome === null,
        };
        const group = results.closesAndForgets;
        group.ok = Object.entries(group).every(([k, v]) => k === 'ok' || v === true);
      }

      /* ------------------------------------------------------------------ *
       * 9. The settings modal sits in the dialog band, under the confirmation.
       * ------------------------------------------------------------------ */
      progress.textContent = 'settingsSitUnderTheConfirmation';
      {
        engine.setAiSettings(true);
        await frames();
        const settings = deepFind('heo-ai-settings');
        const zOf = (el) => (el ? Number.parseInt(getComputedStyle(el).zIndex, 10) : NaN);
        const settingsZ = zOf(settings);

        // A confirmation raised from inside the settings, which is the reported case.
        engine.askToConfirm({
          title: 'Stacking probe', message: 'Does this land on top?',
          confirmLabel: 'Yes', reversible: true, run: () => { },
        });
        await frames();
        const confirm = deepFind('heo-confirm-dialog');
        const confirmZ = zOf(confirm);
        /*
         * Paint order, not just the numbers.
         *
         * A dialog can be numbered above another and still be covered if the two sit in
         * different stacking contexts, so this asks what the pointer would actually hit at the
         * top of the confirmation. Through the overlay's own shadow root rather than the
         * document's: `document.elementFromPoint` stops at the outermost host and answers
         * `heo-overlay` for everything inside it, which is true and useless.
         */
        const dialogBox = confirm?.shadowRoot?.querySelector('.dialog')?.getBoundingClientRect();
        const overlayRoot = document.querySelector('heo-overlay')?.shadowRoot;
        const hit = dialogBox && overlayRoot
          ? overlayRoot.elementFromPoint(dialogBox.left + dialogBox.width / 2, dialogBox.top + 20)
          : null;

        results.settingsSitUnderTheConfirmation = {
          settingsZ, confirmZ,
          bothPresent: Boolean(settings && confirm),
          // The whole bug: 42 outranked the 40 reserved for the always-on-top surfaces.
          confirmationOutranksSettings: confirmZ > settingsZ,
          // And it stays inside the content-dialog band rather than above it.
          settingsAreInTheDialogBand: settingsZ >= 28 && settingsZ <= 39,
          // What the pointer actually reaches at the top of the confirmation.
          topmostAtTheConfirmation: hit?.tagName?.toLowerCase() ?? null,
          confirmationIsHittable: hit?.tagName?.toLowerCase() === 'heo-confirm-dialog',
        };
        const group = results.settingsSitUnderTheConfirmation;
        group.ok =
          group.bothPresent === true &&
          group.confirmationOutranksSettings === true &&
          group.settingsAreInTheDialogBand === true &&
          group.confirmationIsHittable === true;
        engine.cancelConfirm();
        await frames();
      }

      /* ------------------------------------------------------------------ *
       * 10. Page shortcuts do not reach past the open settings.
       * ------------------------------------------------------------------ */
      progress.textContent = 'settingsHoldTheKeyboard';
      {
        const before = {
          children: subject.parentElement.children.length,
          save: engine.store.value.savePreview,
        };
        const press = (key) => document.dispatchEvent(new KeyboardEvent('keydown', {
          key, metaKey: true, ctrlKey: true, bubbles: true, composed: true,
        }));
        // Each of these was decided above the "did this come from the overlay" guard, so each
        // one reached the page while the dialog was open.
        press('d'); await frames();
        press('s'); await frames();

        results.settingsHoldTheKeyboard = {
          stillOpen: engine.store.value.aiSettingsOpen === true,
          modDDidNotDuplicate: subject.parentElement.children.length === before.children,
          modSDidNotOpenSave: engine.store.value.savePreview === before.save,
        };
        const group = results.settingsHoldTheKeyboard;
        group.ok = Object.entries(group).every(([k, v]) => k === 'ok' || v === true);
      }

      /* ------------------------------------------------------------------ *
       * 11. Promote and Delete are labelled, beside the provider, Delete last.
       * ------------------------------------------------------------------ */
      progress.textContent = 'providerActionsAreLabelledAndPlaced';
      {
        // Two providers, so Promote exists at all: the first in the list is already the default.
        engine.ai.upsert({
          id: 'fixture-one', label: 'First provider', transport: 'local',
          provider: 'openai-compatible', baseURL: 'http://127.0.0.1:1/v1', model: 'm-one',
        });
        engine.ai.upsert({
          id: 'fixture-two', label: 'Second provider', transport: 'local',
          provider: 'openai-compatible', baseURL: 'http://127.0.0.1:2/v1', model: 'm-two',
        });
        await frames();
        const root = deepFind('heo-ai-settings')?.shadowRoot;
        // Pick the second, which is the one that can be promoted.
        const tabs = Array.from(root?.querySelectorAll('.tab') ?? []);
        tabs.at(-1)?.click();
        await frames();

        const flat = (node) => (node?.textContent ?? '').replace(/\s+/g, ' ').trim();
        const acts = root?.querySelector('.owner-acts');
        const buttons = Array.from(acts?.querySelectorAll('button') ?? []);
        const promote = buttons.find((one) => /promote/i.test(flat(one)));
        const del = buttons.find((one) => /delete/i.test(flat(one)));
        const why = root?.querySelector('.why p');
        const whyBox = why?.getBoundingClientRect();
        const actsBox = acts?.getBoundingClientRect();
        // The old placement, for contrast: these used to live at the foot of the form.
        const testButton = Array.from(root?.querySelectorAll('.acts button') ?? [])
          .find((one) => /test/i.test(flat(one)));
        const testBox = testButton?.getBoundingClientRect();

        results.providerActionsAreLabelledAndPlaced = {
          tabCount: tabs.length,
          promoteLabel: flat(promote) || null,
          deleteLabel: flat(del) || null,
          // Words, not bare icons.
          bothAreLabelled: /promote/i.test(flat(promote)) && /delete/i.test(flat(del)),
          // Delete carries the shared danger variant rather than a ghost icon button.
          deleteIsDanger: del?.classList.contains('danger') === true &&
            del?.classList.contains('sm') === true,
          deleteIsNotAnIconButton: del?.classList.contains('icon') === false,
          // Red, as the variant promises. Compared against the sentence beside it, so this is
          // about the colour differing rather than about one particular value.
          deleteIsRedderThanTheProse: del && why
            ? getComputedStyle(del).color !== getComputedStyle(why).color
            : false,
          // Beside the security sentence: same line, to its right.
          onTheSameLineAsTheSentence: whyBox && actsBox
            ? Math.abs(whyBox.top - actsBox.top) < 24
            : false,
          toTheRightOfTheSentence: whyBox && actsBox ? actsBox.left > whyBox.left : false,
          // Delete is the last thing in the row, so the destructive one is not reached first.
          deleteIsLastInTheRow: buttons.at(-1) === del,
          // And well above the Test button, which is where they used to be.
          aboveWhereTheyUsedToBe: actsBox && testBox ? actsBox.top < testBox.top : false,
        };
        const group = results.providerActionsAreLabelledAndPlaced;
        group.ok =
          group.bothAreLabelled === true &&
          group.deleteIsDanger === true &&
          group.deleteIsNotAnIconButton === true &&
          group.deleteIsRedderThanTheProse === true &&
          group.onTheSameLineAsTheSentence === true &&
          group.toTheRightOfTheSentence === true &&
          group.deleteIsLastInTheRow === true &&
          group.aboveWhereTheyUsedToBe === true;
      }

      /* ------------------------------------------------------------------ *
       * 12. Narrow viewport: one control per line, and the tabs run horizontally.
       * ------------------------------------------------------------------ */
      progress.textContent = 'settingsRespondToANarrowViewport';
      {
        const root = deepFind('heo-ai-settings')?.shadowRoot;
        const pairBefore = getComputedStyle(root.querySelector('.pair')).gridTemplateColumns;
        const tabsBefore = Array.from(root.querySelectorAll('.tab')).map((t) => t.getBoundingClientRect());
        const stackedBefore = tabsBefore.length > 1 && tabsBefore[1].top > tabsBefore[0].top + 4;

        /*
         * The viewport is narrowed by driving the media query rather than by resizing the window,
         * which a headless page cannot do reliably. `matchMedia` cannot be forced either, so the
         * dialog is measured at its real width and the breakpoint's own rules are read from the
         * stylesheet — the two together say the rule exists and applies to the right selectors.
         */
        const sheet = Array.from(root.adoptedStyleSheets ?? [])
          .flatMap((s) => Array.from(s.cssRules ?? []))
          .find((r) => r.media?.mediaText?.includes('560px'));
        const inside = Array.from(sheet?.cssRules ?? []).map((r) => r.selectorText);
        const declFor = (selector) => Array.from(sheet?.cssRules ?? [])
          .find((r) => r.selectorText === selector)?.style;

        results.settingsRespondToANarrowViewport = {
          // Wide: two columns and a vertical list, which is the layout the breakpoint changes.
          pairIsTwoColumnsWhenWide: pairBefore.split(' ').length === 2,
          tabsStackVerticallyWhenWide: stackedBefore,
          // The breakpoint exists, at the same width the other responsive dialog uses.
          breakpointExists: Boolean(sheet),
          breakpointWidth: sheet?.media?.mediaText ?? null,
          // One control per line.
          pairCollapses: (declFor('.pair')?.gridTemplateColumns ?? '').includes('1fr') &&
            !(declFor('.pair')?.gridTemplateColumns ?? '').includes('1fr 1fr'),
          // Tabs run along the top instead of down the side.
          listTurnsHorizontal: declFor('.list')?.flexDirection === 'row',
          listLosesItsSideBorder: declFor('.list')?.borderRight === '0px' ||
            (declFor('.list')?.borderRightWidth ?? '') === '0px',
          tabsStopFilling: (declFor('.tab')?.width ?? '') === 'auto',
          // The split collapses so the form gets the whole width.
          splitCollapses: inside.includes('.split, .split.solo') ||
            inside.some((s) => (s ?? '').includes('.split')),
          selectors: inside,
        };
        const group = results.settingsRespondToANarrowViewport;
        group.ok =
          group.pairIsTwoColumnsWhenWide === true &&
          group.tabsStackVerticallyWhenWide === true &&
          group.breakpointExists === true &&
          group.pairCollapses === true &&
          group.listTurnsHorizontal === true &&
          group.listLosesItsSideBorder === true &&
          group.tabsStopFilling === true &&
          group.splitCollapses === true;

        engine.ai.remove('fixture-one');
        engine.ai.remove('fixture-two');
        engine.setAiSettings(false);
        await frames();
      }

      /* ------------------------------------------------------------------ *
       * 13. A provider added by hand survives a reload; a discovered one does not.
       * ------------------------------------------------------------------ */
      progress.textContent = 'providersSurviveAReload';
      {
        const mine = {
          id: 'mine-persist', label: 'Hand made', transport: 'local',
          provider: 'openai-compatible', baseURL: 'http://127.0.0.1:9/v1', model: 'kept',
        };
        /*
         * An environment id, which must NOT be written.
         *
         * A `heo-env-` set exists because the dev server found a key this boot and re-offers it on
         * the next one. Persisting it would mean a provider outliving the removal of its own key,
         * with no way to get rid of it but to find the storage entry.
         */
        const offered = { ...mine, id: 'heo-env-offered', label: 'From the environment' };
        engine.ai.upsert(mine);
        engine.ai.offer([offered]);
        engine.ai.activate('mine-persist');
        await frames();

        const raw = localStorage.getItem('heo.ai.sets');
        const stored = raw ? JSON.parse(raw) : null;
        const storedIds = (stored?.sets ?? []).map((one) => one.id);

        // A reload is the list starting empty and `restore()` being the only thing that fills it.
        engine.ai.import([]);
        const emptied = engine.ai.list().length;
        // `import([])` also clears storage, so put the entry back the way a fresh tab would find it.
        localStorage.setItem('heo.ai.sets', raw ?? '');
        const restoredCount = engine.ai.restore();
        const back = engine.ai.get('mine-persist');

        results.providersSurviveAReload = {
          storedIds,
          // Counted against what was stored rather than against a literal: earlier groups in this
          // file add providers of their own, and they are hand-made too, so they belong here.
          restoredEverythingStored: restoredCount === storedIds.length,
          keepsTheHandMadeOne: storedIds.includes('mine-persist'),
          doesNotKeepTheDiscoveredOne: !storedIds.includes('heo-env-offered'),
          // Nothing secret in the blob, checked rather than assumed.
          storesNoKeyField: raw ? !/apiKey|"key"/i.test(raw) : false,
          rememberedWhichWasActive: stored?.activeId === 'mine-persist',
          emptiedFirst: emptied === 0,
          restoredCount,
          cameBack: back?.label === 'Hand made',
          cameBackWhole: back?.baseURL === 'http://127.0.0.1:9/v1' && back?.model === 'kept',
        };
        const group = results.providersSurviveAReload;
        group.ok =
          group.keepsTheHandMadeOne === true &&
          group.doesNotKeepTheDiscoveredOne === true &&
          group.storesNoKeyField === true &&
          group.rememberedWhichWasActive === true &&
          group.emptiedFirst === true &&
          group.restoredEverythingStored === true &&
          group.cameBack === true &&
          group.cameBackWhole === true;

        engine.ai.remove('mine-persist');
        engine.ai.remove('heo-env-offered');
      }

      /* ------------------------------------------------------------------ *
       * 14. Choosing a dialect fills in its host; a typed one is left alone.
       * ------------------------------------------------------------------ */
      progress.textContent = 'theDialectFillsInItsHost';
      {
        const id = 'base-url-probe';
        /*
         * The only provider in the list, deliberately.
         *
         * The form shows `openId` or else the first set, and earlier groups left both pointing
         * elsewhere — so driving the selects changed a different provider's dialect and every
         * assertion here passed or failed for the wrong reason. Clearing the list first makes the
         * probe the thing on screen without depending on what ran before.
         */
        for (const one of engine.ai.list()) engine.ai.remove(one.id);
        const base = {
          id, label: 'Base URL probe', transport: 'proxy', provider: 'openai-compatible',
          model: 'm',
        };
        engine.ai.upsert(base);
        engine.setAiSettings(true);
        await frames();
        const root = () => deepFind('heo-ai-settings')?.shadowRoot;
        const pick = (label, value) => {
          const fields = Array.from(root()?.querySelectorAll('.field') ?? []);
          const field = fields.find((one) => one.querySelector('span')?.textContent?.trim() === label);
          const select = field?.querySelector('select');
          if (!select) return false;
          select.value = value;
          select.dispatchEvent(new Event('change', { bubbles: true }));
          return true;
        };

        // A proxied set carries no base URL by design: the server decides and the page is not told.
        const proxiedHasNone = engine.ai.get(id)?.baseURL === undefined;

        /*
         * Leaving proxy is the case that was broken.
         *
         * With no base URL, `endpointFor` produced the relative path `/chat/completions`, so the
         * request went to the page's own origin and failed in a way that read as a broken editor.
         */
        /*
         * Leaving proxy while the dialect is openai-compatible.
         *
         * Still empty afterwards, and that is correct rather than a gap: "OpenAI-compatible" means
         * some server speaking that dialect, and there is no such thing as its default host —
         * guessing api.openai.com would point a private gateway's key at OpenAI. What must not
         * happen is the request going out anyway, which is checked below.
         */
        pick('Where the key lives', 'in-page');
        await frames();
        const afterLeavingProxy = engine.ai.get(id)?.baseURL ?? '';

        pick('API shape', 'openai');
        await frames();
        const afterOpenai = engine.ai.get(id)?.baseURL;

        pick('API shape', 'anthropic');
        await frames();
        const afterAnthropic = engine.ai.get(id)?.baseURL;

        // A host the user typed is theirs, and a later dialect change must not take it.
        engine.ai.upsert({ ...engine.ai.get(id), baseURL: 'https://my-gateway.internal/v1' });
        await frames();
        pick('API shape', 'google');
        await frames();
        const afterTyped = engine.ai.get(id)?.baseURL;

        results.theDialectFillsInItsHost = {
          proxiedHasNone,
          afterLeavingProxy,
          // Honest emptiness: this dialect has no default host to fill in.
          compatibleDialectStaysEmpty: afterLeavingProxy === '',
          afterOpenai,
          // With /v1, because endpointFor appends /chat/completions to it.
          openaiCarriesV1: afterOpenai === 'https://api.openai.com/v1',
          afterAnthropic,
          // Without /v1, because endpointFor appends /v1/messages.
          anthropicOmitsV1: afterAnthropic === 'https://api.anthropic.com',
          afterTyped,
          leavesATypedHostAlone: afterTyped === 'https://my-gateway.internal/v1',
        };
        const group = results.theDialectFillsInItsHost;
        group.ok =
          group.proxiedHasNone === true &&
          group.compatibleDialectStaysEmpty === true &&
          group.openaiCarriesV1 === true &&
          group.anthropicOmitsV1 === true &&
          group.leavesATypedHostAlone === true;

        engine.ai.remove(id);
        /*
         * A working provider put back before leaving.
         *
         * This group emptied the list so the form would show its own probe, and the popover shows
         * the setup state rather than the prompt when nothing is configured — so every group after
         * this one would find no chips, no box and no quick actions.
         */
        engine.ai.upsert({
          id: 'restored-after-probe',
          label: 'Scripted',
          transport: 'local',
          provider: 'openai-compatible',
          baseURL: 'http://127.0.0.1:9/v1',
          model: 'm',
        });
        // Closed here rather than by the next group: this is the group that opened it.
        engine.setAiSettings(false);
        await frames();
      }

      /* ------------------------------------------------------------------ *
       * 15. The key field reflects where the key actually is.
       *
       * Reported: after a reload the heading read "remembered" — correctly, from the vault — while
       * the checkbox beside it sat unchecked, because the checkbox was drawn from component state
       * that starts empty. The panel contradicted itself about the same fact.
       * ------------------------------------------------------------------ */
      progress.textContent = 'theKeyFieldShowsWhereTheKeyIs';
      {
        engine.ai.upsert({
          id: 'key-state-probe',
          label: 'Key state probe',
          transport: 'in-page',
          provider: 'openai',
          baseURL: 'https://api.openai.com/v1',
          model: 'm',
        });
        engine.setAiSettings(true);
        await frames();
        const root = () => deepFind('heo-ai-settings')?.shadowRoot;
        const tabs = () => Array.from(root()?.querySelectorAll('.tab') ?? []);
        const flat = (node) => (node?.textContent ?? '').replace(/\s+/g, ' ').trim();
        const openProbe = async () => {
          const tab = tabs().find((one) => /Key state probe/.test(flat(one)));
          tab?.click();
          await frames();
        };
        await openProbe();
        const box = () => root()?.querySelector('input[type="checkbox"]');

        // Nothing stored yet: session is the default, so the box is clear.
        const beforeAnyKey = box()?.checked;

        /*
         * Saved to the origin, then re-rendered from scratch.
         *
         * The settings panel is created and destroyed rather than hidden, so closing and reopening
         * is the same fresh render a reload produces — which is where the draft state was empty and
         * the box read false for a key that was in fact remembered.
         */
        const saved = await engine.ai.setKey('key-state-probe', 'sk-fixture-probe', 'origin');
        engine.setAiSettings(false);
        await frames();
        engine.setAiSettings(true);
        await frames();
        await openProbe();

        const status = engine.ai.keyStatus('key-state-probe');
        const heading = flat(root()?.querySelector('.shield'));
        const afterFreshRender = box()?.checked;

        results.theKeyFieldShowsWhereTheKeyIs = {
          savedTo: saved.persistence,
          refused: saved.refused ?? null,
          clearBeforeAnyKey: beforeAnyKey === false,
          // The vault's own answer, which the heading was already telling the truth about.
          vaultSaysOrigin: status.persistence === 'origin',
          heading,
          headingSaysRemembered: /remembered/i.test(heading),
          // And now the box agrees with it on a render that has never been touched.
          boxAgreesWithTheVault: afterFreshRender === true,
        };
        const group = results.theKeyFieldShowsWhereTheKeyIs;
        /*
         * Only meaningful where the origin may keep a key at all.
         *
         * `setKey('origin')` is refused off loopback, on purpose and with a sentence. The suite
         * serves fixtures from file:, which counts as loopback, so this normally runs — but it must
         * not fail somewhere it cannot apply.
         */
        group.ok = saved.persistence === 'origin'
          ? group.clearBeforeAnyKey === true &&
          group.vaultSaysOrigin === true &&
          group.headingSaysRemembered === true &&
          group.boxAgreesWithTheVault === true
          : group.clearBeforeAnyKey === true;

        engine.ai.clearKey('key-state-probe');
        engine.ai.remove('key-state-probe');
        engine.setAiSettings(false);
        await frames();
      }

      /* ------------------------------------------------------------------ *
       * 16. The context chips are switches, minimal by default, and they filter the bundle.
       * ------------------------------------------------------------------ */
      progress.textContent = 'contextChipsChooseWhatIsSent';
      {
        await settle(subject);
        deepFind('.ai').click();
        await frames();
        const menu = () => deepFind('heo-ai-menu')?.shadowRoot;
        const chips = () => Array.from(menu()?.querySelectorAll('.scope') ?? []);
        const flat = (node) => (node?.textContent ?? '').replace(/\s+/g, ' ').trim();

        /*
         * Back to minimal, because an earlier group widened it and the setting is sticky.
         *
         * What the default *is* was captured at mount as `defaultContextScope`; what this group
         * checks is the behaviour at minimal scope, so it establishes minimal rather than assuming
         * whatever the last group left behind.
         */
        engine.setAiContextScope('classes', false);
        engine.setAiContextScope('rules', false);
        engine.setAiContextScope('parent', false);
        await frames();

        const labels = chips().map((one) => flat(one));
        const onAtStart = chips().filter((one) =>
          one.classList.contains('on')).map((one) => flat(one));
        const switches = chips().filter((one) => one.getAttribute('role') === 'switch');
        /*
         * Read now, not at assertion time.
         *
         * `switches` holds live elements, so asking them about aria-checked after the chip has
         * been pressed reports the state afterwards — which is how this asserted "they all start
         * off" against a list where one had just been switched on.
         */
        const uncheckedAtStart = switches.every(
          (one) => one.getAttribute('aria-checked') === 'false',
        );

        asked.length = 0;
        await engine.promptAi('probe with the default scope');
        const lean = JSON.parse(asked[0]?.context ?? '{}');

        // Turn the parent on through the chip, the way a user would.
        const parentChip = switches.find((one) => /parent/i.test(flat(one)));
        parentChip?.click();
        await frames();
        asked.length = 0;
        await engine.promptAi('probe with the parent included');
        const wide = JSON.parse(asked[0]?.context ?? '{}');

        results.contextChipsChooseWhatIsSent = {
          labels,
          // Four things offered, and only the element on to begin with.
          fourChips: chips().length === 4,
          // The documented default, from the read taken before any group ran.
          defaultContextScope,
          defaultIsTheElementAlone:
            defaultContextScope.classes === false &&
            defaultContextScope.rules === false &&
            defaultContextScope.parent === false,
          onlyTheElementAtStart: onAtStart.length === 1 && /this element/i.test(onAtStart[0]),
          // The other three are real switches, not badges.
          threeAreSwitches: switches.length === 3,
          startUnchecked: uncheckedAtStart,
          // The element chip is a statement: no switch role, so nothing invites pressing it.
          elementIsNotASwitch: chips().some(
            (one) => one.classList.contains('fixed') && one.getAttribute('role') !== 'switch',
          ),
          // The default request withholds the surroundings, and says so.
          leanWithheld: lean.withheld,
          leanSendsNoParent: lean.parent === null,
          leanSendsNoRules: Array.isArray(lean.rules) && lean.rules.length === 0,
          // Class names still travel; what they declare does not.
          leanKeepsClassNames: (lean.classes ?? []).length > 0,
          leanWithholdsDeclarations: (lean.classes ?? []).every(
            (one) => one.declarations === undefined,
          ),
          leanSaysWhatIsMissing: /Out of scope for this request/.test(asked[0]?.context ?? ''),
          // Pressing the chip changes what actually goes out, which is the whole point.
          chipFlipped: parentChip?.getAttribute('aria-checked') === 'true',
          wideWithheld: wide.withheld,
          wideSendsTheParent: Boolean(wide.parent),
          parentWasTheOnlyChange: Array.isArray(wide.withheld) &&
            !wide.withheld.includes('parent') && wide.withheld.includes('rules'),
        };
        const group = results.contextChipsChooseWhatIsSent;
        group.ok =
          group.fourChips === true &&
          group.defaultIsTheElementAlone === true &&
          group.onlyTheElementAtStart === true &&
          group.threeAreSwitches === true &&
          group.startUnchecked === true &&
          group.elementIsNotASwitch === true &&
          group.leanSendsNoParent === true &&
          group.leanSendsNoRules === true &&
          group.leanKeepsClassNames === true &&
          group.leanWithholdsDeclarations === true &&
          group.leanSaysWhatIsMissing === true &&
          group.chipFlipped === true &&
          group.wideSendsTheParent === true &&
          group.parentWasTheOnlyChange === true;

        // Back to minimal for whatever runs next.
        parentChip?.click();
        await frames();
      }

      /* ------------------------------------------------------------------ *
       * 17. A quick action sends its own sentence, and shows what it sent.
       * ------------------------------------------------------------------ */
      progress.textContent = 'quickActionsSendTheirOwnPrompt';
      {
        const menu = () => deepFind('heo-ai-menu')?.shadowRoot;
        const flat = (node) => (node?.textContent ?? '').replace(/\s+/g, ' ').trim();
        const quick = menu()?.querySelector('.quick');
        const buttons = Array.from(quick?.querySelectorAll('button') ?? []);
        const box = menu()?.querySelector('textarea');
        // Above the box, because they are an alternative to typing rather than something to do
        // with what has already been typed.
        const aboveTheBox = quick && box
          ? quick.getBoundingClientRect().top < box.getBoundingClientRect().top
          : false;

        asked.length = 0;
        const shorter = buttons.find((one) => /make shorter/i.test(flat(one)));
        shorter?.click();
        await frames();
        await wait(150);

        results.quickActionsSendTheirOwnPrompt = {
          labels: buttons.map((one) => flat(one)),
          offersTheNamedTwo: buttons.some((one) => /make shorter/i.test(flat(one))) &&
            buttons.some((one) => /improve writing/i.test(flat(one))),
          aboveTheBox,
          sentSomething: asked.length === 1,
          // A whole instruction, not the label: "Make shorter" alone invites cutting information.
          sentASentenceNotTheLabel: (asked[0]?.prompt ?? '').length > 40,
          sentTheRightOne: /shorter/i.test(asked[0]?.prompt ?? ''),
          saysWhatMustSurvive: /cut words, not information/i.test(asked[0]?.prompt ?? ''),
          // And the box now holds it, so the result can be read against the request and re-sent.
          boxShowsWhatWasAsked: (menu()?.querySelector('textarea')?.value ?? '').length > 40,
        };
        const group = results.quickActionsSendTheirOwnPrompt;
        group.ok =
          group.offersTheNamedTwo === true &&
          group.aboveTheBox === true &&
          group.sentSomething === true &&
          group.sentASentenceNotTheLabel === true &&
          group.sentTheRightOne === true &&
          group.saysWhatMustSurvive === true &&
          group.boxShowsWhatWasAsked === true;
      }

      /* ------------------------------------------------------------------ *
       * 18. While it works the element says so; when it finishes a toast carries the summary.
       * ------------------------------------------------------------------ */
      progress.textContent = 'theRunIsVisibleWhileAndAfter';
      {
        const layer = () => deepFind('heo-selection-layer');
        const busyBefore = layer()?.hasAttribute('data-ai-busy');

        // Hold the reply open so "while it is working" is a state that can be sampled.
        holdTheReply();
        const run = engine.promptAi('take your time');
        await frames();
        await frames();
        const busyDuring = layer()?.hasAttribute('data-ai-busy');
        const outlineDuring = layer()?.shadowRoot?.querySelector('.select');
        const animatedDuring = outlineDuring
          ? getComputedStyle(outlineDuring).animationName
          : null;
        openGate();
        const outcome = await run;
        await frames();

        const busyAfter = layer()?.hasAttribute('data-ai-busy');
        const toast = engine.store.value.toast;
        const toastEl = deepFind('heo-toast')?.shadowRoot?.querySelector('.toast');
        const flat = (node) => (node?.textContent ?? '').replace(/\s+/g, ' ').trim();

        results.theRunIsVisibleWhileAndAfter = {
          busyBefore: busyBefore === false,
          // The outline itself, not just the little sparkle button at the corner.
          busyDuring: busyDuring === true,
          animatedDuring,
          theOutlineAnimates: /heo-ai-sheen|heo-ai-halo/.test(animatedDuring ?? ''),
          busyClearedAfter: busyAfter === false,
          // The summary reaches a toast, because in the popover it sits below the fold.
          toastRaised: Boolean(toast),
          toastTitle: toast?.title ?? null,
          toastCountsWhatLanded: /\d+ change|Nothing was changed/.test(toast?.title ?? ''),
          toastCarriesTheSummary: toast?.message === outcome?.summary,
          // The AI's own mark rather than the tone's tick.
          toastUsesTheAiGlyph: toast?.icon === 'sparkle',
          // Roomy, so a sentence is not crammed into a pill.
          toastIsRoomy: toastEl?.classList.contains('roomy') === true,
          toastShowsBothLines: Boolean(flat(toastEl?.querySelector('.title'))) &&
            Boolean(flat(toastEl?.querySelector('.msg'))),
          // The glyph is the big one on the left.
          glyphIsLarge: (() => {
            const g = toastEl?.querySelector('.glyph');
            const r = g?.getBoundingClientRect();
            return r ? Math.round(r.width) >= 28 : false;
          })(),
          // Undo rides along, because the whole run is one step.
          offersUndo: /undo/i.test(toast?.action?.label ?? ''),
        };
        const group = results.theRunIsVisibleWhileAndAfter;
        group.ok =
          group.busyBefore === true &&
          group.busyDuring === true &&
          group.theOutlineAnimates === true &&
          group.busyClearedAfter === true &&
          group.toastRaised === true &&
          group.toastCountsWhatLanded === true &&
          group.toastCarriesTheSummary === true &&
          group.toastUsesTheAiGlyph === true &&
          group.toastIsRoomy === true &&
          group.toastShowsBothLines === true &&
          group.glyphIsLarge === true &&
          group.offersUndo === true;
      }

      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value === false))
        .map(([name]) => name);

      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify(
        { ok: failed.length === 0, failed, ...results, errors }, null, 1,
      ) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:{"ok":false,"__fatal":' + JSON.stringify(String((e && e.stack) || e)) + '}:END';
    });
  </script>
</body>

</html>
