<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>An AI run lands live, stops on request, and is one undo</title>
  <link rel="stylesheet" href="./ai-run.css">
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
    }

    #report {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <main id="main">
    <section id="host" class="wrap">
      <article id="subject" class="card">
        <h2 id="title">Original heading.</h2>
        <p id="body">Original words.</p>
      </article>
      <article id="sibling" class="card">A sibling.</article>
    </section>
  </main>

  <div id="report">
    <pre id="progress">start</pre>
    <pre id="out">pending</pre>
  </div>

  <script type="module">
    (async () => {
      const errors = [];
      addEventListener('error', (e) => errors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

      const progress = document.getElementById('progress');
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const results = {};

      const { mount } = await import('../dist/html-editor-overlay.js');
      const api = mount({ theme: 'dark', presets: false, detectScriptContent: false });
      const engine = api.engine;
      api.setEditing(true);
      await engine.whenReady();
      await frames();

      const subject = document.getElementById('subject');

      /** One provider set. Providers carry no permission; scope is the popover's business. */
      const openScope = () => engine.ai.import([{
        id: 'scripted', label: 'Scripted', transport: 'local',
        provider: 'openai-compatible', baseURL: 'http://127.0.0.1:1/v1', model: 'test',
      }]);
      /*
       * Every scope switched on for the fixture as a whole.
       *
       * A run defaults to whatever the popover currently says, and that starts minimal — which is
       * right, and would make most of the groups below refuse the very operations they exist to
       * apply. They are about streaming, undo, records and side effects rather than about the
       * boundary; the groups that *are* about the boundary set their own scope explicitly.
       */
      const openRequestScope = () => {
        for (const key of ['classes', 'rules', 'parent']) engine.setAiContextScope(key, true);
      };
      openRequestScope();

      /**
       * A scripted stream of operations.
       *
       * `gap` puts a real await between them, which is what makes the run observable in
       * flight — without it every operation lands in one microtask burst and "the user watches
       * it happen" is untested.
       */
      const scripted = (ops, gap = 0, onEach) => (async function* () {
        for (const op of ops) {
          if (gap) await wait(gap);
          onEach?.(op);
          yield op;
        }
      })();

      const reset = async () => {
        engine.resetAll();
        await frames();
      };

      /* ------------------------------------------------------------------ *
       * 1. A whole run lands, and is a single entry on the undo stack.
       * ------------------------------------------------------------------ */
      progress.textContent = 'oneRunIsOneUndo';
      openScope();
      {
        await reset();
        const before = {
          title: document.getElementById('title').textContent,
          style: subject.getAttribute('style'),
          classes: subject.getAttribute('class'),
        };
        const outcome = await engine.runAiOperations(scripted([
          { op: 'setText', html: '<h2 id="title">Rewritten heading.</h2><p id="body">Rewritten words.</p>' },
          { op: 'setStyles', declarations: { 'background-color': 'rgb(255, 240, 200)', padding: '28px' } },
          { op: 'setClasses', add: ['featured'] },
          { op: 'upsertClass', name: 'featured', declarations: { 'border-radius': '14px' } },
          { op: 'upsertRule', selector: '#subject h2', declarations: { 'letter-spacing': '0.04em' } },
          { op: 'setParentStyles', declarations: { gap: '18px' } },
          { op: 'summary', text: 'Rewrote the copy and warmed up the card.' },
        ]), 'warm this card up', subject);

        /*
         * Past the merge window before counting.
         *
         * `sealStep` should make this unnecessary, and asserting it without waiting is how a
         * count of one passes because two entries merged rather than because one was made.
         */
        await wait(2600);
        const undoDepth = () => {
          let depth = 0;
          while (engine.store.value.canUndo && depth < 20) { engine.undo(); depth += 1; }
          return depth;
        };

        results.oneRunIsOneUndo = {
          applied: outcome.applied,
          refused: outcome.refused,
          // The page shows every change.
          textChanged: /Rewritten heading/.test(subject.innerHTML),
          styleLanded: /padding/.test(subject.getAttribute('style') ?? ''),
          classAdded: subject.classList.contains('featured'),
          classDefined: Boolean(engine.classes.get('featured')?.declarations['border-radius']),
          /*
           * Read off the page, not out of the registry.
           *
           * `#subject h2` is declared in this fixture's own stylesheet, so the edit patches
           * that rule rather than adding a registry one — which is the better outcome and the
           * one `patchesThePagesOwnRule` is about. Asserting on the registry here measured the
           * worse behaviour and failed the moment the product improved.
           */
          ruleApplied: getComputedStyle(document.getElementById('title')).letterSpacing !== 'normal',
          parentStyled: /gap/.test(document.getElementById('host').getAttribute('style') ?? ''),
          // The model's own words come back as the summary.
          summary: outcome.summary,
          usedTheModelsSummary: outcome.summary === 'Rewrote the copy and warmed up the card.',
          // One record per declaration, so the save dialog can still review them one by one.
          recordCount: engine.records.length,
          recordsPerDeclaration: engine.records.length >= 6,
          // And one undo takes the whole run back.
          undoSteps: 0,
          restored: null,
        };
        const group = results.oneRunIsOneUndo;
        group.undoSteps = undoDepth();
        await frames();
        group.restored = {
          title: document.getElementById('title')?.textContent ?? null,
          style: subject.getAttribute('style'),
          classes: subject.getAttribute('class'),
          classGone: engine.classes.get('featured')?.declarations['border-radius'] ?? null,
          ruleLetterSpacing: getComputedStyle(document.getElementById('title')).letterSpacing,
          parentStyle: document.getElementById('host').getAttribute('style'),
        };
        group.ok =
          group.applied === 6 &&
          group.refused === 0 &&
          group.textChanged === true &&
          group.styleLanded === true &&
          group.classAdded === true &&
          group.classDefined === true &&
          group.ruleApplied === true &&
          group.parentStyled === true &&
          group.usedTheModelsSummary === true &&
          group.recordsPerDeclaration === true &&
          group.undoSteps === 1 &&
          group.restored.title === before.title &&
          group.restored.style === before.style &&
          group.restored.classes === before.classes &&
          group.restored.classGone === null &&
          // Undo has to put the page's own rule back as it was, not merely stop overriding it.
          group.restored.ruleLetterSpacing === 'normal' &&
          group.restored.parentStyle === null;
      }

      /* ------------------------------------------------------------------ *
       * 2. Changes appear as they arrive, not all at the end.
       * ------------------------------------------------------------------ */
      progress.textContent = 'landsAsItGoes';
      {
        await reset();
        /** What the page looked like when the third operation was about to be sent. */
        let midRun = null;
        const seen = [];
        const stream = scripted([
          { op: 'setStyles', declarations: { color: 'rgb(180, 20, 20)' } },
          { op: 'setStyles', declarations: { 'font-size': '19px' } },
          { op: 'setStyles', declarations: { 'font-weight': '700' } },
          { op: 'summary', text: 'Restyled.' },
        ], 30, (op) => {
          seen.push(op.op);
          // Before the third lands, the first two must already be on the element.
          if (seen.length === 3) midRun = subject.getAttribute('style');
        });
        const outcome = await engine.runAiOperations(stream, 'restyle', subject);
        results.landsAsItGoes = {
          midRun,
          firstLandedBeforeLast: /color/.test(midRun ?? ''),
          secondLandedBeforeLast: /font-size/.test(midRun ?? ''),
          // And the last one was not somehow already there.
          lastWasNotEarly: !/font-weight/.test(midRun ?? ''),
          allThereAtTheEnd: /font-weight/.test(subject.getAttribute('style') ?? ''),
          applied: outcome.applied,
        };
        const group = results.landsAsItGoes;
        group.ok =
          group.firstLandedBeforeLast === true &&
          group.secondLandedBeforeLast === true &&
          group.lastWasNotEarly === true &&
          group.allThereAtTheEnd === true &&
          group.applied === 3;
      }

      /* ------------------------------------------------------------------ *
       * 3. Stopping keeps what landed, and it is still one undo.
       * ------------------------------------------------------------------ */
      progress.textContent = 'abortKeepsWhatLanded';
      {
        await reset();
        const stream = scripted([
          { op: 'setStyles', declarations: { color: 'rgb(20, 120, 60)' } },
          { op: 'setStyles', declarations: { 'font-style': 'italic' } },
          { op: 'setStyles', declarations: { 'text-decoration': 'underline' } },
          { op: 'setStyles', declarations: { opacity: '0.5' } },
          { op: 'summary', text: 'Should never be reached.' },
        ], 40, (op) => {
          // Stop the moment the third is about to be sent.
          if (op.declarations && 'text-decoration' in op.declarations) engine.ai.abort();
        });
        const outcome = await engine.runAiOperations(stream, 'restyle then stop', subject);
        await wait(2600);
        const style = subject.getAttribute('style') ?? '';
        results.abortKeepsWhatLanded = {
          reportedAborted: outcome.aborted,
          applied: outcome.applied,
          keptTheFirstTwo: /color/.test(style) && /font-style/.test(style),
          droppedTheRest: !/opacity/.test(style),
          // No summary arrived, so the run says what it can honestly say.
          summary: outcome.summary,
          saidItStopped: /Stopped/.test(outcome.summary),
          undoSteps: (() => {
            let depth = 0;
            while (engine.store.value.canUndo && depth < 20) { engine.undo(); depth += 1; }
            return depth;
          })(),
          styleAfterUndo: subject.getAttribute('style'),
        };
        const group = results.abortKeepsWhatLanded;
        group.ok =
          group.reportedAborted === true &&
          group.applied === 2 &&
          group.keptTheFirstTwo === true &&
          group.droppedTheRest === true &&
          group.saidItStopped === true &&
          group.undoSteps === 1 &&
          group.styleAfterUndo === null;
      }

      /* ------------------------------------------------------------------ *
       * 4. A run that changes nothing commits nothing.
       * ------------------------------------------------------------------ */
      progress.textContent = 'nothingAppliedNothingCommitted';
      {
        await reset();
        const outcome = await engine.runAiOperations(scripted([
          { op: 'upsertRule', selector: 'body', declarations: { color: 'red' } },
          { op: 'setStyles', declarations: { 'not a property': '1' } },
          { op: 'summary', text: 'Could not do it.' },
        ]), 'try something out of reach', subject);
        results.nothingAppliedNothingCommitted = {
          applied: outcome.applied,
          refused: outcome.refused,
          empty: outcome.empty,
          // Nothing on the stack, and nothing to save — which is what "empty" has to mean.
          nothingToUndo: engine.store.value.canUndo === false,
          noRecords: engine.records.length === 0,
          // Every refusal carries its reason, so a run that did nothing says why.
          everyRefusalExplained: outcome.entries
            .filter((entry) => entry.outcome === 'refused')
            .every((entry) => typeof entry.text === 'string' && entry.text.length > 8),
          reasons: outcome.entries.filter((e) => e.outcome === 'refused').map((e) => e.text),
        };
        const group = results.nothingAppliedNothingCommitted;
        group.ok =
          group.applied === 0 &&
          group.refused === 2 &&
          group.empty === true &&
          group.nothingToUndo === true &&
          group.noRecords === true &&
          group.everyRefusalExplained === true;
      }

      /* ------------------------------------------------------------------ *
       * 5. Side effects are reported as facts about what happened.
       * ------------------------------------------------------------------ */
      progress.textContent = 'reportsItsSideEffects';
      {
        await reset();
        const outcome = await engine.runAiOperations(scripted([
          // `.card` is worn by the subject and its sibling, so this is a shared edit.
          { op: 'upsertClass', name: 'card', declarations: { padding: '30px' } },
          { op: 'setParentStyles', declarations: { gap: '22px' } },
          { op: 'setStyles', declarations: { color: 'rgb(10, 10, 10)' } },
          { op: 'summary', text: 'Loosened things up.' },
        ]), 'loosen the spacing', subject);
        results.reportsItsSideEffects = {
          warnings: outcome.warnings,
          // One per reaching change, and none for the change confined to the element.
          warnedAboutTwo: outcome.warnings.length === 2,
          namedTheClass: outcome.warnings.some((w) => /\.card/.test(w)),
          // The count is the point: "12 elements use it" is what makes it a decision.
          countedTheClassUsers: outcome.warnings.some((w) => /\b2 elements\b/.test(w)),
          namedTheParent: outcome.warnings.some((w) => /parent/.test(w)),
          didNotWarnAboutTheElement: !outcome.warnings.some((w) => /\bcolor\b/.test(w)),
          applied: outcome.applied,
        };
        const group = results.reportsItsSideEffects;
        group.ok =
          group.warnedAboutTwo === true &&
          group.namedTheClass === true &&
          group.countedTheClassUsers === true &&
          group.namedTheParent === true &&
          group.didNotWarnAboutTheElement === true &&
          group.applied === 3;
      }

      /* ------------------------------------------------------------------ *
       * 7. A rule the page's own stylesheet declares is patched, not overridden.
       * ------------------------------------------------------------------ */
      progress.textContent = 'patchesThePagesOwnRule';
      openScope();
      {
        await reset();
        const outcome = await engine.runAiOperations(scripted([
          { op: 'upsertRule', selector: '#subject h2', declarations: { color: 'rgb(120, 0, 90)' } },
          { op: 'summary', text: 'Recoloured the heading.' },
        ]), 'recolour the heading', subject);
        const record = engine.records.find((one) => one.target === '#subject h2');
        results.patchesThePagesOwnRule = {
          applied: outcome.applied,
          // Recorded as a stylesheet-rule edit, which is what makes the save patch the file
          // the author wrote rather than appending an override that wins by coming later.
          recordedAsARuleEdit: record?.detail?.scope === 'stylesheet rule',
          namedTheFile: record?.detail?.file ?? null,
          /*
           * The scanned entry for this selector is left exactly as it was read.
           *
           * The registry holds `#subject h2` because it scanned this fixture's stylesheet at
           * mount, so its mere presence proves nothing. What matters is that the edit did not
           * turn it into a `user` rule carrying the new declaration — which is what would emit
           * a second, overriding copy alongside the one that was patched.
           */
          scannedEntryOrigin: engine.rules.get('#subject h2')?.origin ?? null,
          didNotForkTheRule: engine.rules.get('#subject h2')?.declarations.color !== 'rgb(120, 0, 90)',
          computed: getComputedStyle(document.getElementById('title')).color,
        };
        const group = results.patchesThePagesOwnRule;
        group.ok =
          group.applied === 1 &&
          group.recordedAsARuleEdit === true &&
          typeof group.namedTheFile === 'string' &&
          group.scannedEntryOrigin === 'stylesheet' &&
          group.didNotForkTheRule === true &&
          group.computed === 'rgb(120, 0, 90)';
      }

      /* ------------------------------------------------------------------ *
       * 8. A broken request says so rather than looking like a model that did nothing.
       * ------------------------------------------------------------------ */
      progress.textContent = 'reportsAFailure';
      {
        await reset();
        const breaking = (async function* () {
          yield { op: 'setStyles', declarations: { color: 'rgb(0, 90, 160)' } };
          await wait(10);
          throw new Error('The provider closed the connection.');
        })();
        const outcome = await engine.runAiOperations(breaking, 'break halfway', subject);
        await wait(2600);
        results.reportsAFailure = {
          failure: outcome.failure,
          saidWhy: /closed the connection/.test(outcome.failure ?? ''),
          summaryCarriesIt: /closed the connection/.test(outcome.summary),
          // What landed before the break is still there, and still undoable.
          keptWhatLanded: /color/.test(subject.getAttribute('style') ?? ''),
          undoSteps: (() => {
            let depth = 0;
            while (engine.store.value.canUndo && depth < 20) { engine.undo(); depth += 1; }
            return depth;
          })(),
        };
        const group = results.reportsAFailure;
        group.ok =
          group.saidWhy === true &&
          group.summaryCarriesIt === true &&
          group.keptWhatLanded === true &&
          group.undoSteps === 1;
      }

      /* ------------------------------------------------------------------ *
       * A nested node can be styled with no permission at all.
       *
       * The complaint this pins: with only Classes enabled, a request to restyle the bold text
       * inside the element came back "Nothing was changed — changing the nested <b> elements or
       * adding a rule is not permitted". That was wrong, and it was the prompt's fault rather than
       * the broker's. Everything inside the element is the element's own markup, setText is
       * element-scoped and therefore always allowed, and the sanitiser keeps style and class
       * attributes on descendants. So the route existed and the model was never told about it.
       * ------------------------------------------------------------------ */
      progress.textContent = 'nestedNodesAreReachableWithoutPermission';
      {
        engine.ai.upsert({
          id: 'nested-probe',
          label: 'Nested probe',
          transport: 'local',
          provider: 'openai-compatible',
          baseURL: 'http://127.0.0.1:9/v1',
          model: 'm',
        });
        engine.ai.activate('nested-probe');

        const host = document.createElement('p');
        host.id = 'nested-host';
        host.innerHTML = 'Some <b>bold</b> text.';
        subject.append(host);
        api.select(host);

        const rulesBefore = engine.rules.list().length;
        // Nothing in scope beyond the element itself.
        const bare = { classes: false, rules: false, parent: false };

        const styled = await engine.runAiOperations(
          (async function* () {
            yield {
              op: 'setText',
              html: 'Some <b style="color: rgb(204, 0, 0)">bold</b> text.',
            };
            yield { op: 'summary', text: 'Made the bold text red.' };
          })(),
          'make the bold text red',
          host,
          bare,
        );
        /*
         * Snapshotted here, not read at assertion time.
         *
         * `setInnerHTML` reuses the nodes it can — that is what keeps undo and element identity
         * working — so the second run below rewrites the very same <b>, swapping its style
         * attribute for a class. A variable pointing at it therefore describes the *last* run
         * whenever it is read. Everything asserted about this run is captured now.
         */
        const firstRun = (() => {
          const bold = host.querySelector('b');
          return {
            style: bold?.getAttribute('style') ?? '',
            colour: bold ? getComputedStyle(bold).color : null,
            markup: host.innerHTML,
          };
        })();

        // And the class route, which needs only the permission the user actually granted.
        const withClasses = await engine.runAiOperations(
          (async function* () {
            yield { op: 'upsertClass', name: 'ai-strong', declarations: { 'font-style': 'italic' } };
            yield { op: 'setText', html: 'Some <b class="ai-strong">bold</b> text.' };
            yield { op: 'summary', text: 'Gave the bold text a reusable class.' };
          })(),
          'style the bold text with a class',
          host,
          { classes: true, rules: false, parent: false },
        );
        const secondRun = (() => {
          const bold = host.querySelector('b');
          return {
            wearsTheClass: bold?.classList.contains('ai-strong') === true,
            fontStyle: bold ? getComputedStyle(bold).fontStyle : null,
          };
        })();

        results.nestedNodesAreReachableWithoutPermission = {
          // With nothing granted at all, the inline route still lands.
          styledApplied: styled.applied,
          styledEntries: styled.entries.map((one) => one.outcome),
          markupAfterTheInlineRoute: firstRun.markup,
          keptTheInlineStyleOnTheChild: firstRun.style.includes('color'),
          boldColour: firstRun.colour,
          childIsActuallyRed: firstRun.colour === 'rgb(204, 0, 0)',
          // The sanitiser did not strip it, which is what makes the advice honest.
          nothingWasStripped: !styled.entries.some((one) => /removed|stripped/i.test(
            (one.notes ?? []).join(' '),
          )),
          // No rule was needed, so none was written.
          noRuleWasNeeded: engine.rules.list().length === rulesBefore,

          // The class route: define it once, wear it on the child.
          classApplied: withClasses.applied,
          classWasDefined: engine.classes.get('ai-strong')?.declarations['font-style'] === 'italic',
          childWearsTheClass: secondRun.wearsTheClass,
          childIsActuallyItalic: secondRun.fontStyle === 'italic',
        };
        const group = results.nestedNodesAreReachableWithoutPermission;
        group.ok =
          group.styledApplied === 1 &&
          group.keptTheInlineStyleOnTheChild === true &&
          group.childIsActuallyRed === true &&
          group.noRuleWasNeeded === true &&
          group.classApplied === 2 &&
          group.classWasDefined === true &&
          group.childWearsTheClass === true &&
          group.childIsActuallyItalic === true;

        host.remove();
        engine.ai.remove('nested-probe');
        api.select(subject);
      }

      /* ------------------------------------------------------------------ *
       * A withheld scope is a refused scope.
       *
       * The bug a user found: the popover chips narrowed what the model was *shown* and left it
       * fully entitled to write what it had not been shown. Unticking "CSS rules" therefore removed
       * the rules from the prompt and the model, told rules existed and that it might change them,
       * invented a selector — which landed in the rule registry and showed up in the Tokens panel.
       * ------------------------------------------------------------------ */
      progress.textContent = 'aWithheldScopeCannotBeChanged';
      {
        engine.ai.upsert({
          id: 'scope-intersect',
          label: 'Intersect probe',
          transport: 'local',
          provider: 'openai-compatible',
          baseURL: 'http://127.0.0.1:9/v1',
          model: 'm',
          // The provider permits everything, which is the default and the point: the narrowing
          // has to come from the request, not from the settings.,
        });
        engine.ai.activate('scope-intersect');
        api.select(subject);

        const rulesBefore = engine.rules.list().length;
        const classesBefore = engine.classes.list().length;
        const ops = () => (async function* () {
          yield { op: 'upsertRule', selector: '#subject', declarations: { 'letter-spacing': '3px' } };
          yield { op: 'upsertClass', name: 'ai-invented', declarations: { padding: '9px' } };
          yield { op: 'setStyles', declarations: { opacity: '0.7' } };
          yield { op: 'summary', text: 'Tried a rule, a class and an inline style.' };
        })();

        /*
          * Minimal scope, set the way the chips set it and read back from the store.
          *
          * `runAiOperations` defaults to whatever the popover currently says, so this drives the
          * real path rather than passing a scope in beside it.
          */
        engine.setAiContextScope('classes', false);
        engine.setAiContextScope('rules', false);
        engine.setAiContextScope('parent', false);
        const leanScope = { ...engine.store.value.aiContextScope };
        const lean = await engine.runAiOperations(
          ops(),
          'probe with rules and classes withheld',
          subject,
        );
        const leanText = JSON.stringify(lean.entries);
        /*
         * Read now, between the two runs.
         *
         * These are facts about the registries after the narrow run, and the wide run below
         * deliberately writes both — so asking at assertion time reported the state afterwards and
         * called the fix broken. Same shape of mistake as reading an aria-checked after clicking it.
         */
        const afterLean = {
          rules: engine.rules.list().length,
          classes: engine.classes.list().length,
          invented: engine.classes.get('ai-invented') !== undefined,
        };

        // Now with both switched on, which is the discriminating half.
        engine.setAiContextScope('classes', true);
        engine.setAiContextScope('rules', true);
        const wideScope = { ...engine.store.value.aiContextScope };
        const wide = await engine.runAiOperations(
          ops(),
          'probe with rules and classes included',
          subject,
        );

        results.aWithheldScopeCannotBeChanged = {
          // The request is the only thing that decides; a provider carries no permission at all.
          providerCarriesNoScope: 'scope' in (engine.ai.get('scope-intersect') ?? {}) === false,
          leanScope,
          leanScopeIsMinimal:
            leanScope.classes === false && leanScope.rules === false && leanScope.parent === false,
          wideScope,
          wideScopeOpenedBoth: wideScope.classes === true && wideScope.rules === true,
          leanEntries: lean.entries.map((one) => one.outcome),
          // Refused, not silently dropped and not applied.
          refusedTheRule: lean.entries.some(
            (one) => one.outcome === 'refused' && /CSS rules/i.test(one.text),
          ),
          refusedTheClass: lean.entries.some(
            (one) => one.outcome === 'refused' && /Reusable classes/i.test(one.text),
          ),
          // The element's own inline style is untouched by any of this.
          appliedTheInlineStyle: /opacity/.test(subject.getAttribute('style') ?? ''),
          leanApplied: lean.applied,
          // Nothing reached either registry, which is what the user actually saw go wrong.
          noRuleWasWritten: afterLean.rules === rulesBefore,
          noClassWasWritten: afterLean.classes === classesBefore,
          didNotInventTheClass: afterLean.invented === false,
          leanSaysWhy: /switched off for this request/i.test(leanText),

          // With the scopes included, the same operations go through.
          wideApplied: wide.applied,
          wideWroteTheRule: engine.rules.list().length > rulesBefore,
          wideWroteTheClass: engine.classes.get('ai-invented') !== undefined,
        };
        const group = results.aWithheldScopeCannotBeChanged;
        group.ok =
          group.providerCarriesNoScope === true &&
          group.leanScopeIsMinimal === true &&
          group.wideScopeOpenedBoth === true &&
          group.refusedTheRule === true &&
          group.refusedTheClass === true &&
          group.appliedTheInlineStyle === true &&
          group.leanApplied === 1 &&
          group.noRuleWasWritten === true &&
          group.noClassWasWritten === true &&
          group.didNotInventTheClass === true &&
          group.leanSaysWhy === true &&
          group.wideApplied === 3 &&
          group.wideWroteTheRule === true &&
          group.wideWroteTheClass === true;

        openRequestScope();
        engine.ai.remove('scope-intersect');
      }

      /* ------------------------------------------------------------------ *
       * A provider with no base URL is refused, not sent to this page.
       *
       * This fixture mounts without a transport stub, so a request here goes through the real
       * `createTransport` — which is the only place this guard can be exercised.
       * ------------------------------------------------------------------ */
      progress.textContent = 'aProviderWithNoHostIsRefused';
      {
        /*
         * The failure this prevents.
         *
         * `endpointFor` appends a path to whatever base it holds, so an empty base produced
         * `/chat/completions` — a relative URL, resolved against the page. The request went to the
         * user's own site carrying their API key in an Authorization header, came back as HTML, and
         * reported "the provider answered, but not with anything this editor could read". Wrong
         * destination, key in the wrong server's logs, and a message blaming the model for a blank
         * settings field.
         *
         * Reachable without doing anything odd: a proxied set carries no base URL by design, and
         * switching one to a tier that sends its own requests leaves it empty whenever the dialect
         * has no default host — which openai-compatible deliberately does not have.
         */
        engine.ai.upsert({
          id: 'no-host',
          label: 'Hostless probe',
          transport: 'in-page',
          provider: 'openai-compatible',
          model: 'm',
        });
        engine.ai.activate('no-host');
        await engine.ai.setKey('no-host', 'sk-fixture-only-never-sent');

        const before = engine.records.length;
        const requests = [];
        const realFetch = window.fetch;
        // Any request at all is the failure, so the only reliable assertion is that none happened.
        window.fetch = (...args) => {
          requests.push(String(args[0]));
          return realFetch.apply(window, args);
        };
        let outcome = null;
        try {
          outcome = await engine.promptAi('this must not leave the page', subject);
        } finally {
          window.fetch = realFetch;
        }

        results.aProviderWithNoHostIsRefused = {
          requestsMade: requests,
          nothingWasRequested: requests.length === 0,
          failure: outcome?.failure ?? null,
          // Named, and it names the field to fix rather than blaming the model.
          saysThereIsNoHost: /no base URL/i.test(outcome?.failure ?? ''),
          namesTheProvider: /Hostless probe/.test(outcome?.failure ?? ''),
          suggestsTheFix: /127\.0\.0\.1:11434/.test(outcome?.failure ?? ''),
          // And nothing was changed on the way to failing.
          changedNothing: engine.records.length === before,
          appliedNothing: outcome?.applied === 0,
        };
        const group = results.aProviderWithNoHostIsRefused;
        group.ok =
          group.nothingWasRequested === true &&
          group.saysThereIsNoHost === true &&
          group.namesTheProvider === true &&
          group.suggestsTheFix === true &&
          group.changedNothing === true &&
          group.appliedNothing === true;

        engine.ai.clearKey('no-host');
        engine.ai.remove('no-host');
      }

      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value === false))
        .map(([name]) => name);

      document.getElementById('out').textContent = 'RESULTS:' + JSON.stringify(
        { ok: failed.length === 0, failed, ...results, errors }, null, 1,
      ) + ':END';
    })().catch((e) => {
      document.getElementById('out').textContent =
        'RESULTS:{"ok":false,"__fatal":' + JSON.stringify(String((e && e.stack) || e)) + '}:END';
    });
  </script>
</body>

</html>
