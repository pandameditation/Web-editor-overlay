<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>A captured card looks the same pasted into a page with its own CSS</title>
  <style>
    #source {
      width: 1000px;
      height: 900px;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>
  <main id="stage">
    <p id="page-para">Page paragraph</p>
  </main>
  <iframe id="source" title="source page"></iframe>
  <pre id="progress">start</pre>
  <pre id="out">pending</pre>
  <script src="../dist/html-editor-overlay.iife.js"></script>
  <script>
    /*
     * The user report: "it doesn't look like it did in its original context once pasted. Icon fonts
     * were not transferred, sizes look off, the background is not kept." A typical site card has
     * every cause of that at once:
     *   - its rules hang off ancestors that do not come along (`.page .grid > .card`, `html.theme`);
     *   - the root font size is 10px and everything is in rem;
     *   - it is see-through, painted over the body's dark background;
     *   - its width comes from a three-column grid;
     *   - its icon is an icon font set through `font: var(--icon-font)` on `::before`, with the
     *     variable defined on :root;
     *   - its grid placement and an `@media` rule must still respond after the paste.
     * The paste target is hostile in the ordinary ways: 62.5% root, border-box everywhere,
     * reset margins and lists, its own font, colour and line height, `img { height: auto }`.
     */
    // A CSS background image long enough to be worth naming once (a 1x1 GIF padded with a comment block).
    const THUMB = 'data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH+' + 'QQ'.repeat(120) + 'ACwAAAAAAQABAAACAkQBADs=';
    const SOURCE = `<!doctype html><html class="theme"><head><meta charset="utf-8"><style>
      html { font-size: 10px; }
      body { margin: 0; background: rgb(30, 40, 60); color: rgb(240, 240, 240); font-family: Verdana, sans-serif; font-size: 1.4rem; }
      @font-face { font-family: "ProbeIcons"; src: url(nested/probe.woff2) format("woff2"); }
      :root { --icon-font: normal 400 1.6rem/1 "ProbeIcons"; }
      .page .band { padding: 2rem; }
      .page .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
      .page .grid > .card { padding: 1.2rem; border-radius: 0.8rem; background: none; border: 1px solid rgb(90, 100, 120); }
      html.theme .card .title { font-size: 2.4rem; color: rgb(255, 200, 0); margin: 0 0 0.6rem; }
      .page .card p { line-height: 1.5; margin: 0 0 1rem; }
      .page .card li:nth-child(2) { color: rgb(0, 200, 120); }
      .page .card ul { padding-left: 2rem; margin: 0; }
      .ico::before { font: var(--icon-font); content: "\\e900"; }
      .page .card img { width: 4.8rem; height: 4.8rem; display: block; }
      .page .card .go { color: rgb(120, 180, 255); text-decoration: none; }
      .page .card .thumb { width: 20px; height: 20px; background-image: url("${THUMB}"); background-size: cover; }
      .page .card .go:hover { text-decoration: underline; }
      @media (max-width: 600px) {
        .page .grid { grid-template-columns: 1fr; }
        .page .grid > .card { padding: 0.6rem; }
      }
    </style></head><body>
      <div class="page"><section class="band"><div class="grid">
        <article class="card" data-probe="card">
          <h3 class="title" data-probe="title">Card title</h3>
          <i class="ico" data-probe="ico"></i>
          <p data-probe="p">Some body text for the card.</p>
          <ul data-probe="ul"><li>one</li><li data-probe="li2">two</li></ul>
          <img data-probe="img" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
          <a class="go" data-probe="go" href="#x">Read more</a>
          <div class="thumb" data-probe="thumb"></div>
        </article>
        <article class="card"><h3 class="title">Two</h3></article>
        <article class="card"><h3 class="title">Three</h3></article>
      </div></section></div>
      <div style="height: 2400px"></div>
      <script src="../dist/heo-capture.js"><\/script>
    </body></html>`;

    /* What HEO pages commonly carry. Nothing here may change how the pasted card looks. */
    const HOSTILE = `
      html { font-size: 62.5%; }
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; background: rgb(255, 255, 255); color: rgb(17, 17, 17); font-family: monospace; line-height: 2; }
      h3 { margin: 2rem 0; font-size: 3rem; color: rgb(0, 0, 0); }
      p { margin: 1.5rem 0; line-height: 1.2; }
      ul { padding: 0; list-style: none; }
      img { max-width: 100%; height: auto; }
      a { color: rgb(255, 0, 0); text-decoration: underline; }
      i { font-style: normal; }
    `;

    (async () => {
      const results = {};
      const diagnostics = {};
      const errors = [];
      addEventListener('error', (event) => errors.push('error: ' + event.message));
      addEventListener('unhandledrejection', (event) => errors.push('rejection: ' + String(event.reason)));
      const progress = document.getElementById('progress');
      const step = (name) => { progress.textContent = name; };
      const frames = (win = window) => new Promise((resolve) =>
        win.requestAnimationFrame(() => win.requestAnimationFrame(resolve)));
      async function until(predicate, limit = 200) {
        for (let n = 0; n < limit; n += 1) {
          if (predicate()) return true;
          await frames();
        }
        return false;
      }
      const pasteText = (target, text) => {
        const clipboard = new DataTransfer();
        clipboard.setData('text/plain', text);
        const event = new ClipboardEvent('paste', { bubbles: true, cancelable: true, composed: true, clipboardData: clipboard });
        if (event.clipboardData && event.clipboardData.getData('text/plain') !== text) {
          event.clipboardData.setData('text/plain', text);
        }
        return target.dispatchEvent(event);
      };

      step('source');
      const frame = document.getElementById('source');
      const loaded = new Promise((resolve) => frame.addEventListener('load', resolve, { once: true }));
      frame.srcdoc = SOURCE;
      await loaded;
      const win = frame.contentWindow;
      const sdoc = frame.contentDocument;
      await until(() => win.HeoCapture);
      const HeoCapture = win.HeoCapture;
      const root = sdoc.querySelector('.card');

      step('capture');
      const capture = await HeoCapture.captureElement(root, { host: HeoCapture.pageHost() });

      const api = window.HtmlEditorOverlay.mount({ theme: 'dark', detectScriptContent: false, fileName: 'capture-fidelity.html', presets: false });
      const engine = api.engine;
      const stage = document.getElementById('stage');
      api.setEditing(true);
      await engine.whenReady();
      await frames();
      const decoded = await engine.decodeSeedText(capture.seed);
      const block = decoded?.blocks?.[0] ?? { html: '', css: '' };
      const css = block.css ?? '';
      const html = block.html ?? '';
      diagnostics.stats = capture.stats;
      diagnostics.warnings = capture.warnings;

      step('captured-css');
      results.capturedCss = {
        // `.page .grid > .card` would never match again after paste; as `.card` it does.
        ancestorCompoundsAreTakenOff: /(^|\n)\.card \{[^}]*border-top-left-radius|(^|\n)\.card \{[^}]*border-radius/.test(css) &&
          !css.includes('.page') && !css.includes('html.theme'),
        aMediaRuleIsRebasedToo: /@media \(max-width: 600px\) \{[\s\S]*?\n\.card \{ padding: 6px; \}/.test(css),
        // nth-child inside the pick still selects the same element, so it survives rebasing.
        anNthChildInsideThePickSurvives: /(^|\n)\.card li:nth-child\(2\) \{/.test(css),
        remIsWrittenAsSourcePixels: !/\d(?:\.\d+)?rem\b/.test(css.replace(/@media[^{]*/g, '')),
        theIconFontIsEmbeddedAsAFont: /@font-face \{[^}]*ProbeIcons[^}]*url\("?data:font\/woff2;base64,/.test(css),
        // The image is written once, on the block root, however many rules name it.
        anEmbeddedImageAppearsOnce: css.split(THUMB).length - 1 === 1 && /--cap-url-\d+: url\("data:image\/gif/.test(css),
        // A value a captured rule always sets is not pinned again underneath it.
        theFloorDoesNotRepeatWhatARuleSets: !/:where\(\[data-cap-s="\d+"\]\) \{[^}]*font-size: 24px/.test(css) &&
          !/:where\(\[data-cap-s="\d+"\]\) \{[^}]*border-top-left-radius: 8px/.test(css),
        // Defaults that act on nothing are noise: no `list-style-type: disc` or `tab-size` on the frame,
        // no `padding: 0px` or `letter-spacing: normal` pinned on a div that has them by default.
        theFrameCarriesNoInertDefaults: !/(?:^|;)\s*(?:list-style-type|tab-size|quotes|hyphens|cursor|writing-mode|direction|font-kerning|word-break): /.test(css.slice(0, css.indexOf('@font-face'))),
        thePinnedLayerCarriesNoInertDefaults: !(css.match(/:where\(\[data-cap-s="\d+"\]\)[^{]*\{[^}]*\}/g) ?? [])
          .some((rule) => /(?:padding-top: 0px|max-width: none|border-top-style: none|background-color: rgba\(0, 0, 0, 0\)|vertical-align: baseline|text-indent: 0px)/.test(rule)),
        theFloorStaysLean: (css.match(/:where\(\[data-cap-s="\d+"\]\) \{[^}]*\}/g) ?? []).every((rule) => rule.split(';').length < 40),
        theVariableThatSetsTheIconFontComesAlong: /--icon-font: normal 400 16px\/1 "?ProbeIcons"?/.test(css),
      };

      step('markup');
      results.markup = {
        theCopyIsFramed: /^<div data-cap-frame=""[^>]*><article class="card"/.test(html),
        everyElementHasAFloor: (html.match(/data-cap-s="/g) ?? []).length >= 8,
        noEditorInternalAttributes: !/data-heo-/.test(html),
        // No hostname in the name: it ended up in the id, repeated in every scoped selector.
        theNameIsShortAndHostFree: block.name === 'Card title' && !/—/.test(block.name),
      };

      step('paste');
      pasteText(document.getElementById('page-para'), capture.seed);
      await until(() => engine.store.value.capturePaste);
      // The full version, whose test hooks (data-probe) the comparison needs; capture-lean covers lean.
      engine.chooseCaptureVariant('full');
      const open = engine.store.value.capturePaste;
      engine.updateCapturePaste({ anchor: { reference: stage, position: 'lastChild' } });
      await frames();
      const committed = open ? await engine.commitCapturePaste() : null;
      await frames();
      const instance = committed?.inserted ?? null;
      const blockId = instance?.getAttribute('data-heo-block') ?? '';

      const PROPS = {
        card: ['padding-top', 'padding-left', 'border-top-width', 'border-top-left-radius', 'box-sizing', 'font-family', 'font-size', 'color'],
        title: ['font-size', 'color', 'margin-top', 'margin-bottom', 'font-family'],
        p: ['line-height', 'margin-top', 'margin-bottom', 'font-size', 'font-family', 'color'],
        ul: ['padding-left', 'margin-top'],
        // On the item, where a list style shows; on the ul it is inert and the copy leaves it out.
        li2: ['color', 'list-style-type'],
        img: ['width', 'height'],
        thumb: ['background-image', 'width', 'background-size'],
        go: ['color', 'text-decoration-line'],
      };
      const read = (view, doc) => {
        const out = {};
        for (const [probe, names] of Object.entries(PROPS)) {
          const element = doc.querySelector(`[data-probe="${probe}"]`);
          const style = element ? view.getComputedStyle(element) : null;
          out[probe] = Object.fromEntries(names.map((name) => [name, style?.getPropertyValue(name) ?? 'missing']));
        }
        const ico = doc.querySelector('[data-probe="ico"]');
        const before = ico ? view.getComputedStyle(ico, '::before') : null;
        out.icon = { content: before?.content ?? 'missing', 'font-size': before?.fontSize ?? 'missing' };
        out.cardWidth = Math.round(doc.querySelector('[data-probe="card"]')?.getBoundingClientRect().width ?? 0);
        return out;
      };
      async function renderPaste(width) {
        const target = document.createElement('iframe');
        target.style.cssText = `width: ${width}px; height: 900px; border: 0; position: absolute; left: -5000px; top: 0;`;
        const done = new Promise((resolve) => target.addEventListener('load', resolve, { once: true }));
        target.srcdoc = `<!doctype html><meta charset="utf-8"><style>${HOSTILE}</style><style>${engine.library.css}</style>` +
          `<main>${instance?.outerHTML ?? ''}</main>`;
        document.body.append(target);
        await done;
        await frames(target.contentWindow);
        return target;
      }
      async function compareAt(width) {
        frame.style.width = `${width}px`;
        await frames(win);
        await frames(win);
        const source = read(win, sdoc);
        const pasted = await renderPaste(width);
        const pwin = pasted.contentWindow;
        const pdoc = pasted.contentDocument;
        const copy = read(pwin, pdoc);
        const icoFamily = pwin.getComputedStyle(pdoc.querySelector('[data-probe="ico"]'), '::before').fontFamily;
        const frameBg = pwin.getComputedStyle(pdoc.querySelector('[data-cap-frame]')).backgroundColor;
        pasted.remove();
        const mismatches = [];
        for (const [probe, props] of Object.entries(source)) {
          if (probe === 'cardWidth') continue;
          for (const [name, value] of Object.entries(props)) {
            if (copy[probe]?.[name] !== value) mismatches.push(`${probe} ${name}: ${value} vs ${copy[probe]?.[name]}`);
          }
        }
        return { mismatches, source, copy, icoFamily, frameBg };
      }
      step('compare-1000');
      const wide = await compareAt(1000);
      step('compare-400');
      const narrow = await compareAt(400);
      frame.style.width = '';
      diagnostics.mismatches = { wide: wide.mismatches, narrow: narrow.mismatches };
      diagnostics.widths = { sourceWide: wide.source.cardWidth, pasteWide: wide.copy.cardWidth, sourceNarrow: narrow.source.cardWidth, pasteNarrow: narrow.copy.cardWidth };
      diagnostics.icon = { family: wide.icoFamily, source: wide.source.icon, copy: wide.copy.icon };

      results.paste = {
        thePasteInsertedTheBlock: Boolean(instance) && Boolean(blockId),
        computedStylesMatchOnAHostilePageWide: wide.mismatches.length === 0,
        computedStylesMatchOnAHostilePageNarrow: narrow.mismatches.length === 0,
        // The responsive rule still answers: padding drops to 6px under 600px, after the paste too.
        theMediaRuleStillResponds: wide.copy.card['padding-top'] === '12px' && narrow.copy.card['padding-top'] === '6px',
        // The grid made the card a third of the row; the frame keeps it that wide, not the whole page.
        theCardKeepsItsGridWidth: Math.abs(wide.copy.cardWidth - wide.source.cardWidth) <= 2,
        // A maximum, not a width: on a narrow page the copy still narrows.
        theCardStillNarrows: narrow.copy.cardWidth <= 400,
        theBackgroundItWasSeenOnComesAlong: wide.frameBg === 'rgb(30, 40, 60)',
        theIconUsesTheEmbeddedFont: wide.icoFamily.includes(`${blockId}--ProbeIcons`) &&
          wide.copy.icon.content === wide.source.icon.content && wide.copy.icon['font-size'] === '16px',
      };

      step('picker');
      const nameOf = (el) => el ? `${el.localName}${el.id ? `#${el.id}` : ''}${el.classList[0] ? `.${el.classList[0]}` : ''}` : '';
      const handle = HeoCapture.startPicker(HeoCapture.pageHost());
      const press = (key) => sdoc.body.dispatchEvent(new win.KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
      const p = sdoc.querySelector('[data-probe="p"]');
      const rect = p.getBoundingClientRect();
      p.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, composed: true, clientX: rect.left + 2, clientY: rect.top + 2 }));
      const startedOnP = handle?.target === p;
      press('ArrowLeft');
      const upIsTheCard = handle?.target === root;
      press('ArrowLeft');
      press('ArrowRight');
      press('ArrowRight');
      const backToP = handle?.target === p;
      press('ArrowLeft');
      press('ArrowDown');
      press('ArrowUp');
      press('ArrowRight');
      const sideStepClears = handle?.target === root.firstElementChild;
      press('ArrowRight');
      const noTrailFirstChild = handle?.target === root.firstElementChild.firstElementChild || handle?.target === root.firstElementChild;
      // The tree panel, linked to the pick.
      const rowsNow = handle?.rows() ?? [];
      const legend = handle?.panel().legend ?? '';
      const currentRow = rowsNow.find((row) => row.current);
      // Rows: body, div.page, section.band, div.grid, then the cards with the current one's children.
      const pathShown = rowsNow[0]?.label === 'body' && rowsNow.some((row) => row.label === 'div.grid') &&
        currentRow?.label === nameOf(handle.target);
      const rowIndex = (match) => (handle?.rows() ?? []).findIndex(match);
      // An ancestor row: the card, two levels up the path.
      handle?.clickRow(rowIndex((row) => row.label === 'article.card'));
      const clickedAncestorSelected = handle?.target === root;
      // Its children are listed under it now: a child row.
      const card = handle?.rows().find((row) => row.current);
      handle?.clickRow(rowIndex((row) => row.depth === (card?.depth ?? -9) + 1 && row.label === 'p'));
      const clickedChildSelected = handle?.target === sdoc.querySelector('[data-probe="p"]');
      // A sibling row, at the same depth as the pick.
      handle?.clickRow(rowIndex((row) => row.label === 'ul'));
      const clickedSiblingSelected = handle?.target === sdoc.querySelector('[data-probe="ul"]');
      // Up the path to the grid.
      handle?.clickRow(rowIndex((row) => row.label === 'div.grid'));
      const clickedGridSelected = handle?.target === sdoc.querySelector('.grid');
      // Pointing at the page moves the tree along.
      p.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, composed: true, clientX: rect.left + 2, clientY: rect.top + 2 }));
      const treeFollowsPointer = handle?.rows().find((row) => row.current)?.label === 'p';
      // Docked and left there: the pointer near the panel does not move it.
      const before = handle?.panel();
      sdoc.body.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, composed: true, clientX: win.innerWidth - 10, clientY: 10 }));
      const stays = handle?.panel().rect.left === before?.rect.left && handle?.panel().rect.top === before?.rect.top;
      // It covers a strip, not the page: narrow, and well short of the window's height.
      const box = handle?.panel().rect;
      const compact = Boolean(box) && box.width <= 320 && box.height <= win.innerHeight * 0.65 && box.right <= win.innerWidth;
      // Dragged by its header, and it stays where it is dropped.
      const start = handle?.panel().rect;
      handle?.dragBy(-200, 100);
      const moved = handle?.panel().rect;
      const dragged = Boolean(start && moved) && Math.abs(moved.left - (start.left - 200)) < 2 && Math.abs(moved.top - (start.top + 100)) < 2;
      handle?.dragBy(200, -100);
      // Resized from its corner, so the whole tree can be opened up in it.
      const resizable = handle?.panel().resizable === true;
      // Collapsed, it is a floating button; the button opens it again.
      handle?.press('collapse');
      const collapsedToButton = handle?.panel().collapsed === true && handle?.panel().visible === false;
      handle?.press('fab');
      const reopened = handle?.panel().collapsed === false && handle?.panel().visible === true;
      // After a click on a row the focus is in the panel; the arrows still walk the page.
      handle?.clickRow((handle?.rows() ?? []).findIndex((row) => row.label === 'div.grid'));
      press('ArrowRight');
      const keysAfterRowClick = handle?.target !== sdoc.querySelector('.grid') && sdoc.querySelector('.grid').contains(handle?.target);
      // A click on the page copies and locks: the pointer moving on does not move the pick.
      const pageClick = (el) => {
        const box = el.getBoundingClientRect();
        el.dispatchEvent(new win.MouseEvent('click', { bubbles: true, cancelable: true, composed: true, clientX: box.left + 2, clientY: box.top + 2 }));
      };
      const copiesBefore = handle?.copies ?? 0;
      pageClick(p);
      const lockedOnP = handle?.panel().locked === true && handle?.target === p && handle?.copies === copiesBefore + 1;
      const title = sdoc.querySelector('[data-probe="title"]');
      const titleBox = title.getBoundingClientRect();
      title.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, composed: true, clientX: titleBox.left + 2, clientY: titleBox.top + 2 }));
      const holdsWhileLocked = handle?.target === p;
      // Copying keeps the picker and its tree open (the Copy button too).
      handle?.press('copy');
      const stillOpenAfterCopy = handle?.panel().visible === true && Boolean(sdoc.querySelector('heo-capture-picker')) &&
        handle?.copies === copiesBefore + 2;
      // The arrows still adjust a locked pick, and it stays locked.
      press('ArrowLeft');
      const keysMoveALockedPick = handle?.target === p.parentElement && handle?.panel().locked === true;
      // Escape unlocks, and does not quit while locked.
      press('Escape');
      const escapeUnlocks = handle?.panel().locked === false && Boolean(sdoc.querySelector('heo-capture-picker'));
      title.dispatchEvent(new win.PointerEvent('pointermove', { bubbles: true, composed: true, clientX: titleBox.left + 2, clientY: titleBox.top + 2 }));
      const followsAgain = handle?.target === title;
      // A click on a tree row unlocks too, and selects that row.
      pageClick(p);
      handle?.clickRow((handle?.rows() ?? []).findIndex((row) => row.label === 'div.grid'));
      const rowClickUnlocks = handle?.panel().locked === false && handle?.target === sdoc.querySelector('.grid');
      // A row chosen in the tree is brought into view on the page, as pointing at it would.
      win.scrollTo(0, sdoc.documentElement.scrollHeight);
      await frames(win);
      handle?.clickRow((handle?.rows() ?? []).findIndex((row) => row.label === 'article.card'));
      await frames(win);
      const cardBox = root.getBoundingClientRect();
      const revealed = handle?.target === root && cardBox.bottom > 0 && cardBox.top < win.innerHeight;
      win.scrollTo(0, 0);
      await frames(win);
      diagnostics.tree = { rows: rowsNow, legend };
      handle?.stop();
      results.tree = {
        theTreeShowsThePathToThePick: pathShown,
        // HEO's keys, written on the panel: ← parent, → child, ↑↓ siblings.
        theKeysAreWrittenOnThePanel: /← parent/.test(legend) && /→ child/.test(legend) && /↑↓ siblings/.test(legend) &&
          /click: copy and lock/.test(legend) && /Enter copy/.test(legend) && /Esc unlock, then quit/.test(legend),
        clickingAnAncestorRowSelectsIt: clickedAncestorSelected && clickedGridSelected,
        clickingAChildRowSelectsIt: clickedChildSelected,
        clickingASiblingRowSelectsIt: clickedSiblingSelected,
        theTreeFollowsThePointer: treeFollowsPointer,
        thePanelStaysWhereItIsDocked: stays,
        thePanelCoversAStripNotThePage: compact,
        itIsDraggedByItsHeader: dragged,
        itIsResizable: resizable,
        aClickOnThePageCopiesAndLocks: lockedOnP && holdsWhileLocked,
        copyingKeepsThePickerOpen: stillOpenAfterCopy,
        theArrowsAdjustALockedPick: keysMoveALockedPick,
        escapeUnlocksBeforeItQuits: escapeUnlocks && followsAgain,
        aTreeRowClickUnlocksAndSelects: rowClickUnlocks,
        aTreeRowIsBroughtIntoView: revealed,
        itCollapsesToAFloatingButtonAndBack: collapsedToButton && reopened,
        theArrowsStillWorkAfterClickingARow: keysAfterRowClick,
      };
      results.picker = {
        // The reported annoyance: Down after Up went to the parent's first child, not back.
        upThenDownReturnsToWhereYouCameFrom: startedOnP && upIsTheCard && backToP && root.firstElementChild !== p,
        aSidewaysStepStartsAFreshTrail: sideStepClears,
        downWithNoTrailStillGoesToTheFirstChild: noTrailFirstChild,
      };

      results.page = { noUncaughtErrors: errors.length === 0 };
      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value === false))
        .map(([name]) => name);
      if (failed.length) {
        const libraryCss = engine.library.css.replace(/base64,[^)"]+/g, 'base64,…');
        diagnostics.iconLines = [...libraryCss.matchAll(/ProbeIcons|icon-font/g)]
          .map((match) => libraryCss.slice(Math.max(0, match.index - 160), match.index + 60));
      }
      document.getElementById('out').textContent =
        'RESULTS:' + JSON.stringify({ failed, ...results, errors, diagnostics: failed.length ? diagnostics : undefined }, null, 1) + ':END';
    })().catch((error) => {
      document.getElementById('out').textContent =
        'RESULTS:{"ok":false,"failed":["fatal"],"__fatal":' + JSON.stringify(String((error && error.stack) || error)) + '}:END';
    });
  </script>
</body>

</html>
