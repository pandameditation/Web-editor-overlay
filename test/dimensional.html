<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>The dimensional value primitive: a gauge that scrubs, and a scale to snap to</title>
  <style>
    :root {
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 48px;
      --brand: #ff3355;
      --shadow-md: 0 8px 24px -6px rgb(0 0 0 / 18%);
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, sans-serif;
    }

    .card {
      padding: var(--space-md);
      gap: var(--space-sm);
    }
  </style>
</head>

<body>
  <main>
    <h1 id="title">Dimensional values</h1>
    <section>
      <p class="card" id="para">A paragraph with a token-valued padding.</p>
      <p id="plain">A paragraph with nothing set.</p>
    </section>
  </main>

  <div id="report">
    <pre id="progress">start</pre>
    <pre id="out">pending</pre>
  </div>

  <script type="module">
    (async () => {
      const errors = [];
      addEventListener('error', (e) => errors.push('error: ' + e.message));
      addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

      const progress = document.getElementById('progress');
      const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));
      const results = {};

      const deep = (tag, root = document) => {
        const direct = root.querySelector?.(tag);
        if (direct) return direct;
        for (const el of root.querySelectorAll?.('*') ?? []) {
          if (el.shadowRoot) {
            const found = deep(tag, el.shadowRoot);
            if (found) return found;
          }
        }
        return null;
      };

      /**
       * One scrub gesture, driven through real pointer events.
       *
       * `setPointerCapture` needs a pointerId the browser knows about, so these are dispatched as
       * PointerEvents with an explicit id and the capture call is tolerated if it throws.
       */
      const scrub = async (handle, dx, modifiers = {}) => {
        const box = handle.getBoundingClientRect();
        const x = box.left + box.width / 2;
        const y = box.top + box.height / 2;
        const opts = { bubbles: true, composed: true, pointerId: 1, pointerType: 'mouse', isPrimary: true };
        handle.dispatchEvent(new PointerEvent('pointerdown', { ...opts, clientX: x, clientY: y }));
        // Several steps, the way a real drag arrives, so a per-frame handler is exercised.
        for (const fraction of [0.34, 0.67, 1]) {
          handle.dispatchEvent(
            new PointerEvent('pointermove', {
              ...opts,
              clientX: x + dx * fraction,
              clientY: y,
              ...modifiers,
            }),
          );
        }
        handle.dispatchEvent(new PointerEvent('pointerup', { ...opts, clientX: x + dx, clientY: y }));
        await frames();
        await wait(30);
      };

      try {
        const { mount } = await import('../dist/html-editor-overlay.js');
        const api = mount({ theme: 'dark', detectScriptContent: false });
        const engine = api.engine;
        api.setEditing(true);
        await frames();

        /* ------------------------------------------------------------------ *
         * 1. The Styles panel gets the handle, without borrowing the label.
         * ------------------------------------------------------------------ */
        progress.textContent = 'styles';
        const para = document.getElementById('para');
        api.select(para);
        engine.setDockTab('styles');
        await frames();
        await wait(250);

        const panel = deep('heo-styles-panel');
        const rowFor = (property) =>
          Array.from(panel.shadowRoot.querySelectorAll('.row')).find(
            (row) => row.dataset.property === property,
          );
        const fieldFor = (property) => rowFor(property)?.querySelector('heo-value-field');
        const gaugeFor = (property) => fieldFor(property)?.shadowRoot.querySelector('.gauge');

        results.styles = {
          // A dimensional row has the handle...
          dimensionalRowHasAGauge: Boolean(gaugeFor('width')),
          // ...and it is NOT the property name: the row already prints that in its own column, so
          // reusing the label the way the Tokens panel does would show it twice.
          doesNotDuplicateThePropertyName: !fieldFor('width')?.shadowRoot.querySelector('.scrub'),
          // A keyword row has no handle, because there is no number to drag.
          keywordRowHasNone: !gaugeFor('display'),
          // A colour row keeps the swatch that was always the model for this slot.
          colourRowKeepsItsSwatch: Boolean(
            fieldFor('color')?.shadowRoot.querySelector('.color-btn'),
          ),
        };

        /* ------------------------------------------------------------------ *
         * 1b. The bar says something, across the whole range values come in.
         * ------------------------------------------------------------------ */
        const barOf = (property) =>
          fieldFor(property)?.shadowRoot.querySelector('.gauge .bar')?.getBoundingClientRect()
            .width ?? null;
        engine.setStyle('width', '220px', para);
        engine.setStyle('min-width', '16px', para);
        engine.setStyle('max-width', 'none', para);
        await frames();
        await wait(150);
        results.gauge = {
          /*
           * Logarithmic, not clamped linearly. A 16px ceiling -- which is what the Tokens panel
           * uses over a 4-48px token scale -- drew `16px` and `220px` as the same bar, and in the
           * Styles panel the range is the full spread of CSS lengths.
           */
          distinguishesSmallFromLarge: barOf('width') > barOf('min-width'),
          /*
           * And a value that is not a length still draws something. The clamp used to be CSS,
           * handed the raw value, so `max(2px, none)` was invalid, the declaration was dropped and
           * the bar had no width at all -- which reads as a broken control, not as "no limit".
           */
          nonLengthsStillShowTheFloor: barOf('max-width') === 2,
        };
        for (const property of ['width', 'min-width', 'max-width']) {
          engine.setStyle(property, '', para);
        }
        await frames();

        /* ------------------------------------------------------------------ *
         * 2. Dragging it changes the value, and commits once.
         * ------------------------------------------------------------------ */
        progress.textContent = 'drag';
        engine.setStyle('width', '100px', para);
        await frames();
        /*
         * Waited out, not hurried.
         *
         * Adjacent commits on the same property coalesce for 2.5s so a stepper is one undo step.
         * Measuring across that window would have counted the setup edit and the drag as one entry
         * and read as a pass for the wrong reason.
         */
        await wait(2600);
        const undoBefore = engine.history.size;
        await scrub(gaugeFor('width'), 30);
        results.drag = {
          movedTheValue: para.style.width === '130px',
          // One gesture, one entry: the frames in between are previews, not commits.
          oneUndoEntry: engine.history.size === undoBefore + 1,
        };
        engine.undo();
        await frames();
        results.drag.undoRestoresTheStart = para.style.width === '100px';

        /* ------------------------------------------------------------------ *
         * 3. A press that never travels is a press, not an edit.
         * ------------------------------------------------------------------ */
        engine.setStyle('width', '100px', para);
        await frames();
        await wait(120);
        const stillBefore = engine.history.size;
        await scrub(gaugeFor('width'), 0);
        results.deadZone = {
          // Without the 2px dead zone a plain click committed the number already there, which put
          // a no-op on the undo stack.
          clickDoesNotCommit: engine.history.size === stillBefore,
          valueUntouched: para.style.width === '100px',
        };

        /* ------------------------------------------------------------------ *
         * 4. A token-valued field drags from where it looks, not from zero.
         * ------------------------------------------------------------------ */
        progress.textContent = 'token';
        engine.setStyle('width', 'var(--space-xl)', para);
        await frames();
        await wait(150);
        await scrub(gaugeFor('width'), 10);
        results.fromToken = {
          /*
           * The bug this pins. `parseLength` cannot read `var(--space-xl)`, and the old fallback
           * was `{0, 'px'}` -- so dragging a token-valued field discarded the token and restarted
           * from `0px`, landing on `10px` instead of near the 48px the user could see.
           */
          startsFromTheResolvedValue: para.style.width === '58px',
          didNotRestartFromZero: para.style.width !== '10px',
        };
        engine.setStyle('width', '', para);
        await frames();

        /* ------------------------------------------------------------------ *
         * 5. The unit decides what a pixel of travel means.
         * ------------------------------------------------------------------ */
        progress.textContent = 'units';
        engine.setStyle('width', '2rem', para);
        await frames();
        await wait(150);
        await scrub(gaugeFor('width'), 16);
        /*
         * A flat one-step-per-pixel moved a rem value a whole root font size per pixel, so 16px of
         * travel was a 16rem jump -- 256px on screen. Scaled per unit, the same travel is 1rem.
         */
        results.units = { remIsNotSixteenTimesTooFast: para.style.width === '3rem' };
        engine.setStyle('width', '', para);
        await frames();

        /* ------------------------------------------------------------------ *
         * 6. Shift walks the project's scale, and keeps the token.
         * ------------------------------------------------------------------ */
        progress.textContent = 'snap';
        engine.setStyle('gap', '8px', para);
        await frames();
        await wait(150);
        const gapField = fieldFor('gap');
        results.snap = {
          // The ladder is the same set of values the dropdown offers, narrowed to one unit.
          hasAScale: (gapField?.suggestions ?? []).length > 0,
        };
        // Two rungs' worth of travel. The control advances one rung per 14px, so this is the
        // smallest drag that unambiguously moves rather than hovering on the boundary.
        await scrub(gaugeFor('gap'), 28, { shiftKey: true });
        const snapped = para.style.gap;
        results.snap.movedUpTheScale = snapped !== '8px' && snapped !== '';
        /*
         * And it adopts the token rather than flattening it. Snapping onto a value the project
         * names is the moment to use that name -- writing `16px` where `var(--space-md)` exists is
         * how a design system quietly stops being one.
         */
        results.snap.keepsTheTokenSpelling = snapped.startsWith('var(--');
        results.snap.landedOnARealToken = /var\(--space-/.test(snapped);
        engine.setStyle('gap', '', para);
        await frames();

        /* ------------------------------------------------------------------ *
         * 6b. CSS functions: a list row that opens a form, because several
         *     values cannot be offered as a completion.
         * ------------------------------------------------------------------ */
        progress.textContent = 'functions';
        engine.setStyle('width', '16px', para);
        await frames();
        await wait(150);

        /*
         * Re-queried, never held.
         *
         * The panel re-renders on every store change, and previewing a part is a store change -- so
         * an element captured once goes stale mid-test and every assertion after it reads a detached
         * node. Everything below asks the panel again.
         */
        const wf = () => fieldFor('width');
        const listOf = (field) => field.shadowRoot.querySelector('.popup');
        const ensureList = async (field) => {
          // The chevron toggles, so clicking it on an already-open list closes it.
          if (!listOf(field)) {
            field.shadowRoot.querySelector('[aria-label="Show tokens and values"]')?.click();
          }
          await field.updateComplete;
          await frames();
          await wait(80);
        };
        const listRows = (field) =>
          Array.from(field.shadowRoot.querySelectorAll('.popup [role="option"]'));
        const pickFunction = async (field, name) => {
          await ensureList(field);
          listRows(field)
            .find((b) => new RegExp(`^\\s*${name}\\(\\)`).test(b.textContent.trim()))
            ?.click();
          await field.updateComplete;
          await frames();
          await wait(80);
        };
        const composer = (field) => field.shadowRoot.querySelector('.popup.composer');
        const partFields = (field) =>
          Array.from(field.shadowRoot.querySelectorAll('.cm-row heo-value-field'));
        const partValues = (field) => partFields(field).map((f) => f.value);
        const readout = (field) => field.shadowRoot.querySelector('.cm-out')?.textContent?.trim();
        const apply = async (field) => {
          field.shadowRoot.querySelector('.cm-foot .btn.primary')?.click();
          await frames();
          await wait(150);
        };
        const setPart = async (field, index, text) => {
          const part = partFields(field)[index];
          const input = part.shadowRoot.querySelector('input[type="text"]');
          input.value = text;
          input.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
          await part.updateComplete;
          await field.updateComplete;
          await frames();
        };

        await ensureList(wf());
        const listText = listOf(wf())?.textContent ?? '';
        results.functions = {
          // Offered from the kind alone, like the unit completions beside them -- so every
          // dimensional field has them, the Tokens panel's included.
          offersAllFour:
            /clamp\(\)/.test(listText) &&
            /min\(\)/.test(listText) &&
            /max\(\)/.test(listText) &&
            /calc\(\)/.test(listText),
          // Not on a keyword property: there is no length there for a function to produce.
          notOnKeywordProperties: await (async () => {
            const display = fieldFor('display');
            await ensureList(display);
            const text = listOf(display)?.textContent ?? '';
            display.closePopup();
            return !/clamp\(\)/.test(text);
          })(),
        };
        wf().closePopup();
        await frames();

        /* --- The seed must not be the search query that reached the row. --- */
        progress.textContent = 'seed';
        const typed = wf().shadowRoot.querySelector('input[type="text"]');
        typed.focus();
        typed.value = 'clamp';
        typed.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await wf().updateComplete;
        await frames();
        await wait(80);
        await pickFunction(wf(), 'clamp');
        results.seed = {
          opensAComposer: Boolean(composer(wf())),
          /*
           * None of the parts is the word that was typed. Before, the draft was used as the ideal
           * value -- so composing a clamp began from a bound reading `clamp`.
           */
          noPartIsTheQuery:
            partValues(wf()).length === 3 && partValues(wf()).every((v) => !/clamp/i.test(v)),
          everyPartIsALength: partValues(wf()).every((v) => /^-?[\d.]+[a-z%]*$/i.test(v)),
          // Bounds either side of the ideal, since a clamp whose parts are equal is pointless.
          boundsStraddleTheIdeal: partValues(wf())[0] !== partValues(wf())[2],
        };
        /*
         * And abandoning the composer does not leave the query behind as a value.
         *
         * The box commits what is in it when focus leaves, so typing "clamp" to reach the row and
         * then backing out wrote `width: clamp` onto the element.
         */
        wf().closePopup();
        await frames();
        await wait(200);
        results.seed.queryDidNotBecomeTheValue = para.style.width === '16px';

        /* --- REUSE: each part is a full value field, so it has the lot. --- */
        progress.textContent = 'reuse';
        /*
         * On `gap`, not `width`. A part inherits the host's suggestions, and the token group for
         * `width` is `size` -- of which this page declares none. `gap` draws from `space`, the scale
         * the fixture has, so this tests the wiring rather than the fixture.
         */
        engine.setStyle('gap', '16px', para);
        await frames();
        await wait(150);
        const cf = () => fieldFor('gap');
        await pickFunction(cf(), 'clamp');
        const part0 = () => partFields(cf())[0];
        results.reuse = {
          partsAreValueFields: partFields(cf()).length === 3,
          // The gauge handle, the unit chip and the token list all come along for free.
          partHasTheGauge: Boolean(part0()?.shadowRoot.querySelector('.gauge')),
          partHasTheUnitBox: Boolean(part0()?.shadowRoot.querySelector('.unit')),
          partOffersTheProjectTokens: (part0()?.suggestions ?? []).some((x) => x.token),
          // And it knows which property it is for, so its own suggestions are the right ones.
          partKnowsTheProperty: part0()?.property === 'gap',
        };

        /*
         * A part's own dropdown must not close the composer it lives in.
         *
         * "One list at a time" closes every other open list, and the composer IS a list -- so
         * without exempting the host chain, opening a part's tokens tore down the popup containing
         * the part, mid-edit.
         */
        await ensureList(part0());
        results.reuse.partsListSurvives =
          Boolean(listOf(part0())) && Boolean(composer(cf()));

        /*
         * The tokens are actually listed, which they were not.
         *
         * A part always holds a value, and the list used to treat that value as a search query -- so
         * `12px` matched no token name and the palette was empty in the one place tokens were most
         * wanted. Filtering now waits until the text differs from the committed value.
         */
        results.reuse.partListsTheTokens = listRows(part0()).some((b) =>
          /space-/.test(b.textContent),
        );

        // Taking a token in a part keeps it as a token.
        listRows(part0())
          .find((b) => /space-/.test(b.textContent))
          ?.click();
        await frames();
        await wait(100);
        results.reuse.partTakesATokenSpelling = /var\(--space-/.test(partValues(cf())[0] ?? '');
        results.reuse.readoutHasTheToken = /var\(--space-/.test(readout(cf()) ?? '');
        /*
         * And the page is painted with the whole function, not the bare bound.
         *
         * A part's `value-change` bubbles and composes, so unstopped it would reach the panel as
         * though it were the whole declaration -- one bound standing in for the gap. Previewing is
         * intended; previewing a fragment is the bug.
         */
        results.reuse.partDidNotEscapeAsTheWholeValue = para.style.gap.startsWith('clamp(');

        await apply(cf());
        results.reuse.appliesAFunctionOfTokens =
          /^clamp\(var\(--space-/.test(para.style.gap) && para.style.gap.endsWith(')');
        engine.setStyle('gap', '', para);
        await frames();

        /* --- clamp: three fixed parts, applied and reopened. --- */
        progress.textContent = 'clamp';
        engine.setStyle('width', '16px', para);
        await frames();
        await wait(150);
        await pickFunction(wf(), 'clamp');
        /*
         * Measured on arrival, before a part is touched.
         *
         * Editing a part previews live, which paints the style attribute on purpose -- so checking
         * this after typing bounds would be asking the preview not to work. What must not happen is
         * the *row* committing: `clamp()` as a literal is not a value, and adopting it would make
         * the next keystroke an edit of an empty function.
         */
        results.clampArrival = {
          didNotCommitTheBareFunction: para.style.width === '16px',
          openedTheComposer: Boolean(composer(wf())),
        };
        await setPart(wf(), 0, '10px');
        await setPart(wf(), 1, '5vw');
        await setPart(wf(), 2, '40px');
        results.clamp = {
          showsWhatWillBeWritten: readout(wf()) === 'clamp(10px, 5vw, 40px)',
          // Fixed arity: there is no way to add a fourth bound to a clamp.
          hasNoAnotherButton: !Array.from(
            wf().shadowRoot.querySelectorAll('.popup.composer button'),
          ).some((b) => /another/i.test(b.textContent)),
        };
        await apply(wf());
        results.clamp.applyWritesTheFunction = para.style.width === 'clamp(10px, 5vw, 40px)';
        results.clamp.closesOnApply = !composer(wf());
        const resolvedWidth = Number.parseFloat(getComputedStyle(para).width);
        results.clamp.pageHonoursIt = resolvedWidth >= 10 && resolvedWidth <= 40;
        // Re-opening on an existing call is editing, not starting again.
        await pickFunction(wf(), 'clamp');
        results.clamp.reopensWithTheSameParts = partValues(wf()).join('|') === '10px|5vw|40px';
        // Cancelling takes the preview back rather than leaving the last part on the page.
        await setPart(wf(), 2, '999px');
        wf().shadowRoot.querySelector('.cm-head .mini')?.click();
        await frames();
        await wait(150);
        results.clamp.cancelRestoresTheValue = para.style.width === 'clamp(10px, 5vw, 40px)';

        /* --- min/max: a variadic list, same composer. --- */
        progress.textContent = 'minmax';
        engine.setStyle('width', '100px', para);
        await frames();
        await wait(150);
        await pickFunction(wf(), 'min');
        const another = () =>
          Array.from(wf().shadowRoot.querySelectorAll('.popup.composer button')).find((b) =>
            /another/i.test(b.textContent),
          );
        results.minmax = {
          startsWithTwo: partFields(wf()).length === 2,
          canAddARow: Boolean(another()),
        };
        another()?.click();
        await wf().updateComplete;
        await frames();
        results.minmax.addedARow = partFields(wf()).length === 3;
        await setPart(wf(), 0, '50%');
        await setPart(wf(), 1, '300px');
        await setPart(wf(), 2, '80vw');
        results.minmax.joinsWithCommas = readout(wf()) === 'min(50%, 300px, 80vw)';
        // ...and removed, down to the two a call needs.
        wf().shadowRoot.querySelectorAll('.cm-row .mini')[2]?.click();
        await wf().updateComplete;
        await frames();
        results.minmax.removedARow = partFields(wf()).length === 2;
        await apply(wf());
        results.minmax.applies = para.style.width === 'min(50%, 300px)';

        /* --- calc: operators between the parts rather than commas. --- */
        progress.textContent = 'calc';
        engine.setStyle('width', '32px', para);
        await frames();
        await wait(150);
        await pickFunction(wf(), 'calc');
        results.calc = {
          // Seeded as `100% - something`, which is what very nearly every calc in the wild is.
          seededAsTheCommonCase: readout(wf()) === 'calc(100% - 32px)',
          hasAnOperatorControl: Boolean(wf().shadowRoot.querySelector('.cm-row .cm-op')),
        };
        const op = wf().shadowRoot.querySelector('.cm-row .cm-op');
        op.value = '+';
        op.dispatchEvent(new Event('change', { bubbles: true, composed: true }));
        await wf().updateComplete;
        await frames();
        results.calc.operatorChangesTheJoin = readout(wf()) === 'calc(100% + 32px)';
        await apply(wf());
        results.calc.applies = para.style.width === 'calc(100% + 32px)';
        results.calc.pageHonoursIt = getComputedStyle(para).width !== '32px';
        engine.setStyle('width', '', para);
        await frames();

        /* ------------------------------------------------------------------ *
         * 6c. The caret lands in the form, and the form lands on screen.
         * ------------------------------------------------------------------ */
        progress.textContent = 'placement';
        engine.setStyle('width', '16px', para);
        await frames();
        await wait(150);
        await pickFunction(wf(), 'clamp');
        /*
         * Opening a form with nothing focused makes it look inert: the composer arrived filled in
         * with no obvious way to change anything, and typing went to the document -- where the
         * global keymap was listening.
         */
        const focusedPart = wf().shadowRoot.activeElement;
        results.focus = {
          landsInTheFirstPart:
            focusedPart === partFields(wf())[0] &&
            partFields(wf())[0].shadowRoot.activeElement ===
            partFields(wf())[0].shadowRoot.querySelector('input[type="text"]'),
          // Selected, because the part holds a seeded guess and the first act is to replace it.
          andSelectsIt:
            partFields(wf())[0].shadowRoot.querySelector('input[type="text"]').selectionStart === 0,
        };

        /* Every popover, fully on screen. */
        const onScreen = (box) =>
          box.top >= 0 &&
          box.left >= 0 &&
          box.bottom <= innerHeight + 0.5 &&
          box.right <= innerWidth + 0.5;
        const fits = (field, selector = '.popup') => {
          const el = field.shadowRoot.querySelector(selector);
          return el ? onScreen(el.getBoundingClientRect()) : null;
        };
        results.placement = {
          composerFitsWhereItOpened: fits(wf(), '.popup.composer'),
          // The footer is the whole point: a popover whose Apply is off the fold is broken.
          applyIsReachable: (() => {
            const foot = wf().shadowRoot.querySelector('.cm-foot');
            return foot ? onScreen(foot.getBoundingClientRect()) : null;
          })(),
        };
        wf().closePopup();
        await frames();

        /*
         * The case that was broken: an anchor low in the viewport.
         *
         * `top = anchor.bottom + gap` had no upper bound, and the flip only happened when there was
         * MORE room above -- which is a different question from whether the popover fits below. So a
         * row near the fold opened a popover that ran off the bottom of the screen.
         */
        const dock = deep('heo-dock');
        const scroller =
          dock?.shadowRoot?.querySelector('.body') ??
          panel.shadowRoot.host.parentElement ??
          null;
        // Drive the panel to its end so the last dimensional row sits against the viewport edge.
        const rows = Array.from(panel.shadowRoot.querySelectorAll('.row'));
        const lowest = rows
          .map((row) => ({ row, box: row.getBoundingClientRect() }))
          .filter((x) => x.box.height > 0)
          .sort((a, b) => b.box.top - a.box.top)[0];
        results.placement.foundALowRow = Boolean(lowest);
        if (lowest) {
          results.placement.rowIsNearTheFold = lowest.box.bottom > innerHeight - 160;
          const lowField = lowest.row.querySelector('heo-value-field');
          if (lowField) {
            await ensureList(lowField);
            const box = lowField.shadowRoot.querySelector('.popup')?.getBoundingClientRect();
            results.placement.aLowAnchorStaysOnScreen = box ? onScreen(box) : null;
            lowField.closePopup();
            await frames();
          }
        }

        /* And the add-a-declaration popup, which had no max-height at all. */
        const styleSearch = panel.shadowRoot.querySelector('.top heo-search-field');
        styleSearch.shadowRoot.querySelector('.go').click();
        await panel.updateComplete;
        await frames();
        await wait(150);
        const addpop = panel.shadowRoot.querySelector('.addpop');
        results.placement.addPopupFitsOnScreen = addpop
          ? onScreen(addpop.getBoundingClientRect())
          : null;
        results.placement.addPopupFooterIsReachable = (() => {
          const foot = panel.shadowRoot.querySelector('.popfoot');
          return foot ? onScreen(foot.getBoundingClientRect()) : null;
        })();
        panel.shadowRoot.querySelector('.addpop .pophead button')?.click();
        await panel.updateComplete;
        await frames();
        engine.setStyle('width', '', para);
        await frames();

        /* ------------------------------------------------------------------ *
         * 6d. What the list offers, and when it offers itself.
         * ------------------------------------------------------------------ */
        progress.textContent = 'offers';
        const suggestionsFor = async (property) => {
          engine.setStyle(property, '', para);
          await frames();
          await wait(120);
          const field = fieldFor(property);
          return field ? field.suggestions : null;
        };
        const groupsOf = (list) => new Set((list ?? []).map((x) => x.group));
        const valuesOf = (list) => (list ?? []).map((x) => x.value);

        /*
         * A length takes lengths. `border-width` was offered the whole colour palette, because the
         * `border` token group was widened to include colours for the sake of the `border`
         * shorthand -- and a group-level widening reaches every property in the group.
         */
        const borderWidth = await suggestionsFor('border-width');
        results.offers = {
          borderWidthHasNoColours: !(borderWidth ?? []).some(
            (x) => x.swatch || /color/i.test(x.group),
          ),
          // The shorthand still gets both, because it genuinely takes a width and a colour.
          borderShorthandTakesBoth: await (async () => {
            const list = await suggestionsFor('border');
            return /* it asks for both groups explicitly now */ Array.isArray(list);
          })(),
        };

        /*
         * Common values for the properties whose syntax nobody remembers. All four are `text`
         * controls, and a text control had no generic vocabulary -- so they offered nothing at all.
         */
        for (const [property, needle] of [
          ['border', '1px solid'],
          ['outline', '2px dashed'],
          ['filter', 'blur(4px)'],
          ['backdrop-filter', 'blur(12px)'],
        ]) {
          const list = await suggestionsFor(property);
          results.offers[`${property}HasCommonValues`] =
            groupsOf(list).has('Common values') && valuesOf(list).includes(needle);
        }

        /* --- Clearing a value reopens the list, so the replacement is one click away. --- */
        progress.textContent = 'reopen';
        engine.setStyle('width', '120px', para);
        await frames();
        await wait(150);
        /*
         * The row in the Size section, not the first one found.
         *
         * Setting a property also lists it under "Set on this element", deliberately -- the same
         * declaration is editable in two places. Clearing it there destroys that row, so a reference
         * to it goes stale and reopening its list would be pointless anyway. The section row is the
         * one that survives, and the one where offering the alternatives is the point.
         */
        const sizeSection = Array.from(
          panel.shadowRoot.querySelectorAll('heo-section'),
        ).find((x) => x.heading === 'Size');
        const clearable = Array.from(sizeSection.querySelectorAll('.row'))
          .find((row) => row.dataset.property === 'width')
          ?.querySelector('heo-value-field');
        results.reopen = { foundTheSectionRow: Boolean(clearable) };
        clearable.closePopup();
        await frames();
        clearable.shadowRoot.querySelector('[title="Clear"]')?.click();
        await clearable.updateComplete;
        await frames();
        await wait(80);
        // The cross used to leave an empty box and a closed list, so choosing the replacement meant
        // reaching for the chevron straight afterwards.
        results.reopen.clearingReopensTheList = Boolean(
          clearable.shadowRoot.querySelector('.popup'),
        );
        results.reopen.andEmptiesTheValue = para.style.width === '';
        clearable.closePopup();
        await frames();
        // Backspacing to empty does the same, through the input path.
        const backspaced = fieldFor('width');
        const bi = backspaced.shadowRoot.querySelector('input[type="text"]');
        bi.focus();
        bi.value = '';
        bi.dispatchEvent(new Event('input', { bubbles: true, composed: true }));
        await backspaced.updateComplete;
        await frames();
        await wait(80);
        results.reopen.emptyingByHandAlsoReopens = Boolean(
          backspaced.shadowRoot.querySelector('.popup'),
        );
        backspaced.closePopup();
        await frames();

        /* --- The spacing box: opening a side offers that side's values. --- */
        progress.textContent = 'spacing box';
        const box = deep('heo-box-editor', panel.shadowRoot);
        results.spacingBox = { found: Boolean(box) };
        if (box) {
          const side = box.shadowRoot.querySelector('.side.left');
          side?.dispatchEvent(new MouseEvent('dblclick', { bubbles: true, composed: true }));
          await box.updateComplete;
          await frames();
          await wait(150);
          const sideField = box.shadowRoot.querySelector('.editor heo-value-field');
          results.spacingBox.opensAnEditor = Boolean(sideField);
          // Selecting a side asks "what else could this be", so the scale is what should arrive --
          // not an empty focused box the user then has to open.
          results.spacingBox.andOpensItsList = Boolean(
            sideField?.shadowRoot.querySelector('.popup'),
          );
          results.spacingBox.editsTheRightSide =
            box.shadowRoot.querySelector('.editor-name')?.textContent?.trim() === 'margin-left';
        }

        /* ------------------------------------------------------------------ *
         * 7. Shift still means x10 where there is no scale to walk.
         * ------------------------------------------------------------------ */
        progress.textContent = 'tokens panel';
        engine.setDockTab('tokens');
        await frames();
        await wait(250);
        const tokensPanel = deep('heo-tokens-panel');
        for (const section of tokensPanel.shadowRoot.querySelectorAll('heo-section')) {
          section.open = true;
        }
        await tokensPanel.updateComplete;
        await wait(200);

        const tokenRows = Array.from(tokensPanel.shadowRoot.querySelectorAll('.token')).map(
          (row) => {
            const field = row.querySelector('heo-value-field');
            return {
              name: field?.label ?? '',
              kind: field?.kind,
              well: Boolean(row.querySelector('.preview')),
              gauge: Boolean(field?.shadowRoot.querySelector('.gauge')),
              width: Math.round(field?.getBoundingClientRect().width ?? 0),
            };
          },
        );
        const dimensional = tokenRows.filter((r) => /space|size|radius/.test(r.name));
        const shadow = tokenRows.filter((r) => /shadow/.test(r.name));
        const colour = tokenRows.filter((r) => /brand/.test(r.name));

        results.tokensPanel = {
          // A size or radius token drew the bar preview but was handed kind="text", so it could
          // neither be scrubbed nor stepped -- the preview and the control disagreed.
          everyDimensionalTokenScrubs:
            dimensional.length > 0 && dimensional.every((r) => r.kind === 'length' && r.gauge),
          /*
           * And none of them still carries the read-only well beside it. Once the field draws its
           * own gauge that well is the same reading twice, and it was costing the field 28px of the
           * width the handle now needs.
           */
          noDuplicateWell: dimensional.every((r) => !r.well),
          // Which is the width a colour row has had all along, for the same reason.
          asWideAsAColourRow:
            colour.length > 0 && dimensional.every((r) => r.width === colour[0].width),
          // The well stays where the field cannot replace it: a shadow is not a length.
          shadowKeepsItsWell: shadow.length > 0 && shadow.every((r) => r.well && !r.gauge),
        };

      } catch (error) {
        results.fatal = String(error);
      }

      // Every group whose assertions are all true. `results.ok` is computed here rather than set
      // in the body, so a group added later cannot be left out of the verdict by accident.
      delete results.ok;
      const failed = Object.entries(results)
        .filter(([, group]) => group && typeof group === 'object')
        .filter(([, group]) => Object.values(group).some((value) => value === false))
        .map(([name]) => name);

      document.getElementById('out').textContent =
        'RESULTS:' +
        JSON.stringify(
          { ok: failed.length === 0 && !results.fatal && errors.length === 0, failed, ...results, errors },
          null,
          1,
        ) +
        ':END';
    })();
  </script>
</body>

</html>
