<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Border editor: outline-offset + per-edge borders</title>
  <!--
  PROTOTYPE — throwaway, not part of the overlay build. Open the file directly in a browser.
  Delete, or move it to a prototype branch, once a direction is picked.

  Question: how does heo-border-editor (src/ui/controls/border-editor.ts) take outline-offset and
  border-top / -right / -bottom / -left without losing what works today: nested frames that are the
  preview (outline › border › content), each line edited where it is drawn, one shorthand written.

  Three variants on this page (?variant=A|B|C, the bottom bar, or ← →):
    A — Edges on the frame: the offset is the gap band between the outline and border frames; the
        border frame's own four edges (and a side glyph in its header) pick which side the fields edit.
    B — Edge table: offset is a fourth outline field; under the all-sides fields, a T/R/B/L table
        where an empty cell inherits and a filled one overrides.
    C — Box-model cross: offset sits on the ring like DevTools' margin label; the four edges are
        chips round the content, each opening its own three fields.

  Writing rule (same in every variant, shown live on the left):
    - all sides → one `border` shorthand, as today;
    - an edge that differs while all sides are drawn → only the longhands that differ
      (`border-bottom-width: 4px`), so it keeps following the all-sides colour and style;
    - an edge set with no all-sides border → its own shorthand (`border-bottom: 1px solid #ddd`);
    - an edge set to none → `border-top: none`;
    - `outline-offset` written on its own, only when an outline is drawn.
-->
  <style>
    :root {
      /* src/ui/theme.ts, light theme */
      --bg: #ffffff;
      --sunken: #f3f4f7;
      --raised: #ffffff;
      --hover: #eef0f5;
      --text: #1f2330;
      --dim: #4b5263;
      --faint: #7a8193;
      --line: #e3e6ec;
      --line2: #d3d7e0;
      --accent: #6366f1;
      --outline-hue: #3b82f6;
      --danger: #e11d48;
      --r-sm: 7px;
      --r-md: 9px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      font-family: var(--font);
      background: #e9ecf2;
      color: var(--text);
    }

    /* ---------------------------------------------------------------- page side (not the design) */
    .stage { padding: 32px; overflow: auto; }
    .stage h1 { font: 600 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: #64748b; margin: 0 0 14px; }
    .site { background: #f8fafc; border-radius: 14px; padding: 48px; box-shadow: 0 8px 30px -12px rgb(15 23 42 / 25%); --brand: #f43f5e; }
    #target { padding: 18px 22px; background: #fff; font: 15px/1.5 system-ui; max-width: 360px; }
    .out { margin-top: 22px; background: #111827; color: #e5e7eb; border-radius: 10px; padding: 14px 16px; font: 12.5px/1.6 var(--mono); white-space: pre; }
    .out b { color: #a5b4fc; font-weight: 500; }
    .out .c { color: #6b7280; }
    .question { margin-top: 18px; color: #475569; font-size: 13px; line-height: 1.5; max-width: 560px; }

    /* ---------------------------------------------------------------- panel chrome */
    .panel { background: var(--bg); border-left: 1px solid var(--line); overflow: auto; padding: 14px 14px 90px; font-size: 12px; }
    .section-h { display: flex; align-items: center; gap: 8px; font: 600 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 2px 0 12px; }

    /* ---------------------------------------------------------------- fields (stand-ins for heo-value-field) */
    .f { display: flex; align-items: center; height: 30px; min-width: 0; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--raised); padding: 0 8px; gap: 6px; }
    .f:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent); }
    .f input, .f select { all: unset; flex: 1; min-width: 0; font: 12.5px var(--mono); color: var(--text); }
    .f select { cursor: pointer; }
    .f input::placeholder { color: var(--faint); opacity: .75; }
    .f.inherit select { color: var(--faint); }
    .f .unit { font: 10.5px var(--mono); color: var(--faint); }
    .f .sw { width: 16px; height: 16px; border-radius: 4px; flex: none; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%);
      background-image: linear-gradient(45deg, #ddd 25%, transparent 25% 75%, #ddd 75%), linear-gradient(45deg, #ddd 25%, transparent 25% 75%, #ddd 75%);
      background-size: 8px 8px; background-position: 0 0, 4px 4px; position: relative; overflow: hidden; }
    .f .sw i { position: absolute; inset: 0; }
    .f.set { border-color: color-mix(in oklab, var(--accent) 45%, var(--line2)); }
    .f.small { height: 26px; padding: 0 6px; }
    .f.small input, .f.small select { font-size: 11.5px; }

    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .fields .wide { grid-column: 1 / -1; }

    /* ---------------------------------------------------------------- frames (from border-editor.ts) */
    .frame { position: relative; display: grid; gap: 7px; padding: 7px 9px 9px; border-radius: var(--r-md); }
    .frame.outline { background: color-mix(in oklab, var(--outline-hue) 7%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--outline-hue) 30%, transparent); }
    .frame.border { background: color-mix(in oklab, var(--danger) 6%, transparent); }
    .frame.border.undrawn { outline: 1px dashed color-mix(in oklab, var(--danger) 45%, transparent); outline-offset: -1px; }
    .tag { display: flex; align-items: center; gap: 6px; color: var(--faint); font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; min-height: 18px; }
    .tag .key { width: 7px; height: 7px; border-radius: 2px; }
    .outline > .tag .key { background: var(--outline-hue); }
    .border > .tag .key { background: var(--danger); }
    .tag .note { margin-left: auto; font: 400 10px var(--mono); letter-spacing: 0; text-transform: none; color: var(--faint); }
    .core { display: grid; grid-template-columns: auto 1fr 96px; align-items: center; gap: 8px; min-height: 36px; padding: 4px 6px 4px 10px; background: var(--sunken); color: var(--faint); font-size: 10px; }
    .core .name { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 9.5px; }
    .core .rl { justify-self: end; }
    .tip { margin: 8px 0 0; color: var(--faint); font-size: 10.5px; line-height: 1.45; }
    .link { all: unset; cursor: pointer; color: var(--accent); font: 500 10.5px var(--font); letter-spacing: 0; text-transform: none; }
    .link:hover { text-decoration: underline; }
    .link.x { color: var(--faint); font-size: 13px; line-height: 1; padding: 0 3px; }
    .link.x:hover { color: var(--danger); text-decoration: none; }

    /* ---------------------------------------------------------------- A: edges on the frame */
    .gap-band { display: flex; align-items: center; gap: 8px; margin: 0 -9px; padding: 0 9px; color: var(--faint); font-size: 10px; position: relative; }
    .gap-band::before, .gap-band::after { content: ''; position: absolute; left: 9px; right: 9px; border-top: 1px dashed color-mix(in oklab, var(--outline-hue) 35%, transparent); }
    .gap-band::before { top: 0; } .gap-band::after { bottom: 0; }
    .gap-band .hatch { position: absolute; inset: 0 9px; background: repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in oklab, var(--outline-hue) 10%, transparent) 4px 5px); pointer-events: none; }
    .gap-band > :not(.hatch) { position: relative; }
    .gap-band .lbl { font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 9.5px; }
    .gap-band .f { width: 92px; margin-left: auto; height: 26px; }
    .gap-band.off { opacity: .55; }

    .edge-hit { position: absolute; z-index: 2; cursor: pointer; border-radius: 3px; }
    .edge-hit[data-side=top] { top: -3px; left: 14px; right: 14px; height: 9px; }
    .edge-hit[data-side=bottom] { bottom: -3px; left: 14px; right: 14px; height: 9px; }
    .edge-hit[data-side=left] { left: -3px; top: 14px; bottom: 14px; width: 9px; }
    .edge-hit[data-side=right] { right: -3px; top: 14px; bottom: 14px; width: 9px; }
    .edge-hit:hover { background: color-mix(in oklab, var(--accent) 30%, transparent); }
    .edge-hit.on { background: color-mix(in oklab, var(--accent) 55%, transparent); }

    .glyph { position: relative; width: 22px; height: 22px; flex: none; }
    .glyph .c { position: absolute; inset: 5px; border-radius: 2px; background: color-mix(in oklab, var(--danger) 10%, transparent); cursor: pointer; }
    .glyph .c.on { background: color-mix(in oklab, var(--accent) 35%, transparent); }
    .glyph .e { position: absolute; background: var(--line2); border-radius: 2px; cursor: pointer; }
    .glyph .e:hover { background: color-mix(in oklab, var(--accent) 50%, transparent); }
    .glyph .e.set { background: var(--danger); }
    .glyph .e.on { background: var(--accent); }
    .glyph .e[data-side=top] { top: 0; left: 5px; right: 5px; height: 3px; }
    .glyph .e[data-side=bottom] { bottom: 0; left: 5px; right: 5px; height: 3px; }
    .glyph .e[data-side=left] { left: 0; top: 5px; bottom: 5px; width: 3px; }
    .glyph .e[data-side=right] { right: 0; top: 5px; bottom: 5px; width: 3px; }
    .scope { display: flex; align-items: center; gap: 7px; font: 500 11px var(--font); color: var(--dim); letter-spacing: 0; text-transform: none; margin-left: auto; }
    .scope b { color: var(--text); font-weight: 600; }

    /* ---------------------------------------------------------------- B: edge table */
    .etable { display: grid; grid-template-columns: 22px 1fr 1fr 1fr 16px; gap: 4px; align-items: center; margin-top: 2px; }
    .etable .h { font-size: 9.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding-left: 2px; }
    .etable .side { font: 600 10.5px var(--mono); color: var(--dim); text-align: center; }
    .etable .side.set { color: var(--danger); }
    .etable .f { padding: 0 5px; gap: 4px; }
    .etable .f .sw { width: 12px; height: 12px; border-radius: 3px; }
    .sub-h { display: flex; align-items: center; gap: 6px; margin-top: 4px; color: var(--faint); font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .sub-h::after { content: ''; flex: 1; border-top: 1px solid color-mix(in oklab, var(--danger) 18%, transparent); }

    /* ---------------------------------------------------------------- C: box-model cross */
    .ring-label { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: var(--bg); padding: 0 6px; border-radius: 8px; box-shadow: 0 0 0 1px color-mix(in oklab, var(--outline-hue) 30%, transparent); font-size: 9.5px; color: var(--faint); z-index: 3; }
    .ring-label input { all: unset; width: 34px; font: 11px var(--mono); color: var(--text); text-align: center; }
    .ring-label input::placeholder { color: var(--faint); }
    .ring { position: relative; border-radius: var(--r-md); padding: 0; }
    .cross { display: grid; grid-template-columns: 58px 1fr 58px; grid-template-rows: auto auto auto; gap: 5px; align-items: center; justify-items: center; }
    .chip { all: unset; cursor: pointer; display: grid; justify-items: center; gap: 3px; padding: 4px 6px; border-radius: 6px; font: 10.5px var(--mono); color: var(--faint); min-width: 50px; }
    .chip:hover { background: var(--hover); }
    .chip.set { color: var(--text); }
    .chip.on { background: color-mix(in oklab, var(--accent) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 45%, transparent); }
    .chip .sample { width: 30px; height: 0; }
    .chip .sample.v { width: 0; height: 18px; }
    .chip .n { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; font-family: var(--font); font-weight: 600; }
    .cross .core { width: 100%; grid-template-columns: 1fr; justify-items: center; gap: 4px; padding: 8px; }
    .cross .core .f { width: 96px; }
    .pop { border: 1px solid color-mix(in oklab, var(--accent) 40%, var(--line2)); border-radius: var(--r-md); background: var(--raised); padding: 8px; display: grid; gap: 6px; box-shadow: 0 6px 18px -8px rgb(15 23 42 / 30%); }
    .pop .tag { color: var(--dim); }

    /* ---------------------------------------------------------------- switcher (not the design) */
    .switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #0f172a; color: #fff; border-radius: 999px; padding: 5px; box-shadow: 0 10px 30px -8px rgb(0 0 0 / 50%); z-index: 99; font: 500 12.5px var(--font); }
    .switcher button { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; font-size: 15px; }
    .switcher button:hover { background: rgb(255 255 255 / 14%); }
    .switcher span { padding: 0 10px; min-width: 230px; text-align: center; }
  </style>
</head>

<body>
  <main class="stage">
    <h1>Page — the element being edited</h1>
    <div class="site">
      <div id="target">A card. The outline, its offset and every edge on this box come from the CSS below.</div>
    </div>
    <div class="out" id="out"></div>
    <p class="question" id="about"></p>
  </main>

  <aside class="panel">
    <div class="section-h">⌗ Border</div>
    <div id="editor"></div>
  </aside>

  <div class="switcher" role="toolbar" aria-label="Prototype variants">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <span id="label"></span>
    <button type="button" id="next" aria-label="Next variant">→</button>
  </div>

  <script>
    // ---------------------------------------------------------------- state (in memory only)
    const SIDES = ['top', 'right', 'bottom', 'left'];
    const PARTS = ['width', 'style', 'color'];
    const STYLES = ['none', 'solid', 'dashed', 'dotted', 'double', 'groove', 'ridge', 'inset', 'outset', 'hidden'];
    const empty = () => ({ width: '', style: '', color: '' });

    const state = {
      outline: { width: '2px', style: 'solid', color: '#3399ff' },
      offset: '4px',
      border: { width: '2px', style: 'dashed', color: 'var(--brand)' },
      edges: { top: empty(), right: empty(), bottom: { width: '4px', style: '', color: '' }, left: empty() },
      radius: '8px',
    };
    const ui = { side: 'all', pop: null }; // A: which side the fields edit; C: which chip is open

    const VARIANTS = {
      A: { name: 'Edges on the frame', about: 'The gap between the outline and border frames is the offset, and grows with it. Click an edge of the border frame (or of the glyph in its header) to edit that side; click its centre for all sides. A set edge is drawn on the frame and marked red on the glyph.' },
      B: { name: 'Edge table', about: 'Offset is a fourth outline field. Under the all-sides fields, a T / R / B / L table: an empty cell inherits (its placeholder is what it inherits), a filled one overrides. × clears a side.' },
      C: { name: 'Box-model cross', about: 'Offset sits on the ring between outline and border, like DevTools’ margin number. The border’s four sides are chips round the content, each drawing its line; click one to edit that side.' },
    };
    let variant = new URLSearchParams(location.search).get('variant')?.toUpperCase();
    if (!VARIANTS[variant]) variant = 'A';

    // ---------------------------------------------------------------- the model (mirrors core/border.ts)
    const has = (p) => PARTS.some((k) => p[k]);
    const drawnStyle = (s) => s && !/^(none|hidden)$/i.test(s);
    /** composeLine's rule: a width or colour with no style draws solid, 1px when no width. */
    function complete(p) {
      const n = { ...p };
      if (!drawnStyle(n.style) && n.style !== 'none' && (n.width || n.color)) { n.style = 'solid'; n.width ||= '1px'; }
      return n;
    }
    const shorthand = (p) => (p.style === 'none' ? 'none' : PARTS.map((k) => complete(p)[k]).filter(Boolean).join(' '));
    const allDrawn = () => has(state.border);

    /** What one side draws: all sides with the edge's own parts on top. */
    function sideLine(side) {
      const e = state.edges[side];
      if (e.style === 'none') return null;
      const base = allDrawn() ? complete(state.border) : empty();
      const merged = complete({ width: e.width || base.width, style: e.style || base.style, color: e.color || base.color });
      return drawnStyle(merged.style) ? merged : null;
    }

    function css() {
      const out = [];
      if (allDrawn()) out.push(['border', shorthand(state.border)]);
      for (const side of SIDES) {
        const e = state.edges[side];
        if (!has(e)) continue;
        if (e.style === 'none') out.push([`border-${side}`, 'none']);
        else if (!allDrawn()) out.push([`border-${side}`, shorthand(e)]);
        else for (const k of PARTS) if (e[k] && e[k] !== complete(state.border)[k]) out.push([`border-${side}-${k}`, e[k]]);
      }
      if (has(state.outline)) {
        out.push(['outline', shorthand(state.outline)]);
        if (state.offset && state.outline.style !== 'none') out.push(['outline-offset', state.offset]);
      }
      if (state.radius) out.push(['border-radius', state.radius]);
      return out;
    }

    // ---------------------------------------------------------------- field stand-ins
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const get = (key) => key.split('.').reduce((o, k) => o?.[k], state) ?? '';
    function set(key, value) {
      const path = key.split('.');
      const last = path.pop();
      path.reduce((o, k) => o[k], state)[last] = value.trim();
    }
    const resolveColor = (c) => (c.startsWith('var(--brand') ? '#f43f5e' : c);

    function field(key, kind, placeholder = '', extra = '') {
      const v = get(key);
      const cls = `f ${extra} ${v ? 'set' : 'inherit'}`;
      if (kind === 'style') {
        const opts = [`<option value="">${esc(placeholder || '—')}</option>`, ...STYLES.map((s) => `<option ${s === v ? 'selected' : ''}>${s}</option>`)];
        return `<label class="${cls}"><select data-k="${key}" aria-label="${key}">${opts.join('')}</select></label>`;
      }
      if (kind === 'color') {
        const shown = resolveColor(v || placeholder);
        return `<label class="${cls}"><span class="sw"><i style="background:${esc(shown)}"></i></span><input data-k="${key}" value="${esc(v)}" placeholder="${esc(placeholder)}" aria-label="${key}"></label>`;
      }
      return `<label class="${cls}"><input data-k="${key}" value="${esc(v)}" placeholder="${esc(placeholder)}" aria-label="${key}"><span class="unit">px</span></label>`;
    }
    /** The three fields for a line. For an edge, placeholders are what it inherits from all sides. */
    function lineFields(prefix, inherit = empty(), small = false) {
      const s = small ? 'small' : '';
      return `<div class="fields">${field(`${prefix}.width`, 'width', inherit.width, s)}${field(`${prefix}.style`, 'style', inherit.style, s)}${field(`${prefix}.color`, 'color', inherit.color, `wide ${s}`)}</div>`;
    }
    const inherited = () => (allDrawn() ? complete(state.border) : empty());

    // ---------------------------------------------------------------- diagram helpers
    const cap = (w, max = 6) => { const n = parseFloat(w); return Number.isFinite(n) ? `${Math.max(1, Math.min(max, n))}px` : '2px'; };
    const lineCss = (p) => (p ? `${cap(p.width)} ${p.style} ${resolveColor(p.color || 'currentColor')}` : '0 none');
    const borderFrameStyle = () => SIDES.map((s) => `border-${s}:${lineCss(sideLine(s))};`).join('') + (state.radius ? `border-radius:${Math.min(18, parseFloat(state.radius) || 0)}px;` : '');
    const outlineFrameStyle = () => (has(state.outline) && drawnStyle(complete(state.outline).style) ? `outline:${lineCss(complete(state.outline))};outline-offset:-${cap(state.outline.width)};` : '');
    const offsetPx = () => { const n = parseFloat(state.offset); return Number.isFinite(n) ? n : 0; };
    const anyEdge = () => SIDES.some((s) => has(state.edges[s]));
    const edgeNote = () => (anyEdge() ? SIDES.filter((s) => has(state.edges[s])).join(' · ') + ' differ' : '');
    const core = () => `<div class="core" style="border-radius:${Math.max(0, Math.min(18, parseFloat(state.radius) || 0) - 4)}px"><span class="name">Content</span><span class="rl">radius</span>${field('radius', 'width', '0', 'small')}</div>`;
    const outlineHead = () => `<div class="tag"><span class="key"></span>Outline${has(state.outline) ? '' : '<span class="note">none</span>'}</div>`;

    // ---------------------------------------------------------------- A: edges on the frame
    function renderA() {
      const side = ui.side;
      const glyph = `<span class="glyph" aria-label="Pick a side">
        <span class="c ${side === 'all' ? 'on' : ''}" data-act="side:all" title="All sides"></span>
        ${SIDES.map((s) => `<span class="e ${has(state.edges[s]) ? 'set' : ''} ${side === s ? 'on' : ''}" data-act="side:${s}" data-side="${s}" title="${s}"></span>`).join('')}
      </span>`;
      const scope = side === 'all'
        ? `<span class="scope">${anyEdge() ? `<span class="note" style="font:10px var(--mono);color:var(--faint)">${edgeNote()}</span>` : ''}<b>All sides</b>${glyph}</span>`
        : `<span class="scope"><button class="link" data-act="side:all">← all</button><b>${side[0].toUpperCase() + side.slice(1)}</b>${has(state.edges[side]) ? `<button class="link" data-act="clear:${side}">reset</button>` : ''}${glyph}</span>`;
      const fields = side === 'all' ? lineFields('border') : lineFields(`edges.${side}`, inherited());
      const gapH = Math.max(28, Math.min(46, 28 + Math.abs(offsetPx()) * 2));
      return `
        <div class="frame outline" style="${outlineFrameStyle()}">
          ${outlineHead()}
          ${lineFields('outline')}
          <div class="gap-band ${has(state.outline) ? '' : 'off'}" style="height:${gapH}px">
            <span class="hatch"></span>
            <span class="lbl">↕ Offset</span><span>${offsetPx() < 0 ? 'drawn inside the border' : 'gap to the border'}</span>
            ${field('offset', 'width', '0', 'small')}
          </div>
          <div class="frame border ${allDrawn() || anyEdge() ? '' : 'undrawn'}" style="${borderFrameStyle()}">
            ${SIDES.map((s) => `<span class="edge-hit ${side === s ? 'on' : ''}" data-act="side:${s}" data-side="${s}" title="Edit ${s}"></span>`).join('')}
            <div class="tag"><span class="key"></span>Border${scope}</div>
            ${fields}
            ${core()}
          </div>
        </div>
        <p class="tip">Click an edge of the border frame to give that side its own line. Only the parts you change are written for it.</p>`;
    }

    // ---------------------------------------------------------------- B: edge table
    function renderB() {
      const inh = inherited();
      const row = (s) => {
        const e = state.edges[s];
        return `<span class="side ${has(e) ? 'set' : ''}">${s[0].toUpperCase()}</span>
          ${field(`edges.${s}.width`, 'width', inh.width || '—', 'small')}
          ${field(`edges.${s}.style`, 'style', inh.style || '—', 'small')}
          ${field(`edges.${s}.color`, 'color', inh.color || '—', 'small')}
          ${has(e) ? `<button class="link x" data-act="clear:${s}" title="Clear ${s}">×</button>` : '<span></span>'}`;
      };
      return `
        <div class="frame outline" style="${outlineFrameStyle()}">
          ${outlineHead()}
          <div class="fields">
            ${field('outline.width', 'width')}${field('outline.style', 'style')}
            ${field('outline.color', 'color')}
            <label class="f ${state.offset ? 'set' : 'inherit'}" title="outline-offset"><span class="unit" style="font-family:var(--font)">offset</span><input data-k="offset" value="${esc(state.offset)}" placeholder="0" aria-label="outline-offset"><span class="unit">px</span></label>
          </div>
          <div class="frame border ${allDrawn() || anyEdge() ? '' : 'undrawn'}" style="${borderFrameStyle()};margin-top:${Math.max(2, Math.min(12, offsetPx() * 1.5))}px">
            <div class="tag"><span class="key"></span>Border<span class="note">all sides</span></div>
            ${lineFields('border')}
            <div class="sub-h">Sides</div>
            <div class="etable">
              <span></span><span class="h">width</span><span class="h">style</span><span class="h">colour</span><span></span>
              ${SIDES.map(row).join('')}
            </div>
            ${core()}
          </div>
        </div>
        <p class="tip">An empty cell follows all sides. Fill one to give that side its own value.</p>`;
    }

    // ---------------------------------------------------------------- C: box-model cross
    function renderC() {
      const chip = (s) => {
        const e = state.edges[s];
        const line = sideLine(s);
        const vertical = s === 'left' || s === 'right';
        const sample = line ? `${vertical ? 'border-left' : 'border-top'}:${lineCss(line)}` : `${vertical ? 'border-left' : 'border-top'}:1px dotted var(--line2)`;
        const label = e.style === 'none' ? 'none' : has(e) ? PARTS.map((k) => e[k]).filter(Boolean).join(' ') : 'inherit';
        return `<button class="chip ${has(e) ? 'set' : ''} ${ui.pop === s ? 'on' : ''}" data-act="pop:${s}" title="Edit ${s}">
          <span class="n">${s}</span><span class="sample ${vertical ? 'v' : ''}" style="${sample}"></span><span>${esc(label.length > 9 ? label.slice(0, 8) + '…' : label)}</span></button>`;
      };
      const pop = ui.pop ? `<div class="pop">
          <div class="tag"><span class="key" style="background:var(--danger)"></span>Border ${ui.pop}
            <span class="note">${has(state.edges[ui.pop]) ? `<button class="link" data-act="clear:${ui.pop}">reset to all sides</button>` : 'follows all sides'}</span>
            <button class="link x" data-act="pop:${ui.pop}" title="Close">×</button></div>
          ${lineFields(`edges.${ui.pop}`, inherited(), true)}
        </div>` : '';
      return `
        <div class="frame outline" style="${outlineFrameStyle()}">
          ${outlineHead()}
          ${lineFields('outline')}
          <div class="ring" style="padding:${Math.max(10, Math.min(20, 10 + offsetPx() * 1.5))}px 0 0">
            <label class="ring-label" title="outline-offset">offset <input data-k="offset" value="${esc(state.offset)}" placeholder="0" aria-label="outline-offset">px</label>
            <div class="frame border ${allDrawn() || anyEdge() ? '' : 'undrawn'}" style="${borderFrameStyle()}">
              <div class="tag"><span class="key"></span>Border<span class="note">all sides</span></div>
              ${lineFields('border')}
              <div class="cross">
                <span></span>${chip('top')}<span></span>
                ${chip('left')}${core().replace('<span class="rl">radius</span>', '<span>radius</span>')}${chip('right')}
                <span></span>${chip('bottom')}<span></span>
              </div>
              ${pop}
            </div>
          </div>
        </div>
        <p class="tip">Each chip is one side, drawn as it is on the page. Open one to give it its own line.</p>`;
    }

    // ---------------------------------------------------------------- wiring
    const editor = document.getElementById('editor');
    function renderPage() {
      const decls = css();
      document.getElementById('target').style.cssText =
        'padding:18px 22px;background:#fff;max-width:360px;' + decls.map(([p, v]) => `${p}:${v}`).join(';');
      document.getElementById('out').innerHTML = `<span class="c">/* written to the element's rule */</span>\n` +
        (decls.length ? decls.map(([p, v]) => `<b>${p}</b>: ${esc(v)};`).join('\n') : '<span class="c">(nothing)</span>');
      document.getElementById('about').textContent = `${variant} — ${VARIANTS[variant].about}`;
      document.getElementById('label').textContent = `${variant} — ${VARIANTS[variant].name}`;
    }
    function render() {
      editor.innerHTML = { A: renderA, B: renderB, C: renderC }[variant]();
      renderPage();
    }

    // Typing updates the page live; leaving the field (or picking a style) redraws the editor.
    editor.addEventListener('input', (e) => { const k = e.target.dataset.k; if (!k) return; set(k, e.target.value); renderPage(); if (e.target.tagName === 'SELECT') render(); });
    editor.addEventListener('change', (e) => { if (e.target.dataset.k) render(); });
    editor.addEventListener('click', (e) => {
      const act = e.target.closest('[data-act]')?.dataset.act;
      if (!act) return;
      e.preventDefault();
      const [verb, arg] = act.split(':');
      if (verb === 'side') ui.side = arg;
      if (verb === 'pop') ui.pop = ui.pop === arg ? null : arg;
      if (verb === 'clear') state.edges[arg] = empty();
      render();
    });

    const keys = Object.keys(VARIANTS);
    function go(step) {
      variant = keys[(keys.indexOf(variant) + step + keys.length) % keys.length];
      const url = new URL(location.href);
      url.searchParams.set('variant', variant);
      history.replaceState(null, '', url);
      render();
    }
    document.getElementById('prev').onclick = () => go(-1);
    document.getElementById('next').onclick = () => go(1);
    addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea, select, [contenteditable]')) return;
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });
    render();
  </script>
</body>

</html>
