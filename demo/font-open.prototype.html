<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Where to look when a font slot opens</title>
  <!--
  PROTOTYPE — throwaway, not part of the overlay build. Open the file directly in a browser.

  Question: in the font stack (one autocomplete per font), a slot's list opens in the dialog's flow
  and looks like the rest of it, so after a click it is hard to tell where to look. How should the
  open slot and its list stand out?

  Variants (bottom bar or ← / →, ?variant=A|B|C). Click a slot or its chevron to open it; the
  opening plays its entrance each time. ?scene=main | fallback picks which slot starts open.
    A — Spotlight: the open slot and its list become one raised card; the other slots dim.
    B — Dropdown over the stack: the list floats over the slots below, joined to its field like a
        combobox, with a scrim on the rest of the dialog.
    C — Expanded slot: the open slot grows into a tinted panel titled for what is being chosen;
        the other slots shrink to one compact line each.
-->
  <style>
    :root {
      --heo-bg: #ffffff; --heo-raised: #ffffff; --heo-sunken: #f4f5f8; --heo-hover: #eff1f5;
      --heo-text: #1f2330; --heo-text-dim: #4b5263; --heo-text-faint: #6b7385; --heo-line: #e3e6ec; --heo-line-strong: #d3d7e0;
      --heo-accent: #6366f1; --heo-accent-soft: color-mix(in oklab, var(--heo-accent) 12%, transparent);
      --heo-accent-line: color-mix(in oklab, var(--heo-accent) 50%, transparent); --heo-danger: #e11d48;
      --heo-r-sm: 7px; --font: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; --paper: #fffdf8; --ink: #1c1917;
      --ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; grid-template-columns: minmax(0, 1fr) 440px; font-family: var(--font); background: #e9ecf2; color: var(--heo-text); }
    button { font: inherit; }
    .stage { padding: 24px 32px 90px; overflow: auto; }
    .stage h1 { font: 600 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: #64748b; margin: 0 0 12px; }
    .scene { display: inline-flex; gap: 2px; padding: 2px; border-radius: 8px; background: #dfe3ea; margin-bottom: 14px; }
    .scene button { all: unset; padding: 5px 10px; border-radius: 6px; font-size: 12px; color: #475569; cursor: pointer; }
    .scene button[aria-pressed=true] { background: #fff; color: #111827; font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / 10%); }
    .site { border-radius: 14px; background: var(--paper); padding: 36px 40px; border: 1px solid #e7e2d6; }
    #target { margin: 0; font-size: 44px; line-height: 1.05; font-weight: 600; color: var(--ink); outline: 2px solid var(--heo-accent); outline-offset: 6px; }
    .question { margin-top: 14px; color: #475569; font-size: 13px; line-height: 1.55; max-width: 760px; }
    .question b { color: #1f2330; }

    .panel { position: relative; background: #f6f7f9; border-left: 1px solid var(--heo-line); padding: 14px; font-size: 12px; overflow: auto; }
    .dialog { position: relative; display: grid; gap: 2px; padding: 10px; border: 1px solid var(--heo-line-strong); border-radius: 12px; background: var(--heo-bg); box-shadow: 0 22px 48px -14px rgb(15 23 42 / 35%); }
    .dhead { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; } .dhead .t { font-weight: 600; } .dhead .s2 { color: var(--heo-text-faint); font: 11px var(--mono); } .dhead .sp { flex: 1; }
    .x2 { all: unset; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; color: var(--heo-text-faint); }
    .then { padding-left: 26px; color: var(--heo-text-faint); font-size: 10px; height: 16px; line-height: 16px; }
    .slot { display: grid; grid-template-columns: 14px minmax(0, 1fr) 22px; align-items: start; gap: 4px; position: relative; }
    .slot .g { display: grid; place-items: center; height: 30px; color: var(--heo-text-faint); font-size: 10px; }
    .slot .trash { display: grid; place-items: center; height: 30px; color: var(--heo-text-dim); font-size: 12px; }
    .vf { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 3px 0 8px; border: 1px solid var(--heo-line-strong); border-radius: var(--heo-r-sm); background: var(--heo-raised); cursor: pointer; }
    .vf .v { flex: 1; min-width: 0; overflow: hidden; font-size: 15px; white-space: nowrap; text-overflow: ellipsis; }
    .vf .role { color: var(--heo-text-faint); font-size: 10px; }
    .vf .chev { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; color: var(--heo-text-faint); transition: rotate .15s; }
    .vf.on .chev { rotate: 180deg; }
    .foot { margin: 6px 0 0 18px; }
    .btn { all: unset; display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: var(--heo-r-sm); border: 1px dashed var(--heo-line-strong); font-size: 11.5px; font-weight: 600; color: var(--heo-text-dim); }
    .list { display: grid; gap: 1px; max-height: 268px; overflow: auto; padding: 4px; }
    .grp { display: flex; align-items: center; gap: 6px; margin: 6px 4px 2px; color: var(--heo-text-faint); font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .grp::after { content: ''; flex: 1; order: 2; border-top: 1px solid var(--heo-line); }
    .grp .n { order: 3; font-weight: 500; }
    .fi { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border: 1px solid transparent; border-radius: var(--heo-r-sm); cursor: pointer; }
    .fi:hover { background: var(--heo-hover); }
    .fi[aria-current=true] { border-color: var(--heo-accent-line); }
    .fi .nm { font-size: 17px; white-space: nowrap; }
    .fi .tag { color: var(--heo-text-faint); font: 9.5px var(--mono); }

    /* ---------------- A: spotlight */
    .A .slot.dim { opacity: .42; filter: saturate(.6); transition: opacity .2s; }
    .A .then.dim { opacity: .42; }
    .A .slot.open .slotbody { padding: 3px; margin: -3px; border-radius: 10px; background: var(--heo-raised); box-shadow: 0 0 0 2px var(--heo-accent), 0 18px 40px -12px rgb(79 70 229 / 40%); animation: lift .22s var(--ease); }
    .A .slot.open .vf { border-color: transparent; background: var(--heo-accent-soft); }
    .A .slot.open .list { margin-top: 3px; border-top: 1px solid var(--heo-line); }
    @keyframes lift { from { box-shadow: 0 0 0 6px color-mix(in oklab, var(--heo-accent) 30%, transparent), 0 0 0 rgb(0 0 0 / 0); transform: scale(.985); } }

    /* ---------------- B: dropdown over the stack */
    .B .scrim { position: absolute; inset: 0; z-index: 4; border-radius: 12px; background: rgb(15 23 42 / 14%); animation: fade .18s; }
    .B .slot.open { z-index: 5; }
    .B .slot.open .vf { border-color: var(--heo-accent); border-bottom-left-radius: 0; border-bottom-right-radius: 0; box-shadow: 0 0 0 3px color-mix(in oklab, var(--heo-accent) 18%, transparent); background: var(--heo-raised); }
    .B .slot.open .list { position: absolute; left: 18px; right: 26px; top: 29px; z-index: 6; border: 1px solid var(--heo-accent); border-top-color: var(--heo-line); border-radius: 0 0 9px 9px; background: var(--heo-raised); box-shadow: 0 0 0 3px color-mix(in oklab, var(--heo-accent) 18%, transparent), 0 24px 48px -12px rgb(15 23 42 / 45%); transform-origin: top; animation: drop .2s var(--ease); }
    @keyframes drop { from { opacity: 0; transform: scaleY(.92) translateY(-4px); } }
    @keyframes fade { from { opacity: 0; } }

    /* ---------------- C: expanded slot */
    .C .slot.compact .vf { height: 26px; background: var(--heo-sunken); border-color: transparent; }
    .C .slot.compact .vf .v { font-size: 13px; }
    .C .slot.compact .g, .C .slot.compact .trash { height: 26px; }
    .C .slot.open .slotbody { display: grid; gap: 6px; padding: 8px; margin: 2px 0; border: 1px solid var(--heo-accent-line); border-radius: 10px; background: color-mix(in oklab, var(--heo-accent) 6%, var(--heo-raised)); animation: grow .22s var(--ease); }
    .C .slot.open .title { display: flex; align-items: baseline; gap: 6px; font-size: 11px; color: var(--heo-accent); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .C .slot.open .title span { color: var(--heo-text-faint); font-weight: 400; text-transform: none; letter-spacing: 0; }
    .C .slot.open .vf { border-color: var(--heo-accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--heo-accent) 16%, transparent); }
    .C .slot.open .list { border-radius: 8px; background: var(--heo-raised); border: 1px solid var(--heo-line); }
    @keyframes grow { from { opacity: .4; transform: translateY(-3px); } }

    .switch { position: fixed; left: 50%; bottom: 16px; z-index: 99; translate: -50% 0; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: #0f172a; color: #e2e8f0; box-shadow: 0 10px 30px -8px rgb(0 0 0 / 45%); font: 12px var(--font); }
    .switch button { all: unset; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
    .switch .lab { padding: 0 10px; min-width: 300px; text-align: center; } .switch .lab b { color: #a5b4fc; }
  </style>
</head>
<body>
  <main class="stage" id="stage"></main>
  <aside class="panel" id="panel"></aside>
  <div class="switch" role="toolbar" aria-label="Prototype variants">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <span class="lab" id="lab"></span>
    <button type="button" id="next" aria-label="Next variant">→</button>
  </div>
  <script>
    const NAMES = { A: 'Spotlight: raised card, the rest dimmed', B: 'Dropdown over the stack, with a scrim', C: 'Expanded slot, titled; the rest compact' };
    const QUESTIONS = {
      A: '<b>A</b> — the open slot and its list are one card, outlined in the accent and lifted with a shadow; the other slots and the arrows drop to 40% so the eye has one place to go. The dialog does not change shape beyond the list itself. A short lift on opening says "here".',
      B: '<b>B</b> — a real dropdown: the list hangs from its field, joined to it like a combobox, floating over the slots below rather than pushing them down; a light scrim covers the rest of the dialog. Nothing moves, so the slot clicked is exactly where the list starts. Clicking the scrim closes it.',
      C: '<b>C</b> — the open slot becomes the dialog\'s subject: a tinted panel titled for what is being chosen ("Fallback 1 · if Georgia is missing"), the field and its list inside. The other slots shrink to one compact line each, so the stack stays readable around it.',
    };
    const SECTIONS = [
      ['In this page', [['Fraunces', 'site.css'], ['Lora', 'Embedded']]],
      ['Typography tokens', [['--font-display', 'Fraunces'], ['--font-body', 'Georgia']]],
      ['System · only where installed', [['Georgia', 'This machine'], ['Iowan Old Style', 'This machine'], ['Helvetica Neue', 'This machine'], ['Menlo', 'This machine']]],
    ];
    const qs = new URLSearchParams(location.search);
    const s = { variant: qs.get('variant') || 'A', scene: qs.get('scene') || 'fallback', stack: ['Fraunces', 'Georgia', 'serif'], open: 1, tick: 0 };
    const label = (one) => one === 'serif' ? 'any serif' : one;
    const role = (i) => i === 0 ? 'Font' : i === s.stack.length - 1 ? 'Last resort' : `Fallback ${i}`;
    const face = (one) => one.startsWith('--') ? 'Fraunces, serif' : one === 'serif' ? 'serif' : `'${one}', serif`;

    function list(current) {
      return `<div class="list">${SECTIONS.map(([g, items]) => `<div class="grp">▾ ${g}<span class="n">${items.length}</span></div>${items.map(([n, t]) => `<div class="fi" data-pick="${n}" aria-current="${n === current}"><span class="nm" style="font-family:${face(n)}">${n}</span><span class="tag">${t}</span></div>`).join('')}`).join('')}</div>`;
    }
    function slot(one, i) {
      const open = i === s.open;
      const v = s.variant;
      const cls = ['slot', open ? 'open' : '', v === 'A' && s.open !== null && !open ? 'dim' : '', v === 'C' && s.open !== null && !open ? 'compact' : ''].join(' ');
      const title = v === 'C' && open ? `<div class="title">${role(i)}<span>${i ? `· if ${s.stack[i - 1]} is missing` : '· what the text is set in'}</span></div>` : '';
      return `${i ? `<div class="then${v === 'A' && s.open !== null && s.open !== i ? ' dim' : ''}">↓ if it is missing</div>` : ''}
        <div class="${cls}" data-slot="${i}">
          <span class="g">⋮⋮</span>
          <div class="slotbody" data-tick="${open ? s.tick : ''}">
            ${title}
            <div class="vf${open ? ' on' : ''}" data-open="${i}"><span class="v" style="font-family:${face(one)}">${label(one)}</span><span class="role">${role(i)}</span><span class="chev">▾</span></div>
            ${open ? list(one) : ''}
          </div>
          <span class="trash">${i ? '🗑' : ''}</span>
        </div>`;
    }
    function render() {
      const url = new URL(location.href);
      url.searchParams.set('variant', s.variant); url.searchParams.set('scene', s.scene);
      history.replaceState(null, '', url);
      document.getElementById('lab').innerHTML = `<b>${s.variant}</b> — ${NAMES[s.variant]}`;
      document.getElementById('stage').innerHTML = `<h1>Prototype · where to look when a slot opens</h1>
        <div class="scene">${[['main', 'The font open'], ['fallback', 'A fallback open'], ['closed', 'All closed']].map(([id, l]) => `<button data-scene="${id}" aria-pressed="${s.scene === id}">${l}</button>`).join('')}</div>
        <div class="site"><h2 id="target" style="font-family:${s.stack.map(face).join(', ')}">Slow pottery for fast mornings</h2></div>
        <p class="question">${QUESTIONS[s.variant]}</p>`;
      document.getElementById('panel').innerHTML = `<div class="dialog ${s.variant}">
        ${s.variant === 'B' && s.open !== null ? '<div class="scrim" data-close></div>' : ''}
        <div class="dhead"><span class="t">Font</span><span class="s2">font-family</span><span class="sp"></span><span class="x2">✕</span></div>
        ${s.stack.map(slot).join('')}
        <div class="foot"><span class="btn">＋ Font</span></div>
      </div>`;
    }
    function setScene(scene) {
      s.scene = scene;
      s.open = scene === 'main' ? 0 : scene === 'fallback' ? 1 : null;
      s.tick += 1;
      render();
    }
    addEventListener('click', (event) => {
      const sc = event.target.closest('[data-scene]');
      if (sc) return setScene(sc.dataset.scene);
      if (event.target.closest('[data-close]')) { s.open = null; return render(); }
      const pick = event.target.closest('[data-pick]');
      if (pick) { s.stack[s.open] = pick.dataset.pick; s.open = null; return render(); }
      const open = event.target.closest('[data-open]');
      if (open) { const i = Number(open.dataset.open); s.open = s.open === i ? null : i; s.tick += 1; render(); }
    });
    const cycle = (step) => {
      const keys = ['A', 'B', 'C'];
      s.variant = keys[(keys.indexOf(s.variant) + step + keys.length) % keys.length];
      setScene(s.scene);
    };
    document.getElementById('prev').onclick = () => cycle(-1);
    document.getElementById('next').onclick = () => cycle(1);
    addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1); });
    setScene(s.scene);
    if (qs.has('shot')) setTimeout(() => {
      const out = Object.assign(document.createElement('pre'), { id: 'out', hidden: true });
      out.textContent = 'RESULTS:{"ok":true}:END';
      document.body.append(out);
    }, 700);
  </script>
</body>
</html>
