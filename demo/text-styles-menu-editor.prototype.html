  <title>PROTOTYPE — Text styles in the effects menu, and a text style editor that shows everything</title>
  <!--
  PROTOTYPE — throwaway, not part of the overlay build. Open the file directly in a browser.

  Two questions, answered together in each variant:
    1. The text toolbar's "Text effects" menu saves text styles; it should also put the page's
       existing text styles (Heading 1, Lede, Body…) on the selected words.
    2. Tokens › Text styles edits a style with Typography's rows only, so a style saved from an
       effect hides its background, padding and filter, and no style shows its states
       (.text-x:hover is a rule of its own, reachable nowhere from here).

  Left: the page, its text toolbar and the menu (select words, then pick). Right: the dock's Tokens
  › Text styles editor for the style picked in the menu's list (or click a style name there).
  Variants (?variant=A|B|C, the bottom bar, or ← → with nothing focused):

    A — Group + rows. The menu gains a "Text styles" group, every style a tile. The editor keeps
        its rows: Typography (set ones first, the rest folded) and a new "Effect" group with every
        other declaration, under a state strip (Base · :hover · + State), with a live preview.
    B — Tabs + cards. The menu has two tabs, Effects | Text styles. The editor is the Styles panel's
        own card grid for the class (Text style, Background, Spacing, Effects), under the same
        state strip: a text style is edited exactly as an element is.
    C — Search + recipe. The menu has one search over effects and styles. The editor of a style
        made from an effect leads with its recipe (the effect tiles and colours, which rewrite it),
        then one flat list of every declaration, its states as tabs.

  Tokens: src/ui/tokens.ts. ◐ switches theme.
-->
  <style>

<body>
  <div class="left">

      link: 'M6.6 9.4l2.8-2.8M6.9 4.6l1-1a2.7 2.7 0 013.8 3.8l-1 1M9.1 11.4l-1 1a2.7 2.7 0 01-3.8-3.8l1-1', check: 'M3.5 8.5l3 3 6-7',
      close: 'M4 4l8 8M12 4l-8 8', plus: 'M8 3.5v9M3.5 8h9', search: 'M7 12a5 5 0 100-10 5 5 0 000 10zM10.6 10.6L14 14', trash: 'M3.5 4.5h9M6.5 4.5V3h3v1.5M5 4.5l.6 8h4.8l.6-8',
    };
    const icon = (n, s = 13) => `<svg viewBox="0 0 16 16" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]}"/></svg>`;
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    /* ---- Effects (as src/core/text-effects.ts, a few) -------------------- */
    const COLORS = [
      { id: 'violet', a: '#6366f1', b: '#ec4899' }, { id: 'mint', a: '#22c55e', b: '#14b8a6' }, { id: 'sun', a: '#f59e0b', b: '#ef4444' },
      { id: 'sky', a: '#06b6d4', b: '#818cf8' }, { id: 'lemon', a: '#fde047', b: '#facc15' }, { id: 'ink', a: '#1f2937', b: '#475569' },
    ];
    const svgUrl = (vb, paths, sw, c, fill) => {
      const g = `<defs><linearGradient id='g'><stop offset='0' stop-color='${c.a}'/><stop offset='1' stop-color='${c.b}'/></linearGradient></defs>`;
      const body = paths.map((d) => fill ? `<path d='${d}' fill='url(#g)' fill-opacity='.85'/>` : `<path d='${d}' fill='none' stroke='url(#g)' stroke-width='${sw}' stroke-linecap='round'/>`).join('');
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='${vb}' preserveAspectRatio='none'>${g}${body}</svg>`;
      return `url("data:image/svg+xml,${svg.replace(/#/g, '%23').replace(/</g, '%3C').replace(/>/g, '%3E')}")`;
    };
    const drawn = (vb, paths, sw, at, size, pad, fill) => (c) => ({ 'background-color': 'transparent', 'background-image': svgUrl(vb, paths, sw, c, fill), 'background-repeat': 'no-repeat', 'background-position': at, 'background-size': size, padding: pad, 'box-decoration-break': 'clone' });
    const EFFECTS = [
      { id: 'gradient', g: 'Text', label: 'Gradient', css: (c) => ({ background: `linear-gradient(120deg, ${c.a}, ${c.b}) text`, color: 'transparent', 'box-decoration-break': 'clone' }) },
      { id: 'glow', g: 'Text', label: 'Glow', css: (c) => ({ color: c.a, 'text-shadow': `0 0 .35em ${c.a}99` }) },
      { id: 'outline', g: 'Text', label: 'Outline', css: (c) => ({ color: 'transparent', '-webkit-text-stroke': `.035em ${c.a}` }) },
      { id: 'echo', g: 'Text', label: 'Echo', css: (c) => ({ background: `linear-gradient(120deg, ${c.a}, ${c.b}) text`, color: 'transparent', filter: 'drop-shadow(.06em .06em 0 #fde68a)' }) },
      { id: 'wavy', g: 'Underline', label: 'Wavy', css: (c) => ({ 'text-decoration': `underline wavy ${c.a}`, 'text-decoration-thickness': '.07em', 'text-underline-offset': '.2em' }) },
      { id: 'arc', g: 'Underline', label: 'Marker arc', css: drawn('0 0 200 18', ['M3 13 C 48 4, 138 2, 197 11'], 5.5, '0 100%', '100% .38em', '0 0 .2em') },
      { id: 'squiggle', g: 'Underline', label: 'Squiggle', css: drawn('0 0 200 18', ['M3 11 Q 22 3, 42 11 T 82 11 T 122 11 T 162 11 T 197 9'], 4.8, '0 100%', '100% .4em', '0 0 .2em') },
      { id: 'sketch', g: 'Underline', label: 'Sketchy', css: drawn('0 0 200 22', ['M4 11 C 52 3, 142 3, 196 10', 'M16 18 C 68 12, 136 13, 186 17'], 4.5, '0 100%', '100% .46em', '0 0 .24em') },
      { id: 'marker', g: 'Highlight', label: 'Marker', mark: true, css: (c) => ({ color: 'inherit', background: `linear-gradient(transparent 62%, color-mix(in oklab, ${c.a} 55%, transparent) 0)`, padding: '0 .08em', 'box-decoration-break': 'clone' }) },
      { id: 'brush', g: 'Highlight', label: 'Brush', mark: true, css: (c) => ({ color: 'inherit', ...drawn('0 0 200 40', ['M4 12 L196 6 L198 20 L190 34 L12 36 L2 26 Z'], 1, '0 80%', '100% .9em', '0 .12em', true)(c) }) },
      { id: 'circle', g: 'Highlight', label: 'Circled', mark: true, css: drawn('0 0 200 60', ['M150 6 C 70 0, 6 14, 6 32 C 6 52, 70 58, 120 55 C 170 52, 196 42, 194 28 C 192 12, 150 6, 92 9'], 3, 'center', '100% 100%', '.1em .3em') },
    ];
    const effect = (id) => EFFECTS.find((e) => e.id === id);
    const color = (id) => COLORS.find((c) => c.id === id);
    const TYPO = ['color', 'font-family', 'font-weight', 'font-style', 'font-size', 'line-height', 'letter-spacing', 'text-transform', 'text-decoration', 'text-decoration-thickness', 'text-underline-offset', 'text-shadow', '-webkit-text-stroke', 'text-align', 'word-spacing'];
    const isTypo = (p) => TYPO.includes(p);

    /* ---- The page's text styles: classes, each with its states (rules of their own) ---- */
    const STYLES = [
      { cls: 'text-heading-1', name: 'Heading 1', decl: { 'font-family': 'system-ui, sans-serif', 'font-size': '44px', 'font-weight': '800', 'line-height': '1.1', 'letter-spacing': '-0.02em', color: '#14171f' }, states: {} },
      { cls: 'text-lede', name: 'Lede', decl: { 'font-family': 'Georgia, serif', 'font-size': '21px', 'line-height': '1.55', color: '#3b4252', 'font-style': 'italic' }, states: {} },
      { cls: 'text-body', name: 'Body', decl: { 'font-family': 'Georgia, serif', 'font-size': '18px', 'line-height': '1.65', color: '#2b3140' }, states: {} },
      { cls: 'text-caption', name: 'Caption', decl: { 'font-family': 'system-ui, sans-serif', 'font-size': '12px', 'letter-spacing': '0.06em', 'text-transform': 'uppercase', color: '#64748b' }, states: {} },
      { cls: 'text-hero-marker', name: 'Hero marker', effect: 'marker', color: 'lemon', decl: { ...effect('marker').css(color('lemon')) }, states: { ':hover': { background: 'linear-gradient(transparent 30%, color-mix(in oklab, #fde047 70%, transparent) 0)' } } },
      { cls: 'text-arc-mint', name: 'Arc mint', effect: 'arc', color: 'mint', decl: { ...effect('arc').css(color('mint')) }, states: {} },
    ];
    const styleBy = (cls) => STYLES.find((s) => s.cls === cls);

    const state = {
      variant: (new URLSearchParams(location.search).get('variant') || 'A').toUpperCase(),
      color: 'violet', tab: 'effects', query: '',
      picked: 'text-hero-marker', cond: 'base', showAllTypo: false, card: 'surface',
      range: null,
    };
    if (!['A', 'B', 'C'].includes(state.variant)) state.variant = 'A';
    const NOTES = {
      A: { name: 'Group + rows', html: `<p class="q"><b>Menu:</b> a fourth group, <b>Text styles</b>, lists every style of the page (Heading 1, Lede, Body… and the ones saved from effects, marked ✦), each drawn in its own look.<br><b>Editor:</b> a live preview, a <b>state strip</b> (Base · :hover · + State) and two groups: <b>Typography</b> (set rows first, the rest folded) and <b>Effect</b>, every other declaration the style holds.</p><ul><li>Closest to today. Picking :hover edits <code>.text-x:hover</code>; its rows show Base's values as placeholders.</li></ul>` },
      B: { name: 'Tabs + cards', html: `<p class="q"><b>Menu:</b> two tabs, <b>Effects | Text styles</b>. Each tab has the room for its own list.<br><b>Editor:</b> the Styles panel's own cards (Text style, Background, Spacing, Effects), under the same condition strip as Styles. A text style is edited exactly like an element.</p><ul><li>The most consistent with Styles, and every card's rich editor is available (the Background card's paint and placement). The cost is weight: a grid inside a token list.</li></ul>` },
      C: { name: 'Search + recipe', html: `<p class="q"><b>Menu:</b> one search over effects and styles, so finding "Lede" or "wavy" is typing.<br><b>Editor:</b> a style made from an effect leads with its <b>recipe</b>: the effect tiles and colours, which rewrite it in one click. Then one flat list of every declaration, its states as tabs.</p><ul><li>Fastest for effect styles: recolouring or swapping "Hero marker" to a brush is one click, not a gradient to retype. Plain styles get the flat list only.</li></ul>` },
    };

    /* ---- Page CSS for the styles, so the page and the tiles agree ---------- */
    const declText = (d) => Object.entries(d).map(([k, v]) => `${k}: ${v}`).join('; ');
    function writeCss() {
      document.getElementById('ds').textContent = STYLES.map((s) => `.${s.cls} { ${declText(s.decl)}; }${Object.entries(s.states).map(([st, d]) => `\n.${s.cls}${st} { ${declText(d)}; }`).join('')}`).join('\n');
    }

    /* ---- Applying, as the real menu does: a span (mark) around the words ---- */
    function wrapWith(make) {
      const sel = getSelection();
      if (state.range) { sel.removeAllRanges(); sel.addRange(state.range); }
      if (!sel.rangeCount) return;
      const r = sel.getRangeAt(0);
      if (!document.getElementById('p').contains(r.commonAncestorContainer)) return;
      let at = r.commonAncestorContainer; if (at.nodeType === 3) at = at.parentElement;
      const cur = at.closest('[data-text-effect]');
      const el = make();
      if (cur && cur.className === el.className && cur.getAttribute('style') === el.getAttribute('style')) { cur.replaceWith(...cur.childNodes); render(); return; }
      if (cur) { el.append(...cur.childNodes); cur.replaceWith(el); }
      else if (r.collapsed) { el.textContent = '\u200b'; r.insertNode(el); }
      else { el.append(r.extractContents()); r.insertNode(el); }
      const nr = document.createRange(); nr.selectNodeContents(el); sel.removeAllRanges(); sel.addRange(nr); state.range = nr.cloneRange();
      render();
    }
    const applyEffect = (id) => wrapWith(() => { const e = effect(id); const el = document.createElement(e.mark ? 'mark' : 'span'); el.dataset.textEffect = id; el.setAttribute('style', declText(e.css(color(state.color)))); return el; });
    const applyStyle = (cls) => { state.picked = cls; wrapWith(() => { const s = styleBy(cls); const el = document.createElement(s.effect && effect(s.effect).mark ? 'mark' : 'span'); el.dataset.textEffect = s.effect ?? 'style'; el.className = cls; return el; }); };
    function currentWrapper() {
      const r = state.range; if (!r) return null;
      let at = r.commonAncestorContainer; if (at.nodeType === 3) at = at.parentElement;
      return at?.closest?.('[data-text-effect]') ?? null;
    }

    /* ---- The menu ---------------------------------------------------------- */
    const looks = (s) => declText(Object.fromEntries(Object.entries(s.decl).map(([k, v]) => [k, k === 'font-size' ? `min(${v}, 22px)` : v])));
    function effectTile(e) {
      const cur = currentWrapper();
      const on = cur && !cur.className && cur.dataset.textEffect === e.id;
      return `<button type="button" class="tile" data-effect="${e.id}" aria-pressed="${!!on}" title="${e.label}"><${e.mark ? 'mark' : 'span'} class="w" style="${esc(declText(e.css(color(state.color))))}">Aa</${e.mark ? 'mark' : 'span'}><span class="n">${e.label}</span></button>`;
    }
    function styleTile(s) {
      const on = currentWrapper()?.classList.contains(s.cls);
      const tag = s.effect && effect(s.effect).mark ? 'mark' : 'span';
      return `<button type="button" class="tile" data-style="${s.cls}" aria-pressed="${!!on}" title="${s.name} · .${s.cls}">${s.effect ? '<span class="badge" aria-label="made from an effect">✦</span>' : ''}<${tag} class="w ts" style="${esc(looks(s))}">Aa</${tag}><span class="n">${s.name}</span></button>`;
    }
    const colorRow = () => `<div class="colors" role="radiogroup" aria-label="Effect colour"><span class="lab">Colour</span>${COLORS.map((c) => `<button type="button" class="dot" role="radio" data-color="${c.id}" aria-checked="${state.color === c.id}" aria-label="${c.id}" style="background:linear-gradient(135deg, ${c.a}, ${c.b})"></button>`).join('')}</div>`;
    const effectGroups = () => ['Text', 'Underline', 'Highlight'].map((g) => `<div class="group">${g}</div><div class="tiles">${EFFECTS.filter((e) => e.g === g).map(effectTile).join('')}</div>`).join('');
    function menu() {
      const cur = currentWrapper();
      const curName = cur ? (cur.className ? styleBy(cur.className.split(' ')[0])?.name : effect(cur.dataset.textEffect)?.label) : '';
      let body;
      if (state.variant === 'A') {
        body = `${colorRow()}${effectGroups()}<div class="group">Text styles<span class="n">${STYLES.length}</span></div><div class="tiles styles">${STYLES.map(styleTile).join('')}</div>`;
      } else if (state.variant === 'B') {
        body = `<div class="tabs" role="tablist"><button type="button" class="tab" role="tab" data-tab="effects" aria-selected="${state.tab === 'effects'}">Effects</button><button type="button" class="tab" role="tab" data-tab="styles" aria-selected="${state.tab === 'styles'}">Text styles · ${STYLES.length}</button></div>
          ${state.tab === 'effects' ? `${colorRow()}${effectGroups()}` : `<div class="tiles styles">${STYLES.map(styleTile).join('')}</div><p class="hint">Put a style on the selected words. ✦ marks a style saved from an effect.</p>`}`;
      } else {
        const q = state.query.trim().toLowerCase();
        const items = [...STYLES.map((s) => ({ kind: 'Style', s })), ...EFFECTS.map((e) => ({ kind: 'Effect', e }))].filter((one) => !q || (one.s ? one.s.name : one.e.label).toLowerCase().includes(q));
        body = `<label class="search">${icon('search', 13)}<input id="q" placeholder="Find an effect or a text style" value="${esc(state.query)}" aria-label="Find an effect or a text style"></label>${colorRow()}
          <div class="list" role="group" aria-label="Effects and text styles">${items.map((one) => {
            if (one.s) { const on = cur?.classList.contains(one.s.cls); const tag = one.s.effect && effect(one.s.effect).mark ? 'mark' : 'span';
              return `<button type="button" class="lrow" data-style="${one.s.cls}" aria-pressed="${!!on}"><span class="pv"><${tag} style="${esc(looks(one.s))}">Pottery</${tag}></span><span><b>${one.s.name}</b><small>.${one.s.cls}</small></span><span class="kind">${one.s.effect ? '✦ Style' : 'Style'}</span></button>`; }
            const on = cur && !cur.className && cur.dataset.textEffect === one.e.id; const tag = one.e.mark ? 'mark' : 'span';
            return `<button type="button" class="lrow" data-effect="${one.e.id}" aria-pressed="${!!on}"><span class="pv"><${tag} style="${esc(declText(one.e.css(color(state.color))))};font:800 17px system-ui">Pottery</${tag}></span><span><b>${one.e.label}</b><small>${one.e.g}</small></span><span class="kind">Effect</span></button>`;
          }).join('') || '<p class="hint">Nothing matches.</p>'}</div>`;
      }
      return `<div class="mhead">Text effects <span class="on">${curName ? `· ${esc(curName)}` : ''}</span></div>${body}
        <div class="foot"><button class="btn sm" type="button" data-remove>${icon('close', 11)} Remove</button>${cur?.className ? `<button class="btn sm link" type="button" data-edit="${cur.className}">Edit ${esc(styleBy(cur.className)?.name ?? '')} in Tokens →</button>` : `<button class="btn sm primary" type="button">${icon('plus', 11)} Save as text style</button>`}</div>`;
    }

    /* ---- The editor (Tokens › Text styles) ---------------------------------- */
    function condValue(s, p) { return state.cond === 'base' ? s.decl[p] ?? '' : s.states[state.cond]?.[p] ?? ''; }
    function row(s, p, opts = {}) {
      const v = condValue(s, p);
      const base = s.decl[p] ?? '';
      const dot = state.cond !== 'base' && v ? 'st' : v ? '' : 'off';
      return `<div class="row" data-row="${p}"><span class="d ${dot}"></span><span class="pn" title="${p}">${opts.label ?? p}</span>
        <input data-prop="${p}" value="${esc(v.length > 60 ? v.slice(0, 57) + '…' : v)}" ${v.length > 60 ? `title="${esc(v)}"` : ''} placeholder="${esc(state.cond !== 'base' && base ? (base.length > 40 ? 'as Base' : base) : '—')}" aria-label="${p}${state.cond === 'base' ? '' : ' on ' + state.cond}">
        ${v ? `<button class="k" type="button" data-kill="${p}" aria-label="Remove ${p}">${icon('trash', 12)}</button>` : '<span></span>'}</div>`;
    }
    function strip(s) {
      const sts = Object.keys(s.states);
      return `<div class="strip" role="group" aria-label="Edit under"><button type="button" class="chip" data-cond="base" aria-pressed="${state.cond === 'base'}">Base <i>${Object.keys(s.decl).length}</i></button>
        ${[...new Set([...sts, state.cond !== 'base' ? state.cond : null].filter(Boolean))].map((st) => `<button type="button" class="chip state" data-cond="${st}" aria-pressed="${state.cond === st}">${st} <i>${Object.keys(s.states[st] ?? {}).length}</i></button>`).join('')}
        <button type="button" class="chip add" data-addstate title="Add :hover, :focus-visible, :active or a size">${icon('plus', 11)} State</button></div>`;
    }
    function preview(s) {
      const d = { ...s.decl, ...(state.cond !== 'base' ? s.states[state.cond] ?? {} : {}) };
      const tag = s.effect && effect(s.effect).mark ? 'mark' : 'span';
      return `<div class="preview"><span class="cap">Preview${state.cond !== 'base' ? ` · ${state.cond}` : ''}</span><${tag} style="${esc(declText({ ...d, 'font-size': d['font-size'] ? `min(${d['font-size']}, 30px)` : '24px' }))}">Slow pottery</${tag}></div>`;
    }
    const allProps = (s) => [...new Set([...Object.keys(s.decl), ...Object.values(s.states).flatMap((d) => Object.keys(d))])];
    function editorA(s) {
      const props = allProps(s);
      const typoSet = TYPO.filter((p) => props.includes(p));
      const typoRest = TYPO.filter((p) => !props.includes(p));
      const other = props.filter((p) => !isTypo(p));
      return `${preview(s)}${strip(s)}
        <div class="gh">Typography<span class="x">${typoSet.length} set</span></div>${typoSet.map((p) => row(s, p)).join('')}
        ${state.showAllTypo ? typoRest.map((p) => row(s, p)).join('') : `<button class="btn sm link more" type="button" data-alltypo>+ ${typoRest.length} more typography properties</button>`}
        ${other.length ? `<div class="gh">Effect<span class="x">${s.effect ? `from ${effect(s.effect).label}` : ''}</span></div>${other.map((p) => row(s, p)).join('')}` : ''}
        <button class="btn sm more" type="button">${icon('plus', 11)} Add a property</button>`;
    }
    function editorB(s) {
      const props = allProps(s);
      const cards = [
        { id: 'typography', name: 'Text style', hc: 300, props: TYPO },
        { id: 'surface', name: 'Background', hc: 40, props: ['background', 'background-color', 'background-image', 'background-repeat', 'background-position', 'background-size', 'background-clip'] },
        { id: 'spacing', name: 'Spacing', hc: 200, props: ['padding', 'margin'] },
        { id: 'effects', name: 'Effects', hc: 330, props: ['filter', 'box-decoration-break', 'opacity', 'mix-blend-mode'] },
      ];
      return `${preview(s)}${strip(s)}<div class="cards">${cards.map((c) => {
        const set = c.props.filter((p) => props.includes(p) && (condValue(s, p) || s.decl[p]));
        const open = state.card === c.id;
        if (!open) return `<button type="button" class="card${set.length ? '' : ' empty'}" style="--hc:${c.hc}" data-card="${c.id}"><span class="ct">${c.name}${set.length ? `<span class="cnt">${set.length}</span>` : ''}</span><span class="sum">${set.length ? set.map((p) => esc(condValue(s, p) || s.decl[p]).slice(0, 18)).join(' · ') : 'Empty'}</span></button>`;
        const shown = set.length ? set : c.props.slice(0, 3);
        return `<div class="card open" style="--hc:${c.hc}"><span class="ct">${c.name}${set.length ? `<span class="cnt">${set.length}</span>` : ''}<button class="btn sm link" type="button" data-card="" style="margin-left:auto">Close</button></span>
          ${c.id === 'surface' && set.length ? '<span class="rule">The Background card\'s layers, paint and placement editor goes here, as in Styles.</span>' : ''}<div class="rows">${shown.map((p) => row(s, p)).join('')}</div></div>`;
      }).join('')}</div>`;
    }
    function editorC(s) {
      const props = allProps(s);
      const recipe = s.effect ? `<div class="recipe"><div class="gh">Made from an effect<span class="x">${effect(s.effect).label} · ${s.color}</span></div>
        <div class="tiles">${EFFECTS.filter((e) => e.g === effect(s.effect).g).map((e) => `<button type="button" class="tile" data-recipe="${e.id}" aria-pressed="${s.effect === e.id}" title="${e.label}"><${e.mark ? 'mark' : 'span'} class="w" style="${esc(declText(e.css(color(s.color))))}">Aa</${e.mark ? 'mark' : 'span'}><span class="n">${e.label}</span></button>`).join('')}</div>
        <div class="colors"><span class="lab">Colour</span>${COLORS.map((c) => `<button type="button" class="dot" data-recolor="${c.id}" aria-checked="${s.color === c.id}" aria-label="${c.id}" style="background:linear-gradient(135deg, ${c.a}, ${c.b})"></button>`).join('')}</div>
        <p class="hint" style="margin:0">Picking rewrites the style's declarations below; a change you made by hand is kept.</p></div>` : '';
      const tabs = `<div class="tabs" role="tablist"><button type="button" class="tab" data-cond="base" aria-selected="${state.cond === 'base'}">Base</button>${Object.keys(s.states).map((st) => `<button type="button" class="tab" data-cond="${st}" aria-selected="${state.cond === st}">${st}</button>`).join('')}<button type="button" class="tab" data-addstate aria-selected="false">+ State</button></div>`;
      return `${preview(s)}${recipe}${tabs}<div class="gh">Declarations<span class="x">${(state.cond === 'base' ? Object.keys(s.decl) : Object.keys(s.states[state.cond] ?? {})).length} in .${s.cls}${state.cond === 'base' ? '' : state.cond}</span></div>
        ${(state.cond === 'base' ? Object.keys(s.decl) : props.filter((p) => s.states[state.cond]?.[p] || s.decl[p])).map((p) => row(s, p)).join('')}
        <button class="btn sm more" type="button">${icon('plus', 11)} Add a property</button>`;
    }
    function editor() {
      const s = styleBy(state.picked);
      const list = STYLES.map((one) => `<button type="button" class="srow" data-pick="${one.cls}" aria-current="${one.cls === state.picked}"><span class="wrapl"><span class="look" style="${esc(looks(one))}">${esc(one.name)}</span></span><span class="meta">${one.effect ? '<span class="kind">✦ effect</span>' : ''}${Object.keys(one.states).length ? `<span class="kind" style="color:var(--heo-state)">${Object.keys(one.states).join(' ')}</span>` : ''}</span></button>`).join('');
      const body = state.variant === 'A' ? editorA(s) : state.variant === 'B' ? editorB(s) : editorC(s);
      return `<div class="sec">Text styles <span class="n">${STYLES.length}</span></div><div class="stylelist">${list}</div>
        <div class="ed" data-editor="${s.cls}"><div class="gh">${esc(s.name)}<span class="x">.${s.cls}</span></div>${body}
          <p class="hint" style="margin:0">${document.querySelectorAll('.' + s.cls).length} uses on this page follow every change.</p></div>`;
    }

    function render() {
      writeCss();
      const fmt = [['bold', 'Bold'], ['italic', 'Italic'], ['underline', 'Underline'], ['strike', 'Strikethrough']];
      document.getElementById('tb').innerHTML = `${fmt.map(([i, t]) => `<button class="ib" type="button" aria-label="${t}">${icon(i)}</button>`).join('')}<button class="ib wide" type="button" aria-label="Text effects" aria-expanded="true">${icon('textFx', 14)}${icon('chevronDown', 9)}</button><span class="sep"></span><button class="ib" type="button" aria-label="Link">${icon('link')}</button><span class="sep"></span><span class="done">${icon('check', 12)} Done</span>`;
      const q = document.activeElement?.id === 'q';
      document.getElementById('menu').innerHTML = menu();
      if (q) { const el = document.getElementById('q'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
      const keep = document.activeElement?.dataset?.prop;
      document.getElementById('dbody').innerHTML = editor();
      if (keep) document.querySelector(`[data-prop="${keep}"]`)?.focus();
      document.getElementById('notes').innerHTML = NOTES[state.variant].html;
      document.getElementById('proto-label').textContent = `${state.variant} — ${NOTES[state.variant].name}`;
    }

    /* ---- Events --------------------------------------------------------------- */
    document.addEventListener('pointerdown', (event) => { if (event.target.closest('.menu, .tb') && !event.target.closest('input')) event.preventDefault(); });
    document.addEventListener('selectionchange', () => {
      const sel = getSelection(); if (!sel.rangeCount) return;
      const r = sel.getRangeAt(0);
      if (document.getElementById('p').contains(r.commonAncestorContainer)) { state.range = r.cloneRange(); document.getElementById('menu').innerHTML = menu(); }
    });
    document.addEventListener('click', (event) => {
      const b = event.target.closest('button'); if (!b) return;
      const d = b.dataset; const s = styleBy(state.picked);
      if (d.effect) return applyEffect(d.effect);
      if (d.style) return applyStyle(d.style);
      if (d.color) { state.color = d.color; return render(); }
      if (d.tab) { state.tab = d.tab; return render(); }
      if (d.remove !== undefined) { const c = currentWrapper(); if (c) c.replaceWith(...c.childNodes); return render(); }
      if (d.edit) { state.picked = d.edit.split(' ')[0]; state.cond = 'base'; return render(); }
      if (d.pick) { state.picked = d.pick; state.cond = 'base'; return render(); }
      if (d.cond) { state.cond = d.cond; return render(); }
      if (d.addstate !== undefined) { const next = [':hover', ':focus-visible', ':active'].find((st) => !s.states[st]); if (next) { s.states[next] = {}; state.cond = next; } return render(); }
      if (d.alltypo !== undefined) { state.showAllTypo = true; return render(); }
      if (d.card !== undefined) { state.card = d.card; return render(); }
      if (d.kill) { if (state.cond === 'base') delete s.decl[d.kill]; else delete s.states[state.cond][d.kill]; return render(); }
      if (d.recipe || d.recolor) { s.effect = d.recipe ?? s.effect; s.color = d.recolor ?? s.color; s.decl = { ...effect(s.effect).css(color(s.color)) }; return render(); }
    });
    document.addEventListener('change', (event) => {
      const t = event.target; if (!t.dataset.prop) return;
      const s = styleBy(state.picked); const p = t.dataset.prop; const v = t.value.trim();
      const into = state.cond === 'base' ? s.decl : (s.states[state.cond] ??= {});
      if (v) into[p] = v; else delete into[p];
      render();
    });
    document.addEventListener('input', (event) => { if (event.target.id === 'q') { state.query = event.target.value; render(); } });
    function go(step) {
      const o = ['A', 'B', 'C'];
      state.variant = o[(o.indexOf(state.variant) + step + 3) % 3];
      const url = new URL(location.href); url.searchParams.set('variant', state.variant); history.replaceState(null, '', url);
      render();
    }
    document.querySelectorAll('.proto-bar [data-step]').forEach((b) => b.addEventListener('click', () => go(Number(b.dataset.step))));
    document.getElementById('theme').addEventListener('click', () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; });
    addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      const a = document.activeElement;
      if (a && a !== document.body && !a.closest('.proto-bar')) return;
      go(event.key === 'ArrowLeft' ? -1 : 1);
    });
    render();
  </script>
</body>
</html>
