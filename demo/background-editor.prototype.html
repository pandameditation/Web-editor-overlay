<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Background editor: layers, images, gradients</title>
  <!--
  PROTOTYPE — throwaway, not part of the overlay build. Open the file directly in a browser.
  Delete, or move it to a prototype branch, once a direction is picked.

  Question: what should the Background section's editor look like, the way heo-border-editor is the
  Border section's? Today the section is four plain rows (color, image, size, position).

  Needs, from the request:
    - add an image from a URL or a local file;
    - a gradient editor: pick a swatch, or build one: linear or radial, an angle for linear, and the
      colour stops on a 0–100 bar. Click a stop for its colour; drag it to move it, past another to
      reorder; the stops are also a list, draggable to reorder the colours;
    - every background property edited properly: color, image, position, size, repeat, attachment,
      origin, clip, blend mode;
    - writes `background` (plus `background-blend-mode`, which the shorthand cannot carry), as the
      Border editor writes `border`. The equivalent longhands are shown beside it for comparison.

  Shared by every variant (the request spells them out): the gradient editor, the image source,
  the writing rule. What differs is the structure round them.

    A — Layer stack: a Figma-style list of layers (top first), the base colour pinned under them,
        and the picked layer's editor below the list.
    B — Canvas: the element drawn as a box (border, padding, content); the picked layer's position
        is dragged on it and its clip is the ring you click. Layers are chips under it.
    C — Fill field: one `background` field whose swatch is the whole result; it opens a fill popover
        (Solid / Gradient / Image per layer, with a layer pager). The longhands stay as rows.

    D — This round: A's layer stack and detail, with B's canvas as the position control. Click
        anywhere in it to place the layer, or drag; near one of the nine dots it snaps to that
        keyword (`right top`), hold Alt to place freely. The dots sit on the origin box, the box the
        position is measured in; the clip row picks what the layer paints into, drawn in accent.

  Variants: ?variant=D (default) | A | B | C, the bottom bar, or ← →.
-->
  <style>
    :root {
      /* src/ui/theme.ts, light theme */
      --bg: #ffffff;
      --sunken: #f3f4f7;
      --raised: #ffffff;
      --hover: #eef0f5;
      --text: #1f2330;
      --dim: #4b5263;
      --faint: #6b7385;
      --line: #e3e6ec;
      --line2: #d3d7e0;
      --accent: #6366f1;
      --accent-soft: color-mix(in oklab, var(--accent) 12%, transparent);
      --danger: #e11d48;
      --r-sm: 7px;
      --r-md: 9px;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      --mono: ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
      --checker: linear-gradient(45deg, #d9dce3 25%, transparent 25% 75%, #d9dce3 75%), linear-gradient(45deg, #d9dce3 25%, transparent 25% 75%, #d9dce3 75%);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; font-family: var(--font); background: #e9ecf2; color: var(--text); }
    button { font: inherit; }

    /* ---------------------------------------------------------------- page side (not the design) */
    .stage { padding: 28px 32px 90px; overflow: auto; }
    .stage h1 { font: 600 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: #64748b; margin: 0 0 12px; }
    .site { background: #f8fafc; border-radius: 14px; padding: 36px; box-shadow: 0 8px 30px -12px rgb(15 23 42 / 25%); }
    #target { height: 230px; border: 6px solid rgb(255 255 255 / 55%); padding: 22px 26px; border-radius: 14px; color: #fff; font: 600 26px/1.2 system-ui; display: flex; align-items: flex-end; text-shadow: 0 1px 8px rgb(0 0 0 / 35%); }
    .outs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
    .out { background: #111827; color: #e5e7eb; border-radius: 10px; padding: 12px 14px; font: 11.5px/1.6 var(--mono); white-space: pre-wrap; word-break: break-all; }
    .out b { color: #a5b4fc; font-weight: 500; }
    .out .c { color: #8b93a5; }
    .question { margin-top: 14px; color: #475569; font-size: 13px; line-height: 1.5; max-width: 640px; }

    /* ---------------------------------------------------------------- panel chrome */
    .panel { background: var(--bg); border-left: 1px solid var(--line); overflow: auto; padding: 14px 14px 100px; font-size: 12px; }
    .section-h { display: flex; align-items: center; gap: 8px; font: 600 11px/1 var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 2px 0 12px; }
    .group-h { display: flex; align-items: center; gap: 6px; margin: 12px 0 6px; color: var(--faint); font-size: 9.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
    .group-h::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
    .tip { margin: 8px 0 0; color: var(--faint); font-size: 10.5px; line-height: 1.45; }

    /* ---------------------------------------------------------------- fields (stand-ins for heo-value-field) */
    .f { display: flex; align-items: center; height: 28px; min-width: 0; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--raised); padding: 0 7px; gap: 6px; }
    .f:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent); }
    .f input, .f select { all: unset; flex: 1; min-width: 0; font: 12px var(--mono); color: var(--text); }
    .f select { cursor: pointer; }
    .f .unit { font: 10.5px var(--mono); color: var(--faint); }
    .f .lbl { font: 500 10px var(--font); color: var(--faint); }
    .sw { position: relative; width: 16px; height: 16px; flex: none; border-radius: 4px; overflow: hidden; background-image: var(--checker); background-size: 8px 8px; background-position: 0 0, 4px 4px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 14%); cursor: pointer; }
    .sw i { position: absolute; inset: 0; }
    .sw input[type=color] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; border: 0; padding: 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .grid2 .wide { grid-column: 1 / -1; }
    .seg { display: flex; padding: 2px; gap: 2px; background: var(--sunken); border-radius: var(--r-sm); border: 1px solid var(--line); }
    .seg button { all: unset; flex: 1; text-align: center; padding: 4px 6px; border-radius: 5px; font-size: 11px; color: var(--dim); cursor: pointer; white-space: nowrap; }
    .seg button:hover { color: var(--text); }
    .seg button[aria-pressed=true] { background: var(--raised); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 12%); font-weight: 600; }
    .btn { all: unset; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--raised); font-size: 11.5px; color: var(--dim); cursor: pointer; }
    .btn:hover { background: var(--hover); color: var(--text); }
    .btn.primary { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 40%, var(--line2)); }
    .icon { all: unset; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 5px; color: var(--faint); cursor: pointer; font-size: 12px; }
    .icon:hover { background: var(--hover); color: var(--text); }
    .icon.danger:hover { color: var(--danger); }
    :focus-visible { outline: 2px solid color-mix(in oklab, var(--accent) 70%, white); outline-offset: 1px; }
    .row { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 8px; margin-bottom: 5px; }
    .row > .name { color: var(--dim); font-size: 11px; }

    /* ---------------------------------------------------------------- shared: gradient editor */
    .presets { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
    .preset { all: unset; aspect-ratio: 1; border-radius: 6px; cursor: pointer; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 10%); }
    .preset:hover { transform: scale(1.08); }
    .gline { display: flex; align-items: center; gap: 8px; }
    .dial { position: relative; width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line2); cursor: grab; touch-action: none; }
    .dial i { position: absolute; left: 50%; top: 50%; width: 2px; height: 14px; margin-left: -1px; background: var(--accent); border-radius: 2px; transform-origin: 50% 0; }
    .dial b { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--accent); }
    .quick { display: flex; gap: 2px; }
    .quick .icon { width: 20px; height: 20px; font-size: 11px; }

    .gbar { position: relative; padding: 0 7px; margin-top: 4px; user-select: none; }
    .gtrack { position: relative; height: 28px; border-radius: 6px; background-image: var(--checker); background-size: 10px 10px; background-position: 0 0, 5px 5px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%); cursor: copy; }
    .gtrack > i { position: absolute; inset: 0; border-radius: 6px; }
    .stop { all: unset; position: absolute; top: -5px; width: 14px; height: 38px; margin-left: -7px; cursor: ew-resize; touch-action: none; z-index: 1; }
    .stop::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 30%); }
    .stop i { position: absolute; left: 0; bottom: -6px; width: 14px; height: 14px; border-radius: 4px; border: 2px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 25%), 0 1px 3px rgb(0 0 0 / 30%); }
    .stop.on i { box-shadow: 0 0 0 2px var(--accent), 0 1px 3px rgb(0 0 0 / 30%); }
    .stop:focus-visible i { box-shadow: 0 0 0 2px var(--accent); }
    .scale { position: relative; height: 22px; margin-top: 10px; }
    .scale span { position: absolute; top: 0; transform: translateX(-50%); font: 9.5px var(--mono); color: var(--faint); }
    .scale span::before { content: ''; display: block; width: 1px; height: 4px; margin: 0 auto 2px; background: var(--line2); }
    .stops { display: grid; gap: 4px; margin-top: 2px; }
    .stoprow { display: grid; grid-template-columns: 14px 1fr 70px 22px; gap: 5px; align-items: center; border-radius: 6px; }
    .stoprow.on .f { border-color: color-mix(in oklab, var(--accent) 50%, var(--line2)); }
    .stoprow.over { box-shadow: 0 -2px 0 var(--accent); }
    .grip { cursor: grab; color: var(--faint); font-size: 12px; text-align: center; line-height: 1; }
    .radial-at { display: grid; grid-template-columns: repeat(3, 14px); gap: 2px; }
    .dot9 { all: unset; width: 14px; height: 14px; border-radius: 3px; background: var(--sunken); box-shadow: inset 0 0 0 1px var(--line2); cursor: pointer; }
    .dot9[aria-pressed=true] { background: var(--accent); box-shadow: none; }

    /* ---------------------------------------------------------------- shared: image source */
    .drop { display: grid; grid-template-columns: 64px 1fr; gap: 8px; align-items: center; padding: 6px; border: 1px dashed var(--line2); border-radius: var(--r-md); background: var(--sunken); }
    .drop.over { border-color: var(--accent); background: var(--accent-soft); }
    .drop .thumb { width: 64px; height: 44px; border-radius: 5px; background: var(--checker) 0 0 / 8px 8px; background-color: #fff; overflow: hidden; }
    .drop .thumb i { display: block; width: 100%; height: 100%; background-size: cover; background-position: center; }
    .drop .meta { display: grid; gap: 5px; min-width: 0; }
    .drop .meta .name { font: 11px var(--mono); color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .drop .meta .acts { display: flex; gap: 5px; }

    /* ---------------------------------------------------------------- shared: placement */
    .pos9 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; width: 66px; padding: 3px; background: var(--sunken); border: 1px solid var(--line); border-radius: 6px; }
    .pos9 button { all: unset; height: 14px; border-radius: 3px; cursor: pointer; display: grid; place-items: center; }
    .pos9 button::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--line2); }
    .pos9 button:hover::after { background: var(--dim); }
    .pos9 button[aria-pressed=true]::after { width: 8px; height: 8px; background: var(--accent); }
    .posline { display: grid; grid-template-columns: 66px 1fr; gap: 8px; align-items: center; }

    /* ---------------------------------------------------------------- shared: raw rows (as the Border section's) */
    .rows { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 2px; }
    .rawrow { display: grid; grid-template-columns: 8px 112px 1fr; gap: 6px; align-items: center; font: 11px var(--mono); padding: 3px 0; }
    .rawrow::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .rawrow .p { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rawrow .v { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid var(--line2); border-radius: 6px; padding: 4px 7px; }

    /* ---------------------------------------------------------------- A: layer stack */
    .layers { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
    .layer { display: grid; grid-template-columns: 14px 26px 1fr auto; gap: 7px; align-items: center; padding: 5px 6px 5px 4px; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--raised); }
    .layer:hover { background: var(--hover); }
    .layer.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
    .layer.off .thumb26, .layer.off .ln { opacity: .45; }
    .layer.over { box-shadow: inset 0 2px 0 var(--accent); }
    .thumb26 { width: 26px; height: 26px; border-radius: 5px; background: var(--checker) 0 0 / 8px 8px; position: relative; overflow: hidden; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 12%); }
    .thumb26 i { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .ln { min-width: 0; display: grid; gap: 1px; }
    .ln b { font-size: 11.5px; font-weight: 600; }
    .ln span { font: 10px var(--mono); color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .layer .acts { display: flex; gap: 1px; }
    .layer.base { cursor: default; grid-template-columns: 14px 26px 1fr; background: var(--sunken); border-bottom: 0; }
    .layer.base:hover { background: var(--sunken); }
    .addbar { display: flex; gap: 5px; margin-top: 6px; }
    .detail { margin-top: 10px; padding: 9px; border: 1px solid var(--line); border-radius: var(--r-md); background: color-mix(in oklab, var(--accent) 3%, var(--bg)); }
    .detail > .dh { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
    .detail > .dh .seg { margin-left: auto; }
    details.more > summary { cursor: pointer; list-style: none; color: var(--accent); font-size: 11px; margin: 8px 0 4px; }
    details.more > summary::-webkit-details-marker { display: none; }

    /* ---------------------------------------------------------------- B: canvas */
    .canvas-wrap { position: relative; padding: 18px 8px 8px; border-radius: var(--r-md); background: var(--sunken); border: 1px solid var(--line); }
    .mini { position: relative; height: 150px; border: 12px dashed rgb(99 102 241 / 28%); padding: 14px; border-radius: 10px; }
    .mini .content { position: absolute; inset: 14px; border: 1px dashed rgb(255 255 255 / 70%); border-radius: 3px; pointer-events: none; }
    .ring { all: unset; position: absolute; font: 600 8.5px var(--font); letter-spacing: .06em; text-transform: uppercase; color: var(--faint); padding: 1px 5px; border-radius: 4px; cursor: pointer; background: var(--bg); box-shadow: 0 0 0 1px var(--line2); z-index: 2; }
    .ring:hover { color: var(--text); }
    .ring[aria-pressed=true] { color: #fff; background: var(--accent); box-shadow: none; }
    .ring.b { top: 4px; right: 12px; }
    .ring.p { top: 23px; right: 26px; }
    .ring.c { top: 40px; right: 42px; }
    .focal { position: absolute; width: 22px; height: 22px; margin: -11px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 35%), 0 2px 6px rgb(0 0 0 / 35%); cursor: move; touch-action: none; z-index: 3; background: rgb(255 255 255 / 18%); }
    .focal::after { content: ''; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #fff; }
    .canvas-note { display: flex; justify-content: space-between; margin-top: 6px; font: 10px var(--mono); color: var(--faint); }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .chip { all: unset; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 4px; border-radius: 999px; border: 1px solid var(--line2); background: var(--raised); font-size: 11px; cursor: pointer; }
    .chip:hover { background: var(--hover); }
    .chip.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .chip.off { opacity: .55; }
    .chip.over { box-shadow: -3px 0 0 var(--accent); }
    .chip .thumb20 { width: 20px; height: 20px; border-radius: 50%; position: relative; overflow: hidden; background: var(--checker) 0 0 / 6px 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 15%); }
    .chip .thumb20 i { position: absolute; inset: 0; background-size: cover; background-position: center; }
    .chip .n { font: 9.5px var(--mono); color: var(--faint); }
    .sheet { margin-top: 10px; }
    .sheet .sh { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-weight: 600; font-size: 11px; }
    .sheet .sh .acts { margin-left: auto; display: flex; gap: 2px; }

    /* ---------------------------------------------------------------- D: the position canvas */
    .pc { padding: 8px; border-radius: var(--r-md); background: var(--sunken); border: 1px solid var(--line); }
    .pc .mini { height: 140px; cursor: crosshair; }
    .pc .obox { position: absolute; touch-action: none; }
    .pc .obox::before { content: ''; position: absolute; inset: 0; border: 1px dashed rgb(255 255 255 / 75%); border-radius: 3px; pointer-events: none; mix-blend-mode: difference; }
    .pc .clipline { position: absolute; border: 2px solid var(--accent); border-radius: 4px; pointer-events: none; box-shadow: 0 0 0 1px rgb(255 255 255 / 60%); }
    .snapdot { position: absolute; width: 8px; height: 8px; margin: -4px; border-radius: 50%; background: rgb(255 255 255 / 85%); box-shadow: 0 0 0 1px rgb(0 0 0 / 35%); pointer-events: none; transition: transform .08s; }
    .snapdot.on { transform: scale(1.7); background: var(--accent); box-shadow: 0 0 0 2px #fff; }
    .pc .focal { pointer-events: none; }
    .pc .focal.snapped { border-color: var(--accent); }
    .pcbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; margin-top: 7px; }
    .pcbar .f { height: 26px; }
    .boxseg { display: flex; align-items: center; gap: 6px; margin-top: 7px; font-size: 10.5px; color: var(--faint); }
    .boxseg .seg { flex: 1; }
    .boxseg .seg button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
    .nest { position: relative; width: 12px; height: 12px; border-radius: 2px; box-shadow: inset 0 0 0 1px currentColor; opacity: .7; }
    .nest::after { content: ''; position: absolute; border-radius: 1px; background: currentColor; }
    .nest.border-box::after { inset: 0; }
    .nest.padding-box::after { inset: 2px; }
    .nest.content-box::after { inset: 4px; }

    /* ---------------------------------------------------------------- C: fill field + popover */
    .fill { all: unset; box-sizing: border-box; min-width: 0; display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px 0 4px; border: 1px solid var(--line2); border-radius: var(--r-sm); background: var(--raised); cursor: pointer; }
    .fill:hover { border-color: var(--dim); }
    .fill.open { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 18%, transparent); }
    .fill .big { width: 24px; height: 24px; border-radius: 5px; position: relative; overflow: hidden; background: var(--checker) 0 0 / 8px 8px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 14%); flex: none; }
    .fill .big i { position: absolute; inset: 0; }
    .fill .txt { font: 11.5px var(--mono); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .fill .count { font-size: 10px; color: var(--faint); }
    .pop { margin-top: 6px; border: 1px solid var(--line2); border-radius: 11px; background: var(--raised); box-shadow: 0 14px 34px -12px rgb(15 23 42 / 35%), 0 2px 6px rgb(15 23 42 / 8%); padding: 8px; }
    .pager { display: flex; align-items: center; gap: 4px; margin-bottom: 8px; }
    .pager .dots { display: flex; gap: 4px; margin: 0 4px; }
    .pager .dots button { all: unset; width: 22px; height: 22px; border-radius: 5px; position: relative; overflow: hidden; cursor: pointer; background: var(--checker) 0 0 / 6px 6px; box-shadow: inset 0 0 0 1px rgb(0 0 0 / 14%); }
    .pager .dots button i { position: absolute; inset: 0; background-size: cover; }
    .pager .dots button[aria-pressed=true] { box-shadow: 0 0 0 2px var(--accent); }
    .pager .dots button.over { box-shadow: -3px 0 0 var(--accent); }
    .pager .lbl { font-size: 10.5px; color: var(--faint); margin-left: auto; }
    .typetabs { margin-bottom: 8px; }
    .crow { display: grid; grid-template-columns: 112px 1fr 22px; gap: 6px; align-items: center; margin-bottom: 4px; }
    .crow .p { font: 11px var(--mono); color: var(--dim); }
    .crow.unset .p { color: var(--faint); }

    /* ---------------------------------------------------------------- switcher (not the design) */
    .switcher { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; background: #0f172a; color: #fff; border-radius: 999px; padding: 5px; box-shadow: 0 10px 30px -8px rgb(0 0 0 / 50%); z-index: 99; font: 500 12.5px var(--font); }
    .switcher button { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; font-size: 15px; }
    .switcher button:hover { background: rgb(255 255 255 / 14%); }
    .switcher span { padding: 0 10px; min-width: 220px; text-align: center; }
  </style>
</head>

<body>
  <main class="stage">
    <h1>Page — the element being edited</h1>
    <div class="site">
      <div id="target">A hero block</div>
    </div>
    <div class="outs">
      <div class="out" id="out-short"></div>
      <div class="out" id="out-long"></div>
    </div>
    <p class="question" id="about"></p>
  </main>

  <aside class="panel">
    <div class="section-h">◐ Background</div>
    <div id="editor"></div>
  </aside>

  <div class="switcher" role="toolbar" aria-label="Prototype variants">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <span id="label"></span>
    <button type="button" id="next" aria-label="Next variant">→</button>
  </div>

  <script>
    // ================================================================ state (in memory only)
    // Sample images, inline so the page works offline (a URL or a file replaces them).
    const svg = (body) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">${body}</svg>`);
    const MOUNTAINS = svg('<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#fff4dc"/></linearGradient></defs><rect width="900" height="500" fill="url(#s)"/><circle cx="660" cy="150" r="60" fill="#ffd27a"/><path d="M0 380 L170 210 L300 330 L460 170 L640 360 L760 260 L900 340 L900 500 L0 500Z" fill="#5b7c99"/><path d="M0 430 L210 300 L390 420 L560 310 L900 440 L900 500 L0 500Z" fill="#2f4858"/>');
    const DOTS = svg('<rect width="900" height="500" fill="none"/><g fill="#ffffff" opacity=".35">' + Array.from({ length: 60 }, (_, i) => `<circle cx="${(i % 10) * 90 + 45}" cy="${Math.floor(i / 10) * 84 + 40}" r="6"/>`).join('') + '</g>');
    const PLACE = (over = {}) => ({ size: 'auto', position: 'left top', repeat: 'repeat', attachment: 'scroll', origin: 'padding-box', clip: 'border-box', blend: 'normal', visible: true, ...over });
    let nextId = 1;
    const gradientLayer = (g) => ({ id: nextId++, type: 'gradient', g, ...PLACE() });
    const imageLayer = (url, name) => ({ id: nextId++, type: 'image', url, name, ...PLACE({ size: 'cover', position: 'center', repeat: 'no-repeat' }) });
    const solidLayer = (c) => ({ id: nextId++, type: 'solid', c, ...PLACE() });

    const state = {
      color: '#0f172a',
      layers: [
        { ...gradientLayer({ kind: 'linear', angle: 160, shape: 'ellipse', at: 'center', stops: [{ c: '#6366f1', p: 0 }, { c: '#ec4899', p: 55 }, { c: '#f59e0b', p: 100 }] }), blend: 'multiply' },
        imageLayer(MOUNTAINS, 'mountains.svg'),
      ],
    };
    const ui = { sel: 0, stop: 0, pop: true, add: false };

    const PRESETS = [
      { kind: 'linear', angle: 135, stops: [['#6366f1', 0], ['#ec4899', 100]] },
      { kind: 'linear', angle: 90, stops: [['#06b6d4', 0], ['#3b82f6', 100]] },
      { kind: 'linear', angle: 180, stops: [['#f59e0b', 0], ['#ef4444', 100]] },
      { kind: 'linear', angle: 45, stops: [['#22c55e', 0], ['#14b8a6', 50], ['#0ea5e9', 100]] },
      { kind: 'linear', angle: 180, stops: [['#00000000', 0], ['#000000b3', 100]] },
      { kind: 'radial', shape: 'circle', at: 'center', stops: [['#fde68a', 0], ['#f97316', 60], ['#7c2d12', 100]] },
      { kind: 'radial', shape: 'ellipse', at: 'left top', stops: [['#a5b4fc', 0], ['#6366f100', 70]] },
      { kind: 'linear', angle: 120, stops: [['#0f172a', 0], ['#334155', 50], ['#0f172a', 100]] },
    ];

    const VARIANTS = {
      D: { name: 'Layer stack + canvas', about: 'A’s stack and detail; the position is the canvas. Click anywhere to place the layer or drag; near one of the nine dots it snaps to that keyword (right top), Alt places freely. The dots are on the origin box (dashed); the clip row picks the box the layer paints into (accent outline).' },
      A: { name: 'Layer stack', about: 'Layers top-first, the base colour pinned under them; drag a row to reorder, the eye hides one. The picked layer’s editor sits below: its fill (gradient or image) then its placement, with origin and clip under “More”.' },
      B: { name: 'Canvas', about: 'The element as a box: drag the white point to place the picked layer; click border / padding / content to pick what it paints into (clip). Layers are chips under it, drag to reorder, leftmost on top.' },
      C: { name: 'Fill field', about: 'One background field whose swatch is the whole result; it opens the fill popover. Each layer is Solid, Gradient or Image (the pager’s squares, draggable). The longhands stay listed under it as rows, set ones in ink.' },
    };
    let variant = new URLSearchParams(location.search).get('variant')?.toUpperCase();
    if (!VARIANTS[variant]) variant = 'D';

    // ================================================================ CSS model
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const gradCss = (g, forceLinear) => {
      const stops = [...g.stops].sort((a, b) => a.p - b.p).map((s) => `${s.c} ${Math.round(s.p)}%`).join(', ');
      if (forceLinear || g.kind === 'linear') return `linear-gradient(${forceLinear ? '90deg' : `${Math.round(g.angle)}deg`}, ${stops})`;
      return `radial-gradient(${g.shape}${g.at && g.at !== 'center' ? ` at ${g.at}` : ''}, ${stops})`;
    };
    const imageOf = (l, short = false) => {
      if (l.type === 'gradient') return gradCss(l.g);
      if (l.type === 'solid') return `linear-gradient(${l.c}, ${l.c})`;
      const url = short && l.url.startsWith('data:') ? `${l.url.slice(0, 18)}… (${l.name})` : l.url;
      return `url("${url}")`;
    };
    const DEFAULT_POS = ['left top', '0% 0%', '0 0', 'top left'];
    const isDefault = (l, k) => (k === 'position' ? DEFAULT_POS.includes(l.position) : l[k] === PLACE()[k]);
    const sizeOf = (l) => l.size;

    function layerShorthand(l, short) {
      const out = [imageOf(l, short)];
      if (!isDefault(l, 'position') || !isDefault(l, 'size')) out.push(`${isDefault(l, 'position') ? '0 0' : l.position}${isDefault(l, 'size') ? '' : ` / ${sizeOf(l)}`}`);
      if (!isDefault(l, 'repeat')) out.push(l.repeat);
      if (!isDefault(l, 'attachment')) out.push(l.attachment);
      if (!isDefault(l, 'origin') || !isDefault(l, 'clip')) out.push(l.origin === l.clip ? l.origin : `${l.origin} ${l.clip}`);
      return out.join(' ');
    }
    const shown = () => state.layers.filter((l) => l.visible);

    /** What the editor writes: one `background`, plus the blend mode the shorthand cannot carry. */
    function shorthandCss(short = false) {
      const layers = shown();
      const decls = [];
      if (!layers.length) decls.push(['background', state.color]);
      else {
        const parts = layers.map((l) => layerShorthand(l, short));
        parts[parts.length - 1] += ` ${state.color}`;
        decls.push(['background', parts.join(',\n    ')]);
      }
      if (layers.some((l) => l.blend !== 'normal')) decls.push(['background-blend-mode', layers.map((l) => l.blend).join(', ')]);
      return decls;
    }
    /** The same thing as longhands: only the lists where some layer is not at the default. */
    function longhandCss(short = false) {
      const layers = shown();
      const decls = [['background-color', state.color]];
      if (!layers.length) return decls;
      decls.push(['background-image', layers.map((l) => imageOf(l, short)).join(',\n    ')]);
      const list = (k, prop, fn = (l) => l[k]) => { if (layers.some((l) => !isDefault(l, k))) decls.push([prop, layers.map(fn).join(', ')]); };
      list('position', 'background-position');
      list('size', 'background-size');
      list('repeat', 'background-repeat');
      list('attachment', 'background-attachment');
      list('origin', 'background-origin');
      list('clip', 'background-clip');
      list('blend', 'background-blend-mode');
      return decls;
    }

    // ================================================================ state helpers
    const get = (key) => key.split('.').reduce((o, k) => o?.[k], state);
    function set(key, value) {
      const path = key.split('.');
      const last = path.pop();
      const obj = path.reduce((o, k) => o[k], state);
      obj[last] = typeof obj[last] === 'number' ? (Number.isFinite(parseFloat(value)) ? parseFloat(value) : obj[last]) : value;
    }
    const sel = () => state.layers[ui.sel];
    const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
    const toHex6 = (c) => (/^#[0-9a-f]{6}/i.test(c) ? c.slice(0, 7) : /^#[0-9a-f]{3}$/i.test(c) ? '#' + [...c.slice(1)].map((x) => x + x).join('') : '#000000');
    function mix(a, b, t) {
      const pa = toHex6(a), pb = toHex6(b);
      const ch = (s, i) => parseInt(s.slice(1 + i * 2, 3 + i * 2), 16);
      return '#' + [0, 1, 2].map((i) => Math.round(ch(pa, i) + (ch(pb, i) - ch(pa, i)) * t).toString(16).padStart(2, '0')).join('');
    }
    const thumbCss = (l) => (l.type === 'image' ? `background-image:url("${esc(l.url)}")` : `background:${esc(imageOf(l))}`);
    const layerName = (l) => (l.type === 'image' ? 'Image' : l.type === 'solid' ? 'Solid' : l.g.kind === 'linear' ? 'Linear gradient' : 'Radial gradient');
    const layerSub = (l) => (l.type === 'image' ? l.name || l.url : l.type === 'solid' ? l.c : l.g.kind === 'linear' ? `${Math.round(l.g.angle)}° · ${l.g.stops.length} stops` : `${l.g.shape} · ${l.g.stops.length} stops`);

    // ================================================================ shared pieces
    function colorField(key, extra = '') {
      const v = get(key);
      return `<label class="f ${extra}"><span class="sw"><i style="background:${esc(v)}"></i><input type="color" data-k="${key}" value="${toHex6(v)}" aria-label="${key} picker"></span><input data-k="${key}" value="${esc(v)}" aria-label="${key}"></label>`;
    }
    const select = (key, options, label) => `<label class="f"><select data-k="${key}" aria-label="${label || key}">${options.map((o) => `<option ${o === get(key) ? 'selected' : ''}>${o}</option>`).join('')}</select></label>`;
    const seg = (act, options, current, labels = options) => `<div class="seg">${options.map((o, i) => `<button type="button" data-act="${act}:${o}" aria-pressed="${o === current}">${labels[i]}</button>`).join('')}</div>`;

    /** The gradient editor: swatches, kind, angle or shape, the 0–100 bar, and the stop list. */
    function gradientEditor(li) {
      const l = state.layers[li];
      const g = l.g;
      const base = `layers.${li}.g`;
      const stops = g.stops;
      const order = stops.map((s, k) => k).sort((a, b) => stops[a].p - stops[b].p);
      const shape = g.kind === 'linear'
        ? `<div class="gline">
            <span class="dial" data-dial="${li}" title="Drag to turn; shift snaps to 15°"><i style="transform:rotate(${g.angle + 180}deg)"></i><b></b></span>
            <label class="f" style="width:78px"><input data-k="${base}.angle" value="${Math.round(g.angle)}" aria-label="Angle"><span class="unit">deg</span></label>
            <span class="quick">${[[0, '↑'], [90, '→'], [180, '↓'], [270, '←']].map(([a, s]) => `<button type="button" class="icon" data-act="angle:${a}" title="${a}°">${s}</button>`).join('')}</span>
          </div>`
        : `<div class="gline">
            ${seg('shape', ['circle', 'ellipse'], g.shape, ['Circle', 'Ellipse'])}
            <span style="color:var(--faint);font-size:10.5px">at</span>
            <span class="radial-at">${['left top', 'center top', 'right top', 'left center', 'center', 'right center', 'left bottom', 'center bottom', 'right bottom'].map((p) => `<button type="button" class="dot9" data-act="at:${p}" aria-pressed="${g.at === p}" title="${p}"></button>`).join('')}</span>
          </div>`;
      return `
        <div class="presets">${PRESETS.map((p, i) => `<button type="button" class="preset" data-act="preset:${i}" title="Use this gradient" style="background:${esc(gradCss({ ...p, stops: p.stops.map(([c, pp]) => ({ c, p: pp })) }))}"></button>`).join('')}</div>
        <div class="gline" style="margin-top:8px">${seg('kind', ['linear', 'radial'], g.kind, ['Linear', 'Radial'])}</div>
        <div style="margin-top:8px">${shape}</div>
        <div class="gbar" data-bar="${li}">
          <div class="gtrack" data-track="${li}" title="Click to add a stop"><i style="background:${esc(gradCss(g, true))}"></i></div>
          ${stops.map((s, k) => `<button type="button" class="stop ${ui.stop === k ? 'on' : ''}" data-stop="${li}:${k}" style="left:${s.p}%" aria-label="Stop ${k + 1}, ${esc(s.c)} at ${Math.round(s.p)}%"><i style="background:${esc(s.c)}"></i></button>`).join('')}
          <div class="scale">${[0, 25, 50, 75, 100].map((n) => `<span style="left:${n}%">${n}</span>`).join('')}</div>
        </div>
        <div class="stops">
          ${order.map((k) => `<div class="stoprow ${ui.stop === k ? 'on' : ''}" draggable="true" data-drag="stop:${li}:${k}">
              <span class="grip" title="Drag to reorder the colours">⠿</span>
              ${colorField(`${base}.stops.${k}.c`)}
              <label class="f"><input data-k="${base}.stops.${k}.p" value="${Math.round(stops[k].p)}" aria-label="Stop position"><span class="unit">%</span></label>
              <button type="button" class="icon danger" data-act="delstop:${k}" ${stops.length < 3 ? 'disabled style="opacity:.3"' : ''} title="Remove stop">×</button>
            </div>`).join('')}
        </div>`;
    }

    /** An image's source: a URL, or a local file (read here as a data URL; see the open question). */
    function imageSource(li) {
      const l = state.layers[li];
      return `<div class="drop" data-drop="${li}">
          <span class="thumb"><i style="background-image:url(&quot;${esc(l.url)}&quot;)"></i></span>
          <div class="meta">
            <label class="f"><input data-k="layers.${li}.url" value="${esc(l.url.startsWith('data:') ? '' : l.url)}" placeholder="${l.url.startsWith('data:') ? esc(l.name) + ' (local)' : 'https://…'}" aria-label="Image URL"></label>
            <div class="acts"><label class="btn">Upload…<input type="file" accept="image/*" data-file="${li}" hidden></label><span class="name" style="align-self:center">or drop a file</span></div>
          </div>
        </div>`;
    }

    /** Size, position, repeat, attachment, blend; origin and clip on request. */
    function placement(li, { box = true, pos = true, canvas = false } = {}) {
      const l = state.layers[li];
      const k = (p) => `layers.${li}.${p}`;
      const custom = !['auto', 'cover', 'contain'].includes(l.size);
      return `
        <div class="row"><span class="name">size</span>${seg('size', ['auto', 'cover', 'contain', 'custom'], custom ? 'custom' : l.size, ['Auto', 'Cover', 'Contain', 'Set'])}</div>
        ${custom ? `<div class="row"><span></span><label class="f"><input data-k="${k('size')}" value="${esc(l.size)}" aria-label="Size"></label></div>` : ''}
        ${pos ? `<div class="row"><span class="name">position</span><div class="posline">
            <span class="pos9">${['left top', 'center top', 'right top', 'left center', 'center', 'right center', 'left bottom', 'center bottom', 'right bottom'].map((p) => `<button type="button" data-act="pos:${p}" aria-pressed="${l.position === p}" title="${p}"></button>`).join('')}</span>
            <label class="f"><input data-k="${k('position')}" value="${esc(l.position)}" aria-label="Position"></label></div></div>` : ''}
        <div class="row"><span class="name">repeat</span>${select(k('repeat'), ['repeat', 'no-repeat', 'repeat-x', 'repeat-y', 'space', 'round'])}</div>
        <div class="row"><span class="name">blend</span>${select(k('blend'), ['normal', 'multiply', 'screen', 'overlay', 'darken', 'lighten', 'color-dodge', 'soft-light', 'difference', 'luminosity'])}</div>
        ${box ? `<details class="more" ${['attachment', 'origin', ...(canvas ? [] : ['clip'])].some((p) => !isDefault(l, p)) ? 'open' : ''}><summary>More: attachment, origin${canvas ? '' : ', clip'}</summary>
          <div class="row"><span class="name">attachment</span>${select(k('attachment'), ['scroll', 'fixed', 'local'])}</div>
          <div class="row"><span class="name">origin</span>${select(k('origin'), ['padding-box', 'border-box', 'content-box'])}</div>
          ${canvas ? '' : `<div class="row"><span class="name">clip</span>${select(k('clip'), ['border-box', 'padding-box', 'content-box', 'text'])}</div>`}
        </details>` : ''}`;
    }

    const rawRows = () => `<div class="rows">${shorthandCss(true).map(([p, v]) => `<div class="rawrow"><span class="p">${p}</span><span class="v" title="${esc(v)}">${esc(v.replace(/\s+/g, ' '))}</span></div>`).join('')}</div>`;
    const fillEditor = (li) => (state.layers[li].type === 'gradient' ? gradientEditor(li) : state.layers[li].type === 'image' ? imageSource(li) : `<div class="row"><span class="name">colour</span>${colorField(`layers.${li}.c`)}</div>`);

    // ================================================================ D: the position canvas
    const NINE = ['left top', 'center top', 'right top', 'left center', 'center', 'right center', 'left bottom', 'center bottom', 'right bottom'];
    const AT = { left: 0, top: 0, center: 50, right: 100, bottom: 100 };
    /** A position as x% y% in its box, for the marker. Lengths and calc() are not placed: shown at the centre. */
    function posXY(position) {
      const pct = /^(-?\d+(?:\.\d+)?)% (-?\d+(?:\.\d+)?)%$/.exec(position);
      if (pct) return [parseFloat(pct[1]), parseFloat(pct[2])];
      const [a, b = 'center'] = position.trim().split(/\s+/);
      if (a === 'top' || a === 'bottom' || b === 'left' || b === 'right') return [AT[b] ?? 50, AT[a] ?? 50];
      return [AT[a] ?? 50, AT[b] ?? 50];
    }
    // The element's mini copy: a 12px border and 14px padding, so each box has its own inset.
    const INSET = { 'border-box': -12, 'padding-box': 0, 'content-box': 14 };
    function positionCanvas(li) {
      const l = state.layers[li];
      const [x, y] = posXY(l.position);
      const bg = shorthandCss(false).map(([p, v]) => `${p}:${v}`).join(';');
      const box = (b) => `inset:${INSET[b]}px`;
      return `
        <div class="pc">
          <div class="mini" style="${esc(bg)}">
            <span class="clipline" style="${box(l.clip === 'text' ? 'border-box' : l.clip)}"></span>
            <div class="obox" data-canvas="${li}" style="${box(l.origin)}" title="Click or drag to place this layer; near a dot it snaps (Alt places freely)">
              ${NINE.map((k) => { const [dx, dy] = posXY(k); return `<span class="snapdot ${l.position === k ? 'on' : ''}" style="left:${dx}%;top:${dy}%"></span>`; }).join('')}
              <span class="focal ${NINE.includes(l.position) ? 'snapped' : ''}" style="left:${x}%;top:${y}%"></span>
            </div>
          </div>
          <div class="pcbar">
            <label class="f"><span class="lbl">position</span><input data-k="layers.${li}.position" value="${esc(l.position)}" aria-label="Position"></label>
            <span style="font:10px var(--mono);color:var(--faint)">in ${l.origin.replace('-box', '')} box</span>
          </div>
          <div class="boxseg"><span>clip</span><div class="seg">${['border-box', 'padding-box', 'content-box'].map((b) => `<button type="button" data-act="clip:${b}" aria-pressed="${l.clip === b}" title="Paint into the ${b}"><span class="nest ${b}"></span>${b.replace('-box', '')}</button>`).join('')}</div></div>
        </div>`;
    }

    function renderD() {
      return renderA({ canvas: true });
    }

    // ================================================================ A: layer stack
    function renderA({ canvas = false } = {}) {
      const l = sel();
      return `
        <div class="layers">
          ${state.layers.map((one, i) => `<div class="layer ${i === ui.sel ? 'on' : ''} ${one.visible ? '' : 'off'}" draggable="true" data-drag="layer:${i}" data-act="sel:${i}">
              <span class="grip">⠿</span>
              <span class="thumb26"><i style="${thumbCss(one)}"></i></span>
              <span class="ln"><b>${layerName(one)}</b><span>${esc(layerSub(one))}${one.blend !== 'normal' ? ` · ${one.blend}` : ''}</span></span>
              <span class="acts">
                <button type="button" class="icon" data-act="eye:${i}" title="${one.visible ? 'Hide' : 'Show'}" aria-pressed="${!one.visible}">${one.visible ? '◉' : '○'}</button>
                <button type="button" class="icon danger" data-act="dellayer:${i}" title="Remove layer">×</button>
              </span>
            </div>`).join('')}
          <div class="layer base">
            <span></span>
            <span class="thumb26"><i style="background:${esc(state.color)}"></i></span>
            <span class="ln" style="grid-template-columns:auto 1fr;align-items:center;gap:8px"><b>Colour</b>${colorField('color')}</span>
          </div>
        </div>
        <div class="addbar">
          <button type="button" class="btn primary" data-act="add:gradient">+ Gradient</button>
          <button type="button" class="btn primary" data-act="add:image">+ Image</button>
          <button type="button" class="btn" data-act="add:solid">+ Solid</button>
        </div>
        ${l ? `<div class="detail">
          <div class="dh">${layerName(l)}${l.type !== 'image' ? seg('type', ['gradient', 'solid'], l.type, ['Gradient', 'Solid']) : ''}</div>
          ${fillEditor(ui.sel)}
          <div class="group-h">Placement</div>
          ${canvas ? positionCanvas(ui.sel) + '<div style="height:8px"></div>' : ''}
          ${placement(ui.sel, { pos: !canvas, canvas })}
        </div>` : ''}
        ${rawRows()}
        <p class="tip">Top layer first. The colour is always underneath. Everything is written as one background.</p>`;
    }

    // ================================================================ B: canvas
    function renderB() {
      const l = sel();
      const focal = (() => {
        if (!l) return null;
        const m = /^(\d+(?:\.\d+)?)% (\d+(?:\.\d+)?)%$/.exec(l.position);
        const kw = { left: 0, top: 0, center: 50, right: 100, bottom: 100 };
        if (m) return [parseFloat(m[1]), parseFloat(m[2])];
        const [a, b = 'center'] = l.position.split(' ');
        let x = kw[a] ?? 50, y = kw[b] ?? 50;
        if (a === 'top' || a === 'bottom') [x, y] = [kw[b] ?? 50, kw[a]];
        return [x, y];
      })();
      const bg = [...shorthandCss(false)].map(([p, v]) => `${p}:${v}`).join(';');
      return `
        <div class="canvas-wrap">
          ${l ? ['border-box', 'padding-box', 'content-box'].map((box, i) => `<button type="button" class="ring ${'bpc'[i]}" data-act="clip:${box}" aria-pressed="${l.clip === box}" title="Paint into the ${box}">${box.replace('-box', '')}</button>`).join('') : ''}
          <div class="mini" data-canvas style="${esc(bg)}">
            <span class="content"></span>
            ${l && l.type !== 'solid' ? `<span class="focal" data-focal style="left:${focal[0]}%;top:${focal[1]}%" title="Drag to place this layer"></span>` : ''}
          </div>
          <div class="canvas-note"><span>${l ? `position ${esc(l.position)}` : ''}</span><span>${l ? `clip ${l.clip} · origin ${l.origin}` : ''}</span></div>
        </div>
        <div class="chips">
          ${state.layers.map((one, i) => `<button type="button" class="chip ${i === ui.sel ? 'on' : ''} ${one.visible ? '' : 'off'}" draggable="true" data-drag="layer:${i}" data-act="sel:${i}">
              <span class="thumb20"><i style="${thumbCss(one)}"></i></span>${layerName(one).replace(' gradient', '')}<span class="n">${i + 1}</span></button>`).join('')}
          <span class="chip" style="cursor:default"><span class="thumb20"><i style="background:${esc(state.color)}"></i></span>Colour</span>
          <button type="button" class="chip" data-act="add:gradient" title="Add a gradient">+ Gradient</button>
          <button type="button" class="chip" data-act="add:image" title="Add an image">+ Image</button>
        </div>
        <div class="sheet">
          <div class="row"><span class="name">colour</span>${colorField('color')}</div>
          ${l ? `<div class="sh">${layerName(l)} <span style="color:var(--faint);font-weight:400">layer ${ui.sel + 1}</span>
              <span class="acts"><button type="button" class="icon" data-act="eye:${ui.sel}" title="${l.visible ? 'Hide' : 'Show'}">${l.visible ? '◉' : '○'}</button><button type="button" class="icon danger" data-act="dellayer:${ui.sel}" title="Remove layer">×</button></span></div>
            ${fillEditor(ui.sel)}
            <div class="group-h">Placement</div>
            ${placement(ui.sel, { box: false, pos: false })}
            <div class="row"><span class="name">attachment</span>${select(`layers.${ui.sel}.attachment`, ['scroll', 'fixed', 'local'])}</div>
            <div class="row"><span class="name">origin</span>${select(`layers.${ui.sel}.origin`, ['padding-box', 'border-box', 'content-box'])}</div>` : ''}
        </div>
        ${rawRows()}
        <p class="tip">The box is the element. Drag the point to place a layer; click a ring to paint into it.</p>`;
    }

    // ================================================================ C: fill field + popover
    function renderC() {
      const l = sel();
      const composite = shorthandCss(false).find(([p]) => p === 'background')[1];
      const longs = longhandCss(true);
      const allProps = ['background-color', 'background-image', 'background-position', 'background-size', 'background-repeat', 'background-attachment', 'background-origin', 'background-clip', 'background-blend-mode'];
      const typeTabs = l ? seg('type', ['solid', 'gradient', 'image'], l.type, ['Solid', 'Gradient', 'Image']) : '';
      return `
        <div class="row"><span class="name" style="font-family:var(--mono)">background</span>
          <button type="button" class="fill ${ui.pop ? 'open' : ''}" data-act="pop">
            <span class="big"><i style="background:${esc(composite)}"></i></span>
            <span class="txt">${esc(shown().length ? shown().map((x) => layerName(x).toLowerCase()).join(' + ') + ' + colour' : state.color)}</span>
            <span class="count">${state.layers.length + 1}</span>
          </button>
        </div>
        ${ui.pop ? `<div class="pop">
          <div class="pager">
            <span class="dots">${state.layers.map((one, i) => `<button type="button" draggable="true" data-drag="layer:${i}" data-act="sel:${i}" aria-pressed="${i === ui.sel}" title="Layer ${i + 1}: ${layerName(one)}"><i style="${thumbCss(one)}"></i></button>`).join('')}</span>
            <button type="button" class="icon" data-act="add:gradient" title="Add a layer on top">+</button>
            ${l ? `<button type="button" class="icon" data-act="eye:${ui.sel}" title="${l.visible ? 'Hide' : 'Show'}">${l.visible ? '◉' : '○'}</button><button type="button" class="icon danger" data-act="dellayer:${ui.sel}" title="Remove layer">×</button>` : ''}
            <span class="lbl">${l ? `layer ${ui.sel + 1} of ${state.layers.length}` : 'no layers'}</span>
          </div>
          ${l ? `<div class="typetabs">${typeTabs}</div>${fillEditor(ui.sel)}
            <details class="more"><summary>Placement: size ${esc(l.size)}, ${esc(l.position)}, ${l.repeat}</summary>${placement(ui.sel)}</details>` : ''}
          <div class="group-h">Base colour</div>
          ${colorField('color')}
        </div>` : ''}
        <div class="group-h" style="margin-top:14px">Longhands</div>
        ${allProps.map((p) => {
          const hit = longs.find(([q]) => q === p);
          return `<div class="crow ${hit ? '' : 'unset'}"><span class="p">${p.replace('background-', 'bg-')}</span><label class="f"><input value="${esc(hit ? hit[1].replace(/\s+/g, ' ') : '')}" placeholder="${p === 'background-size' ? 'auto' : p === 'background-repeat' ? 'repeat' : ''}" readonly aria-label="${p}"></label>${hit ? '<button type="button" class="icon danger" title="Remove">×</button>' : '<span></span>'}</div>`;
        }).join('')}
        <p class="tip">The field writes one background; the rows are the same value read as longhands.</p>`;
    }

    // ================================================================ wiring
    const editor = document.getElementById('editor');
    function renderPage() {
      const decls = shorthandCss(false);
      const target = document.getElementById('target');
      target.style.cssText = '';
      for (const [p, v] of decls) target.style.setProperty(p, v);
      const fmt = (title, list) => `<span class="c">/* ${title} */</span>\n` + list.map(([p, v]) => `<b>${p}</b>: ${esc(v)};`).join('\n');
      document.getElementById('out-short').innerHTML = fmt('written: the shorthand', shorthandCss(true));
      document.getElementById('out-long').innerHTML = fmt('the same, as longhands', longhandCss(true));
      document.getElementById('about').textContent = `${variant} — ${VARIANTS[variant].about}`;
      document.getElementById('label').textContent = `${variant} — ${VARIANTS[variant].name}`;
    }
    function render() {
      const scroll = editor.parentElement.scrollTop;
      const open = [...editor.querySelectorAll('details')].map((d) => d.open);
      editor.innerHTML = { A: () => renderA(), B: renderB, C: renderC, D: renderD }[variant]();
      editor.querySelectorAll('details').forEach((d, i) => { if (open[i]) d.open = true; });
      editor.parentElement.scrollTop = scroll;
      renderPage();
    }

    // Typing paints the page; leaving the field, or a picker or select, redraws the editor too.
    editor.addEventListener('input', (e) => {
      const k = e.target.dataset.k;
      if (!k || e.target.readOnly) return;
      set(k, e.target.value);
      if (e.target.type === 'color' || e.target.tagName === 'SELECT') render(); else renderPage();
    });
    editor.addEventListener('change', (e) => {
      if (e.target.dataset.k) render();
      const li = e.target.dataset.file;
      if (li !== undefined && e.target.files[0]) readFile(+li, e.target.files[0]);
    });
    function readFile(li, file) {
      const reader = new FileReader();
      reader.onload = () => { Object.assign(state.layers[li], { url: reader.result, name: file.name }); render(); };
      reader.readAsDataURL(file);
    }

    editor.addEventListener('click', (e) => {
      if (e.target.closest('input, select, label.f')) return;
      const el = e.target.closest('[data-act]');
      if (!el) return;
      const [verb, ...rest] = el.dataset.act.split(':');
      const arg = rest.join(':');
      const l = sel();
      switch (verb) {
        case 'sel': ui.sel = +arg; ui.stop = 0; break;
        case 'eye': state.layers[+arg].visible = !state.layers[+arg].visible; e.stopPropagation(); break;
        case 'dellayer': state.layers.splice(+arg, 1); ui.sel = clamp(ui.sel, 0, state.layers.length - 1); e.stopPropagation(); break;
        case 'add': {
          const layer = arg === 'image' ? imageLayer(DOTS, 'dots.svg')
            : arg === 'solid' ? solidLayer('#ffffff33')
            : gradientLayer({ kind: 'linear', angle: 180, shape: 'ellipse', at: 'center', stops: [{ c: '#00000000', p: 0 }, { c: '#000000aa', p: 100 }] });
          state.layers.unshift(layer); ui.sel = 0; ui.stop = 0; break;
        }
        case 'type':
          if (arg === 'gradient' && l.type !== 'gradient') Object.assign(l, { type: 'gradient', g: l.g || { kind: 'linear', angle: 180, shape: 'ellipse', at: 'center', stops: [{ c: l.c || '#6366f1', p: 0 }, { c: '#ec4899', p: 100 }] } });
          else if (arg === 'solid') Object.assign(l, { type: 'solid', c: l.c || l.g?.stops[0].c || '#6366f1' });
          else if (arg === 'image') Object.assign(l, { type: 'image', url: l.url || DOTS, name: l.name || 'dots.svg', size: 'cover', position: 'center', repeat: 'no-repeat' });
          break;
        case 'kind': l.g.kind = arg; break;
        case 'shape': l.g.shape = arg; break;
        case 'at': l.g.at = arg; break;
        case 'angle': l.g.angle = +arg; break;
        case 'preset': {
          const p = PRESETS[+arg];
          l.g = { kind: p.kind, angle: p.angle ?? 180, shape: p.shape ?? 'ellipse', at: p.at ?? 'center', stops: p.stops.map(([c, pp]) => ({ c, p: pp })) };
          ui.stop = 0; break;
        }
        case 'delstop': if (l.g.stops.length > 2) { l.g.stops.splice(+arg, 1); ui.stop = 0; } break;
        case 'size': l.size = arg === 'custom' ? '50% auto' : arg; break;
        case 'pos': l.position = arg; break;
        case 'clip': l.clip = arg; break;
        case 'pop': ui.pop = !ui.pop; break;
        default: return;
      }
      render();
    });

    // ---------------------------------------------------------------- pointer drags: stops, dial, focal point
    let drag = null;
    editor.addEventListener('pointerdown', (e) => {
      const stop = e.target.closest('[data-stop]');
      const dial = e.target.closest('[data-dial]');
      const focal = e.target.closest('[data-focal]');
      const canvasBox = e.target.closest('[data-canvas]');
      const track = e.target.closest('[data-track]');
      if (stop) {
        const [li, k] = stop.dataset.stop.split(':').map(Number);
        drag = { kind: 'stop', li, stop: state.layers[li].g.stops[k], x0: e.clientX, moved: false, bar: stop.parentElement.querySelector('.gtrack').getBoundingClientRect() };
        ui.stop = k;
      } else if (dial) {
        drag = { kind: 'dial', li: +dial.dataset.dial, rect: dial.getBoundingClientRect() };
        moveDial(e);
      } else if (canvasBox) {
        drag = { kind: 'place', li: +canvasBox.dataset.canvas, rect: canvasBox.getBoundingClientRect() };
        place(e);
      } else if (focal) {
        drag = { kind: 'focal', rect: focal.parentElement.getBoundingClientRect() };
      } else if (track) {
        // A click on the bar adds a stop there, coloured as the gradient is at that point.
        const li = +track.dataset.track;
        const g = state.layers[li].g;
        const r = track.getBoundingClientRect();
        const p = clamp(Math.round(((e.clientX - r.left) / r.width) * 100), 0, 100);
        const sorted = [...g.stops].sort((a, b) => a.p - b.p);
        const right = sorted.find((s) => s.p >= p) ?? sorted[sorted.length - 1];
        const left = [...sorted].reverse().find((s) => s.p <= p) ?? sorted[0];
        const t = right.p === left.p ? 0 : (p - left.p) / (right.p - left.p);
        g.stops.push({ c: mix(left.c, right.c, t), p });
        ui.stop = g.stops.length - 1;
        render();
        return;
      } else return;
      e.preventDefault();
    });
    /**
     * Where a click or drag on the canvas puts the layer. Within 12px of one of the nine dots it is
     * that keyword, which is what most positions are; elsewhere, or with Alt held, x% y%.
     */
    function place(e) {
      const r = drag.rect;
      const px = e.clientX - r.left, py = e.clientY - r.top;
      let best = null;
      if (!e.altKey) {
        for (const k of NINE) {
          const [dx, dy] = posXY(k);
          const d = Math.hypot(px - (dx / 100) * r.width, py - (dy / 100) * r.height);
          if (d <= 12 && (!best || d < best.d)) best = { k, d };
        }
      }
      state.layers[drag.li].position = best ? best.k
        : `${clamp(Math.round((px / r.width) * 100), 0, 100)}% ${clamp(Math.round((py / r.height) * 100), 0, 100)}%`;
      render();
    }
    function moveDial(e) {
      const r = drag.rect;
      let a = (Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180) / Math.PI + 90;
      a = (a + 360) % 360;
      if (e.shiftKey) a = Math.round(a / 15) * 15;
      state.layers[drag.li].g.angle = Math.round(a) % 360;
      render();
    }
    addEventListener('pointermove', (e) => {
      if (!drag) return;
      if (drag.kind === 'stop') {
        if (Math.abs(e.clientX - drag.x0) > 3) drag.moved = true;
        if (!drag.moved) return;
        // Moving past a neighbour reorders: the bar and the list are both sorted by position.
        drag.stop.p = clamp(Math.round(((e.clientX - drag.bar.left) / drag.bar.width) * 100), 0, 100);
        ui.stop = state.layers[drag.li].g.stops.indexOf(drag.stop);
        render();
      } else if (drag.kind === 'dial') moveDial(e);
      else if (drag.kind === 'place') place(e);
      else if (drag.kind === 'focal') {
        const x = clamp(Math.round(((e.clientX - drag.rect.left) / drag.rect.width) * 100), 0, 100);
        const y = clamp(Math.round(((e.clientY - drag.rect.top) / drag.rect.height) * 100), 0, 100);
        sel().position = `${x}% ${y}%`;
        render();
      }
    });
    addEventListener('pointerup', () => {
      if (drag?.kind === 'stop' && !drag.moved) {
        // A click, not a drag: open that stop's colour picker.
        const k = state.layers[drag.li].g.stops.indexOf(drag.stop);
        render();
        editor.querySelector(`input[type=color][data-k="layers.${drag.li}.g.stops.${k}.c"]`)?.click();
      }
      drag = null;
    });
    editor.addEventListener('keydown', (e) => {
      const stop = e.target.closest('[data-stop]');
      if (!stop) return;
      const [li, k] = stop.dataset.stop.split(':').map(Number);
      const s = state.layers[li].g.stops[k];
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { s.p = clamp(s.p + (e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 10 : 1), 0, 100); e.preventDefault(); e.stopPropagation(); }
      else if ((e.key === 'Delete' || e.key === 'Backspace') && state.layers[li].g.stops.length > 2) { state.layers[li].g.stops.splice(k, 1); ui.stop = 0; }
      else return;
      render();
      editor.querySelector(`[data-stop="${li}:${Math.min(k, state.layers[li].g.stops.length - 1)}"]`)?.focus();
    });

    // ---------------------------------------------------------------- drag-and-drop lists: layers, stop colours, files
    let dnd = null;
    editor.addEventListener('dragstart', (e) => {
      const el = e.target.closest('[data-drag]');
      if (!el) return;
      dnd = el.dataset.drag.split(':');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', el.dataset.drag);
    });
    editor.addEventListener('dragover', (e) => {
      const drop = e.target.closest('[data-drop]');
      if (drop && e.dataTransfer.types.includes('Files')) { e.preventDefault(); drop.classList.add('over'); return; }
      const el = e.target.closest('[data-drag]');
      if (!dnd || !el || el.dataset.drag.split(':')[0] !== dnd[0]) return;
      e.preventDefault();
      editor.querySelectorAll('.over').forEach((x) => x.classList.remove('over'));
      el.classList.add('over');
    });
    editor.addEventListener('dragleave', (e) => e.target.closest?.('[data-drop]')?.classList.remove('over'));
    editor.addEventListener('drop', (e) => {
      const drop = e.target.closest('[data-drop]');
      if (drop && e.dataTransfer.files[0]) { e.preventDefault(); readFile(+drop.dataset.drop, e.dataTransfer.files[0]); return; }
      const el = e.target.closest('[data-drag]');
      if (!dnd || !el) return;
      e.preventDefault();
      const to = el.dataset.drag.split(':');
      if (dnd[0] === 'layer') {
        const [moved] = state.layers.splice(+dnd[1], 1);
        state.layers.splice(+to[1], 0, moved);
        ui.sel = +to[1];
      } else if (dnd[0] === 'stop' && dnd[1] === to[1]) {
        // Reordering the list moves the colour; the positions stay where they are on the bar.
        const g = state.layers[+dnd[1]].g;
        const order = g.stops.map((s, k) => k).sort((a, b) => g.stops[a].p - g.stops[b].p);
        const colours = order.map((k) => g.stops[k].c);
        const from = order.indexOf(+dnd[2]), at = order.indexOf(+to[2]);
        const [c] = colours.splice(from, 1);
        colours.splice(at, 0, c);
        order.forEach((k, i) => { g.stops[k].c = colours[i]; });
        ui.stop = order[at];
      }
      dnd = null;
      render();
    });
    editor.addEventListener('dragend', () => { dnd = null; editor.querySelectorAll('.over').forEach((x) => x.classList.remove('over')); });

    // ---------------------------------------------------------------- variant switcher
    const keys = Object.keys(VARIANTS);
    function go(step) {
      variant = keys[(keys.indexOf(variant) + step + keys.length) % keys.length];
      const url = new URL(location.href);
      url.searchParams.set('variant', variant);
      history.replaceState(null, '', url);
      render();
    }
    document.getElementById('prev').onclick = () => go(-1);
    document.getElementById('next').onclick = () => go(1);
    addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea, select, [contenteditable], [data-stop]')) return;
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });
    render();
  </script>
</body>

</html>
